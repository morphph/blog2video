                              - heading "A whole new world" [level=2] [ref=e699]:
                                - generic [ref=e701]: A whole new world
                              - generic [ref=e704]: Workflows are a helpful new way to extend Claude Code. I encourage you to think of this as a starting point, there's still much to discover in how to use them best. Let us know what you find.
