                                - /url: /trq212/article/2061907337154367865/media/2061857370310094848
                                - generic "Image" [ref=e675]:
                                  - img "Image" [ref=e677]
                              - generic [ref=e679]:
                                - generic [ref=e680]: To share them via a skill, put your JavaScript workflow files in the skill and folder and reference them in the
                                - link "SKILL.MD" [ref=e682] [cursor=pointer]:
                                  - /url: http://skill.md/
                                  - generic [ref=e683]: SKILL.MD
                                - generic [ref=e684]: . To allow for more flexibility, you may want to prompt Claude to think of the workflows in the skill as a template instead of a script that needs to be run verbatim.
                              - link "Image" [ref=e691] [cursor=pointer]:
