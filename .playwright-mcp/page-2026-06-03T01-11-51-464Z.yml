                                  - generic [ref=e244]: Code Review
                                - generic [ref=e245]: .
                              - generic [ref=e248]: Workflows allow you to dynamically create harnesses that enable Claude to solve all of those problems and more natively inside of Claude Code. You can also share and re-use these workflows with others.
                              - generic [ref=e251]: In this article, I’ll cover my initial workflows experiences and learnings so you can take full advantage.
                              - generic [ref=e253]:
                                - generic [ref=e254]: That said, best practices are still developing! Dynamic workflows often use more tokens, so think carefully about when and how to use them.
                                - generic [ref=e255]: Note
                                - generic [ref=e256]: ": this post is also"
                                - link "available on the Claude Blog" [ref=e258] [cursor=pointer]:
                                  - /url: https://claude.com/blog/a-harness-for-every-task-dynamic-workflows-in-claude-code
                                  - generic [ref=e259]: available on the Claude Blog
                              - heading "Example prompts" [level=2] [ref=e261]:
                                - generic [ref=e263]: Example prompts
                              - generic [ref=e266]: "Before diving into the technical details, I’d like to start with some example prompts to get you thinking about the possibilities with workflows:"
                              - list [ref=e267]:
                                - listitem [ref=e268]:
                                  - generic [ref=e270]: "\"This test fails maybe 1 in 50 runs. Set up a workflow to reproduce it, form theories and adversarially test them in worktrees /goal don't stop until one theory works.\""
                                - listitem [ref=e271]:
                                  - generic [ref=e273]: "\"Using a workflow, go through my last 50 sessions and mine them for corrections I keep making and turn the recurring ones into CLAUDE.md rules\""
                                - listitem [ref=e274]:
                                  - generic [ref=e275]:
                                    - generic [ref=e276]: “Use a workflow to dig through
                                    - link "#incidents" [ref=e278] [cursor=pointer]:
                                      - /url: https://x.com/search?q=%23incidents&src=hashtag_click
                                      - generic [ref=e279]: "#incidents"
                                    - generic [ref=e280]: in Slack for the past six months and find recurring root causes where nobody has filed a ticket."
                                - listitem [ref=e281]:
                                  - generic [ref=e283]: "\"Take my business plan and run a workflow where different agents tear it apart from an investor's, a customer's, and a competitor's perspective.\""
                                - listitem [ref=e284]:
                                  - generic [ref=e286]: "\"Here's a folder of 80 resumes, use a workflow to rank them for the backend role and double-check the top ten. Interview me using the AskUserQuestion tool for a rubric.\""
                                - listitem [ref=e287]:
                                  - generic [ref=e289]: "\"I need a name for this CLI tool. Use a workflow to brainstorm a bunch of options and run a tournament to pick the top 3.\""
                                - listitem [ref=e290]:
                                  - generic [ref=e292]: "\"Use a workflow to rename our User model to Account everywhere.\""
                                - listitem [ref=e293]:
                                  - generic [ref=e295]: “Go through my blog post draft and using a workflow verify every technical claim against the codebase, I don't want to ship anything wrong."
                              - heading "How dynamic workflows work" [level=2] [ref=e297]:
                                - generic [ref=e299]: How dynamic workflows work
                              - generic [ref=e301]:
                                - generic [ref=e302]: Dynamic workflows execute a javascript file with a few special functions that help spawn and coordinate
                                - link "subagents" [ref=e304] [cursor=pointer]:
                                  - /url: https://code.claude.com/docs/en/sub-agents
                                  - generic [ref=e305]: subagents
                                - generic [ref=e306]: ":"
                              - link "Image" [ref=e313] [cursor=pointer]:
                                - /url: /trq212/article/2061907337154367865/media/2061854734441725952
                                - generic "Image" [ref=e317]:
                                  - img "Image" [ref=e319]
                              - generic [ref=e322]: Dynamic workflows also include standard JavaScript functions like JSON, Math, and Array, to help process data.
                              - generic [ref=e325]: It’s particularly useful to know that dynamic workflows can decide which models an agent uses and whether subagents are run in their own worktree, allowing Claude to choose the intelligence level and isolation needed.
                              - generic [ref=e328]: If a workflow is interrupted, for example by user action or quitting the terminal, resuming the session will allow the workflow to pick up where it left off.
                              - heading "Why dynamic workflows" [level=2] [ref=e330]:
                                - generic [ref=e332]: Why dynamic workflows
                              - generic [ref=e335]: When you ask the default Claude Code harness to do a task, it needs to both plan and execute in the same context window. For many coding tasks, this is highly effective, but it can sometimes break down over long-running, massively parallel and/or highly structured adversarial tasks.
                              - generic [ref=e338]: "This is because the longer Claude works on a complex task in a single context window, the more it becomes susceptible to a few specific failure modes:"
                              - list [ref=e339]:
                                - listitem [ref=e340]:
                                  - generic [ref=e341]:
                                    - generic [ref=e342]: Agentic laziness
                                    - generic [ref=e343]: refers to when Claude stops before finishing a particularly complex, multi-part task and declares the job done after partial progress, for example addressing 20 of the 50 items in a security review.
                                - listitem [ref=e344]:
                                  - generic [ref=e345]:
                                    - generic [ref=e346]: Self-preferential bias
                                    - generic [ref=e347]: refers to Claude’s tendency to prefer its own results or findings, especially when asked to verify or judge them against a rubric.
                                - listitem [ref=e348]:
                                  - generic [ref=e349]:
                                    - generic [ref=e350]: Goal drift
                                    - generic [ref=e351]: refers to the gradual loss of fidelity to the original objective across many turns, especially after compaction. Each summarization step is lossy, and details like edge-case requirements or "don't do X" constraints can get lost.
                              - generic [ref=e354]: Creating a workflow helps combat these by orchestrating separate Claudes with their own context windows and focused, isolated goals.
                              - heading "Dynamic vs static workflows" [level=2] [ref=e356]:
                                - generic [ref=e358]: Dynamic vs static workflows
                              - generic [ref=e361]: You may have previously created a static workflow using the Claude Agent SDK or claude -p to coordinate multiple instances of Claude Code together.
                              - generic [ref=e363]:
                                - generic [ref=e364]: But because static workflows need to work for all edge cases, they are usually more generic. With
                                - link "Claude Opus 4.8" [ref=e366] [cursor=pointer]:
                                  - /url: https://www.anthropic.com/news/claude-opus-4-8
                                  - generic [ref=e367]: Claude Opus 4.8
                                - generic [ref=e368]: and dynamic workflows, Claude is now intelligent enough to write a custom harness tailor-made for your use case.
                              - link "Image" [ref=e375] [cursor=pointer]:
                                - /url: /trq212/article/2061907337154367865/media/2061878367687954432
                                - generic "Image" [ref=e379]:
                                  - img "Image" [ref=e381]
                              - heading "Helpful patterns when using dynamic workflows" [level=1] [ref=e383]:
                                - generic [ref=e385]: Helpful patterns when using dynamic workflows
                              - generic [ref=e388]: You can start using dynamic workflows just by asking Claude to make one, or by using the trigger word “ultracode” to ensure that Claude Code creates a workflow.
                              - generic [ref=e391]: But building a mental model for how dynamic workflows work will help you understand when to use them and how you might nudge Claude via prompts.
                              - generic [ref=e394]: "There are a few common patterns that Claude might use and compose together when building workflows:"
                              - link "Image" [ref=e401] [cursor=pointer]:
                                - /url: /trq212/article/2061907337154367865/media/2061855878886928384
                                - generic "Image" [ref=e405]:
                                  - img "Image" [ref=e407]
                              - generic [ref=e410]: Classify-and-act
                              - generic [ref=e413]: Use a classifier agent to decide on the type of task, and then route to different agents or behavior based on the task. Or, use a classifier at the end to determine output.
                              - generic [ref=e416]: Fan-out-and-synthesize
                              - generic [ref=e419]: Split up a task into many smaller steps, run an agent on each step and then synthesize those results. This is particularly useful for when there are a large number of smaller steps, or when each step benefits from its own clean context window so they don't interfere or cross-contaminate. The synthesize step is a barrier—it waits for all the fan-out agents, then merges their structured outputs into one result.
                              - generic [ref=e422]: Adversarial verification
                              - generic [ref=e425]: For each spawned agent, run a separate spawned agent to adversarially verify its output against a rubric or criteria.
                              - generic [ref=e428]: Generate-and-filter
                              - generic [ref=e431]: Generate a number of ideas on a topic and then filter them by a rubric or by verification, dedupe duplicates and return only the highest quality, tested ideas.
                              - generic [ref=e434]: Tournament
                              - generic [ref=e437]: Instead of dividing the work, have agents compete on it. Spawn N agents that each attempt the same task using different approaches. Prompts or models then judge the results in a pairwise fashion using a judging agent until you have a winner.
                              - generic [ref=e440]: Loop until done
                              - generic [ref=e443]: For tasks with an unknown amount of work, loop spawning agents until a stop condition is met (no new findings, or no more errors in the logs) instead of a fixed number of passes.
                              - heading "Use cases" [level=1] [ref=e445]:
                                - generic [ref=e447]: Use cases
                              - generic [ref=e450]: Think creatively of when and how to ask Claude Code to make dynamic workflows. I’ve found that workflows are sometimes even more useful for non-technical work.
                              - link "Image" [ref=e457] [cursor=pointer]:
                                - /url: /trq212/article/2061907337154367865/media/2061863516173463552
                                - generic "Image" [ref=e461]:
                                  - img "Image" [ref=e463]
                              - heading "Migrations and refactors" [level=2] [ref=e465]:
                                - generic [ref=e467]: Migrations and refactors
                              - generic [ref=e469]:
                                - link "Bun" [ref=e471] [cursor=pointer]:
                                  - /url: https://bun.com/
                                  - generic [ref=e472]: Bun
                                - generic [ref=e473]: was rewritten from Zig to Rust using workflows. You can read more about how that was done in
                                - link "Jarred’s X thread" [ref=e475] [cursor=pointer]:
                                  - /url: https://x.com/jarredsumner/status/2060050578026189172
                                  - generic [ref=e476]: Jarred’s X thread
                                - generic [ref=e477]: .
                              - generic [ref=e480]: The key is to break down the task into a series of steps that need to be operated on for example callsites, failing tests, modules, etc. Spin off a subagent for every fix in a worktree to make the fix, then have another agent adversarially review, and merge them. Consider telling the agent not to use resource intensive commands so that you can maximally parallelize without running out of resources on your machine.
                              - heading "Deep research" [level=2] [ref=e482]:
                                - generic [ref=e484]: Deep research
                              - generic [ref=e487]: We published a deep research skill (/deep-research) inside Claude Code that uses dynamic workflows. Specifically, it fans-out web searches, fetches sources, adversarially verifies their claims, and synthesizes a cited report.
                              - generic [ref=e490]: But you may do this sort of research for more than just web searches. For example, asking Claude to compile a status report from context in Slack or to research how a feature works by exploring a codebase in-depth.
                              - heading "Deep verification" [level=2] [ref=e492]:
                                - generic [ref=e494]: Deep verification
                              - link "Image" [ref=e501] [cursor=pointer]:
                                - /url: /trq212/article/2061907337154367865/media/2061856090279800832
                                - generic "Image" [ref=e505]:
                                  - img "Image" [ref=e507]
                              - generic [ref=e510]: On the other hand, if you have a report where you want to check and source every factual claim that it references you may want to generate a workflow which has one agent identify all of the factual claims and then spin off a subagent to check each one in-detail. You could also have a verification agent check the source subagent to make sure its source is high quality.
                              - heading "Sorting" [level=2] [ref=e512]:
                                - generic [ref=e514]: Sorting
                              - link "Image" [ref=e521] [cursor=pointer]:
                                - /url: /trq212/article/2061907337154367865/media/2061856981523312640
                                - generic "Image" [ref=e525]:
                                  - img "Image" [ref=e527]
                              - generic [ref=e530]: "You may have a list of items that you want to sort by some qualitative measurement that you believe that Claude Code is good at evaluating, for example: support tickets sorted by severity of the bug. But if you try to sort 1000+ rows in one prompt, quality degrades and it won't fit in context. Instead run a tournament, a pipeline of pairwise-comparison agents (comparative judgment is more reliable than absolute scoring), or bucket-rank in parallel then merge. Each comparison is its own agent, so the deterministic loop holds the bracket and only the running order stays in context."
                              - heading "Memory and rule adherence" [level=2] [ref=e532]:
                                - generic [ref=e534]: Memory and rule adherence
                              - link "Image" [ref=e541] [cursor=pointer]:
                                - /url: /trq212/article/2061907337154367865/media/2061857082945728512
                                - generic "Image" [ref=e545]:
                                  - img "Image" [ref=e547]
                              - generic [ref=e550]: If you have a particular set of rules that you find Claude misses or struggles with, even when put into the CLAUDE.mds, create a workflow with a list of rules that must be checked by verifier agents—one verifier per rule. Creating a skeptic persona subagent to review the rules to make sure they are in line will help avoid too many false positives.
                              - generic [ref=e552]:
                                - generic [ref=e553]: "The reverse direction works too: mine your recent sessions and code review comments for corrections you keep making, cluster them with parallel agents, adversarially verify each candidate (would this rule have prevented a real mistake?), and then distill the survivors back into a"
                                - link "CLAUDE.md" [ref=e555] [cursor=pointer]:
                                  - /url: http://claude.md/
                                  - generic [ref=e556]: CLAUDE.md
                                - generic [ref=e557]: .
                              - heading "Root-cause investigation" [level=2] [ref=e559]:
                                - generic [ref=e561]: Root-cause investigation
                              - generic [ref=e564]: Debugging works best when you come up with several independent hypotheses and test them, but if you’re only using one context window, Claude can run into self-preferential bias. A workflow can structurally prevent this by spinning up agents to generate hypotheses from disjoint evidence. For example, separate agents for logs, files, and data. Each hypothesis can then face a panel of verifiers and refuters.
                              - generic [ref=e567]: This isn't just for code. Workflows can be used for sales (why did sales drop in March?), data engineering (why did this pipeline fail?), or any post-mortem exercise.
                              - heading "Triaging at scale" [level=2] [ref=e569]:
                                - generic [ref=e571]: Triaging at scale
                              - link "Image" [ref=e578] [cursor=pointer]:
                                - /url: /trq212/article/2061907337154367865/media/2061857211803193344
                                - generic "Image" [ref=e582]:
                                  - img "Image" [ref=e584]
                              - generic [ref=e587]: Every team has a support queue, bug reports, or some other backlog that cannot be fully processed by humans.
                              - generic [ref=e590]: A triage workflow classifies each item, dedupes against what's already tracked, and takes action. This could mean attempting the fix or escalating to a human user.
                              - generic [ref=e593]: A useful pattern for triage workflows is quarantine. This involves barring the agents that read untrusted public content from taking high-privilege actions, which are instead done by the agents in charge of acting on the information.
                              - generic [ref=e596]: Pair triage workflows with /loop to have Claude do this continuously.
                              - heading "Exploration and taste" [level=2] [ref=e598]:
                                - generic [ref=e600]: Exploration and taste
                              - generic [ref=e603]: Workflows can be useful when exploring different approaches to a solution, especially when it is taste based, like design or naming, and would benefit from a rubric.
                              - generic [ref=e606]: Try asking Claude to explore a bunch of solutions, and give a review agent a rubric for what a good solution looks like. The task is complete when the review agent feels like it has met the criteria. Solutions can also be ordered or selected via a tournament based on the rubric.
                              - heading "Evals" [level=2] [ref=e608]:
                                - generic [ref=e610]: Evals
                              - generic [ref=e613]: You can run lightweight evals for particular tasks by spinning off separate agents in a worktree and then spinning off comparison agents to compare and grade the specific outputs against a rubric. For example, evaluating and then refining a skill you’ve created against a particular criteria.
                              - heading "Model and intelligence routing" [level=2] [ref=e615]:
                                - generic [ref=e617]: Model and intelligence routing
                              - generic [ref=e620]: Create a classifier agent tuned to your tasks that decides which model to use. This can be helpful when your task will involve many tool calls and conducting research prior to execution can identify the best model for the job.
                              - generic [ref=e623]: For example, the best model for the task “explain how the auth module works” depends on how many files in the auth module there are and the shape of the codebase. A classifier agent can do this research and then route to Sonnet or Opus based on the expected complexity of the task.
                              - heading "When not to use dynamic workflows" [level=2] [ref=e625]:
                                - generic [ref=e627]: When not to use dynamic workflows
                              - generic [ref=e630]: Workflows are new. While there are many use cases where it will create outsized results, they are not needed for every task and may end up using significantly more tokens.
                              - generic [ref=e633]: It’s best to use workflows creatively to push Claude Code in ways that you haven’t previously. For regular coding tasks, try and ask yourself does it really need more compute? For example, most traditional coding tasks do not need a panel of 5 reviewers.
                              - heading "Tips for building dynamic workflows" [level=1] [ref=e635]:
                                - generic [ref=e637]: Tips for building dynamic workflows
                              - generic [ref=e640]: Prompting
                              - generic [ref=e643]: Detailed prompting, using the specific techniques we described above, for dynamic workflows creates the best results.
                              - generic [ref=e646]: Workflows are not just for large tasks. You can prompt the model to use a “quick workflow.” For example, you can create a quick adversarial review of an assumption.
                              - generic [ref=e649]: Combine with /goal and /loop
                              - generic [ref=e652]: When using workflows that can be repeated, for example triage, research, or verification, pair them with /loop to be run at regular intervals, and /goal to set a hard completion requirement.
                              - generic [ref=e655]: Token usage budgets
                              - generic [ref=e658]: "You can set explicit token usage budgets for dynamic workflows to limit how many tokens a task uses. You can prompt it with a budget like: “use 10k tokens,” which will set the cap."
                              - generic [ref=e661]: Saving and sharing dynamic workflows
                              - generic [ref=e664]: You can save workflows by pressing “s” in the workflow menu. You can check these into ~/.claude/workflows or distribute them via a skill.
