                              - generic [ref=e228]:
                                - generic [ref=e229]: While the default Claude Code harness is built for coding, it is also useful for many other types of tasks because, as it turns out, many tasks resemble coding tasks. But there are certain classes of tasks where we have had to build custom harnesses on top of Claude Code to achieve peak performance such as
                                - link "Research" [ref=e231] [cursor=pointer]:
