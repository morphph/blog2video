                              - generic [ref=e314]:
                                - generic [ref=e317]: When an AI agent fails in production, your observability tool shows you exactly what it did and almost nothing about how to fix it.
                                - generic [ref=e320]: You get a clean trace of the run, every model call and tool that fired, how long each step took, and what it cost in tokens.
                                - generic [ref=e323]: What you don't get is why it broke, the change that would fix it, or any promise the same thing won't happen again next week.
                                - generic [ref=e326]: So you scroll through the trace span by span, form a theory about what went wrong, write a patch by hand, and hope it doesn't break something that was working before.
                                - generic [ref=e329]: Then a new model ships with a fresh batch of failure modes, and you run that whole manual loop from the top.
                                - generic [ref=e332]: The real bottleneck isn't your observability. It's everything that has to happen after the trace lands on your screen.
                                - generic [ref=e335]:
                                  - link "Image" [ref=e339] [cursor=pointer]:
                                    - /url: /akshay_pachaar/article/2064051835636498924/media/2063965206817144833
                                    - generic "Image" [ref=e343]:
                                      - img "Image" [ref=e345]
                                  - generic [ref=e355]: Everything to the left of the dotted line runs automatically. Everything to the right runs on your time, which is where production debugging actually lives.
                                - generic [ref=e358]: Cursor recently shared how much engineering goes into the harness around their agent, the layer of prompts, tools, and checks wrapped around the raw model. A better harness on the same model gives far better results, and that work never really ends.
                                - generic [ref=e361]: This is where every observability platform leaves you. It answers what happened, then hands back why it happened, what to change, and how to keep it from breaking again.
                                - generic [ref=e364]: That gap is the loop most teams are stuck in today. Here's why it keeps reopening, and what it finally takes to close it.
                                - heading "Why Current Observability Breaks at Scale" [level=1] [ref=e366]:
                                  - generic [ref=e368]: Why Current Observability Breaks at Scale
                                - generic [ref=e371]: Most agent observability platforms deliver a trace and stop.
                                - generic [ref=e374]: "You get a span tree, latency numbers, token costs, and a dashboard. What you don't get: why it failed, what to fix, or any guarantee it won't break again."
                                - list [ref=e375]:
                                  - listitem [ref=e376]:
                                    - generic [ref=e378]: "\"What happened\" → the platform handles this"
                                  - listitem [ref=e379]:
                                    - generic [ref=e381]: "\"Why it happened\" → manual"
                                  - listitem [ref=e382]:
                                    - generic [ref=e384]: "\"Here's the fix\" → manual"
                                  - listitem [ref=e385]:
                                    - generic [ref=e387]: "\"This won't break again\" → manual"
                                - generic [ref=e390]: That was a reasonable product in 2023. It's the wrong abstraction for teams running agents in production today.
                                - generic [ref=e393]: The problem compounds itself. Every model upgrade introduces new failure modes. Every new tool adds new edge cases. The harness gets more complex faster than any team can manually track and repair.
                                - generic [ref=e396]: Here's the stack that does it.
                                - generic [ref=e399]:
                                  - link "Image" [ref=e403] [cursor=pointer]:
                                    - /url: /akshay_pachaar/article/2064051835636498924/media/2063965533700296704
                                    - generic "Image" [ref=e407]:
                                      - img "Image" [ref=e409]
                                  - generic [ref=e419]: Most platforms end at the dashboard and hand the rest to you. The right side is the loop Opik runs on its own.
                                - 'heading "Opik: AI Observability & Evals For the Agentic Era" [level=1] [ref=e423]':
                                  - 'link "Opik: AI Observability & Evals For the Agentic Era" [ref=e426] [cursor=pointer]':
                                    - /url: https://github.com/comet-ml/opik
                                    - generic [ref=e427]: "Opik: AI Observability & Evals For the Agentic Era"
                                - generic [ref=e429]:
                                  - generic [ref=e430]: Opik is an
                                  - link "open-source" [ref=e432] [cursor=pointer]:
                                    - /url: https://github.com/comet-ml/opik
                                    - generic [ref=e433]: open-source
                                  - generic [ref=e434]: logging, debugging, and optimization platform for AI agents and LLM applications. Opik is built around the premise that this loop should be automated, not staffed.
                                - link "Image" [ref=e441] [cursor=pointer]:
                                  - /url: /akshay_pachaar/article/2064051835636498924/media/2063966280261287936
                                  - generic "Image" [ref=e445]:
                                    - img "Image" [ref=e447]
                                - heading "The Four-Layer Stack" [level=1] [ref=e449]:
                                  - generic [ref=e451]: The Four-Layer Stack
                                - generic [ref=e454]: Opik's architecture is one connected workflow.
                                - generic [ref=e457]: Trace → Ollie diagnoses → Ollie proposes a fix → fix is applied and verified → Test Suite locks the failure as a regression test → back to Trace
                                - generic [ref=e460]:
                                  - link "Image" [ref=e464] [cursor=pointer]:
                                    - /url: /akshay_pachaar/article/2064051835636498924/media/2063966492958613504
                                    - generic "Image" [ref=e468]:
                                      - img "Image" [ref=e470]
                                  - generic [ref=e480]: The four layers are not separate features. They feed each other in a single loop that closes on its own.
                                - generic [ref=e483]: Here's each layer.
                                - 'heading "Layer 1: Tracing" [level=2] [ref=e485]':
                                  - generic [ref=e487]: "Layer 1: Tracing"
                                - generic [ref=e490]: Every LLM call, tool invocation, and retrieval step is instrumented automatically with a single decorator.
                                - generic [ref=e493]:
                                  - generic [ref=e494]:
                                    - generic [ref=e495]: python
                                    - button "Copy to clipboard" [ref=e497] [cursor=pointer]:
                                      - img [ref=e499]
                                  - code [ref=e503]:
                                    - text: import opik
                                    - text: "@opik.track"
                                    - text: "def my_agent(query: str): # your agent logic here ..."
                                - generic [ref=e506]: Works with LangGraph, CrewAI, and 50+ frameworks out of the box. Every trace records which agent configuration was active for full reproducibility when you need to rerun a failing input later.
                                - generic [ref=e509]:
                                  - link "Image" [ref=e513] [cursor=pointer]:
                                    - /url: /akshay_pachaar/article/2064051835636498924/media/2063968107769864192
                                    - generic "Image" [ref=e517]:
                                      - img "Image" [ref=e519]
                                  - generic [ref=e529]: The four layers are not separate features. They feed each other in a single loop that closes on its own.
                                - 'heading "Layer 2: Ollie" [level=2] [ref=e531]':
                                  - generic [ref=e533]: "Layer 2: Ollie"
                                - generic [ref=e536]: Every other observability platform stops at "here's your trace." Opik goes from trace to fixed code, powered by Ollie.
                                - generic [ref=e539]: Ollie is a coding agent built into Opik. One agent, full context.
                                - generic [ref=e542]:
                                  - link "Image" [ref=e546] [cursor=pointer]:
                                    - /url: /akshay_pachaar/article/2064051835636498924/media/2063968770901839872
                                    - generic "Image" [ref=e550]:
                                      - img "Image" [ref=e552]
                                  - generic [ref=e562]: Ollie working through a fix in the side panel, reading and editing files only after you approve each step.
                                - generic [ref=e565]: Without any code access, Ollie reads span trees, identifies failure modes, and explains the causal chain across every LLM call. Ask it, "why did the final answer ignore the retrieved context?" It walks the full span tree and surfaces the root cause.
                                - generic [ref=e568]: "Run opik connect from your project root, and Ollie upgrades to full code-fix mode:"
                                - list [ref=e569]:
                                  - listitem [ref=e570]:
                                    - generic [ref=e572]: Reads your source files
                                  - listitem [ref=e573]:
                                    - generic [ref=e575]: Identifies the exact lines responsible
                                  - listitem [ref=e576]:
                                    - generic [ref=e578]: Proposes a diff; nothing changes without your explicit approval
                                - generic [ref=e581]: Once you approve, Ollie reruns your agent against the exact inputs from the original failing trace, streams the new trace for side-by-side comparison, and locks the original failure as a regression case in your test suite.
                                - generic [ref=e584]: Bad trace → root cause → diff → approve → rerun → regression locked
                                - generic [ref=e587]:
                                  - link "Image" [ref=e591] [cursor=pointer]:
                                    - /url: /akshay_pachaar/article/2064051835636498924/media/2063969154621964289
                                    - generic "Image" [ref=e595]:
                                      - img "Image" [ref=e597]
                                  - generic [ref=e607]: The full path from a bad trace to a locked regression test, with your approval as the one manual step.
                                - 'heading "Layer 3: Test Suites" [level=2] [ref=e609]':
                                  - generic [ref=e611]: "Layer 3: Test Suites"
                                - generic [ref=e614]: "Most eval workflows: build a labeled dataset, define a numerical metric, compare floats. That model works for researchers. It doesn't match how engineers think about quality."
                                - generic [ref=e617]: Opik replaces it with plain-English assertions.
                                - generic [ref=e620]:
                                  - generic [ref=e621]:
                                    - generic [ref=e622]: python
                                    - button "Copy to clipboard" [ref=e624] [cursor=pointer]:
                                      - img [ref=e626]
                                  - code [ref=e630]: suite = opik.TestSuite("crm-agent-v2") suite.add_assertion("The response must include specific deal details, not just a count") suite.add_assertion("The response must never reveal unauthorized information") suite.run_tests()
                                - generic [ref=e633]: Opik converts those into LLM-as-a-judge checks under the hood. Clean pass/fail per test case.
                                - generic [ref=e636]:
                                  - link "Image" [ref=e640] [cursor=pointer]:
                                    - /url: /akshay_pachaar/article/2064051835636498924/media/2063969762296946688
                                    - generic "Image" [ref=e644]:
                                      - img "Image" [ref=e646]
                                  - generic [ref=e656]: A regression suite built from real failures, with each assertion written as a plain-English check.
                                - generic [ref=e659]: "The part that changes the workflow: every failing trace you debug automatically becomes a new test case. The suite grows from real production failures, not synthetic scenarios someone wrote in advance."
                                - generic [ref=e662]: Every cycle, the harness gets harder to break.
                                - generic [ref=e665]: But even with a growing test suite, you still need a safe place to test changes before they ship. That's what Layer 4 is for.
                                - 'heading "Layer 4: Agent sandbox" [level=2] [ref=e667]':
                                  - generic [ref=e669]: "Layer 4: Agent sandbox"
                                - generic [ref=e672]: Most playgrounds are prompt playgrounds. You change a system prompt and rerun one LLM call. That answers the wrong question.
                                - generic [ref=e675]: The production question is, what happens to the entire agent graph when I change this.
                                - generic [ref=e678]: Opik's Agent Sandbox runs the fully instrumented agent end-to-end inside the UI. Change a prompt, swap a model, add a tool, and watch how the whole system responds across the full spanning tree. Every sandbox run produces a complete Opik trace.
                                - generic [ref=e681]: Non-developer stakeholders, PMs, domain experts, and QA can safely test configurations without touching git.
                                - heading "The Flywheel in Practice" [level=1] [ref=e683]:
                                  - generic [ref=e685]: The Flywheel in Practice
                                - generic [ref=e688]: The layers aren't independent features. They're one loop.
                                - generic [ref=e690]:
                                  - generic [ref=e691]: Instrument with
                                  - link "@opik" [ref=e693] [cursor=pointer]:
                                    - /url: https://x.com/@opik
                                    - generic [ref=e694]: "@opik"
                                  - generic [ref=e695]: .track. Declare an opik.Config. Something fails in production. Ollie reads the trace, reads your source, and proposes a fix. You approve. Ollie reruns the agent in the Sandbox against the original failing input. Fixes passes. Save it as a new Blueprint. The environment pointer promotes to staging. Original failure locked as a regression test.
