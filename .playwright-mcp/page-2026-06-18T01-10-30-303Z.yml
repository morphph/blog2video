                                - generic [ref=e721]: The next failure enters the same loop.
                                - generic [ref=e724]: Every cycle, the harness gets harder to break.
                                - heading "Closing the Loop" [level=1] [ref=e726]:
                                  - generic [ref=e728]: Closing the Loop
                                - generic [ref=e731]: Observability that ends at the trace made sense when agents were simple. Once they hit production, the real work is everything after the trace, and that is the part Opik runs for you instead of leaving it on your plate.
                                - generic [ref=e734]: The whole stack ships in the open, Tracing, Ollie, Test Suites, the Agent Sandbox, a 6-algorithm Agent Optimizer, and 50+ framework integrations, with the project past 19.3K stars on GitHub.
