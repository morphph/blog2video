                - generic [ref=e227]:
                  - generic [ref=e228]: The best agentic coders are good have relatively few unknowns. Watching someone like
                  - link "Boris" [ref=e604] [cursor=pointer]:
                    - /url: https://www.google.com/url?q=https://www.linkedin.com/in/bcherny&sa=D&source=editors&ust=1783101769343560&usg=AOvVaw0NSN4RLOEaJ_k7bIWfat2t
                    - generic [ref=e605]: Boris
                  - generic [ref=e232]: or
                  - link "Jarred" [ref=e607] [cursor=pointer]:
                    - /url: https://www.google.com/url?q=https://www.linkedin.com/in/jarred-sumner-a8772425&sa=D&source=editors&ust=1783101769343738&usg=AOvVaw1jFeuVIbBffAC5464Tk_TD
                    - generic [ref=e608]: Jarred
                  - generic [ref=e236]: prompt, it is obvious to me that they know what they want in-detail. They are deeply in-sync with both the codebase and the model behaviors.
                - generic [ref=e238]:
                  - generic [ref=e239]: But they also assume unknowns. In many ways, reducing and planning for your unknowns is the
                  - generic [ref=e240]: skill
                  - generic [ref=e241]: of agentic coding. But luckily, this is a skill you can improve at, by working with Claude.
                - heading "Help Claude help you" [level=2] [ref=e243]:
                  - generic [ref=e245]: Help Claude help you
                - link "Image" [ref=e609] [cursor=pointer]:
                  - /url: /trq212/article/2073100352921215386/media/2073091723493011456
                  - generic "Image" [ref=e610]:
