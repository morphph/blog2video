                - generic [ref=e258]: Instructing Claude is a delicate balance. If you are too specific, Claude will follow your instructions even when a pivot may be more appropriate. If you are too vague, Claude will often make choices and assumptions based on industry best practices that may not be a fit for your task.
                - generic [ref=e261]: When you don’t account for your unknowns you fail both ways. You don't know when the path will be filled with obstacles and you don’t know when the path will be clear, but you still want Claude to veer.
                - generic [ref=e264]: Claude can help you discover your unknowns faster. It can search through your codebase and the internet extremely quickly and it knows much more about the average topic than you. It can also iterate from failure faster.
                - generic [ref=e267]: The most important part of this process is to give Claude context about your starting point. For example, tell it where you are in your thought process; disclose your experience with the problem and codebase; and let it work with you like a thought partner.
                - generic [ref=e269]:
                  - generic [ref=e270]: I've previously written about using
                  - link "HTML with Claude" [ref=e614] [cursor=pointer]:
                    - /url: https://x.com/trq212/status/2052809885763747935
                    - generic [ref=e615]: HTML with Claude
                  - generic [ref=e274]: ", in almost all of these cases, a HTML artifact is the best way to visualize and represent it."
                - generic [ref=e277]: In this article I detail some of the patterns I use to uncover these unknowns. I don't use every technique each time, but it's a useful collection of techniques to have.
                - link "Image" [ref=e616] [cursor=pointer]:
