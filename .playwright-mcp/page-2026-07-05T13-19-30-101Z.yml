                  - generic [ref=e291]: Pre-implementation
                - heading "Blind Spot Pass" [level=2] [ref=e293]:
                  - generic [ref=e295]: Blind Spot Pass
                - generic [ref=e297]:
                  - generic [ref=e298]: When starting work, one of the most useful things you can do is understand your blindspots. For example, if you’re writing a feature in a new part of the codebase or using Claude to help you with unfamiliar work like iterating on a design, you’re likely to have a lot of
                  - generic [ref=e299]: unknown unknowns
                  - generic [ref=e300]: .
                - generic [ref=e303]: You may not know what questions to ask, what good looks like, what historical work has been done or what potholes to avoid.
                - generic [ref=e306]: To do this, you can ask Claude to help you find your unknown unknowns and explain them to you. I like to use the literal words “blindspot pass” and “unknown unknowns”. Giving it context on who you are and what you know is usually important for
                - generic [ref=e309]: "Example Prompts:"
                - list [ref=e310]:
                  - listitem [ref=e311]:
                    - generic [ref=e313]: “I'm working on adding a new auth provider but I know nothing about the auth modules in this codebase. Can you do a blindspot pass to help me figure out my relevant unknown unknowns and help me prompt you better.”
                  - listitem [ref=e314]:
                    - generic [ref=e316]: “I don’t know what color grading is but I need to grade this video. Can you teach me to understand my unknown unknowns about color grading, so that I can prompt better?”
                - heading "Brainstorms and prototypes" [level=2] [ref=e318]:
                  - generic [ref=e320]: Brainstorms and prototypes
                - generic [ref=e322]:
                  - generic [ref=e323]: When I’m working in an area with a lot of
                  - generic [ref=e324]: unknown knowns
                  - generic [ref=e325]: ", involving criteria I only know to define when I see it, I like to ask Claude to brainstorm and prototype with me."
                - generic [ref=e328]: It’s extremely valuable to identify and verbalize unknown knowns early during prototyping, because finding them out during implementation can be (relatively) expensive. Small changes in a feature or spec can cause drastically different implementations in code and it can be more difficult for your agent to revert previous changes.
                - generic [ref=e331]: For example, you may just want to see how a button added to a frame looks without having to wire up a backend route or maintaining additional state in the frontend.
                - generic [ref=e334]: Visual design is something that for me is difficult to articulate, but I know what I want when I see it. In these cases, I’ll ask for several design approaches to an artifact.
                - generic [ref=e337]: I also start almost every coding session with an exploration or brainstorming phase. This helps me start with intent to define the project’s scope. Claude often finds high-value approaches I would have missed and sometimes misses the forest through the trees. Brainstorming prevents me from setting too narrow or too wide a scope.
                - generic [ref=e340]: "Example prompts:"
                - list [ref=e341]:
                  - listitem [ref=e342]:
                    - generic [ref=e344]: "\"I want a dashboard for this data but I have no visual taste and don't know what's possible. Make me an HTML page with 4 wildly different design directions so I can react to them.”"
                  - listitem [ref=e345]:
                    - generic [ref=e347]: “Before wiring anything up, make a single HTML file mocking the new editor toolbar with fake data. I want to react to the layout before you touch the treal app."
                  - listitem [ref=e348]:
                    - generic [ref=e350]: "\"Here's my rough problem: users churn after onboarding. Search the codebase and brainstorm 10 places we could intervene, from cheapest to most ambitious. I'll tell you which ones resonate.\""
                - heading "Interviews" [level=2] [ref=e352]:
                  - generic [ref=e354]: Interviews
                - generic [ref=e357]: Once I’ve done sufficient brainstorming, I likely still have unknowns.
                - generic [ref=e360]: In this case, I ask Claude to interview me about any unknowns or ambiguities. When asking Claude to interview you, try and give it context about your problem to guide its questions. Here are some examples.
                - generic [ref=e363]: "Example prompts:"
                - list [ref=e364]:
                  - listitem [ref=e365]:
                    - generic [ref=e367]: "\"Interview me one question at a time about anything ambiguous, prioritize questions where my answer would change the architecture.\""
                - heading "References" [level=2] [ref=e369]:
                  - generic [ref=e371]: References
                - generic [ref=e374]: Sometimes you can’t describe what you want in detail. For example, you might not have the language or it might be so complicated that it would take you quite a while.
                - generic [ref=e376]:
                  - generic [ref=e377]: In this case, the best answer is a reference. While you can include diagrams, documentation or pictures, the absolute best reference is
                  - generic [ref=e378]: source code
                  - generic [ref=e379]: .
                - generic [ref=e382]: If you have a library that implements something in a certain way or a design component you really like, just point Fable at the folder and tell it what to look for, even if it’s in a different language.
                - generic [ref=e385]: This is also the way Claude Design works. You don't have to hand it a file (although you can do that too). You can point it at a module on a website you like, and it reads the underlying code, not just the screenshot. This provides much richer detail around the markup, structure, and how the component is actually built.
                - generic [ref=e388]: "Example prompts:"
                - list [ref=e389]:
                  - listitem [ref=e390]:
                    - generic [ref=e392]: This Rust crate in vendor/rate-limiter implements the exact backoff behavior I want. Read it and reimplement the same semantics in our TypeScript API client.
                - heading "Implementation Plans" [level=2] [ref=e394]:
                  - generic [ref=e396]: Implementation Plans
                - generic [ref=e399]: When I think I’m ready to implement, I tend to ask Claude to put together an implementation plan for me to review that focuses on the parts that might be most likely to change, for example to review data models, type interfaces or UX flows. This allows Claude to surface things I might actually need to alter.
                - generic [ref=e402]: "Example Prompts:"
                - list [ref=e403]:
                  - listitem [ref=e404]:
                    - generic [ref=e406]: "Write an implementation plan in HTML, but lead with the decisions I'm most likely to tweak with: data model changes, new type interfaces, and anything user-facing. Bury the mechanical refactoring at the bottom, I trust you on that part.\""
                - generic [ref=e407]:
                  - heading "During implementation" [level=2] [ref=e408]:
                    - generic [ref=e410]: During implementation
                  - heading "Implementation notes" [level=2] [ref=e411]:
                    - generic [ref=e413]: Implementation notes
                - generic [ref=e416]: Once I am satisfied with my plan, I make a new session and pass any artifacts to the prompt. For example, I might pass in a spec file and a prototype and ask an agent to implement it.
                - generic [ref=e419]: But the truth is that no matter how much planning you do, there are always unknown unknowns lurking. The agent may find during its work that it needs to take a different tack due to an edge case it found in the code.
