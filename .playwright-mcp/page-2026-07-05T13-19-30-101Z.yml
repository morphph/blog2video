                    - img "Image" [ref=e629]
                - generic [ref=e458]: "One of the most important parts of shipping something is getting buy-in and approvals. Building pitch and explainer artifacts in the final document helps:"
                - list [ref=e459]:
                  - listitem [ref=e460]:
                    - generic [ref=e462]: Accelerate understanding when reviewers start with the same unknowns you did
