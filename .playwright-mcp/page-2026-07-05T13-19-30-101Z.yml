                    - generic [ref=e472]: "\"Package the prototype, the spec, and the implementation notes into a single doc I can drop in Slack to get buy-in. Lead with the demo GIF.\""
                - heading "Quizzes" [level=2] [ref=e474]:
                  - generic [ref=e476]: Quizzes
                - generic [ref=e479]: After a long working session, Claude might have accomplished a lot more than I realized. Reading the code diffs can only give me a light understanding of what happened, since much of the behavior will depend on existing code paths.
                - generic [ref=e482]: Asking Claude to quiz me about the change after giving me a bunch of context helps me understand what happens. I only merge after I pass the quiz perfectly.
