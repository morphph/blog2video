                - generic [ref=e156]: "Working with Claude Fable 5 keeps re-teaching me an old lesson: the map is not the territory."
                - generic [ref=e159]: The map, a representation of the work to be done, is my prompts and skills and context, it’s what I give Claude. The territory is where the work needs to happen, the codebase, the real world, its actual constraints.
                - link "Image" [ref=e591] [cursor=pointer]:
                  - /url: /trq212/article/2073100352921215386/media/2073090486085279744
                  - generic "Image" [ref=e592]:
                    - img "Image" [ref=e594]
                - generic [ref=e171]:
                  - generic [ref=e172]: The difference between the map and the territory is what I call
                  - generic [ref=e173]: unknowns
                  - generic [ref=e174]: . When Claude runs into an unknown, it needs to make a decision based on its best guess of what I want. The more work being done, the more unknowns Claude might run into
                - generic [ref=e177]: Fable is the first model where I find the quality of the work is bottlenecked by my ability to clarify its unknowns.
                - generic [ref=e180]: Importantly, just planning ahead isn’t always enough. You can find unknowns deep in implementation, or your unknowns may point you to the fact that you should actually be solving the problem in a different way altogether.
                - generic [ref=e183]: I’ve found that working with Fable is an iterative process of discovering my unknowns before, during, and after implementation.
                - generic [ref=e185]:
                  - generic [ref=e186]: I've made some
                  - link "example artifacts for finding unknowns here," [ref=e596] [cursor=pointer]:
                    - /url: https://thariqs.github.io/html-effectiveness/unknowns/
                    - generic [ref=e597]: example artifacts for finding unknowns here
                    - generic [ref=e598]: ","
                  - generic [ref=e191]: but be sure to come back to build the intuition for when to use them.
                - heading "Knowing your unknowns" [level=2] [ref=e193]:
                  - generic [ref=e195]: Knowing your unknowns
                - generic [ref=e198]: "What are your unknowns? When I come to Claude with a problem I tend to break it down in 4 ways:"
                - list [ref=e199]:
                  - listitem [ref=e200]:
                    - generic [ref=e201]:
                      - generic [ref=e202]: "Known Knowns:"
                      - generic [ref=e203]: This is essentially what is in my prompt. What do I tell the agent that I want?
                  - listitem [ref=e204]:
                    - generic [ref=e205]:
                      - generic [ref=e206]: "Known Unknowns:"
                      - generic [ref=e207]: What haven't I figured out yet, but I’m aware that I haven’t?
                  - listitem [ref=e208]:
                    - generic [ref=e209]:
                      - generic [ref=e210]: "Unknown Knowns:"
                      - generic [ref=e211]: What's so obvious I’d never write it down, but would recognize it if I saw it?
                  - listitem [ref=e212]:
                    - generic [ref=e213]:
                      - generic [ref=e214]: "Unknown Unknowns:"
                      - generic [ref=e215]: What haven't I considered at all? What knowledge am I not aware of? Do I know how good something can be?
                - link "Image" [ref=e599] [cursor=pointer]:
                  - /url: /trq212/article/2073100352921215386/media/2073092888020611072
                  - generic "Image" [ref=e600]:
