<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .cover {
      width: 100%;
      height: 100%;
      padding: 100px 72px 400px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .cover::before {
      content: '';
      position: absolute;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 1200px;
      height: 700px;
      background: radial-gradient(ellipse, rgba(139, 92, 246, 0.18) 0%, rgba(13, 13, 26, 0) 65%);
      pointer-events: none;
      z-index: 0;
    }
    .series-label {
      font-size: 30px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 80px;
      z-index: 1;
    }
    .title {
      font-size: 92px;
      font-weight: 900;
      line-height: 1.25;
      letter-spacing: -1px;
      margin-bottom: 90px;
      z-index: 1;
    }
    .title .red {
      color: #EF4444;
    }
    .title .green {
      color: #10B981;
    }
    .source {
      display: inline-block;
      background: #1A1A30;
      border: 1px solid rgba(139, 92, 246, 0.15);
      border-radius: 999px;
      padding: 14px 36px;
      font-size: 22px;
      color: #6B6B80;
      letter-spacing: 0.5px;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="cover">
    <div class="series-label">精读AI · Prompt Engineering</div>
    <div class="title">
      给模型加 CRITICAL <span class="red">没用</span><br>
      加工具<span class="green">才有用</span>
    </div>
    <div class="source">Anthropic 官方文档 · 内部课 · 工程师演讲</div>
  </div>
</body>
</html>
