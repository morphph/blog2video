<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .slide::before {
      content: '';
      position: absolute;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 1100px;
      height: 600px;
      background: radial-gradient(ellipse, rgba(139, 92, 246, 0.16) 0%, rgba(13, 13, 26, 0) 65%);
      pointer-events: none;
    }
    .series {
      font-size: 28px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 60px;
      z-index: 1;
    }
    .title {
      font-size: 88px;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 90px;
      z-index: 1;
    }
    .title .red { color: #EF4444; }
    .title .green { color: #10B981; }
    .cards {
      display: flex;
      gap: 24px;
      width: 100%;
      justify-content: center;
      z-index: 1;
    }
    .card {
      flex: 1;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.22);
      border-radius: 12px;
      padding: 28px 24px;
      text-align: left;
    }
    .card.red { border-left: 4px solid #EF4444; }
    .card.purple { border-left: 4px solid #8B5CF6; }
    .card-tag {
      font-size: 22px;
      color: #6B7280;
      letter-spacing: 1.5px;
      margin-bottom: 12px;
      font-weight: 700;
    }
    .card.red .card-tag { color: #EF4444; }
    .card.purple .card-tag { color: #8B5CF6; }
    .card-text {
      font-size: 30px;
      font-weight: 700;
      line-height: 1.4;
      color: #FFFFFF;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="series">精读AI · Prompt Engineering</div>
    <div class="title">
      给模型加 CRITICAL <span class="red">没用</span><br>
      加工具<span class="green">才有用</span>
    </div>
    <div class="cards">
      <div class="card red">
        <div class="card-tag">陷阱</div>
        <div class="card-text">CRITICAL / ALWAYS / NEVER 全是噪声</div>
      </div>
      <div class="card purple">
        <div class="card-tag">真相</div>
        <div class="card-text">prompt 是 4 层系统, 99% 卡在第 2 层</div>
      </div>
    </div>
  </div>
</body>
</html>
