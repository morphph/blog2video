<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .label {
      font-size: 28px;
      color: #EF4444;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 36px;
    }
    .title {
      font-size: 64px;
      font-weight: 900;
      line-height: 1.25;
      margin-bottom: 70px;
    }
    .title .red { color: #EF4444; }
    .escalation {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 60px;
    }
    .step {
      display: flex;
      align-items: center;
      background: #1A1A2E;
      border: 1px solid rgba(239, 68, 68, 0.25);
      border-left: 4px solid #EF4444;
      border-radius: 12px;
      padding: 22px 28px;
    }
    .step-x {
      font-size: 40px;
      color: #EF4444;
      font-weight: 800;
      margin-right: 24px;
      width: 50px;
    }
    .step-text {
      font-size: 36px;
      font-weight: 700;
      color: #FFFFFF;
      font-family: 'SF Mono', 'Menlo', monospace;
    }
    .conclusion {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-left: 4px solid #8B5CF6;
      border-radius: 12px;
      padding: 28px 36px;
      width: 100%;
    }
    .conclusion-text {
      font-size: 34px;
      font-weight: 700;
      line-height: 1.4;
      color: #FFFFFF;
      text-align: left;
    }
    .conclusion-text .purple { color: #8B5CF6; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="label">99% 的人改 prompt 的姿势</div>
    <div class="title">
      在错的地方<span class="red">卷</span>
    </div>
    <div class="escalation">
      <div class="step">
        <div class="step-x">×</div>
        <div class="step-text">加几个词</div>
      </div>
      <div class="step">
        <div class="step-x">×</div>
        <div class="step-text">加 CRITICAL</div>
      </div>
      <div class="step">
        <div class="step-x">×</div>
        <div class="step-text">堆 ALWAYS + NEVER</div>
      </div>
    </div>
    <div class="conclusion">
      <div class="conclusion-text">
        prompt 是 <span class="purple">4 层系统</span>, 新手只写第 2 层, 然后停在那里
      </div>
    </div>
  </div>
</body>
</html>
