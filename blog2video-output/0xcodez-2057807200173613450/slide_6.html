<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .label {
      font-size: 28px;
      color: #EF4444;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 30px;
    }
    .title {
      font-size: 60px;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 50px;
    }
    .title .red { color: #EF4444; }
    .prompt-quote {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-left: 4px solid #EF4444;
      border-radius: 12px;
      padding: 26px 30px;
      text-align: left;
      margin-bottom: 40px;
    }
    .prompt-quote-text {
      font-size: 26px;
      font-family: 'SF Mono', 'Menlo', monospace;
      color: #F59E0B;
      line-height: 1.5;
      margin-bottom: 12px;
    }
    .prompt-quote-meaning {
      font-size: 24px;
      color: #B0B0CC;
      font-weight: 500;
    }
    .sides {
      width: 100%;
      display: flex;
      gap: 20px;
      margin-bottom: 36px;
    }
    .side {
      flex: 1;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.25);
      border-radius: 12px;
      padding: 22px 22px;
      text-align: left;
    }
    .side.told { border-left: 4px solid #10B981; }
    .side.missed { border-left: 4px solid #EF4444; }
    .side-tag {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }
    .side.told .side-tag { color: #10B981; }
    .side.missed .side-tag { color: #EF4444; }
    .side-text {
      font-size: 26px;
      font-weight: 700;
      line-height: 1.4;
      color: #FFFFFF;
    }
    .warning {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-left: 4px solid #F59E0B;
      border-radius: 12px;
      padding: 22px 28px;
      text-align: left;
    }
    .warning-text {
      font-size: 28px;
      font-weight: 700;
      line-height: 1.4;
      color: #FFFFFF;
    }
    .warning-text .amber { color: #F59E0B; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="label">单边指令陷阱</div>
    <div class="title">
      你只给一面, 模型就<span class="red">只往一面优化</span>
    </div>
    <div class="prompt-quote">
      <div class="prompt-quote-text">"avoid escalating — costs $8 + hits metrics"</div>
      <div class="prompt-quote-meaning">→ 模型把"别升级"执行得完美无缺</div>
    </div>
    <div class="sides">
      <div class="side told">
        <div class="side-tag">写了的一面</div>
        <div class="side-text">升级 = $8 + 拉低指标</div>
      </div>
      <div class="side missed">
        <div class="side-tag">没写的一面</div>
        <div class="side-text">答错 = 退款 + 信任崩塌</div>
      </div>
    </div>
    <div class="warning">
      <div class="warning-text">
        <span class="amber">模型越强 → 单边指令越危险</span> · prompt 漏洞被放大
      </div>
    </div>
  </div>
</body>
</html>
