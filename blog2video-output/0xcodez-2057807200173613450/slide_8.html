<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .label {
      font-size: 28px;
      color: #10B981;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 28px;
    }
    .title {
      font-size: 64px;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 24px;
    }
    .title .green { color: #10B981; }
    .big-number {
      font-size: 220px;
      font-weight: 900;
      line-height: 1;
      color: #10B981;
      margin-bottom: 8px;
      letter-spacing: -6px;
    }
    .big-label {
      font-size: 30px;
      color: #B0B0CC;
      font-weight: 600;
      margin-bottom: 50px;
    }
    .cases {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .case {
      display: flex;
      align-items: flex-start;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.25);
      border-radius: 12px;
      padding: 20px 24px;
      text-align: left;
    }
    .case.control { border-left: 4px solid #3B82F6; }
    .case.edge { border-left: 4px solid #F59E0B; }
    .case.boundary { border-left: 4px solid #8B5CF6; }
    .case-name {
      font-size: 28px;
      font-weight: 800;
      width: 200px;
      flex-shrink: 0;
    }
    .case.control .case-name { color: #3B82F6; }
    .case.edge .case-name { color: #F59E0B; }
    .case.boundary .case-name { color: #8B5CF6; }
    .case-desc {
      font-size: 24px;
      color: #FFFFFF;
      font-weight: 600;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="label">第 4 层 · VERIFICATION</div>
    <div class="title">
      Anthropic 内部 <span class="green">eval suite</span>
    </div>
    <div class="big-number">5</div>
    <div class="big-label">test cases · 你没听错, 就 5 个</div>
    <div class="cases">
      <div class="case control">
        <div class="case-name">control</div>
        <div class="case-desc">永远该过的 case, 挂了说明你刚改的东西出大事</div>
      </div>
      <div class="case edge">
        <div class="case-name">edge</div>
        <div class="case-desc">历史挂过的 bug, 每条都是 regression 防御</div>
      </div>
      <div class="case boundary">
        <div class="case-name">boundary</div>
        <div class="case-desc">该交给人或拒答的边界, 测模型知不知道自己的边</div>
      </div>
    </div>
  </div>
</body>
</html>
