<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .label {
      font-size: 28px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 30px;
    }
    .title {
      font-size: 60px;
      font-weight: 900;
      line-height: 1.25;
      margin-bottom: 40px;
    }
    .title .purple { color: #8B5CF6; }
    .signature {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.35);
      border-left: 4px solid #8B5CF6;
      border-radius: 12px;
      padding: 30px 32px;
      text-align: left;
      margin-bottom: 36px;
    }
    .signature-text {
      font-size: 34px;
      font-weight: 800;
      line-height: 1.45;
      color: #FFFFFF;
    }
    .signature-text .purple { color: #8B5CF6; }
    .signature-text .amber { color: #F59E0B; }
    .actions {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 36px;
    }
    .action {
      display: flex;
      align-items: center;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 18px 22px;
      text-align: left;
    }
    .action.a1 { border-left: 4px solid #3B82F6; }
    .action.a2 { border-left: 4px solid #8B5CF6; }
    .action.a3 { border-left: 4px solid #10B981; }
    .action-num {
      font-size: 28px;
      font-weight: 800;
      width: 38px;
      flex-shrink: 0;
    }
    .action.a1 .action-num { color: #3B82F6; }
    .action.a2 .action-num { color: #8B5CF6; }
    .action.a3 .action-num { color: #10B981; }
    .action-text {
      font-size: 26px;
      font-weight: 700;
      color: #FFFFFF;
      line-height: 1.4;
    }
    .brand {
      font-size: 22px;
      color: #6B7280;
      font-weight: 600;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="label">SYNTHESIS · CLOSING</div>
    <div class="title">
      prompt 不是<span class="purple">句子</span>, 是<span class="purple">系统</span>
    </div>
    <div class="signature">
      <div class="signature-text">
        你 prompt 失败时改的不是<span class="amber">字</span>, 是<span class="purple">层</span><br>
        99% 活在第 2 层 · 升一层, 赢一半的人
      </div>
    </div>
    <div class="actions">
      <div class="action a1">
        <div class="action-num">1</div>
        <div class="action-text">拉一条最依赖的 prompt 出来</div>
      </div>
      <div class="action a2">
        <div class="action-num">2</div>
        <div class="action-text">按 4 层走一遍, 不急着改字</div>
      </div>
      <div class="action a3">
        <div class="action-num">3</div>
        <div class="action-text">哪一层最薄, 就补哪一层</div>
      </div>
    </div>
    <div class="brand">精读AI · 精读一篇, 胜过刷一百条</div>
  </div>
</body>
</html>
