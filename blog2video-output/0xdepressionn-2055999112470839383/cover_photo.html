<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1920px; background:#0D0D1A;
    font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;
    color:#FFFFFF; overflow:hidden; }
  .cover { width:100%; height:100%; padding:100px 72px 400px 72px;
    display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; position:relative; }
  .cover::before { content:''; position:absolute; inset:0;
    background:radial-gradient(circle at 50% 35%, rgba(16,185,129,0.18) 0%, transparent 60%); }
  .series-tag { font-size:30px; color:#8B5CF6; letter-spacing:3px; font-weight:600; margin-bottom:60px; position:relative; }
  .title { font-size:84px; font-weight:900; line-height:1.22; color:#FFFFFF; margin-bottom:80px; position:relative; }
  .title .amber { color:#F59E0B; }
  .title .green { color:#10B981; }
  .title .red { color:#EF4444; }
  .source { display:inline-block; padding:14px 32px; background:#1A1A30; border-radius:999px;
    font-size:22px; color:#6B6B80; position:relative; }
</style>
</head>
<body>
  <div class="cover">
    <div class="series-tag">精读AI · CLAUDE.md 实战</div>
    <div class="title">
      一个 <span class="amber">TXT 文件</span><br>
      让 Claude 准确率<br>
      从 <span class="red">65%</span> 飙到 <span class="green">94%</span>
    </div>
    <div class="source">Dep · @0xdepressionn · Karpathy · 82k stars</div>
  </div>
</body>
</html>
