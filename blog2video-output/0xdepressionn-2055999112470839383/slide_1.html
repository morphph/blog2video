<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1920px; background:#0D0D1A;
    font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;
    color:#FFFFFF; overflow:hidden; }
  .slide { width:100%; height:100%; padding:200px 72px 420px 72px;
    display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; position:relative; }
  .slide::before { content:''; position:absolute; inset:0;
    background:radial-gradient(circle at 50% 30%, rgba(245,158,11,0.12) 0%, transparent 55%); }
  .kicker { font-size:30px; color:#8B5CF6; letter-spacing:3px; font-weight:600; margin-bottom:36px; position:relative; }
  .filename { font-family:'SF Mono','Monaco',monospace; font-size:64px; font-weight:800;
    color:#F59E0B; background:#1A1A2E; border:2px solid rgba(245,158,11,0.4); border-radius:12px;
    padding:24px 36px; margin-bottom:50px; position:relative; letter-spacing:2px; }
  .stat-row { width:100%; display:flex; gap:24px; position:relative; }
  .sc { flex:1; background:#1A1A2E; border:1px solid rgba(139,92,246,0.25); border-radius:12px;
    padding:30px 22px; text-align:left; }
  .stars { border-left:4px solid #F59E0B; }
  .rank { border-left:4px solid #10B981; }
  .who { border-left:4px solid #8B5CF6; }
  .sc-num { font-size:48px; font-weight:800; line-height:1; margin-bottom:12px; }
  .stars .sc-num { color:#F59E0B; }
  .rank .sc-num { color:#10B981; }
  .who .sc-num { color:#8B5CF6; }
  .sc-lab { font-size:20px; color:#B0B0CC; line-height:1.4; }
</style>
</head>
<body>
  <div class="slide">
    <div class="kicker">GitHub Trending 第 1 名</div>
    <div class="filename">CLAUDE.md</div>
    <div class="stat-row">
      <div class="sc stars"><div class="sc-num">82K ★</div><div class="sc-lab">GitHub Stars</div></div>
      <div class="sc rank"><div class="sc-num">#1</div><div class="sc-lab">Trending</div></div>
      <div class="sc who"><div class="sc-num">Karpathy</div><div class="sc-lab">起点 · 4 条规则</div></div>
    </div>
  </div>
</body>
</html>
