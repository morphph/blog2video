<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1920px; background:#0D0D1A;
    font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;
    color:#FFFFFF; overflow:hidden; }
  .slide { width:100%; height:100%; padding:200px 72px 420px 72px;
    display:flex; flex-direction:column; justify-content:center; align-items:center; }
  .kicker { font-size:28px; color:#8B5CF6; letter-spacing:3px; font-weight:600; margin-bottom:28px; }
  .title { font-size:56px; font-weight:900; line-height:1.3; margin-bottom:36px; text-align:center; }
  .title .red { color:#EF4444; }
  .title .amber { color:#F59E0B; }
  .cost { width:100%; background:#1A1A2E; border:1px solid rgba(239,68,68,0.4);
    border-left:4px solid #EF4444; border-radius:12px; padding:28px; margin-bottom:24px; text-align:center; }
  .cost-formula { font-size:22px; color:#B0B0CC; margin-bottom:14px; font-family:'SF Mono','Monaco',monospace; }
  .cost-big { font-size:84px; font-weight:800; color:#EF4444; line-height:1; margin-bottom:8px; }
  .cost-lab { font-size:22px; color:#B0B0CC; }
  .rules { width:100%; display:flex; flex-direction:column; gap:12px; }
  .r { background:#1A1A2E; border:1px solid rgba(139,92,246,0.25); border-left:4px solid #F59E0B;
    border-radius:10px; padding:18px 24px; font-size:22px; font-weight:700; }
  .r .num { color:#F59E0B; font-weight:800; margin-right:14px; }
  .r .sub { display:block; font-size:18px; color:#B0B0CC; font-weight:500; margin-top:6px; }
</style>
</head>
<body>
  <div class="slide">
    <div class="kicker">DEFAULTS · 第一类规则</div>
    <div class="title">每周烧掉<br><span class="red">375 美金</span>重新自我介绍</div>
    <div class="cost">
      <div class="cost-formula">30 min/day × $150/hr</div>
      <div class="cost-big">$375 / 周</div>
      <div class="cost-lab">5 人团队 = $1,875/周 蒸发</div>
    </div>
    <div class="rules">
      <div class="r"><span class="num">1</span>杀掉废话开头<span class="sub">不要 "好问题！" "当然！"</span></div>
      <div class="r"><span class="num">2</span>长度匹配任务<span class="sub">不要为了显得用心而灌水</span></div>
      <div class="r"><span class="num">3</span>行动前先给 2–3 个选项</div>
      <div class="r"><span class="num">4</span>承认不确定 · 不许用"听起来合理"填空</div>
    </div>
  </div>
</body>
</html>
