<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1920px; background:#0D0D1A;
    font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;
    color:#FFFFFF; overflow:hidden; }
  .slide { width:100%; height:100%; padding:200px 72px 420px 72px;
    display:flex; flex-direction:column; justify-content:center; align-items:center; }
  .kicker { font-size:28px; color:#8B5CF6; letter-spacing:3px; font-weight:600; margin-bottom:28px; }
  .title { font-size:56px; font-weight:900; line-height:1.3; margin-bottom:32px; text-align:center; }
  .title .red { color:#EF4444; }
  .scenario { width:100%; background:#1A1A2E; border:1px solid rgba(239,68,68,0.4);
    border-left:4px solid #EF4444; border-radius:12px; padding:22px 28px; margin-bottom:20px; }
  .sc-tag { font-size:20px; color:#EF4444; font-weight:800; letter-spacing:2px; margin-bottom:12px; }
  .sc-prompt { font-size:24px; font-weight:700; margin-bottom:14px; }
  .sc-result { display:flex; flex-direction:column; gap:8px; font-size:20px; color:#B0B0CC; line-height:1.4; }
  .sc-result span { color:#EF4444; }
  .quote { width:100%; background:#0D0D1A; border:2px solid rgba(245,158,11,0.5);
    border-radius:12px; padding:24px 28px; margin-bottom:20px; font-family:'SF Mono','Monaco',monospace;
    font-size:22px; color:#F59E0B; font-weight:700; line-height:1.55; text-align:center; }
  .why { width:100%; background:linear-gradient(135deg,#1A1A2E,#2A1A3A);
    border:1px solid rgba(139,92,246,0.4); border-radius:12px; padding:22px; text-align:center; font-size:22px; line-height:1.5; }
  .why strong { color:#F59E0B; }
</style>
</head>
<body>
  <div class="slide">
    <div class="kicker">BEHAVIOR · 第二类规则 · $225/周</div>
    <div class="title">越权改动<br><span class="red">绝对不要动</span></div>
    <div class="scenario">
      <div class="sc-tag">SCENARIO</div>
      <div class="sc-prompt">"改一个函数"</div>
      <div class="sc-result">
        <span>→</span> refactor 三个文件 · 重命名变量<br>
        <span>→</span> 重排 import · 改你的注释<br>
        <span>→</span> 全程没问你一句
      </div>
    </div>
    <div class="quote">"You mentioned this earlier"<br>is <span style="color:#EF4444">NOT</span> confirmation.</div>
    <div class="why">Claude 没有<strong>上下文压力感</strong>——三天前你随口一句"那表可删"，它会记一辈子</div>
  </div>
</body>
</html>
