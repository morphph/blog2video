<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1920px; background:#0D0D1A;
    font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;
    color:#FFFFFF; overflow:hidden; }
  .slide { width:100%; height:100%; padding:200px 72px 420px 72px;
    display:flex; flex-direction:column; justify-content:center; align-items:center; }
  .kicker { font-size:28px; color:#8B5CF6; letter-spacing:3px; font-weight:600; margin-bottom:28px; }
  .title { font-size:60px; font-weight:900; line-height:1.3; margin-bottom:32px; text-align:center; }
  .title .red { color:#EF4444; }
  .title .amber { color:#F59E0B; }
  .breakdown { width:100%; background:#1A1A2E; border:1px solid rgba(239,68,68,0.4);
    border-left:4px solid #EF4444; border-radius:12px; padding:24px 28px; margin-bottom:20px; }
  .bd-tag { font-size:20px; color:#EF4444; font-weight:800; letter-spacing:2px; margin-bottom:14px; }
  .bd-row { display:flex; justify-content:space-between; align-items:center; padding:8px 0; font-size:22px; }
  .bd-label { color:#B0B0CC; }
  .bd-val { color:#EF4444; font-weight:800; font-family:'SF Mono','Monaco',monospace; }
  .bd-total { border-top:2px solid rgba(239,68,68,0.4); margin-top:12px; padding-top:12px; }
  .bd-total .bd-label { color:#FFFFFF; font-weight:800; font-size:24px; }
  .bd-total .bd-val { color:#EF4444; font-size:28px; }
  .yearly { width:100%; background:linear-gradient(135deg,#2A1A1A,#2A1A3A);
    border:1px solid rgba(239,68,68,0.5); border-radius:12px; padding:22px;
    text-align:center; margin-bottom:20px; }
  .yearly-num { font-size:54px; font-weight:800; color:#EF4444; margin-bottom:6px; font-family:'SF Mono','Monaco',monospace; }
  .yearly-lab { font-size:22px; color:#B0B0CC; }
  .setup { width:100%; background:#1A1A2E; border:1px solid rgba(16,185,129,0.4);
    border-left:4px solid #10B981; border-radius:12px; padding:22px 28px;
    text-align:center; font-size:24px; font-weight:700; }
  .setup .green { color:#10B981; font-size:36px; font-weight:800; }
</style>
</head>
<body>
  <div class="slide">
    <div class="kicker">把全文的账算一遍</div>
    <div class="title">不是技术问题<br>是<span class="amber">耐心问题</span></div>
    <div class="breakdown">
      <div class="bd-tag">每周浪费 · 每人</div>
      <div class="bd-row"><div class="bd-label">重复解释上下文</div><div class="bd-val">$375</div></div>
      <div class="bd-row"><div class="bd-label">撤销越权改动</div><div class="bd-val">$225</div></div>
      <div class="bd-row"><div class="bd-label">从遗忘决策恢复</div><div class="bd-val">$375</div></div>
      <div class="bd-row bd-total"><div class="bd-label">合计</div><div class="bd-val">$975 / 周</div></div>
    </div>
    <div class="yearly">
      <div class="yearly-num">$253,500</div>
      <div class="yearly-lab">5 人团队 · 一年蒸发</div>
    </div>
    <div class="setup">CLAUDE.md 全套配置 · <span class="green">2 小时</span></div>
  </div>
</body>
</html>
