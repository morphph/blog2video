<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1920px; background:#0D0D1A;
    font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;
    color:#FFFFFF; overflow:hidden; }
  .slide { width:100%; height:100%; padding:200px 72px 420px 72px;
    display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; }
  .kicker { font-size:28px; color:#8B5CF6; letter-spacing:3px; font-weight:600; margin-bottom:32px; }
  .num { font-size:160px; font-weight:800; color:#10B981; line-height:1; margin-bottom:12px; }
  .num-lab { font-size:26px; color:#B0B0CC; margin-bottom:36px; }
  .title { font-size:48px; font-weight:900; line-height:1.3; margin-bottom:36px; }
  .title .amber { color:#F59E0B; }
  .file-row { width:100%; background:#0D0D1A; border:2px solid rgba(16,185,129,0.5);
    border-radius:12px; padding:22px; font-family:'SF Mono','Monaco',monospace;
    font-size:32px; color:#10B981; font-weight:800; margin-bottom:24px; }
  .anchor { width:100%; background:linear-gradient(135deg,#1A1A2E,#2A1A3A);
    border:1px solid rgba(139,92,246,0.4); border-radius:12px; padding:24px;
    font-size:24px; line-height:1.5; }
  .anchor strong { color:#F59E0B; }
</style>
</head>
<body>
  <div class="slide">
    <div class="kicker">今天就动手 · 最小可行</div>
    <div class="num">2 min</div>
    <div class="num-lab">先只抄 Karpathy 那 4 条</div>
    <div class="title">在项目根目录<br>新建一个<span class="amber">文本文件</span></div>
    <div class="file-row">touch CLAUDE.md</div>
    <div class="anchor">剩下 17 条 · <strong>每周加一点</strong><br>按踩到什么坑、加什么规则</div>
  </div>
</body>
</html>
