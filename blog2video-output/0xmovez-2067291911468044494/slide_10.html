<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1080px; height: 1920px; background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif; color: #FFFFFF; overflow: hidden; }
    .slide { width: 100%; height: 100%; padding: 200px 72px 420px 72px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; position: relative; }
    h1 { font-size: 56px; font-weight: 800; line-height: 1.25; margin-bottom: 38px; }
    h1 .hl { color: #F59E0B; }
    .file { background: #1A1A2E; border: 1px solid rgba(245,158,11,0.35); border-radius: 12px; width: 100%; overflow: hidden; text-align: left; margin-bottom: 30px; }
    .file .hdr { background: rgba(245,158,11,0.12); padding: 22px 28px; display: flex; align-items: center; gap: 16px; border-bottom: 1px solid rgba(245,158,11,0.25); }
    .file .hdr .dot { width: 16px; height: 16px; border-radius: 4px; background: #F59E0B; }
    .file .hdr .name { font-size: 32px; font-weight: 700; color: #F59E0B; font-family: 'SF Mono', ui-monospace, monospace; }
    .file .body { padding: 22px 30px; }
    .file .ln { font-size: 30px; color: #B0B0CC; line-height: 1.5; padding: 8px 0; }
    .file .ln::before { content: "− "; color: #10B981; font-weight: 700; }
    .file .ln b { color: #FFFFFF; }
    .pt { background: #1A1A2E; border: 1px solid rgba(16,185,129,0.3); border-left: 4px solid #10B981; border-radius: 12px; padding: 28px 32px; width: 100%; text-align: left; }
    .pt .d { font-size: 36px; font-weight: 700; line-height: 1.35; }
    .pt .d .g { color: #10B981; font-weight: 800; }
    .pt .d .dim { color: #B0B0CC; font-weight: 500; }
  </style>
</head>
<body>
  <div class="slide">
    <h1>核查反馈，<br>烤成 <span class="hl">永久规则</span></h1>
    <div class="file">
      <div class="hdr"><span class="dot"></span><span class="name">CONSTRAINTS.md</span></div>
      <div class="body">
        <div class="ln">每个数字必须 <b>追溯到一手来源</b>，否则标记</div>
        <div class="ln">不静默处理矛盾，<b>把冲突浮出来</b></div>
        <div class="ln">上次 Opus 抓到的偏差 → <b>蒸馏成一条硬规则</b></div>
        <div class="ln">Scope-lock：不碰 spec 范围之外的东西</div>
      </div>
    </div>
    <div class="pt">
      <div class="d">把关的越来越闲 = <span class="g">错误被提前消灭</span>。<span class="dim">护城河，恰恰长在这个过程里。</span></div>
    </div>
  </div>
</body>
</html>
