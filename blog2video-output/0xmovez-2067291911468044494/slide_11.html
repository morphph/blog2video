<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1080px; height: 1920px; background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif; color: #FFFFFF; overflow: hidden; }
    .slide { width: 100%; height: 100%; padding: 200px 72px 420px 72px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; position: relative; }
    .kicker { font-size: 28px; color: #10B981; font-weight: 700; letter-spacing: 2px; margin-bottom: 18px; }
    h1 { font-size: 58px; font-weight: 800; line-height: 1.25; margin-bottom: 48px; }
    h1 .hl { color: #10B981; }
    .collapse { display: flex; align-items: center; justify-content: center; gap: 24px; width: 100%; margin-bottom: 44px; }
    .b { flex: 1; background: #1A1A2E; border-radius: 12px; padding: 36px 20px; }
    .b.one { border: 1px solid rgba(107,114,128,0.4); }
    .b.fifty { border: 1px solid rgba(16,185,129,0.4); border-left: 4px solid #10B981; }
    .b .tag { font-size: 26px; color: #6B7280; font-weight: 700; margin-bottom: 14px; letter-spacing: 1px; }
    .b.fifty .tag { color: #10B981; }
    .b .num { font-size: 76px; font-weight: 800; line-height: 1; }
    .b.one .num { color: #B0B0CC; }
    .b.fifty .num { color: #10B981; }
    .gt { font-size: 60px; color: #F59E0B; font-weight: 800; }
    .pt { background: #1A1A2E; border: 1px solid rgba(245,158,11,0.3); border-left: 4px solid #F59E0B; border-radius: 12px; padding: 30px 34px; width: 100%; text-align: left; }
    .pt .d { font-size: 38px; font-weight: 700; line-height: 1.35; }
    .pt .d .y { color: #F59E0B; font-weight: 800; }
    .pt .d .dim { color: #B0B0CC; font-weight: 500; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="kicker">REPLAY · 复利落到发票上</div>
    <h1>复跑成本 <span class="hl">塌缩</span></h1>
    <div class="collapse">
      <div class="b one"><div class="tag">RUN #1</div><div class="num">20 分钟</div></div>
      <div class="gt">→</div>
      <div class="b fifty"><div class="tag">RUN #50</div><div class="num">30 秒</div></div>
    </div>
    <div class="pt">
      <div class="d">第二次<span class="y">不是从零开始</span>——从攒下的 Skill、领域知识、约束文件起步。<span class="dim">产出更锋利，因为它继承了前面每一次的修正。</span></div>
    </div>
  </div>
</body>
</html>
