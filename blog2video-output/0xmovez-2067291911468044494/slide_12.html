<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1080px; height: 1920px; background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif; color: #FFFFFF; overflow: hidden; }
    .slide { width: 100%; height: 100%; padding: 200px 72px 420px 72px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; position: relative; }
    .kicker { font-size: 28px; color: #8B5CF6; font-weight: 700; letter-spacing: 2px; margin-bottom: 18px; }
    h1 { font-size: 56px; font-weight: 800; line-height: 1.25; margin-bottom: 24px; }
    h1 .hl { color: #8B5CF6; }
    .sub { font-size: 34px; color: #B0B0CC; margin-bottom: 40px; line-height: 1.4; }
    .triggers { display: flex; gap: 16px; width: 100%; margin-bottom: 32px; }
    .tr { flex: 1; background: #1A1A2E; border: 1px solid rgba(139,92,246,0.3); border-radius: 12px; padding: 26px 14px; }
    .tr .t { font-size: 28px; font-weight: 700; color: #8B5CF6; }
    .tr .d { font-size: 26px; color: #B0B0CC; margin-top: 12px; line-height: 1.3; }
    .res { background: #1A1A2E; border: 1px solid rgba(16,185,129,0.3); border-left: 4px solid #10B981; border-radius: 12px; padding: 30px 34px; width: 100%; text-align: left; }
    .res .d { font-size: 36px; font-weight: 700; line-height: 1.4; }
    .res .d .g { color: #10B981; font-weight: 800; }
    .res .d .dim { color: #B0B0CC; font-weight: 500; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="kicker">最后一招 · 升级成后台 AGENT</div>
    <h1>不用再 <span class="hl">手动启动</span> 它</h1>
    <div class="sub">给 Kimi 一个触发条件，让它主动跑完整套循环</div>
    <div class="triggers">
      <div class="tr"><div class="t">时间表</div><div class="d">每周自动</div></div>
      <div class="tr"><div class="t">新文件落盘</div><div class="d">触发即跑</div></div>
      <div class="tr"><div class="t">竞品定价页</div><div class="d">变动监控</div></div>
    </div>
    <div class="res">
      <div class="d">每周并行检查每个竞品，<span class="g">零边际时间成本</span>往收件箱丢简报。<span class="dim">唯一剩下的人类，是你设的问题和你做的决定。</span></div>
    </div>
  </div>
</body>
</html>
