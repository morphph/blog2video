<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1080px; height: 1920px; background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif; color: #FFFFFF; overflow: hidden; }
    .slide { width: 100%; height: 100%; padding: 200px 72px 420px 72px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; position: relative; }
    .glow { position: absolute; top: 220px; left: 50%; transform: translateX(-50%); width: 760px; height: 420px; background: radial-gradient(ellipse at center, rgba(139,92,246,0.22), transparent 70%); filter: blur(20px); }
    .kicker { font-size: 28px; color: #8B5CF6; font-weight: 700; letter-spacing: 3px; margin-bottom: 24px; z-index: 1; }
    h1 { font-size: 60px; font-weight: 800; line-height: 1.25; margin-bottom: 40px; z-index: 1; }
    h1 .hl { color: #F59E0B; }
    .deepseek { background: #1A1A2E; border: 1px solid rgba(139,92,246,0.3); border-left: 4px solid #8B5CF6; border-radius: 12px; padding: 28px 32px; width: 100%; text-align: left; margin-bottom: 26px; z-index: 1; }
    .deepseek .d { font-size: 32px; color: #B0B0CC; line-height: 1.45; }
    .deepseek .d b { color: #8B5CF6; font-weight: 800; }
    .quote { background: linear-gradient(135deg, rgba(245,158,11,0.12), rgba(16,185,129,0.08)); border: 1px solid rgba(245,158,11,0.35); border-radius: 12px; padding: 34px 36px; width: 100%; text-align: left; z-index: 1; }
    .quote .big { font-size: 40px; font-weight: 800; line-height: 1.4; }
    .quote .big .y { color: #F59E0B; }
    .quote .big .g { color: #10B981; }
    .sig { font-size: 30px; color: #6B7280; margin-top: 38px; z-index: 1; letter-spacing: 1px; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="glow"></div>
    <div class="kicker">这个指纹，我们见过一次</div>
    <h1>它是同一个形状——<br>那次叫 <span class="hl">DeepSeek</span></h1>
    <div class="deepseek">
      <div class="d">一个开源发布，<b>重新定义了封闭前沿以为自己拥有的东西</b>，整个领域一夜之间重新校准。一个长在开源权重上、会自我学习的 Swarm，是同一个形状。</div>
    </div>
    <div class="quote">
      <div class="big">真正的杠杆，从来不在哪个模型更聪明——而在<span class="y">让一次运行留下点东西</span>，让明天那群 Agent，比今天的<span class="g">更聪明</span>。</div>
    </div>
    <div class="sig">AI 世界很吵，精读一篇，胜过刷一百条</div>
  </div>
</body>
</html>
