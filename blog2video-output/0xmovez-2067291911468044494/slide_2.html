<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1080px; height: 1920px; background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif; color: #FFFFFF; overflow: hidden; }
    .slide { width: 100%; height: 100%; padding: 200px 72px 420px 72px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; position: relative; }
    h1 { font-size: 62px; font-weight: 800; line-height: 1.25; margin-bottom: 56px; }
    h1 .hl { color: #F59E0B; }
    .bars { display: flex; gap: 24px; width: 100%; margin-bottom: 48px; }
    .bar { flex: 1; background: #1A1A2E; border: 1px solid rgba(139,92,246,0.25); border-radius: 12px; padding: 36px 24px; }
    .bar .pct { font-size: 84px; font-weight: 800; line-height: 1; }
    .bar .pct.dim { color: #6B7280; }
    .bar .pct.key { color: #8B5CF6; }
    .bar .lab { font-size: 30px; color: #B0B0CC; margin-top: 18px; line-height: 1.4; }
    .core { background: #1A1A2E; border: 1px solid rgba(139,92,246,0.3); border-left: 4px solid #10B981; border-radius: 12px; padding: 32px 36px; width: 100%; text-align: left; }
    .core .big { font-size: 44px; font-weight: 800; line-height: 1.3; }
    .core .big .g { color: #10B981; }
    .core .meta { font-size: 30px; color: #B0B0CC; margin-top: 16px; }
    .core .meta code { color: #3B82F6; font-weight: 700; }
  </style>
</head>
<body>
  <div class="slide">
    <h1>你打开聊天框，<br>只摸到了 <span class="hl">一成</span> 能力</h1>
    <div class="bars">
      <div class="bar"><div class="pct dim">10%</div><div class="lab">聊天框<br>输入·回答·关掉</div></div>
      <div class="bar"><div class="pct key">90%</div><div class="lab">你从没点开的<br>那个模式</div></div>
    </div>
    <div class="core">
      <div class="big">一句话，拉起最多 <span class="g">300 个并行子 Agent</span></div>
      <div class="meta">跨越 <code>4000 步</code> 协同动作 · 每跑一遍都留下点东西</div>
    </div>
  </div>
</body>
</html>
