<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1080px; height: 1920px; background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif; color: #FFFFFF; overflow: hidden; }
    .slide { width: 100%; height: 100%; padding: 200px 72px 420px 72px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; position: relative; }
    .kicker { font-size: 28px; color: #6B7280; font-weight: 700; letter-spacing: 2px; margin-bottom: 18px; font-family: 'SF Mono', ui-monospace, monospace; }
    h1 { font-size: 60px; font-weight: 800; line-height: 1.25; margin-bottom: 24px; }
    h1 .hl { color: #10B981; }
    .sub { font-size: 32px; color: #B0B0CC; margin-bottom: 40px; line-height: 1.4; }
    .file { background: #1A1A2E; border: 1px solid rgba(16,185,129,0.35); border-radius: 12px; width: 100%; overflow: hidden; text-align: left; margin-bottom: 28px; }
    .file .hdr { background: rgba(16,185,129,0.12); padding: 22px 28px; display: flex; align-items: center; gap: 16px; border-bottom: 1px solid rgba(16,185,129,0.25); }
    .file .hdr .dot { width: 16px; height: 16px; border-radius: 4px; background: #10B981; }
    .file .hdr .name { font-size: 30px; font-weight: 700; color: #10B981; font-family: 'SF Mono', ui-monospace, monospace; }
    .file .body { padding: 24px 28px; }
    .file .row { display: flex; align-items: baseline; gap: 18px; padding: 12px 0; }
    .file .row .num { font-size: 56px; font-weight: 800; color: #FFFFFF; min-width: 130px; }
    .file .row .num.s { color: #10B981; }
    .file .row .d { font-size: 30px; color: #B0B0CC; line-height: 1.3; }
    .tag { font-size: 32px; color: #F59E0B; font-weight: 700; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="kicker">// 量化因子衰减审计</div>
    <h1>产出是 <span class="hl">真实文件</span>，<br>不是聊天框里一段话</h1>
    <div class="sub">写 spec 时，永远把产出放在最前面</div>
    <div class="file">
      <div class="hdr"><span class="dot"></span><span class="name">factor_decay_audit_q2_2026.xlsx</span></div>
      <div class="body">
        <div class="row"><div class="num s">1</div><div class="d">个 Excel 文件，一张表</div></div>
        <div class="row"><div class="num">40 × 7</div><div class="d">40 行 7 列（因子 / Sharpe / 衰减% / t-stat …）</div></div>
        <div class="row"><div class="num">200</div><div class="d">词简报，夹在封面页里</div></div>
      </div>
    </div>
    <div class="tag">拿来就能用 ← 不是「一份全面的报告」</div>
  </div>
</body>
</html>
