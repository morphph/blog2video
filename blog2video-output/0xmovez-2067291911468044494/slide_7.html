<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1080px; height: 1920px; background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif; color: #FFFFFF; overflow: hidden; }
    .slide { width: 100%; height: 100%; padding: 200px 72px 420px 72px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; position: relative; }
    .kicker { font-size: 28px; color: #EF4444; font-weight: 700; letter-spacing: 2px; margin-bottom: 18px; }
    h1 { font-size: 58px; font-weight: 800; line-height: 1.25; margin-bottom: 22px; }
    h1 .hl { color: #8B5CF6; }
    .lead { font-size: 34px; color: #B0B0CC; margin-bottom: 40px; line-height: 1.4; }
    .lead b { color: #FFFFFF; }
    .stats { display: flex; gap: 20px; width: 100%; margin-bottom: 30px; }
    .st { flex: 1; background: #1A1A2E; border: 1px solid rgba(139,92,246,0.3); border-radius: 12px; padding: 30px 22px; }
    .st .num { font-size: 80px; font-weight: 800; line-height: 1; }
    .st .num.p { color: #8B5CF6; }
    .st .num.z { color: #10B981; }
    .st .lab { font-size: 28px; color: #B0B0CC; margin-top: 16px; line-height: 1.35; }
    .role { background: #1A1A2E; border: 1px solid rgba(139,92,246,0.3); border-left: 4px solid #8B5CF6; border-radius: 12px; padding: 28px 32px; width: 100%; text-align: left; }
    .role .big { font-size: 40px; font-weight: 800; line-height: 1.3; }
    .role .big .em { color: #F59E0B; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="kicker">VERIFY GATE · 唯一不属于 Kimi 的一拍</div>
    <h1>该 <span class="hl">Opus 4.8</span> 上场了</h1>
    <div class="lead">它的唯一职责是 <b>证伪，不是夸奖</b></div>
    <div class="stats">
      <div class="st"><div class="num p">4×</div><div class="lab">放过自己代码缺陷的概率<br>比上一代低约四倍</div></div>
      <div class="st"><div class="num z">0%</div><div class="lab">第一个在「不加批判报告<br>缺陷结果」上拿 0 分的 Claude</div></div>
    </div>
    <div class="role">
      <div class="big">没有任何模型 <span class="em">赢者通吃</span>——便宜的并行量，只有在有可信的东西检查时，才是超能力。</div>
    </div>
  </div>
</body>
</html>
