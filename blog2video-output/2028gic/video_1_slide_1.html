<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1080px; height: 1920px; background: #0D0D1A; font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif; color: #FFFFFF; overflow: hidden; }
    .slide {
      width: 100%; height: 100%;
      padding: 120px 72px 520px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
    }
    .slide::before {
      content: '';
      position: absolute;
      top: 30%; left: 50%;
      transform: translate(-50%, -50%);
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, rgba(139, 92, 246, 0.05) 40%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }
    .tag {
      font-size: 26px;
      color: #8B5CF6;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 48px;
      font-weight: 600;
    }
    .main-title {
      font-size: 72px;
      font-weight: 900;
      line-height: 1.3;
      margin-bottom: 60px;
      max-width: 900px;
    }
    .main-title .highlight-red {
      color: #EF4444;
    }
    .main-title .highlight-yellow {
      color: #F59E0B;
    }
    .fact-cards {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
      max-width: 900px;
    }
    .fact-card {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 28px 32px;
      display: flex;
      align-items: center;
      gap: 20px;
      text-align: left;
    }
    .fact-card .icon {
      font-size: 40px;
      flex-shrink: 0;
      width: 56px;
      text-align: center;
    }
    .fact-card .text {
      font-size: 32px;
      font-weight: 600;
      color: #FFFFFF;
      line-height: 1.4;
    }
    .fact-card .text .num {
      font-size: 40px;
      font-weight: 800;
      color: #F59E0B;
    }
    .fact-card .text .emphasis {
      color: #EF4444;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="tag">AI + SaaS 危机</div>
    <div class="main-title">
      <span class="highlight-yellow">几周</span>复制SaaS产品<br>
      <span class="highlight-red">五年护城河</span>被填平
    </div>
    <div class="fact-cards">
      <div class="fact-card">
        <div class="icon">&#x1F9D1;&#x200D;&#x1F4BB;</div>
        <div class="text"><span class="num">1</span>个程序员 + AI</div>
      </div>
      <div class="fact-card">
        <div class="icon">&#x23F1;</div>
        <div class="text">几周复制<span class="emphasis">完整产品</span></div>
      </div>
      <div class="fact-card">
        <div class="icon">&#x1F4A5;</div>
        <div class="text">连锁崩塌的<span class="emphasis">起点</span></div>
      </div>
    </div>
  </div>
</body>
</html>
