<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1080px; height: 1920px; background: #0D0D1A; font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif; color: #FFFFFF; overflow: hidden; }
    .slide {
      width: 100%; height: 100%;
      padding: 120px 72px 520px 72px;
      display: flex; flex-direction: column;
      justify-content: flex-start; align-items: center;
      text-align: center; position: relative;
    }
    .section-label {
      font-size: 24px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 600;
      margin-bottom: 32px;
    }
    .concept-card {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-left: 4px solid #8B5CF6;
      border-radius: 12px;
      padding: 32px 36px;
      width: 100%;
      max-width: 920px;
      text-align: left;
      margin-bottom: 48px;
    }
    .concept-card .en-title {
      font-size: 40px;
      font-weight: 800;
      color: #8B5CF6;
      margin-bottom: 12px;
    }
    .concept-card .cn-title {
      font-size: 34px;
      font-weight: 700;
      color: #FFFFFF;
      margin-bottom: 8px;
    }
    .concept-card .desc {
      font-size: 26px;
      color: #B0B0CC;
      line-height: 1.5;
    }
    .spiral-title {
      font-size: 30px;
      font-weight: 700;
      color: #EF4444;
      margin-bottom: 36px;
      letter-spacing: 1px;
    }
    .spiral-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      width: 100%;
      max-width: 720px;
    }
    .spiral-step {
      background: #1A1A2E;
      border: 1px solid rgba(239, 68, 68, 0.25);
      border-radius: 12px;
      padding: 22px 32px;
      width: 100%;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .spiral-step .step-num {
      font-size: 56px;
      font-weight: 800;
      color: #EF4444;
      flex-shrink: 0;
      width: 64px;
      text-align: center;
    }
    .spiral-step .step-text {
      font-size: 32px;
      font-weight: 700;
      color: #FFFFFF;
    }
    .spiral-arrow {
      font-size: 36px;
      color: #EF4444;
      padding: 6px 0;
      opacity: 0.7;
    }
    .spiral-step:nth-child(7) {
      border-color: rgba(239, 68, 68, 0.5);
      background: rgba(239, 68, 68, 0.08);
    }
    .loop-indicator {
      margin-top: 12px;
      font-size: 28px;
      color: #EF4444;
      font-weight: 700;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="section-label">核心概念</div>

    <div class="concept-card">
      <div class="en-title">Abundant Intelligence</div>
      <div class="cn-title">智能过剩</div>
      <div class="desc">当AI能力无限供给，软件边际成本趋近于零</div>
    </div>

    <div class="spiral-title">通缩死亡螺旋 Deflationary Loop</div>

    <div class="spiral-container">
      <div class="spiral-step">
        <div class="step-num">1</div>
        <div class="step-text">AI替代岗位 &rarr; 裁员</div>
      </div>
      <div class="spiral-arrow">&darr;</div>
      <div class="spiral-step">
        <div class="step-num">2</div>
        <div class="step-text">消费能力下降</div>
      </div>
      <div class="spiral-arrow">&darr;</div>
      <div class="spiral-step">
        <div class="step-num">3</div>
        <div class="step-text">企业营收下滑</div>
      </div>
      <div class="spiral-arrow">&darr;</div>
      <div class="spiral-step">
        <div class="step-num">4</div>
        <div class="step-text">更多裁员 &rarr; 循环</div>
      </div>
      <div class="loop-indicator">&circlearrowleft; 自我强化循环</div>
    </div>
  </div>
</body>
</html>
