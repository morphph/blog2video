<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1080px; height: 1920px; background: #0D0D1A; font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif; color: #FFFFFF; overflow: hidden; }
    .slide {
      width: 100%; height: 100%;
      padding: 120px 72px 520px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
    }
    .section-label {
      font-size: 24px;
      color: #F59E0B;
      letter-spacing: 3px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    .section-title {
      font-size: 44px;
      font-weight: 800;
      color: #FFFFFF;
      margin-bottom: 48px;
    }
    .section-title .warn {
      color: #EF4444;
    }
    .checklist {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
      max-width: 920px;
    }
    .check-item {
      background: #1A1A2E;
      border: 1px solid rgba(245, 158, 11, 0.2);
      border-left: 4px solid #F59E0B;
      border-radius: 12px;
      padding: 28px 28px 28px 24px;
      display: flex;
      align-items: center;
      gap: 20px;
      text-align: left;
    }
    .check-icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(245, 158, 11, 0.12);
      border: 2px solid #F59E0B;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .check-icon svg {
      width: 28px;
      height: 28px;
    }
    .check-content {
      flex: 1;
    }
    .check-title {
      font-size: 32px;
      font-weight: 700;
      color: #FFFFFF;
      margin-bottom: 6px;
    }
    .check-desc {
      font-size: 24px;
      color: #B0B0CC;
      line-height: 1.4;
    }
    .check-num {
      font-size: 56px;
      font-weight: 800;
      color: #F59E0B;
      flex-shrink: 0;
      width: 60px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="section-label">WARNING SIGNALS</div>
    <div class="section-title">四大<span class="warn">预警信号</span></div>

    <div class="checklist">
      <div class="check-item">
        <div class="check-num">1</div>
        <div class="check-content">
          <div class="check-title">核心功能可被AI复制</div>
          <div class="check-desc">护城河是技术还是网络效应？</div>
        </div>
      </div>

      <div class="check-item">
        <div class="check-num">2</div>
        <div class="check-content">
          <div class="check-title">收入依赖信息差</div>
          <div class="check-desc">中介模式正在被AI消解</div>
        </div>
      </div>

      <div class="check-item">
        <div class="check-num">3</div>
        <div class="check-content">
          <div class="check-title">客户切换成本低</div>
          <div class="check-desc">用户能无痛迁移到AI方案？</div>
        </div>
      </div>

      <div class="check-item">
        <div class="check-num">4</div>
        <div class="check-content">
          <div class="check-title">估值建立在增长预期</div>
          <div class="check-desc">增长逻辑是否已被AI颠覆？</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
