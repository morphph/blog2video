<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1080px; height: 1920px; background: #0D0D1A; font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif; color: #FFFFFF; overflow: hidden; }
    .slide { width: 100%; height: 100%; padding: 120px 72px 520px 72px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; position: relative; }
    .series-tag {
      font-size: 24px;
      color: #8B5CF6;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 48px;
      font-weight: 600;
    }
    .tension-card {
      background: #1A1A2E;
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 12px;
      padding: 48px 40px;
      width: 100%;
      margin-bottom: 48px;
      position: relative;
    }
    .tension-card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: #EF4444;
      border-radius: 12px 0 0 12px;
    }
    .score-row {
      display: flex;
      justify-content: center;
      gap: 64px;
      margin-bottom: 40px;
    }
    .score-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .score-number {
      font-size: 80px;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 8px;
    }
    .score-number.green { color: #10B981; }
    .score-number.blue { color: #3B82F6; }
    .score-label {
      font-size: 24px;
      color: #6B7280;
      font-weight: 500;
    }
    .score-sublabel {
      font-size: 20px;
      color: #B0B0CC;
      margin-top: 4px;
    }
    .divider {
      width: 100%;
      height: 1px;
      background: rgba(139, 92, 246, 0.15);
      margin: 32px 0;
    }
    .status-text {
      font-size: 32px;
      color: #EF4444;
      font-weight: 700;
      letter-spacing: 2px;
    }
    .status-icon {
      font-size: 40px;
      margin-bottom: 12px;
    }
    .hook-text {
      font-size: 30px;
      color: #B0B0CC;
      line-height: 1.7;
      margin-top: 40px;
      text-align: left;
      width: 100%;
    }
    .hook-text .highlight {
      color: #F59E0B;
      font-weight: 700;
    }
    .title-text {
      font-size: 40px;
      font-weight: 800;
      line-height: 1.4;
      margin-bottom: 48px;
      color: #FFFFFF;
    }
    .title-text .red { color: #EF4444; }
  </style>
</head>
<body>
<div class="slide">
  <div class="series-tag">AI精读 &middot; 金融危机</div>

  <div class="title-text">
    <span class="red">780分</span>优质借款人<br>为何突然断供？
  </div>

  <div class="tension-card">
    <div class="score-row">
      <div class="score-item">
        <div class="score-number green">780<span style="font-size:40px;">+</span></div>
        <div class="score-label">信用评分</div>
        <div class="score-sublabel">银行眼中"最安全"</div>
      </div>
      <div class="score-item">
        <div class="score-number blue">20<span style="font-size:40px;">%</span></div>
        <div class="score-label">首付比例</div>
        <div class="score-sublabel">标准优质贷款</div>
      </div>
    </div>
    <div class="divider"></div>
    <div style="text-align:center;">
      <div class="status-icon">&#9888;</div>
      <div class="status-text">状态：断供 DEFAULTING</div>
    </div>
  </div>

  <div class="hook-text">
    不是因为乱花钱，<br>而是因为<span class="highlight">AI把他们的工作消灭了</span>。
  </div>
</div>
</body>
</html>
