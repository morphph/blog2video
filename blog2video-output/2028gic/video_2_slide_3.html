<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1080px; height: 1920px; background: #0D0D1A; font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif; color: #FFFFFF; overflow: hidden; }
    .slide { width: 100%; height: 100%; padding: 120px 72px 520px 72px; display: flex; flex-direction: column; justify-content: flex-start; align-items: center; text-align: center; position: relative; }
    .slide-label {
      font-size: 20px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 600;
      margin-bottom: 20px;
    }
    .slide-title {
      font-size: 38px;
      font-weight: 800;
      color: #FFFFFF;
      margin-bottom: 36px;
      line-height: 1.3;
    }
    .slide-title .red { color: #EF4444; }
    .columns {
      display: flex;
      gap: 20px;
      width: 100%;
      flex: 1;
    }
    .column {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .col-header {
      background: #1A1A2E;
      border-radius: 12px;
      padding: 20px 16px;
      text-align: center;
    }
    .col-header-label {
      font-size: 18px;
      color: #6B7280;
      font-weight: 500;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }
    .col-header-title {
      font-size: 28px;
      font-weight: 800;
      line-height: 1.3;
    }
    .col-header-title.red { color: #EF4444; }
    .col-header-title.yellow { color: #F59E0B; }
    .chain-card {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.15);
      border-radius: 12px;
      padding: 18px 16px;
      text-align: left;
      position: relative;
    }
    .chain-card.path-a {
      border-left: 4px solid #F59E0B;
    }
    .chain-card.path-b {
      border-left: 4px solid #EF4444;
    }
    .card-step {
      font-size: 16px;
      color: #6B7280;
      font-weight: 600;
      margin-bottom: 6px;
      letter-spacing: 1px;
    }
    .card-title {
      font-size: 24px;
      font-weight: 700;
      color: #FFFFFF;
      margin-bottom: 4px;
      line-height: 1.3;
    }
    .card-desc {
      font-size: 19px;
      color: #B0B0CC;
      line-height: 1.4;
    }
    .card-number {
      font-size: 32px;
      font-weight: 800;
      margin-top: 8px;
    }
    .card-number.yellow { color: #F59E0B; }
    .card-number.red { color: #EF4444; }
    .arrow-down {
      text-align: center;
      font-size: 24px;
      color: #6B7280;
      line-height: 1;
      padding: 2px 0;
    }
    .city-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }
    .city-tag {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 18px;
      color: #EF4444;
      font-weight: 600;
    }
    .vs-badge {
      width: 48px;
      height: 48px;
      background: rgba(139, 92, 246, 0.2);
      border: 1px solid rgba(139, 92, 246, 0.4);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 800;
      color: #8B5CF6;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
    }
    .columns-wrapper {
      position: relative;
      width: 100%;
      flex: 1;
    }
  </style>
</head>
<body>
<div class="slide">
  <div class="slide-label">TWO FINANCIAL BOMBS</div>
  <div class="slide-title">
    两条<span class="red">引爆路径</span>
  </div>

  <div class="columns-wrapper">
    <div class="columns">
      <!-- Path 1: Private Credit -->
      <div class="column">
        <div class="col-header">
          <div class="col-header-label">PATH 1</div>
          <div class="col-header-title yellow">私募信贷<br>传导链</div>
        </div>

        <div class="chain-card path-a">
          <div class="card-step">STEP 1</div>
          <div class="card-title">私募信贷违约</div>
          <div class="card-desc">科技企业债务爆雷</div>
          <div class="card-number yellow">$50亿</div>
        </div>

        <div class="arrow-down">&#9660;</div>

        <div class="chain-card path-a">
          <div class="card-step">STEP 2</div>
          <div class="card-title">PE基金受损</div>
          <div class="card-desc">底层资产缩水，LP被套</div>
        </div>

        <div class="arrow-down">&#9660;</div>

        <div class="chain-card path-a">
          <div class="card-step">STEP 3</div>
          <div class="card-title">保险资金链断裂</div>
          <div class="card-desc">险资重仓私募，赔付承压</div>
        </div>
      </div>

      <!-- Path 2: Mortgage -->
      <div class="column">
        <div class="col-header">
          <div class="col-header-label">PATH 2</div>
          <div class="col-header-title red">$13万亿<br>房贷市场</div>
        </div>

        <div class="chain-card path-b">
          <div class="card-step">STEP 1</div>
          <div class="card-title">AI取代白领岗位</div>
          <div class="card-desc">高薪科技从业者失业</div>
        </div>

        <div class="arrow-down">&#9660;</div>

        <div class="chain-card path-b">
          <div class="card-step">STEP 2</div>
          <div class="card-title">780+优质借款人断供</div>
          <div class="card-desc">"最安全"群体变高危</div>
        </div>

        <div class="arrow-down">&#9660;</div>

        <div class="chain-card path-b">
          <div class="card-step">STEP 3</div>
          <div class="card-title">科技城市房价崩盘</div>
          <div class="city-tags">
            <span class="city-tag">San Francisco</span>
            <span class="city-tag">Seattle</span>
            <span class="city-tag">Austin</span>
          </div>
        </div>
      </div>
    </div>

    <div class="vs-badge">VS</div>
  </div>
</div>
</body>
</html>
