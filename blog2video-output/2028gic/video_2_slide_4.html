<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1080px; height: 1920px; background: #0D0D1A; font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif; color: #FFFFFF; overflow: hidden; }
    .slide { width: 100%; height: 100%; padding: 120px 72px 520px 72px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; position: relative; }
    .slide-label {
      font-size: 20px;
      color: #10B981;
      letter-spacing: 3px;
      font-weight: 600;
      margin-bottom: 24px;
    }
    .slide-title {
      font-size: 42px;
      font-weight: 800;
      color: #FFFFFF;
      margin-bottom: 48px;
      line-height: 1.3;
    }
    .slide-title .green { color: #10B981; }
    .checklist {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .check-item {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.15);
      border-radius: 12px;
      padding: 28px 28px;
      display: flex;
      align-items: flex-start;
      gap: 20px;
      text-align: left;
      position: relative;
    }
    .check-item::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      border-radius: 12px 0 0 12px;
    }
    .check-item:nth-child(1)::before { background: #EF4444; }
    .check-item:nth-child(2)::before { background: #F59E0B; }
    .check-item:nth-child(3)::before { background: #3B82F6; }
    .check-item:nth-child(4)::before { background: #8B5CF6; }
    .check-icon {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      flex-shrink: 0;
    }
    .check-icon.red { background: rgba(239, 68, 68, 0.15); }
    .check-icon.yellow { background: rgba(245, 158, 11, 0.15); }
    .check-icon.blue { background: rgba(59, 130, 246, 0.15); }
    .check-icon.purple { background: rgba(139, 92, 246, 0.15); }
    .check-content {
      flex: 1;
    }
    .check-title {
      font-size: 28px;
      font-weight: 700;
      color: #FFFFFF;
      margin-bottom: 8px;
      line-height: 1.3;
    }
    .check-desc {
      font-size: 22px;
      color: #B0B0CC;
      line-height: 1.5;
    }
    .check-desc .highlight {
      font-weight: 700;
    }
    .check-desc .red { color: #EF4444; }
    .check-desc .yellow { color: #F59E0B; }
    .check-desc .blue { color: #3B82F6; }
    .check-desc .purple { color: #8B5CF6; }
    .check-number {
      font-size: 20px;
      color: #6B7280;
      font-weight: 800;
      position: absolute;
      top: 28px;
      right: 28px;
    }
  </style>
</head>
<body>
<div class="slide">
  <div class="slide-label">SELF-CHECK</div>
  <div class="slide-title">
    你的财务<span class="green">体检清单</span>
  </div>

  <div class="checklist">
    <div class="check-item">
      <div class="check-icon red">&#128176;</div>
      <div class="check-content">
        <div class="check-title">收入集中度风险</div>
        <div class="check-desc">你的收入是否<span class="highlight red">依赖单一雇主或单一行业</span>？AI冲击下，单一来源 = 致命弱点</div>
      </div>
      <div class="check-number">01</div>
    </div>

    <div class="check-item">
      <div class="check-icon yellow">&#128200;</div>
      <div class="check-content">
        <div class="check-title">负债收入比</div>
        <div class="check-desc">月供占税后收入比例是否 <span class="highlight yellow">&gt; 35%</span>？超标意味着零容错空间</div>
      </div>
      <div class="check-number">02</div>
    </div>

    <div class="check-item">
      <div class="check-icon blue">&#128179;</div>
      <div class="check-content">
        <div class="check-title">应急储备金</div>
        <div class="check-desc">你有几个月的<span class="highlight blue">纯现金应急储备</span>？建议 &ge; 12个月固定支出</div>
      </div>
      <div class="check-number">03</div>
    </div>

    <div class="check-item">
      <div class="check-icon purple">&#127961;</div>
      <div class="check-content">
        <div class="check-title">城市集中度</div>
        <div class="check-desc">房产是否集中在<span class="highlight purple">单一科技城市</span>？SF/Seattle/Austin 首当其冲</div>
      </div>
      <div class="check-number">04</div>
    </div>
  </div>
</div>
</body>
</html>
