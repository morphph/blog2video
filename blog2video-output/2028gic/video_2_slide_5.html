<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1080px; height: 1920px; background: #0D0D1A; font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif; color: #FFFFFF; overflow: hidden; }
    .slide { width: 100%; height: 100%; padding: 120px 72px 520px 72px; display: flex; flex-direction: column; justify-content: flex-start; align-items: center; text-align: center; position: relative; }
    .slide-label {
      font-size: 20px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 600;
      margin-bottom: 24px;
    }
    .slide-title {
      font-size: 40px;
      font-weight: 800;
      color: #FFFFFF;
      margin-bottom: 40px;
      line-height: 1.3;
    }
    .slide-title .purple { color: #8B5CF6; }
    .summary-section {
      width: 100%;
      margin-bottom: 32px;
    }
    .section-header {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 16px;
      text-align: left;
    }
    .section-header.yellow { color: #F59E0B; }
    .section-header.green { color: #10B981; }
    .pipeline-row {
      display: flex;
      gap: 16px;
      width: 100%;
    }
    .pipeline-card {
      flex: 1;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.15);
      border-radius: 12px;
      padding: 24px 20px;
      text-align: center;
      position: relative;
    }
    .pipeline-card.card-yellow {
      border-left: 4px solid #F59E0B;
    }
    .pipeline-card.card-red {
      border-left: 4px solid #EF4444;
    }
    .pipeline-icon {
      font-size: 36px;
      margin-bottom: 12px;
    }
    .pipeline-title {
      font-size: 24px;
      font-weight: 700;
      color: #FFFFFF;
      margin-bottom: 8px;
      line-height: 1.3;
    }
    .pipeline-number {
      font-size: 56px;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 4px;
    }
    .pipeline-number.yellow { color: #F59E0B; }
    .pipeline-number.red { color: #EF4444; }
    .pipeline-sub {
      font-size: 18px;
      color: #6B7280;
    }
    .pipeline-desc {
      font-size: 19px;
      color: #B0B0CC;
      line-height: 1.4;
      margin-top: 8px;
    }
    .divider {
      width: 100%;
      height: 1px;
      background: rgba(139, 92, 246, 0.15);
      margin: 8px 0 24px 0;
    }
    .action-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .action-item {
      background: #1A1A2E;
      border: 1px solid rgba(16, 185, 129, 0.2);
      border-radius: 12px;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      text-align: left;
      position: relative;
    }
    .action-item::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: #10B981;
      border-radius: 12px 0 0 12px;
    }
    .action-month {
      background: rgba(16, 185, 129, 0.15);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 18px;
      font-weight: 700;
      color: #10B981;
      flex-shrink: 0;
      white-space: nowrap;
    }
    .action-text {
      font-size: 24px;
      font-weight: 600;
      color: #FFFFFF;
      line-height: 1.3;
    }
    .action-text .highlight {
      color: #F59E0B;
      font-weight: 700;
    }
    .bottom-cta {
      margin-top: 32px;
      font-size: 24px;
      color: #B0B0CC;
      line-height: 1.6;
    }
    .bottom-cta .bold {
      color: #FFFFFF;
      font-weight: 700;
    }
  </style>
</head>
<body>
<div class="slide">
  <div class="slide-label">SUMMARY</div>
  <div class="slide-title">
    两条管道 + <span class="purple">行动清单</span>
  </div>

  <!-- Two Pipelines -->
  <div class="summary-section">
    <div class="section-header yellow">&#9632; 两条金融传导管道</div>
    <div class="pipeline-row">
      <div class="pipeline-card card-yellow">
        <div class="pipeline-icon">&#128163;</div>
        <div class="pipeline-title">私募信贷链</div>
        <div class="pipeline-number yellow">$50<span style="font-size:28px;">亿</span></div>
        <div class="pipeline-sub">Zendesk违约</div>
        <div class="pipeline-desc">私募 &rarr; PE &rarr; 保险</div>
      </div>
      <div class="pipeline-card card-red">
        <div class="pipeline-icon">&#127968;</div>
        <div class="pipeline-title">房贷市场</div>
        <div class="pipeline-number red">$13<span style="font-size:28px;">万亿</span></div>
        <div class="pipeline-sub">优质借款人断供</div>
        <div class="pipeline-desc">AI失业 &rarr; 断供 &rarr; 崩盘</div>
      </div>
    </div>
  </div>

  <div class="divider"></div>

  <!-- 12-month Action -->
  <div class="summary-section">
    <div class="section-header green">&#9632; 12个月现金行动</div>
    <div class="action-list">
      <div class="action-item">
        <div class="action-month">1-3月</div>
        <div class="action-text">盘清负债，削减非必要支出，建立<span class="highlight">12个月</span>应急金</div>
      </div>
      <div class="action-item">
        <div class="action-month">4-6月</div>
        <div class="action-text">收入多元化：副业、被动收入、跨行业技能储备</div>
      </div>
      <div class="action-item">
        <div class="action-month">7-12月</div>
        <div class="action-text">降低资产集中度，避免<span class="highlight">单城市、单行业</span>押注</div>
      </div>
    </div>
  </div>

  <div class="bottom-cta">
    <span class="bold">现在准备</span>，比危机来临时再行动，<br>成本低100倍。
  </div>
</div>
</body>
</html>
