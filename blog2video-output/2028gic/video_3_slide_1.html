<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1080px; height: 1920px; background: #0D0D1A; font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif; color: #FFFFFF; overflow: hidden; }
    .slide { width: 100%; height: 100%; padding: 120px 72px 520px 72px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; position: relative; }
    .series-tag {
      font-size: 26px;
      color: #8B5CF6;
      letter-spacing: 4px;
      margin-bottom: 48px;
      font-weight: 600;
    }
    .big-number-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 32px;
      margin-bottom: 40px;
    }
    .percent-block {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .percent-value {
      font-size: 140px;
      font-weight: 900;
      line-height: 1;
    }
    .percent-value.start { color: #F59E0B; }
    .percent-value.end { color: #EF4444; }
    .percent-label {
      font-size: 24px;
      color: #6B7280;
      margin-top: 8px;
    }
    .arrow {
      font-size: 80px;
      color: #EF4444;
      font-weight: 300;
      margin-top: -20px;
    }
    .drop-badge {
      background: rgba(239, 68, 68, 0.15);
      border: 2px solid rgba(239, 68, 68, 0.4);
      border-radius: 60px;
      padding: 16px 48px;
      margin-bottom: 48px;
    }
    .drop-badge-text {
      font-size: 42px;
      font-weight: 800;
      color: #EF4444;
    }
    .context-line {
      font-size: 32px;
      color: #B0B0CC;
      line-height: 1.6;
      max-width: 800px;
    }
    .context-line strong {
      color: #FFFFFF;
      font-weight: 700;
    }
    .subtitle {
      font-size: 26px;
      color: #6B7280;
      margin-top: 36px;
      letter-spacing: 2px;
    }
    .gdp-label {
      font-size: 28px;
      color: #B0B0CC;
      margin-bottom: 16px;
      letter-spacing: 2px;
    }
    .divider {
      width: 120px;
      height: 3px;
      background: linear-gradient(90deg, #EF4444, transparent);
      margin: 32px 0;
    }
  </style>
</head>
<body>
<div class="slide">
  <div class="series-tag">AI精读 &middot; 社会变革</div>
  <div class="gdp-label">劳动收入占 GDP 份额</div>
  <div class="big-number-row">
    <div class="percent-block">
      <div class="percent-value start">56%</div>
      <div class="percent-label">2026</div>
    </div>
    <div class="arrow">&rarr;</div>
    <div class="percent-block">
      <div class="percent-value end">46%</div>
      <div class="percent-label">2028</div>
    </div>
  </div>
  <div class="drop-badge">
    <div class="drop-badge-text">两年暴跌 10 个百分点</div>
  </div>
  <div class="divider"></div>
  <div class="context-line">
    打工人创造的财富占比<br>正在以<strong>史无前例</strong>的速度缩水
  </div>
  <div class="subtitle">The 2028 Global Intelligence Crisis</div>
</div>
</body>
</html>
