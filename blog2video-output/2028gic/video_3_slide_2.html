<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1080px; height: 1920px; background: #0D0D1A; font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif; color: #FFFFFF; overflow: hidden; }
    .slide { width: 100%; height: 100%; padding: 120px 72px 520px 72px; display: flex; flex-direction: column; justify-content: flex-start; align-items: center; text-align: center; position: relative; }
    .slide-label {
      font-size: 22px;
      color: #8B5CF6;
      letter-spacing: 6px;
      margin-bottom: 36px;
      font-weight: 600;
    }
    .title {
      font-size: 52px;
      font-weight: 900;
      margin-bottom: 12px;
      line-height: 1.2;
    }
    .title .en {
      color: #8B5CF6;
    }
    .title .zh {
      color: #FFFFFF;
    }
    .subtitle {
      font-size: 26px;
      color: #B0B0CC;
      margin-bottom: 40px;
    }
    /* Building metaphor */
    .building {
      width: 100%;
      max-width: 860px;
      position: relative;
      margin-bottom: 0;
    }
    .roof {
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.25), rgba(139, 92, 246, 0.1));
      border: 2px solid rgba(139, 92, 246, 0.3);
      border-radius: 12px 12px 0 0;
      padding: 24px 32px;
      text-align: center;
      margin-bottom: 0;
    }
    .roof-text {
      font-size: 26px;
      color: #B0B0CC;
      line-height: 1.5;
    }
    .roof-text strong {
      color: #FFFFFF;
      font-weight: 700;
    }
    .pillars {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 0;
    }
    .pillar {
      flex: 1;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 0;
      padding: 28px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .pillar-icon {
      font-size: 36px;
    }
    .pillar-label {
      font-size: 26px;
      font-weight: 700;
      color: #FFFFFF;
    }
    .pillar-sub {
      font-size: 20px;
      color: #6B7280;
    }
    .foundation {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.2), rgba(245, 158, 11, 0.08));
      border: 2px solid rgba(245, 158, 11, 0.4);
      border-left: 5px solid #F59E0B;
      border-radius: 0 0 12px 12px;
      padding: 28px 32px;
      text-align: center;
    }
    .foundation-label {
      font-size: 22px;
      color: #F59E0B;
      margin-bottom: 8px;
      font-weight: 600;
      letter-spacing: 2px;
    }
    .foundation-text {
      font-size: 32px;
      font-weight: 800;
      color: #F59E0B;
    }
    /* Erosion warning */
    .erosion {
      margin-top: 36px;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-left: 4px solid #EF4444;
      border-radius: 12px;
      padding: 24px 32px;
      width: 100%;
      max-width: 860px;
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .erosion-icon {
      font-size: 40px;
      flex-shrink: 0;
    }
    .erosion-text {
      font-size: 28px;
      color: #EF4444;
      font-weight: 700;
      text-align: left;
      line-height: 1.5;
    }
    .erosion-text span {
      color: #B0B0CC;
      font-weight: 400;
      font-size: 24px;
    }
  </style>
</head>
<body>
<div class="slide">
  <div class="slide-label">CORE CONCEPT</div>
  <div class="title">
    <span class="en">Intelligence Premium</span><br>
    <span class="zh">智力溢价</span>
  </div>
  <div class="subtitle">人类脑力 = 一切制度的根基</div>

  <div class="building">
    <div class="roof">
      <div class="roof-text">
        整个现代社会的制度大厦<br>
        <strong>都建立在同一个假设之上</strong>
      </div>
    </div>
    <div class="pillars">
      <div class="pillar">
        <div class="pillar-icon">🏛</div>
        <div class="pillar-label">税收体系</div>
        <div class="pillar-sub">所得税为主体</div>
      </div>
      <div class="pillar">
        <div class="pillar-icon">🏠</div>
        <div class="pillar-label">房贷制度</div>
        <div class="pillar-sub">以工资偿还</div>
      </div>
      <div class="pillar">
        <div class="pillar-icon">🛡</div>
        <div class="pillar-label">社会保障</div>
        <div class="pillar-sub">工资税支撑</div>
      </div>
    </div>
    <div class="foundation">
      <div class="foundation-label">THE FOUNDATION</div>
      <div class="foundation-text">"人的脑力值钱"</div>
    </div>
  </div>

  <div class="erosion">
    <div class="erosion-icon">⚠️</div>
    <div class="erosion-text">
      AI 正在侵蚀这个地基<br>
      <span>当智力不再稀缺，大厦的每根柱子都在动摇</span>
    </div>
  </div>
</div>
</body>
</html>
