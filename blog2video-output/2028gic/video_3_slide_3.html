<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1080px; height: 1920px; background: #0D0D1A; font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif; color: #FFFFFF; overflow: hidden; }
    .slide { width: 100%; height: 100%; padding: 120px 72px 520px 72px; display: flex; flex-direction: column; justify-content: flex-start; align-items: center; text-align: center; position: relative; }
    .slide-label {
      font-size: 22px;
      color: #EF4444;
      letter-spacing: 6px;
      margin-bottom: 24px;
      font-weight: 600;
    }
    .title {
      font-size: 48px;
      font-weight: 900;
      color: #FFFFFF;
      margin-bottom: 12px;
    }
    .title-en {
      font-size: 24px;
      color: #6B7280;
      margin-bottom: 40px;
      letter-spacing: 2px;
    }
    .columns {
      display: flex;
      gap: 24px;
      width: 100%;
      max-width: 936px;
      margin-bottom: 36px;
    }
    .col {
      flex: 1;
      background: #1A1A2E;
      border: 1px solid rgba(239, 68, 68, 0.2);
      border-radius: 12px;
      overflow: hidden;
    }
    .col-header {
      padding: 24px 20px 16px;
      text-align: center;
    }
    .col-header .direction {
      font-size: 56px;
      line-height: 1;
    }
    .col-header .col-title {
      font-size: 34px;
      font-weight: 800;
      margin-top: 8px;
    }
    .col-left .col-header { background: rgba(239, 68, 68, 0.1); }
    .col-left .col-title { color: #EF4444; }
    .col-right .col-header { background: rgba(239, 68, 68, 0.1); }
    .col-right .col-title { color: #EF4444; }
    .col-body {
      padding: 24px 24px 28px;
    }
    .col-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 20px;
      text-align: left;
    }
    .col-item:last-child { margin-bottom: 0; }
    .col-item .bullet {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #EF4444;
      flex-shrink: 0;
      margin-top: 10px;
    }
    .col-item .text {
      font-size: 24px;
      color: #B0B0CC;
      line-height: 1.5;
    }
    .col-item .text strong {
      color: #FFFFFF;
      font-weight: 700;
    }
    .col-number {
      font-size: 56px;
      font-weight: 800;
      color: #EF4444;
      margin-bottom: 4px;
    }
    .col-number-label {
      font-size: 20px;
      color: #6B7280;
      margin-bottom: 16px;
    }
    .gridlock-box {
      width: 100%;
      max-width: 936px;
      background: rgba(245, 158, 11, 0.08);
      border: 2px solid rgba(245, 158, 11, 0.3);
      border-left: 5px solid #F59E0B;
      border-radius: 12px;
      padding: 28px 32px;
    }
    .gridlock-title {
      font-size: 28px;
      font-weight: 800;
      color: #F59E0B;
      margin-bottom: 20px;
      text-align: left;
    }
    .bill-row {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
      text-align: left;
    }
    .bill-row:last-child { margin-bottom: 0; }
    .bill-badge {
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 20px;
      color: #F59E0B;
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .bill-name {
      font-size: 24px;
      color: #B0B0CC;
      line-height: 1.4;
    }
    .bill-name strong {
      color: #FFFFFF;
      font-weight: 700;
    }
    .stuck-icon {
      font-size: 28px;
      flex-shrink: 0;
    }
    .divider-line {
      width: 100%;
      max-width: 936px;
      height: 1px;
      background: rgba(255,255,255,0.06);
      margin: 28px 0;
    }
    .bottom-note {
      font-size: 24px;
      color: #6B7280;
      margin-top: 8px;
    }
  </style>
</head>
<body>
<div class="slide">
  <div class="slide-label">FISCAL PARALYSIS</div>
  <div class="title">财政瘫痪</div>
  <div class="title-en">Fiscal Paralysis</div>

  <div class="columns">
    <div class="col col-left">
      <div class="col-header">
        <div class="direction">📈</div>
        <div class="col-title">支出暴增</div>
      </div>
      <div class="col-body">
        <div style="text-align:center;">
          <div class="col-number">+34%</div>
          <div class="col-number-label">联邦支出增幅</div>
        </div>
        <div style="height:16px"></div>
        <div class="col-item">
          <div class="bullet"></div>
          <div class="text"><strong>AI基建</strong>投资激增</div>
        </div>
        <div class="col-item">
          <div class="bullet"></div>
          <div class="text"><strong>失业救济</strong>需求飙升</div>
        </div>
        <div class="col-item">
          <div class="bullet"></div>
          <div class="text"><strong>再培训</strong>项目扩张</div>
        </div>
      </div>
    </div>
    <div class="col col-right">
      <div class="col-header">
        <div class="direction">📉</div>
        <div class="col-title">收入骤降</div>
      </div>
      <div class="col-body">
        <div style="text-align:center;">
          <div class="col-number">-22%</div>
          <div class="col-number-label">所得税收入降幅</div>
        </div>
        <div style="height:16px"></div>
        <div class="col-item">
          <div class="bullet"></div>
          <div class="text"><strong>工资税</strong>基础萎缩</div>
        </div>
        <div class="col-item">
          <div class="bullet"></div>
          <div class="text"><strong>企业</strong>用AI替代人力</div>
        </div>
        <div class="col-item">
          <div class="bullet"></div>
          <div class="text"><strong>消费税</strong>因失业下滑</div>
        </div>
      </div>
    </div>
  </div>

  <div class="gridlock-box">
    <div class="gridlock-title">🔒 国会僵局：两项法案搁浅</div>
    <div class="bill-row">
      <div class="bill-badge">法案 A</div>
      <div class="bill-name"><strong>AI Dividend Act</strong> — 对AI产出征税补贴劳动者</div>
      <div class="stuck-icon">❌</div>
    </div>
    <div class="bill-row">
      <div class="bill-badge">法案 B</div>
      <div class="bill-name"><strong>Human Work Guarantee</strong> — 联邦保障人类就业岗位</div>
      <div class="stuck-icon">❌</div>
    </div>
  </div>

  <div class="bottom-note">支出涨 + 收入跌 = 赤字螺旋</div>
</div>
</body>
</html>
