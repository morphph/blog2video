<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1080px; height: 1920px; background: #0D0D1A; font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif; color: #FFFFFF; overflow: hidden; }
    .slide { width: 100%; height: 100%; padding: 120px 72px 520px 72px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; position: relative; }
    .quote-decoration-top {
      font-size: 180px;
      color: rgba(139, 92, 246, 0.25);
      line-height: 0.6;
      margin-bottom: 20px;
      font-family: Georgia, serif;
    }
    .quote-main {
      font-size: 64px;
      font-weight: 900;
      color: #FFFFFF;
      line-height: 1.3;
      margin-bottom: 16px;
      max-width: 800px;
    }
    .quote-main .highlight {
      color: #F59E0B;
    }
    .quote-decoration-bottom {
      font-size: 180px;
      color: rgba(139, 92, 246, 0.25);
      line-height: 0.3;
      margin-bottom: 48px;
      font-family: Georgia, serif;
    }
    .canary-visual {
      width: 100%;
      max-width: 720px;
      background: rgba(245, 158, 11, 0.06);
      border: 1px solid rgba(245, 158, 11, 0.2);
      border-radius: 16px;
      padding: 32px;
      margin-bottom: 40px;
      display: flex;
      align-items: center;
      gap: 28px;
    }
    .canary-icon {
      font-size: 72px;
      flex-shrink: 0;
    }
    .canary-text {
      text-align: left;
    }
    .canary-metaphor {
      font-size: 26px;
      color: #F59E0B;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .canary-explain {
      font-size: 22px;
      color: #6B7280;
      line-height: 1.5;
    }
    .divider {
      width: 80px;
      height: 3px;
      background: rgba(139, 92, 246, 0.4);
      margin-bottom: 36px;
    }
    .subtitle-box {
      background: rgba(139, 92, 246, 0.1);
      border: 1px solid rgba(139, 92, 246, 0.25);
      border-radius: 40px;
      padding: 14px 40px;
    }
    .subtitle-text {
      font-size: 28px;
      color: #8B5CF6;
      font-weight: 600;
      letter-spacing: 2px;
    }
    .en-quote {
      font-size: 22px;
      color: #6B7280;
      margin-top: 28px;
      font-style: italic;
    }
  </style>
</head>
<body>
<div class="slide">
  <div class="quote-decoration-top">&ldquo;</div>
  <div class="quote-main">
    <span class="highlight">金丝雀</span><br>仍然活着
  </div>
  <div class="quote-decoration-bottom">&rdquo;</div>

  <div class="canary-visual">
    <div class="canary-icon">🐤</div>
    <div class="canary-text">
      <div class="canary-metaphor">矿井中的金丝雀</div>
      <div class="canary-explain">
        矿工带金丝雀下矿井检测毒气——<br>
        金丝雀还活着，不代表矿井安全，<br>
        只代表毒气还没达到致命浓度。
      </div>
    </div>
  </div>

  <div class="divider"></div>

  <div class="subtitle-box">
    <div class="subtitle-text">情景分析，不是预测</div>
  </div>

  <div class="en-quote">"The canary is still alive — scenario, not prediction."</div>
</div>
</body>
</html>
