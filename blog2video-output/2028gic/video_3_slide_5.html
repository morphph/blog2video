<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1080px; height: 1920px; background: #0D0D1A; font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif; color: #FFFFFF; overflow: hidden; }
    .slide { width: 100%; height: 100%; padding: 120px 72px 520px 72px; display: flex; flex-direction: column; justify-content: flex-start; align-items: center; text-align: center; position: relative; }
    .slide-label {
      font-size: 22px;
      color: #10B981;
      letter-spacing: 6px;
      margin-bottom: 28px;
      font-weight: 600;
    }
    .title {
      font-size: 48px;
      font-weight: 900;
      color: #FFFFFF;
      margin-bottom: 8px;
    }
    .title-en {
      font-size: 24px;
      color: #6B7280;
      margin-bottom: 40px;
      letter-spacing: 2px;
    }
    .section {
      width: 100%;
      max-width: 936px;
      margin-bottom: 32px;
    }
    .section-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .section-number {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(16, 185, 129, 0.15);
      border: 2px solid rgba(16, 185, 129, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 800;
      color: #10B981;
      flex-shrink: 0;
    }
    .section-title {
      font-size: 28px;
      font-weight: 700;
      color: #10B981;
      text-align: left;
    }
    .reprice-card {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-left: 4px solid #8B5CF6;
      border-radius: 12px;
      padding: 28px 28px;
      text-align: left;
    }
    .reprice-title {
      font-size: 32px;
      font-weight: 800;
      color: #8B5CF6;
      margin-bottom: 16px;
    }
    .reprice-desc {
      font-size: 24px;
      color: #B0B0CC;
      line-height: 1.6;
    }
    .reprice-desc strong {
      color: #FFFFFF;
      font-weight: 700;
    }
    .capability-cards {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .cap-card {
      background: #1A1A2E;
      border: 1px solid rgba(16, 185, 129, 0.2);
      border-left: 4px solid #10B981;
      border-radius: 12px;
      padding: 24px 28px;
      display: flex;
      align-items: center;
      gap: 20px;
      text-align: left;
    }
    .cap-icon {
      font-size: 40px;
      flex-shrink: 0;
    }
    .cap-content {}
    .cap-name {
      font-size: 28px;
      font-weight: 800;
      color: #FFFFFF;
      margin-bottom: 6px;
    }
    .cap-desc {
      font-size: 22px;
      color: #6B7280;
      line-height: 1.4;
    }
    .divider-line {
      width: 100%;
      max-width: 936px;
      height: 1px;
      background: rgba(255,255,255,0.06);
      margin: 4px 0 32px;
    }
    .bottom-cta {
      margin-top: 20px;
      font-size: 26px;
      color: #F59E0B;
      font-weight: 700;
    }
  </style>
</head>
<body>
<div class="slide">
  <div class="slide-label">TAKEAWAY</div>
  <div class="title">你该怎么办？</div>
  <div class="title-en">Action Plan</div>

  <div class="section">
    <div class="section-header">
      <div class="section-number">1</div>
      <div class="section-title">理解「制度重新定价」</div>
    </div>
    <div class="reprice-card">
      <div class="reprice-title">Institutional Repricing</div>
      <div class="reprice-desc">
        税制、社保、房贷——这些看似稳固的制度<br>
        <strong>都在被AI重新定价</strong>，理解变化才能提前布局
      </div>
    </div>
  </div>

  <div class="divider-line"></div>

  <div class="section">
    <div class="section-header">
      <div class="section-number">2</div>
      <div class="section-title">培养 AI-Proof 能力</div>
    </div>
    <div class="capability-cards">
      <div class="cap-card">
        <div class="cap-icon">🤝</div>
        <div class="cap-content">
          <div class="cap-name">深度人际连接</div>
          <div class="cap-desc">AI无法替代的信任与共情</div>
        </div>
      </div>
      <div class="cap-card">
        <div class="cap-icon">🎨</div>
        <div class="cap-content">
          <div class="cap-name">跨域创造力</div>
          <div class="cap-desc">连接不同领域的原创洞察</div>
        </div>
      </div>
      <div class="cap-card">
        <div class="cap-icon">🧭</div>
        <div class="cap-content">
          <div class="cap-name">复杂判断力</div>
          <div class="cap-desc">模糊情境下的价值权衡与决策</div>
        </div>
      </div>
    </div>
  </div>

  <div class="bottom-cta">当智力变廉价，稀缺的是智慧</div>
</div>
</body>
</html>
