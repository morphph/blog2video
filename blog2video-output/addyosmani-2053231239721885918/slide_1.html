<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1920px; background:#0D0D1A;
    font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;
    color:#FFFFFF; overflow:hidden; }
  .slide { width:100%; height:100%; padding:200px 72px 420px 72px;
    display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; position:relative; }
  .slide::before { content:''; position:absolute; inset:0;
    background:radial-gradient(circle at 50% 30%, rgba(139,92,246,0.12) 0%, transparent 55%); }
  .kicker { font-size:30px; color:#8B5CF6; letter-spacing:3px; font-weight:600; margin-bottom:36px; position:relative; }
  .author-card { width:100%; background:#1A1A2E; border:1px solid rgba(139,92,246,0.4);
    border-left:4px solid #8B5CF6; border-radius:12px; padding:28px; margin-bottom:36px; position:relative; }
  .author-name { font-size:38px; font-weight:800; color:#8B5CF6; margin-bottom:8px; }
  .author-role { font-size:22px; color:#FFFFFF; line-height:1.5; }
  .verdict { font-size:54px; font-weight:900; line-height:1.3; margin-bottom:36px; position:relative; }
  .verdict .red { color:#EF4444; }
  .stats { display:flex; gap:20px; width:100%; position:relative; }
  .s { flex:1; background:#1A1A2E; border:1px solid rgba(139,92,246,0.25); border-radius:12px; padding:22px 18px; text-align:center; }
  .s-num { font-size:36px; font-weight:800; color:#F59E0B; line-height:1; margin-bottom:8px; }
  .s-lab { font-size:18px; color:#B0B0CC; }
</style>
</head>
<body>
  <div class="slide">
    <div class="kicker">反向告白 · 不是谦虚 是预告</div>
    <div class="author-card">
      <div class="author-name">Addy Osmani</div>
      <div class="author-role">Director · Google Cloud AI · Gemini Agents<br>Prev: Google Chrome Engineering</div>
    </div>
    <div class="verdict">公开说<br>模型<span class="red">不是胜负手</span></div>
    <div class="stats">
      <div class="s"><div class="s-num">832K</div><div class="s-lab">阅读</div></div>
      <div class="s"><div class="s-num">7.9K</div><div class="s-lab">收藏</div></div>
      <div class="s"><div class="s-num">3.3K</div><div class="s-lab">点赞</div></div>
    </div>
  </div>
</body>
</html>
