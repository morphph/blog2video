<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1920px; background:#0D0D1A;
    font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;
    color:#FFFFFF; overflow:hidden; }
  .slide { width:100%; height:100%; padding:200px 72px 420px 72px;
    display:flex; flex-direction:column; justify-content:center; align-items:center; }
  .kicker { font-size:28px; color:#8B5CF6; letter-spacing:3px; font-weight:600; margin-bottom:28px; }
  .title { font-size:54px; font-weight:900; line-height:1.3; margin-bottom:32px; text-align:center; }
  .title .amber { color:#F59E0B; }
  .analogy { width:100%; background:#1A1A2E; border:1px solid rgba(245,158,11,0.4);
    border-left:4px solid #F59E0B; border-radius:12px; padding:24px 28px; margin-bottom:24px; text-align:center; }
  .analogy-tag { font-size:22px; color:#F59E0B; font-weight:800; letter-spacing:2px; margin-bottom:14px; }
  .analogy-text { font-size:28px; font-weight:700; line-height:1.4; }
  .analogy-text strong { color:#F59E0B; }
  .quote { width:100%; background:#0D0D1A; border:2px solid rgba(239,68,68,0.5);
    border-radius:12px; padding:24px 28px; margin-bottom:24px; font-size:26px; font-weight:700;
    line-height:1.5; text-align:center; }
  .quote .red { color:#EF4444; font-weight:800; }
  .signal { width:100%; background:linear-gradient(135deg,#1A1A2E,#2A1A3A);
    border:1px solid rgba(139,92,246,0.4); border-radius:12px; padding:24px;
    text-align:center; font-size:24px; line-height:1.5; }
  .signal strong { color:#F59E0B; }
</style>
</head>
<body>
  <div class="slide">
    <div class="kicker">这个画面有多怪</div>
    <div class="title">Gemini Director<br>说"<span class="amber">换什么模型不重要</span>"</div>
    <div class="analogy">
      <div class="analogy-tag">和这事一个量级</div>
      <div class="analogy-text">苹果出来说<br><strong>"你买什么手机不重要"</strong></div>
    </div>
    <div class="quote">相同模型 · 不同 Harness<br>分数出现<span class="red"> 剧烈 </span>差距</div>
    <div class="signal">信号：模型厂商自己承认——<br>下一阶段竞争<strong> 不在模型那张卡上</strong></div>
  </div>
</body>
</html>
