<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1920px; background:#0D0D1A;
    font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;
    color:#FFFFFF; overflow:hidden; }
  .slide { width:100%; height:100%; padding:200px 72px 420px 72px;
    display:flex; flex-direction:column; justify-content:center; align-items:center; }
  .kicker { font-size:28px; color:#8B5CF6; letter-spacing:3px; font-weight:600; margin-bottom:28px; }
  .title { font-size:60px; font-weight:900; line-height:1.3; margin-bottom:36px; text-align:center; }
  .title .amber { color:#F59E0B; }
  .scenario { width:100%; background:#1A1A2E; border:1px solid rgba(239,68,68,0.4);
    border-left:4px solid #EF4444; border-radius:12px; padding:20px 26px; margin-bottom:18px; font-size:22px; }
  .sc-tag { color:#EF4444; font-weight:800; font-size:20px; letter-spacing:2px; margin-bottom:10px; }
  .sc-text { color:#FFFFFF; }
  .gates { width:100%; display:flex; flex-direction:column; gap:10px; margin-bottom:24px; }
  .gate { background:#1A1A2E; border:1px solid rgba(139,92,246,0.25); border-left:4px solid #10B981;
    border-radius:10px; padding:14px 22px; display:flex; align-items:center; gap:16px; font-size:20px; }
  .g-num { font-size:22px; font-weight:800; color:#10B981; min-width:36px; }
  .g-text { color:#FFFFFF; font-weight:600; }
  .g-text strong { color:#F59E0B; }
  .verdict { width:100%; background:linear-gradient(135deg,#1A1A2E,#2A1A3A);
    border:1px solid rgba(245,158,11,0.4); border-radius:12px; padding:24px;
    font-size:24px; font-weight:800; line-height:1.45; text-align:center; }
  .verdict .amber { color:#F59E0B; }
</style>
</head>
<body>
  <div class="slide">
    <div class="kicker">RATCHET · 棘轮 · 只往一个方向走</div>
    <div class="title">每条规则<br>都是一道<span class="amber">疤痕</span></div>
    <div class="scenario">
      <div class="sc-tag">INPUT · 一次翻车</div>
      <div class="sc-text">Agent 提交了被注释掉的测试 · PR 被合并</div>
    </div>
    <div class="gates">
      <div class="gate"><div class="g-num">1</div><div class="g-text">AGENTS.md 加一行：<strong>绝不注释测试</strong></div></div>
      <div class="gate"><div class="g-num">2</div><div class="g-text">pre-commit hook 自动 flag <strong>.skip(</strong></div></div>
      <div class="gate"><div class="g-num">3</div><div class="g-text">Reviewer 子 Agent 加阻断规则</div></div>
    </div>
    <div class="verdict">想不起来的规则<br><span class="amber">就该删掉</span></div>
  </div>
</body>
</html>
