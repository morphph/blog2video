<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1920px; background:#0D0D1A;
    font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;
    color:#FFFFFF; overflow:hidden; }
  .slide { width:100%; height:100%; padding:200px 72px 420px 72px;
    display:flex; flex-direction:column; justify-content:center; align-items:center; }
  .kicker { font-size:28px; color:#8B5CF6; letter-spacing:3px; font-weight:600; margin-bottom:28px; }
  .title { font-size:60px; font-weight:900; line-height:1.3; margin-bottom:36px; text-align:center; }
  .title .amber { color:#F59E0B; }
  .arrow { width:100%; background:linear-gradient(135deg,#1A1A2E,#2A1A3A);
    border:1px solid rgba(139,92,246,0.4); border-radius:12px; padding:30px;
    text-align:center; margin-bottom:24px; }
  .arrow-row { font-size:32px; font-weight:800; margin-bottom:8px; }
  .from { color:#6B7280; text-decoration:line-through; }
  .arr { color:#F59E0B; margin:0 14px; }
  .to { color:#F59E0B; }
  .arrow-lab { font-size:20px; color:#B0B0CC; }
  .runtime { width:100%; background:#1A1A2E; border:1px solid rgba(245,158,11,0.4);
    border-left:4px solid #F59E0B; border-radius:12px; padding:22px 26px; margin-bottom:20px; }
  .r-tag { font-size:22px; color:#F59E0B; font-weight:800; letter-spacing:2px; margin-bottom:14px; }
  .r-list { display:flex; flex-wrap:wrap; gap:10px; }
  .r-pill { background:#0D0D1A; border:1px solid rgba(245,158,11,0.3);
    padding:10px 18px; border-radius:999px; font-size:20px; color:#FFFFFF; font-weight:600; }
  .pred { width:100%; background:#1A1A2E; border:1px solid rgba(239,68,68,0.4);
    border-left:4px solid #EF4444; border-radius:12px; padding:20px 26px; text-align:center; font-size:22px; line-height:1.5; }
  .pred strong { color:#EF4444; }
</style>
</head>
<body>
  <div class="slide">
    <div class="kicker">Harness-as-a-Service · HaaS</div>
    <div class="title">SDK 不再卖<br><span class="amber">completion</span></div>
    <div class="arrow">
      <div class="arrow-row"><span class="from">LLM API</span><span class="arr">→</span><span class="to">Harness API</span></div>
      <div class="arrow-lab">行业范式转移</div>
    </div>
    <div class="runtime">
      <div class="r-tag">RUNTIME 打包</div>
      <div class="r-list">
        <div class="r-pill">loop</div>
        <div class="r-pill">tools</div>
        <div class="r-pill">context</div>
        <div class="r-pill">hooks</div>
        <div class="r-pill">sandbox</div>
      </div>
    </div>
    <div class="pred">未来合同：不按 token 算钱 · <strong>按 runtime 实例算钱</strong></div>
  </div>
</body>
</html>
