<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 100px 72px 400px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .glow {
      position: absolute;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 800px;
      height: 800px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.18) 0%, transparent 60%);
      pointer-events: none;
    }
    .glow2 {
      position: absolute;
      top: 60%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 700px;
      height: 700px;
      background: radial-gradient(circle, rgba(239, 68, 68, 0.10) 0%, transparent 60%);
      pointer-events: none;
    }
    .series-tag {
      font-size: 30px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 600;
      margin-bottom: 80px;
      text-transform: uppercase;
      position: relative;
      z-index: 2;
    }
    .title {
      font-size: 92px;
      font-weight: 900;
      line-height: 1.25;
      color: #FFFFFF;
      margin-bottom: 120px;
      position: relative;
      z-index: 2;
    }
    .title .amber {
      color: #F59E0B;
    }
    .title .red {
      color: #EF4444;
    }
    .source-pill {
      background: #1A1A30;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 999px;
      padding: 16px 36px;
      font-size: 22px;
      color: #6B6B80;
      position: relative;
      z-index: 2;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="glow"></div>
    <div class="glow2"></div>
    <div class="series-tag">精读AI · Agent Orchestration</div>
    <h1 class="title">
      你能开 <span class="amber">20 个</span> Agent<br/>
      但<span class="red">只有一个你</span>
    </h1>
    <div class="source-pill">Addy Osmani · Google Cloud AI · Google I/O 2026</div>
  </div>
</body>
</html>
