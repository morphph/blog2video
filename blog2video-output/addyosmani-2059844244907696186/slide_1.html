<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .glow {
      position: absolute;
      top: 28%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 800px;
      height: 800px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.18) 0%, transparent 60%);
      pointer-events: none;
    }
    .series-tag {
      font-size: 28px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 600;
      margin-bottom: 60px;
      position: relative;
      z-index: 2;
    }
    .title {
      font-size: 88px;
      font-weight: 900;
      line-height: 1.22;
      color: #FFFFFF;
      margin-bottom: 110px;
      position: relative;
      z-index: 2;
    }
    .title .amber { color: #F59E0B; }
    .title .red { color: #EF4444; }
    .cards {
      display: flex;
      flex-direction: column;
      gap: 28px;
      width: 100%;
      position: relative;
      z-index: 2;
    }
    .card {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-left: 4px solid #F59E0B;
      border-radius: 12px;
      padding: 28px 32px;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 24px;
    }
    .card:nth-child(2) {
      border-left-color: #EF4444;
    }
    .card-num {
      font-size: 52px;
      font-weight: 800;
      color: #F59E0B;
      min-width: 64px;
    }
    .card:nth-child(2) .card-num { color: #EF4444; }
    .card-text {
      font-size: 32px;
      color: #FFFFFF;
      font-weight: 500;
      line-height: 1.35;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="glow"></div>
    <div class="series-tag">精读AI · Agent Orchestration</div>
    <h1 class="title">
      你能开 <span class="amber">20 个</span> Agent<br/>
      但<span class="red">只有一个你</span>
    </h1>
    <div class="cards">
      <div class="card">
        <div class="card-num">？</div>
        <div class="card-text">你才是 GIL，<br/>真正的瓶颈不在工具</div>
      </div>
      <div class="card">
        <div class="card-num">＄</div>
        <div class="card-text">编排税不付现金，<br/>付的是你对代码的理解</div>
      </div>
    </div>
  </div>
</body>
</html>
