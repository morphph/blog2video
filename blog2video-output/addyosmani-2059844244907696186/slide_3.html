<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .eyebrow {
      font-size: 26px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 600;
      margin-bottom: 36px;
    }
    .h1 {
      font-size: 60px;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 72px;
      color: #FFFFFF;
    }
    .h1 .green { color: #10B981; }
    .h1 .red { color: #EF4444; }
    .pair {
      display: flex;
      gap: 24px;
      width: 100%;
      margin-bottom: 60px;
    }
    .card {
      flex: 1;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 36px 28px;
      text-align: center;
    }
    .card.open {
      border-left: 4px solid #10B981;
    }
    .card.close {
      border-left: 4px solid #EF4444;
    }
    .card-label {
      font-size: 26px;
      color: #B0B0CC;
      letter-spacing: 2px;
      margin-bottom: 18px;
      font-weight: 600;
    }
    .card-num {
      font-size: 88px;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 14px;
    }
    .card.open .card-num { color: #10B981; }
    .card.close .card-num { color: #EF4444; }
    .card-desc {
      font-size: 26px;
      color: #FFFFFF;
      font-weight: 600;
      line-height: 1.4;
    }
    .card-sub {
      font-size: 22px;
      color: #B0B0CC;
      margin-top: 14px;
      line-height: 1.5;
    }
    .bottom-card {
      background: #1A1A2E;
      border: 1px solid rgba(239, 68, 68, 0.4);
      border-left: 4px solid #EF4444;
      border-radius: 12px;
      padding: 32px 36px;
      text-align: left;
      width: 100%;
      font-size: 32px;
      font-weight: 600;
      line-height: 1.45;
    }
    .bottom-card .red { color: #EF4444; }
    .bottom-card .amber { color: #F59E0B; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="eyebrow">THE ASYMMETRY · 开 vs 关</div>
    <h1 class="h1"><span class="green">开 Agent 是免费的</span><br/><span class="red">关 Agent 不是</span></h1>
    <div class="pair">
      <div class="card open">
        <div class="card-label">START</div>
        <div class="card-num">$0</div>
        <div class="card-desc">一个 keystroke<br/>一句 prompt</div>
        <div class="card-sub">5、10、20 个都能开</div>
      </div>
      <div class="card close">
        <div class="card-label">CLOSE THE LOOP</div>
        <div class="card-num">$$$</div>
        <div class="card-desc">判断对错<br/>解 merge 冲突</div>
        <div class="card-sub">模型不能替你做<br/>另一个 Agent 也不能</div>
      </div>
    </div>
    <div class="bottom-card">
      你不是<span class="amber">系统的指挥官</span>，<br/>
      你是系统里<span class="red">最慢的串行组件</span>
    </div>
  </div>
</body>
</html>
