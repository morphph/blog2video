<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .eyebrow {
      font-size: 26px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 600;
      margin-bottom: 28px;
    }
    .h1 {
      font-size: 56px;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 50px;
      color: #FFFFFF;
    }
    .h1 .red { color: #EF4444; }
    .h1 .amber { color: #F59E0B; }
    .util-bar {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 32px;
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .util-label {
      font-size: 24px;
      color: #B0B0CC;
      letter-spacing: 2px;
      font-weight: 600;
      min-width: 96px;
      text-align: left;
    }
    .util-meter {
      flex: 1;
      height: 32px;
      background: #0D0D1A;
      border-radius: 8px;
      position: relative;
      overflow: hidden;
    }
    .util-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #F59E0B, #EF4444);
    }
    .util-num {
      font-size: 36px;
      font-weight: 800;
      color: #EF4444;
      min-width: 110px;
    }
    .compare-row {
      display: flex;
      gap: 20px;
      width: 100%;
      margin-bottom: 32px;
    }
    .compare-card {
      flex: 1;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 26px 22px;
      text-align: center;
    }
    .compare-card.cpu {
      border-left: 4px solid #10B981;
    }
    .compare-card.brain {
      border-left: 4px solid #EF4444;
    }
    .compare-label {
      font-size: 22px;
      color: #B0B0CC;
      letter-spacing: 2px;
      margin-bottom: 14px;
      font-weight: 600;
    }
    .compare-value {
      font-size: 56px;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 10px;
    }
    .compare-card.cpu .compare-value { color: #10B981; }
    .compare-card.brain .compare-value { color: #EF4444; }
    .compare-desc {
      font-size: 22px;
      color: #FFFFFF;
      line-height: 1.4;
      font-weight: 500;
    }
    .verdict {
      background: #1A1A2E;
      border-left: 4px solid #EF4444;
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-radius: 12px;
      padding: 28px 30px;
      font-size: 28px;
      font-weight: 600;
      width: 100%;
      color: #FFFFFF;
      line-height: 1.45;
      text-align: left;
    }
    .verdict .red { color: #EF4444; }
    .verdict .amber { color: #F59E0B; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="eyebrow">累的来源 · 不是态度，是结构</div>
    <h1 class="h1"><span class="red">100%</span> 利用率<br/>不留任何 <span class="amber">slack</span></h1>
    <div class="util-bar">
      <div class="util-label">YOU</div>
      <div class="util-meter"><div class="util-fill"></div></div>
      <div class="util-num">100%</div>
    </div>
    <div class="compare-row">
      <div class="compare-card cpu">
        <div class="compare-label">CPU SWITCH</div>
        <div class="compare-value">μs</div>
        <div class="compare-desc">微秒级<br/>架构师还在拼命避免</div>
      </div>
      <div class="compare-card brain">
        <div class="compare-label">YOUR BRAIN</div>
        <div class="compare-value">min</div>
        <div class="compare-desc">分钟级<br/>永远 reload 不到 100%</div>
      </div>
    </div>
    <div class="verdict">
      不付税 → <span class="red">code review 变浅</span>，<br/>
      接受 Agent 的代码 ≠ 因为它对，<br/>
      = 你已经 <span class="amber">cognitive surrender</span>
    </div>
  </div>
</body>
</html>
