<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .eyebrow {
      font-size: 26px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 600;
      margin-bottom: 32px;
    }
    .h1 {
      font-size: 60px;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 60px;
      color: #FFFFFF;
    }
    .h1 .red { color: #EF4444; }
    .h1 .amber { color: #F59E0B; }
    .core-card {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-left: 4px solid #8B5CF6;
      border-radius: 16px;
      padding: 44px 40px;
      text-align: left;
      width: 100%;
      margin-bottom: 32px;
    }
    .core-label {
      font-size: 24px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 22px;
    }
    .core-text {
      font-size: 38px;
      font-weight: 700;
      line-height: 1.4;
      color: #FFFFFF;
    }
    .core-text .purple { color: #8B5CF6; }
    .core-text .amber { color: #F59E0B; }
    .footnote {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 28px 32px;
      width: 100%;
      text-align: left;
      font-size: 26px;
      color: #B0B0CC;
      line-height: 1.5;
    }
    .footnote .white { color: #FFFFFF; font-weight: 600; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="eyebrow">PRINCIPLE · 给注意力做架构</div>
    <h1 class="h1">不是<span class="red">少用</span>，<br/>是给<span class="amber">自己做架构</span></h1>
    <div class="core-card">
      <div class="core-label">CORE PRINCIPLE</div>
      <div class="core-text">
        你的<span class="purple">注意力</span>是这套并发系统里<br/>
        <span class="amber">唯一不能复制的串行资源</span>——<br/>
        把它当真实的稀缺资源来做架构
      </div>
    </div>
    <div class="footnote">
      <span class="white">下面 5 条建议</span>，看似独立，<br/>
      其实是同一个原则的不同应用面。
    </div>
  </div>
</body>
</html>
