<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .cover {
      width: 100%;
      height: 100%;
      padding: 100px 72px 400px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .cover::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: radial-gradient(ellipse at center, rgba(139, 92, 246, 0.18) 0%, rgba(13, 13, 26, 0) 60%);
      pointer-events: none;
    }
    .series-tag {
      font-size: 30px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 600;
      margin-bottom: 80px;
      position: relative;
      z-index: 1;
    }
    .title {
      font-size: 92px;
      font-weight: 900;
      line-height: 1.25;
      letter-spacing: -1px;
      position: relative;
      z-index: 1;
      margin-bottom: 80px;
    }
    .title .accent-amber {
      color: #F59E0B;
    }
    .title .accent-red {
      color: #EF4444;
    }
    .source-pill {
      background: #1A1A30;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 999px;
      padding: 14px 36px;
      font-size: 22px;
      color: #6B6B80;
      position: relative;
      z-index: 1;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div class="cover">
    <div class="series-tag">精读AI · Loop Engineering</div>
    <div class="title">
      <span class="accent-amber">Loop Engineering</span><br>
      把自己从 prompt 循环里<span class="accent-red">拆出来</span>
    </div>
    <div class="source-pill">Addy Osmani · Google Cloud AI · 1.6 万收藏</div>
  </div>
</body>
</html>
