<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .slide::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(ellipse at top, rgba(245, 158, 11, 0.15) 0%, rgba(13, 13, 26, 0) 55%);
      pointer-events: none;
    }
    .eyebrow {
      font-size: 26px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 600;
      margin-bottom: 60px;
      position: relative;
      z-index: 1;
    }
    .headline {
      font-size: 84px;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 80px;
      position: relative;
      z-index: 1;
    }
    .headline .amber { color: #F59E0B; }
    .headline .red { color: #EF4444; }
    .cards {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 32px;
      position: relative;
      z-index: 1;
    }
    .card {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.25);
      border-left: 4px solid #EF4444;
      border-radius: 12px;
      padding: 32px 36px;
      text-align: left;
    }
    .card.amber { border-left-color: #F59E0B; }
    .card.purple { border-left-color: #8B5CF6; }
    .card-tag {
      font-size: 22px;
      letter-spacing: 2px;
      color: #B0B0CC;
      margin-bottom: 14px;
      font-weight: 600;
    }
    .card-tag.amber { color: #F59E0B; }
    .card-tag.red { color: #EF4444; }
    .card-tag.purple { color: #8B5CF6; }
    .card-text {
      font-size: 36px;
      font-weight: 700;
      line-height: 1.35;
      color: #FFFFFF;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="eyebrow">精读AI · LOOP ENGINEERING</div>
    <div class="headline">
      <span class="amber">Loop Engineering</span><br>
      <span class="red">90% 转的人都理解错了</span>
    </div>
    <div class="cards">
      <div class="card amber">
        <div class="card-tag amber">两周爆火新词</div>
        <div class="card-text">却还停在"Claude Code 高级技巧"</div>
      </div>
      <div class="card">
        <div class="card-tag red">Addy Osmani 第一次讲清楚</div>
        <div class="card-text">它是 harness 上面一层的设计学科</div>
      </div>
      <div class="card purple">
        <div class="card-tag purple">不是选工具</div>
        <div class="card-text">是设计 loop 本身</div>
      </div>
    </div>
  </div>
</body>
</html>
