<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .eyebrow {
      font-size: 24px;
      color: #EF4444;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 22px;
    }
    .title {
      font-size: 56px;
      font-weight: 900;
      margin-bottom: 40px;
      line-height: 1.25;
    }
    .title .accent { color: #EF4444; }
    .list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }
    .item {
      background: #1A1A2E;
      border-radius: 12px;
      padding: 28px 30px;
      text-align: left;
      display: flex;
      gap: 22px;
      align-items: flex-start;
    }
    .item.red { border: 1px solid rgba(239, 68, 68, 0.35); border-left: 4px solid #EF4444; }
    .item.amber { border: 1px solid rgba(245, 158, 11, 0.35); border-left: 4px solid #F59E0B; }
    .item.purple { border: 1px solid rgba(139, 92, 246, 0.35); border-left: 4px solid #8B5CF6; }
    .item-num {
      font-size: 56px;
      font-weight: 900;
      line-height: 1;
      flex-shrink: 0;
      width: 80px;
    }
    .red .item-num { color: #EF4444; }
    .amber .item-num { color: #F59E0B; }
    .purple .item-num { color: #8B5CF6; }
    .item-body { flex: 1; }
    .item-name {
      font-size: 30px;
      font-weight: 900;
      color: #FFFFFF;
      margin-bottom: 8px;
      line-height: 1.3;
    }
    .item-desc {
      font-size: 22px;
      color: #B0B0CC;
      line-height: 1.45;
    }
    .item-desc .em-red { color: #EF4444; font-weight: 700; }
    .item-desc .em-amber { color: #F59E0B; font-weight: 700; }
    .item-desc .em-purple { color: #8B5CF6; font-weight: 700; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="eyebrow">LOOP 越好用，反而越尖锐</div>
    <div class="title">Loop 没替你做的<br><span class="accent">三件事</span></div>
    <div class="list">
      <div class="item red">
        <div class="item-num">01</div>
        <div class="item-body">
          <div class="item-name">Verification</div>
          <div class="item-desc">"做完"是<span class="em-red">声明，不是证明</span>。ship 你确认过能 work 的代码</div>
        </div>
      </div>
      <div class="item amber">
        <div class="item-num">02</div>
        <div class="item-body">
          <div class="item-name">Comprehension Debt · 理解债</div>
          <div class="item-desc">它替你写的、你没读过的代码越多，账<span class="em-amber">涨得越快</span></div>
        </div>
      </div>
      <div class="item purple">
        <div class="item-num">03</div>
        <div class="item-body">
          <div class="item-name">Cognitive Surrender · 认知投降</div>
          <div class="item-desc">同一动作，<span class="em-purple">带判断是放大器，逃避思考是加速器</span></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
