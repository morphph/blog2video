<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .slide::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(ellipse at top, rgba(139, 92, 246, 0.18) 0%, rgba(13, 13, 26, 0) 55%);
      pointer-events: none;
    }
    .eyebrow {
      font-size: 24px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 22px;
      position: relative; z-index: 1;
    }
    .quote-block {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.4);
      border-left: 4px solid #8B5CF6;
      border-radius: 12px;
      padding: 36px 36px;
      text-align: left;
      margin-bottom: 28px;
      position: relative; z-index: 1;
    }
    .quote-mark {
      font-size: 80px;
      color: #8B5CF6;
      line-height: 1;
      font-family: Georgia, serif;
      margin-bottom: -16px;
    }
    .quote-text {
      font-size: 36px;
      font-weight: 800;
      line-height: 1.4;
      color: #FFFFFF;
    }
    .quote-text .em { color: #8B5CF6; }
    .anchors {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 28px;
      position: relative; z-index: 1;
    }
    .anchor {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.25);
      border-radius: 10px;
      padding: 18px 22px;
      text-align: left;
      display: flex;
      gap: 14px;
      align-items: center;
    }
    .anchor-name {
      font-size: 22px;
      font-weight: 800;
      width: 130px;
      flex-shrink: 0;
    }
    .anchor.automation .anchor-name { color: #EF4444; }
    .anchor.worktree .anchor-name { color: #10B981; }
    .anchor.skill .anchor-name { color: #F59E0B; }
    .anchor.connector .anchor-name { color: #3B82F6; }
    .anchor.subagent .anchor-name { color: #8B5CF6; }
    .anchor-role {
      font-size: 20px;
      color: #FFFFFF;
      font-weight: 600;
    }
    .closing {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-left: 4px solid #F59E0B;
      border-radius: 12px;
      padding: 24px 28px;
      text-align: center;
      position: relative; z-index: 1;
    }
    .closing-en {
      font-size: 28px;
      font-weight: 900;
      color: #F59E0B;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }
    .closing-zh {
      font-size: 24px;
      color: #FFFFFF;
      font-weight: 700;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="eyebrow">一句心法</div>
    <div class="quote-block">
      <div class="quote-mark">"</div>
      <div class="quote-text">不再握着工具的手柄，<br><span class="em">你在画工具的电路图</span></div>
    </div>
    <div class="anchors">
      <div class="anchor automation">
        <div class="anchor-name">Automation</div>
        <div class="anchor-role">心跳</div>
      </div>
      <div class="anchor worktree">
        <div class="anchor-name">Worktree</div>
        <div class="anchor-role">隔离</div>
      </div>
      <div class="anchor skill">
        <div class="anchor-name">Skill</div>
        <div class="anchor-role">知识</div>
      </div>
      <div class="anchor connector">
        <div class="anchor-name">Connector</div>
        <div class="anchor-role">手脚</div>
      </div>
      <div class="anchor subagent" style="grid-column: 1 / span 2; justify-content: center;">
        <div class="anchor-name" style="width: auto;">Subagent</div>
        <div class="anchor-role">眼睛</div>
      </div>
    </div>
    <div class="closing">
      <div class="closing-en">Build the loop. Stay the engineer.</div>
      <div class="closing-zh">建 loop，留下当工程师的那个人</div>
    </div>
  </div>
</body>
</html>
