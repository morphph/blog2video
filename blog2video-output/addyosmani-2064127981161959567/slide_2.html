<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .title {
      font-size: 56px;
      font-weight: 900;
      margin-bottom: 50px;
      color: #FFFFFF;
    }
    .title .accent { color: #8B5CF6; }
    .pieces {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 22px;
      margin-bottom: 30px;
    }
    .piece {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.25);
      border-left: 4px solid #8B5CF6;
      border-radius: 12px;
      padding: 24px 26px;
      text-align: left;
    }
    .piece-num {
      font-size: 22px;
      font-weight: 800;
      color: #8B5CF6;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }
    .piece-name {
      font-size: 30px;
      font-weight: 800;
      color: #FFFFFF;
      margin-bottom: 6px;
    }
    .piece-role {
      font-size: 22px;
      color: #B0B0CC;
      line-height: 1.4;
    }
    .memory-card {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(245, 158, 11, 0.35);
      border-left: 4px solid #F59E0B;
      border-radius: 12px;
      padding: 28px 32px;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 28px;
    }
    .memory-num {
      font-size: 64px;
      font-weight: 900;
      color: #F59E0B;
      line-height: 1;
    }
    .memory-text {
      flex: 1;
    }
    .memory-title {
      font-size: 30px;
      font-weight: 800;
      color: #F59E0B;
      margin-bottom: 6px;
    }
    .memory-desc {
      font-size: 22px;
      color: #B0B0CC;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="title"><span class="accent">5 + 1</span>：一个 loop 的零件清单</div>
    <div class="pieces">
      <div class="piece">
        <div class="piece-num">01</div>
        <div class="piece-name">Automations</div>
        <div class="piece-role">让它按时启动</div>
      </div>
      <div class="piece">
        <div class="piece-num">02</div>
        <div class="piece-name">Worktrees</div>
        <div class="piece-role">并行时不打架</div>
      </div>
      <div class="piece">
        <div class="piece-num">03</div>
        <div class="piece-name">Skills</div>
        <div class="piece-role">项目知识写在外面</div>
      </div>
      <div class="piece">
        <div class="piece-num">04</div>
        <div class="piece-name">Connectors</div>
        <div class="piece-role">接上你已有的工具</div>
      </div>
      <div class="piece" style="grid-column: 1 / span 2;">
        <div class="piece-num">05</div>
        <div class="piece-name">Sub-agents</div>
        <div class="piece-role">写代码的和检查代码的分开</div>
      </div>
    </div>
    <div class="memory-card">
      <div class="memory-num">+1</div>
      <div class="memory-text">
        <div class="memory-title">Memory · 第六件</div>
        <div class="memory-desc">agent 会忘，repo 不会忘。状态必须写在硬盘上</div>
      </div>
    </div>
  </div>
</body>
</html>
