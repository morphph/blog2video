<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .title {
      font-size: 56px;
      font-weight: 900;
      margin-bottom: 60px;
    }
    .title .accent { color: #8B5CF6; }
    .stack {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 24px;
      margin-bottom: 40px;
    }
    .layer {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.25);
      border-radius: 12px;
      padding: 32px 36px;
      text-align: left;
      position: relative;
    }
    .layer.top {
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-left: 4px solid #F59E0B;
      background: linear-gradient(135deg, #1A1A2E 0%, #1F1A2E 100%);
    }
    .layer.bottom {
      border-left: 4px solid #8B5CF6;
    }
    .layer-tag {
      font-size: 22px;
      letter-spacing: 2px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .top .layer-tag { color: #F59E0B; }
    .bottom .layer-tag { color: #8B5CF6; }
    .layer-name {
      font-size: 44px;
      font-weight: 900;
      margin-bottom: 12px;
      color: #FFFFFF;
    }
    .layer-desc {
      font-size: 26px;
      color: #B0B0CC;
      line-height: 1.45;
    }
    .layer-desc .em { color: #FFFFFF; font-weight: 700; }
    .arrow {
      text-align: center;
      font-size: 36px;
      color: #6B7280;
      margin: -8px 0;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="title">Loop 是 <span class="accent">harness 上面一层</span></div>
    <div class="stack">
      <div class="layer top">
        <div class="layer-tag">上面一层</div>
        <div class="layer-name">Loop Engineering</div>
        <div class="layer-desc">接水电、装定时器、让房子<span class="em">自己换灯泡</span></div>
      </div>
      <div class="arrow">▲</div>
      <div class="layer bottom">
        <div class="layer-tag">下面一层</div>
        <div class="layer-name">Agent Harness</div>
        <div class="layer-desc">prompts · tools · sandbox · context<br>包在模型外面的<span class="em">那间房子</span></div>
      </div>
    </div>
  </div>
</body>
</html>
