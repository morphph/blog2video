<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .label {
      font-size: 24px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 24px;
    }
    .title {
      font-size: 60px;
      font-weight: 900;
      margin-bottom: 50px;
      line-height: 1.2;
    }
    .title .accent { color: #10B981; }
    .solved {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(16, 185, 129, 0.35);
      border-left: 4px solid #10B981;
      border-radius: 12px;
      padding: 28px 32px;
      text-align: left;
      margin-bottom: 28px;
    }
    .solved-tag {
      font-size: 22px;
      letter-spacing: 2px;
      color: #10B981;
      font-weight: 800;
      margin-bottom: 10px;
    }
    .solved-text {
      font-size: 30px;
      font-weight: 700;
      color: #FFFFFF;
      line-height: 1.4;
    }
    .solved-text code {
      background: rgba(16, 185, 129, 0.18);
      color: #6EE7B7;
      padding: 2px 8px;
      border-radius: 4px;
      font-family: 'SF Mono', Menlo, monospace;
      font-size: 24px;
    }
    .unsolved {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-left: 4px solid #EF4444;
      border-radius: 12px;
      padding: 28px 32px;
      text-align: left;
    }
    .unsolved-tag {
      font-size: 22px;
      letter-spacing: 2px;
      color: #EF4444;
      font-weight: 800;
      margin-bottom: 10px;
    }
    .unsolved-headline {
      font-size: 38px;
      font-weight: 900;
      color: #FFFFFF;
      margin-bottom: 14px;
      line-height: 1.3;
    }
    .unsolved-text {
      font-size: 24px;
      color: #B0B0CC;
      line-height: 1.5;
    }
    .unsolved-text .em { color: #EF4444; font-weight: 800; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="label">第二层 · WORKTREES</div>
    <div class="title">两个 agent 改同一文件<br>= 两个工程师<span class="accent">不沟通</span></div>
    <div class="solved">
      <div class="solved-tag">机械冲突已解决</div>
      <div class="solved-text">Codex 内置 · Claude Code 给 <code>--worktree</code> 和 <code>isolation: worktree</code></div>
    </div>
    <div class="unsolved">
      <div class="unsolved-tag">但 worktree 没解决</div>
      <div class="unsolved-headline">人的瓶颈</div>
      <div class="unsolved-text">你的 <span class="em">review 带宽</span>，本来就是 review 队列的天花板</div>
    </div>
  </div>
</body>
</html>
