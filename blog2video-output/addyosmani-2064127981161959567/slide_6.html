<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .label {
      font-size: 24px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 24px;
    }
    .title {
      font-size: 56px;
      font-weight: 900;
      margin-bottom: 40px;
      line-height: 1.25;
    }
    .title .accent { color: #F59E0B; }
    .compare {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 28px;
    }
    .card {
      background: #1A1A2E;
      border-radius: 12px;
      padding: 24px 26px;
      text-align: left;
    }
    .card.bad {
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-left: 4px solid #EF4444;
    }
    .card.good {
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-left: 4px solid #10B981;
    }
    .card-tag {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 1.5px;
      margin-bottom: 10px;
    }
    .bad .card-tag { color: #EF4444; }
    .good .card-tag { color: #10B981; }
    .card-text {
      font-size: 24px;
      color: #FFFFFF;
      line-height: 1.45;
      font-weight: 600;
    }
    .card-text .strike { color: #6B7280; text-decoration: line-through; }
    .debt {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(245, 158, 11, 0.35);
      border-left: 4px solid #F59E0B;
      border-radius: 12px;
      padding: 26px 30px;
      text-align: left;
    }
    .debt-tag {
      font-size: 22px;
      letter-spacing: 2px;
      color: #F59E0B;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .debt-title {
      font-size: 34px;
      font-weight: 900;
      color: #FFFFFF;
      margin-bottom: 10px;
    }
    .debt-desc {
      font-size: 22px;
      color: #B0B0CC;
      line-height: 1.45;
    }
    .debt-desc .em { color: #F59E0B; font-weight: 800; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="label">第三层 · SKILLS</div>
    <div class="title">别再像<span class="accent">金鱼</span>一样<br>每次重新解释项目</div>
    <div class="compare">
      <div class="card bad">
        <div class="card-tag">花哨写法 · 没用</div>
        <div class="card-text"><span class="strike">让代码焕发新生</span></div>
      </div>
      <div class="card good">
        <div class="card-tag">无聊精确 · 才有用</div>
        <div class="card-text">格式化 Python 代码并跑 ruff</div>
      </div>
    </div>
    <div class="debt">
      <div class="debt-tag">SKILL 真正解决的</div>
      <div class="debt-title">Intent Debt · 意图债</div>
      <div class="debt-desc">没写在外面的项目知识，agent 会用<span class="em">自信的猜测</span>来填空</div>
    </div>
  </div>
</body>
</html>
