<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .label {
      font-size: 24px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 24px;
    }
    .title {
      font-size: 56px;
      font-weight: 900;
      margin-bottom: 48px;
      line-height: 1.25;
    }
    .title .accent { color: #3B82F6; }
    .transform {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 28px;
    }
    .role {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.25);
      border-radius: 12px;
      padding: 24px 28px;
      display: flex;
      align-items: center;
      gap: 24px;
      text-align: left;
    }
    .role.before {
      border-left: 4px solid #6B7280;
    }
    .role.after {
      border-left: 4px solid #3B82F6;
    }
    .role-tag {
      font-size: 20px;
      letter-spacing: 2px;
      font-weight: 800;
      width: 140px;
      flex-shrink: 0;
    }
    .before .role-tag { color: #6B7280; }
    .after .role-tag { color: #3B82F6; }
    .role-desc {
      font-size: 28px;
      font-weight: 700;
      line-height: 1.4;
      color: #FFFFFF;
    }
    .arrow {
      text-align: center;
      font-size: 32px;
      color: #3B82F6;
      margin: -8px 0;
    }
    .warn {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-left: 4px solid #EF4444;
      border-radius: 12px;
      padding: 24px 28px;
      text-align: left;
    }
    .warn-tag {
      font-size: 20px;
      letter-spacing: 2px;
      color: #EF4444;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .warn-text {
      font-size: 22px;
      color: #B0B0CC;
      line-height: 1.45;
    }
    .warn-text .em { color: #EF4444; font-weight: 800; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="label">第四层 · CONNECTORS</div>
    <div class="title">从"建议者"<br>变成<span class="accent">"执行者"</span></div>
    <div class="transform">
      <div class="role before">
        <div class="role-tag">没有 connector</div>
        <div class="role-desc">"这里应该改"</div>
      </div>
      <div class="arrow">▼ 基于 MCP，Codex 和 Claude Code 通用</div>
      <div class="role after">
        <div class="role-tag">有了 connector</div>
        <div class="role-desc">自己开 PR · 关联 Linear · CI 一变绿在频道里 ping</div>
      </div>
    </div>
    <div class="warn">
      <div class="warn-tag">代价 · 权限是你的设计</div>
      <div class="warn-text">写错一个 connector，它就能往<span class="em">生产数据库</span>发奇怪 query、往 Slack ping 错人</div>
    </div>
  </div>
</body>
</html>
