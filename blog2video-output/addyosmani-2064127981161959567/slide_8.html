<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .label {
      font-size: 24px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 24px;
    }
    .title {
      font-size: 56px;
      font-weight: 900;
      margin-bottom: 44px;
      line-height: 1.25;
    }
    .title .accent { color: #EF4444; }
    .quote-card {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-left: 4px solid #EF4444;
      border-radius: 12px;
      padding: 28px 32px;
      text-align: left;
      margin-bottom: 28px;
    }
    .quote-tag {
      font-size: 22px;
      letter-spacing: 2px;
      color: #EF4444;
      font-weight: 800;
      margin-bottom: 10px;
    }
    .quote-text {
      font-size: 28px;
      font-weight: 700;
      line-height: 1.45;
      color: #FFFFFF;
    }
    .quote-text .em { color: #EF4444; }
    .triplet {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 18px;
    }
    .role {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.25);
      border-left: 4px solid #8B5CF6;
      border-radius: 12px;
      padding: 24px 16px;
      text-align: center;
    }
    .role-num {
      font-size: 56px;
      font-weight: 900;
      color: #8B5CF6;
      line-height: 1;
      margin-bottom: 12px;
    }
    .role-name {
      font-size: 26px;
      font-weight: 800;
      color: #FFFFFF;
      margin-bottom: 6px;
    }
    .role-desc {
      font-size: 20px;
      color: #B0B0CC;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="label">第五层 · SUB-AGENTS</div>
    <div class="title">写代码的那个<br>别让它<span class="accent">给自己打分</span></div>
    <div class="quote-card">
      <div class="quote-tag">结构问题 · 不是它笨</div>
      <div class="quote-text">同一个上下文里先说服自己方案是对的，再来评分——<span class="em">那分数就是自己人</span></div>
    </div>
    <div class="triplet">
      <div class="role">
        <div class="role-num">01</div>
        <div class="role-name">Explore</div>
        <div class="role-desc">探路</div>
      </div>
      <div class="role">
        <div class="role-num">02</div>
        <div class="role-name">Implement</div>
        <div class="role-desc">实现</div>
      </div>
      <div class="role">
        <div class="role-num">03</div>
        <div class="role-name">Verify</div>
        <div class="role-desc">验证</div>
      </div>
    </div>
  </div>
</body>
</html>
