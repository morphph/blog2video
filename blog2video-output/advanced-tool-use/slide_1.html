<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 120px 72px 520px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .bg-glow {
      position: absolute;
      width: 700px;
      height: 700px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.08) 0%, transparent 70%);
      top: 180px;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
    }
    .topic-tag {
      display: inline-block;
      background: rgba(139, 92, 246, 0.15);
      border: 1px solid rgba(139, 92, 246, 0.4);
      color: #8B5CF6;
      font-size: 28px;
      font-weight: 600;
      padding: 10px 32px;
      border-radius: 50px;
      letter-spacing: 3px;
      margin-bottom: 56px;
      position: relative;
      z-index: 1;
    }
    .hook-title {
      font-size: 66px;
      font-weight: 900;
      line-height: 1.4;
      margin-bottom: 56px;
      letter-spacing: 1px;
      position: relative;
      z-index: 1;
    }
    .hook-title .highlight {
      color: #F59E0B;
    }
    .hook-title .red {
      color: #EF4444;
    }
    .pain-cards {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 56px;
      position: relative;
      z-index: 1;
    }
    .pain-card {
      width: 100%;
      background: #1A1A30;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-left: 4px solid #EF4444;
      border-radius: 12px;
      padding: 24px 28px;
      display: flex;
      align-items: center;
      gap: 20px;
      text-align: left;
    }
    .pain-icon {
      font-size: 32px;
      flex-shrink: 0;
      width: 56px;
      height: 56px;
      background: rgba(239, 68, 68, 0.15);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .pain-text {
      font-size: 30px;
      color: #B0B0CC;
      line-height: 1.5;
    }
    .pain-text strong {
      color: #EF4444;
      font-weight: 700;
    }
    .brand-line {
      font-size: 26px;
      color: #6B7280;
      letter-spacing: 3px;
      position: relative;
      z-index: 1;
    }
    .brand-line span {
      color: #8B5CF6;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="bg-glow"></div>
    <div class="topic-tag">AI精读 · Tool Use</div>

    <div class="hook-title">
      AI Agent 接上工具<br>
      <span class="red">光说明书</span>就吃掉<br>
      <span class="highlight">十万个 Token</span>
    </div>

    <div class="pain-cards">
      <div class="pain-card">
        <div class="pain-icon">⚙️</div>
        <div class="pain-text">GitHub + Slack + Sentry<br><strong>对话还没开始就超载</strong></div>
      </div>
      <div class="pain-card">
        <div class="pain-icon">📉</div>
        <div class="pain-text">工具越多 模型越笨<br><strong>准确率不到 50%</strong></div>
      </div>
    </div>

    <div class="brand-line"><span>AI 精读</span> · Anthropic 官方博客</div>
  </div>
</body>
</html>
