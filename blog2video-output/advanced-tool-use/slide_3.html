<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 120px 72px 520px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .section-label {
      font-size: 24px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 600;
      margin-bottom: 28px;
    }
    .main-title {
      font-size: 48px;
      font-weight: 800;
      margin-bottom: 36px;
    }
    .cards-wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .card {
      width: 100%;
      background: #1A1A30;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 28px;
      text-align: left;
    }
    .card.green {
      border-left: 4px solid #10B981;
    }
    .card.blue {
      border-left: 4px solid #3B82F6;
    }
    .card.yellow {
      border-left: 4px solid #F59E0B;
    }
    .card-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 14px;
    }
    .card-number {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 800;
      flex-shrink: 0;
    }
    .card.green .card-number {
      background: rgba(16, 185, 129, 0.2);
      color: #10B981;
    }
    .card.blue .card-number {
      background: rgba(59, 130, 246, 0.2);
      color: #3B82F6;
    }
    .card.yellow .card-number {
      background: rgba(245, 158, 11, 0.2);
      color: #F59E0B;
    }
    .card-title {
      font-size: 32px;
      font-weight: 700;
    }
    .card.green .card-title { color: #10B981; }
    .card.blue .card-title { color: #3B82F6; }
    .card.yellow .card-title { color: #F59E0B; }
    .card-subtitle {
      font-size: 24px;
      color: #B0B0CC;
      margin-bottom: 14px;
    }
    .card-stats {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .stat {
      background: rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 22px;
      color: #B0B0CC;
    }
    .stat .num {
      font-weight: 800;
      font-size: 26px;
    }
    .card.green .stat .num { color: #10B981; }
    .card.blue .stat .num { color: #3B82F6; }
    .card.yellow .stat .num { color: #F59E0B; }
    .card-analogy {
      font-size: 22px;
      color: #8B8BA0;
      margin-top: 10px;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="section-label">THREE STRATEGIES</div>
    <div class="main-title">Anthropic 三招优化</div>

    <div class="cards-wrapper">
      <!-- Card 1: Tool Search -->
      <div class="card green">
        <div class="card-header">
          <div class="card-number">1</div>
          <div class="card-title">Tool Search</div>
        </div>
        <div class="card-subtitle">工具按需搜索 · defer_loading: true</div>
        <div class="card-stats">
          <div class="stat">Token <span class="num">-85%</span></div>
          <div class="stat">77K → <span class="num">8.7K</span></div>
          <div class="stat">准确率 <span class="num">49%→74%</span></div>
        </div>
        <div class="card-analogy">像 App Store，需要时再装</div>
      </div>

      <!-- Card 2: Programmatic Calling -->
      <div class="card blue">
        <div class="card-header">
          <div class="card-number">2</div>
          <div class="card-title">Programmatic Calling</div>
        </div>
        <div class="card-subtitle">程序化批量调用 · 沙箱执行</div>
        <div class="card-stats">
          <div class="stat">Token <span class="num">-37%</span></div>
          <div class="stat">43K → <span class="num">27K</span></div>
          <div class="stat">减少 <span class="num">19+ 次</span>推理</div>
        </div>
      </div>

      <!-- Card 3: Tool Use Examples -->
      <div class="card yellow">
        <div class="card-header">
          <div class="card-number">3</div>
          <div class="card-title">Tool Use Examples</div>
        </div>
        <div class="card-subtitle">真实调用示例 · 1-5 个即可</div>
        <div class="card-stats">
          <div class="stat">准确率 <span class="num">72%→90%</span></div>
        </div>
        <div class="card-analogy">新员工要看前辈实操案例</div>
      </div>
    </div>
  </div>
</body>
</html>
