<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 120px 72px 520px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .glow {
      position: absolute;
      top: 28%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.1) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }
    .content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }
    .series-tag {
      font-size: 24px;
      color: #8B5CF6;
      letter-spacing: 2px;
      margin-bottom: 40px;
      font-weight: 600;
    }
    .title {
      font-size: 56px;
      font-weight: 900;
      line-height: 1.35;
      margin-bottom: 56px;
    }
    .title .highlight {
      color: #F59E0B;
    }
    .cards {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
    }
    .card {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 24px 28px;
      display: flex;
      align-items: center;
      gap: 20px;
      text-align: left;
    }
    .card-icon {
      font-size: 36px;
      flex-shrink: 0;
      width: 52px;
      text-align: center;
    }
    .card-text {
      font-size: 30px;
      color: #B0B0CC;
      line-height: 1.4;
      font-weight: 500;
    }
    .card-text .em {
      color: #FFFFFF;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="glow"></div>
    <div class="content">
      <div class="series-tag">AI精读 · Agent Teams</div>
      <div class="title">
        让好几个AI<br><span class="highlight">同时帮你写代码</span>？
      </div>
      <div class="cards">
        <div class="card">
          <div class="card-icon">🖥️</div>
          <div class="card-text">一个搞<span class="em">前端</span>页面</div>
        </div>
        <div class="card">
          <div class="card-icon">⚙️</div>
          <div class="card-text">一个搞<span class="em">后端</span>接口</div>
        </div>
        <div class="card">
          <div class="card-icon">🧪</div>
          <div class="card-text">一个跑<span class="em">自动测试</span></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
