<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 120px 72px 520px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .content {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }
    .section-label {
      font-size: 22px;
      color: #8B5CF6;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 16px;
      font-weight: 600;
    }
    .title {
      font-size: 52px;
      font-weight: 800;
      margin-bottom: 48px;
      line-height: 1.3;
    }
    .title .accent {
      color: #8B5CF6;
    }
    .diagram {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      margin-bottom: 40px;
    }
    .leader-box {
      background: linear-gradient(135deg, #2D1B69 0%, #1A1A2E 100%);
      border: 2px solid #8B5CF6;
      border-radius: 12px;
      padding: 20px 40px;
      font-size: 30px;
      font-weight: 700;
      color: #FFFFFF;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .leader-icon {
      font-size: 28px;
    }
    .arrow-down {
      font-size: 32px;
      color: #6B7280;
      line-height: 1;
    }
    .teammates-row {
      display: flex;
      gap: 16px;
      width: 100%;
      justify-content: center;
    }
    .teammate-box {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.25);
      border-radius: 12px;
      padding: 20px 16px;
      flex: 1;
      max-width: 280px;
      text-align: center;
    }
    .teammate-box .icon {
      font-size: 36px;
      margin-bottom: 8px;
    }
    .teammate-box .label {
      font-size: 24px;
      font-weight: 600;
      color: #FFFFFF;
    }
    .connect-line {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 4px;
    }
    .connect-line .dash {
      width: 80px;
      height: 2px;
      background: #10B981;
      opacity: 0.6;
    }
    .connect-line .label {
      font-size: 18px;
      color: #10B981;
      font-weight: 600;
      white-space: nowrap;
    }
    .key-point {
      background: #1A1A2E;
      border-left: 4px solid #10B981;
      border-radius: 0 12px 12px 0;
      padding: 24px 28px;
      width: 100%;
      text-align: left;
      margin-top: 8px;
    }
    .key-point .point-title {
      font-size: 26px;
      font-weight: 700;
      color: #10B981;
      margin-bottom: 8px;
    }
    .key-point .point-desc {
      font-size: 26px;
      color: #B0B0CC;
      line-height: 1.5;
    }
    .key-point .point-desc .em {
      color: #FFFFFF;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="content">
      <div class="section-label">核心概念</div>
      <div class="title"><span class="accent">Agent Teams</span> 是什么？</div>

      <div class="diagram">
        <div class="leader-box">
          <span class="leader-icon">👑</span> 组长 — 协调全局
        </div>
        <div class="arrow-down">↓ &nbsp;召集 &nbsp;↓</div>
        <div class="teammates-row">
          <div class="teammate-box">
            <div class="icon">🖥️</div>
            <div class="label">前端</div>
          </div>
          <div class="teammate-box">
            <div class="icon">⚙️</div>
            <div class="label">后端</div>
          </div>
          <div class="teammate-box">
            <div class="icon">🧪</div>
            <div class="label">测试</div>
          </div>
        </div>
        <div class="connect-line">
          <div class="dash"></div>
          <div class="label">队友之间直接沟通</div>
          <div class="dash"></div>
        </div>
      </div>

      <div class="key-point">
        <div class="point-title">关键细节</div>
        <div class="point-desc">Teammate 之间<span class="em">直接发消息</span>，<br>不用等组长转达</div>
      </div>
    </div>
  </div>
</body>
</html>
