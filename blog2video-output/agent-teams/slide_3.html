<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 120px 72px 520px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .content {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }
    .title {
      font-size: 48px;
      font-weight: 800;
      margin-bottom: 44px;
      line-height: 1.3;
    }
    .vs-container {
      display: flex;
      width: 100%;
      gap: 20px;
      margin-bottom: 36px;
    }
    .vs-card {
      flex: 1;
      border-radius: 12px;
      padding: 28px 24px;
      text-align: left;
    }
    .vs-card.left {
      background: #1A1A2E;
      border: 1px solid rgba(107, 114, 128, 0.3);
      border-top: 4px solid #6B7280;
    }
    .vs-card.right {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-top: 4px solid #8B5CF6;
    }
    .vs-card .card-label {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 16px;
    }
    .vs-card.left .card-label {
      color: #6B7280;
    }
    .vs-card.right .card-label {
      color: #8B5CF6;
    }
    .vs-card .metaphor {
      font-size: 40px;
      margin-bottom: 12px;
    }
    .vs-card .metaphor-text {
      font-size: 24px;
      color: #B0B0CC;
      margin-bottom: 20px;
      line-height: 1.4;
    }
    .vs-card .trait {
      font-size: 22px;
      color: #B0B0CC;
      line-height: 1.6;
      padding-left: 8px;
      margin-bottom: 6px;
    }
    .vs-card .trait .em {
      color: #FFFFFF;
      font-weight: 600;
    }
    .vs-badge {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -260px);
      background: #0D0D1A;
      border: 2px solid #F59E0B;
      border-radius: 50%;
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 800;
      color: #F59E0B;
      z-index: 2;
    }
    .scenarios {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-left: 4px solid #3B82F6;
      border-radius: 0 12px 12px 0;
      padding: 24px 28px;
      text-align: left;
      margin-bottom: 20px;
    }
    .scenarios .label {
      font-size: 22px;
      color: #3B82F6;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .scenarios .items {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .scenarios .item {
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.25);
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 22px;
      color: #FFFFFF;
      font-weight: 500;
    }
    .warning {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(239, 68, 68, 0.2);
      border-left: 4px solid #EF4444;
      border-radius: 0 12px 12px 0;
      padding: 20px 28px;
      text-align: left;
    }
    .warning .text {
      font-size: 24px;
      color: #B0B0CC;
      line-height: 1.5;
    }
    .warning .text .em {
      color: #EF4444;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="content">
      <div class="title">Subagent vs Agent Teams</div>

      <div class="vs-container" style="position: relative;">
        <div class="vs-card left">
          <div class="card-label">Subagent</div>
          <div class="metaphor">🛵</div>
          <div class="metaphor-text">像外卖骑手</div>
          <div class="trait">下单 → 独立完成 → 送回结果</div>
          <div class="trait">只能向<span class="em">主Agent</span>汇报</div>
          <div class="trait">适合<span class="em">聚焦型</span>任务</div>
        </div>
        <div class="vs-card right">
          <div class="card-label">Agent Teams</div>
          <div class="metaphor">👥</div>
          <div class="metaphor-text">像项目组协作</div>
          <div class="trait">队友之间<span class="em">随时沟通</span></div>
          <div class="trait">共享任务列表<span class="em">自主协调</span></div>
          <div class="trait">适合<span class="em">复杂讨论型</span>工作</div>
        </div>
        <div class="vs-badge">VS</div>
      </div>

      <div class="scenarios">
        <div class="label">Agent Teams 四大场景</div>
        <div class="items">
          <div class="item">多角度调研</div>
          <div class="item">模块并行开发</div>
          <div class="item">竞争假设调试</div>
          <div class="item">跨层协调</div>
        </div>
      </div>

      <div class="warning">
        <div class="text">每多一个 Teammate = <span class="em">更多 Token 成本</span><br>简单任务用 Subagent 就够了</div>
      </div>
    </div>
  </div>
</body>
</html>
