<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 120px 72px 520px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .slide::before {
      content: '';
      position: absolute;
      top: 35%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 700px;
      height: 500px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.1) 0%, transparent 70%);
      pointer-events: none;
    }
    .series-label {
      font-size: 24px;
      color: #8B5CF6;
      letter-spacing: 2px;
      margin-bottom: 40px;
      font-weight: 500;
    }
    .main-title {
      font-size: 58px;
      font-weight: 900;
      line-height: 1.35;
      margin-bottom: 56px;
    }
    .main-title .highlight {
      color: #F59E0B;
    }
    .pain-cards {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .pain-card {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-left: 4px solid #EF4444;
      border-radius: 12px;
      padding: 24px 28px;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .pain-icon {
      font-size: 28px;
      flex-shrink: 0;
      width: 44px;
      text-align: center;
    }
    .pain-text {
      font-size: 30px;
      color: #B0B0CC;
      line-height: 1.4;
    }
    .pain-text strong {
      color: #EF4444;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="series-label">AI精读 &middot; Agent Teams 实战篇</div>
    <div class="main-title">
      手把手搭建<br><span class="highlight">AI开发团队</span>
    </div>
    <div class="pain-cards">
      <div class="pain-card">
        <div class="pain-icon">&#x2753;</div>
        <div class="pain-text">怎么<strong>启动</strong>团队？</div>
      </div>
      <div class="pain-card">
        <div class="pain-icon">&#x2753;</div>
        <div class="pain-text">怎么<strong>分配任务</strong>？</div>
      </div>
      <div class="pain-card">
        <div class="pain-icon">&#x2753;</div>
        <div class="pain-text">怎么避免<strong>队友打架</strong>？</div>
      </div>
    </div>
  </div>
</body>
</html>
