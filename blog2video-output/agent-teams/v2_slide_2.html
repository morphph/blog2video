<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 120px 72px 520px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .title {
      font-size: 46px;
      font-weight: 800;
      margin-bottom: 48px;
      color: #FFFFFF;
    }
    .title .accent {
      color: #8B5CF6;
    }
    .arch-diagram {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }
    .lead-box {
      background: linear-gradient(135deg, #1A1A2E 0%, #252547 100%);
      border: 2px solid #8B5CF6;
      border-radius: 16px;
      padding: 24px 48px;
      text-align: center;
    }
    .lead-label {
      font-size: 20px;
      color: #8B5CF6;
      font-weight: 600;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }
    .lead-title {
      font-size: 34px;
      font-weight: 800;
    }
    .lead-sub {
      font-size: 20px;
      color: #B0B0CC;
      margin-top: 4px;
    }
    .connector {
      width: 2px;
      height: 28px;
      background: rgba(139, 92, 246, 0.4);
    }
    .teammates-row {
      display: flex;
      gap: 16px;
      width: 100%;
      justify-content: center;
    }
    .teammate-box {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 18px 14px;
      flex: 1;
      max-width: 200px;
      text-align: center;
    }
    .teammate-icon {
      font-size: 32px;
      margin-bottom: 8px;
    }
    .teammate-name {
      font-size: 22px;
      font-weight: 700;
      color: #FFFFFF;
    }
    .infra-section {
      width: 100%;
      display: flex;
      gap: 20px;
      margin-top: 8px;
    }
    .infra-card {
      flex: 1;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 22px 18px;
      text-align: center;
    }
    .infra-card.task-list {
      border-left: 4px solid #F59E0B;
    }
    .infra-card.mailbox {
      border-left: 4px solid #3B82F6;
    }
    .infra-icon {
      font-size: 30px;
      margin-bottom: 8px;
    }
    .infra-title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .infra-card.task-list .infra-title {
      color: #F59E0B;
    }
    .infra-card.mailbox .infra-title {
      color: #3B82F6;
    }
    .infra-desc {
      font-size: 19px;
      color: #B0B0CC;
      line-height: 1.4;
    }
    .tip-box {
      width: 100%;
      margin-top: 28px;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-left: 4px solid #10B981;
      border-radius: 12px;
      padding: 20px 24px;
      text-align: left;
    }
    .tip-label {
      font-size: 18px;
      color: #10B981;
      font-weight: 700;
      margin-bottom: 6px;
      letter-spacing: 1px;
    }
    .tip-text {
      font-size: 22px;
      color: #B0B0CC;
      line-height: 1.5;
    }
    .tip-text code {
      color: #F59E0B;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 20px;
      background: rgba(245, 158, 11, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="title">底层架构：<span class="accent">AI办公室</span></div>

    <div class="arch-diagram">
      <div class="lead-box">
        <div class="lead-label">Team Lead</div>
        <div class="lead-title">项目经理</div>
        <div class="lead-sub">分任务 &middot; 协调 &middot; 收尾</div>
      </div>

      <div class="connector"></div>

      <div class="teammates-row">
        <div class="teammate-box">
          <div class="teammate-icon">&#x1F9D1;&#x200D;&#x1F4BB;</div>
          <div class="teammate-name">队友 A</div>
        </div>
        <div class="teammate-box">
          <div class="teammate-icon">&#x1F9D1;&#x200D;&#x1F4BB;</div>
          <div class="teammate-name">队友 B</div>
        </div>
        <div class="teammate-box">
          <div class="teammate-icon">&#x1F9D1;&#x200D;&#x1F4BB;</div>
          <div class="teammate-name">队友 C</div>
        </div>
        <div class="teammate-box">
          <div class="teammate-icon">&#x1F9D1;&#x200D;&#x1F4BB;</div>
          <div class="teammate-name">队友 D</div>
        </div>
      </div>

      <div class="infra-section">
        <div class="infra-card task-list">
          <div class="infra-icon">&#x1F4CB;</div>
          <div class="infra-title">Shared Task List</div>
          <div class="infra-desc">共享看板<br>领任务 &middot; 标完成</div>
        </div>
        <div class="infra-card mailbox">
          <div class="infra-icon">&#x1F4EC;</div>
          <div class="infra-title">Mailbox</div>
          <div class="infra-desc">即时通讯<br>队友间直接沟通</div>
        </div>
      </div>
    </div>

    <div class="tip-box">
      <div class="tip-label">TIP</div>
      <div class="tip-text">配置存于 <code>~/.claude/teams/</code><br>可直接查看或手动编辑调试</div>
    </div>
  </div>
</body>
</html>
