<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 120px 72px 520px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .title {
      font-size: 44px;
      font-weight: 800;
      margin-bottom: 44px;
    }
    .title .accent {
      color: #8B5CF6;
    }
    .comparison {
      width: 100%;
      display: flex;
      gap: 20px;
      margin-bottom: 36px;
    }
    .mode-card {
      flex: 1;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 28px 22px;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .mode-card.left {
      border-top: 4px solid #3B82F6;
    }
    .mode-card.right {
      border-top: 4px solid #10B981;
    }
    .mode-header {
      text-align: center;
    }
    .mode-icon {
      font-size: 36px;
      margin-bottom: 8px;
    }
    .mode-name {
      font-size: 28px;
      font-weight: 800;
    }
    .mode-card.left .mode-name {
      color: #3B82F6;
    }
    .mode-card.right .mode-name {
      color: #10B981;
    }
    .mode-desc {
      font-size: 21px;
      color: #B0B0CC;
      line-height: 1.5;
      text-align: center;
    }
    .mode-tags {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: auto;
    }
    .tag {
      font-size: 19px;
      padding: 8px 14px;
      border-radius: 8px;
      text-align: center;
      line-height: 1.3;
    }
    .tag.pro {
      background: rgba(16, 185, 129, 0.12);
      color: #10B981;
      border: 1px solid rgba(16, 185, 129, 0.25);
    }
    .tag.con {
      background: rgba(239, 68, 68, 0.1);
      color: #EF4444;
      border: 1px solid rgba(239, 68, 68, 0.2);
    }
    .section-title {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 24px;
      color: #F59E0B;
    }
    .hooks-row {
      width: 100%;
      display: flex;
      gap: 16px;
    }
    .hook-card {
      flex: 1;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-left: 4px solid #F59E0B;
      border-radius: 12px;
      padding: 20px 18px;
      text-align: left;
    }
    .hook-name {
      font-size: 20px;
      font-weight: 700;
      color: #F59E0B;
      margin-bottom: 8px;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }
    .hook-desc {
      font-size: 19px;
      color: #B0B0CC;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="title">两种<span class="accent">显示模式</span></div>

    <div class="comparison">
      <div class="mode-card left">
        <div class="mode-header">
          <div class="mode-icon">&#x1F4BB;</div>
          <div class="mode-name">In-process</div>
        </div>
        <div class="mode-desc">所有队友在<br>同一终端运行</div>
        <div class="mode-tags">
          <div class="tag pro">&#x2713; 任何终端可用</div>
          <div class="tag con">&#x2717; 同时只看一人</div>
        </div>
      </div>

      <div class="mode-card right">
        <div class="mode-header">
          <div class="mode-icon">&#x1F5A5;&#xFE0F;</div>
          <div class="mode-name">Split Panes</div>
        </div>
        <div class="mode-desc">每个队友独立窗口<br>像监控室多屏墙</div>
        <div class="mode-tags">
          <div class="tag pro">&#x2713; 同时看所有人</div>
          <div class="tag con">&#x2717; 需 tmux / iTerm2</div>
        </div>
      </div>
    </div>

    <div class="section-title">&#x26A1; 质量门禁 Hook</div>
    <div class="hooks-row">
      <div class="hook-card">
        <div class="hook-name">TeammateIdle</div>
        <div class="hook-desc">空闲时自动触发<br>质量检查</div>
      </div>
      <div class="hook-card">
        <div class="hook-name">TaskCompleted</div>
        <div class="hook-desc">任务完成后<br>自动验收</div>
      </div>
    </div>
  </div>
</body>
</html>
