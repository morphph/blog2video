<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 120px 72px 520px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .slide::before {
      content: '';
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 500px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.08) 0%, transparent 70%);
      pointer-events: none;
    }
    .title {
      font-size: 44px;
      font-weight: 800;
      margin-bottom: 48px;
    }
    .title .accent {
      color: #8B5CF6;
    }
    .core-points {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      margin-bottom: 44px;
      justify-content: center;
    }
    .core-point {
      width: calc(50% - 9px);
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 24px 20px;
      text-align: center;
    }
    .core-point:nth-child(1) { border-top: 4px solid #EF4444; }
    .core-point:nth-child(2) { border-top: 4px solid #8B5CF6; }
    .core-point:nth-child(3) { border-top: 4px solid #F59E0B; }
    .core-point:nth-child(4) { border-top: 4px solid #10B981; }
    .point-num {
      font-size: 56px;
      font-weight: 800;
      margin-bottom: 8px;
      line-height: 1;
    }
    .core-point:nth-child(1) .point-num { color: #EF4444; }
    .core-point:nth-child(2) .point-num { color: #8B5CF6; }
    .core-point:nth-child(3) .point-num { color: #F59E0B; }
    .core-point:nth-child(4) .point-num { color: #10B981; }
    .point-text {
      font-size: 24px;
      font-weight: 700;
      line-height: 1.4;
      color: #FFFFFF;
    }
    .cta-box {
      width: 100%;
      background: linear-gradient(135deg, #1A1A2E 0%, #1E1E3A 100%);
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-radius: 12px;
      padding: 28px 24px;
    }
    .cta-label {
      font-size: 20px;
      color: #8B5CF6;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }
    .cta-text {
      font-size: 24px;
      color: #B0B0CC;
      line-height: 1.5;
    }
    .cta-text strong {
      color: #F59E0B;
      font-weight: 700;
    }
    .outro {
      margin-top: 36px;
      font-size: 22px;
      color: #6B7280;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="title"><span class="accent">核心心法</span>四句话</div>

    <div class="core-points">
      <div class="core-point">
        <div class="point-num">01</div>
        <div class="point-text">给队友<br>充足上下文</div>
      </div>
      <div class="core-point">
        <div class="point-num">02</div>
        <div class="point-text">控制团队<br>3-5 人</div>
      </div>
      <div class="core-point">
        <div class="point-num">03</div>
        <div class="point-text">合理拆分<br>任务粒度</div>
      </div>
      <div class="core-point">
        <div class="point-num">04</div>
        <div class="point-text">善用<br>质量门禁</div>
      </div>
    </div>

    <div class="cta-box">
      <div class="cta-label">&#x1F680; 现在就试</div>
      <div class="cta-text">设置 <strong>AGENT_TEAMS</strong> 环境变量<br>用自然语言描述一个三人团队</div>
    </div>

    <div class="outro">精读一篇，胜过刷一百条</div>
  </div>
</body>
</html>
