<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .cover {
      width: 100%; height: 100%;
      padding: 140px 72px 400px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
      background:
        radial-gradient(circle at 22% 18%, rgba(139, 92, 246, 0.24), transparent 55%),
        radial-gradient(circle at 80% 78%, rgba(245, 158, 11, 0.18), transparent 55%),
        radial-gradient(circle at 50% 50%, rgba(59, 130, 246, 0.10), transparent 60%),
        #0D0D1A;
    }
    .series-tag {
      font-size: 30px;
      color: #8B5CF6;
      letter-spacing: 4px;
      font-weight: 700;
      margin-bottom: 44px;
    }
    .cmd-pill {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.45);
      border-radius: 999px;
      padding: 14px 28px;
      margin-bottom: 48px;
      font-family: 'SF Mono', Consolas, monospace;
    }
    .cmd-pill .prompt {
      color: #8B5CF6;
      font-size: 24px;
      font-weight: 800;
    }
    .cmd-pill .cmd {
      color: #FFFFFF;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }
    .headline {
      font-size: 92px;
      font-weight: 900;
      line-height: 1.14;
      letter-spacing: -2px;
      margin-bottom: 52px;
      color: #FFFFFF;
    }
    .headline .y { color: #F59E0B; }
    .headline .p { color: #8B5CF6; }
    .verdict {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.45);
      border-left: 4px solid #8B5CF6;
      border-radius: 14px;
      padding: 28px 32px;
      max-width: 920px;
      width: 100%;
      text-align: left;
      margin-bottom: 56px;
    }
    .verdict .label {
      font-size: 22px;
      color: #8B5CF6;
      letter-spacing: 2px;
      font-weight: 800;
      margin-bottom: 14px;
    }
    .verdict .text {
      font-size: 32px;
      color: #FFFFFF;
      font-weight: 700;
      line-height: 1.45;
    }
    .verdict .text .em { color: #F59E0B; font-weight: 800; }
    .source-tag {
      display: inline-block;
      background: #1A1A30;
      border: 1px solid rgba(139, 92, 246, 0.25);
      border-radius: 999px;
      padding: 14px 32px;
      font-size: 22px;
      color: #6B6B80;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .source-tag .author { color: #8B8BA8; font-weight: 700; }
  </style>
</head>
<body>
  <div class="cover">
    <div class="series-tag">精读AI · Claude Code</div>
    <div class="cmd-pill">
      <span class="prompt">$</span>
      <span class="cmd">claude agents</span>
    </div>
    <div class="headline">
      session 不是 <span class="y">tab</span><br>
      是<span class="p">系统对象</span>
    </div>
    <div class="verdict">
      <div class="label">这份 DOCS 真正在讲什么</div>
      <div class="text">
        Claude Code 把 session<br>
        当<span class="em">进程</span>管，不当 tab
      </div>
    </div>
    <div class="source-tag">
      <span class="author">Anthropic · Claude Code</span> · Agent view docs
    </div>
  </div>
</body>
</html>
