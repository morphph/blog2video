<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
      background:
        radial-gradient(circle at 25% 18%, rgba(139, 92, 246, 0.20), transparent 55%),
        radial-gradient(circle at 80% 80%, rgba(16, 185, 129, 0.16), transparent 55%),
        #0D0D1A;
    }
    .tag {
      font-size: 28px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 28px;
    }
    .title {
      font-size: 56px;
      font-weight: 900;
      line-height: 1.18;
      margin-bottom: 36px;
      letter-spacing: -1px;
    }
    .title .p { color: #8B5CF6; }
    .compare {
      display: flex;
      gap: 18px;
      width: 100%;
      max-width: 920px;
      margin-bottom: 28px;
    }
    .col {
      flex: 1;
      background: #1A1A2E;
      border-radius: 14px;
      padding: 24px 18px;
      text-align: center;
    }
    .col.purple {
      border: 1px solid rgba(139, 92, 246, 0.5);
      border-left: 4px solid #8B5CF6;
    }
    .col.green {
      border: 1px solid rgba(16, 185, 129, 0.5);
      border-left: 4px solid #10B981;
    }
    .col .axis {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }
    .col.purple .axis { color: #8B5CF6; }
    .col.green .axis { color: #10B981; }
    .col .h {
      font-size: 30px;
      font-weight: 900;
      color: #FFFFFF;
      margin-bottom: 14px;
      line-height: 1.2;
    }
    .glyph-row {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-bottom: 4px;
    }
    .glyph {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
    }
    .glyph .ch {
      font-size: 64px;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 6px;
      font-family: 'SF Mono', Consolas, monospace;
    }
    .col.purple .glyph .ch { color: #8B5CF6; }
    .col.green .glyph .ch { color: #10B981; }
    .glyph .lab {
      font-size: 16px;
      color: #B0B0CC;
      font-weight: 600;
      line-height: 1.3;
    }
    .example {
      display: flex;
      gap: 16px;
      width: 100%;
      max-width: 920px;
      margin-bottom: 24px;
    }
    .ex {
      flex: 1;
      background: #1A1A2E;
      border-radius: 12px;
      padding: 18px 18px;
      text-align: center;
    }
    .ex.live {
      border: 1px solid rgba(16, 185, 129, 0.5);
      border-left: 4px solid #10B981;
    }
    .ex.disk {
      border: 1px solid rgba(107, 114, 128, 0.4);
      border-left: 4px solid #6B7280;
    }
    .ex .pair {
      font-family: 'SF Mono', Consolas, monospace;
      font-size: 56px;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 8px;
      letter-spacing: -1px;
    }
    .ex.live .pair { color: #10B981; }
    .ex.disk .pair {
      color: #10B981;
    }
    .ex.disk .pair .gr { color: #6B7280; }
    .ex .d {
      font-size: 19px;
      color: #B0B0CC;
      font-weight: 700;
      line-height: 1.35;
    }
    .verdict {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.4);
      border-left: 4px solid #8B5CF6;
      border-radius: 14px;
      padding: 22px 28px;
      max-width: 920px;
      width: 100%;
      text-align: left;
    }
    .verdict .label {
      font-size: 22px;
      color: #8B5CF6;
      letter-spacing: 2px;
      font-weight: 800;
      margin-bottom: 10px;
    }
    .verdict .text {
      font-size: 26px;
      color: #FFFFFF;
      font-weight: 700;
      line-height: 1.4;
    }
    .verdict .text .em { color: #8B5CF6; font-weight: 800; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="tag">两套维度 · 各管一件事</div>
    <div class="title">颜色和形状<span class="p">是两张表</span></div>
    <div class="compare">
      <div class="col purple">
        <div class="axis">颜色</div>
        <div class="h">语义状态</div>
        <div class="glyph-row">
          <div class="glyph"><div class="ch" style="color:#10B981">●</div><div class="lab">done</div></div>
          <div class="glyph"><div class="ch" style="color:#F59E0B">●</div><div class="lab">需输入</div></div>
          <div class="glyph"><div class="ch" style="color:#EF4444">●</div><div class="lab">failed</div></div>
        </div>
      </div>
      <div class="col green">
        <div class="axis">形状</div>
        <div class="h">进程生死</div>
        <div class="glyph-row">
          <div class="glyph"><div class="ch">✻</div><div class="lab">活着</div></div>
          <div class="glyph"><div class="ch">∙</div><div class="lab">回收</div></div>
          <div class="glyph"><div class="ch">✢</div><div class="lab">睡着</div></div>
        </div>
      </div>
    </div>
    <div class="example">
      <div class="ex live">
        <div class="pair">●&nbsp;✻</div>
        <div class="d">完成 + 进程还在<br>点了立刻有反应</div>
      </div>
      <div class="ex disk">
        <div class="pair">●&nbsp;<span class="gr">∙</span></div>
        <div class="d">完成 + 进程回收<br>看的是磁盘文件</div>
      </div>
    </div>
    <div class="verdict">
      <div class="label">为什么拆两层</div>
      <div class="text">
        任务完没完 ≠ 进程活没活<br>
        团队判断它们<span class="em">不能合并</span>
      </div>
    </div>
  </div>
</body>
</html>
