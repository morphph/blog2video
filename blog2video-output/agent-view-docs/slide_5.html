<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
      background:
        radial-gradient(circle at 25% 18%, rgba(59, 130, 246, 0.20), transparent 55%),
        radial-gradient(circle at 80% 80%, rgba(245, 158, 11, 0.14), transparent 55%),
        #0D0D1A;
    }
    .tag {
      font-size: 28px;
      color: #3B82F6;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 28px;
    }
    .title {
      font-size: 56px;
      font-weight: 900;
      line-height: 1.18;
      margin-bottom: 32px;
      letter-spacing: -1px;
    }
    .title .b { color: #3B82F6; }
    .chips {
      display: flex;
      gap: 14px;
      width: 100%;
      max-width: 920px;
      margin-bottom: 24px;
    }
    .chip {
      flex: 1;
      background: #1A1A2E;
      border-radius: 14px;
      padding: 26px 14px;
      text-align: center;
    }
    .chip.purple {
      border: 1px solid rgba(139, 92, 246, 0.5);
      border-left: 4px solid #8B5CF6;
    }
    .chip.yellow {
      border: 1px solid rgba(245, 158, 11, 0.5);
      border-left: 4px solid #F59E0B;
    }
    .chip.blue {
      border: 1px solid rgba(59, 130, 246, 0.5);
      border-left: 4px solid #3B82F6;
    }
    .chip .prefix {
      font-family: 'SF Mono', Consolas, monospace;
      font-size: 64px;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 12px;
      letter-spacing: -1px;
    }
    .chip.purple .prefix { color: #8B5CF6; }
    .chip.yellow .prefix { color: #F59E0B; }
    .chip.blue .prefix { color: #3B82F6; }
    .chip .name {
      font-size: 22px;
      color: #FFFFFF;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 4px;
    }
    .chip .sub {
      font-size: 17px;
      color: #B0B0CC;
      font-weight: 600;
      line-height: 1.3;
    }
    .compare {
      display: flex;
      gap: 16px;
      width: 100%;
      max-width: 920px;
      margin-bottom: 24px;
    }
    .side {
      flex: 1;
      background: #1A1A2E;
      border-radius: 12px;
      padding: 18px 20px;
      text-align: left;
    }
    .side.def {
      border: 1px solid rgba(107, 114, 128, 0.4);
      border-left: 4px solid #6B7280;
    }
    .side.alt {
      border: 1px solid rgba(59, 130, 246, 0.4);
      border-left: 4px solid #3B82F6;
    }
    .side .h {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 6px;
      letter-spacing: 1px;
    }
    .side.def .h { color: #6B7280; }
    .side.alt .h { color: #3B82F6; }
    .side .d {
      font-size: 19px;
      color: #FFFFFF;
      font-weight: 700;
      line-height: 1.35;
    }
    .side.def .d { color: #B0B0CC; }
    .verdict {
      background: #1A1A2E;
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-left: 4px solid #F59E0B;
      border-radius: 14px;
      padding: 22px 28px;
      max-width: 920px;
      width: 100%;
      text-align: left;
    }
    .verdict .label {
      font-size: 22px;
      color: #F59E0B;
      letter-spacing: 2px;
      font-weight: 800;
      margin-bottom: 10px;
    }
    .verdict .text {
      font-size: 26px;
      color: #FFFFFF;
      font-weight: 700;
      line-height: 1.4;
    }
    .verdict .text .em { color: #F59E0B; font-weight: 800; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="tag">一个输入框 · 两套语义</div>
    <div class="title">前缀<span class="b">切换</span>解释</div>
    <div class="chips">
      <div class="chip purple">
        <div class="prefix">a:</div>
        <div class="name">按 agent 过滤</div>
        <div class="sub">a:foo</div>
      </div>
      <div class="chip yellow">
        <div class="prefix">s:</div>
        <div class="name">按状态过滤</div>
        <div class="sub">s:blocked</div>
      </div>
      <div class="chip blue">
        <div class="prefix">#</div>
        <div class="name">按 PR 跳转</div>
        <div class="sub">#1234</div>
      </div>
    </div>
    <div class="compare">
      <div class="side def">
        <div class="h">默认行为</div>
        <div class="d">打字 + 回车<br>派一个新 session</div>
      </div>
      <div class="side alt">
        <div class="h">带前缀</div>
        <div class="d">同一个输入框<br>变成过滤器</div>
      </div>
    </div>
    <div class="verdict">
      <div class="label">省下的是什么</div>
      <div class="text">
        不是按键，是<span class="em">屏幕预算</span><br>
        不再多开一行 filter
      </div>
    </div>
  </div>
</body>
</html>
