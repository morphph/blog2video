<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
      background:
        radial-gradient(circle at 25% 18%, rgba(239, 68, 68, 0.22), transparent 55%),
        radial-gradient(circle at 80% 80%, rgba(245, 158, 11, 0.14), transparent 55%),
        #0D0D1A;
    }
    .tag {
      font-size: 28px;
      color: #EF4444;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 28px;
    }
    .title {
      font-size: 56px;
      font-weight: 900;
      line-height: 1.18;
      margin-bottom: 36px;
      letter-spacing: -1px;
    }
    .title .r { color: #EF4444; }
    .item {
      background: #1A1A2E;
      border: 1px solid rgba(239, 68, 68, 0.4);
      border-left: 4px solid #EF4444;
      border-radius: 14px;
      padding: 22px 28px;
      max-width: 920px;
      width: 100%;
      text-align: left;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .item .num {
      font-size: 56px;
      font-weight: 800;
      color: #EF4444;
      line-height: 1;
      font-family: 'SF Mono', Consolas, monospace;
      min-width: 60px;
      text-align: center;
    }
    .item .body {
      flex: 1;
    }
    .item .head {
      font-size: 26px;
      color: #FFFFFF;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 6px;
    }
    .item .head .em { color: #EF4444; font-weight: 800; }
    .item .sub {
      font-size: 19px;
      color: #B0B0CC;
      font-weight: 600;
      line-height: 1.35;
    }
    .item .sub .mono {
      font-family: 'SF Mono', Consolas, monospace;
      color: #F59E0B;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="tag">爽点之外 · 三条代价</div>
    <div class="title">文档里<span class="r">没省略</span>的账</div>
    <div class="item">
      <div class="num">1</div>
      <div class="body">
        <div class="head">瓶颈是<span class="em">订阅配额</span></div>
        <div class="sub">10 个并发 = 10 份配额在烧</div>
      </div>
    </div>
    <div class="item">
      <div class="num">2</div>
      <div class="body">
        <div class="head">删 session = <span class="em">删 worktree</span></div>
        <div class="sub">未 commit 的改动全部丢掉</div>
      </div>
    </div>
    <div class="item">
      <div class="num">3</div>
      <div class="body">
        <div class="head"><span class="em">排错路径</span>变长</div>
        <div class="sub">状态散在 <span class="mono">daemon.log</span> / <span class="mono">roster.json</span> / <span class="mono">state.json</span></div>
      </div>
    </div>
  </div>
</body>
</html>
