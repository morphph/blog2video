<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
      background:
        radial-gradient(circle at 25% 18%, rgba(139, 92, 246, 0.26), transparent 55%),
        radial-gradient(circle at 80% 82%, rgba(245, 158, 11, 0.16), transparent 55%),
        #0D0D1A;
    }
    .tag {
      font-size: 28px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 30px;
    }
    .big-quote {
      font-size: 80px;
      font-weight: 900;
      line-height: 1.16;
      letter-spacing: -2px;
      margin-bottom: 40px;
      text-align: center;
    }
    .big-quote .gray { color: #6B7280; }
    .big-quote .strike {
      color: #6B7280;
      text-decoration: line-through;
      text-decoration-color: rgba(239, 68, 68, 0.7);
      text-decoration-thickness: 4px;
    }
    .big-quote .p { color: #8B5CF6; }
    .arrow-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      width: 100%;
      max-width: 920px;
      margin-bottom: 28px;
    }
    .pill {
      background: #1A1A2E;
      border-radius: 999px;
      padding: 16px 30px;
      font-size: 28px;
      font-weight: 800;
      line-height: 1;
    }
    .pill.from {
      border: 1px solid rgba(107, 114, 128, 0.5);
      color: #6B7280;
    }
    .pill.to {
      border: 1px solid rgba(139, 92, 246, 0.5);
      color: #8B5CF6;
    }
    .arr {
      font-size: 36px;
      color: #8B5CF6;
      font-weight: 900;
    }
    .verdict {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.45);
      border-left: 4px solid #8B5CF6;
      border-radius: 14px;
      padding: 26px 32px;
      max-width: 920px;
      width: 100%;
      text-align: left;
    }
    .verdict .label {
      font-size: 22px;
      color: #8B5CF6;
      letter-spacing: 2px;
      font-weight: 800;
      margin-bottom: 14px;
    }
    .verdict .text {
      font-size: 28px;
      color: #FFFFFF;
      font-weight: 700;
      line-height: 1.45;
    }
    .verdict .text .em { color: #F59E0B; font-weight: 800; }
    .verdict .text .pp { color: #8B5CF6; font-weight: 800; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="tag">中间隔的，是基础设施</div>
    <div class="big-quote">
      session <span class="strike">是 tab</span><br>
      session 是<span class="p">系统对象</span>
    </div>
    <div class="arrow-row">
      <div class="pill from">UI 概念</div>
      <div class="arr">→</div>
      <div class="pill to">架构概念</div>
    </div>
    <div class="verdict">
      <div class="label">从 TAB 到对象 · 三件基建</div>
      <div class="text">
        <span class="pp">supervisor</span> 常驻进程<br>
        <span class="pp">state.json</span> 持久化合约<br>
        <span class="em">双层 indicator</span> 维度拆分
      </div>
    </div>
  </div>
</body>
</html>
