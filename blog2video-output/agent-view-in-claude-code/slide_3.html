<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
      background:
        radial-gradient(circle at 25% 20%, rgba(139, 92, 246, 0.24), transparent 55%),
        radial-gradient(circle at 80% 82%, rgba(245, 158, 11, 0.14), transparent 55%),
        #0D0D1A;
    }
    .tag {
      font-size: 28px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 32px;
    }
    .title {
      font-size: 58px;
      font-weight: 900;
      line-height: 1.18;
      margin-bottom: 40px;
      letter-spacing: -1px;
    }
    .title .p { color: #8B5CF6; }
    .compare {
      display: flex;
      gap: 18px;
      width: 100%;
      max-width: 920px;
      margin-bottom: 32px;
    }
    .col {
      flex: 1;
      background: #1A1A2E;
      border-radius: 14px;
      padding: 28px 22px;
      text-align: center;
    }
    .col.red {
      border: 1px solid rgba(239, 68, 68, 0.4);
      border-left: 4px solid #EF4444;
    }
    .col.green {
      border: 1px solid rgba(16, 185, 129, 0.4);
      border-left: 4px solid #10B981;
    }
    .col .big {
      font-size: 64px;
      font-weight: 900;
      line-height: 1;
      margin-bottom: 14px;
      letter-spacing: -1px;
    }
    .col.red .big { color: #EF4444; }
    .col.green .big { color: #10B981; }
    .col .label {
      font-size: 22px;
      color: #B0B0CC;
      font-weight: 700;
      line-height: 1.35;
    }
    .shift {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.4);
      border-left: 4px solid #8B5CF6;
      border-radius: 14px;
      padding: 24px 28px;
      max-width: 920px;
      width: 100%;
      margin-bottom: 24px;
    }
    .shift .from {
      font-size: 56px;
      color: #6B7280;
      font-weight: 900;
      font-family: 'SF Mono', Consolas, monospace;
    }
    .shift .arrow {
      font-size: 48px;
      color: #8B5CF6;
      font-weight: 900;
    }
    .shift .to {
      font-size: 64px;
      color: #8B5CF6;
      font-weight: 900;
      font-family: 'SF Mono', Consolas, monospace;
    }
    .verdict {
      background: #1A1A2E;
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-left: 4px solid #F59E0B;
      border-radius: 14px;
      padding: 22px 28px;
      max-width: 920px;
      width: 100%;
      text-align: left;
    }
    .verdict .label {
      font-size: 22px;
      color: #F59E0B;
      letter-spacing: 2px;
      font-weight: 800;
      margin-bottom: 10px;
    }
    .verdict .text {
      font-size: 28px;
      color: #FFFFFF;
      font-weight: 700;
      line-height: 1.4;
    }
    .verdict .text .em { color: #F59E0B; font-weight: 800; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="tag">真正的瓶颈在哪</div>
    <div class="title">不是<span class="p">算力</span>，是<span class="p">注意力调度</span></div>
    <div class="compare">
      <div class="col red">
        <div class="big">10 个</div>
        <div class="label">同时跑 session<br>模型早就能</div>
      </div>
      <div class="col green">
        <div class="big">谁卡我?</div>
        <div class="label">没人正面解决<br>这才是难题</div>
      </div>
    </div>
    <div class="shift">
      <div class="from">N = 1</div>
      <div class="arrow">→</div>
      <div class="to">N &gt; 1</div>
    </div>
    <div class="verdict">
      <div class="label">潜台词</div>
      <div class="text">
        一个用户管一个 Agent 的时代<br>
        <span class="em">已经过去了</span>
      </div>
    </div>
  </div>
</body>
</html>
