<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
      background:
        radial-gradient(circle at 25% 18%, rgba(245, 158, 11, 0.18), transparent 55%),
        radial-gradient(circle at 80% 80%, rgba(59, 130, 246, 0.16), transparent 55%),
        #0D0D1A;
    }
    .tag {
      font-size: 28px;
      color: #F59E0B;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 28px;
    }
    .title {
      font-size: 54px;
      font-weight: 900;
      line-height: 1.18;
      margin-bottom: 28px;
      letter-spacing: -1px;
    }
    .title .y { color: #F59E0B; }
    .chips {
      display: flex;
      gap: 14px;
      width: 100%;
      max-width: 920px;
      margin-bottom: 28px;
    }
    .chip {
      flex: 1;
      background: #1A1A2E;
      border-radius: 14px;
      padding: 26px 14px;
      text-align: center;
    }
    .chip.y {
      border: 1px solid rgba(245, 158, 11, 0.5);
      border-left: 4px solid #F59E0B;
    }
    .chip.b {
      border: 1px solid rgba(59, 130, 246, 0.5);
      border-left: 4px solid #3B82F6;
    }
    .chip.g {
      border: 1px solid rgba(16, 185, 129, 0.5);
      border-left: 4px solid #10B981;
    }
    .chip .name {
      font-size: 38px;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
      font-family: 'SF Mono', Consolas, monospace;
    }
    .chip.y .name { color: #F59E0B; }
    .chip.b .name { color: #3B82F6; }
    .chip.g .name { color: #10B981; }
    .chip .meaning {
      font-size: 20px;
      color: #FFFFFF;
      font-weight: 700;
      line-height: 1.35;
      margin-bottom: 6px;
    }
    .chip .sub {
      font-size: 17px;
      color: #B0B0CC;
      font-weight: 600;
      line-height: 1.3;
    }
    .compare {
      display: flex;
      gap: 16px;
      width: 100%;
      max-width: 920px;
      margin-bottom: 22px;
    }
    .side {
      flex: 1;
      background: #1A1A2E;
      border-radius: 12px;
      padding: 18px 20px;
      text-align: left;
    }
    .side.muted {
      border: 1px solid rgba(107, 114, 128, 0.4);
      border-left: 4px solid #6B7280;
    }
    .side.purple {
      border: 1px solid rgba(139, 92, 246, 0.4);
      border-left: 4px solid #8B5CF6;
    }
    .side .h {
      font-size: 24px;
      font-weight: 900;
      margin-bottom: 6px;
      font-family: 'SF Mono', Consolas, monospace;
      letter-spacing: 0.5px;
    }
    .side.muted .h { color: #6B7280; }
    .side.purple .h { color: #8B5CF6; }
    .side .d {
      font-size: 19px;
      color: #B0B0CC;
      font-weight: 600;
      line-height: 1.35;
    }
    .verdict {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.4);
      border-left: 4px solid #8B5CF6;
      border-radius: 14px;
      padding: 20px 28px;
      max-width: 920px;
      width: 100%;
      text-align: left;
    }
    .verdict .label {
      font-size: 22px;
      color: #8B5CF6;
      letter-spacing: 2px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .verdict .text {
      font-size: 26px;
      color: #FFFFFF;
      font-weight: 700;
      line-height: 1.4;
    }
    .verdict .text .em { color: #8B5CF6; font-weight: 800; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="tag">三个状态 · 一个立场</div>
    <div class="title">最显眼的位置留给<span class="y">谁在等我</span></div>
    <div class="chips">
      <div class="chip y">
        <div class="name">waiting</div>
        <div class="meaning">在等你输入</div>
        <div class="sub">阻塞下游</div>
      </div>
      <div class="chip b">
        <div class="name">working</div>
        <div class="meaning">还在跑</div>
        <div class="sub">先不打扰</div>
      </div>
      <div class="chip g">
        <div class="name">done</div>
        <div class="meaning">干完了</div>
        <div class="sub">可以验收</div>
      </div>
    </div>
    <div class="compare">
      <div class="side muted">
        <div class="h">dashboard</div>
        <div class="d">系统全貌<br>完成产物置顶</div>
      </div>
      <div class="side purple">
        <div class="h">inbox</div>
        <div class="d">谁在卡我<br>卡点必须置顶</div>
      </div>
    </div>
    <div class="verdict">
      <div class="label">有立场的产品判断</div>
      <div class="text">
        把<span class="em">卡点</span>放最前，因为它<br>
        会阻塞其他所有 Agent
      </div>
    </div>
  </div>
</body>
</html>
