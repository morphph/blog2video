<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
      background:
        radial-gradient(circle at 25% 18%, rgba(239, 68, 68, 0.20), transparent 55%),
        radial-gradient(circle at 80% 80%, rgba(245, 158, 11, 0.14), transparent 55%),
        #0D0D1A;
    }
    .tag {
      font-size: 28px;
      color: #EF4444;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 28px;
    }
    .title {
      font-size: 54px;
      font-weight: 900;
      line-height: 1.18;
      margin-bottom: 30px;
      letter-spacing: -1px;
    }
    .title .r { color: #EF4444; }
    .curve {
      display: flex;
      gap: 14px;
      width: 100%;
      max-width: 920px;
      margin-bottom: 26px;
    }
    .seg {
      flex: 1;
      background: #1A1A2E;
      border-radius: 12px;
      padding: 22px 14px;
      text-align: center;
    }
    .seg.bad {
      border: 1px solid rgba(239, 68, 68, 0.4);
      border-left: 4px solid #EF4444;
    }
    .seg.mid {
      border: 1px solid rgba(107, 114, 128, 0.4);
      border-left: 4px solid #6B7280;
    }
    .seg.win {
      border: 1px solid rgba(16, 185, 129, 0.5);
      border-left: 4px solid #10B981;
    }
    .seg .n {
      font-size: 56px;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 8px;
      font-family: 'SF Mono', Consolas, monospace;
    }
    .seg.bad .n { color: #EF4444; }
    .seg.mid .n { color: #B0B0CC; }
    .seg.win .n { color: #10B981; }
    .seg .label {
      font-size: 18px;
      color: #FFFFFF;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 4px;
    }
    .seg .verdict {
      font-size: 16px;
      color: #B0B0CC;
      font-weight: 600;
      line-height: 1.3;
    }
    .cost {
      background: #1A1A2E;
      border: 1px solid rgba(239, 68, 68, 0.4);
      border-left: 4px solid #EF4444;
      border-radius: 14px;
      padding: 24px 28px;
      max-width: 920px;
      width: 100%;
      text-align: left;
      margin-bottom: 18px;
    }
    .cost .label {
      font-size: 22px;
      color: #EF4444;
      letter-spacing: 2px;
      font-weight: 800;
      margin-bottom: 10px;
    }
    .cost .text {
      font-size: 26px;
      color: #FFFFFF;
      font-weight: 700;
      line-height: 1.4;
    }
    .cost .text .em { color: #EF4444; font-weight: 800; }
    .note {
      background: #1A1A2E;
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-left: 4px solid #F59E0B;
      border-radius: 12px;
      padding: 18px 24px;
      max-width: 920px;
      width: 100%;
      text-align: left;
    }
    .note .text {
      font-size: 22px;
      color: #FFFFFF;
      font-weight: 700;
      line-height: 1.4;
    }
    .note .text .em { color: #F59E0B; font-weight: 800; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="tag">诚实讲 · 价值非线性</div>
    <div class="title">这个产品<span class="r">不是普惠的</span></div>
    <div class="curve">
      <div class="seg bad">
        <div class="n">1</div>
        <div class="label">只开 1 个</div>
        <div class="verdict">负收益</div>
      </div>
      <div class="seg mid">
        <div class="n">3</div>
        <div class="label">开到 3 个</div>
        <div class="verdict">收益一般</div>
      </div>
      <div class="seg win">
        <div class="n">10</div>
        <div class="label">开到 10 个</div>
        <div class="verdict">指数上升</div>
      </div>
    </div>
    <div class="cost">
      <div class="label">隐性代价</div>
      <div class="text">
        tmux 帮你<span class="em">忘掉</span>后台 session<br>
        inbox 把所有东西摊在你面前
      </div>
    </div>
    <div class="note">
      <div class="text">
        哪个派后台、哪个前台盯<br>
        <span class="em">这道题 agent view 没替你答</span>
      </div>
    </div>
  </div>
</body>
</html>
