<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
      background:
        radial-gradient(circle at 25% 18%, rgba(16, 185, 129, 0.18), transparent 55%),
        radial-gradient(circle at 80% 82%, rgba(139, 92, 246, 0.20), transparent 55%),
        #0D0D1A;
    }
    .tag {
      font-size: 28px;
      color: #10B981;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 30px;
    }
    .title {
      font-size: 54px;
      font-weight: 900;
      line-height: 1.18;
      margin-bottom: 34px;
      letter-spacing: -1px;
    }
    .title .g { color: #10B981; }
    .verdict {
      background: #1A1A2E;
      border: 1px solid rgba(16, 185, 129, 0.4);
      border-left: 4px solid #10B981;
      border-radius: 14px;
      padding: 26px 32px;
      max-width: 920px;
      width: 100%;
      text-align: left;
      margin-bottom: 24px;
    }
    .verdict .label {
      font-size: 22px;
      color: #10B981;
      letter-spacing: 2px;
      font-weight: 800;
      margin-bottom: 12px;
    }
    .verdict .text {
      font-size: 28px;
      color: #FFFFFF;
      font-weight: 700;
      line-height: 1.45;
    }
    .verdict .text .em { color: #10B981; font-weight: 800; }
    .shift {
      display: flex;
      gap: 16px;
      width: 100%;
      max-width: 920px;
      margin-bottom: 24px;
    }
    .side {
      flex: 1;
      background: #1A1A2E;
      border-radius: 12px;
      padding: 22px 20px;
      text-align: left;
    }
    .side.before {
      border: 1px solid rgba(107, 114, 128, 0.4);
      border-left: 4px solid #6B7280;
    }
    .side.after {
      border: 1px solid rgba(139, 92, 246, 0.4);
      border-left: 4px solid #8B5CF6;
    }
    .side .h {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }
    .side.before .h { color: #6B7280; }
    .side.after .h { color: #8B5CF6; }
    .side .d {
      font-size: 22px;
      color: #FFFFFF;
      font-weight: 700;
      line-height: 1.4;
    }
    .side.before .d { color: #B0B0CC; }
    .question {
      background: #1A1A2E;
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-left: 4px solid #F59E0B;
      border-radius: 14px;
      padding: 24px 28px;
      max-width: 920px;
      width: 100%;
      text-align: left;
    }
    .question .label {
      font-size: 22px;
      color: #F59E0B;
      letter-spacing: 2px;
      font-weight: 800;
      margin-bottom: 10px;
    }
    .question .text {
      font-size: 28px;
      color: #FFFFFF;
      font-weight: 700;
      line-height: 1.4;
    }
    .question .text .em { color: #F59E0B; font-weight: 800; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="tag">所以我的判断</div>
    <div class="title">把脑子里的账本<span class="g">做成了产品</span></div>
    <div class="verdict">
      <div class="label">本质</div>
      <div class="text">
        不是 UI 改进，是 Anthropic 承认<br>
        一人管多 Agent 已是<span class="em">默认场景</span>
      </div>
    </div>
    <div class="shift">
      <div class="side before">
        <div class="h">以前</div>
        <div class="d">各跑各的<br>靠你脑子串</div>
      </div>
      <div class="side after">
        <div class="h">现在</div>
        <div class="d">同一个 inbox<br>系统帮你串</div>
      </div>
    </div>
    <div class="question">
      <div class="label">下一个问题</div>
      <div class="text">
        20 个 Agent 堆满 inbox<br>
        谁帮你决定<span class="em">先回哪个</span>？
      </div>
    </div>
  </div>
</body>
</html>
