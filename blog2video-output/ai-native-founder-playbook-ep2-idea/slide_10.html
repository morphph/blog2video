<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0D0D1A;font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;color:#FFFFFF;overflow:hidden}
.slide{width:100%;height:100%;padding:200px 72px 420px 72px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.kick{font-size:30px;font-weight:700;letter-spacing:.1em;color:#10B981;margin-bottom:24px}
.title{font-size:70px;font-weight:800;line-height:1.22}
.title .hl{color:#10B981}
.list{display:flex;flex-direction:column;gap:18px;width:100%;margin-top:56px}
.item{display:flex;align-items:center;gap:22px;background:#1A1A2E;border:1px solid rgba(16,185,129,0.22);border-left:4px solid #10B981;border-radius:12px;padding:28px 30px;text-align:left}
.item .tick{flex-shrink:0;width:46px;height:46px;border-radius:50%;background:rgba(16,185,129,0.15);color:#10B981;font-size:30px;font-weight:800;display:flex;align-items:center;justify-content:center}
.item .t{font-size:38px;font-weight:700}
.item .t .em{color:#10B981}
.punch{margin-top:46px;font-size:38px;font-weight:700;line-height:1.4;color:#B0B0CC}
.punch .em{color:#10B981;font-weight:800}
</style>
</head>
<body>
<div class="slide">
  <div class="kick">解药</div>
  <div class="title">同一个工具，<br><span class="hl">方向反过来用</span></div>
  <div class="list">
    <div class="item"><span class="tick">✓</span><span class="t">让 Claude 主动论证「<span class="em">你是错的</span>」</span></div>
    <div class="item"><span class="tick">✓</span><span class="t">帮你找<span class="em">反驳假设</span>的证据</span></div>
  </div>
  <div class="punch">它<span class="em">压测</span>想法的本事，<br>和<span class="em">吹捧</span>想法的本事，一样强</div>
</div>
</body>
</html>
