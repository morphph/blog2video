<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0D0D1A;font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;color:#FFFFFF;overflow:hidden}
.slide{width:100%;height:100%;padding:200px 72px 420px 72px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.kick{font-size:30px;font-weight:700;letter-spacing:.08em;color:#8B5CF6;margin-bottom:22px}
.title{font-size:62px;font-weight:800;line-height:1.25}
.title .hl{color:#EF4444}
.en{font-size:32px;font-weight:700;letter-spacing:.04em;color:#6B7280;margin-top:12px}
.concept{width:100%;margin-top:48px;background:#1A1A2E;border:1px solid rgba(139,92,246,0.3);border-left:6px solid #8B5CF6;border-radius:14px;padding:34px 32px;text-align:left}
.concept .l{font-size:28px;font-weight:700;letter-spacing:.05em;color:#8B5CF6;margin-bottom:14px}
.concept .b{font-size:40px;font-weight:700;line-height:1.4}
.concept .b .em{color:#8B5CF6}
.tag{margin-top:32px;display:inline-flex;align-items:center;gap:14px;font-size:34px;font-weight:800;color:#8B5CF6;border:1px solid rgba(139,92,246,0.45);border-radius:999px;padding:16px 34px}
.footer{width:100%;margin-top:36px;background:#1A1A2E;border:1px solid rgba(16,185,129,0.35);border-left:6px solid #10B981;border-radius:14px;padding:30px 32px;text-align:left}
.footer .b{font-size:44px;font-weight:800;line-height:1.3}
.footer .b .em{color:#10B981}
</style>
</head>
<body>
<div class="slide">
  <div class="kick">创业者的通病</div>
  <div class="title">竞品忽视</div>
  <div class="en">competitor neglect</div>
  <div class="concept">
    <div class="l">反过来用</div>
    <div class="b">让 Claude 论证：为什么<span class="em">竞品会赢</span>，而你会输</div>
  </div>
  <div class="tag">结构化的「魔鬼代言人」</div>
  <div class="footer"><div class="b">系统里的判断力，<span class="em">是你的</span></div></div>
</div>
</body>
</html>
