<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0D0D1A;font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;color:#FFFFFF;overflow:hidden}
.slide{width:100%;height:100%;padding:200px 72px 420px 72px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.glow{position:absolute;top:520px;left:50%;transform:translateX(-50%);width:720px;height:720px;background:radial-gradient(circle,rgba(245,158,11,0.14) 0%,rgba(245,158,11,0) 70%);pointer-events:none}
.kick{position:relative;font-size:30px;font-weight:700;letter-spacing:.08em;color:#8B5CF6;margin-bottom:28px}
.label{position:relative;font-size:34px;font-weight:700;color:#B0B0CC;margin-bottom:18px}
.title{position:relative;font-size:80px;font-weight:800;line-height:1.2}
.title .hl{color:#F59E0B}
.sub{position:relative;font-size:36px;color:#6B7280;margin-top:40px;font-weight:700}
.sub .em{color:#B0B0CC}
</style>
</head>
<body>
<div class="slide">
  <div class="glow"></div>
  <div class="kick">怎么落地</div>
  <div class="label">第一道门槛，朴素却卡住一大片人</div>
  <div class="title">你的问题，<br>得能<span class="hl">被证伪</span></div>
  <div class="sub">给你<span class="em">两组对比</span>，立刻就懂</div>
</div>
</body>
</html>
