<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0D0D1A;font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;color:#FFFFFF;overflow:hidden}
.slide{width:100%;height:100%;padding:200px 72px 420px 72px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.kick{font-size:30px;font-weight:700;letter-spacing:.08em;color:#8B5CF6;margin-bottom:22px}
.title{font-size:72px;font-weight:800;line-height:1.22}
.title .bad{color:#EF4444}
.title .good{color:#10B981}
.cards{display:flex;flex-direction:column;gap:24px;width:100%;margin-top:54px}
.card{background:#1A1A2E;border-radius:14px;padding:32px 32px;text-align:left}
.card.no{border:1px solid rgba(239,68,68,0.3);border-left:6px solid #EF4444}
.card.yes{border:1px solid rgba(16,185,129,0.3);border-left:6px solid #10B981}
.card .l{font-size:28px;font-weight:700;letter-spacing:.04em;margin-bottom:14px}
.card.no .l{color:#EF4444}
.card.yes .l{color:#10B981}
.card .q{font-size:40px;font-weight:800;line-height:1.35}
.card .r{font-size:30px;font-weight:700;margin-top:14px}
.card.no .r{color:#9CA3AF}
.card.yes .r{color:#10B981}
</style>
</head>
<body>
<div class="slide">
  <div class="kick">约客户聊的时候</div>
  <div class="title">别问<span class="bad">未来</span>，<br>问<span class="good">过去</span></div>
  <div class="cards">
    <div class="card no">
      <div class="l">新手 · 指向未来</div>
      <div class="q">「你会用一个这样的东西吗？」</div>
      <div class="r">→ 全是噪声，人对未来过度乐观</div>
    </div>
    <div class="card yes">
      <div class="l">老手 · 指向过去</div>
      <div class="q">「上次碰到这个，你怎么处理的？」</div>
      <div class="r">→ 过去的行为，不会撒谎</div>
    </div>
  </div>
</div>
</body>
</html>
