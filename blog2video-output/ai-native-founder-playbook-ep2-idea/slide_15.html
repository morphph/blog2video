<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0D0D1A;font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;color:#FFFFFF;overflow:hidden}
.slide{width:100%;height:100%;padding:200px 72px 420px 72px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.kick{font-size:30px;font-weight:700;letter-spacing:.08em;color:#8B5CF6;margin-bottom:22px}
.title{font-size:62px;font-weight:800;line-height:1.25}
.title .muted{color:#9CA3AF}
.warn{width:100%;margin-top:46px;background:#1A1A2E;border:1px solid rgba(245,158,11,0.35);border-left:6px solid #F59E0B;border-radius:14px;padding:30px 32px;text-align:left}
.warn .b{font-size:38px;font-weight:700;line-height:1.4}
.warn .b .em{color:#F59E0B;font-weight:800}
.tightrope{display:flex;align-items:stretch;gap:16px;width:100%;margin-top:40px}
.end{flex:1;background:#1A1A2E;border:1px solid rgba(239,68,68,0.3);border-radius:12px;padding:28px 22px;font-size:36px;font-weight:800;color:#EF4444}
.mid{flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;width:170px;background:#1A1A2E;border:1px solid rgba(16,185,129,0.4);border-radius:12px;padding:20px 12px}
.mid .l{font-size:24px;font-weight:700;color:#6B7280;margin-bottom:8px}
.mid .v{font-size:34px;font-weight:800;color:#10B981;line-height:1.2}
</style>
</head>
<body>
<div class="slide">
  <div class="kick">诚实的另一面</div>
  <div class="title">这套纪律有代价：<br><span class="muted">慢，而且反人性</span></div>
  <div class="warn"><div class="b">但「等一个 <span class="em">100% 确定性</span>」，<br>本身就是另一种失败模式</div></div>
  <div class="tightrope">
    <div class="end">动太快</div>
    <div class="mid"><div class="l">走钢丝</div><div class="v">平衡点</div></div>
    <div class="end">等太久</div>
  </div>
</div>
</body>
</html>
