<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0D0D1A;font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;color:#FFFFFF;overflow:hidden}
.slide{width:100%;height:100%;padding:200px 72px 420px 72px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.glow{position:absolute;top:330px;left:50%;transform:translateX(-50%);width:760px;height:760px;background:radial-gradient(circle,rgba(139,92,246,0.18) 0%,rgba(139,92,246,0) 70%);pointer-events:none}
.kick{position:relative;font-size:30px;font-weight:700;letter-spacing:.08em;color:#8B5CF6;margin-bottom:18px}
.title{position:relative;font-size:64px;font-weight:800;line-height:1.2}
.title .big{font-size:140px;font-weight:800;color:#8B5CF6;display:inline-block;vertical-align:-22px}
.title .hl{color:#8B5CF6}
.lead{position:relative;font-size:32px;color:#6B7280;margin-top:24px;line-height:1.45}
.concept{position:relative;width:100%;margin-top:50px;background:#1A1A2E;border:1px solid rgba(139,92,246,0.3);border-left:6px solid #8B5CF6;border-radius:14px;padding:36px 32px;text-align:left}
.concept .l{font-size:28px;font-weight:700;letter-spacing:.05em;color:#8B5CF6;margin-bottom:14px}
.concept .b{font-size:42px;font-weight:800;line-height:1.4}
.concept .b .em{color:#8B5CF6}
</style>
</head>
<body>
<div class="slide">
  <div class="glow"></div>
  <div class="kick">Claude Code 真正登场的时刻</div>
  <div class="title">只做<span class="big">1</span>个<br><span class="hl">核心交互</span></div>
  <div class="lead">功课都做完了：问题真、知道谁有、方案有证据支撑</div>
  <div class="concept">
    <div class="l">不是做一个真正的产品</div>
    <div class="b">定义你方案<span class="em">最依赖</span>的那一个交互<br>让 Claude Code 只做这一个</div>
  </div>
</div>
</body>
</html>
