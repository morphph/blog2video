<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0D0D1A;font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;color:#FFFFFF;overflow:hidden}
.slide{width:100%;height:100%;padding:200px 72px 420px 72px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.kick{font-size:30px;font-weight:700;letter-spacing:.1em;color:#8B5CF6;margin-bottom:24px}
.title{font-size:58px;font-weight:800;line-height:1.25}
.title .hl{color:#F59E0B}
.list{display:flex;flex-direction:column;gap:18px;width:100%;margin-top:48px}
.row{display:flex;align-items:flex-start;gap:20px;background:#1A1A2E;border:1px solid rgba(139,92,246,0.22);border-left:4px solid #8B5CF6;border-radius:12px;padding:26px 28px;text-align:left}
.row .n{flex-shrink:0;font-size:34px;font-weight:800;color:#8B5CF6;width:42px}
.row .t{font-size:34px;font-weight:700;line-height:1.35}
.row .t .em{color:#F59E0B}
.row .t .g{color:#10B981}
.next{width:100%;margin-top:40px;background:#1A1A2E;border:1px solid rgba(16,185,129,0.35);border-left:6px solid #10B981;border-radius:14px;padding:28px 30px;text-align:left;display:flex;align-items:center;gap:20px}
.next .lab{flex-shrink:0;font-size:26px;font-weight:800;letter-spacing:.05em;color:#10B981;border:1px solid rgba(16,185,129,0.5);border-radius:999px;padding:10px 22px}
.next .t{font-size:34px;font-weight:800}
.next .t .em{color:#10B981}
</style>
</head>
<body>
<div class="slide">
  <div class="kick">收束成一句话</div>
  <div class="title">「做出来」第一次，<br>不再等于「<span class="hl">我对了</span>」</div>
  <div class="list">
    <div class="row"><span class="n">1</span><span class="t">稀缺的不是「能不能做」，是<span class="em">在证据出现前忍住不做</span></span></div>
    <div class="row"><span class="n">2</span><span class="t">原型只是道具，<span class="g">对话才是证据</span></span></div>
    <div class="row"><span class="n">3</span><span class="t">走到尽头，手里攥的不是赌注，是<span class="g">一摞证据</span></span></div>
  </div>
  <div class="next">
    <span class="lab">下一集</span>
    <span class="t">把验证过的想法，变成 <span class="em">MVP</span>·最小可用产品</span>
  </div>
</div>
</body>
</html>
