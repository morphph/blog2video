<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0D0D1A;font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;color:#FFFFFF;overflow:hidden}
.slide{width:100%;height:100%;padding:200px 72px 420px 72px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.kick{font-size:30px;font-weight:700;letter-spacing:.1em;color:#8B5CF6;margin-bottom:24px}
.title{font-size:72px;font-weight:800;line-height:1.22}
.title .hl{color:#8B5CF6}
.list{display:flex;flex-direction:column;gap:18px;width:100%;margin-top:56px}
.item{display:flex;align-items:center;gap:22px;background:#1A1A2E;border:1px solid rgba(139,92,246,0.22);border-left:4px solid #8B5CF6;border-radius:12px;padding:26px 30px;text-align:left}
.item .tick{flex-shrink:0;width:44px;height:44px;border-radius:50%;background:rgba(139,92,246,0.15);color:#8B5CF6;font-size:26px;font-weight:800;display:flex;align-items:center;justify-content:center}
.item .t{font-size:38px;font-weight:700}
.punch{margin-top:48px;font-size:42px;font-weight:800;line-height:1.4}
.punch .hl{color:#F59E0B}
</style>
</head>
<body>
<div class="slide">
  <div class="kick">这个阶段的目标</div>
  <div class="title">不是「动手做」，<br>是<span class="hl">研究式的验证</span></div>
  <div class="list">
    <div class="item"><span class="tick">01</span><span class="t">调研</span></div>
    <div class="item"><span class="tick">02</span><span class="t">客户访谈</span></div>
    <div class="item"><span class="tick">03</span><span class="t">把竞争格局看清楚</span></div>
    <div class="item"><span class="tick">04</span><span class="t">诚实面对反对你的证据</span></div>
  </div>
  <div class="punch">都在写下<span class="hl">第一行生产代码</span>之前</div>
</div>
</body>
</html>
