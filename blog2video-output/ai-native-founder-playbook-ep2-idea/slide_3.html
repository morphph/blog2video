<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0D0D1A;font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;color:#FFFFFF;overflow:hidden}
.slide{width:100%;height:100%;padding:200px 72px 420px 72px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.kick{font-size:30px;font-weight:700;letter-spacing:.08em;color:#8B5CF6;margin-bottom:24px}
.title{font-size:64px;font-weight:800;line-height:1.22}
.title .hl{color:#10B981}
.en{font-size:34px;font-weight:700;letter-spacing:.04em;color:#6B7280;margin-top:14px}
.concept{width:100%;margin-top:50px;background:#1A1A2E;border:1px solid rgba(16,185,129,0.3);border-left:6px solid #10B981;border-radius:14px;padding:34px 32px;text-align:left}
.concept .l{font-size:28px;font-weight:700;letter-spacing:.06em;color:#10B981;margin-bottom:14px}
.concept .b{font-size:40px;font-weight:700;line-height:1.4}
.concept .b .em{color:#10B981}
.warn{width:100%;margin-top:30px;background:#1A1A2E;border:1px solid rgba(239,68,68,0.35);border-left:6px solid #EF4444;border-radius:14px;padding:34px 32px;text-align:left}
.warn .l{font-size:28px;font-weight:700;letter-spacing:.06em;color:#EF4444;margin-bottom:14px}
.warn .b{font-size:46px;font-weight:800;line-height:1.38}
.warn .b .em{color:#F59E0B}
</style>
</head>
<body>
<div class="slide">
  <div class="kick">这一程的出口</div>
  <div class="title">问题与方案匹配</div>
  <div class="en">problem-solution fit</div>
  <div class="concept">
    <div class="l">你已握着实打实的证据</div>
    <div class="b">为<span class="em">真实的人</span>，解决一个<span class="em">真实的问题</span></div>
  </div>
  <div class="warn">
    <div class="l">最致命的错，都发生在这里</div>
    <div class="b">你跑得，比你<span class="em">真正理解的</span>，要快</div>
  </div>
</div>
</body>
</html>
