<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0D0D1A;font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;color:#FFFFFF;overflow:hidden}
.slide{width:100%;height:100%;padding:200px 72px 420px 72px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.glow{position:absolute;top:360px;left:50%;transform:translateX(-50%);width:760px;height:760px;background:radial-gradient(circle,rgba(239,68,68,0.16) 0%,rgba(239,68,68,0) 70%);pointer-events:none}
.kick{position:relative;font-size:30px;font-weight:700;letter-spacing:.08em;color:#8B5CF6;margin-bottom:8px}
.bignum{position:relative;font-size:340px;font-weight:800;line-height:0.92;color:#EF4444;letter-spacing:-.04em}
.bignum .u{font-size:120px;font-weight:800;color:#EF4444}
.cap{position:relative;font-size:48px;font-weight:800;margin-top:12px;line-height:1.3}
.cap .hl{color:#F59E0B}
.note{position:relative;width:100%;margin-top:54px;background:#1A1A2E;border:1px solid rgba(245,158,11,0.35);border-left:6px solid #F59E0B;border-radius:14px;padding:32px 30px;text-align:left}
.note .b{font-size:36px;font-weight:700;line-height:1.4;color:#B0B0CC}
.note .b .em{color:#F59E0B;font-weight:800}
</style>
</head>
<body>
<div class="slide">
  <div class="glow"></div>
  <div class="kick">全片最重要的翻转</div>
  <div class="bignum">42<span class="u">%</span></div>
  <div class="cap">创业公司，死于<br>「<span class="hl">做了没人想要的东西</span>」</div>
  <div class="note">
    <div class="b">这还是 AI <span class="em">不会自己写代码</span>时的数据<br>如今做产品几乎瞬间，失败率<span class="em">只会更高</span></div>
  </div>
</div>
</body>
</html>
