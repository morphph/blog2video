<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0D0D1A;font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;color:#FFFFFF;overflow:hidden}
.slide{width:100%;height:100%;padding:200px 72px 420px 72px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.kick{font-size:30px;font-weight:700;letter-spacing:.08em;color:#8B5CF6;margin-bottom:22px}
.title{font-size:68px;font-weight:800;line-height:1.22}
.title .hl{color:#EF4444}
.lead{font-size:34px;color:#B0B0CC;margin-top:24px;line-height:1.45}
.lead .em{color:#F59E0B;font-weight:700}
.flow{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:14px;width:100%;margin-top:46px}
.step{background:#1A1A2E;border:1px solid rgba(239,68,68,0.3);border-radius:10px;padding:18px 26px;font-size:32px;font-weight:700;color:#B0B0CC}
.arrow{color:#6B7280;font-size:30px;font-weight:800}
.concept{width:100%;margin-top:50px;background:#1A1A2E;border:1px solid rgba(16,185,129,0.35);border-left:6px solid #10B981;border-radius:14px;padding:34px 32px;text-align:left}
.concept .b{font-size:46px;font-weight:800;line-height:1.35}
.concept .b .em{color:#10B981}
</style>
</head>
<body>
<div class="slide">
  <div class="kick">连带的坑：过早扩张</div>
  <div class="title">AI 对你的前提<br><span class="hl">完全中立</span></div>
  <div class="lead">哪怕前提<span class="em">根本是错的</span>，它照样满怀热情</div>
  <div class="flow">
    <span class="step">生成</span><span class="arrow">→</span>
    <span class="step">测试</span><span class="arrow">→</span>
    <span class="step">调试</span><span class="arrow">→</span>
    <span class="step">重构</span>
  </div>
  <div class="concept"><div class="b">判断力，从头到尾<span class="em">都在你这边</span></div></div>
</div>
</body>
</html>
