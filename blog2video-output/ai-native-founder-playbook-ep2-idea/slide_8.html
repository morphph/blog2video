<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0D0D1A;font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;color:#FFFFFF;overflow:hidden}
.slide{width:100%;height:100%;padding:200px 72px 420px 72px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.kick{font-size:30px;font-weight:700;letter-spacing:.08em;color:#8B5CF6;margin-bottom:22px}
.title{font-size:66px;font-weight:800;line-height:1.25}
.title .hl{color:#EF4444}
.cards{display:flex;flex-direction:column;gap:24px;width:100%;margin-top:58px}
.card{background:#1A1A2E;border:1px solid rgba(139,92,246,0.22);border-radius:14px;padding:34px 32px;text-align:left}
.card.c1{border-left:6px solid #F59E0B}
.card.c2{border-left:6px solid #8B5CF6}
.card .l{font-size:28px;font-weight:700;letter-spacing:.05em;margin-bottom:14px}
.card.c1 .l{color:#F59E0B}
.card.c2 .l{color:#8B5CF6}
.card .b{font-size:42px;font-weight:700;line-height:1.38}
.card .b .em{color:#F59E0B}
.card.c2 .b .em{color:#8B5CF6}
</style>
</head>
<body>
<div class="slide">
  <div class="kick">真正要命的方向，恰恰相反</div>
  <div class="title">危险的不是 AI 出错，<br>是它<span class="hl">太听话了</span></div>
  <div class="cards">
    <div class="card c1">
      <div class="l">创业者的职业病</div>
      <div class="b">确认偏误：天生<span class="em">对自己的点子有感情</span></div>
    </div>
    <div class="card c2">
      <div class="l">第一次</div>
      <div class="b">这个老毛病，配上了一个<span class="em">研究引擎</span></div>
    </div>
  </div>
</div>
</body>
</html>
