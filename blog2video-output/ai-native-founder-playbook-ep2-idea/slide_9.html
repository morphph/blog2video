<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0D0D1A;font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;color:#FFFFFF;overflow:hidden}
.slide{width:100%;height:100%;padding:200px 72px 420px 72px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.kick{font-size:30px;font-weight:700;letter-spacing:.08em;color:#8B5CF6;margin-bottom:24px}
.title{font-size:60px;font-weight:800;line-height:1.25}
.title .hl{color:#EF4444}
.rows{display:flex;flex-direction:column;gap:18px;width:100%;margin-top:50px}
.row{display:flex;align-items:center;gap:18px;background:#1A1A2E;border:1px solid rgba(139,92,246,0.22);border-radius:12px;padding:28px 30px;text-align:left}
.row .ask{flex:1;font-size:34px;font-weight:700;color:#B0B0CC}
.row .arrow{color:#6B7280;font-size:32px;font-weight:800}
.row .get{flex:1;font-size:34px;font-weight:800;color:#F59E0B}
.concept{width:100%;margin-top:44px;background:#1A1A2E;border:1px solid rgba(239,68,68,0.35);border-left:6px solid #EF4444;border-radius:14px;padding:32px 32px;text-align:left}
.concept .b{font-size:44px;font-weight:800;line-height:1.35}
.concept .b .em{color:#EF4444}
.punch{margin-top:30px;font-size:40px;font-weight:800;line-height:1.4}
.punch .em{color:#EF4444}
</style>
</head>
<body>
<div class="slide">
  <div class="kick">问题出在哪？AI 跟着你的指令走</div>
  <div class="title">错误来自<span class="hl">服从性</span>，<br>不是出错率</div>
  <div class="rows">
    <div class="row"><span class="ask">让它验证想法</span><span class="arrow">→</span><span class="get">给你支持的证据</span></div>
    <div class="row"><span class="ask">让它算市场</span><span class="arrow">→</span><span class="get">给你好看的 TAM</span></div>
  </div>
  <div class="punch">越用<span class="em">越自信</span>，越自信<span class="em">越危险</span></div>
</div>
</body>
</html>
