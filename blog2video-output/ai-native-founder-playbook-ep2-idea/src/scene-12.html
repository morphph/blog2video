<style>

/* —— scene-12 特有 —— */

<body>

  /*@@MOTION@@*/
  </script>
  <script>
  (function(){
    var R="[data-composition-id='s12'] ";
    var tl=gsap.timeline({paused:true});
    tl.from(R+'.grid',{opacity:0,duration:.5,ease:'power1.out'},.02);
    tl.from(R+'.topbar',{y:-16,opacity:0,duration:.3,ease:'power2.out'},.2);
    D2.enter(tl, R+'.k-top', .4, {y:-12, ease:'power2.out'});
    D2.enter(tl, R+'.h1', .9, {y:20, d:.42, ease:'expo.out'});

    D2.enter(tl, R+'.hook', 8.9, {y:16, d:.36, ease:'power4.out'});
    D2.subs(tl, [['#sub-1',0.003],['#sub-2',2.3],['#sub-3',8.931]].map(function(s){return [R+s[0],s[1]];}));
    D2.breath(tl, R+'.content', 11.5, 'out');
    window.__timelines = window.__timelines || {};
    window.__timelines['s12'] = tl;
  })();
