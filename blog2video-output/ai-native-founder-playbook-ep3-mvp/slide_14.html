<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0D0D1A;font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;color:#FFFFFF;overflow:hidden}
.slide{width:100%;height:100%;padding:200px 72px 420px 72px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.kick{font-size:30px;font-weight:700;letter-spacing:.08em;color:#8B5CF6;margin-bottom:24px}
.title{font-size:62px;font-weight:800;line-height:1.24}
.title .hl{color:#EF4444}
.concept{width:100%;margin-top:48px;background:#1A1A2E;border:1px solid rgba(139,92,246,0.3);border-left:6px solid #8B5CF6;border-radius:14px;padding:34px 32px;text-align:left}
.concept .l{font-size:28px;font-weight:700;letter-spacing:.05em;color:#8B5CF6;margin-bottom:14px}
.concept .b{font-size:42px;font-weight:700;line-height:1.4}
.concept .b .em{color:#8B5CF6;font-weight:800}
.tag{margin-top:40px;display:inline-flex;align-items:center;gap:14px;font-size:36px;font-weight:800;color:#10B981;border:1px solid rgba(16,185,129,0.45);border-radius:999px;padding:16px 36px}
</style>
</head>
<body>
<div class="slide">
  <div class="kick">护栏装好了，怎么判断真的拿到 PMF？</div>
  <div class="title">没有任何<span class="hl">单一数据点</span>，<br>能确认 PMF</div>
  <div class="concept">
    <div class="l">它是这样一个东西</div>
    <div class="b">要跨好几个迭代周期、<span class="em">反复成立的模式</span></div>
  </div>
  <div class="tag">但有两个好用的试金石</div>
</div>
</body>
</html>
