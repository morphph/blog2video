<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0D0D1A;font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;color:#FFFFFF;overflow:hidden}
.slide{width:100%;height:100%;padding:200px 72px 420px 72px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.kick{font-size:30px;font-weight:700;letter-spacing:.08em;color:#8B5CF6;margin-bottom:30px}
.cards{display:flex;flex-direction:column;gap:24px;width:100%}
.box{background:#1A1A2E;border-radius:14px;padding:32px 32px;text-align:left}
.box .n{font-size:26px;font-weight:800;letter-spacing:.05em;margin-bottom:14px}
.box .name{font-size:42px;font-weight:800;line-height:1.2}
.box .en{font-size:26px;font-weight:700;color:#6B7280;margin-top:6px}
.box.ellis{border:1px solid rgba(16,185,129,0.4);border-left:6px solid #10B981}
.box.ellis .n{color:#10B981}
.box.ellis .q{font-size:32px;font-weight:700;color:#B0B0CC;margin-top:18px;line-height:1.4}
.box.ellis .res{display:flex;align-items:center;gap:22px;margin-top:18px}
.box.ellis .big{font-size:96px;font-weight:800;color:#10B981;line-height:0.9;letter-spacing:-.02em}
.box.ellis .big .gt{font-size:56px}
.box.ellis .rt{font-size:32px;font-weight:700;line-height:1.35}
.box.ellis .rt .em{color:#10B981;font-weight:800}
.box.effort{border:1px solid rgba(139,92,246,0.4);border-left:6px solid #8B5CF6}
.box.effort .n{color:#8B5CF6}
.box.effort .flip{display:flex;flex-direction:column;gap:14px;margin-top:18px}
.box.effort .line{font-size:34px;font-weight:700;line-height:1.3}
.box.effort .line .stage{display:inline-block;font-size:26px;font-weight:800;width:140px}
.box.effort .pre .stage{color:#6B7280}
.box.effort .pre{color:#9CA3AF}
.box.effort .post .stage{color:#10B981}
.box.effort .post .em{color:#10B981;font-weight:800}
</style>
</head>
<body>
<div class="slide">
  <div class="kick">两个 PMF 试金石</div>
  <div class="cards">
    <div class="box ellis">
      <div class="n">试金石 ①</div>
      <div class="name">Sean Ellis 测试</div>
      <div class="q">问活跃用户：「如果再也不能用，你会是什么感觉？」</div>
      <div class="res">
        <div class="big"><span class="gt">&gt;</span>40%</div>
        <div class="rt">回答<span class="em">「会非常失望」</span><br>= 有意义的 PMF 信号</div>
      </div>
    </div>
    <div class="box effort">
      <div class="n">试金石 ②</div>
      <div class="name">effort test <span class="en">努力测试</span></div>
      <div class="flip">
        <div class="line pre"><span class="stage">PMF 前</span>你推着用户走（英雄式干预）</div>
        <div class="line post"><span class="stage">PMF 后</span><span class="em">用户拉着产品走</span></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
