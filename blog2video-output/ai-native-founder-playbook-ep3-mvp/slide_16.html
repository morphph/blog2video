<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0D0D1A;font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;color:#FFFFFF;overflow:hidden}
.slide{width:100%;height:100%;padding:200px 72px 420px 72px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.glow{position:absolute;top:420px;left:50%;transform:translateX(-50%);width:720px;height:720px;background:radial-gradient(circle,rgba(16,185,129,0.14) 0%,rgba(16,185,129,0) 70%);pointer-events:none}
.kick{position:relative;font-size:30px;font-weight:700;letter-spacing:.06em;color:#8B5CF6;margin-bottom:30px;line-height:1.4}
.head{position:relative;font-size:46px;font-weight:700;color:#B0B0CC;line-height:1.4}
.head .strike{color:#6B7280;text-decoration:line-through;text-decoration-color:rgba(107,114,128,0.6)}
.big{position:relative;font-size:72px;font-weight:800;line-height:1.25;margin-top:24px}
.big .good{color:#10B981}
.concept{position:relative;width:100%;margin-top:48px;background:#1A1A2E;border:1px solid rgba(16,185,129,0.35);border-left:6px solid #10B981;border-radius:14px;padding:34px 32px;text-align:left}
.concept .b{font-size:38px;font-weight:700;line-height:1.42}
.concept .b .em{color:#10B981;font-weight:800}
</style>
</head>
<body>
<div class="slide">
  <div class="glow"></div>
  <div class="kick">万一功课全做了，还摸不到 PMF？</div>
  <div class="head">结果没印证你的方向——<br>这不是<span class="strike">失败</span></div>
  <div class="big">是<span class="good">系统在正常工作</span></div>
  <div class="concept">
    <div class="b">MVP 被设计出来，恰恰是为了在你「过度投入到一个错误答案」之前，<span class="em">提前把信息暴露给你</span></div>
  </div>
</div>
</body>
</html>
