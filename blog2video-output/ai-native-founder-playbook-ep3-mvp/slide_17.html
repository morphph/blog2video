<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0D0D1A;font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;color:#FFFFFF;overflow:hidden}
.slide{width:100%;height:100%;padding:200px 72px 420px 72px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.glow{position:absolute;top:440px;left:50%;transform:translateX(-50%);width:700px;height:700px;background:radial-gradient(circle,rgba(16,185,129,0.14) 0%,rgba(16,185,129,0) 70%);pointer-events:none}
.kick{position:relative;font-size:32px;font-weight:700;letter-spacing:.04em;color:#6B7280;margin-bottom:24px}
.kick b{color:#B0B0CC}
.title{position:relative;font-size:72px;font-weight:800;line-height:1.25}
.title .strike{color:#6B7280;text-decoration:line-through;text-decoration-color:rgba(107,114,128,0.6)}
.big{position:relative;font-size:64px;font-weight:800;line-height:1.3;margin-top:18px}
.big .good{color:#10B981}
.footer{position:relative;width:100%;margin-top:50px;background:#1A1A2E;border:1px solid rgba(16,185,129,0.35);border-left:6px solid #10B981;border-radius:14px;padding:32px 32px;text-align:left}
.footer .b{font-size:38px;font-weight:700;line-height:1.4}
.footer .b .em{color:#10B981;font-weight:800}
</style>
</head>
<body>
<div class="slide">
  <div class="glow"></div>
  <div class="kick">pivot · <b>转向 / 推倒重来</b></div>
  <div class="title">pivot，不是<span class="strike">认输</span></div>
  <div class="big">是一次<span class="good">及时止损的胜利</span></div>
  <div class="footer">
    <div class="b">能在烧掉一切之前发现该换条路——这件事本身，就是这套打法<span class="em">在替你工作</span></div>
  </div>
</div>
</body>
</html>
