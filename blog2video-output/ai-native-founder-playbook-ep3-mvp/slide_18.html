<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0D0D1A;font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;color:#FFFFFF;overflow:hidden}
.slide{width:100%;height:100%;padding:200px 72px 420px 72px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.kick{font-size:30px;font-weight:700;letter-spacing:.1em;color:#8B5CF6;margin-bottom:22px}
.title{font-size:56px;font-weight:800;line-height:1.25}
.title .hl{color:#F59E0B}
.list{display:flex;flex-direction:column;gap:16px;width:100%;margin-top:42px}
.row{display:flex;align-items:center;gap:20px;background:#1A1A2E;border:1px solid rgba(139,92,246,0.22);border-left:4px solid #8B5CF6;border-radius:12px;padding:24px 30px;text-align:left}
.row .n{flex-shrink:0;font-size:32px;font-weight:800;color:#8B5CF6;width:40px}
.row .t{font-size:40px;font-weight:800;line-height:1.3}
.row .t .bad{color:#EF4444}
.row .t .neq{color:#6B7280;margin:0 8px}
.row .t .good{color:#10B981}
.evi{width:100%;margin-top:30px;font-size:34px;font-weight:700;color:#B0B0CC;line-height:1.4}
.evi .em{color:#10B981;font-weight:800}
.next{width:100%;margin-top:30px;background:#1A1A2E;border:1px solid rgba(16,185,129,0.35);border-left:6px solid #10B981;border-radius:14px;padding:28px 30px;text-align:left;display:flex;align-items:center;gap:20px}
.next .lab{flex-shrink:0;font-size:26px;font-weight:800;letter-spacing:.05em;color:#10B981;border:1px solid rgba(16,185,129,0.5);border-radius:999px;padding:10px 22px}
.next .t{font-size:34px;font-weight:800;line-height:1.3}
.next .t .em{color:#10B981}
</style>
</head>
<body>
<div class="slide">
  <div class="kick">收束成一句话</div>
  <div class="title">贯穿这一整集的，<br>是三个「<span class="hl">不等于</span>」</div>
  <div class="list">
    <div class="row"><span class="n">1</span><span class="t"><span class="bad">能跑</span><span class="neq">≠</span><span class="good">安全</span></span></div>
    <div class="row"><span class="n">2</span><span class="t"><span class="bad">火爆</span><span class="neq">≠</span><span class="good">PMF</span></span></div>
    <div class="row"><span class="n">3</span><span class="t"><span class="bad">做得出</span><span class="neq">≠</span><span class="good">该做</span></span></div>
  </div>
  <div class="evi">走到 MVP 尽头，手里攥的是一摞<span class="em">证据</span>：有人回来用 · 付钱 · 推荐</div>
  <div class="next">
    <span class="lab">下一集</span>
    <span class="t">发布阶段 <span class="em">Launch Stage</span>，把验证过的产品推向更大的世界</span>
  </div>
</div>
</body>
</html>
