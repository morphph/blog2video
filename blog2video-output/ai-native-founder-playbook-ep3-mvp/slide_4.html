<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0D0D1A;font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;color:#FFFFFF;overflow:hidden}
.slide{width:100%;height:100%;padding:200px 72px 420px 72px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.kick{font-size:30px;font-weight:700;letter-spacing:.08em;color:#8B5CF6;margin-bottom:22px}
.title{font-size:64px;font-weight:800;line-height:1.24}
.title .hl{color:#EF4444}
.concept{width:100%;margin-top:46px;background:#1A1A2E;border:1px solid rgba(245,158,11,0.35);border-left:6px solid #F59E0B;border-radius:14px;padding:32px 32px;text-align:left}
.concept .l{font-size:28px;font-weight:700;letter-spacing:.05em;color:#F59E0B;margin-bottom:14px}
.concept .b{font-size:42px;font-weight:800;line-height:1.36}
.concept .b .em{color:#F59E0B}
.flow{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:12px;width:100%;margin-top:36px}
.step{background:#1A1A2E;border:1px solid rgba(139,92,246,0.3);border-radius:10px;padding:18px 24px;font-size:30px;font-weight:700;color:#B0B0CC}
.arrow{color:#6B7280;font-size:28px;font-weight:800}
.punch{margin-top:40px;font-size:40px;font-weight:800;line-height:1.4}
.punch .em{color:#EF4444}
</style>
</head>
<body>
<div class="slide">
  <div class="kick">这一程最大的危险</div>
  <div class="title">速度是白送的，<br>但<span class="hl">护栏</span>也一起没了</div>
  <div class="concept">
    <div class="l">过去：做东西又贵又慢</div>
    <div class="b">那种逼你慢下来的笨重，<br>其实是<span class="em">免费的护栏</span></div>
  </div>
  <div class="flow">
    <span class="step">先想架构</span><span class="arrow">→</span>
    <span class="step">先定范围</span><span class="arrow">→</span>
    <span class="step">先量后发</span><span class="arrow">→</span>
    <span class="step">先审安全</span>
  </div>
  <div class="punch">瓶颈没了，白送的纪律<span class="em">也跟着没了</span></div>
</div>
</body>
</html>
