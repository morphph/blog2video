<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0D0D1A;font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;color:#FFFFFF;overflow:hidden}
.slide{width:100%;height:100%;padding:200px 72px 420px 72px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.glow{position:absolute;top:420px;left:50%;transform:translateX(-50%);width:720px;height:720px;background:radial-gradient(circle,rgba(245,158,11,0.14) 0%,rgba(245,158,11,0) 70%);pointer-events:none}
.mark{position:relative;font-size:240px;font-weight:800;line-height:0.7;color:rgba(245,158,11,0.35);height:160px}
.quote{position:relative;font-size:60px;font-weight:800;line-height:1.4;margin-top:20px}
.quote .em{color:#F59E0B}
.sub{position:relative;font-size:46px;font-weight:800;line-height:1.4;margin-top:40px;color:#B0B0CC}
.sub .em{color:#10B981}
</style>
</head>
<body>
<div class="slide">
  <div class="glow"></div>
  <div class="mark">“</div>
  <div class="quote">速度从此免费，<br>唯一还稀缺的是<span class="em">判断力</span></div>
  <div class="sub">护栏，得在动手之前，<br>一条一条<span class="em">亲手写回文档</span></div>
</div>
</body>
</html>
