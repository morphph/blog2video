<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0D0D1A;font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;color:#FFFFFF;overflow:hidden}
.slide{width:100%;height:100%;padding:200px 72px 420px 72px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.kick{font-size:30px;font-weight:700;letter-spacing:.08em;color:#8B5CF6;margin-bottom:20px}
.title{font-size:58px;font-weight:800;line-height:1.24}
.title .hl{color:#EF4444}
.flow{display:flex;flex-direction:column;gap:12px;width:100%;margin-top:38px}
.step{display:flex;align-items:center;gap:18px;background:#1A1A2E;border:1px solid rgba(239,68,68,0.28);border-radius:10px;padding:20px 26px;text-align:left}
.step .t{font-size:32px;font-weight:700;color:#B0B0CC;line-height:1.3}
.step .t .em{color:#EF4444;font-weight:800}
.dn{text-align:center;color:#6B7280;font-size:26px;font-weight:800;line-height:0.4}
.note{width:100%;margin-top:24px;font-size:30px;font-weight:700;color:#6B7280;line-height:1.4}
.note .em{color:#B0B0CC}
.guard{width:100%;margin-top:30px;background:#1A1A2E;border:1px solid rgba(16,185,129,0.4);border-left:6px solid #10B981;border-radius:14px;padding:30px 30px;text-align:left}
.guard .l{font-size:28px;font-weight:800;letter-spacing:.04em;color:#10B981;margin-bottom:14px}
.guard .b{font-size:36px;font-weight:700;line-height:1.4}
.guard .b .code{display:inline-block;font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:34px;font-weight:800;color:#10B981;background:rgba(16,185,129,0.12);border:1px solid rgba(16,185,129,0.4);border-radius:8px;padding:2px 14px}
.guard .s{font-size:28px;color:#B0B0CC;margin-top:12px;line-height:1.4}
</style>
</head>
<body>
<div class="slide">
  <div class="kick">为什么 AI 技术债会复利滚大</div>
  <div class="title">每开一个新 session，<br>都从零<span class="hl">重新推导</span></div>
  <div class="flow">
    <div class="step"><span class="t">规格 / 架构约束，没写在 AI <span class="em">读得到的地方</span></span></div>
    <div class="dn">↓</div>
    <div class="step"><span class="t">每次推导，都<span class="em">悄悄飘移</span>一点点</span></div>
    <div class="dn">↓</div>
    <div class="step"><span class="t">得到一个<span class="em">没有连贯心智模型</span>的代码库</span></div>
  </div>
  <div class="note">零件单独看都没问题——<span class="em">从没被设计成能拼到一起</span>。平时能跑，真实用户一上量就塌</div>
  <div class="guard">
    <div class="l">护栏 ①</div>
    <div class="b">写第一行生产代码前，先用 Claude 把架构定下来，存成 <span class="code">CLAUDE.md</span></div>
    <div class="s">项目级、持久的「记忆」，Agent SDK 在目录里跑时会自动读</div>
  </div>
</div>
</body>
</html>
