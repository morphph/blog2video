<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0D0D1A;font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;color:#FFFFFF;overflow:hidden}
.slide{width:100%;height:100%;padding:200px 72px 420px 72px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.kick{font-size:30px;font-weight:700;letter-spacing:.08em;color:#8B5CF6;margin-bottom:22px}
.title{font-size:66px;font-weight:800;line-height:1.22}
.title .hl{color:#EF4444}
.lead{font-size:32px;color:#B0B0CC;margin-top:22px;line-height:1.45}
.lead .em{color:#F59E0B;font-weight:700}
.list{display:flex;flex-direction:column;gap:16px;width:100%;margin-top:46px}
.row{display:flex;align-items:center;gap:20px;background:#1A1A2E;border:1px solid rgba(239,68,68,0.28);border-left:4px solid #EF4444;border-radius:12px;padding:24px 28px;text-align:left}
.row .t{font-size:34px;font-weight:700;line-height:1.35}
.punch{width:100%;margin-top:42px;background:#1A1A2E;border:1px solid rgba(245,158,11,0.4);border-left:6px solid #F59E0B;border-radius:14px;padding:30px 30px;text-align:left;font-size:42px;font-weight:800;line-height:1.35}
.punch .em{color:#F59E0B}
</style>
</head>
<body>
<div class="slide">
  <div class="kick">第二个坑，更诛心</div>
  <div class="title">早期的火爆，<br>不等于 <span class="hl">PMF</span></div>
  <div class="lead">刚上线那股劲，<span class="em">是临时的</span>。它来自——</div>
  <div class="list">
    <div class="row"><span class="t">创始人朋友的捧场</span></div>
    <div class="row"><span class="t">投资人 portfolio 里的几个潜在买家</span></div>
    <div class="row"><span class="t">Hacker News 头条带来的一波流量</span></div>
  </div>
  <div class="punch">没一个能预测<span class="em">第 6 周、第 12 周</span></div>
</div>
</body>
</html>
