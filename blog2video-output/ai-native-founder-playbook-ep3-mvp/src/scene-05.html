<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
/*@@BASE@@*/
/* —— scene-05 特有(quote 金句)—— */
[data-composition-id='s05'] .term-l2{font-size:62px}
[data-composition-id='s05'] .term-l3{margin-top:28px;font-weight:900;font-size:54px;line-height:1.32;color:#edebe6}
[data-composition-id='s05'] .q-em{position:relative;color:#ccff4d;font-weight:900;display:inline-block}
[data-composition-id='s05'] .q-em .ul{position:absolute;left:0;right:0;bottom:-9px;height:3px;background:#ccff4d;transform:scaleX(0);transform-origin:left center}
</style>
</head>
<body>
  <div id="root" class="stage" data-composition-id="s05" data-start="0" data-duration="14.867" data-width="1080" data-height="1920">
    <div class="grid"></div>
    <div class="topbar">
      <div class="brand">精读AI · AI 原生创业手册<span class="b-cur"></span></div>
      <div class="idx">[05/18]</div>
    </div>

    <div class="content">
      <div class="kicker">// 速度免费<span class="acc">之后</span></div>

      <div class="term" style="margin-top:30px">
        <div class="term-bar"><span class="d" style="background:#ff6b5e"></span><span class="d" style="background:#ffbd2e"></span><span class="d" style="background:#27c93f"></span><span class="t">mvp@founder: ~</span></div>
        <div class="term-body">
          <div class="term-l1"><span class="p">$</span>这一程的真相是</div>
          <div class="term-l2">速度免费，稀缺的是<span class="hl" id="hero"><span class="bar"></span><span class="tx">判断力</span></span></div>
          <div class="term-l3">护栏，得<span class="q-em">亲手写回文档<span class="ul"></span></span></div>
        </div>
      </div>
    </div>

    <div id="sub-1" class="clip sub" data-start="0.011" data-duration="6.56" data-track-index="5"><div class="sub-inner">所以这一程的真相是：速度从此免费，唯一还稀缺的，<span class="sub-k">是判断力</span>。</div></div>
    <div id="sub-2" class="clip sub" data-start="6.571" data-duration="8.143" data-track-index="5"><div class="sub-inner">那些过去免费得到的护栏，现在你得在动手之前，一条一条，<span class="sub-k">亲手写回到文档里</span>。</div></div>
  </div>

  <script>
  /*@@MOTION@@*/
  </script>
  <script>
  (function(){
    var R="[data-composition-id='s05'] ";
    var tl=gsap.timeline({paused:true});
    tl.from(R+'.grid',{opacity:0,duration:.5,ease:'power1.out'},.02);
    tl.from(R+'.topbar',{y:-16,opacity:0,duration:.3,ease:'power2.out'},.2);
    D2.enter(tl, R+'.kicker', .5, {y:-12, ease:'power2.out'});
    D2.enter(tl, R+'.term', 1.1, {y:26, d:.5, ease:'expo.out'});
    tl.from(R+'.term-bar',{opacity:0,duration:.3,ease:'power1.out'},1.3);
    D2.enter(tl, R+'.term-l1', 1.9, {y:12, d:.32, ease:'power2.out'});
    D2.enter(tl, R+'.term-l2', 2.6, {y:16, d:.4, ease:'power3.out'});
    // hero sweep on 判断力 (口播「是判断力」≈5s)
    D2.sweep(tl, R, '#hero', 5.0);
    // 第二拍:护栏要亲手写回文档 (sub-2 起 6.571)
    D2.enter(tl, R+'.term-l3', 6.8, {y:16, d:.4, ease:'expo.out'});
    // 长 hold 中途次级揭示:亮线 draw(口播「亲手写回到文档里」≈12s)
    D2.underline(tl, R+'.q-em .ul', 12.0);
    D2.subs(tl, [['#sub-1',0.011],['#sub-2',6.571]].map(function(s){return [R+s[0],s[1]];}));
    D2.breath(tl, R+'.content', 14.867, 'in');
    window.__timelines = window.__timelines || {};
    window.__timelines['s05'] = tl;
  })();
  </script>
</body>
</html>
