<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0D0D1A;font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;color:#FFFFFF;overflow:hidden}
.slide{width:100%;height:100%;padding:200px 72px 420px 72px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.glow{position:absolute;top:300px;left:50%;transform:translateX(-50%);width:780px;height:780px;background:radial-gradient(circle,rgba(239,68,68,0.16) 0%,rgba(239,68,68,0) 70%);pointer-events:none}
.eyebrow{position:relative;display:inline-flex;align-items:center;gap:14px;font-size:30px;font-weight:700;letter-spacing:.08em;color:#8B5CF6;border:1px solid rgba(139,92,246,0.4);border-radius:999px;padding:14px 30px;margin-bottom:48px}
.eyebrow .dot{width:14px;height:14px;border-radius:50%;background:#8B5CF6}
.title{position:relative;font-size:78px;font-weight:800;line-height:1.22;letter-spacing:-.01em}
.title .hl{color:#EF4444}
.sub{position:relative;font-size:34px;color:#B0B0CC;margin-top:28px;line-height:1.5}
.cards{position:relative;display:flex;flex-direction:column;gap:24px;width:100%;margin-top:60px}
.card{background:#1A1A2E;border:1px solid rgba(139,92,246,0.25);border-radius:12px;padding:30px 32px;text-align:left;font-size:38px;font-weight:700;line-height:1.35}
.card.c1{border-left:4px solid #10B981}
.card.c1 .em{color:#10B981}
.card.c2{border-left:4px solid #EF4444}
.card.c2 .em{color:#EF4444}
.ep{position:relative;margin-top:54px;font-size:30px;font-weight:700;letter-spacing:.06em;color:#6B7280}
.ep b{color:#10B981}
</style>
</head>
<body>
<div class="slide">
  <div class="glow"></div>
  <div class="eyebrow"><span class="dot"></span>Launch 阶段 · Launch Stage</div>
  <div class="title">AI 帮你找到 PMF，<br>守不住它的是<span class="hl">你自己</span>？</div>
  <div class="sub">Anthropic 官方手册 · 一个人也能创业</div>
  <div class="cards">
    <div class="card c1">手里攥着一摞证据：<span class="em">回来用 · 付钱 · 推荐</span></div>
    <div class="card c2">这一程真正的对手，不是市场，<br>是<span class="em">你自己</span></div>
  </div>
  <div class="ep">精读系列 · 第 <b>4</b> 集 / 共 <b>5</b> 集</div>
</div>
</body>
</html>
