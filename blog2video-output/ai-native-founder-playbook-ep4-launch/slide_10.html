<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0D0D1A;font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;color:#FFFFFF;overflow:hidden}
.slide{width:100%;height:100%;padding:200px 72px 420px 72px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.kick{font-size:30px;font-weight:700;letter-spacing:.08em;color:#EF4444;margin-bottom:22px}
.title{font-size:62px;font-weight:800;line-height:1.24}
.title .hl{color:#F59E0B}
.concept{width:100%;margin-top:42px;background:#1A1A2E;border:1px solid rgba(245,158,11,0.35);border-left:6px solid #F59E0B;border-radius:14px;padding:30px 32px;text-align:left}
.concept .b{font-size:36px;font-weight:700;line-height:1.42;color:#B0B0CC}
.concept .b .em{color:#F59E0B;font-weight:800}
.chain{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:12px;width:100%;margin-top:32px}
.step{background:#1A1A2E;border:1px solid rgba(239,68,68,0.35);border-radius:10px;padding:18px 24px;font-size:29px;font-weight:700;color:#B0B0CC}
.arrow{color:#6B7280;font-size:28px;font-weight:800}
.step.bad{color:#EF4444;font-weight:800;border-color:rgba(239,68,68,0.6)}
.punch{margin-top:38px;font-size:46px;font-weight:800;line-height:1.35}
.punch .strike{color:#6B7280;text-decoration:line-through;text-decoration-color:rgba(107,114,128,0.6)}
.punch .em{color:#EF4444}
.foot{width:100%;margin-top:32px;background:#1A1A2E;border:1px solid rgba(16,185,129,0.35);border-left:6px solid #10B981;border-radius:14px;padding:26px 30px;text-align:left;font-size:36px;font-weight:800;line-height:1.4}
.foot .em{color:#10B981}
</style>
</head>
<body>
<div class="slide">
  <div class="kick">账单 ④ · 最反直觉</div>
  <div class="title">长得像<span class="hl">机会</span>的账单：<br>过早扩张</div>
  <div class="concept">
    <div class="b">新市场、新融资，看起来全是增长——也可能是 <span class="em">PMF 的死地</span>。早期势头是真的，但它只属于<span class="em">最早那批用户</span></div>
  </div>
  <div class="chain">
    <span class="step">新行为 · 新合规 · 新支付</span><span class="arrow">→</span>
    <span class="step">变量一起涌入</span><span class="arrow">→</span>
    <span class="step bad">读不懂自己的数据</span>
  </div>
  <div class="punch">杀死你的不是<span class="strike">分心</span>，<br>是<span class="em">失明</span></div>
  <div class="foot">扩张无罪，是时机和准备的问题：<br><span class="em">先守住已经赢的，再去赢新的</span></div>
</div>
</body>
</html>
