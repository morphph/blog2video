<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0D0D1A;font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;color:#FFFFFF;overflow:hidden}
.slide{width:100%;height:100%;padding:200px 72px 420px 72px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.kick{font-size:30px;font-weight:700;letter-spacing:.08em;color:#8B5CF6;margin-bottom:22px}
.title{font-size:62px;font-weight:800;line-height:1.24}
.title .hl{color:#8B5CF6}
.src{margin-top:22px;font-size:31px;font-weight:700;color:#B0B0CC;line-height:1.45}
.src .em{color:#8B5CF6;font-weight:800}
.list{display:flex;flex-direction:column;gap:16px;width:100%;margin-top:38px}
.row{display:flex;align-items:center;gap:20px;background:#1A1A2E;border-radius:12px;padding:24px 28px;text-align:left}
.row .n{flex-shrink:0;font-size:30px;font-weight:800;width:44px}
.row .t{font-size:35px;font-weight:800;line-height:1.3}
.row.a{border:1px solid rgba(16,185,129,0.35);border-left:4px solid #10B981}
.row.a .n{color:#10B981}
.row.b{border:1px solid rgba(59,130,246,0.35);border-left:4px solid #3B82F6}
.row.b .n{color:#3B82F6}
.row.c{border:1px solid rgba(245,158,11,0.4);border-left:4px solid #F59E0B}
.row.c .n{color:#F59E0B}
.row.c .t .em{color:#F59E0B}
.foot{width:100%;margin-top:34px;background:#1A1A2E;border:1px solid rgba(16,185,129,0.35);border-left:6px solid #10B981;border-radius:14px;padding:28px 30px;text-align:left;font-size:35px;font-weight:800;line-height:1.4}
.foot .em{color:#10B981}
</style>
</head>
<body>
<div class="slide">
  <div class="kick">最重要的例子 · Claude Cowork</div>
  <div class="title"><span class="hl">注意力审计</span></div>
  <div class="src">盘一遍运营负载：重复任务 · 落到你桌上的决定 · <span class="em">只因你记得</span>才发生的流程</div>
  <div class="list">
    <div class="row a"><span class="n">①</span><span class="t">能完全自动化的</span></div>
    <div class="row b"><span class="n">②</span><span class="t">需要人，但不必是你的</span></div>
    <div class="row c"><span class="n">③</span><span class="t">真正需要<span class="em">创始人判断</span>的</span></div>
  </div>
  <div class="foot">前两类：让它设计好触发条件 + 决策规则，<span class="em">直接接管</span></div>
</div>
</body>
</html>
