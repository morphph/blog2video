<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0D0D1A;font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;color:#FFFFFF;overflow:hidden}
.slide{width:100%;height:100%;padding:200px 72px 420px 72px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.kick{font-size:30px;font-weight:700;letter-spacing:.08em;color:#8B5CF6;margin-bottom:22px}
.title{font-size:58px;font-weight:800;line-height:1.26}
.title .hl{color:#10B981}
.list{display:flex;flex-direction:column;gap:14px;width:100%;margin-top:40px}
.row{display:flex;align-items:center;gap:18px;background:#1A1A2E;border:1px solid rgba(16,185,129,0.3);border-left:4px solid #10B981;border-radius:12px;padding:22px 26px;text-align:left}
.row .from{flex-shrink:0;font-size:30px;font-weight:800;color:#FFFFFF;width:150px}
.row .arrow{color:#10B981;font-size:28px;font-weight:800}
.row .to{font-size:30px;font-weight:700;color:#B0B0CC;line-height:1.35}
.row .to .em{color:#10B981;font-weight:800}
.row .to .code{font-family:'SF Mono',ui-monospace,Menlo,monospace;font-weight:800;color:#10B981}
.sec{width:100%;margin-top:26px;background:#1A1A2E;border:1px solid rgba(59,130,246,0.35);border-left:4px solid #3B82F6;border-radius:12px;padding:24px 28px;text-align:left;font-size:30px;font-weight:700;color:#B0B0CC;line-height:1.42}
.sec .em{color:#3B82F6;font-weight:800}
.foot{width:100%;margin-top:32px;background:#1A1A2E;border:1px solid rgba(245,158,11,0.4);border-left:6px solid #F59E0B;border-radius:14px;padding:28px 30px;text-align:left;font-size:36px;font-weight:800;line-height:1.4}
.foot .em{color:#F59E0B}
</style>
</head>
<body>
<div class="slide">
  <div class="kick">技术债 + 安全 · 同一个打法</div>
  <div class="title">Code 审计，Claude 排期，<br>决策<span class="hl">落盘</span></div>
  <div class="list">
    <div class="row"><span class="from">审计</span><span class="arrow">→</span><span class="to">Claude Code <span class="em">全量架构审计</span></span></div>
    <div class="row"><span class="from">排期</span><span class="arrow">→</span><span class="to">必须修 · 可以等 · <span class="em">可接受的存量债</span></span></div>
    <div class="row"><span class="from">落盘</span><span class="arrow">→</span><span class="to">脑子里的架构决策，写进 <span class="code">CLAUDE.md</span></span></div>
  </div>
  <div class="sec">安全同理：面向 <span class="em">SOC 2 · GDPR</span> 的代码级扫描 → 排修复顺序 → 企业客户签单前必查的<span class="em">访问控制 + 审计日志</span></div>
  <div class="foot">第一集的 flag——精益的十人独角兽，<br>机制到这一集<span class="em">才真正兑现</span></div>
</div>
</body>
</html>
