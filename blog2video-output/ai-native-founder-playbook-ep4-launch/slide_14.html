<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0D0D1A;font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;color:#FFFFFF;overflow:hidden}
.slide{width:100%;height:100%;padding:200px 72px 420px 72px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.kick{font-size:30px;font-weight:700;letter-spacing:.08em;color:#F59E0B;margin-bottom:22px}
.title{font-size:64px;font-weight:800;line-height:1.24}
.title .hl{color:#F59E0B}
.cards{display:flex;flex-direction:column;gap:26px;width:100%;margin-top:48px}
.box{background:#1A1A2E;border-radius:14px;padding:32px 32px;text-align:left}
.box .h{font-size:40px;font-weight:800;line-height:1.3;margin-bottom:14px}
.box .h .neq{margin:0 10px}
.box .d{font-size:30px;font-weight:700;color:#B0B0CC;line-height:1.45}
.box.one{border:1px solid rgba(239,68,68,0.4);border-left:6px solid #EF4444}
.box.one .h .neq{color:#EF4444}
.box.one .d .em{color:#EF4444;font-weight:800}
.box.two{border:1px solid rgba(139,92,246,0.4);border-left:6px solid #8B5CF6}
.box.two .h .neq{color:#8B5CF6}
.box.two .d .em{color:#8B5CF6;font-weight:800}
</style>
</head>
<body>
<div class="slide">
  <div class="kick">说在前面</div>
  <div class="title">两句<span class="hl">丑话</span></div>
  <div class="cards">
    <div class="box one">
      <div class="h">AI 扫描<span class="neq">≠</span>合格的合规审查</div>
      <div class="d">能帮你把独立评估准备好，<span class="em">代替不了评估本身</span>；合规要建进开发周期，是一笔<span class="em">长期成本</span>，要认</div>
    </div>
    <div class="box two">
      <div class="h">搭系统<span class="neq">≠</span>退休</div>
      <div class="d">三分类里永远留着一桶「真正需要创始人判断」；工具接走执行，接不走那个最难的心理换挡——<span class="em">承认自己是瓶颈，主动放手</span></div>
    </div>
  </div>
</div>
</body>
</html>
