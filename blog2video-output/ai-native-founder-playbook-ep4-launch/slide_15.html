<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0D0D1A;font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;color:#FFFFFF;overflow:hidden}
.slide{width:100%;height:100%;padding:200px 72px 420px 72px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.glow{position:absolute;top:380px;left:50%;transform:translateX(-50%);width:720px;height:720px;background:radial-gradient(circle,rgba(16,185,129,0.12) 0%,rgba(16,185,129,0) 70%);pointer-events:none}
.kick{position:relative;font-size:30px;font-weight:700;letter-spacing:.08em;color:#8B5CF6;margin-bottom:26px}
.list{position:relative;display:flex;flex-direction:column;gap:18px;width:100%}
.row{display:flex;align-items:center;gap:20px;background:#1A1A2E;border-radius:12px;padding:26px 30px;text-align:left}
.row .t{font-size:42px;font-weight:800;line-height:1.3}
.row.find{border:1px solid rgba(139,92,246,0.35);border-left:4px solid #8B5CF6}
.row.find .t .em{color:#8B5CF6}
.row.keep{border:1px solid rgba(16,185,129,0.35);border-left:4px solid #10B981}
.row.keep .t .em{color:#10B981}
.shift{position:relative;width:100%;margin-top:30px;background:#1A1A2E;border:1px solid rgba(245,158,11,0.4);border-left:6px solid #F59E0B;border-radius:14px;padding:28px 30px;text-align:left;font-size:34px;font-weight:800;line-height:1.42}
.shift .em{color:#F59E0B}
.shift .bad{color:#EF4444}
.next{position:relative;width:100%;margin-top:30px;background:#1A1A2E;border:1px solid rgba(16,185,129,0.35);border-left:6px solid #10B981;border-radius:14px;padding:28px 30px;text-align:left;display:flex;align-items:center;gap:20px}
.next .lab{flex-shrink:0;font-size:26px;font-weight:800;letter-spacing:.05em;color:#10B981;border:1px solid rgba(16,185,129,0.5);border-radius:999px;padding:10px 22px}
.next .t{font-size:31px;font-weight:800;line-height:1.38}
.next .t .em{color:#10B981}
.brand{position:relative;margin-top:36px;font-size:32px;font-weight:800;color:#B0B0CC;letter-spacing:.02em}
.brand .em{color:#F59E0B}
</style>
</head>
<body>
<div class="slide">
  <div class="glow"></div>
  <div class="kick">整程收拢成一句话</div>
  <div class="list">
    <div class="row find"><span class="t">找到 PMF，是<span class="em">产品问题</span></span></div>
    <div class="row keep"><span class="t">守住 PMF，是<span class="em">组织问题</span></span></div>
  </div>
  <div class="shift">让你赢下前三关的本能，正是第四关的<span class="bad">头号失败模式</span>——换挡没有铃声：<span class="em">从做事的人，变成设计系统的人</span></div>
  <div class="next">
    <span class="lab">下一集 · 完结篇</span>
    <span class="t">规模化阶段 <span class="em">Scale Stage</span>：从几千到上百万用户，从一个赌注到一门真正的生意</span>
  </div>
  <div class="brand">AI 世界很吵，<span class="em">精读一篇</span>，胜过刷一百条</div>
</div>
</body>
</html>
