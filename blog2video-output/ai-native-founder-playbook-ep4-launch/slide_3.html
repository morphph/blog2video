<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0D0D1A;font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;color:#FFFFFF;overflow:hidden}
.slide{width:100%;height:100%;padding:200px 72px 420px 72px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.kick{font-size:30px;font-weight:700;letter-spacing:.1em;color:#8B5CF6;margin-bottom:22px}
.title{font-size:62px;font-weight:800;line-height:1.24}
.title .hl{color:#10B981}
.list{display:flex;flex-direction:column;gap:18px;width:100%;margin-top:44px}
.row{background:#1A1A2E;border:1px solid rgba(16,185,129,0.3);border-left:4px solid #10B981;border-radius:12px;padding:26px 30px;text-align:left}
.row .h{display:flex;align-items:center;gap:18px;margin-bottom:10px}
.row .n{flex-shrink:0;font-size:30px;font-weight:800;color:#10B981}
.row .t{font-size:38px;font-weight:800;line-height:1.3}
.row .d{font-size:29px;font-weight:700;color:#B0B0CC;line-height:1.4}
.row .d .code{color:#3B82F6;font-weight:800}
.foot{width:100%;margin-top:36px;background:#1A1A2E;border:1px solid rgba(245,158,11,0.4);border-left:6px solid #F59E0B;border-radius:14px;padding:28px 30px;text-align:left;font-size:38px;font-weight:800;line-height:1.38}
.foot .em{color:#F59E0B}
</style>
</head>
<body>
<div class="slide">
  <div class="kick">什么时候算过关？</div>
  <div class="title">Launch 阶段的<br><span class="hl">三条标准</span></div>
  <div class="list">
    <div class="row">
      <div class="h"><span class="n">01</span><span class="t">增长可复制</span></div>
      <div class="d"><span class="code">CAC · LTV · 回本周期</span>——说得出来，也守得住</div>
    </div>
    <div class="row">
      <div class="h"><span class="n">02</span><span class="t">产品扛得住生产负载</span></div>
      <div class="d">可靠性在真实生产条件下成立，不只在你测过的条件下</div>
    </div>
    <div class="row">
      <div class="h"><span class="n">03</span><span class="t">运营不再卡在你身上</span></div>
      <div class="d">支持 · 分诊 · 排期 · 报表，不再需要你亲手处理</div>
    </div>
  </div>
  <div class="foot">只有 <span class="em">1</span> 条关于产品，<br>另外 <span class="em">2</span> 条，考的都是公司</div>
</div>
</body>
</html>
