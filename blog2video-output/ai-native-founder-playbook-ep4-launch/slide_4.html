<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0D0D1A;font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;color:#FFFFFF;overflow:hidden}
.slide{width:100%;height:100%;padding:200px 72px 420px 72px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.kick{font-size:30px;font-weight:700;letter-spacing:.08em;color:#8B5CF6;margin-bottom:22px}
.title{font-size:64px;font-weight:800;line-height:1.24}
.title .hl{color:#10B981}
.concept{width:100%;margin-top:44px;background:#1A1A2E;border:1px solid rgba(239,68,68,0.35);border-left:6px solid #EF4444;border-radius:14px;padding:32px 32px;text-align:left}
.concept .b{font-size:40px;font-weight:700;line-height:1.4}
.concept .b .em{color:#EF4444;font-weight:800}
.punch{width:100%;margin-top:34px;background:#1A1A2E;border:1px solid rgba(245,158,11,0.4);border-left:6px solid #F59E0B;border-radius:14px;padding:30px 32px;text-align:left}
.punch .l{font-size:28px;font-weight:800;letter-spacing:.05em;color:#F59E0B;margin-bottom:14px}
.punch .b{font-size:40px;font-weight:800;line-height:1.4}
.punch .b .em{color:#F59E0B}
</style>
</head>
<body>
<div class="slide">
  <div class="kick">找到 PMF · 前半程最难的事</div>
  <div class="title">从这一刻起，<br>问题变成：<span class="hl">守住它</span></div>
  <div class="concept">
    <div class="b">有真实用户、真实势头的公司，<span class="em">照样会散架</span>——只要产品周围的组织，跟不上产品</div>
  </div>
  <div class="punch">
    <div class="l">四个失败模式 · 一个扎心的共同点</div>
    <div class="b">没有一个来自竞争对手——<br>每一个，都是上一阶段「正确决策」<span class="em">到期的账单</span></div>
  </div>
</div>
</body>
</html>
