<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0D0D1A;font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;color:#FFFFFF;overflow:hidden}
.slide{width:100%;height:100%;padding:200px 72px 420px 72px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.kick{font-size:30px;font-weight:700;letter-spacing:.08em;color:#EF4444;margin-bottom:22px}
.title{font-size:64px;font-weight:800;line-height:1.24}
.title .hl{color:#EF4444}
.cards{display:flex;gap:22px;width:100%;margin-top:44px}
.col{flex:1;background:#1A1A2E;border-radius:14px;padding:30px 26px;text-align:left}
.col .l{font-size:28px;font-weight:800;margin-bottom:14px}
.col .b{font-size:36px;font-weight:800;line-height:1.35}
.col.mvp{border:1px solid rgba(16,185,129,0.35);border-top:5px solid #10B981}
.col.mvp .l{color:#10B981}
.col.mvp .b .em{color:#10B981}
.col.now{border:1px solid rgba(239,68,68,0.4);border-top:5px solid #EF4444}
.col.now .l{color:#EF4444}
.col.now .b .em{color:#EF4444}
.shift{width:100%;margin-top:34px;background:#1A1A2E;border:1px solid rgba(245,158,11,0.4);border-left:6px solid #F59E0B;border-radius:14px;padding:26px 30px;text-align:left;font-size:36px;font-weight:800;line-height:1.4}
.shift .em{color:#F59E0B}
.sig{width:100%;margin-top:30px;text-align:left}
.sig .l{font-size:27px;font-weight:800;letter-spacing:.04em;color:#6B7280;margin-bottom:14px}
.sig .line{font-size:30px;font-weight:700;color:#B0B0CC;line-height:1.55}
.sig .line .em{color:#EF4444;font-weight:800}
</style>
</head>
<body>
<div class="slide">
  <div class="kick">账单 ② · 全片核心</div>
  <div class="title">这次到期的不是代码，<br>是<span class="hl">你</span></div>
  <div class="cards">
    <div class="col mvp">
      <div class="l">MVP 阶段</div>
      <div class="b">事事亲力亲为<br>= <span class="em">资产</span></div>
    </div>
    <div class="col now">
      <div class="l">Launch 阶段</div>
      <div class="b">同一个本能<br>= <span class="em">约束</span></div>
    </div>
  </div>
  <div class="shift">「做事的人」→「设计系统的人」<br>最难的换挡，<span class="em">没有铃声提醒你</span></div>
  <div class="sig">
    <div class="l">静默失败 · 信号全是「不发生的事」</div>
    <div class="line">一小时能拍板的决定，<span class="em">等你一周</span></div>
    <div class="line">支持越堆越多——答案<span class="em">只在你脑子里</span></div>
    <div class="line">有些运营任务，<span class="em">只在你想起的那天发生</span></div>
  </div>
</div>
</body>
</html>
