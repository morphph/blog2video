<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0D0D1A;font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;color:#FFFFFF;overflow:hidden}
.slide{width:100%;height:100%;padding:200px 72px 420px 72px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.glow{position:absolute;top:420px;left:50%;transform:translateX(-50%);width:720px;height:720px;background:radial-gradient(circle,rgba(239,68,68,0.14) 0%,rgba(239,68,68,0) 70%);pointer-events:none}
.mark{position:relative;font-size:240px;font-weight:800;line-height:0.7;color:rgba(239,68,68,0.35);height:160px}
.quote{position:relative;font-size:58px;font-weight:800;line-height:1.42;margin-top:20px}
.quote .ok{color:#10B981}
.sub{position:relative;font-size:52px;font-weight:800;line-height:1.42;margin-top:44px}
.sub .em{color:#EF4444}
</style>
</head>
<body>
<div class="slide">
  <div class="glow"></div>
  <div class="mark">“</div>
  <div class="quote">用户流失，<span class="ok">有报警</span><br>系统被攻破，<span class="ok">有报警</span></div>
  <div class="sub">可「决定没被做」，<br><span class="em">没有任何报警器</span></div>
</div>
</body>
</html>
