<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0D0D1A;font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;color:#FFFFFF;overflow:hidden}
.slide{width:100%;height:100%;padding:200px 72px 420px 72px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.kick{font-size:30px;font-weight:700;letter-spacing:.08em;color:#8B5CF6;margin-bottom:22px}
.title{font-size:62px;font-weight:800;line-height:1.24}
.title .hl{color:#10B981}
.src{margin-top:24px;font-size:32px;font-weight:700;color:#B0B0CC;line-height:1.4}
.list{display:flex;flex-direction:column;gap:16px;width:100%;margin-top:38px}
.row{display:flex;align-items:center;gap:20px;background:#1A1A2E;border-radius:12px;padding:26px 30px;text-align:left}
.row .tag{flex-shrink:0;font-size:28px;font-weight:800;border-radius:999px;padding:10px 24px}
.row .t{font-size:36px;font-weight:800;line-height:1.3}
.row.a{border:1px solid rgba(16,185,129,0.35);border-left:4px solid #10B981}
.row.a .tag{color:#10B981;border:1px solid rgba(16,185,129,0.5)}
.row.b{border:1px solid rgba(59,130,246,0.35);border-left:4px solid #3B82F6}
.row.b .tag{color:#3B82F6;border:1px solid rgba(59,130,246,0.5)}
.row.c{border:1px solid rgba(139,92,246,0.35);border-left:4px solid #8B5CF6}
.row.c .tag{color:#8B5CF6;border:1px solid rgba(139,92,246,0.5)}
.foot{width:100%;margin-top:36px;background:#1A1A2E;border:1px solid rgba(245,158,11,0.4);border-left:6px solid #F59E0B;border-radius:14px;padding:28px 30px;text-align:left;font-size:36px;font-weight:800;line-height:1.4}
.foot .strike{color:#6B7280;text-decoration:line-through;text-decoration-color:rgba(107,114,128,0.6)}
.foot .em{color:#F59E0B}
</style>
</head>
<body>
<div class="slide">
  <div class="kick">怎么办？</div>
  <div class="title">把亲手在管的每件事，<br>做一次<span class="hl">彻底盘点</span></div>
  <div class="src">从最小的杂务，到最重的决策</div>
  <div class="list">
    <div class="row a"><span class="tag">分类 1</span><span class="t">可以系统化的</span></div>
    <div class="row b"><span class="tag">分类 2</span><span class="t">可以交出去的</span></div>
    <div class="row c"><span class="tag">分类 3</span><span class="t">真正配得上创始人时间的</span></div>
  </div>
  <div class="foot">目标不是<span class="strike">把你从公司移走</span>，<br>是把注意力<span class="em">赎回来</span>，留给只有创始人能做的决定</div>
</div>
</body>
</html>
