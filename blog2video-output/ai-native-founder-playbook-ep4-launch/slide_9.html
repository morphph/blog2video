<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0D0D1A;font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;color:#FFFFFF;overflow:hidden}
.slide{width:100%;height:100%;padding:200px 72px 420px 72px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.kick{font-size:30px;font-weight:700;letter-spacing:.08em;color:#EF4444;margin-bottom:22px}
.title{font-size:60px;font-weight:800;line-height:1.26}
.title .hl{color:#EF4444}
.trig{width:100%;margin-top:44px;background:#1A1A2E;border:1px solid rgba(239,68,68,0.35);border-left:6px solid #EF4444;border-radius:14px;padding:30px 30px;text-align:left}
.trig .l{font-size:28px;font-weight:800;letter-spacing:.04em;color:#EF4444;margin-bottom:18px}
.trig .items{display:flex;flex-wrap:wrap;gap:14px}
.trig .chip{font-size:32px;font-weight:700;color:#FFFFFF;background:rgba(239,68,68,0.12);border:1px solid rgba(239,68,68,0.4);border-radius:999px;padding:12px 26px}
.trig .note{margin-top:18px;font-size:30px;font-weight:700;color:#B0B0CC;line-height:1.4}
.trig .note .em{color:#EF4444;font-weight:800}
.fix{width:100%;margin-top:28px;background:#1A1A2E;border:1px solid rgba(16,185,129,0.35);border-left:6px solid #10B981;border-radius:14px;padding:30px 30px;text-align:left}
.fix .l{font-size:28px;font-weight:800;letter-spacing:.04em;color:#10B981;margin-bottom:14px}
.fix .b{font-size:38px;font-weight:800;line-height:1.4}
.fix .b .em{color:#10B981}
.punch{margin-top:34px;font-size:36px;font-weight:800;line-height:1.4;color:#B0B0CC}
.punch .em{color:#F59E0B}
</style>
</head>
<body>
<div class="slide">
  <div class="kick">账单 ③ · 安全</div>
  <div class="title">一进生产，理论风险<br>变成<span class="hl">实打实的暴露</span></div>
  <div class="trig">
    <div class="l">合规的触发条件 · 一碰即适用</div>
    <div class="items">
      <span class="chip">处理客户数据</span>
      <span class="chip">处理支付</span>
      <span class="chip">卖进受监管行业</span>
    </div>
    <div class="note">对原型不适用的要求，<span class="em">全部立刻适用</span></div>
  </div>
  <div class="fix">
    <div class="l">解法</div>
    <div class="b">在规模到来之前，<span class="em">主动做</span>系统性的安全与合规审查</div>
  </div>
  <div class="punch">审出的每一项，都是<span class="em">必须修复</span>，不是参考建议</div>
</div>
</body>
</html>
