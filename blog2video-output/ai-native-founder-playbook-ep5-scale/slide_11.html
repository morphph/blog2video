<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0D0D1A;font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;color:#FFFFFF;overflow:hidden}
.slide{width:100%;height:100%;padding:200px 72px 420px 72px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.kick{font-size:30px;font-weight:700;letter-spacing:.08em;color:#EF4444;margin-bottom:20px}
.title{font-size:58px;font-weight:800;line-height:1.26}
.title .hl{color:#EF4444}
.list{display:flex;flex-direction:column;gap:14px;width:100%;margin-top:36px}
.row{display:flex;align-items:center;gap:18px;background:#1A1A2E;border:1px solid rgba(239,68,68,0.3);border-left:4px solid #EF4444;border-radius:12px;padding:22px 28px;text-align:left}
.row .n{flex-shrink:0;font-size:27px;font-weight:800;color:#EF4444}
.row .t{font-size:32px;font-weight:800;line-height:1.32}
.row .t .em{color:#EF4444}
.fix{width:100%;margin-top:28px;background:#1A1A2E;border:1px solid rgba(16,185,129,0.4);border-left:6px solid #10B981;border-radius:14px;padding:26px 30px;text-align:left}
.fix .l{font-size:27px;font-weight:800;letter-spacing:.04em;color:#10B981;margin-bottom:12px}
.fix .b{font-size:33px;font-weight:800;line-height:1.38}
.fix .b .en{color:#10B981}
.fix .d{margin-top:10px;font-size:28px;font-weight:700;color:#B0B0CC;line-height:1.42}
.demo{width:100%;margin-top:26px;background:#1A1A2E;border:1px solid rgba(245,158,11,0.4);border-left:6px solid #F59E0B;border-radius:14px;padding:26px 30px;text-align:left;font-size:32px;font-weight:800;line-height:1.42}
.demo .em{color:#F59E0B}
</style>
</head>
<body>
<div class="slide">
  <div class="kick">增长这边，也有一堵墙</div>
  <div class="title">有机增长的<span class="hl">天花板</span><br>三个撞墙信号</div>
  <div class="list">
    <div class="row"><span class="n">01</span><span class="t">用户曲线<span class="em">变平</span></span></div>
    <div class="row"><span class="n">02</span><span class="t">获客成本<span class="em">上升</span></span></div>
    <div class="row"><span class="n">03</span><span class="t">销售管道，只在<span class="em">你亲自介入</span>时才动</span></div>
  </div>
  <div class="fix">
    <div class="l">这时候，你需要</div>
    <div class="b">一个真正的 <span class="en">GTM 引擎</span>（go-to-market）</div>
    <div class="d">市场分层 · 故事怎么讲 · 卖给谁 · 怎么卖——建产品的那套 AI 基础设施，直接把它启动</div>
  </div>
  <div class="demo">再建一个真正能跑的 demo 环境——<br>你在开董事会，它在<span class="em">替你签单</span></div>
</div>
</body>
</html>
