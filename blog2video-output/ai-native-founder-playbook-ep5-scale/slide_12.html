<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0D0D1A;font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;color:#FFFFFF;overflow:hidden}
.slide{width:100%;height:100%;padding:200px 72px 420px 72px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.kick{font-size:30px;font-weight:700;letter-spacing:.08em;color:#F59E0B;margin-bottom:22px}
.title{font-size:62px;font-weight:800;line-height:1.24}
.title .hl{color:#F59E0B}
.cards{display:flex;flex-direction:column;gap:26px;width:100%;margin-top:52px}
.box{background:#1A1A2E;border-radius:14px;padding:34px 32px;text-align:left}
.box .l{font-size:28px;font-weight:800;letter-spacing:.05em;margin-bottom:14px}
.box .b{font-size:46px;font-weight:800;line-height:1.34}
.box.one{border:1px solid rgba(139,92,246,0.4);border-left:6px solid #8B5CF6}
.box.one .l{color:#8B5CF6}
.box.one .b .em{color:#8B5CF6}
.box.two{border:1px solid rgba(59,130,246,0.4);border-left:6px solid #3B82F6}
.box.two .l{color:#3B82F6}
.box.two .b .em{color:#3B82F6}
.punch{margin-top:40px;font-size:34px;font-weight:800;line-height:1.4;color:#B0B0CC}
.punch .em{color:#EF4444}
</style>
</head>
<body>
<div class="slide">
  <div class="kick">回到护城河本身</div>
  <div class="title">一个词，其实是<br><span class="hl">两种方向相反的力</span></div>
  <div class="cards">
    <div class="box one">
      <div class="l">第一种力</div>
      <div class="b">让你<span class="em">难被复制</span></div>
    </div>
    <div class="box two">
      <div class="l">第二种力</div>
      <div class="b">让你<span class="em">难被离开</span></div>
    </div>
  </div>
  <div class="punch">混为一谈，就会<span class="em">漏掉一半</span></div>
</div>
</body>
</html>
