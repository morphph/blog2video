<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0D0D1A;font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;color:#FFFFFF;overflow:hidden}
.slide{width:100%;height:100%;padding:200px 72px 420px 72px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.kick{font-size:30px;font-weight:700;letter-spacing:.08em;color:#8B5CF6;margin-bottom:20px}
.title{font-size:58px;font-weight:800;line-height:1.26}
.title .hl{color:#8B5CF6}
.list{display:flex;flex-direction:column;gap:14px;width:100%;margin-top:38px}
.row{display:flex;align-items:center;gap:18px;background:#1A1A2E;border:1px solid rgba(139,92,246,0.3);border-left:4px solid #8B5CF6;border-radius:12px;padding:22px 26px;text-align:left}
.row .from{flex-shrink:0;font-size:29px;font-weight:800;color:#FFFFFF;width:170px}
.row .arrow{color:#8B5CF6;font-size:28px;font-weight:800}
.row .to{font-size:29px;font-weight:700;color:#B0B0CC;line-height:1.38}
.row .to .em{color:#8B5CF6;font-weight:800}
.case{width:100%;margin-top:26px;background:#1A1A2E;border:1px solid rgba(59,130,246,0.35);border-left:4px solid #3B82F6;border-radius:12px;padding:24px 28px;text-align:left;font-size:29px;font-weight:700;color:#B0B0CC;line-height:1.45}
.case .em{color:#3B82F6;font-weight:800}
.foot{width:100%;margin-top:30px;background:#1A1A2E;border:1px solid rgba(245,158,11,0.4);border-left:6px solid #F59E0B;border-radius:14px;padding:28px 30px;text-align:left;font-size:36px;font-weight:800;line-height:1.4}
.foot .em{color:#F59E0B}
</style>
</head>
<body>
<div class="slide">
  <div class="kick">力① 难被复制 · 原料一</div>
  <div class="title">把<span class="hl">领域知识</span><br>灌进产品够得着的地方</div>
  <div class="list">
    <div class="row"><span class="from">持续灌入</span><span class="arrow">→</span><span class="to">行业黑话 · 监管的坑 · <span class="em">边缘情况</span></span></div>
    <div class="row"><span class="from">Skills 固化</span><span class="arrow">→</span><span class="to">重复流程变成<span class="em">每次同样执行</span>的例程</span></div>
    <div class="row"><span class="from">变成逻辑</span><span class="arrow">→</span><span class="to">通用 AI 工具必错处，<span class="em">你有专门逻辑</span></span></div>
  </div>
  <div class="case">例：340B 特殊药品折扣理赔——通用 AI 计费工具直接出错，<span class="em">你的产品为它写了专门逻辑</span></div>
  <div class="foot">每个竞品必错的边缘情况，加一条真实测试——<br>你的测试套件，就是<span class="em">一张护城河地图</span></div>
</div>
</body>
</html>
