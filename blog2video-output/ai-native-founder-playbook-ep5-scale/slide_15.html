<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0D0D1A;font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;color:#FFFFFF;overflow:hidden}
.slide{width:100%;height:100%;padding:200px 72px 420px 72px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.kick{font-size:30px;font-weight:700;letter-spacing:.08em;color:#3B82F6;margin-bottom:20px}
.title{font-size:58px;font-weight:800;line-height:1.26}
.title .hl{color:#3B82F6}
.deep{width:100%;margin-top:38px;background:#1A1A2E;border:1px solid rgba(59,130,246,0.35);border-left:6px solid #3B82F6;border-radius:14px;padding:28px 30px;text-align:left}
.deep .l{font-size:27px;font-weight:800;letter-spacing:.04em;color:#3B82F6;margin-bottom:16px}
.deep .items{display:flex;flex-wrap:wrap;gap:12px}
.deep .chip{font-size:29px;font-weight:700;color:#FFFFFF;background:rgba(59,130,246,0.12);border:1px solid rgba(59,130,246,0.4);border-radius:999px;padding:12px 24px}
.deep .note{margin-top:18px;font-size:31px;font-weight:800;line-height:1.42}
.deep .note .em{color:#3B82F6}
.build{width:100%;margin-top:26px;background:#1A1A2E;border:1px solid rgba(16,185,129,0.35);border-left:6px solid #10B981;border-radius:14px;padding:26px 30px;text-align:left}
.build .l{font-size:27px;font-weight:800;letter-spacing:.04em;color:#10B981;margin-bottom:14px}
.build .f{display:flex;flex-wrap:wrap;align-items:center;gap:12px;font-size:30px;font-weight:800;line-height:1.4}
.build .f .arr{color:#10B981}
.build .f .en{color:#10B981}
.foot{width:100%;margin-top:30px;background:#1A1A2E;border:1px solid rgba(245,158,11,0.4);border-left:6px solid #F59E0B;border-radius:14px;padding:26px 30px;text-align:left;font-size:34px;font-weight:800;line-height:1.42}
.foot .em{color:#F59E0B}
</style>
</head>
<body>
<div class="slide">
  <div class="kick">力② 方向完全相反</div>
  <div class="title">不是挡对手进来，<br>是抬高<span class="hl">离开的成本</span></div>
  <div class="deep">
    <div class="l">用户跑得越久，嵌得越深</div>
    <div class="items">
      <span class="chip">搭了自动化</span>
      <span class="chip">训练了团队</span>
      <span class="chip">接上了数据源</span>
      <span class="chip">打磨了提示词</span>
    </div>
    <div class="note">换掉你 ≠ 产品决策，<br>而是<span class="em">一场全公司的运营工程</span></div>
  </div>
  <div class="build">
    <div class="l">建设动作 · 铺集成的表面积</div>
    <div class="f"><span>Claude Code 接管道</span><span class="arr">→</span><span class="en">API · webhook · SDK</span></div>
  </div>
  <div class="foot">让客户在你的产品之上，<span class="em">构建他们自己的东西</span><br>——最深的一种绑定</div>
</div>
</body>
</html>
