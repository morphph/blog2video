<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0D0D1A;font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;color:#FFFFFF;overflow:hidden}
.slide{width:100%;height:100%;padding:200px 72px 420px 72px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.kick{font-size:30px;font-weight:700;letter-spacing:.08em;color:#F59E0B;margin-bottom:22px}
.title{font-size:64px;font-weight:800;line-height:1.24}
.title .hl{color:#F59E0B}
.cards{display:flex;flex-direction:column;gap:26px;width:100%;margin-top:48px}
.box{background:#1A1A2E;border-radius:14px;padding:32px 32px;text-align:left}
.box .h{font-size:38px;font-weight:800;line-height:1.3;margin-bottom:14px}
.box .d{font-size:30px;font-weight:700;color:#B0B0CC;line-height:1.45}
.box.one{border:1px solid rgba(239,68,68,0.4);border-left:6px solid #EF4444}
.box.one .h .em{color:#EF4444}
.box.one .d .em{color:#EF4444;font-weight:800}
.box.two{border:1px solid rgba(139,92,246,0.4);border-left:6px solid #8B5CF6}
.box.two .h .em{color:#8B5CF6}
.box.two .d .em{color:#8B5CF6;font-weight:800}
.punch{margin-top:36px;font-size:34px;font-weight:800;line-height:1.4;color:#B0B0CC}
.punch .em{color:#F59E0B}
</style>
</head>
<body>
<div class="slide">
  <div class="kick">照例，代价说清楚</div>
  <div class="title">两笔<span class="hl">省不掉的税</span></div>
  <div class="cards">
    <div class="box one">
      <div class="h">交接的窄门，<span class="em">是真实的</span></div>
      <div class="d">机构知识的编码是<span class="em">持续的苦工</span>，不是一次性动作；什么该交、什么该留，从来不是显而易见的</div>
    </div>
    <div class="box two">
      <div class="h">外部审视，<span class="em">躲不掉</span></div>
      <div class="d">从造东西的人，变成<span class="em">面向公众的高管</span>：给分析师做简报，跑上市路演——几乎没一样是建造者天生喜欢的</div>
    </div>
  </div>
  <div class="punch">精益的结构可以保住，<br>但三种通关形态，<span class="em">全都要求这些过关</span></div>
</div>
</body>
</html>
