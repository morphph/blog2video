<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0D0D1A;font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;color:#FFFFFF;overflow:hidden}
.slide{width:100%;height:100%;padding:200px 72px 420px 72px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.kick{font-size:30px;font-weight:700;letter-spacing:.08em;color:#8B5CF6;margin-bottom:24px}
.title{font-size:64px;font-weight:800;line-height:1.24}
.title .hl{color:#F59E0B}
.cards{display:flex;flex-direction:column;gap:28px;width:100%;margin-top:54px}
.box{background:#1A1A2E;border-radius:14px;padding:34px 32px;text-align:left}
.box .l{font-size:28px;font-weight:800;letter-spacing:.05em;margin-bottom:16px}
.box .b{font-size:46px;font-weight:800;line-height:1.36}
.box .d{margin-top:14px;font-size:30px;font-weight:700;color:#B0B0CC;line-height:1.45}
.box.prev{border:1px solid rgba(139,92,246,0.3);border-left:6px solid #8B5CF6}
.box.prev .l{color:#8B5CF6}
.box.prev .b .em{color:#8B5CF6}
.box.now{border:1px solid rgba(16,185,129,0.35);border-left:6px solid #10B981}
.box.now .l{color:#10B981}
.box.now .b .em{color:#10B981}
</style>
</head>
<body>
<div class="slide">
  <div class="kick">先看清这一关的题目</div>
  <div class="title">问题，<span class="hl">第一次换了</span></div>
  <div class="cards">
    <div class="box prev">
      <div class="l">前四关 · 同一件事</div>
      <div class="b">怎么<span class="em">活下来</span></div>
      <div class="d">想法是真的吗 · 产品配存在吗 · 生意配长大吗</div>
    </div>
    <div class="box now">
      <div class="l">Scale 这一关</div>
      <div class="b">怎么变得<span class="em">难以替代</span></div>
    </div>
  </div>
</div>
</body>
</html>
