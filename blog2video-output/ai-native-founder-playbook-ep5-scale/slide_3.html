<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0D0D1A;font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;color:#FFFFFF;overflow:hidden}
.slide{width:100%;height:100%;padding:200px 72px 420px 72px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.glow{position:absolute;top:420px;left:50%;transform:translateX(-50%);width:720px;height:720px;background:radial-gradient(circle,rgba(239,68,68,0.14) 0%,rgba(239,68,68,0) 70%);pointer-events:none}
.kick{position:relative;font-size:30px;font-weight:700;letter-spacing:.08em;color:#EF4444;margin-bottom:10px}
.mark{position:relative;font-size:240px;font-weight:800;line-height:0.7;color:rgba(239,68,68,0.35);height:150px}
.quote{position:relative;font-size:56px;font-weight:800;line-height:1.44;margin-top:20px}
.quote .em{color:#EF4444}
.sub{position:relative;font-size:56px;font-weight:800;line-height:1.42;margin-top:48px}
.sub .em{color:#F59E0B}
</style>
</head>
<body>
<div class="slide">
  <div class="glow"></div>
  <div class="kick">全片最硬的一个拷问</div>
  <div class="mark">“</div>
  <div class="quote">资金雄厚的巨头，<br>今天<span class="em">原封不动</span><br>抄走你的产品</div>
  <div class="sub">你的用户，<span class="em">会留下吗？</span></div>
</div>
</body>
</html>
