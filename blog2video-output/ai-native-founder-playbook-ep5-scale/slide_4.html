<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0D0D1A;font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;color:#FFFFFF;overflow:hidden}
.slide{width:100%;height:100%;padding:200px 72px 420px 72px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.kick{font-size:30px;font-weight:700;letter-spacing:.08em;color:#8B5CF6;margin-bottom:22px}
.title{font-size:62px;font-weight:800;line-height:1.24}
.title .hl{color:#10B981}
.scale{display:flex;flex-direction:column;gap:16px;width:100%;margin-top:44px}
.row{display:flex;align-items:center;gap:20px;background:#1A1A2E;border:1px solid rgba(59,130,246,0.35);border-left:4px solid #3B82F6;border-radius:12px;padding:24px 30px;text-align:left}
.row .from{flex-shrink:0;font-size:34px;font-weight:800;color:#B0B0CC}
.row .arrow{color:#3B82F6;font-size:32px;font-weight:800}
.row .to{font-size:34px;font-weight:800;color:#3B82F6}
.cards{display:flex;flex-direction:column;gap:24px;width:100%;margin-top:36px}
.box{background:#1A1A2E;border-radius:14px;padding:30px 32px;text-align:left}
.box .l{font-size:28px;font-weight:800;letter-spacing:.05em;margin-bottom:12px}
.box .b{font-size:38px;font-weight:800;line-height:1.38}
.box.old{border:1px solid rgba(107,114,128,0.4);border-left:6px solid #6B7280}
.box.old .l{color:#6B7280}
.box.old .b{color:#B0B0CC}
.box.new{border:1px solid rgba(16,185,129,0.35);border-left:6px solid #10B981}
.box.new .l{color:#10B981}
.box.new .b .em{color:#10B981}
</style>
</head>
<body>
<div class="slide">
  <div class="kick">增长方式，也要换挡</div>
  <div class="title">你需要一台<br><span class="hl">增长机器</span></div>
  <div class="scale">
    <div class="row"><span class="from">几千人</span><span class="arrow">→</span><span class="to">上百万人</span></div>
    <div class="row"><span class="from">一个市场</span><span class="arrow">→</span><span class="to">很多个市场</span></div>
  </div>
  <div class="cards">
    <div class="box old">
      <div class="l">过去每一关</div>
      <div class="b">贴着用户，凭手感调出来的增长</div>
    </div>
    <div class="box new">
      <div class="l">现在</div>
      <div class="b">系统化的增长——<span class="em">不靠你的手感</span>，也能持续运转</div>
    </div>
  </div>
</div>
</body>
</html>
