<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0D0D1A;font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;color:#FFFFFF;overflow:hidden}
.slide{width:100%;height:100%;padding:200px 72px 420px 72px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.kick{font-size:30px;font-weight:700;letter-spacing:.08em;color:#F59E0B;margin-bottom:22px}
.title{font-size:62px;font-weight:800;line-height:1.26}
.title .hl{color:#F59E0B}
.list{display:flex;flex-direction:column;gap:18px;width:100%;margin-top:44px}
.row{background:#1A1A2E;border:1px solid rgba(139,92,246,0.3);border-left:4px solid #8B5CF6;border-radius:12px;padding:26px 30px;text-align:left;display:flex;align-items:center;gap:18px}
.row .n{flex-shrink:0;font-size:30px;font-weight:800;color:#8B5CF6}
.row .t{font-size:36px;font-weight:800;line-height:1.32}
.row .t .em{color:#8B5CF6}
.punch{width:100%;margin-top:38px;background:#1A1A2E;border:1px solid rgba(16,185,129,0.4);border-left:6px solid #10B981;border-radius:14px;padding:28px 30px;text-align:left;font-size:36px;font-weight:800;line-height:1.42}
.punch .em{color:#10B981}
</style>
</head>
<body>
<div class="slide">
  <div class="kick">全集最反直觉的判断</div>
  <div class="title">护城河不是新工程，<br>是<span class="hl">回溯</span>出来的</div>
  <div class="list">
    <div class="row"><span class="n">01</span><span class="t">灌进产品里的<span class="em">领域专长</span></span></div>
    <div class="row"><span class="n">02</span><span class="t">与工具、平台的<span class="em">集成深度</span></span></div>
    <div class="row"><span class="n">03</span><span class="t">只属于你的<span class="em">系统数据和工作流</span></span></div>
  </div>
  <div class="punch">砌墙的材料，前四关已经替你攒下——<br>Scale 只是第一次<span class="em">把它们记成资产</span></div>
</div>
</body>
</html>
