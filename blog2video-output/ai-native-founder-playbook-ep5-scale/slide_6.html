<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0D0D1A;font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;color:#FFFFFF;overflow:hidden}
.slide{width:100%;height:100%;padding:200px 72px 420px 72px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.kick{font-size:30px;font-weight:700;letter-spacing:.08em;color:#8B5CF6;margin-bottom:22px}
.title{font-size:58px;font-weight:800;line-height:1.26}
.title .hl{color:#10B981}
.gate{width:100%;margin-top:40px;background:#1A1A2E;border:1px solid rgba(16,185,129,0.4);border-left:6px solid #10B981;border-radius:14px;padding:28px 30px;text-align:left;font-size:40px;font-weight:800;line-height:1.4}
.gate .em{color:#10B981}
.list{display:flex;flex-direction:column;gap:16px;width:100%;margin-top:32px}
.row{display:flex;align-items:center;gap:20px;background:#1A1A2E;border:1px solid rgba(59,130,246,0.35);border-left:4px solid #3B82F6;border-radius:12px;padding:24px 30px;text-align:left}
.row .n{flex-shrink:0;font-size:28px;font-weight:800;color:#3B82F6}
.row .t{font-size:34px;font-weight:800;line-height:1.32}
.row .t .en{color:#3B82F6}
.foot{width:100%;margin-top:34px;background:#1A1A2E;border:1px solid rgba(245,158,11,0.4);border-left:6px solid #F59E0B;border-radius:14px;padding:26px 30px;text-align:left;font-size:36px;font-weight:800;line-height:1.4}
.foot .em{color:#F59E0B}
</style>
</head>
<body>
<div class="slide">
  <div class="kick">什么时候算通关？</div>
  <div class="title">不是里程碑，<br>是一个<span class="hl">门槛事件</span></div>
  <div class="gate">公司离了你的日常运营，<br><span class="em">也能持续运转</span></div>
  <div class="list">
    <div class="row"><span class="n">形态 1</span><span class="t">持续盈利 · 不再需要外部资本</span></div>
    <div class="row"><span class="n">形态 2</span><span class="t">具备公开上市条件 · <span class="en">IPO-ready</span></span></div>
    <div class="row"><span class="n">形态 3</span><span class="t">被收购</span></div>
  </div>
  <div class="foot">三种形态，同一套要求——<br>从一个赌注，变成<span class="em">一门生意</span></div>
</div>
</body>
</html>
