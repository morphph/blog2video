<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0D0D1A;font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;color:#FFFFFF;overflow:hidden}
.slide{width:100%;height:100%;padding:200px 72px 420px 72px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.kick{font-size:30px;font-weight:700;letter-spacing:.08em;color:#8B5CF6;margin-bottom:22px}
.title{font-size:58px;font-weight:800;line-height:1.28}
.title .hl{color:#10B981}
.sub{margin-top:22px;font-size:32px;font-weight:700;color:#B0B0CC;line-height:1.45}
.sub .em{color:#8B5CF6;font-weight:800}
.test{width:100%;margin-top:40px;background:#1A1A2E;border:1px solid rgba(16,185,129,0.4);border-left:6px solid #10B981;border-radius:14px;padding:30px 30px;text-align:left}
.test .l{font-size:28px;font-weight:800;letter-spacing:.04em;color:#10B981;margin-bottom:18px}
.test .flow{display:flex;flex-direction:column;gap:14px}
.test .f{display:flex;align-items:center;gap:16px;font-size:32px;font-weight:800;line-height:1.35}
.test .f .arr{color:#10B981;flex-shrink:0}
.test .f .em{color:#10B981}
.foot{width:100%;margin-top:30px;background:#1A1A2E;border:1px solid rgba(59,130,246,0.4);border-left:6px solid #3B82F6;border-radius:14px;padding:26px 30px;text-align:left;font-size:32px;font-weight:800;line-height:1.42}
.foot .em{color:#3B82F6}
</style>
</head>
<body>
<div class="slide">
  <div class="kick">真正的功课</div>
  <div class="title">把脑子里的机构知识，<br>编码成<span class="hl">可转交的系统</span></div>
  <div class="sub">有文档 · 可审计 · 可转交</div>
  <div class="test">
    <div class="l">特别好用的自测 · 消失一周推演</div>
    <div class="flow">
      <div class="f"><span class="arr">①</span><span>让 Claude 盘一遍所有经过你的<span class="em">工作流 · 决策 · 审批</span></span></div>
      <div class="f"><span class="arr">②</span><span>推演：<span class="em">你消失一周</span>，每一条会怎样</span></div>
      <div class="f"><span class="arr">③</span><span>会停摆的那些 = <span class="em">交接没完成</span>的地方</span></div>
    </div>
  </div>
  <div class="foot">日常事务的接管和自动化，<br>直接交给 <span class="em">Claude Cowork</span> 去跑</div>
</div>
</body>
</html>
