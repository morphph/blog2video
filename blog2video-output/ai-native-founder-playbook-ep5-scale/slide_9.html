<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0D0D1A;font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;color:#FFFFFF;overflow:hidden}
.slide{width:100%;height:100%;padding:200px 72px 420px 72px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.kick{font-size:30px;font-weight:700;letter-spacing:.08em;color:#EF4444;margin-bottom:22px}
.title{font-size:62px;font-weight:800;line-height:1.24}
.title .hl{color:#EF4444}
.who{width:100%;margin-top:40px;background:#1A1A2E;border:1px solid rgba(239,68,68,0.35);border-left:6px solid #EF4444;border-radius:14px;padding:28px 30px;text-align:left}
.who .l{font-size:28px;font-weight:800;letter-spacing:.04em;color:#EF4444;margin-bottom:16px}
.who .items{display:flex;flex-wrap:wrap;gap:14px}
.who .chip{font-size:29px;font-weight:700;color:#FFFFFF;background:rgba(239,68,68,0.12);border:1px solid rgba(239,68,68,0.4);border-radius:999px;padding:12px 24px}
.what{width:100%;margin-top:26px;background:#1A1A2E;border:1px solid rgba(139,92,246,0.35);border-left:6px solid #8B5CF6;border-radius:14px;padding:26px 30px;text-align:left;font-size:32px;font-weight:800;line-height:1.42}
.what .em{color:#8B5CF6}
.sla{width:100%;margin-top:26px;background:#1A1A2E;border:1px solid rgba(245,158,11,0.4);border-left:6px solid #F59E0B;border-radius:14px;padding:26px 30px;text-align:left}
.sla .l{font-size:28px;font-weight:800;letter-spacing:.04em;color:#F59E0B;margin-bottom:12px}
.sla .b{font-size:34px;font-weight:800;line-height:1.4}
.sla .b .en{color:#F59E0B}
</style>
</head>
<body>
<div class="slide">
  <div class="kick">这一关的新税</div>
  <div class="title">外部审视，<br>带着<span class="hl">更高的怀疑</span>入场</div>
  <div class="who">
    <div class="l">谁在审</div>
    <div class="items">
      <span class="chip">公众投资人</span>
      <span class="chip">分析师</span>
      <span class="chip">监管机构</span>
      <span class="chip">企业采购团队</span>
      <span class="chip">潜在收购方</span>
    </div>
  </div>
  <div class="what">审的不止产品能力，更是产品周围的组织：<span class="em">治理 · 合规姿态 · 财务控制 · 讲故事的方式</span></div>
  <div class="sla">
    <div class="l">大客户签多年合同前，要看</div>
    <div class="b">产品文档 · 支持手册 · <span class="en">SLA</span><br>白纸黑字的服务等级承诺</div>
  </div>
</div>
</body>
</html>
