  <script>
  (function(){
    var R="[data-composition-id='s03'] ";
    var tl=gsap.timeline({paused:true});
    tl.from(R+'.grid',{opacity:0,duration:.5,ease:'power1.out'},.02);
    tl.from(R+'.topbar',{y:-16,opacity:0,duration:.3,ease:'power2.out'},.2);
    // 「藏着全片最硬的一个拷问」(~1s)
    D2.enter(tl, R+'.kicker', 1.0, {y:-12, ease:'power2.out'});

    D2.blink(tl, R+'.term-q .cur', 8.8, 4);
    D2.subs(tl, [['#sub-1',0.005]].map(function(s){return [R+s[0],s[1]];}));

    window.__timelines = window.__timelines || {};
    window.__timelines['s03'] = tl;
