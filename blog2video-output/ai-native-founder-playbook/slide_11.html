<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0D0D1A;font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;color:#FFFFFF;overflow:hidden}
.slide{width:100%;height:100%;padding:200px 72px 420px 72px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.badge{display:inline-flex;align-items:center;gap:14px;font-size:28px;font-weight:800;letter-spacing:.06em;color:#8B5CF6;border:1px solid rgba(139,92,246,0.4);border-radius:999px;padding:12px 26px;margin-bottom:26px}
.badge .n{color:#F59E0B}
.role{font-size:60px;font-weight:800;line-height:1.22}
.role .hl{color:#8B5CF6}
.meta{font-size:32px;color:#3B82F6;font-weight:800;letter-spacing:.04em;margin-top:14px}
.pain{width:100%;margin-top:42px;background:#1A1A2E;border:1px solid rgba(239,68,68,0.3);border-left:6px solid #EF4444;border-radius:14px;padding:28px 30px;text-align:left}
.pain .l{font-size:26px;font-weight:800;color:#EF4444;letter-spacing:.05em;margin-bottom:14px}
.pain .q{font-size:32px;font-weight:700;line-height:1.5;color:#B0B0CC}
.gain{width:100%;margin-top:24px;background:#1A1A2E;border:1px solid rgba(16,185,129,0.32);border-left:6px solid #10B981;border-radius:14px;padding:28px 30px;text-align:left}
.gain .l{font-size:26px;font-weight:800;color:#10B981;letter-spacing:.05em;margin-bottom:14px}
.gain .b{font-size:34px;font-weight:700;line-height:1.45}
.gain .b .em{color:#10B981}
.gain .flow{margin-top:16px;display:flex;flex-wrap:wrap;gap:12px}
.gain .chip{background:rgba(16,185,129,0.12);border:1px solid rgba(16,185,129,0.3);border-radius:999px;padding:12px 20px;font-size:28px;font-weight:700}
</style>
</head>
<body>
<div class="slide">
  <div class="badge">能力 <span class="n">02</span></div>
  <div class="role">那个永远在线、<br><span class="hl">从不被卡住</span>的工程师</div>
  <div class="meta">Agentic coding</div>
  <div class="pain">
    <div class="l">过去要写软件</div>
    <div class="q">要么有技术合伙人，要么外包，<br>要么先烧钱招起一支工程团队</div>
  </div>
  <div class="gain">
    <div class="l">现在</div>
    <div class="b">用<span class="em">大白话</span>描述，AI 就把活干了</div>
    <div class="flow">
      <span class="chip">生成代码</span>
      <span class="chip">跑测试</span>
      <span class="chip">排查问题</span>
      <span class="chip">打磨生产级代码库</span>
    </div>
  </div>
</div>
</body>
</html>
