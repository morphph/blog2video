<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0D0D1A;font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;color:#FFFFFF;overflow:hidden}
.slide{width:100%;height:100%;padding:200px 72px 420px 72px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.badge{display:inline-flex;align-items:center;gap:14px;font-size:28px;font-weight:800;letter-spacing:.06em;color:#8B5CF6;border:1px solid rgba(139,92,246,0.4);border-radius:999px;padding:12px 26px;margin-bottom:26px}
.badge .n{color:#F59E0B}
.role{font-size:58px;font-weight:800;line-height:1.22}
.role .hl{color:#8B5CF6}
.meta{font-size:30px;color:#6B7280;font-weight:700;letter-spacing:.06em;margin-top:14px}
.pain{width:100%;margin-top:40px;background:#1A1A2E;border:1px solid rgba(239,68,68,0.3);border-left:6px solid #EF4444;border-radius:14px;padding:28px 30px;text-align:left}
.pain .l{font-size:26px;font-weight:800;color:#EF4444;letter-spacing:.05em;margin-bottom:16px}
.pain .chips{display:flex;flex-wrap:wrap;gap:12px}
.pain .chip{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.28);border-radius:999px;padding:11px 18px;font-size:27px;font-weight:700;color:#B0B0CC}
.tax{margin-top:18px;font-size:30px;font-weight:700;color:#EF4444}
.gain{width:100%;margin-top:24px;background:#1A1A2E;border:1px solid rgba(16,185,129,0.32);border-left:6px solid #10B981;border-radius:14px;padding:28px 30px;text-align:left}
.gain .l{font-size:26px;font-weight:800;color:#10B981;letter-spacing:.05em;margin-bottom:14px}
.gain .b{font-size:31px;font-weight:700;line-height:1.55}
.gain .b .em{color:#10B981}
</style>
</head>
<body>
<div class="slide">
  <div class="badge">能力 <span class="n">03</span></div>
  <div class="role">一支随需待命的<br><span class="hl">自动化运营团队</span></div>
  <div class="meta">工作流自动化</div>
  <div class="pain">
    <div class="l">绕不过去的杂活</div>
    <div class="chips">
      <span class="chip">排日程</span><span class="chip">更新 CRM</span><span class="chip">拉周报</span>
      <span class="chip">维护文档</span><span class="chip">发内容</span><span class="chip">追合规</span>
    </div>
    <div class="tax">在精益团队里，全压在创始人一个人身上</div>
  </div>
  <div class="gain">
    <div class="l">自动化来抵这笔税</div>
    <div class="b">deal 一推进，<span class="em">CRM 自己更新</span><br>周报到点<span class="em">自己编译</span><br>产品一改，<span class="em">文档自动同步</span></div>
  </div>
</div>
</body>
</html>
