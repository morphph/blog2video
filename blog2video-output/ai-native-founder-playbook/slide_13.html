<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0D0D1A;font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;color:#FFFFFF;overflow:hidden}
.slide{width:100%;height:100%;padding:200px 72px 420px 72px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.warn{display:inline-flex;align-items:center;gap:14px;font-size:30px;font-weight:800;letter-spacing:.05em;color:#EF4444;border:1px solid rgba(239,68,68,0.4);border-radius:999px;padding:14px 30px;margin-bottom:30px}
.title{font-size:68px;font-weight:800;line-height:1.22}
.title .hl{color:#EF4444}
.one{width:100%;margin-top:48px;background:#1A1A2E;border:1px solid rgba(245,158,11,0.4);border-left:6px solid #F59E0B;border-radius:16px;padding:40px 34px}
.one .b{font-size:54px;font-weight:800;line-height:1.3}
.one .b .em{color:#F59E0B}
.shift{width:100%;margin-top:40px;display:flex;gap:18px}
.s{flex:1;background:#1A1A2E;border:1px solid rgba(139,92,246,0.22);border-radius:12px;padding:30px 22px;text-align:left}
.s.old{border-left:4px solid #6B7280}
.s.now{border-left:4px solid #8B5CF6}
.s .lab{font-size:25px;font-weight:800;letter-spacing:.05em;color:#6B7280;margin-bottom:12px}
.s.now .lab{color:#8B5CF6}
.s .v{font-size:33px;font-weight:700;line-height:1.4}
.s .v .em{color:#8B5CF6}
</style>
</head>
<body>
<div class="slide">
  <div class="warn">⚠ 绝不是自动驾驶</div>
  <div class="title">工具堆得再多，<br>也不会自己变成<span class="hl">杠杆</span></div>
  <div class="one"><div class="b">时机和编排<br><span class="em">Orchestration，就是一切</span></div></div>
  <div class="shift">
    <div class="s old"><div class="lab">过去卡你的</div><div class="v">会不会做</div></div>
    <div class="s now"><div class="lab">现在卡你的</div><div class="v">会不会<span class="em">指挥</span>、<br>什么时候用<span class="em">哪个工具</span></div></div>
  </div>
</div>
</body>
</html>
