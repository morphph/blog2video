<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0D0D1A;font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;color:#FFFFFF;overflow:hidden}
.slide{width:100%;height:100%;padding:200px 72px 420px 72px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.kick{font-size:30px;font-weight:700;letter-spacing:.08em;color:#EF4444;margin-bottom:26px}
.title{font-size:70px;font-weight:800;line-height:1.22}
.title .hl{color:#EF4444}
.card{width:100%;margin-top:50px;background:#1A1A2E;border:1px solid rgba(239,68,68,0.3);border-left:6px solid #EF4444;border-radius:16px;padding:38px 34px;text-align:left}
.card .b{font-size:42px;font-weight:700;line-height:1.45}
.card .b .em{color:#EF4444}
.prereq{width:100%;margin-top:28px;background:#1A1A2E;border:1px solid rgba(245,158,11,0.35);border-left:6px solid #F59E0B;border-radius:16px;padding:38px 34px;text-align:left}
.prereq .l{font-size:27px;font-weight:800;letter-spacing:.05em;color:#F59E0B;margin-bottom:14px}
.prereq .b{font-size:42px;font-weight:800;line-height:1.4}
.prereq .b .em{color:#F59E0B}
</style>
</head>
<body>
<div class="slide">
  <div class="kick">一个容易被忽略的代价</div>
  <div class="title">「刻意做小」，<br>有个<span class="hl">隐含前提</span></div>
  <div class="card"><div class="b">那些杂活<span class="em">不会消失</span>，<br>默认全压在<span class="em">你一个人头上</span></div></div>
  <div class="prereq"><div class="l">自动化能帮你抵税，但前提是</div><div class="b">你得先有本事，<br>把它<span class="em">配置起来</span></div></div>
</div>
</body>
</html>
