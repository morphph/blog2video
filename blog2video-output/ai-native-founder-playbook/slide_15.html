<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0D0D1A;font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;color:#FFFFFF;overflow:hidden}
.slide{width:100%;height:100%;padding:200px 72px 420px 72px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.glow{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:820px;height:820px;background:radial-gradient(circle,rgba(245,158,11,0.16) 0%,rgba(245,158,11,0) 70%);pointer-events:none}
.mark{position:relative;font-size:240px;line-height:0.7;font-weight:800;color:#8B5CF6;opacity:0.5;height:150px}
.quote{position:relative;font-size:78px;font-weight:800;line-height:1.32;letter-spacing:-.01em}
.quote .em{color:#F59E0B}
.bar{position:relative;width:120px;height:6px;background:#8B5CF6;border-radius:3px;margin:54px 0 30px}
.src{position:relative;font-size:30px;font-weight:700;letter-spacing:.05em;color:#6B7280}
</style>
</head>
<body>
<div class="slide">
  <div class="glow"></div>
  <div class="mark">“</div>
  <div class="quote">杠杆，<br>第一次和团队人数，<br><span class="em">脱了钩</span></div>
  <div class="bar"></div>
  <div class="src">The Founder's Playbook · Anthropic</div>
</div>
</body>
</html>
