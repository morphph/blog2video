<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0D0D1A;font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;color:#FFFFFF;overflow:hidden}
.slide{width:100%;height:100%;padding:190px 72px 420px 72px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.kick{font-size:28px;font-weight:700;letter-spacing:.08em;color:#8B5CF6;margin-bottom:18px}
.title{font-size:60px;font-weight:800;line-height:1.2}
.title .hl{color:#F59E0B}
.points{display:flex;flex-direction:column;gap:16px;width:100%;margin-top:38px}
.p{display:flex;align-items:center;gap:22px;background:#1A1A2E;border:1px solid rgba(139,92,246,0.22);border-radius:12px;padding:24px 28px;text-align:left}
.p .n{flex-shrink:0;width:54px;height:54px;border-radius:12px;background:rgba(139,92,246,0.18);color:#8B5CF6;font-size:30px;font-weight:800;display:flex;align-items:center;justify-content:center}
.p .t{font-size:33px;font-weight:700;line-height:1.35}
.p .t .em{color:#10B981}
.road{width:100%;margin-top:34px;background:#1A1A2E;border:1px solid rgba(59,130,246,0.3);border-left:5px solid #3B82F6;border-radius:14px;padding:26px 28px;text-align:left}
.road .l{font-size:25px;font-weight:800;letter-spacing:.05em;color:#3B82F6;margin-bottom:16px}
.road .steps{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.road .st{background:rgba(59,130,246,0.12);border:1px solid rgba(59,130,246,0.3);border-radius:999px;padding:11px 20px;font-size:28px;font-weight:700}
.road .ar{color:#6B7280;font-size:26px;font-weight:800}
.brand{margin-top:34px;font-size:34px;font-weight:800;line-height:1.4}
.brand .em{color:#ccff4d}
</style>
</head>
<body>
<div class="slide">
  <div class="kick">这一集 · 两块地基</div>
  <div class="title">拼的不再是「会做」，<br>而是「<span class="hl">能指挥多少 Agent</span>」</div>
  <div class="points">
    <div class="p"><span class="n">1</span><span class="t">玩法被掀翻 —— <span class="em">融资扩张依赖链被删</span></span></div>
    <div class="p"><span class="n">2</span><span class="t">身份被改写 —— <span class="em">执行者 → Agent 指挥者</span></span></div>
    <div class="p"><span class="n">3</span><span class="t">杠杆，第一次和<span class="em">人头脱了钩</span></span></div>
  </div>
  <div class="road">
    <div class="l">后面几集，走完四个阶段</div>
    <div class="steps">
      <span class="st">想法</span><span class="ar">→</span>
      <span class="st">MVP</span><span class="ar">→</span>
      <span class="st">上线</span><span class="ar">→</span>
      <span class="st">规模化</span>
    </div>
  </div>
  <div class="brand">AI 世界很吵，<br><span class="em">精读一篇，胜过刷一百条</span></div>
</div>
</body>
</html>
