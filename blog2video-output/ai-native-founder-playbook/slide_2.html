<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0D0D1A;font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;color:#FFFFFF;overflow:hidden}
.slide{width:100%;height:100%;padding:200px 72px 420px 72px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.kick{font-size:30px;font-weight:700;letter-spacing:.1em;color:#8B5CF6;margin-bottom:24px}
.title{font-size:72px;font-weight:800;line-height:1.22}
.title .hl{color:#10B981}
.lead{font-size:34px;color:#B0B0CC;margin-top:24px}
.list{display:flex;flex-direction:column;gap:18px;width:100%;margin-top:56px}
.item{display:flex;align-items:center;gap:22px;background:#1A1A2E;border:1px solid rgba(139,92,246,0.22);border-left:4px solid #10B981;border-radius:12px;padding:26px 30px;text-align:left}
.item .tick{flex-shrink:0;width:44px;height:44px;border-radius:50%;background:rgba(16,185,129,0.15);color:#10B981;font-size:30px;font-weight:800;display:flex;align-items:center;justify-content:center}
.item .t{font-size:38px;font-weight:700}
.punch{margin-top:48px;font-size:44px;font-weight:800;line-height:1.4}
.punch .hl{color:#F59E0B}
</style>
</head>
<body>
<div class="slide">
  <div class="kick">第一件事</div>
  <div class="title">创业，被<span class="hl">换了一套规则</span></div>
  <div class="lead">2026 年，AI 能独立干完的事</div>
  <div class="list">
    <div class="item"><span class="tick">✓</span><span class="t">写生产级代码</span></div>
    <div class="item"><span class="tick">✓</span><span class="t">做市场调研、梳理竞争格局</span></div>
    <div class="item"><span class="tick">✓</span><span class="t">起草给投资人看的材料</span></div>
    <div class="item"><span class="tick">✓</span><span class="t">把运营流程自动跑起来</span></div>
  </div>
  <div class="punch">那条陡峭的学习曲线，<br>被<span class="hl">直接抹平了</span></div>
</div>
</body>
</html>
