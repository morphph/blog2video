<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0D0D1A;font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;color:#FFFFFF;overflow:hidden}
.slide{width:100%;height:100%;padding:200px 72px 420px 72px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.bignum{font-size:300px;font-weight:800;line-height:0.9;color:#8B5CF6;letter-spacing:-.04em}
.bignum .u{font-size:90px;font-weight:700;color:#FFFFFF;margin-left:12px}
.cap{font-size:46px;font-weight:800;margin-top:8px}
.cap .hl{color:#F59E0B}
.split{display:flex;gap:24px;width:100%;margin-top:64px}
.col{flex:1;background:#1A1A2E;border:1px solid rgba(139,92,246,0.22);border-radius:12px;padding:32px 26px;text-align:left}
.col.before{border-left:4px solid #6B7280}
.col.after{border-left:4px solid #10B981}
.col .lab{font-size:26px;font-weight:700;letter-spacing:.06em;color:#6B7280;margin-bottom:16px}
.col.after .lab{color:#10B981}
.col .v{font-size:36px;font-weight:700;line-height:1.35}
.col .v .em{color:#10B981}
</style>
</head>
<body>
<div class="slide">
  <div class="bignum">10<span class="u">人</span></div>
  <div class="cap">「精益<span class="hl">独角兽</span>」</div>
  <div class="split">
    <div class="col before"><div class="lab">过去</div><div class="v">草根逆袭的传奇<br>听上去像奇迹</div></div>
    <div class="col after"><div class="lab">现在</div><div class="v">一种<span class="em">刻意为之</span>的打法</div></div>
  </div>
</div>
</body>
</html>
