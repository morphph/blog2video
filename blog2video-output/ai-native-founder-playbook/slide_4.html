<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0D0D1A;font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;color:#FFFFFF;overflow:hidden}
.slide{width:100%;height:100%;padding:200px 72px 420px 72px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.kick{font-size:30px;font-weight:700;letter-spacing:.08em;color:#8B5CF6;margin-bottom:22px}
.title{font-size:64px;font-weight:800;line-height:1.25}
.title .hl{color:#EF4444}
.flow{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:14px;width:100%;margin-top:48px}
.step{background:#1A1A2E;border:1px solid rgba(139,92,246,0.25);border-radius:10px;padding:18px 24px;font-size:30px;font-weight:700;color:#B0B0CC}
.arrow{color:#6B7280;font-size:30px;font-weight:800}
.loop{font-size:26px;color:#6B7280;font-weight:700;margin-top:14px}
.concept{width:100%;margin-top:54px;background:#1A1A2E;border:1px solid rgba(239,68,68,0.35);border-left:6px solid #EF4444;border-radius:14px;padding:36px 34px;text-align:left}
.concept .l{font-size:28px;font-weight:700;letter-spacing:.06em;color:#EF4444;margin-bottom:16px}
.concept .b{font-size:44px;font-weight:800;line-height:1.4}
.concept .b .em{color:#F59E0B}
</style>
</head>
<body>
<div class="slide">
  <div class="kick">它顺手删掉的那条线</div>
  <div class="title">AI 删掉的，<br>不是<span class="hl">写代码的时间</span></div>
  <div class="flow">
    <span class="step">验证想法</span><span class="arrow">→</span>
    <span class="step">融资</span><span class="arrow">→</span>
    <span class="step">招人</span><span class="arrow">→</span>
    <span class="step">开发</span><span class="arrow">→</span>
    <span class="step">再融资</span><span class="arrow">→</span>
    <span class="step">做大</span><span class="arrow">→</span>
    <span class="step">招更多人</span>
  </div>
  <div class="loop">↻ 然后不停循环</div>
  <div class="concept">
    <div class="l">它真正抹掉的</div>
    <div class="b">「每往前一步，<br>都要先<span class="em">变大</span>、先<span class="em">拿钱</span>」<br>这条隐形依赖链</div>
  </div>
</div>
</body>
</html>
