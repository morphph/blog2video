<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0D0D1A;font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;color:#FFFFFF;overflow:hidden}
.slide{width:100%;height:100%;padding:200px 72px 420px 72px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.kick{font-size:30px;font-weight:700;letter-spacing:.08em;color:#8B5CF6;margin-bottom:22px}
.title{font-size:68px;font-weight:800;line-height:1.22}
.title .hl{color:#8B5CF6}
.pair{display:flex;align-items:stretch;gap:18px;width:100%;margin-top:56px}
.side{flex:1;background:#1A1A2E;border:1px solid rgba(139,92,246,0.22);border-radius:12px;padding:34px 26px}
.side .who{font-size:36px;font-weight:800;margin-bottom:12px}
.side .role{font-size:30px;color:#B0B0CC;line-height:1.4}
.wall{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:24px;font-weight:800;letter-spacing:.04em;color:#6B7280}
.wall .brick{width:6px;height:120px;background:repeating-linear-gradient(#3a3a55,#3a3a55 14px,#0D0D1A 14px,#0D0D1A 18px);border-radius:3px;margin-bottom:12px}
.result{width:100%;margin-top:50px;background:#1A1A2E;border:1px solid rgba(16,185,129,0.35);border-left:6px solid #10B981;border-radius:14px;padding:34px 32px}
.result .b{font-size:46px;font-weight:800;line-height:1.35}
.result .b .em{color:#10B981}
</style>
</head>
<body>
<div class="slide">
  <div class="kick">第二件事，更有意思</div>
  <div class="title">「创始人」这个词，<br><span class="hl">被改写了</span></div>
  <div class="pair">
    <div class="side"><div class="who">能动手做的人</div><div class="role">技术创始人<br>写代码</div></div>
    <div class="wall"><div class="brick"></div>墙</div>
    <div class="side"><div class="who">有好点子的人</div><div class="role">非技术创始人<br>跑业务、签单子</div></div>
  </div>
  <div class="result"><div class="b">现在这堵墙，<span class="em">塌了</span></div></div>
</div>
</body>
</html>
