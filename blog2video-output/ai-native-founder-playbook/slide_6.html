<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0D0D1A;font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;color:#FFFFFF;overflow:hidden}
.slide{width:100%;height:100%;padding:200px 72px 420px 72px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.title{font-size:74px;font-weight:800;line-height:1.2}
.title .hl{color:#8B5CF6}
.sub{font-size:34px;color:#B0B0CC;margin-top:26px;line-height:1.5}
.sub b{color:#FFFFFF;font-weight:800}
.base{width:100%;margin-top:56px;background:#1A1A2E;border:1px solid rgba(139,92,246,0.3);border-radius:14px;padding:30px;font-size:34px;font-weight:700;color:#B0B0CC}
.base b{color:#8B5CF6}
.reach{display:flex;gap:18px;width:100%;margin-top:28px}
.r{flex:1;background:#1A1A2E;border:1px solid rgba(16,185,129,0.3);border-top:4px solid #10B981;border-radius:12px;padding:30px 18px;font-size:32px;font-weight:800;line-height:1.3}
.r .em{color:#10B981;display:block;font-size:38px;margin-top:6px}
</style>
</head>
<body>
<div class="slide">
  <div class="title">早期公司，<br><span class="hl">刻意做小</span></div>
  <div class="sub">经常就是创始人<b>一个人</b>，<br>或者加上很少的几个伙伴</div>
  <div class="base">把技术和组织，都架在 <b>AI 底座</b>上</div>
  <div class="reach">
    <div class="r">扩张团队前就摸到<span class="em">产品验证</span></div>
    <div class="r">扩张团队前就摸到<span class="em">早期收入</span></div>
    <div class="r">甚至摸到<span class="em">盈利</span></div>
  </div>
</div>
</body>
</html>
