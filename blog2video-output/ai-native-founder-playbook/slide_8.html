<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0D0D1A;font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;color:#FFFFFF;overflow:hidden}
.slide{width:100%;height:100%;padding:200px 72px 420px 72px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.kick{font-size:30px;font-weight:700;letter-spacing:.08em;color:#8B5CF6;margin-bottom:22px}
.title{font-size:70px;font-weight:800;line-height:1.22}
.title .hl{color:#F59E0B}
.row{display:flex;gap:18px;width:100%;margin-top:54px}
.c{flex:1;background:#1A1A2E;border:1px solid rgba(139,92,246,0.22);border-radius:12px;padding:32px 24px;text-align:left}
.c.dim{border-left:4px solid #6B7280}
.c.win{border-left:4px solid #10B981}
.c .lab{font-size:26px;font-weight:700;letter-spacing:.05em;color:#6B7280;margin-bottom:14px}
.c.win .lab{color:#10B981}
.c .v{font-size:34px;font-weight:700;line-height:1.4}
.c .v .em{color:#10B981}
.note{width:100%;margin-top:48px;background:#1A1A2E;border:1px solid rgba(245,158,11,0.3);border-left:6px solid #F59E0B;border-radius:14px;padding:32px;text-align:left;font-size:36px;font-weight:700;line-height:1.45}
.note .em{color:#F59E0B}
</style>
</head>
<body>
<div class="slide">
  <div class="kick">最革命性的那一下</div>
  <div class="title">最被解放的，<br><span class="hl">不是工程师</span></div>
  <div class="row">
    <div class="c dim"><div class="lab">表面上</div><div class="v">AI 帮你写代码，<br>受益的是工程师</div></div>
    <div class="c win"><div class="lab">真正被解放</div><div class="v">有<span class="em">领域专长</span>、却不懂工程的<span class="em">非技术创始人</span></div></div>
  </div>
  <div class="note">人才池扩大到工程师以外，<br>一批人带着<span class="em">真实人生经历</span>，<br>去解决从前没人注意的真问题</div>
</div>
</body>
</html>
