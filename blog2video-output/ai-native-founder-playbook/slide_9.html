<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0D0D1A;font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;color:#FFFFFF;overflow:hidden}
.slide{width:100%;height:100%;padding:200px 72px 420px 72px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.kick{font-size:30px;font-weight:700;letter-spacing:.08em;color:#8B5CF6;margin-bottom:30px}
.title{font-size:78px;font-weight:800;line-height:1.2}
.title .hl{color:#F59E0B}
.flip{display:flex;flex-direction:column;gap:22px;width:100%;margin-top:60px}
.f{background:#1A1A2E;border-radius:14px;padding:34px 32px;text-align:left}
.f.old{border:1px solid rgba(107,114,128,0.4);border-left:6px solid #6B7280}
.f.new{border:1px solid rgba(16,185,129,0.4);border-left:6px solid #10B981}
.f .lab{font-size:28px;font-weight:800;letter-spacing:.05em;margin-bottom:12px}
.f.old .lab{color:#6B7280}
.f.new .lab{color:#10B981}
.f .v{font-size:40px;font-weight:700;line-height:1.35}
.f .v .em{color:#10B981}
.f .v s{color:#6B7280}
</style>
</head>
<body>
<div class="slide">
  <div class="kick">一个被反转的旧观念</div>
  <div class="title">人多，不再<br>等于<span class="hl">厉害</span></div>
  <div class="flip">
    <div class="f old"><div class="lab">传统创业</div><div class="v">团队越大 = 越有势能、越成熟<br>—— 人头是「信号」</div></div>
    <div class="f new"><div class="lab">AI-native</div><div class="v"><span class="em">小，才是刻意设计</span></div></div>
  </div>
</div>
</body>
</html>
