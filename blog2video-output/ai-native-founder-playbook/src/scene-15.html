<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
/*@@BASE@@*/
/* —— scene-15 特有 —— */
[data-composition-id='s15'] .term-l2{font-size:50px}
[data-composition-id='s15'] .q-cyan{color:#5fd3e8}
[data-composition-id='s15'] .punch{margin-top:36px;font-weight:700;font-size:54px;line-height:1.42;color:#edebe6}
[data-composition-id='s15'] .punch .hl{padding:4px 16px;margin-left:4px}
[data-composition-id='s15'] .punch .hl .tx{font-weight:900}
</style>
</head>
<body>
  <div id="root" class="stage" data-composition-id="s15" data-start="0" data-duration="14.767" data-width="1080" data-height="1920">
    <div class="grid"></div>
    <div class="topbar">
      <div class="brand">精读AI · AI 原生创业手册<span class="b-cur"></span></div>
      <div class="idx">[15/16]</div>
    </div>

    <div class="content">
      <div class="kicker">// 反直觉的<span class="acc">结论</span></div>

      <div class="term" style="margin-top:28px">
        <div class="term-bar"><span class="d" style="background:#ff6b5e"></span><span class="d" style="background:#ffbd2e"></span><span class="d" style="background:#27c93f"></span><span class="t">leverage@anthropic: ~</span></div>
        <div class="term-body">
          <div class="term-l1"><span class="p">$</span>真正用好 AI 的公司</div>
          <div class="term-l2">运转的体量，<span class="q-cyan">远超人头规模</span></div>
          <div class="term-src">— The Founder's Playbook · <b>Anthropic</b></div>
        </div>
      </div>

      <div class="punch">杠杆，第一次和团队人数，<span class="hl"><span class="bar"></span><span class="tx">脱了钩</span></span></div>
    </div>

    <div id="sub-1" class="clip sub" data-start="0.008" data-duration="11.534" data-track-index="5"><div class="sub-inner">把这些放到一起，你会得到一个很反直觉的结论：一家真正用好 AI 的公司，运转起来的体量，会<span class="sub-k">远远超过</span>它的人头所暗示的规模。</div></div>
    <div id="sub-2" class="clip sub" data-start="11.542" data-duration="3.076" data-track-index="5"><div class="sub-inner">杠杆，第一次和团队人数，<span class="sub-k">脱了钩</span>。</div></div>
  </div>

  <script>
  /*@@MOTION@@*/
  </script>
  <script>
  (function(){
    var R="[data-composition-id='s15'] ";
    var tl=gsap.timeline({paused:true});
    tl.from(R+'.grid',{opacity:0,duration:.5,ease:'power1.out'},.02);
    tl.from(R+'.topbar',{y:-16,opacity:0,duration:.3,ease:'power2.out'},.2);
    D2.enter(tl, R+'.kicker', .4, {y:-12, ease:'power2.out'});
    D2.enter(tl, R+'.term', 1.0, {y:24, d:.45, ease:'expo.out'});
    tl.from(R+'.term-bar',{opacity:0,duration:.3,ease:'power1.out'},1.2);
    D2.enter(tl, R+'.term-l1', 1.8, {y:12, d:.3, ease:'power2.out'});
    D2.enter(tl, R+'.term-l2', 4.8, {y:16, d:.36, ease:'power3.out'});
    D2.enter(tl, R+'.term-src', 8.0, {opacity:0, y:8, d:.3, ease:'power1.out'});
    // punchline (sub-2)
    D2.enter(tl, R+'.punch', 11.3, {y:14, d:.34, ease:'power2.out'});
    D2.sweep(tl, R, '.hl', 13.0);
    D2.subs(tl, [['#sub-1',0.008],['#sub-2',11.542]].map(function(s){return [R+s[0],s[1]];}));
    D2.breath(tl, R+'.content', 14.767, 'in');
    window.__timelines = window.__timelines || {};
    window.__timelines['s15'] = tl;
  })();
  </script>
</body>
</html>
