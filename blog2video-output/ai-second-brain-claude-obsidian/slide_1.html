<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=1080">
<style>*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0D0D1A;font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;color:#FFFFFF;overflow:hidden}
.slide{width:100%;height:100%;padding:200px 72px 420px 72px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.title{font-size:78px;font-weight:800;line-height:1.25;letter-spacing:-0.5px}
.title .hl{color:#8B5CF6}
.sub{margin-top:40px;font-size:36px;color:#B0B0CC;line-height:1.5}
.cards{margin-top:72px;display:flex;flex-direction:column;gap:28px;width:100%}
.card{background:#1A1A2E;border:1px solid rgba(139,92,246,0.2);border-radius:18px;padding:40px 44px;text-align:left;font-size:40px;line-height:1.4;color:#FFFFFF;position:relative}
.card.red{border-left:4px solid #EF4444}
.card.purple{border-left:4px solid #8B5CF6}
.card .lab{font-size:30px;color:#B0B0CC;display:block;margin-bottom:12px;font-weight:600}
</style></head><body><div class="slide">
<div class="title">同样 <span class="hl">$20</span> 订阅<br>为什么有人的 Claude<br><span class="hl">越用越懂你</span>？</div>
<div class="cards">
<div class="card red"><span class="lab">每次打开</span>都得从头解释自己，聊完即忘，下次又从零开始</div>
<div class="card purple"><span class="lab">同样的订阅</span>有人的 Claude 越用越蠢，有人的却越用越懂他</div>
</div>
</div></body></html>
