<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=1080">
<style>*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0D0D1A;font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;color:#FFFFFF;overflow:hidden}
.slide{width:100%;height:100%;padding:200px 72px 420px 72px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.title{font-size:64px;font-weight:800;line-height:1.3;margin-bottom:52px}
.title .hl{color:#EF4444}
.cards{display:flex;flex-direction:column;gap:24px;width:100%}
.card{background:#1A1A2E;border:1px solid rgba(139,92,246,0.2);border-radius:18px;padding:38px;text-align:left;font-size:37px;line-height:1.4}
.card.red{border-left:4px solid #EF4444}
.card.green{border-left:4px solid #10B981}
.card .lab{display:block;font-size:29px;font-weight:700;margin-bottom:10px;color:#B0B0CC}
.card b{font-weight:800}
.card.red b{color:#EF4444}
.card.green b{color:#10B981}
</style></head><body><div class="slide">
<div class="title">这套系统<br>有<span class="hl">门槛和代价</span></div>
<div class="cards">
<div class="card red"><span class="lab">硬成本</span>Claude Pro <b>$20/月</b>，Obsidian 必须全程开着，没现成云同步</div>
<div class="card red"><span class="lab">局限</span>纯文本擅长想法，不擅长二进制和海量数据 + 自动驾驶风险</div>
<div class="card green"><span class="lab">不想从零接线</span>GitHub 有现成仓库，有的带 43 条命令，克隆改成你的私人版</div>
</div>
</div></body></html>
