<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=1080">
<style>*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0D0D1A;font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;color:#FFFFFF;overflow:hidden}
.slide{width:100%;height:100%;padding:200px 72px 420px 72px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.title{font-size:68px;font-weight:800;line-height:1.25;margin-bottom:56px}
.title .hl{color:#8B5CF6}
.cards{display:flex;gap:28px;width:100%;margin-bottom:48px}
.card{flex:1;background:#1A1A2E;border:1px solid rgba(139,92,246,0.2);border-radius:18px;padding:44px 32px;text-align:left}
.card.red{border-left:4px solid #EF4444}
.card.green{border-left:4px solid #10B981}
.card .h{font-size:34px;font-weight:800;margin-bottom:18px}
.card.red .h{color:#EF4444}
.card.green .h{color:#10B981}
.card .d{font-size:33px;color:#FFFFFF;line-height:1.42}
.take{font-size:44px;font-weight:800;color:#F59E0B;line-height:1.35}
.take .file{font-family:'JetBrains Mono',monospace}
</style></head><body><div class="slide">
<div class="title">你不是在配置 Claude<br>是在造一具<span class="hl">记忆体</span></div>
<div class="cards">
<div class="card red"><div class="h">在这之前</div><div class="d">一关窗口就忘了你，每次冷启动，上下文压在你一人身上</div></div>
<div class="card green"><div class="h">在这之后</div><div class="d">纯文本、全归你，跑在任何模型上，趁你睡觉自己生长</div></div>
</div>
<div class="take">今天就把 <span class="file">CLAUDE.md</span> 这第一块砖搭起来<br>让它先面试你一次</div>
</div></body></html>
