<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=1080">
<style>*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0D0D1A;font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;color:#FFFFFF;overflow:hidden}
.slide{width:100%;height:100%;padding:200px 72px 420px 72px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.title{font-size:62px;font-weight:800;line-height:1.3;margin-bottom:60px}
.title .hl{color:#8B5CF6}
.cards{display:flex;flex-direction:column;gap:32px;width:100%}
.card{background:#1A1A2E;border:1px solid rgba(139,92,246,0.2);border-radius:18px;padding:44px;text-align:left}
.card.blue{border-left:4px solid #3B82F6}
.card.purple{border-left:4px solid #8B5CF6}
.card .name{font-size:46px;font-weight:800;margin-bottom:18px}
.card.blue .name{color:#3B82F6}
.card.purple .name{color:#8B5CF6}
.card .role{font-size:36px;color:#FFFFFF;line-height:1.45}
.card .role b{color:#FFFFFF;font-weight:800}
</style></head><body><div class="slide">
<div class="title">两个工具配合干活<br>分工藏着<span class="hl">关键</span></div>
<div class="cards">
<div class="card blue"><div class="name">Obsidian = 存储</div><div class="role">免费笔记软件，纯文本存在<b>你自己的电脑</b>上，链接织成一张想法地图</div></div>
<div class="card purple"><div class="name">Claude = 大脑</div><div class="role">读完你整个库，把新信息归位、连接，<b>跨所有内容</b>回答你</div></div>
</div>
</div></body></html>
