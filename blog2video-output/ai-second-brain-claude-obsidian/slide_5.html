<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=1080">
<style>*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0D0D1A;font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;color:#FFFFFF;overflow:hidden}
.slide{width:100%;height:100%;padding:200px 72px 420px 72px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.title{font-size:66px;font-weight:800;line-height:1.3;margin-bottom:56px}
.title .hl{color:#8B5CF6}
.cards{display:flex;flex-direction:column;gap:28px;width:100%}
.card{background:#1A1A2E;border:1px solid rgba(139,92,246,0.2);border-radius:18px;padding:42px;text-align:left;font-size:40px;line-height:1.42}
.card.red{border-left:4px solid #EF4444}
.card.green{border-left:4px solid #10B981}
.card .lab{display:block;font-size:30px;font-weight:700;margin-bottom:12px;color:#B0B0CC}
.file{margin-top:40px;font-family:'JetBrains Mono',monospace;font-size:42px;font-weight:800;color:#F59E0B;background:#1A1A2E;border:1px solid rgba(245,158,11,0.4);border-radius:14px;padding:28px 40px}
</style></head><body><div class="slide">
<div class="title">别自己敲<br>让 Claude <span class="hl">面试你</span></div>
<div class="cards">
<div class="card red"><span class="lab">直觉做法</span>自己一条条敲背景 —— 最枯燥、最容易半途而废</div>
<div class="card green"><span class="lab">正确做法</span>它一次只问一个：你是谁、目标、长短板、手头项目</div>
</div>
<div class="file">→ 写进 CLAUDE.md，每次自动加载</div>
</div></body></html>
