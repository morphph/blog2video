<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=1080">
<style>*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0D0D1A;font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;color:#FFFFFF;overflow:hidden}
.slide{width:100%;height:100%;padding:200px 72px 420px 72px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.tag{font-size:32px;font-weight:700;color:#F59E0B;letter-spacing:2px;margin-bottom:28px}
.title{font-size:64px;font-weight:800;line-height:1.3;margin-bottom:60px}
.title .hl{color:#F59E0B}
.cards{display:flex;gap:28px;width:100%}
.card{flex:1;background:#1A1A2E;border:1px solid rgba(139,92,246,0.2);border-radius:18px;padding:44px 34px;text-align:left}
.card.red{border-left:4px solid #EF4444}
.card.green{border-left:4px solid #10B981}
.card .h{font-size:36px;font-weight:800;margin-bottom:18px}
.card.red .h{color:#EF4444}
.card.green .h{color:#10B981}
.card .d{font-size:34px;color:#FFFFFF;line-height:1.45}
.punch{margin-top:48px;font-size:46px;font-weight:800;color:#F59E0B;line-height:1.35}
</style></head><body><div class="slide">
<div class="tag">最反直觉的一条</div>
<div class="title">上下文越多越聪明？<br><span class="hl">恰恰相反</span></div>
<div class="cards">
<div class="card red"><div class="h">巨型库里干活</div><div class="d">让 Claude 看见你全部人生 —— 聚焦散了</div></div>
<div class="card green"><div class="h">只开一个项目</div><div class="d">上下文越窄，聚焦越准</div></div>
</div>
<div class="punch">大库做计划，单个项目才出货</div>
</div></body></html>
