<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=1080">
<style>*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0D0D1A;font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;color:#FFFFFF;overflow:hidden}
.slide{width:100%;height:100%;padding:200px 72px 420px 72px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.title{font-size:60px;font-weight:800;line-height:1.3;margin-bottom:52px}
.title .hl{color:#10B981}
.cards{display:flex;flex-direction:column;gap:26px;width:100%}
.card{background:#1A1A2E;border:1px solid rgba(139,92,246,0.2);border-radius:18px;padding:40px;text-align:left;font-size:40px;line-height:1.42}
.card.green{border-left:4px solid #10B981}
.card.purple{border-left:4px solid #8B5CF6}
.card .lab{display:block;font-size:30px;font-weight:700;margin-bottom:12px;color:#B0B0CC}
.card b{color:#10B981;font-weight:800}
.cmd{margin-top:40px;font-family:'JetBrains Mono',monospace;font-size:40px;font-weight:700;color:#10B981;background:#1A1A2E;border:1px solid rgba(16,185,129,0.4);border-radius:14px;padding:28px 40px}
</style></head><body><div class="slide">
<div class="title">做了不止一次<br>就该存成一个 <span class="hl">Skill</span></div>
<div class="cards">
<div class="card green"><span class="lab">Skill = 被保存的工作流</span>把你怎么做 + 一个例子，存成项目里的技能文件</div>
<div class="card purple"><span class="lab">下一次</span>一声令下，<b>它就照你的方式跑一遍</b></div>
</div>
<div class="cmd">"跑那个技能" → 瞬间按你习惯执行</div>
</div></body></html>
