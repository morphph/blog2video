<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=1080">
<style>*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0D0D1A;font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;color:#FFFFFF;overflow:hidden}
.slide{width:100%;height:100%;padding:200px 72px 420px 72px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.title{font-size:62px;font-weight:800;line-height:1.3;margin-bottom:54px}
.title .hl{color:#3B82F6}
.cards{display:flex;flex-direction:column;gap:26px;width:100%}
.card{background:#1A1A2E;border:1px solid rgba(139,92,246,0.2);border-radius:18px;padding:40px;text-align:left;font-size:38px;line-height:1.42}
.card.blue{border-left:4px solid #3B82F6}
.card.purple{border-left:4px solid #8B5CF6}
.card .lab{display:block;font-size:30px;font-weight:700;margin-bottom:12px;color:#B0B0CC}
.card b{font-weight:800}
.card.blue b{color:#3B82F6}
.card.purple b{color:#8B5CF6}
</style></head><body><div class="slide">
<div class="title">接入实时数据<br>放上<span class="hl">自动驾驶</span></div>
<div class="cards">
<div class="card blue"><span class="lab">一行 MCP 命令</span>接进日历、邮件 —— <b>MCP</b> 是 Claude 跟其他应用对话的标准方式</div>
<div class="card purple"><span class="lab">Claude Desktop 定时任务</span>每天早 7 点：自动归档、标记过期、写三行隔夜摘要</div>
</div>
</div></body></html>
