<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px; background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%; padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      text-align: center; position: relative;
    }
    .halo { position: absolute; top: 280px; left: 50%; transform: translateX(-50%);
      width: 760px; height: 760px; background: radial-gradient(circle, rgba(139,92,246,0.22), transparent 65%); }
    .kicker { font-size: 30px; color: #8B5CF6; font-weight: 700; letter-spacing: 2px; margin-bottom: 36px; z-index: 1; }
    .title { font-size: 92px; font-weight: 800; line-height: 1.18; z-index: 1; }
    .title .em { color: #8B5CF6; }
    .sub { font-size: 38px; color: #B0B0CC; margin-top: 40px; line-height: 1.45; z-index: 1; }
    .card { margin-top: 64px; width: 100%; background: #1A1A2E; border: 1px solid rgba(139,92,246,0.2);
      border-left: 4px solid #F59E0B; border-radius: 12px; padding: 32px 28px; text-align: left; z-index: 1; }
    .card .q { font-size: 40px; font-weight: 700; color: #F59E0B; line-height: 1.4; }
    .card .a { font-size: 34px; color: #FFFFFF; margin-top: 18px; line-height: 1.45; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="halo"></div>
    <div class="kicker">SELF-IMPROVING AGENT</div>
    <div class="title">你的 AI Agent，<br>应该<span class="em">自己修自己</span></div>
    <div class="sub">一个被严重低估的概念</div>
    <div class="card">
      <div class="q">生产环境出故障——</div>
      <div class="a">它自己把自己修好了，<br>修完还比出问题前更难被打破。</div>
    </div>
  </div>
</body>
</html>
