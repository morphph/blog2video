<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px; background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%; padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      text-align: center; position: relative;
    }
    .title { font-size: 60px; font-weight: 800; line-height: 1.25; }
    .title .em { color: #10B981; }
    .sub { font-size: 32px; color: #B0B0CC; margin-top: 20px; }
    .list { width: 100%; margin-top: 56px; display: flex; flex-direction: column; gap: 22px; }
    .row { background: #1A1A2E; border: 1px solid rgba(139,92,246,0.2); border-left: 4px solid #EF4444;
      border-radius: 12px; padding: 28px 26px; text-align: left; display: flex; align-items: center; gap: 22px; }
    .mark { font-size: 40px; color: #EF4444; font-weight: 800; flex-shrink: 0; }
    .qt { font-size: 38px; font-weight: 700; line-height: 1.35; }
    .qt .hl { color: #F59E0B; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="title">一条干净的 <span class="em">trace</span><br>什么都告诉你了</div>
    <div class="sub">每次模型调用 · 工具 · 延迟 · token 全都清清楚楚</div>
    <div class="list">
      <div class="row"><span class="mark">✕</span><span class="qt">它<span class="hl">为什么</span>坏了？</span></div>
      <div class="row"><span class="mark">✕</span><span class="qt">哪一处改动能<span class="hl">修好</span>它？</span></div>
      <div class="row"><span class="mark">✕</span><span class="qt">怎么保证<span class="hl">下周不再坏</span>一次？</span></div>
    </div>
  </div>
</body>
</html>
