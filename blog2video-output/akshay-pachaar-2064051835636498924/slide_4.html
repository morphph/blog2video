<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px; background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%; padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      text-align: center; position: relative;
    }
    .title { font-size: 56px; font-weight: 800; line-height: 1.25; }
    .title .em { color: #8B5CF6; }
    .concept { width: 100%; margin-top: 50px; background: #1A1A2E; border: 1px solid rgba(139,92,246,0.2);
      border-left: 4px solid #8B5CF6; border-radius: 12px; padding: 32px 28px; text-align: left; }
    .concept .term { font-size: 44px; font-weight: 800; color: #8B5CF6; }
    .concept .def { font-size: 32px; color: #B0B0CC; margin-top: 14px; line-height: 1.5; }
    .concept .def .mono { font-family: 'SF Mono','JetBrains Mono',monospace; color: #FFFFFF; }
    .list { width: 100%; margin-top: 36px; display: flex; flex-direction: column; gap: 18px; }
    .row { background: #1A1A2E; border: 1px solid rgba(139,92,246,0.2); border-left: 4px solid #EF4444;
      border-radius: 12px; padding: 24px 26px; text-align: left; }
    .row .t { font-size: 32px; line-height: 1.4; }
    .row .t .hl { color: #EF4444; font-weight: 700; }
    .punch { width: 100%; margin-top: 36px; text-align: center; }
    .punch .t { font-size: 42px; font-weight: 800; color: #F59E0B; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="title">决定 Agent 好坏的，<br>越来越<span class="em">不是模型本身</span></div>
    <div class="concept">
      <div class="term">harness</div>
      <div class="def">包在裸模型外面那层：<br><span class="mono">prompt · 工具 · 各种检查</span></div>
    </div>
    <div class="list">
      <div class="row"><div class="t">每升级一次模型，<span class="hl">多一批新失败模式</span></div></div>
      <div class="row"><div class="t">每加一个工具，<span class="hl">多一批边界情况</span></div></div>
    </div>
    <div class="punch"><div class="t">你一个人，追不上它</div></div>
  </div>
</body>
</html>
