<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px; background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%; padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      text-align: center; position: relative;
    }
    .title { font-size: 58px; font-weight: 800; line-height: 1.25; }
    .title .em { color: #10B981; }
    .loop { width: 100%; margin-top: 44px; display: flex; flex-direction: column; gap: 12px; }
    .step { display: flex; align-items: center; gap: 18px; background: #1A1A2E; border: 1px solid rgba(139,92,246,0.2);
      border-radius: 12px; padding: 22px 24px; text-align: left; }
    .step .n { width: 44px; height: 44px; border-radius: 50%; background: rgba(139,92,246,0.18); color: #8B5CF6;
      font-size: 26px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .step .t { font-size: 30px; line-height: 1.35; }
    .step .t .mono { font-family: 'SF Mono','JetBrains Mono',monospace; color: #10B981; }
    .step .t .name { color: #8B5CF6; font-weight: 700; }
    .step.gate { border-left: 4px solid #F59E0B; }
    .step.gate .n { background: rgba(245,158,11,0.18); color: #F59E0B; }
    .step.gate .t { font-weight: 700; }
    .step.gate .t .hl { color: #F59E0B; }
    .note { width: 100%; margin-top: 28px; text-align: center; }
    .note .t { font-size: 28px; color: #B0B0CC; line-height: 1.45; }
    .note .t .hl { color: #F59E0B; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="title">回路<span class="em">闭合</span>的样子</div>
    <div class="loop">
      <div class="step"><div class="n">1</div><div class="t">一行<span class="mono">装饰器</span>埋点，声明配置</div></div>
      <div class="step"><div class="n">2</div><div class="t"><span class="name">Ollie</span> 读 trace + 源码，走遍 span 树定位根因</div></div>
      <div class="step gate"><div class="n">3</div><div class="t"><span class="hl">你批准</span> —— 唯一的手动步骤</div></div>
      <div class="step"><div class="n">4</div><div class="t">用原始输入重跑，新旧 trace 并排对比</div></div>
      <div class="step"><div class="n">5</div><div class="t">通过 → 修复存下，失败锁成 <span class="mono">回归测试</span></div></div>
    </div>
    <div class="note"><div class="t">非全自动：规模化时，<span class="hl">人就是吞吐瓶颈</span>——真实取舍</div></div>
  </div>
</body>
</html>
