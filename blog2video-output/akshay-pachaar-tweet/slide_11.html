<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .slide-label {
      font-size: 24px;
      color: #8B5CF6;
      letter-spacing: 3px;
      margin-bottom: 20px;
      font-weight: 600;
    }
    .title {
      font-size: 42px;
      font-weight: 900;
      margin-bottom: 40px;
      line-height: 1.3;
    }
    .title span { color: #F59E0B; }
    .takeaways {
      display: flex;
      flex-direction: column;
      gap: 18px;
      width: 100%;
      margin-bottom: 36px;
    }
    .takeaway-item {
      display: flex;
      align-items: center;
      gap: 20px;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.15);
      border-radius: 12px;
      padding: 24px 28px;
      text-align: left;
    }
    .takeaway-item .num {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 800;
      flex-shrink: 0;
    }
    .num-purple { background: rgba(139, 92, 246, 0.12); color: #8B5CF6; }
    .num-yellow { background: rgba(245, 158, 11, 0.12); color: #F59E0B; }
    .num-green { background: rgba(16, 185, 129, 0.12); color: #10B981; }
    .takeaway-item .text-block {
      flex: 1;
    }
    .takeaway-item .question {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .takeaway-item .note {
      font-size: 22px;
      color: #B0B0CC;
    }
    .divider-line {
      width: 60px;
      height: 3px;
      background: #8B5CF6;
      border-radius: 2px;
      margin-bottom: 28px;
    }
    .reframe-box {
      background: rgba(139, 92, 246, 0.06);
      border: 2px solid rgba(139, 92, 246, 0.2);
      border-radius: 16px;
      padding: 28px 36px;
      width: 100%;
      margin-bottom: 28px;
    }
    .reframe-box .headline {
      font-size: 32px;
      font-weight: 800;
      color: #8B5CF6;
      margin-bottom: 8px;
    }
    .reframe-box .sub {
      font-size: 26px;
      color: #B0B0CC;
    }
    .signature {
      font-size: 24px;
      color: #6B7280;
    }
    .signature span {
      color: #8B5CF6;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="slide-label">TAKEAWAY</div>
    <div class="title">选框架就是做<span>七个架构赌注</span></div>
    <div class="takeaways">
      <div class="takeaway-item">
        <div class="num num-purple">1</div>
        <div class="text-block">
          <div class="question">你对模型的信任度是多少？</div>
          <div class="note">信任高&rarr;thin harness，容错低&rarr;thick harness</div>
        </div>
      </div>
      <div class="takeaway-item">
        <div class="num num-yellow">2</div>
        <div class="text-block">
          <div class="question">Harness架构有保质期</div>
          <div class="note">模型升级，旧脚手架变技术债</div>
        </div>
      </div>
      <div class="takeaway-item">
        <div class="num num-green">3</div>
        <div class="text-block">
          <div class="question">工具范围控制是最大杠杆</div>
          <div class="note">80%冗余消除，最低成本性能优化</div>
        </div>
      </div>
    </div>
    <div class="divider-line"></div>
    <div class="reframe-box">
      <div class="headline">你以为在选模型</div>
      <div class="sub">其实在选操作系统</div>
    </div>
    <div class="signature"><span>精读AI</span> &middot; 精读一篇，胜过刷一百条</div>
  </div>
</body>
</html>
