<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .slide-label {
      font-size: 24px;
      color: #8B5CF6;
      letter-spacing: 3px;
      margin-bottom: 44px;
      font-weight: 600;
    }
    .loop-container {
      display: flex;
      flex-direction: column;
      gap: 0;
      width: 100%;
      align-items: center;
    }
    .step {
      display: flex;
      align-items: center;
      gap: 20px;
      width: 680px;
    }
    .step-number {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(139, 92, 246, 0.15);
      border: 2px solid #8B5CF6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 800;
      color: #8B5CF6;
      flex-shrink: 0;
    }
    .step-content {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.15);
      border-radius: 12px;
      padding: 16px 24px;
      flex: 1;
      text-align: left;
    }
    .step-title {
      font-size: 26px;
      font-weight: 700;
    }
    .step-desc {
      font-size: 20px;
      color: #B0B0CC;
      margin-top: 2px;
    }
    .step-connector {
      width: 2px;
      height: 16px;
      background: rgba(139, 92, 246, 0.3);
      margin-left: 25px;
    }
    .branch-box {
      margin-top: 20px;
      background: rgba(245, 158, 11, 0.08);
      border: 2px solid rgba(245, 158, 11, 0.3);
      border-radius: 12px;
      padding: 20px 28px;
      width: 680px;
    }
    .branch-title {
      font-size: 24px;
      font-weight: 700;
      color: #F59E0B;
      margin-bottom: 10px;
    }
    .branch-options {
      display: flex;
      gap: 24px;
      justify-content: center;
    }
    .branch-opt {
      font-size: 22px;
      padding: 8px 20px;
      border-radius: 8px;
    }
    .branch-opt.end { background: rgba(16, 185, 129, 0.12); color: #10B981; }
    .branch-opt.cont { background: rgba(59, 130, 246, 0.12); color: #3B82F6; }
    .step.highlight .step-number {
      background: rgba(245, 158, 11, 0.15);
      border-color: #F59E0B;
      color: #F59E0B;
    }
    .step.highlight .step-content {
      border-color: rgba(245, 158, 11, 0.3);
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="slide-label">AGENT LOOP &middot; 7 步</div>
    <div class="loop-container">
      <div class="step">
        <div class="step-number">1</div>
        <div class="step-content">
          <div class="step-title">Prompt 组装</div>
        </div>
      </div>
      <div class="step-connector"></div>
      <div class="step">
        <div class="step-number">2</div>
        <div class="step-content">
          <div class="step-title">模型推理</div>
        </div>
      </div>
      <div class="step-connector"></div>
      <div class="step highlight">
        <div class="step-number">3</div>
        <div class="step-content">
          <div class="step-title" style="color: #F59E0B;">输出分类</div>
          <div class="step-desc">关键分支点</div>
        </div>
      </div>
      <div class="step-connector"></div>
      <div class="step">
        <div class="step-number">4</div>
        <div class="step-content">
          <div class="step-title">工具执行</div>
        </div>
      </div>
      <div class="step-connector"></div>
      <div class="step">
        <div class="step-number">5</div>
        <div class="step-content">
          <div class="step-title">结果打包</div>
        </div>
      </div>
      <div class="step-connector"></div>
      <div class="step">
        <div class="step-number">6</div>
        <div class="step-content">
          <div class="step-title">上下文更新</div>
        </div>
      </div>
      <div class="step-connector"></div>
      <div class="step">
        <div class="step-number">7</div>
        <div class="step-content">
          <div class="step-title">回到第 1 步 &olarr;</div>
        </div>
      </div>
    </div>
    <div class="branch-box">
      <div class="branch-title">第 3 步决定循环走向</div>
      <div class="branch-options">
        <div class="branch-opt end">&check; 最终答案 &rarr; 结束</div>
        <div class="branch-opt cont">&oplus; 工具调用 &rarr; 继续</div>
      </div>
    </div>
  </div>
</body>
</html>
