<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .slide-label {
      font-size: 24px;
      color: #8B5CF6;
      letter-spacing: 3px;
      margin-bottom: 20px;
      font-weight: 600;
    }
    .title {
      font-size: 46px;
      font-weight: 900;
      margin-bottom: 44px;
      line-height: 1.3;
    }
    .content-row {
      display: flex;
      gap: 24px;
      width: 100%;
      align-items: stretch;
      margin-bottom: 28px;
    }
    .left-card {
      flex: 1;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-left: 4px solid #8B5CF6;
      border-radius: 0 12px 12px 0;
      padding: 28px 24px;
      text-align: left;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .left-card .icon {
      font-size: 44px;
      margin-bottom: 14px;
    }
    .left-card .card-title {
      font-size: 28px;
      font-weight: 800;
      color: #8B5CF6;
      margin-bottom: 10px;
    }
    .left-card .card-body {
      font-size: 22px;
      color: #B0B0CC;
      line-height: 1.5;
    }
    .right-items {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .right-item {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.12);
      border-radius: 12px;
      padding: 20px 22px;
      text-align: left;
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }
    .right-item .item-icon {
      font-size: 28px;
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon-yellow { background: rgba(245, 158, 11, 0.12); }
    .icon-red { background: rgba(239, 68, 68, 0.12); }
    .right-item .item-title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .right-item .item-desc {
      font-size: 20px;
      color: #B0B0CC;
    }
    .bottom-card {
      background: rgba(139, 92, 246, 0.06);
      border: 2px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 22px 28px;
      width: 100%;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .bottom-card .bc-icon {
      font-size: 32px;
    }
    .bottom-card .bc-text {
      text-align: left;
    }
    .bottom-card .bc-title {
      font-size: 24px;
      font-weight: 700;
      color: #8B5CF6;
    }
    .bottom-card .bc-body {
      font-size: 20px;
      color: #B0B0CC;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="slide-label">AGENT LOOP</div>
    <div class="title">为什么要把错误喂回模型？</div>
    <div class="content-row">
      <div class="left-card">
        <div class="icon">🔄</div>
        <div class="card-title">错误回传机制</div>
        <div class="card-body">工具执行的报错原样喂回模型，不吞掉、不过滤</div>
      </div>
      <div class="right-items">
        <div class="right-item">
          <div class="item-icon icon-yellow">🧠</div>
          <div>
            <div class="item-title">纠错来自看到失败</div>
            <div class="item-desc">吞掉错误=剥夺自我修正</div>
          </div>
        </div>
        <div class="right-item">
          <div class="item-icon icon-red">🛑</div>
          <div>
            <div class="item-title">四道退出条件</div>
            <div class="item-desc">轮次/Token/护栏/中断</div>
          </div>
        </div>
        <div class="right-item">
          <div class="item-icon icon-red">♾️</div>
          <div>
            <div class="item-title">无限循环风险</div>
            <div class="item-desc">缺少退出条件永不停止</div>
          </div>
        </div>
      </div>
    </div>
    <div class="bottom-card">
      <div class="bc-icon">⚙️</div>
      <div class="bc-text">
        <div class="bc-title">机械简单，每步复杂</div>
        <div class="bc-body">一张图画完，但每步背后是大量工程细节</div>
      </div>
    </div>
  </div>
</body>
</html>
