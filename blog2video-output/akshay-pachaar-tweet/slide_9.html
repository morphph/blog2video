<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .slide-label {
      font-size: 24px;
      color: #F59E0B;
      letter-spacing: 3px;
      margin-bottom: 20px;
      font-weight: 600;
    }
    .title {
      font-size: 44px;
      font-weight: 900;
      margin-bottom: 44px;
      line-height: 1.3;
    }
    .title span { color: #F59E0B; }
    .versus-box {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.15);
      border-radius: 16px;
      padding: 32px;
      margin-bottom: 28px;
    }
    .versus-header {
      font-size: 28px;
      font-weight: 800;
      color: #F59E0B;
      margin-bottom: 24px;
    }
    .versus-row {
      display: flex;
      gap: 20px;
      align-items: stretch;
    }
    .versus-side {
      flex: 1;
      border-radius: 12px;
      padding: 24px 20px;
      text-align: center;
    }
    .versus-side.left {
      background: rgba(59, 130, 246, 0.06);
      border: 2px solid rgba(59, 130, 246, 0.25);
    }
    .versus-side.right {
      background: rgba(16, 185, 129, 0.06);
      border: 2px solid rgba(16, 185, 129, 0.25);
    }
    .versus-side .name {
      font-size: 30px;
      font-weight: 800;
      margin-bottom: 10px;
    }
    .versus-side.left .name { color: #3B82F6; }
    .versus-side.right .name { color: #10B981; }
    .versus-side .desc {
      font-size: 22px;
      color: #B0B0CC;
      line-height: 1.4;
    }
    .versus-side .stat {
      font-size: 20px;
      margin-top: 10px;
      font-weight: 600;
    }
    .versus-side.left .stat { color: #3B82F6; }
    .versus-side.right .stat { color: #10B981; }
    .vs-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 900;
      color: #6B7280;
    }
    .key-question {
      background: rgba(245, 158, 11, 0.06);
      border: 2px solid rgba(245, 158, 11, 0.2);
      border-radius: 12px;
      padding: 24px 32px;
      width: 100%;
    }
    .key-question .line {
      font-size: 26px;
      color: #F59E0B;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="slide-label">KEY DECISION #1</div>
    <div class="title">推理策略：<span>ReAct vs Plan</span></div>
    <div class="versus-box">
      <div class="versus-header">张力最大的取舍</div>
      <div class="versus-row">
        <div class="versus-side left">
          <div class="name">ReAct</div>
          <div class="desc">每步都能临时调整<br>灵活但 Token 开销大</div>
          <div class="stat">灵活性优先</div>
        </div>
        <div class="vs-divider">VS</div>
        <div class="versus-side right">
          <div class="name">Plan-and-Execute</div>
          <div class="desc">先制定计划再执行<br>适应性差但效率高</div>
          <div class="stat">快 3.6x</div>
        </div>
      </div>
    </div>
    <div class="key-question">
      <div class="line">不是"哪个更好"，是"你的任务有多确定"</div>
    </div>
  </div>
</body>
</html>
