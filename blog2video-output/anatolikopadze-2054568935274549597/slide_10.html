<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1920px; background:#0D0D1A;
    font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;
    color:#FFFFFF; overflow:hidden; }
  .slide { width:100%; height:100%; padding:200px 72px 420px 72px;
    display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; }
  .kicker { font-size:28px; color:#8B5CF6; letter-spacing:3px; font-weight:600; margin-bottom:50px; }
  .quote-mark { font-size:140px; color:#8B5CF6; line-height:0.6; font-family:Georgia,serif; opacity:0.85; margin-bottom:24px; }
  .reveal { font-size:54px; font-weight:900; line-height:1.3; margin-bottom:24px; }
  .reveal .amber { color:#F59E0B; }
  .name-en { font-family:'SF Mono','Monaco',monospace; font-size:38px; font-weight:800; color:#F59E0B; margin-bottom:48px; }
  .insight { width:100%; background:#1A1A2E; border:1px solid rgba(139,92,246,0.25);
    border-left:4px solid #8B5CF6; border-radius:12px; padding:28px;
    font-size:24px; line-height:1.55; text-align:left; }
  .insight strong { color:#F59E0B; }
</style>
</head>
<body>
  <div class="slide">
    <div class="kicker">所有技巧的隐藏共同点</div>
    <div class="quote-mark">"</div>
    <div class="reveal">都是同<span class="amber">一件事</span></div>
    <div class="name-en">Context Engineering</div>
    <div class="insight">Claude 不比你聪明，没有比你更好的想法——它有<strong>无限耐心和你没想过的角度</strong>。前提是你得让它<strong>理解你</strong>。</div>
  </div>
</body>
</html>
