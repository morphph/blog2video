<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1920px; background:#0D0D1A;
    font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;
    color:#FFFFFF; overflow:hidden; }
  .slide { width:100%; height:100%; padding:200px 72px 420px 72px;
    display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; }
  .kicker { font-size:28px; color:#8B5CF6; letter-spacing:3px; font-weight:600; margin-bottom:36px; }
  .num { font-size:160px; font-weight:800; color:#10B981; line-height:1; margin-bottom:20px; }
  .num-lab { font-size:30px; color:#B0B0CC; margin-bottom:40px; }
  .title { font-size:48px; font-weight:900; line-height:1.3; margin-bottom:36px; }
  .title .green { color:#10B981; }
  .rule { width:100%; background:#0D0D1A; border:2px solid rgba(16,185,129,0.5); border-radius:12px;
    padding:24px 28px; font-family:'SF Mono','Monaco',monospace; font-size:22px;
    color:#10B981; line-height:1.5; margin-bottom:24px; }
  .anchor { width:100%; background:linear-gradient(135deg,#1A1A2E,#2A1A3A);
    border:1px solid rgba(139,92,246,0.4); border-radius:12px; padding:24px;
    font-size:26px; font-weight:800; line-height:1.45; }
  .anchor .amber { color:#F59E0B; }
</style>
</head>
<body>
  <div class="slide">
    <div class="kicker">今天就做一件事</div>
    <div class="num">30s</div>
    <div class="num-lab">打开 Project → 写一行规则</div>
    <div class="title">永久换掉你和<br>Claude 的<span class="green">工作方式</span></div>
    <div class="rule">// Custom Instructions<br>Never preamble. Never restate.<br>Go directly to the answer.</div>
    <div class="anchor">设一次 · <span class="amber">每次会话都在收回报</span></div>
  </div>
</body>
</html>
