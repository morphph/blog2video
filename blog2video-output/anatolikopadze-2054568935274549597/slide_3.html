<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1920px; background:#0D0D1A;
    font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;
    color:#FFFFFF; overflow:hidden; }
  .slide { width:100%; height:100%; padding:200px 72px 420px 72px;
    display:flex; flex-direction:column; justify-content:center; align-items:center; }
  .kicker { font-size:28px; color:#8B5CF6; letter-spacing:3px; font-weight:600; margin-bottom:28px; }
  .title { font-size:60px; font-weight:900; line-height:1.3; margin-bottom:32px; text-align:center; }
  .title .red { color:#EF4444; }
  .big-num { width:100%; background:#1A1A2E; border:1px solid rgba(239,68,68,0.4);
    border-left:4px solid #EF4444; border-radius:12px; padding:28px; margin-bottom:24px; text-align:center; }
  .big-val { font-size:120px; font-weight:800; color:#EF4444; line-height:1; margin-bottom:8px; }
  .big-lab { font-size:22px; color:#B0B0CC; }
  .pair { width:100%; display:flex; gap:16px; }
  .ex { flex:1; background:#0D0D1A; border:1px solid rgba(139,92,246,0.3);
    border-radius:12px; padding:22px; font-family:'SF Mono','Monaco',monospace; font-size:20px; line-height:1.45; }
  .bad { border-left:4px solid #EF4444; color:#B0B0CC; }
  .bad .tag { color:#EF4444; font-weight:800; letter-spacing:2px; margin-bottom:10px; font-family:-apple-system,sans-serif; font-size:18px; }
  .good { border-left:4px solid #10B981; }
  .good .tag { color:#10B981; font-weight:800; letter-spacing:2px; margin-bottom:10px; font-family:-apple-system,sans-serif; font-size:18px; }
  .good .body { color:#FFFFFF; }
</style>
</head>
<body>
  <div class="slide">
    <div class="kicker">第 1 个反转</div>
    <div class="title">Claude 不是<br><span class="red">搜索引擎</span></div>
    <div class="big-num">
      <div class="big-val">−80%</div>
      <div class="big-lab">把它当搜索引擎用 · 价值瞬间砍掉</div>
    </div>
    <div class="pair">
      <div class="ex bad">
        <div class="tag">SEARCH-MODE</div>
        <div class="body">"什么是 prompt caching?"</div>
      </div>
      <div class="ex good">
        <div class="tag">THINKING-MODE</div>
        <div class="body">"每次会话调 20 次 · 在我场景里能省钱吗?"</div>
      </div>
    </div>
  </div>
</body>
</html>
