<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1920px; background:#0D0D1A;
    font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;
    color:#FFFFFF; overflow:hidden; }
  .slide { width:100%; height:100%; padding:200px 72px 420px 72px;
    display:flex; flex-direction:column; justify-content:center; align-items:center; }
  .kicker { font-size:28px; color:#8B5CF6; letter-spacing:3px; font-weight:600; margin-bottom:32px; }
  .title { font-size:62px; font-weight:900; line-height:1.3; margin-bottom:48px; text-align:center; }
  .title .amber { color:#F59E0B; }
  .pipeline { width:100%; background:#1A1A2E; border:1px solid rgba(139,92,246,0.25);
    border-left:4px solid #8B5CF6; border-radius:12px; padding:36px 32px; margin-bottom:28px; }
  .steps { display:flex; flex-direction:column; gap:16px; }
  .step { display:flex; align-items:center; gap:18px; font-size:26px; font-weight:700; }
  .step-num { width:56px; height:56px; border-radius:50%; background:#8B5CF6; color:#FFFFFF;
    display:flex; align-items:center; justify-content:center; font-size:28px; font-weight:800; flex-shrink:0; }
  .step .arrow { width:56px; text-align:center; color:#8B5CF6; font-size:32px; }
  .meta { width:100%; background:linear-gradient(135deg,#1A1A2E,#2A1A3A);
    border:1px solid rgba(139,92,246,0.4); border-radius:12px; padding:24px;
    text-align:center; font-size:26px; font-weight:700; }
  .meta strong { color:#F59E0B; }
</style>
</head>
<body>
  <div class="slide">
    <div class="kicker">第 3 个反转 · 元知识</div>
    <div class="title">让 Claude<br><span class="amber">帮你写 prompt</span></div>
    <div class="pipeline">
      <div class="steps">
        <div class="step"><div class="step-num">1</div>给它任务描述</div>
        <div class="step"><div class="arrow">↓</div>它生成包含角色+上下文+格式+约束的 prompt</div>
        <div class="step"><div class="step-num">2</div>立刻执行那个 prompt</div>
      </div>
    </div>
    <div class="meta">用 AI <strong>优化你怎么用 AI</strong></div>
  </div>
</body>
</html>
