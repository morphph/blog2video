<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1920px; background:#0D0D1A;
    font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;
    color:#FFFFFF; overflow:hidden; }
  .slide { width:100%; height:100%; padding:200px 72px 420px 72px;
    display:flex; flex-direction:column; justify-content:center; align-items:center; }
  .kicker { font-size:28px; color:#8B5CF6; letter-spacing:3px; font-weight:600; margin-bottom:28px; }
  .title { font-size:56px; font-weight:900; line-height:1.3; margin-bottom:32px; text-align:center; }
  .title .red { color:#EF4444; }
  .junk { width:100%; background:#1A1A2E; border:1px solid rgba(239,68,68,0.4);
    border-left:4px solid #EF4444; border-radius:12px; padding:24px 28px; margin-bottom:24px; }
  .junk-tag { font-size:22px; color:#EF4444; font-weight:800; letter-spacing:2px; margin-bottom:14px; }
  .junk-list { display:flex; flex-direction:column; gap:10px; }
  .ji { font-size:22px; color:#B0B0CC; padding:8px 14px; background:#0D0D1A; border-radius:6px;
    text-decoration:line-through; }
  .rule { width:100%; background:#0D0D1A; border:2px solid rgba(16,185,129,0.5);
    border-radius:12px; padding:24px 28px; margin-bottom:20px; font-family:'SF Mono','Monaco',monospace;
    font-size:22px; color:#10B981; line-height:1.5; }
  .anchor { width:100%; background:linear-gradient(135deg,#1A1A2E,#2A1A3A);
    border:1px solid rgba(16,185,129,0.4); border-radius:12px; padding:22px; text-align:center; font-size:26px; font-weight:800; }
  .anchor .green { color:#10B981; }
</style>
</head>
<body>
  <div class="slide">
    <div class="kicker">第 4 个反转</div>
    <div class="title">删掉那一堆<br><span class="red">没人要的开场白</span></div>
    <div class="junk">
      <div class="junk-tag">EVERY RESPONSE 默认烧 token</div>
      <div class="junk-list">
        <div class="ji">"好问题，让我帮你分解一下"</div>
        <div class="ji">复述你刚才说的话</div>
        <div class="ji">一段免责声明 / 结尾再总结一遍</div>
      </div>
    </div>
    <div class="rule">// Custom Instructions<br>Never preamble / affirmations / restatements.<br>Go directly to the answer.</div>
    <div class="anchor">写一次 · <span class="green">终身受益</span></div>
  </div>
</body>
</html>
