<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1920px; background:#0D0D1A;
    font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;
    color:#FFFFFF; overflow:hidden; }
  .slide { width:100%; height:100%; padding:200px 72px 420px 72px;
    display:flex; flex-direction:column; justify-content:center; align-items:center; }
  .kicker { font-size:28px; color:#8B5CF6; letter-spacing:3px; font-weight:600; margin-bottom:36px; }
  .title { font-size:62px; font-weight:900; line-height:1.3; margin-bottom:36px; text-align:center; }
  .title .amber { color:#F59E0B; }
  .num { width:100%; background:#1A1A2E; border:1px solid rgba(245,158,11,0.4);
    border-left:4px solid #F59E0B; border-radius:12px; padding:32px; margin-bottom:28px; text-align:center; }
  .num-val { font-size:120px; font-weight:800; color:#F59E0B; line-height:1; margin-bottom:8px; }
  .num-lab { font-size:24px; color:#B0B0CC; }
  .prompt { width:100%; background:#0D0D1A; border:2px solid rgba(245,158,11,0.6);
    border-radius:12px; padding:24px 28px; margin-bottom:24px; font-family:'SF Mono','Monaco',monospace;
    font-size:30px; color:#FFFFFF; font-weight:700; text-align:center; }
  .key { width:100%; background:linear-gradient(135deg,#1A1A2E,#2A1A3A);
    border:1px solid rgba(139,92,246,0.4); border-radius:12px; padding:24px;
    text-align:center; font-size:24px; line-height:1.5; }
  .key strong { color:#F59E0B; }
</style>
</head>
<body>
  <div class="slide">
    <div class="kicker">第 5 个反转</div>
    <div class="title">指定输出长度<br><span class="amber">两端同时优化</span></div>
    <div class="num">
      <div class="num-val">−40~60%</div>
      <div class="num-lab">token 消耗 · 价值一点没少</div>
    </div>
    <div class="prompt">"用 3 句话回答，最多。"</div>
    <div class="key">省的不只是钱 —— 是你的<strong>注意力</strong>。读不完的部分本身就是噪声</div>
  </div>
</body>
</html>
