<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1920px; background:#0D0D1A;
    font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;
    color:#FFFFFF; overflow:hidden; }
  .slide { width:100%; height:100%; padding:200px 72px 420px 72px;
    display:flex; flex-direction:column; justify-content:center; align-items:center; }
  .kicker { font-size:28px; color:#8B5CF6; letter-spacing:3px; font-weight:600; margin-bottom:28px; }
  .title { font-size:54px; font-weight:900; line-height:1.3; margin-bottom:36px; text-align:center; }
  .title .red { color:#EF4444; }
  .pair { display:flex; gap:18px; width:100%; margin-bottom:24px; }
  .card { flex:1; background:#1A1A2E; border:1px solid rgba(139,92,246,0.25); border-radius:12px; padding:28px 24px; }
  .spar { border-left:4px solid #EF4444; }
  .think { border-left:4px solid #10B981; }
  .name { font-size:30px; font-weight:800; margin-bottom:10px; }
  .spar .name { color:#EF4444; }
  .think .name { color:#10B981; }
  .when { font-size:18px; color:#B0B0CC; font-weight:600; letter-spacing:1px; margin-bottom:18px; }
  .verb { font-size:24px; font-weight:700; line-height:1.45; color:#FFFFFF; margin-bottom:14px; }
  .mood { font-size:20px; color:#B0B0CC; line-height:1.5; }
  .warning { width:100%; background:linear-gradient(135deg,#2A1A1A,#2A1A3A);
    border:1px solid rgba(239,68,68,0.4); border-radius:12px; padding:22px; text-align:center; font-size:24px; line-height:1.45; }
  .warning .red { color:#EF4444; font-weight:800; }
</style>
</head>
<body>
  <div class="slide">
    <div class="kicker">两个看起来很像 · 用错会出问题</div>
    <div class="title">Sparring <span class="red">≠</span> Thinking</div>
    <div class="pair">
      <div class="card spar">
        <div class="name">Sparring Partner</div>
        <div class="when">信心很足 · 要拍板了</div>
        <div class="verb">攻击（不是 critique）</div>
        <div class="mood">"不要客气、不要加限定，就攻击"</div>
      </div>
      <div class="card think">
        <div class="name">Thinking Partner</div>
        <div class="when">迷茫期 · 刚开始想</div>
        <div class="verb">先提问、先反馈听到了什么</div>
        <div class="mood">陪你把问题想清楚</div>
      </div>
    </div>
    <div class="warning">脆弱期叫 <span class="red">sparring partner</span> 上来 = 不是被打醒，是被打垮</div>
  </div>
</body>
</html>
