<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1920px; background:#0D0D1A;
    font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;
    color:#FFFFFF; overflow:hidden; }
  .slide { width:100%; height:100%; padding:200px 72px 420px 72px;
    display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; }
  .kicker { font-size:28px; color:#8B5CF6; letter-spacing:3px; font-weight:600; margin-bottom:50px; }
  .quote-mark { font-size:140px; color:#8B5CF6; line-height:0.6; font-family:Georgia,serif; opacity:0.85; margin-bottom:24px; }
  .quote { font-size:56px; font-weight:900; line-height:1.3; margin-bottom:40px; }
  .quote .red { color:#EF4444; }
  .quote .amber { color:#F59E0B; }
  .vs { width:100%; display:flex; gap:18px; margin-bottom:28px; }
  .vs-card { flex:1; background:#1A1A2E; border:1px solid rgba(139,92,246,0.25); border-radius:12px; padding:24px;
    font-size:24px; font-weight:700; }
  .vs-label { font-size:20px; color:#B0B0CC; font-weight:600; margin-bottom:10px; letter-spacing:2px; }
  .cap { border-left:4px solid #B0B0CC; color:#B0B0CC; }
  .conf { border-left:4px solid #F59E0B; }
  .conf .value { color:#F59E0B; }
</style>
</head>
<body>
  <div class="slide">
    <div class="kicker">这篇文章真正的主题</div>
    <div class="quote-mark">"</div>
    <div class="quote">能力差距不是瓶颈<br><span class="amber">配置差距</span>才是</div>
    <div class="vs">
      <div class="vs-card cap">
        <div class="vs-label">能力上限</div>
        <div>工程师写出来的</div>
      </div>
      <div class="vs-card conf">
        <div class="vs-label">实际能力</div>
        <div class="value">你开了几个开关</div>
      </div>
    </div>
  </div>
</body>
</html>
