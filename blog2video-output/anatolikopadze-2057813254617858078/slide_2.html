<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1920px; background:#0D0D1A;
    font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;
    color:#FFFFFF; overflow:hidden; }
  .slide { width:100%; height:100%; padding:200px 72px 420px 72px;
    display:flex; flex-direction:column; justify-content:center; align-items:center; }
  .kicker { font-size:28px; color:#8B5CF6; letter-spacing:3px; font-weight:600; margin-bottom:28px; }
  .title { font-size:62px; font-weight:900; line-height:1.3; margin-bottom:40px; text-align:center; }
  .title .amber { color:#F59E0B; }
  .ratio { width:100%; background:#1A1A2E; border:1px solid rgba(139,92,246,0.25);
    border-left:4px solid #F59E0B; border-radius:12px; padding:32px; margin-bottom:24px; text-align:center; }
  .ratio-num { font-size:96px; font-weight:800; color:#F59E0B; line-height:1; margin-bottom:14px; }
  .ratio-label { font-size:24px; color:#B0B0CC; }
  .meaning { width:100%; display:flex; gap:16px; margin-bottom:24px; }
  .m { flex:1; background:#1A1A2E; border:1px solid rgba(139,92,246,0.25);
    border-radius:12px; padding:24px 20px; text-align:center; }
  .m-tag { font-size:22px; font-weight:800; letter-spacing:2px; margin-bottom:10px; }
  .like { border-left:4px solid #10B981; }
  .like .m-tag { color:#10B981; }
  .save { border-left:4px solid #EF4444; }
  .save .m-tag { color:#EF4444; }
  .m-text { font-size:24px; color:#FFFFFF; line-height:1.4; }
  .punch { width:100%; background:linear-gradient(135deg,#1A1A2E,#2A1A3A);
    border:1px solid rgba(139,92,246,0.4); border-radius:12px; padding:24px 28px;
    font-size:26px; line-height:1.5; text-align:center; }
  .punch strong { color:#F59E0B; }
</style>
</head>
<body>
  <div class="slide">
    <div class="kicker">收藏 / 点赞 = 这是控诉，不是文章</div>
    <div class="title">高收藏 低点赞<br>= <span class="amber">待办清单</span></div>
    <div class="ratio">
      <div class="ratio-num">4.8×</div>
      <div class="ratio-label">收藏比点赞高近 5 倍</div>
    </div>
    <div class="meaning">
      <div class="m like"><div class="m-tag">LIKE</div><div class="m-text">"我喜欢"</div></div>
      <div class="m save"><div class="m-tag">SAVE</div><div class="m-text">"我以后要做"</div></div>
    </div>
    <div class="punch">每节都在重复同一句：<br><strong>"大多数人没开"</strong></div>
  </div>
</body>
</html>
