<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1920px; background:#0D0D1A;
    font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;
    color:#FFFFFF; overflow:hidden; }
  .slide { width:100%; height:100%; padding:200px 72px 420px 72px;
    display:flex; flex-direction:column; justify-content:center; align-items:center; }
  .kicker { font-size:28px; color:#8B5CF6; letter-spacing:3px; font-weight:600; margin-bottom:28px; }
  .title { font-size:60px; font-weight:900; line-height:1.3; margin-bottom:40px; text-align:center; }
  .title .amber { color:#F59E0B; }
  .features { width:100%; display:flex; flex-direction:column; gap:16px; }
  .f { background:#1A1A2E; border:1px solid rgba(139,92,246,0.25); border-radius:12px; padding:24px 28px; }
  .projects { border-left:4px solid #8B5CF6; }
  .artifacts { border-left:4px solid #10B981; }
  .memory { border-left:4px solid #F59E0B; }
  .f-head { display:flex; align-items:baseline; gap:14px; margin-bottom:10px; }
  .f-name { font-size:32px; font-weight:800; }
  .projects .f-name { color:#8B5CF6; }
  .artifacts .f-name { color:#10B981; }
  .memory .f-name { color:#F59E0B; }
  .f-state { font-size:20px; color:#EF4444; font-weight:700; letter-spacing:1px; }
  .f-desc { font-size:23px; color:#B0B0CC; line-height:1.5; }
  .f-desc strong { color:#FFFFFF; }
</style>
</head>
<body>
  <div class="slide">
    <div class="kicker">认知层面的反差</div>
    <div class="title">你以为做不到的<br>它<span class="amber">早就会</span></div>
    <div class="features">
      <div class="f projects">
        <div class="f-head"><div class="f-name">Projects</div><div class="f-state">· 大多数人没建</div></div>
        <div class="f-desc">建一个 project，传文档+写 instructions —— <strong>背景知识不用再讲</strong></div>
      </div>
      <div class="f artifacts">
        <div class="f-head"><div class="f-name">Artifacts</div><div class="f-state">· 免费版就能用</div></div>
        <div class="f-desc">小网页/互动图表/流程图 —— 对话边上<strong>直接渲染能跑的真东西</strong></div>
      </div>
      <div class="f memory">
        <div class="f-head"><div class="f-name">Memory</div><div class="f-state">· 默认是关的</div></div>
        <div class="f-desc">跨 project 人物画像 —— 新 chat 它<strong>已经知道你是谁</strong></div>
      </div>
    </div>
  </div>
</body>
</html>
