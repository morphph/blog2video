<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1920px; background:#0D0D1A;
    font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;
    color:#FFFFFF; overflow:hidden; }
  .slide { width:100%; height:100%; padding:200px 72px 420px 72px;
    display:flex; flex-direction:column; justify-content:center; align-items:center; }
  .kicker { font-size:28px; color:#8B5CF6; letter-spacing:3px; font-weight:600; margin-bottom:32px; }
  .title { font-size:64px; font-weight:900; line-height:1.3; margin-bottom:48px; text-align:center; }
  .title .amber { color:#F59E0B; }
  .name-tag { width:100%; background:#1A1A2E; border:1px solid rgba(139,92,246,0.25);
    border-left:4px solid #8B5CF6; border-radius:12px; padding:24px 28px; margin-bottom:24px; }
  .name { font-size:36px; font-weight:800; color:#8B5CF6; margin-bottom:8px; }
  .desc { font-size:22px; color:#B0B0CC; }
  .test { width:100%; background:linear-gradient(135deg,#1A1A2E,#2A1A3A);
    border:1px solid rgba(245,158,11,0.4); border-radius:12px; padding:32px; text-align:center; }
  .test-label { font-size:22px; color:#F59E0B; font-weight:800; letter-spacing:2px; margin-bottom:20px; }
  .test-prompt { font-size:28px; color:#FFFFFF; font-weight:700; margin-bottom:24px; line-height:1.4; }
  .test-actions { display:flex; gap:20px; }
  .test-action { flex:1; background:#0D0D1A; border:1px solid rgba(139,92,246,0.3); border-radius:10px; padding:18px;
    font-size:24px; font-weight:700; }
  .on { color:#10B981; }
  .off { color:#EF4444; }
</style>
</head>
<body>
  <div class="slide">
    <div class="kicker">第 3 个开关 · 大多数人没开</div>
    <div class="title">Adaptive Thinking<br><span class="amber">扩展思考模式</span></div>
    <div class="name-tag">
      <div class="name">让你看到 Claude 的推理过程</div>
      <div class="desc">权衡题/判断题 上 —— 简单问题不用</div>
    </div>
    <div class="test">
      <div class="test-label">这周可以做的测试</div>
      <div class="test-prompt">同一个难选题<br>问两遍</div>
      <div class="test-actions">
        <div class="test-action on">开 thinking · ON</div>
        <div class="test-action off">关 thinking · OFF</div>
      </div>
    </div>
  </div>
</body>
</html>
