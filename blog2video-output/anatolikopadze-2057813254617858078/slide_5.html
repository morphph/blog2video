<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1920px; background:#0D0D1A;
    font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;
    color:#FFFFFF; overflow:hidden; }
  .slide { width:100%; height:100%; padding:200px 72px 420px 72px;
    display:flex; flex-direction:column; justify-content:center; align-items:center; }
  .kicker { font-size:28px; color:#8B5CF6; letter-spacing:3px; font-weight:600; margin-bottom:28px; }
  .title { font-size:58px; font-weight:900; line-height:1.3; margin-bottom:36px; text-align:center; }
  .title .red { color:#EF4444; }
  .roles { width:100%; display:flex; flex-direction:column; gap:14px; margin-bottom:24px; }
  .role { background:#1A1A2E; border:1px solid rgba(139,92,246,0.25); border-left:4px solid #EF4444;
    border-radius:12px; padding:20px 24px; display:flex; align-items:center; gap:18px; }
  .role-name { font-size:24px; font-weight:800; color:#EF4444; min-width:200px; }
  .role-effect { font-size:22px; color:#B0B0CC; line-height:1.4; }
  .role-effect strong { color:#FFFFFF; }
  .verdict { width:100%; background:linear-gradient(135deg,#1A1A2E,#2A1A3A);
    border:1px solid rgba(245,158,11,0.4); border-radius:12px; padding:28px 32px; text-align:center; }
  .verdict-text { font-size:28px; font-weight:800; line-height:1.45; }
  .verdict-text .amber { color:#F59E0B; }
  .verdict-text .red { color:#EF4444; }
  .verdict-sub { font-size:22px; color:#B0B0CC; margin-top:12px; }
</style>
</head>
<body>
  <div class="slide">
    <div class="kicker">输出层面的反差</div>
    <div class="title">给 Claude 一个<br><span class="red">具体的角色</span></div>
    <div class="roles">
      <div class="role"><div class="role-name">毒舌导师</div><div class="role-effect">建过又失败过的老板 · <strong>挑你的漏洞</strong></div></div>
      <div class="role"><div class="role-name">魔鬼代言人</div><div class="role-effect">三条最现实的失败路径 · <strong>只攻击你</strong></div></div>
      <div class="role"><div class="role-name">难对话陪练</div><div class="role-effect">扮演对方 · <strong>你弱的话它会反驳</strong></div></div>
    </div>
    <div class="verdict">
      <div class="verdict-text">换模型？回答没变化<br>挂 system prompt？<span class="red">立刻翻脸</span></div>
      <div class="verdict-sub">这一代 Claude 的 <span class="amber" style="color:#F59E0B;font-weight:800;">90% 能力</span>，被默认软人格挡住</div>
    </div>
  </div>
</body>
</html>
