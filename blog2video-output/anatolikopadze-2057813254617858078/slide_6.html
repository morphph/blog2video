<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1920px; background:#0D0D1A;
    font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;
    color:#FFFFFF; overflow:hidden; }
  .slide { width:100%; height:100%; padding:200px 72px 420px 72px;
    display:flex; flex-direction:column; justify-content:center; align-items:center; }
  .kicker { font-size:28px; color:#8B5CF6; letter-spacing:3px; font-weight:600; margin-bottom:28px; }
  .title { font-size:58px; font-weight:900; line-height:1.3; margin-bottom:36px; text-align:center; }
  .title .amber { color:#F59E0B; }
  .products { width:100%; display:flex; flex-direction:column; gap:14px; margin-bottom:24px; }
  .p { background:#1A1A2E; border:1px solid rgba(139,92,246,0.25); border-radius:12px; padding:22px 26px; }
  .chrome { border-left:4px solid #3B82F6; }
  .cowork { border-left:4px solid #10B981; }
  .sched { border-left:4px solid #F59E0B; }
  .p-name { font-size:26px; font-weight:800; margin-bottom:8px; }
  .chrome .p-name { color:#3B82F6; }
  .cowork .p-name { color:#10B981; }
  .sched .p-name { color:#F59E0B; }
  .p-desc { font-size:22px; color:#B0B0CC; line-height:1.5; }
  .p-desc strong { color:#FFFFFF; }
  .tradeoff { width:100%; background:#1A1A2E; border:1px solid rgba(239,68,68,0.4);
    border-left:4px solid #EF4444; border-radius:12px; padding:22px 26px; }
  .tradeoff-label { font-size:22px; color:#EF4444; font-weight:800; letter-spacing:2px; margin-bottom:10px; }
  .tradeoff-text { font-size:24px; color:#FFFFFF; font-weight:700; line-height:1.4; }
  .tradeoff-text strong { color:#F59E0B; }
</style>
</head>
<body>
  <div class="slide">
    <div class="kicker">你以为还没出的功能</div>
    <div class="title">完全不在<br><span class="amber">聊天框</span>里</div>
    <div class="products">
      <div class="p chrome"><div class="p-name">Claude in Chrome</div><div class="p-desc">浏览器扩展 · 看 tab、点链接、<strong>抓职位列表做表格</strong></div></div>
      <div class="p cowork"><div class="p-name">Claude Cowork</div><div class="p-desc">桌面 app · <strong>直接读你电脑里的文件</strong>，不用复制粘贴</div></div>
      <div class="p sched"><div class="p-name">Scheduled Tasks</div><div class="p-desc">定时任务 · 每周一 7:30 自动跑 · <strong>你睡觉它干活</strong></div></div>
    </div>
    <div class="tradeoff">
      <div class="tradeoff-label">TRADEOFF</div>
      <div class="tradeoff-text">别一次性全开 · 挑<strong>你这周真会用的</strong>一个先跑起来</div>
    </div>
  </div>
</body>
</html>
