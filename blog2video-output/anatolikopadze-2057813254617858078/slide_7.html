<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1920px; background:#0D0D1A;
    font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;
    color:#FFFFFF; overflow:hidden; }
  .slide { width:100%; height:100%; padding:200px 72px 420px 72px;
    display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; }
  .kicker { font-size:28px; color:#8B5CF6; letter-spacing:3px; font-weight:600; margin-bottom:32px; }
  .title { font-size:60px; font-weight:900; line-height:1.3; margin-bottom:36px; }
  .title .amber { color:#F59E0B; }
  .url { width:100%; background:#0D0D1A; border:2px solid rgba(245,158,11,0.6);
    border-radius:12px; padding:32px; font-family:'SF Mono','Monaco',monospace;
    font-size:44px; color:#F59E0B; font-weight:800; margin-bottom:28px; letter-spacing:1px; }
  .outputs { width:100%; display:flex; gap:14px; margin-bottom:24px; flex-wrap:wrap; justify-content:center; }
  .out-pill { background:#1A1A2E; border:1px solid rgba(139,92,246,0.3);
    padding:14px 22px; border-radius:999px; font-size:24px; font-weight:700; color:#FFFFFF; }
  .takeaway { width:100%; background:linear-gradient(135deg,#1A1A2E,#2A1A3A);
    border:1px solid rgba(139,92,246,0.4); border-radius:12px; padding:28px;
    font-size:26px; line-height:1.5; }
  .takeaway strong { color:#F59E0B; }
</style>
</head>
<body>
  <div class="slide">
    <div class="kicker">第 16 节 · 大多数人不知道它存在</div>
    <div class="title">3 小时 Figma<br>→ <span class="amber">10 分钟对话</span></div>
    <div class="url">claude.ai/design</div>
    <div class="outputs">
      <div class="out-pill">PPTX</div>
      <div class="out-pill">Canva</div>
      <div class="out-pill">PDF</div>
      <div class="out-pill">HTML</div>
    </div>
    <div class="takeaway">"Claude 被低估"——不是能力被低估<br>是它做出来的产品<strong>连存在感都没建立</strong></div>
  </div>
</body>
</html>
