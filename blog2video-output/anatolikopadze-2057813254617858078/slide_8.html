<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1920px; background:#0D0D1A;
    font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;
    color:#FFFFFF; overflow:hidden; }
  .slide { width:100%; height:100%; padding:200px 72px 420px 72px;
    display:flex; flex-direction:column; justify-content:center; align-items:center; }
  .kicker { font-size:28px; color:#8B5CF6; letter-spacing:3px; font-weight:600; margin-bottom:28px; }
  .title { font-size:60px; font-weight:900; line-height:1.3; margin-bottom:40px; text-align:center; }
  .title .amber { color:#F59E0B; }
  .compare { display:flex; gap:20px; width:100%; margin-bottom:28px; }
  .card { flex:1; background:#1A1A2E; border:1px solid rgba(139,92,246,0.25); border-radius:12px; padding:30px 26px; }
  .md { border-left:4px solid #8B5CF6; }
  .sk { border-left:4px solid #10B981; }
  .card-name { font-size:30px; font-weight:800; margin-bottom:12px; font-family:'SF Mono','Monaco',monospace; }
  .md .card-name { color:#8B5CF6; }
  .sk .card-name { color:#10B981; }
  .card-tag { font-size:20px; color:#B0B0CC; font-weight:600; margin-bottom:18px; letter-spacing:1px; }
  .card-desc { font-size:23px; line-height:1.5; color:#FFFFFF; }
  .card-desc strong { color:#F59E0B; }
  .principle { width:100%; background:linear-gradient(135deg,#1A1A2E,#2A1A3A);
    border:1px solid rgba(139,92,246,0.4); border-radius:12px; padding:28px;
    text-align:center; font-size:30px; font-weight:800; line-height:1.45; }
  .principle .amber { color:#F59E0B; }
</style>
</head>
<body>
  <div class="slide">
    <div class="kicker">第 13 & 14 节 · 最值钱的两个开关</div>
    <div class="title">配置文件 ><br><span class="amber">聊天指令</span></div>
    <div class="compare">
      <div class="card md">
        <div class="card-name">CLAUDE.md</div>
        <div class="card-tag">项目根目录</div>
        <div class="card-desc">写一次<strong>永久生效</strong>·风格/禁用词/文件去处</div>
      </div>
      <div class="card sk">
        <div class="card-name">Skills</div>
        <div class="card-tag">预打包能力</div>
        <div class="card-desc">装 PPT skill → Claude <strong>自动会生成 ppt</strong></div>
      </div>
    </div>
    <div class="principle">规矩写进文件<br><span class="amber">永远生效</span> · 不用每次提醒</div>
  </div>
</body>
</html>
