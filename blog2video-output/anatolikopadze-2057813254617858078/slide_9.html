<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1920px; background:#0D0D1A;
    font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;
    color:#FFFFFF; overflow:hidden; }
  .slide { width:100%; height:100%; padding:200px 72px 420px 72px;
    display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; }
  .kicker { font-size:28px; color:#8B5CF6; letter-spacing:3px; font-weight:600; margin-bottom:36px; }
  .title { font-size:60px; font-weight:900; line-height:1.3; margin-bottom:36px; }
  .title .amber { color:#F59E0B; }
  .num { font-size:160px; font-weight:800; color:#10B981; line-height:1; margin-bottom:14px; }
  .num-label { font-size:30px; color:#B0B0CC; margin-bottom:36px; }
  .num-label strong { color:#FFFFFF; }
  .config { width:100%; background:#0D0D1A; border:2px solid rgba(16,185,129,0.5);
    border-radius:12px; padding:24px 28px; font-family:'SF Mono','Monaco',monospace;
    font-size:28px; color:#10B981; font-weight:800; margin-bottom:24px; }
  .takeaway { width:100%; background:#1A1A2E; border:1px solid rgba(139,92,246,0.25);
    border-left:4px solid #8B5CF6; border-radius:12px; padding:24px 28px;
    font-size:24px; color:#FFFFFF; line-height:1.5; text-align:left; }
  .takeaway strong { color:#10B981; }
</style>
</head>
<body>
  <div class="slide">
    <div class="kicker">给 API 开发者的彩蛋</div>
    <div class="title">Prompt <span class="amber">Caching</span></div>
    <div class="num">90%</div>
    <div class="num-label"><strong>命中 token 最高省 90%</strong> · 响应还更快</div>
    <div class="config">+ cache_control 字段</div>
    <div class="takeaway"><strong>一行字段</strong>，账单立刻减一大块——很多人还没接</div>
  </div>
</body>
</html>
