<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
      background:
        radial-gradient(circle at 50% 30%, rgba(139, 92, 246, 0.16) 0%, transparent 55%),
        radial-gradient(circle at 50% 75%, rgba(239, 68, 68, 0.10) 0%, transparent 55%),
        #0D0D1A;
    }
    .title {
      font-size: 92px;
      font-weight: 900;
      line-height: 1.2;
      letter-spacing: -1px;
      margin-bottom: 40px;
    }
    .title .line { display: block; }
    .highlight-red { color: #EF4444; }
    .source {
      font-size: 22px;
      color: #6B6B80;
      letter-spacing: 0.5px;
      background: #1A1A30;
      padding: 12px 28px;
      border-radius: 999px;
      margin-bottom: 90px;
      border: 1px solid rgba(139, 92, 246, 0.12);
    }
    .cards {
      display: flex;
      gap: 28px;
      width: 100%;
      justify-content: center;
    }
    .card {
      flex: 1;
      max-width: 420px;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-left: 4px solid #EF4444;
      border-radius: 12px;
      padding: 36px 28px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      text-align: left;
    }
    .card .num {
      font-size: 28px;
      color: #EF4444;
      font-weight: 700;
      margin-bottom: 14px;
    }
    .card .text {
      font-size: 36px;
      font-weight: 700;
      color: #FFFFFF;
      line-height: 1.35;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="title">
      <span class="line">Claude 点击不准？</span>
      <span class="line">多半是你<span class="highlight-red">截图开太大</span>了</span>
    </div>
    <div class="source">Anthropic《Best Practices for Computer &amp; Browser Use》</div>
    <div class="cards">
      <div class="card">
        <div class="num">悬念 01</div>
        <div class="text">坐标错位</div>
      </div>
      <div class="card">
        <div class="num">悬念 02</div>
        <div class="text">Agent 跑不过<br>100 步</div>
      </div>
    </div>
  </div>
</body>
</html>
