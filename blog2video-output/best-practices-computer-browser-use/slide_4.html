<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .eyebrow {
      font-size: 26px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 600;
      margin-bottom: 20px;
    }
    .title {
      font-size: 64px;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 56px;
    }
    .columns {
      width: 100%;
      display: flex;
      gap: 24px;
    }
    .col {
      flex: 1;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 28px 24px;
      text-align: left;
    }
    .col.bad { border-left: 4px solid #EF4444; }
    .col.good { border-left: 4px solid #10B981; }
    .col .head {
      font-size: 34px;
      font-weight: 800;
      margin-bottom: 22px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .col.bad .head { color: #EF4444; }
    .col.good .head { color: #10B981; }
    .col .icon {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 900;
    }
    .col.bad .icon { background: rgba(239, 68, 68, 0.15); color: #EF4444; }
    .col.good .icon { background: rgba(16, 185, 129, 0.15); color: #10B981; }
    .item {
      font-size: 28px;
      color: #FFFFFF;
      line-height: 1.5;
      margin: 16px 0;
      padding-left: 22px;
      position: relative;
    }
    .item::before {
      content: '';
      position: absolute;
      left: 0;
      top: 16px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .col.bad .item::before { background: #EF4444; }
    .col.good .item::before { background: #10B981; }
    .col.bad .item { text-decoration: line-through; color: #B0B0CC; }
    .subtitle {
      font-size: 26px;
      color: #B0B0CC;
      margin-top: 36px;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="eyebrow">Anthropic 内部实验</div>
    <div class="title">三个白做工 <span style="color:#10B981;">vs</span> 两件真有用</div>

    <div class="columns">
      <div class="col bad">
        <div class="head"><span class="icon">✕</span>没用</div>
        <div class="item">切成小块</div>
        <div class="item">叠加坐标网格</div>
        <div class="item">换 resize 算法</div>
      </div>
      <div class="col good">
        <div class="head"><span class="icon">✓</span>有用</div>
        <div class="item">选对分辨率</div>
        <div class="item">文字指令放图前面</div>
      </div>
    </div>
    <div class="subtitle">顺序一调，准确率就上去</div>
  </div>
</body>
</html>
