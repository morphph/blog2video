<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .eyebrow {
      font-size: 26px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 600;
      margin-bottom: 20px;
    }
    .title {
      font-size: 64px;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 44px;
    }
    .title .accent { color: #EF4444; }
    .math {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-left: 4px solid #8B5CF6;
      border-radius: 12px;
      padding: 36px 28px;
      margin-bottom: 36px;
      text-align: left;
    }
    .math-row {
      display: flex;
      align-items: baseline;
      gap: 14px;
      font-size: 32px;
      color: #FFFFFF;
      margin: 14px 0;
      line-height: 1.3;
    }
    .math-row .num {
      font-size: 56px;
      font-weight: 800;
      color: #8B5CF6;
      line-height: 1;
    }
    .math-row .x {
      font-size: 28px;
      color: #B0B0CC;
    }
    .math-row .label {
      font-size: 24px;
      color: #B0B0CC;
    }
    .equals {
      width: 100%;
      text-align: center;
      font-size: 30px;
      color: #6B7280;
      margin: 8px 0;
    }
    .result {
      display: flex;
      align-items: baseline;
      gap: 14px;
      font-size: 32px;
      color: #FFFFFF;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid rgba(139, 92, 246, 0.2);
    }
    .result .num {
      font-size: 64px;
      font-weight: 900;
      color: #EF4444;
      line-height: 1;
    }
    .callout {
      width: 100%;
      background: rgba(239, 68, 68, 0.10);
      border: 1px solid rgba(239, 68, 68, 0.4);
      border-left: 4px solid #EF4444;
      border-radius: 12px;
      padding: 28px 26px;
      text-align: left;
    }
    .callout .head {
      font-size: 36px;
      font-weight: 900;
      color: #EF4444;
      margin-bottom: 8px;
    }
    .callout .sub {
      font-size: 26px;
      color: #FCA5A5;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="eyebrow">反直觉 · 三</div>
    <div class="title">上下文管理 = <span class="accent">生死线</span></div>

    <div class="math">
      <div class="math-row">
        <span class="num">1张截图</span>
        <span class="label">= 1000–1800 tokens</span>
      </div>
      <div class="math-row">
        <span class="num">×100张</span>
        <span class="label">≈ 200k tokens</span>
      </div>
      <div class="equals">━━━━━</div>
      <div class="result">
        <span class="num">100 步</span>
        <span class="label">上下文窗口就满了</span>
      </div>
    </div>

    <div class="callout">
      <div class="head">不是慢，是直接停</div>
      <div class="sub">Agent 跑不过 100 步，再聪明也没用</div>
    </div>
  </div>
</body>
</html>
