<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .label {
      font-size: 30px;
      color: #10B981;
      letter-spacing: 2px;
      font-weight: 700;
      margin-bottom: 24px;
    }
    .title {
      font-size: 56px;
      font-weight: 900;
      line-height: 1.3;
      margin-bottom: 40px;
    }
    .hl-red { color: #EF4444; }
    .cols {
      width: 100%;
      display: flex;
      gap: 22px;
      margin-bottom: 36px;
    }
    .col {
      flex: 1;
      background: #1A1A2E;
      border-radius: 12px;
      padding: 26px 22px;
      text-align: left;
    }
    .col .h { font-size: 28px; font-weight: 800; margin-bottom: 12px; }
    .col .d { font-size: 26px; color: #B0B0CC; line-height: 1.4; }
    .clean { border: 1px solid rgba(16,185,129,0.3); border-left: 4px solid #10B981; }
    .clean .h { color: #10B981; }
    .review { border: 1px solid rgba(239,68,68,0.3); border-left: 4px solid #EF4444; }
    .review .h { color: #EF4444; }
    .diff-box {
      width: 100%;
      background: #14141f;
      border: 1px solid rgba(239,68,68,0.4);
      border-radius: 12px;
      padding: 24px 28px;
      margin-bottom: 28px;
      font-family: 'JetBrains Mono', monospace;
      text-align: left;
    }
    .diff-box .line { font-size: 30px; line-height: 1.5; }
    .diff-box .ref { color: #EF4444; font-weight: 800; }
    .diff-box .mustfix {
      display:inline-block; background:#EF4444; color:#0D0D1A;
      font-size: 22px; font-weight: 800; padding: 3px 12px; border-radius: 6px; margin-left: 10px;
      font-family: -apple-system, sans-serif;
    }
    .takeaway {
      width: 100%;
      background: #1A1A2E;
      border-left: 4px solid #F59E0B;
      border: 1px solid rgba(245,158,11,0.3);
      border-radius: 12px;
      padding: 24px 28px;
      font-size: 28px;
      line-height: 1.5;
      text-align: left;
    }
    .takeaway b { color: #F59E0B; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="label">L1 · 写比看起来难</div>
    <div class="title">写完，递回一份<br>压缩 + 分诊的 <span style="color:#3B82F6;">diff</span></div>
    <div class="cols">
      <div class="col clean">
        <div class="h">没问题的改动</div>
        <div class="d">200 次写入分组采样，归成寥寥几行，仍知道总数</div>
      </div>
      <div class="col review">
        <div class="h">需要复查</div>
        <div class="d">无效公式 / 没标注的硬编码 / 离谱百分比，单独拎出</div>
      </div>
    </div>
    <div class="diff-box">
      <div class="line"><span class="ref">#REF!</span> &nbsp;行 57<span class="mustfix">必须修复</span></div>
    </div>
    <div class="takeaway">
      反馈循环给的不是"你改了什么"，而是<b>"你改了什么，以及你大概率搞错的是哪一处"</b>——相当于给每次编辑内建一个纠错员。
    </div>
  </div>
</body>
</html>
