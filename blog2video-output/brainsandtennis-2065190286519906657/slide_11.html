<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .label {
      font-size: 30px;
      color: #3B82F6;
      letter-spacing: 2px;
      font-weight: 700;
      margin-bottom: 24px;
    }
    .title {
      font-size: 54px;
      font-weight: 900;
      line-height: 1.3;
      margin-bottom: 24px;
    }
    .hl-blue { color: #3B82F6; }
    .sub { font-size: 28px; color:#6B7280; margin-bottom: 40px; line-height:1.4; }
    .sub code { font-family:'JetBrains Mono',monospace; color:#B0B0CC; }
    .card {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(59,130,246,0.3);
      border-left: 4px solid #3B82F6;
      border-radius: 12px;
      padding: 28px;
      text-align: left;
      margin-bottom: 22px;
    }
    .card .h { font-size: 30px; font-weight: 800; color: #3B82F6; margin-bottom: 12px; }
    .card .d { font-size: 28px; color:#B0B0CC; line-height:1.5; }
    .card .d code { font-family:'JetBrains Mono',monospace; color:#FFFFFF; }
    .example {
      width: 100%;
      background: #14141f;
      border: 1px solid rgba(245,158,11,0.3);
      border-radius: 12px;
      padding: 26px 28px;
      text-align: left;
      font-size: 27px;
      line-height: 1.55;
      color:#B0B0CC;
    }
    .example .h { color:#F59E0B; font-weight:800; font-size:28px; margin-bottom:10px; }
    .example code { font-family:'JetBrains Mono',monospace; color:#FFFFFF; }
    .example b { color:#F59E0B; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="label">L2 · 重要但偶尔才用</div>
    <div class="title">curated 英文规范，<br><span class="hl-blue">按需才取</span></div>
    <div class="sub">条件格式 · 数据透视表 · 图表 · 数据校验 —— 像 skill 文档，模型在代码里调一句拉进来</div>
    <div class="card">
      <div class="h">不是函数签名堆砌</div>
      <div class="d">是手写散文，每份几百行，讲"把一件事做对的正确路子"，包括原始 API 永远不告诉你的知识。</div>
    </div>
    <div class="example">
      <div class="h">透视表规范举例</div>
      必须用 <code>suspendLayout</code> / <code>resumeLayout</code> 包住整批改动，否则每改一次整张表就重建一次；聚合方式得传裸整数 —— <b>8 = 求和</b>（运行时根本没有友好枚举）。在任务需要它之前，一个 token 都不花。
    </div>
  </div>
</body>
</html>
