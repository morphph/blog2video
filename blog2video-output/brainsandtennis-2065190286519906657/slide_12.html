<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .label {
      font-size: 30px;
      color: #3B82F6;
      letter-spacing: 2px;
      font-weight: 700;
      margin-bottom: 24px;
    }
    .title {
      font-size: 52px;
      font-weight: 900;
      line-height: 1.3;
      margin-bottom: 18px;
    }
    .hl-blue { color: #3B82F6; }
    .sub { font-size: 28px; color:#6B7280; margin-bottom: 40px; line-height:1.4; }
    .flow {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 36px;
    }
    .step {
      background: #1A1A2E;
      border: 1px solid rgba(59,130,246,0.3);
      border-left: 4px solid #3B82F6;
      border-radius: 12px;
      padding: 24px 28px;
      text-align: left;
      font-size: 28px;
      line-height: 1.45;
      color:#B0B0CC;
    }
    .step b { color:#FFFFFF; }
    .step code { font-family:'JetBrains Mono',monospace; color:#3B82F6; font-weight:700; }
    .step.deny { border-color: rgba(239,68,68,0.4); border-left-color:#EF4444; }
    .step.deny b { color:#EF4444; }
    .note {
      width: 100%;
      background: #14141f;
      border: 1px solid rgba(245,158,11,0.3);
      border-left: 4px solid #F59E0B;
      border-radius: 12px;
      padding: 24px 28px;
      text-align: left;
      font-size: 27px;
      line-height: 1.5;
      color:#B0B0CC;
    }
    .note b { color:#F59E0B; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="label">L2 · 同一套思路 → deferred tools</div>
    <div class="title">一道<span class="hl-blue">元工具的墙</span></div>
    <div class="sub">网页搜索 · 网页抓取 · 生成网站 —— schema 不常驻提示词</div>
    <div class="flow">
      <div class="step">① 先用 <code>get_tool_info</code> 把某工具的 schema 取出来 → 标记为"已加载"</div>
      <div class="step">② 之后才能 <code>execute_tool</code> 调用它</div>
      <div class="step deny"><b>没先取就直接调用 → 系统直接拒绝</b></div>
    </div>
    <div class="note">
      已取过的工具 = 一个<b>会话级缓存</b>，加载一次就常驻。<br>
      作者点的话：这跟 Claude 的"deferred tools"是同一思路，但他们<b>没被绑死在某一家厂商</b>的工具加载功能上，照样拿到这行为。
    </div>
  </div>
</body>
</html>
