<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .label {
      font-size: 30px;
      color: #8B5CF6;
      letter-spacing: 2px;
      font-weight: 700;
      margin-bottom: 24px;
    }
    .title {
      font-size: 56px;
      font-weight: 900;
      line-height: 1.3;
      margin-bottom: 18px;
    }
    .hl { color: #8B5CF6; }
    .sub { font-size: 27px; color:#6B7280; margin-bottom: 40px; line-height:1.4; }
    .two {
      width: 100%;
      display: flex;
      gap: 22px;
      margin-bottom: 32px;
    }
    .box {
      flex: 1;
      background: #1A1A2E;
      border-radius: 12px;
      padding: 28px 24px;
      text-align: left;
    }
    .box .num { font-size: 56px; font-weight: 800; line-height:1; margin-bottom: 12px; font-family:'JetBrains Mono',monospace;}
    .box .d { font-size: 27px; color:#B0B0CC; line-height:1.45; }
    .tome { border: 1px solid rgba(139,92,246,0.3); border-left: 4px solid #8B5CF6; }
    .tome .num { color: #8B5CF6; }
    .skill { border: 1px solid rgba(16,185,129,0.3); border-left: 4px solid #10B981; }
    .skill .num { color: #10B981; }
    .skill .d code { font-family:'JetBrains Mono',monospace; color:#FFFFFF; }
    .escape {
      width: 100%;
      background: #14141f;
      border: 1px solid rgba(245,158,11,0.3);
      border-left: 4px solid #F59E0B;
      border-radius: 12px;
      padding: 26px 28px;
      text-align: left;
      font-size: 28px;
      line-height: 1.5;
      color:#B0B0CC;
    }
    .escape b { color:#F59E0B; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="label">L3 · 那条孤零零的长尾</div>
    <div class="title">完整原始 API +<br>一份会 <span class="hl">grep</span> 的 skill</div>
    <div class="sub">折线图/对数次坐标轴/超链接到命名区域 —— 真实但极少碰到的 API 角落</div>
    <div class="two">
      <div class="box tome">
        <div class="num">70k 行</div>
        <div class="d">整个 Office.js / SpreadJS 倒到磁盘，机器生成的参考大全，绝不能整个贴进提示词</div>
      </div>
      <div class="box skill">
        <div class="num">~100 行</div>
        <div class="d">一张简短的地图，教它用 <code>grep</code> 挖大全：3-6 次 grep 精准捞出要的签名</div>
      </div>
    </div>
    <div class="escape">
      系统提示词把逃生通道写得明明白白：<b>永远不要猜，把文档读完；包装 API 做不到，就用原始 API，别将就。</b> Agent 永远不该被卡死。
    </div>
  </div>
</body>
</html>
