<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .label {
      font-size: 30px;
      color: #8B5CF6;
      letter-spacing: 2px;
      font-weight: 700;
      margin-bottom: 22px;
    }
    .title {
      font-size: 54px;
      font-weight: 900;
      line-height: 1.3;
      margin-bottom: 14px;
    }
    .hl { color: #F59E0B; }
    .sub { font-size: 28px; color:#6B7280; margin-bottom: 40px; }
    .checks {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .check {
      background: #1A1A2E;
      border-radius: 12px;
      padding: 28px 28px;
      text-align: left;
    }
    .check .q { font-size: 31px; font-weight:800; margin-bottom:12px; display:flex; align-items:center; gap:14px;}
    .check .badge { font-family:'JetBrains Mono',monospace; font-size: 26px; font-weight:800; padding: 4px 14px; border-radius:8px; }
    .check .a { font-size: 27px; color:#B0B0CC; line-height:1.5; }
    .c1 { border:1px solid rgba(16,185,129,0.3); border-left:4px solid #10B981; }
    .c1 .q { color:#10B981; } .c1 .badge { background:rgba(16,185,129,0.2); color:#10B981; }
    .c2 { border:1px solid rgba(59,130,246,0.3); border-left:4px solid #3B82F6; }
    .c2 .q { color:#3B82F6; } .c2 .badge { background:rgba(59,130,246,0.2); color:#3B82F6; }
    .c3 { border:1px solid rgba(139,92,246,0.3); border-left:4px solid #8B5CF6; }
    .c3 .q { color:#8B5CF6; } .c3 .badge { background:rgba(139,92,246,0.2); color:#8B5CF6; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="label">能迁移到任何领域</div>
    <div class="title">你的活儿，<br>回答<span class="hl">三个问题</span></div>
    <div class="sub">表格只是例子，分布你比谁都懂</div>
    <div class="checks">
      <div class="check c1">
        <div class="q"><span class="badge">L1</span>什么包进去？</div>
        <div class="a">频率曲线最陡的家常操作。token 极致、速度极快、会汇报后果，砸不成比例的功夫。</div>
      </div>
      <div class="check c2">
        <div class="q"><span class="badge">L2</span>什么推上去？</div>
        <div class="a">重要但偶尔才用。写成 curated、英文、带坑提醒的规范，一步取到——编码的是正确路子，不只签名。</div>
      </div>
      <div class="check c3">
        <div class="q"><span class="badge">L3</span>逃生舱是什么？</div>
        <div class="a">原始完整素材 + 一份教 Agent 去挖它的 skill。不需好用，只需能到达、够完整、有限步数内可被找到。</div>
      </div>
    </div>
  </div>
</body>
</html>
