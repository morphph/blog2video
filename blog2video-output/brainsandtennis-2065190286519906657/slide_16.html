<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .label {
      font-size: 30px;
      color: #8B5CF6;
      letter-spacing: 2px;
      font-weight: 700;
      margin-bottom: 28px;
    }
    .title {
      font-size: 56px;
      font-weight: 900;
      line-height: 1.3;
      margin-bottom: 40px;
    }
    .hl { color: #F59E0B; }
    .drift {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(59,130,246,0.3);
      border-left: 4px solid #3B82F6;
      border-radius: 12px;
      padding: 28px;
      text-align: left;
      margin-bottom: 24px;
      font-size: 30px;
      line-height: 1.5;
      color:#B0B0CC;
    }
    .drift b { color:#3B82F6; font-weight:800; }
    .drift .arrow { color:#3B82F6; font-family:'JetBrains Mono',monospace; }
    .counter {
      width: 100%;
      background: #14141f;
      border: 1px solid rgba(245,158,11,0.3);
      border-left: 4px solid #F59E0B;
      border-radius: 12px;
      padding: 30px 28px;
      text-align: left;
      font-size: 30px;
      line-height: 1.55;
      margin-bottom: 24px;
    }
    .counter .q { color:#6B7280; font-size:27px; margin-bottom:14px; }
    .counter b { color:#F59E0B; }
    .anchor {
      width: 100%;
      background: linear-gradient(135deg, rgba(139,92,246,0.18), rgba(245,158,11,0.12));
      border: 1px solid rgba(245,158,11,0.4);
      border-radius: 12px;
      padding: 30px 28px;
      font-size: 31px;
      font-weight: 700;
      line-height: 1.5;
      color:#FFFFFF;
    }
    .anchor b { color:#F59E0B; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="label">全篇最值得记住的判断</div>
    <div class="title">什么算 L1，<br>会随模型变强<span class="hl">漂移</span></div>
    <div class="drift">
      昨天的 <b>L3</b> <span class="arrow">→</span> 明天的 <b>L2</b>；<br>
      昨天的 <b>L2</b> <span class="arrow">→</span> 塌进 <b>L1</b>。<br>
      整个层级，往下滑一级。
    </div>
    <div class="counter">
      <div class="q">窗口越大，分层脚手架不就该被淘汰？</div>
      <b>恰恰相反，分层永远不会消失。</b>相对于"你能塞的一切"，上下文永远稀缺；噪声永远在扣准确率。
    </div>
    <div class="anchor">
      摘要放缓存，细节按需取，原始素材留作最后一招 —— <b>CPU 几十年前就想明白的本能。</b>
    </div>
  </div>
</body>
</html>
