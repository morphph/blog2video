<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .label {
      font-size: 30px;
      color: #8B5CF6;
      letter-spacing: 2px;
      font-weight: 700;
      margin-bottom: 40px;
    }
    .title {
      font-size: 72px;
      font-weight: 900;
      line-height: 1.3;
      margin-bottom: 64px;
    }
    .hl-red { color: #EF4444; }
    .hl-green { color: #10B981; }
    .row {
      display: flex;
      gap: 28px;
      width: 100%;
      align-items: stretch;
    }
    .card {
      flex: 1;
      background: #1A1A2E;
      border-radius: 12px;
      padding: 40px 28px;
      text-align: left;
    }
    .card.bad { border: 1px solid rgba(239, 68, 68, 0.3); border-left: 4px solid #EF4444; }
    .card.good { border: 1px solid rgba(16, 185, 129, 0.3); border-left: 4px solid #10B981; }
    .card .tag {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 18px;
    }
    .card.bad .tag { color: #EF4444; }
    .card.good .tag { color: #10B981; }
    .card .body {
      font-size: 32px;
      color: #B0B0CC;
      line-height: 1.5;
    }
    .code {
      font-family: 'JetBrains Mono', monospace;
      color: #FFFFFF;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="label">为什么这篇值得读</div>
    <div class="title">谁都在讲怎么搭 Agent，<br>没人讲怎么搭<span class="hl-green">好</span></div>
    <div class="row">
      <div class="card bad">
        <div class="tag">已经泛滥</div>
        <div class="body">一个 <span class="code">while</span> 循环套着模型，不停调工具直到任务做完。给它文件系统、命令行，剩下自己折腾。一个下午就能写。</div>
      </div>
      <div class="card good">
        <div class="tag">几乎没人讲</div>
        <div class="body">怎么搭一个<br><span style="color:#10B981;font-weight:800;">好</span>的 Agent？</div>
      </div>
    </div>
  </div>
</body>
</html>
