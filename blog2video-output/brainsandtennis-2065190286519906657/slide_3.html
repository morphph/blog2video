<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .label {
      font-size: 30px;
      color: #8B5CF6;
      letter-spacing: 2px;
      font-weight: 700;
      margin-bottom: 36px;
    }
    .title {
      font-size: 60px;
      font-weight: 900;
      line-height: 1.3;
      margin-bottom: 28px;
    }
    .sub {
      font-size: 32px;
      color: #6B7280;
      margin-bottom: 56px;
      line-height: 1.4;
    }
    .compare {
      display: flex;
      gap: 24px;
      width: 100%;
      margin-bottom: 48px;
    }
    .chip {
      flex: 1;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 28px 18px;
    }
    .chip .num { font-size: 64px; font-weight: 800; line-height: 1; margin-bottom: 10px; }
    .chip .nm { font-size: 26px; color: #B0B0CC; font-family: 'JetBrains Mono', monospace; }
    .chip.many .num { color: #EF4444; }
    .chip.few .num { color: #3B82F6; }
    .chip.one .num { color: #10B981; }
    .gap-tag {
      font-size: 44px; font-weight: 800; color: #F59E0B;
      margin-bottom: 48px;
    }
    .fact {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-left: 4px solid #8B5CF6;
      border-radius: 12px;
      padding: 32px 28px;
      text-align: left;
      font-size: 30px;
      color: #FFFFFF;
      line-height: 1.5;
    }
    .fact b { color: #F59E0B; font-weight: 800; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="label">这个领域没有公认原则</div>
    <div class="title">最基础的问题<br>都能差出 <span style="color:#F59E0B;">四倍</span></div>
    <div class="sub">该配多少工具？大家各凭手感</div>
    <div class="compare">
      <div class="chip many">
        <div class="num">~30</div>
        <div class="nm">Codex / Claude Code</div>
      </div>
      <div class="chip few">
        <div class="num">7</div>
        <div class="nm">Pi</div>
      </div>
      <div class="chip one">
        <div class="num">1</div>
        <div class="nm">Shortcut</div>
      </div>
    </div>
    <div class="fact">
      作者花近一年打磨 <b>Shortcut</b> 表格 Agent。<br>
      公认最准，部署在 <b>全球四大对冲基金的三家</b>。<br>
      算错一个数字代价极高，没渠道，靠的就是出错更少。
    </div>
  </div>
</body>
</html>
