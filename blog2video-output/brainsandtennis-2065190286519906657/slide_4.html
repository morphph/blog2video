<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .glow {
      position: absolute;
      top: 38%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 900px;
      height: 600px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.16) 0%, rgba(13, 13, 26, 0) 70%);
      pointer-events: none;
    }
    .quote-mark {
      font-size: 200px;
      font-weight: 900;
      color: #8B5CF6;
      opacity: 0.35;
      line-height: 0.6;
      height: 120px;
      position: relative;
    }
    .quote {
      font-size: 64px;
      font-weight: 800;
      line-height: 1.45;
      position: relative;
      margin-bottom: 48px;
    }
    .hl { color: #F59E0B; }
    .attr {
      font-size: 30px;
      color: #6B7280;
      position: relative;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="glow"></div>
    <div class="quote-mark">&ldquo;</div>
    <div class="quote">
      一个好的 Agent，<br>
      是它所处理<span class="hl">任务分布</span>的<br>
      一次<span class="hl">忠实压缩</span>。
    </div>
    <div class="attr">—— 接下来全是它逼你造的具体东西</div>
  </div>
</body>
</html>
