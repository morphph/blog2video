<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .label {
      font-size: 30px;
      color: #8B5CF6;
      letter-spacing: 2px;
      font-weight: 700;
      margin-bottom: 32px;
    }
    .title {
      font-size: 56px;
      font-weight: 900;
      line-height: 1.3;
      margin-bottom: 40px;
    }
    .three {
      display: flex;
      gap: 18px;
      width: 100%;
      margin-bottom: 44px;
    }
    .three .item {
      flex: 1;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 24px 14px;
      font-size: 27px;
      color: #B0B0CC;
      line-height: 1.4;
    }
    .three .item b { display:block; color:#8B5CF6; font-size:30px; font-weight:800; margin-bottom:8px; }
    .eq {
      font-size: 34px; color:#FFFFFF; font-weight: 800; margin-bottom: 44px;
    }
    .eq .ctx { color: #8B5CF6; }
    .value {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-left: 4px solid #F59E0B;
      border-radius: 12px;
      padding: 36px 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 28px;
    }
    .value .nums { font-size: 72px; font-weight: 800; color: #F59E0B; line-height: 1; }
    .value .nums small { font-size: 32px; color:#B0B0CC; }
    .value .txt { font-size: 30px; color:#FFFFFF; text-align:left; line-height:1.4; }
    .value .txt b { color:#F59E0B; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="label">你能设计的，只剩上下文</div>
    <div class="title">准确率 = <span style="color:#8B5CF6;">上下文质量</span>的函数</div>
    <div class="three">
      <div class="item"><b>system prompt</b>系统提示词</div>
      <div class="item"><b>工具</b>execute_code</div>
      <div class="item"><b>素材</b>skill / 文档 / 参考</div>
    </div>
    <div class="eq">塞太满 → 信号被噪声埋掉<br>缺东西 → 模型只能靠猜</div>
    <div class="value">
      <div class="nums">99%<small> vs </small>95%</div>
      <div class="txt">差 4 个百分点，<br>价值却差 <b>10 倍</b></div>
    </div>
  </div>
</body>
</html>
