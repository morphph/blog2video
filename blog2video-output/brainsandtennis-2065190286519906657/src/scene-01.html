<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
/*@@BASE@@*/
/* —— scene-01 特有(cover 多 beat)—— */
[data-composition-id='s01'] .beat{position:absolute;left:0;right:0;top:0;bottom:0;
  padding:300px 72px 540px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;box-sizing:border-box}

/* beat A — hook */
[data-composition-id='s01'] .a-kick{font-family:'JetBrains Mono',monospace;font-size:30px;color:#8a8a85;letter-spacing:.05em}
[data-composition-id='s01'] .a-kick .acc{color:#ccff4d}
[data-composition-id='s01'] .a-zh{margin-top:22px;font-weight:900;font-size:96px;line-height:1.1;color:#edebe6}
[data-composition-id='s01'] .a-arrive{margin-top:30px;display:flex;align-items:center}
[data-composition-id='s01'] .a-arrive .t{font-weight:900;font-size:100px;color:#edebe6}
[data-composition-id='s01'] .a-arrive .cur{display:inline-block;width:50px;height:80px;background:#ccff4d;margin-left:18px}

/* beat B — the gap stat */
[data-composition-id='s01'] .b-kick{font-family:'JetBrains Mono',monospace;font-size:30px;color:#8a8a85;letter-spacing:.04em}
[data-composition-id='s01'] .b-stat{margin-top:34px;width:100%;background:#1c1c1e;border:1px solid #2a2a2c;padding:40px 40px}
[data-composition-id='s01'] .b-stat .big{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:120px;line-height:1;color:#5fd3e8;font-variant-numeric:tabular-nums}
[data-composition-id='s01'] .b-stat .big .sl{color:#8a8a85;font-weight:500}
[data-composition-id='s01'] .b-stat .cap{margin-top:18px;font-weight:600;font-size:46px;line-height:1.3;color:#edebe6}
[data-composition-id='s01'] .b-line{margin-top:40px;font-weight:900;font-size:66px;line-height:1.18;color:#edebe6}
[data-composition-id='s01'] .b-line .em{color:#ccff4d}

/* beat C — the punch question */
[data-composition-id='s01'] .c-led{font-family:'JetBrains Mono',monospace;font-size:30px;color:#8a8a85;letter-spacing:.04em}
[data-composition-id='s01'] .c-q{margin-top:24px;font-weight:900;font-size:88px;line-height:1.18;color:#edebe6}
[data-composition-id='s01'] .c-q .hl{position:relative;display:inline-block;padding:6px 14px}
[data-composition-id='s01'] .c-q .hl .bar{position:absolute;inset:0;background:#ccff4d;transform:scaleX(0);transform-origin:left center}
[data-composition-id='s01'] .c-q .hl .tx{position:relative;z-index:1;font-weight:900;font-size:88px;color:#edebe6}
[data-composition-id='s01'] .c-tag{margin-top:48px;display:inline-flex;align-items:center;gap:16px;
  background:#1c1c1e;border:1px solid #2a2a2c;padding:18px 30px}
[data-composition-id='s01'] .c-tag .dot{width:14px;height:14px;border-radius:50%;background:#ccff4d}
[data-composition-id='s01'] .c-tag .lab{font-family:'JetBrains Mono',monospace;font-size:28px;color:#edebe6;letter-spacing:.03em}
</style>
</head>
<body>
  <div id="root" class="stage" data-composition-id="s01" data-start="0" data-duration="20.433" data-width="1080" data-height="1920">
    <div class="grid"></div>
    <div class="topbar">
      <div class="brand">精读AI · 构建好 AGENT<span class="b-cur"></span></div>
      <div class="idx">[01/17]</div>
    </div>

    <!-- BEAT A: hook -->
    <div class="beat" id="beatA">
      <div class="a-kick">// 谁都能写个 <span class="acc">Agent</span></div>
      <div class="a-zh">一个下午的事。</div>
      <div class="a-arrive"><span class="t">但能用的，</span><span class="cur"></span></div>
    </div>

    <!-- BEAT B: the gap stat -->
    <div class="beat" id="beatB" style="opacity:0">
      <div class="b-kick">GLOBAL TOP 4 · 对冲基金</div>
      <div class="b-stat">
        <div class="big">3<span class="sl"> / 4</span></div>
        <div class="cap">全球前四大对冲基金，三家在用</div>
      </div>
      <div class="b-line">差距不在模型多聪明、工具多花哨，<br>在<span class="em">枯燥的功夫</span></div>
    </div>

    <!-- BEAT C: the punch question -->
    <div class="beat" id="beatC" style="opacity:0">
      <div class="c-led">// THE REAL QUESTION</div>
      <div class="c-q">好 Agent 为什么<br><span class="hl"><span class="bar"></span><span class="tx">这么少？</span></span></div>
      <div class="c-tag"><span class="dot"></span><span class="lab">把这套功夫拆开讲清楚 · 今天精读</span></div>
    </div>

    <!-- SUBTITLES (local time) -->
    <div id="sub-1" class="clip sub" data-start="0" data-duration="3.762" data-track-index="5"><div class="sub-inner">谁都能写个 <span class="sub-k">Agent</span>，一个下午的事。</div></div>
    <div id="sub-2" class="clip sub" data-start="3.762" data-duration="5.148" data-track-index="5"><div class="sub-inner">但能让全球前四大对冲基金里，<span class="sub-k">三家掏钱用的</span>，只有一个。</div></div>
    <div id="sub-3" class="clip sub" data-start="8.91" data-duration="7.325" data-track-index="5"><div class="sub-inner">差距不在模型多聪明、工具多花哨，在有没有人肯在几个关键处，做足<span class="sub-k">枯燥的功夫</span>。</div></div>
    <div id="sub-4" class="clip sub" data-start="16.38" data-duration="3.905" data-track-index="5"><div class="sub-inner">它的作者把这套功夫拆开讲清楚了，今天我们<span class="sub-k">精读</span>。</div></div>
  </div>

  <script>
  /*@@MOTION@@*/
  </script>
  <script>
  (function(){
    window.__timelines = window.__timelines || {};
    var R="[data-composition-id='s01'] ";
    var tl=gsap.timeline({paused:true});

    tl.from(R+'.grid',{opacity:0,duration:.5,ease:'power1.out'},0.02);
    tl.from(R+'.topbar',{y:-16,opacity:0,duration:.3,ease:'power2.out'},0.2);

    /* BEAT A (0 - ~3.76) — hook */
    tl.from(R+'.a-kick',{y:-14,opacity:0,duration:.3,ease:'power2.out'},0.4);
    tl.from(R+'.a-zh',{x:-40,opacity:0,duration:.4,ease:'expo.out'},0.9);
    tl.from(R+'.a-arrive .t',{y:20,opacity:0,duration:.35,ease:'power3.out'},2.0);
    tl.from(R+'.a-arrive .cur',{scaleX:2.4,opacity:0,duration:.3,ease:'expo.out'},2.3);
    tl.to(R+'.a-arrive .cur',{opacity:0,duration:.4,ease:'steps(1)',repeat:5,yoyo:true},2.7);
    tl.to(R+'#beatA',{scale:1.03,duration:3.76,ease:'none'},0);

    /* A -> B swap @ 3.762 */
    tl.to(R+'#beatA',{opacity:0,duration:.45,ease:'power2.inOut'},3.5);
    tl.set(R+'#beatB',{opacity:1},3.78);
    tl.from(R+'.b-kick',{y:-14,opacity:0,duration:.3,ease:'power2.out'},3.95);
    tl.from(R+'.b-stat',{y:24,opacity:0,duration:.4,ease:'expo.out'},4.3);
    D2.countUp(tl, R+'.b-stat .big', 4.5, 0, 3, 1.0, {});
    tl.from(R+'.b-line',{y:20,opacity:0,duration:.4,ease:'power3.out'},8.95);
    tl.to(R+'#beatB',{scale:1.025,duration:8,ease:'none'},3.8);

    /* B -> C swap @ 16.38 */
    tl.to(R+'#beatB',{opacity:0,duration:.4,ease:'power2.inOut'},15.95);
    tl.set(R+'#beatC',{opacity:1},16.4);
    tl.from(R+'.c-led',{opacity:0,duration:.3,ease:'power1.out'},16.55);
    tl.from(R+'.c-q',{y:22,opacity:0,duration:.4,ease:'power3.out'},16.85);
    tl.to(R+'.c-q .hl .bar',{scaleX:1,duration:.32,ease:'power4.inOut'},18.0);
    tl.to(R+'.c-q .hl .tx',{color:'#121212',duration:.12,ease:'power1.inOut'},18.16);
    tl.from(R+'.c-tag',{y:18,opacity:0,duration:.35,ease:'expo.out'},18.9);
    tl.to(R+'#beatC',{scale:1.03,duration:4,ease:'none'},16.4);

    /* subtitle fade-ins (local time, verbatim from brief) */
    D2.subs(tl, [['#sub-1',0],['#sub-2',3.762],['#sub-3',8.91],['#sub-4',16.38]]
      .map(function(s){return [R+s[0],s[1]];}));

    window.__timelines['s01']=tl;
  })();
  </script>
</body>
</html>
