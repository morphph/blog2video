<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px; background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%; padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column; justify-content: center;
      align-items: center; text-align: center;
    }
    .kicker { font-size: 32px; color: #8B5CF6; font-weight: 700; margin-bottom: 34px; letter-spacing: 1px; }
    .list { display: flex; flex-direction: column; gap: 22px; width: 100%; margin-bottom: 44px; }
    .item {
      background: #1A1A2E; border: 1px solid rgba(139,92,246,0.35);
      border-left: 5px solid #8B5CF6; border-radius: 12px; padding: 26px 28px;
      text-align: left; display: flex; align-items: center; gap: 22px;
    }
    .item .n {
      font-family: 'JetBrains Mono', monospace; font-size: 44px; font-weight: 800;
      color: #8B5CF6; flex-shrink: 0;
    }
    .item .t { font-size: 36px; font-weight: 700; line-height: 1.34; }
    .item .t b { color: #F59E0B; }
    .cta {
      background: #1A1A2E; border: 1px solid rgba(245,158,11,0.5);
      border-radius: 12px; padding: 36px 32px; width: 100%; text-align: center;
    }
    .cta .big { font-size: 44px; font-weight: 800; color: #F59E0B; line-height: 1.34; margin-bottom: 18px; }
    .cta .sub { font-size: 32px; color: #B0B0CC; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="kicker">三条核心原则</div>
    <div class="list">
      <div class="item"><div class="n">1</div><div class="t">让 Agent 设计<b>保持简单</b></div></div>
      <div class="item"><div class="n">2</div><div class="t">把模型的规划步骤<b>明明白白亮出来</b></div></div>
      <div class="item"><div class="n">3</div><div class="t">认真打磨 Agent 与计算机之间的<b>接口</b></div></div>
    </div>
    <div class="cta">
      <div class="big">别急着造更聪明的系统<br>先造对的系统</div>
      <div class="sub">精读一篇，胜过刷一百条 · 我们下期再见</div>
    </div>
  </div>
</body>
</html>
