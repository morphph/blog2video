<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px; background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%; padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column; justify-content: center;
      align-items: center; text-align: center;
    }
    .kicker { font-size: 32px; color: #EF4444; font-weight: 800; margin-bottom: 22px; letter-spacing: 1px; }
    .title { font-size: 60px; font-weight: 800; margin-bottom: 16px; line-height: 1.24; }
    .cost {
      font-size: 34px; color: #EF4444; font-weight: 700; margin-bottom: 44px;
    }
    .cost .snow { color: #F59E0B; }
    .list { display: flex; flex-direction: column; gap: 22px; width: 100%; margin-bottom: 40px; }
    .item {
      background: #1A1A2E; border: 1px solid rgba(16,185,129,0.35);
      border-left: 5px solid #10B981; border-radius: 12px; padding: 26px 28px;
      text-align: left; font-size: 36px; display: flex; align-items: center; gap: 20px;
    }
    .item .mk { color: #10B981; font-weight: 800; font-size: 40px; }
    .item .mono { font-family: 'JetBrains Mono', monospace; color: #B0B0CC; }
    .fit {
      background: #1A1A2E; border: 1px solid rgba(139,92,246,0.4);
      border-left: 5px solid #8B5CF6; border-radius: 12px;
      padding: 30px 28px; width: 100%; text-align: left; font-size: 34px; line-height: 1.42;
    }
    .fit b { color: #8B5CF6; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="kicker">泼盆冷水：自主性是有代价的</div>
    <div class="title">更高的成本 + 误差累积</div>
    <div class="cost">一步错，可能<span class="snow">步步错</span> —— 错误会滚雪球</div>
    <div class="list">
      <div class="item"><span class="mk">✓</span> 在沙盒里大量测试</div>
      <div class="item"><span class="mk">✓</span> 加护栏</div>
      <div class="item"><span class="mk">✓</span> 设停止条件 <span class="mono">（如最多循环 N 次）</span></div>
    </div>
    <div class="fit"><b>Agent 适合：</b>开放式问题 —— 你预测不了几步，也没法把路径写死</div>
  </div>
</body>
</html>
