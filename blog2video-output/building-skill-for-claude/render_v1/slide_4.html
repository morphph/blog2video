<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 120px 72px 520px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .title {
      font-size: 44px;
      font-weight: 800;
      margin-bottom: 52px;
      line-height: 1.3;
    }
    .title .accent {
      color: #F59E0B;
    }
    .checklist {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .check-item {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 28px 32px;
      text-align: left;
      display: flex;
      gap: 20px;
      align-items: flex-start;
    }
    .check-item.item-1 { border-left: 4px solid #EF4444; }
    .check-item.item-2 { border-left: 4px solid #8B5CF6; }
    .check-item.item-3 { border-left: 4px solid #10B981; }
    .check-num {
      font-size: 48px;
      font-weight: 800;
      flex-shrink: 0;
      line-height: 1;
      margin-top: 4px;
    }
    .item-1 .check-num { color: #EF4444; }
    .item-2 .check-num { color: #8B5CF6; }
    .item-3 .check-num { color: #10B981; }
    .check-content {
      flex: 1;
    }
    .check-label {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .item-1 .check-label { color: #EF4444; }
    .item-2 .check-label { color: #8B5CF6; }
    .item-3 .check-label { color: #10B981; }
    .check-desc {
      font-size: 24px;
      color: #B0B0CC;
      line-height: 1.5;
    }
    .check-example {
      font-size: 21px;
      color: #6B7280;
      margin-top: 6px;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="title">什么任务适合做成 <span class="accent">Skill</span>？</div>

    <div class="checklist">
      <div class="check-item item-1">
        <div class="check-num">1</div>
        <div class="check-content">
          <div class="check-label">重复性偏好设定</div>
          <div class="check-desc">每次都在重复同一段提示词</div>
          <div class="check-example">"用 TypeScript，不要 any，kebab-case"</div>
        </div>
      </div>

      <div class="check-item item-2">
        <div class="check-num">2</div>
        <div class="check-content">
          <div class="check-label">多步骤工作流编排</div>
          <div class="check-desc">有一套固定的多步流程</div>
          <div class="check-example">"提取颜色 → 生成代码 → 跑测试"</div>
        </div>
      </div>

      <div class="check-item item-3">
        <div class="check-num">3</div>
        <div class="check-content">
          <div class="check-label">团队水平拉齐</div>
          <div class="check-desc">不同人的 Claude 使用效果参差不齐</div>
          <div class="check-example">把最佳实践固化，全员统一标准</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
