<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 120px 72px 520px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .title {
      font-size: 44px;
      font-weight: 800;
      margin-bottom: 48px;
      line-height: 1.3;
    }
    .title .accent {
      color: #8B5CF6;
    }
    .summary-grid {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 40px;
    }
    .summary-row {
      display: flex;
      gap: 20px;
    }
    .summary-card {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 24px;
      flex: 1;
      text-align: center;
    }
    .summary-card.full { flex: none; width: 100%; }
    .summary-card .num {
      font-size: 56px;
      font-weight: 800;
      color: #8B5CF6;
      margin-bottom: 8px;
    }
    .summary-card .num.green { color: #10B981; }
    .summary-card .num.yellow { color: #F59E0B; }
    .summary-card .label {
      font-size: 24px;
      color: #B0B0CC;
      line-height: 1.4;
    }
    .cta-card {
      background: rgba(139, 92, 246, 0.1);
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-left: 4px solid #8B5CF6;
      border-radius: 12px;
      padding: 28px 36px;
      width: 100%;
      text-align: left;
    }
    .cta-title {
      font-size: 28px;
      font-weight: 700;
      color: #8B5CF6;
      margin-bottom: 12px;
    }
    .cta-steps {
      font-size: 24px;
      color: #B0B0CC;
      line-height: 1.8;
    }
    .cta-steps .hl {
      color: #F59E0B;
      font-weight: 700;
    }
    .outro {
      margin-top: 40px;
      font-size: 26px;
      color: #6B7280;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="title">Skill = 给 Claude 的<br><span class="accent">"工作手册"</span></div>

    <div class="summary-grid">
      <div class="summary-row">
        <div class="summary-card">
          <div class="num">1</div>
          <div class="label">文件夹 +<br>SKILL.md</div>
        </div>
        <div class="summary-card">
          <div class="num green">3</div>
          <div class="label">层渐进式<br>加载</div>
        </div>
        <div class="summary-card">
          <div class="num yellow">3</div>
          <div class="label">端通用<br>Claude.ai / Code / API</div>
        </div>
      </div>
    </div>

    <div class="cta-card">
      <div class="cta-title">现在就试试</div>
      <div class="cta-steps">
        1. 建一个文件夹<br>
        2. 放一个 <span class="hl">SKILL.md</span><br>
        3. 写上名称 + 你最常重复的工作流<br>
        4. <span class="hl">15 分钟</span>搞定
      </div>
    </div>

    <div class="outro">AI精读 &middot; 精读一篇，胜过刷一百条</div>
  </div>
</body>
</html>
