<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 120px 72px 520px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    /* Radial glow behind title */
    .slide::before {
      content: '';
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 700px;
      height: 700px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.1) 0%, rgba(139, 92, 246, 0.03) 40%, transparent 70%);
      pointer-events: none;
    }
    .series-tag {
      font-size: 28px;
      color: #8B5CF6;
      letter-spacing: 2px;
      margin-bottom: 52px;
      font-weight: 500;
    }
    .main-title {
      font-size: 68px;
      font-weight: 900;
      line-height: 1.35;
      margin-bottom: 56px;
      position: relative;
      z-index: 1;
    }
    .highlight-red { color: #EF4444; }
    .highlight-yellow { color: #F59E0B; }
    .source-tag {
      display: inline-block;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 999px;
      padding: 12px 32px;
      font-size: 24px;
      color: #B0B0CC;
      position: relative;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="series-tag">AI精读 &middot; Skill 构建</div>
    <div class="main-title">
      从<span class="highlight-red">规划</span>到<span class="highlight-red">测试</span><br>
      手把手造<br>
      Claude <span class="highlight-yellow">技能包</span>
    </div>
    <div class="source-tag">Anthropic &laquo;The Complete Guide to Building Skills for Claude&raquo;</div>
  </div>
</body>
</html>
