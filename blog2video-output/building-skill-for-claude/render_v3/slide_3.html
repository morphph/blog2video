<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 120px 72px 520px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .section-label {
      font-size: 24px;
      color: #F59E0B;
      letter-spacing: 3px;
      font-weight: 600;
      margin-bottom: 28px;
    }
    .main-title {
      font-size: 48px;
      font-weight: 800;
      margin-bottom: 36px;
    }
    .main-title .yellow {
      color: #F59E0B;
    }
    .cards-wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .card {
      width: 100%;
      background: #1A1A30;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 28px;
      text-align: left;
    }
    .card.green {
      border-left: 4px solid #10B981;
    }
    .card.blue {
      border-left: 4px solid #3B82F6;
    }
    .card.purple {
      border-left: 4px solid #8B5CF6;
    }
    .card-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 12px;
    }
    .card-number {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 800;
      flex-shrink: 0;
    }
    .card.green .card-number {
      background: rgba(16, 185, 129, 0.2);
      color: #10B981;
    }
    .card.blue .card-number {
      background: rgba(59, 130, 246, 0.2);
      color: #3B82F6;
    }
    .card.purple .card-number {
      background: rgba(139, 92, 246, 0.2);
      color: #8B5CF6;
    }
    .card-title {
      font-size: 32px;
      font-weight: 700;
    }
    .card.green .card-title { color: #10B981; }
    .card.blue .card-title { color: #3B82F6; }
    .card.purple .card-title { color: #8B5CF6; }
    .card-desc {
      font-size: 24px;
      color: #B0B0CC;
      line-height: 1.5;
      margin-bottom: 10px;
    }
    .card-example {
      font-size: 22px;
      color: #8B8BA0;
      font-style: italic;
    }
    .card-example .tag {
      display: inline-block;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 6px;
      padding: 2px 10px;
      font-style: normal;
      font-size: 20px;
      color: #B0B0CC;
      margin-right: 4px;
    }
    .more-note {
      width: 100%;
      margin-top: 24px;
      padding: 18px 24px;
      border-left: 4px solid #6B7280;
      background: rgba(107, 114, 128, 0.06);
      border-radius: 0 8px 8px 0;
      font-size: 24px;
      color: #8B8BA0;
      text-align: left;
    }
    .more-note .em {
      color: #B0B0CC;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="section-label">FIVE PATTERNS</div>
    <div class="main-title">MCP + Skill <span class="yellow">五大模式</span></div>

    <div class="cards-wrapper">
      <div class="card green">
        <div class="card-header">
          <div class="card-number">1</div>
          <div class="card-title">顺序工作流编排</div>
        </div>
        <div class="card-desc">固定流程自动按顺序执行</div>
        <div class="card-example"><span class="tag">创建账户</span><span class="tag">配置支付</span><span class="tag">开通订阅</span><span class="tag">发邮件</span></div>
      </div>

      <div class="card blue">
        <div class="card-header">
          <div class="card-number">2</div>
          <div class="card-title">多 MCP 协调</div>
        </div>
        <div class="card-desc">Skill 像 SOP 手册，串联跨平台</div>
        <div class="card-example"><span class="tag">Figma</span><span class="tag">Drive</span><span class="tag">Linear</span><span class="tag">Slack</span> 四个 MCP 协同</div>
      </div>

      <div class="card purple">
        <div class="card-header">
          <div class="card-number">3</div>
          <div class="card-title">上下文感知工具选择</div>
        </div>
        <div class="card-desc">不同条件 → 自动选不同工具</div>
        <div class="card-example">大文件→云存储 / 协作→Notion / 代码→GitHub</div>
      </div>
    </div>

    <div class="more-note">
      另外两个：<span class="em">迭代优化</span>（报告打磨）+ <span class="em">领域专业知识</span>（合规检查）
    </div>
  </div>
</body>
</html>
