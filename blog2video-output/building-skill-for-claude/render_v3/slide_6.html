<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 120px 72px 520px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .section-label {
      font-size: 24px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 600;
      margin-bottom: 36px;
    }
    .summary-title {
      font-size: 46px;
      font-weight: 800;
      line-height: 1.45;
      margin-bottom: 44px;
    }
    .summary-title .green {
      color: #10B981;
    }
    .summary-title .red {
      color: #EF4444;
    }
    .two-points {
      width: 100%;
      display: flex;
      gap: 16px;
      margin-bottom: 40px;
    }
    .point {
      flex: 1;
      background: #1A1A30;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 28px 20px;
      text-align: center;
    }
    .point:nth-child(1) {
      border-top: 3px solid #3B82F6;
    }
    .point:nth-child(2) {
      border-top: 3px solid #10B981;
    }
    .point-icon {
      font-size: 40px;
      margin-bottom: 14px;
    }
    .point-label {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .point:nth-child(1) .point-label { color: #3B82F6; }
    .point:nth-child(2) .point-label { color: #10B981; }
    .point-desc {
      font-size: 22px;
      color: #B0B0CC;
    }
    .action-box {
      width: 100%;
      background: rgba(139, 92, 246, 0.08);
      border: 1px solid rgba(139, 92, 246, 0.4);
      border-left: 4px solid #8B5CF6;
      border-radius: 12px;
      padding: 28px;
      margin-bottom: 36px;
      text-align: center;
    }
    .action-label {
      font-size: 22px;
      color: #8B5CF6;
      font-weight: 700;
      margin-bottom: 16px;
      letter-spacing: 2px;
    }
    .action-text {
      font-size: 26px;
      color: #B0B0CC;
      line-height: 1.7;
    }
    .action-text .em {
      color: #F59E0B;
      font-weight: 700;
    }
    .action-text .code {
      color: #F59E0B;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 22px;
      background: rgba(245, 158, 11, 0.1);
      padding: 2px 8px;
      border-radius: 4px;
    }
    .sign-off {
      font-size: 28px;
      color: #8B8BA0;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="section-label">SUMMARY</div>
    <div class="summary-title">
      MCP 让 Claude <span class="green">连得上</span><br>
      Skill 让 Claude <span class="green">用得好</span><br>
      只建厨房不写菜谱 = <span class="red">白搭</span>
    </div>

    <div class="two-points">
      <div class="point">
        <div class="point-icon">🔌</div>
        <div class="point-label">MCP</div>
        <div class="point-desc">连接能力</div>
      </div>
      <div class="point">
        <div class="point-icon">📋</div>
        <div class="point-label">Skill</div>
        <div class="point-desc">使用智慧</div>
      </div>
    </div>

    <div class="action-box">
      <div class="action-label">NOW DO THIS</div>
      <div class="action-text">
        选你最常用的一个 MCP 集成<br>
        （如 <span class="em">Notion</span> 或 <span class="em">Linear</span>）<br>
        把手动步骤写成 Skill<br>
        放到 <span class="code">Settings → Capabilities</span>
      </div>
    </div>

    <div class="sign-off">精读一篇，胜过刷一百条</div>
  </div>
</body>
</html>
