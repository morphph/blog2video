<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px; background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 100px 72px 180px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
    }
    .bg-glow {
      position: absolute; width: 900px; height: 900px; border-radius: 50%;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.13) 0%, transparent 70%);
      top: 100px; left: 50%; transform: translateX(-50%); pointer-events: none;
    }
    .bg-glow-2 {
      position: absolute; width: 600px; height: 600px; border-radius: 50%;
      background: radial-gradient(circle, rgba(239, 68, 68, 0.07) 0%, transparent 70%);
      top: 900px; left: 60%; transform: translateX(-50%); pointer-events: none;
    }
    .series-tag {
      display: inline-block; background: rgba(139, 92, 246, 0.15);
      border: 1px solid rgba(139, 92, 246, 0.4); color: #8B5CF6;
      font-size: 30px; font-weight: 600; padding: 12px 36px;
      border-radius: 50px; letter-spacing: 3px; margin-bottom: 56px;
      position: relative; z-index: 1;
    }
    .main-title {
      font-size: 96px; font-weight: 900; line-height: 1.2;
      margin-bottom: 44px; position: relative; z-index: 1;
    }
    .main-title .highlight-yellow { color: #F59E0B; }
    .main-title .highlight-red { color: #EF4444; }
    .sub-line {
      font-size: 40px; color: #B0B0CC; line-height: 1.55;
      margin-bottom: 64px; position: relative; z-index: 1;
    }
    .pain-cards {
      display: flex; gap: 24px; width: 100%;
      margin-bottom: 56px; position: relative; z-index: 1;
    }
    .pain-card {
      flex: 1; background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-top: 3px solid #EF4444;
      border-radius: 12px; padding: 28px 20px;
      text-align: center;
    }
    .pain-card .icon { font-size: 36px; margin-bottom: 12px; }
    .pain-card .text { font-size: 26px; color: #B0B0CC; line-height: 1.4; }
    .source-capsule {
      display: inline-block; background: #1A1A30;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 40px; padding: 12px 28px; font-size: 22px;
      color: #6B6B80; position: relative; z-index: 1;
    }
    .source-capsule span { color: #8B8BA0; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="bg-glow"></div>
    <div class="bg-glow-2"></div>
    <div class="series-tag">AI精读 · Claude Skills</div>
    <div class="main-title">
      每次都在<span class="highlight-yellow">重新教AI</span><br>
      <span class="highlight-red">你不累吗？</span>
    </div>
    <div class="sub-line">
      Claude官方出了"技能包"解法
    </div>
    <div class="pain-cards">
      <div class="pain-card">
        <div class="icon">😮‍💨</div>
        <div class="text">换个任务<br>又从头说</div>
      </div>
      <div class="pain-card">
        <div class="icon">🔁</div>
        <div class="text">同样的话<br>说了十几遍</div>
      </div>
      <div class="pain-card">
        <div class="icon">💸</div>
        <div class="text">Token烧了<br>全是废话</div>
      </div>
    </div>
    <div class="source-capsule"><span>Anthropic</span>《The Complete Guide to Building Skills for Claude》</div>
  </div>
</body>
</html>
