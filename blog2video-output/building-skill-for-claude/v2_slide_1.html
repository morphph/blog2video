<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 120px 72px 520px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .series-tag {
      font-size: 26px;
      color: #8B5CF6;
      letter-spacing: 3px;
      margin-bottom: 48px;
      font-weight: 500;
    }
    .main-title {
      font-size: 68px;
      font-weight: 900;
      line-height: 1.3;
      margin-bottom: 56px;
    }
    .highlight-yellow { color: #F59E0B; }
    .highlight-red { color: #EF4444; }
    .hook-card {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-left: 4px solid #EF4444;
      border-radius: 12px;
      padding: 28px 36px;
      width: 100%;
      text-align: left;
      margin-bottom: 32px;
    }
    .hook-text {
      font-size: 32px;
      color: #B0B0CC;
      line-height: 1.6;
    }
    .hook-text em {
      font-style: normal;
      color: #EF4444;
      font-weight: 700;
    }
    .bottom-hint {
      font-size: 24px;
      color: #6B7280;
      margin-top: 12px;
    }
    /* subtle glow behind title */
    .slide::before {
      content: '';
      position: absolute;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.08) 0%, transparent 70%);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="series-tag">AI精读 &middot; Skill 构建</div>
    <div class="main-title">
      知道 Skill <span class="highlight-yellow">是什么</span><br>
      和<span class="highlight-red">怎么建</span>之间<br>
      隔着一条鸿沟
    </div>
    <div class="hook-card">
      <div class="hook-text">
        一个文件夹 + 一个 SKILL.md<br>
        就能让 Claude 永久记住工作流<br>
        但很多人打开编辑器，<em>第一行就卡住了</em>
      </div>
    </div>
    <div class="bottom-hint">从零开始建 Skill 的完整流程</div>
  </div>
</body>
</html>
