<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 120px 72px 520px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .section-label {
      font-size: 22px;
      color: #8B5CF6;
      letter-spacing: 3px;
      margin-bottom: 20px;
      font-weight: 500;
    }
    .title {
      font-size: 52px;
      font-weight: 800;
      margin-bottom: 48px;
      line-height: 1.3;
    }
    .title .accent { color: #8B5CF6; }
    .cards-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .category-card {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 28px 32px;
      display: flex;
      align-items: flex-start;
      gap: 24px;
      text-align: left;
    }
    .category-card.doc { border-left: 4px solid #3B82F6; }
    .category-card.workflow { border-left: 4px solid #8B5CF6; }
    .category-card.mcp { border-left: 4px solid #10B981; }
    .card-icon {
      font-size: 44px;
      flex-shrink: 0;
      width: 56px;
      text-align: center;
      line-height: 1;
      margin-top: 4px;
    }
    .card-content {
      flex: 1;
    }
    .card-title {
      font-size: 34px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .card-title.blue { color: #3B82F6; }
    .card-title.purple { color: #8B5CF6; }
    .card-title.green { color: #10B981; }
    .card-desc {
      font-size: 26px;
      color: #B0B0CC;
      line-height: 1.5;
    }
    .card-example {
      font-size: 22px;
      color: #6B7280;
      margin-top: 6px;
    }
    .analogy-bar {
      margin-top: 36px;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 20px 28px;
      width: 100%;
      text-align: center;
    }
    .analogy-text {
      font-size: 26px;
      color: #B0B0CC;
      line-height: 1.5;
    }
    .analogy-text em {
      font-style: normal;
      color: #F59E0B;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="section-label">STEP 1</div>
    <div class="title">好用的 Skill 只有<span class="accent">三大类</span></div>
    <div class="cards-container">
      <div class="category-card doc">
        <div class="card-icon">&#x1F4C4;</div>
        <div class="card-content">
          <div class="card-title blue">文档 & 资产生成</div>
          <div class="card-desc">直接产出成品</div>
          <div class="card-example">例：frontend-design 技能</div>
        </div>
      </div>
      <div class="category-card workflow">
        <div class="card-icon">&#x26A1;</div>
        <div class="card-content">
          <div class="card-title purple">工作流自动化</div>
          <div class="card-desc">多步骤流程一键触发</div>
          <div class="card-example">例：skill-creator 技能</div>
        </div>
      </div>
      <div class="category-card mcp">
        <div class="card-icon">&#x1F517;</div>
        <div class="card-content">
          <div class="card-title green">MCP 增强</div>
          <div class="card-desc">给工具服务器加工作流指导</div>
          <div class="card-example">例：Sentry 代码审查技能</div>
        </div>
      </div>
    </div>
    <div class="analogy-bar">
      <div class="analogy-text">像厨师分工：<em>做菜</em> / <em>管流程</em> / <em>通食材</em></div>
    </div>
  </div>
</body>
</html>
