<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 120px 72px 520px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .section-label {
      font-size: 22px;
      color: #8B5CF6;
      letter-spacing: 3px;
      margin-bottom: 20px;
      font-weight: 500;
    }
    .title {
      font-size: 48px;
      font-weight: 800;
      margin-bottom: 16px;
      line-height: 1.3;
    }
    .title .accent { color: #F59E0B; }
    .subtitle {
      font-size: 26px;
      color: #B0B0CC;
      margin-bottom: 40px;
    }
    .comparison {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 32px;
    }
    .comp-card {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 24px 28px;
      text-align: left;
    }
    .comp-card.good {
      border-left: 4px solid #10B981;
    }
    .comp-card.bad {
      border-left: 4px solid #EF4444;
    }
    .comp-label {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .comp-label.good-label { color: #10B981; }
    .comp-label.bad-label { color: #EF4444; }
    .comp-text {
      font-size: 26px;
      color: #B0B0CC;
      line-height: 1.5;
      font-style: italic;
    }
    .comp-text .keyword {
      color: #FFFFFF;
      font-weight: 600;
      font-style: normal;
    }
    .formula-card {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-left: 4px solid #8B5CF6;
      border-radius: 12px;
      padding: 28px 32px;
      width: 100%;
      text-align: left;
    }
    .formula-title {
      font-size: 28px;
      font-weight: 700;
      color: #8B5CF6;
      margin-bottom: 16px;
    }
    .formula-steps {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .formula-step {
      font-size: 28px;
      color: #FFFFFF;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .step-num {
      background: #8B5CF6;
      color: #FFFFFF;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .step-text {
      font-size: 27px;
      line-height: 1.4;
    }
    .warn-bar {
      margin-top: 24px;
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.2);
      border-radius: 12px;
      padding: 16px 24px;
      width: 100%;
      text-align: center;
    }
    .warn-text {
      font-size: 24px;
      color: #EF4444;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="section-label">STEP 2 &middot; 最关键一步</div>
    <div class="title">YAML <span class="accent">Description</span></div>
    <div class="subtitle">决定 Claude 何时触发你的 Skill</div>
    <div class="comparison">
      <div class="comp-card good">
        <div class="comp-label good-label">&#x2705; Good</div>
        <div class="comp-text">"分析 <span class="keyword">Figma 设计文件</span>并生成开发交接文档。当用户上传 fig 文件，或要求生成<span class="keyword">设计规范</span>时使用。"</div>
      </div>
      <div class="comp-card bad">
        <div class="comp-label bad-label">&#x274C; Bad</div>
        <div class="comp-text">"<span class="keyword">帮助处理项目。</span>"</div>
      </div>
    </div>
    <div class="formula-card">
      <div class="formula-title">三段式写法</div>
      <div class="formula-steps">
        <div class="formula-step">
          <div class="step-num">1</div>
          <div class="step-text">它<strong>做什么</strong></div>
        </div>
        <div class="formula-step">
          <div class="step-num">2</div>
          <div class="step-text"><strong>什么时候</strong>用</div>
        </div>
        <div class="formula-step">
          <div class="step-num">3</div>
          <div class="step-text">列<strong>核心能力</strong></div>
        </div>
      </div>
    </div>
    <div class="warn-bar">
      <div class="warn-text">&#x26A0; &le;1024 字符 &middot; 禁止 XML 标签 &middot; 文件名必须 SKILL.md</div>
    </div>
  </div>
</body>
</html>
