<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 120px 72px 520px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .section-label {
      font-size: 24px;
      color: #10B981;
      letter-spacing: 3px;
      font-weight: 600;
      margin-bottom: 28px;
    }
    .main-title {
      font-size: 48px;
      font-weight: 800;
      margin-bottom: 44px;
    }
    .main-title .green {
      color: #10B981;
    }
    /* Case study card */
    .case-card {
      width: 100%;
      background: #1A1A30;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-left: 4px solid #3B82F6;
      border-radius: 12px;
      padding: 28px;
      text-align: left;
      margin-bottom: 28px;
    }
    .case-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
    }
    .case-logo {
      width: 48px;
      height: 48px;
      background: rgba(59, 130, 246, 0.15);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      flex-shrink: 0;
    }
    .case-name {
      font-size: 30px;
      font-weight: 700;
      color: #3B82F6;
    }
    .case-skill-name {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 22px;
      color: #F59E0B;
      background: rgba(245, 158, 11, 0.1);
      padding: 4px 12px;
      border-radius: 6px;
      display: inline-block;
      margin-bottom: 16px;
    }
    .case-desc {
      font-size: 26px;
      color: #B0B0CC;
      line-height: 1.6;
      margin-bottom: 18px;
    }
    .flow-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .flow-tag {
      background: rgba(59, 130, 246, 0.12);
      border: 1px solid rgba(59, 130, 246, 0.3);
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 22px;
      color: #3B82F6;
      font-weight: 600;
    }
    .flow-arrow {
      font-size: 22px;
      color: #6B7280;
    }
    .flow-tag.skill {
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #10B981;
    }
    /* Debug tip */
    .tip-card {
      width: 100%;
      background: rgba(245, 158, 11, 0.06);
      border: 1px solid rgba(245, 158, 11, 0.25);
      border-left: 4px solid #F59E0B;
      border-radius: 12px;
      padding: 24px 28px;
      text-align: left;
    }
    .tip-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }
    .tip-icon {
      font-size: 26px;
    }
    .tip-label {
      font-size: 24px;
      color: #F59E0B;
      font-weight: 700;
      letter-spacing: 2px;
    }
    .tip-text {
      font-size: 26px;
      color: #B0B0CC;
      line-height: 1.6;
    }
    .tip-text .em {
      color: #F59E0B;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="section-label">CASE STUDY</div>
    <div class="main-title">Sentry <span class="green">实战案例</span></div>

    <div class="case-card">
      <div class="case-header">
        <div class="case-logo">🛡️</div>
        <div class="case-name">Sentry Code Review</div>
      </div>
      <div class="case-skill-name">sentry-code-review</div>
      <div class="case-desc">自动分析 GitHub PR 中<br>Sentry 检测到的 Bug → 给修复建议</div>
      <div class="flow-row">
        <div class="flow-tag">Sentry MCP</div>
        <div class="flow-arrow">+</div>
        <div class="flow-tag">GitHub MCP</div>
        <div class="flow-arrow">→</div>
        <div class="flow-tag skill">Skill 串联</div>
      </div>
    </div>

    <div class="tip-card">
      <div class="tip-header">
        <div class="tip-icon">💡</div>
        <div class="tip-label">调试技巧</div>
      </div>
      <div class="tip-text">
        关键验证用<span class="em">脚本</span>，不用语言指令<br>
        代码是确定性的，语言理解不是
      </div>
    </div>
  </div>
</body>
</html>
