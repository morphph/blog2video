<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .cover {
      width: 100%;
      height: 100%;
      padding: 100px 72px 400px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
      background:
        radial-gradient(circle at 50% 40%, rgba(239, 68, 68, 0.18), transparent 55%),
        radial-gradient(circle at 50% 70%, rgba(139, 92, 246, 0.12), transparent 60%),
        #0D0D1A;
    }
    .series-label {
      font-size: 30px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 56px;
    }
    .main-title {
      font-size: 124px;
      font-weight: 900;
      line-height: 1.15;
      letter-spacing: -2px;
      margin-bottom: 72px;
    }
    .main-title .red {
      color: #EF4444;
    }
    .source-tag {
      display: inline-block;
      padding: 16px 32px;
      background: #1A1A30;
      border-radius: 999px;
      font-size: 22px;
      color: #6B6B80;
      font-weight: 500;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div class="cover">
    <div class="series-label">精读AI · Codex /goal</div>
    <h1 class="main-title">Agent <span class="red">死循环</span>？<br>目标定错了</h1>
    <div class="source-tag">OpenAI · Chris Hayduk《Using Codex Goals Effectively》</div>
  </div>
</body>
</html>
