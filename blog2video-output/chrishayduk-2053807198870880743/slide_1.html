<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
      background:
        radial-gradient(circle at 50% 30%, rgba(139, 92, 246, 0.15), transparent 60%),
        #0D0D1A;
    }
    .series-label {
      font-size: 28px;
      color: #8B5CF6;
      letter-spacing: 4px;
      font-weight: 600;
      margin-bottom: 40px;
    }
    .command-badge {
      display: inline-block;
      padding: 10px 24px;
      background: rgba(139, 92, 246, 0.15);
      border: 1px solid rgba(139, 92, 246, 0.4);
      border-radius: 999px;
      font-family: 'JetBrains Mono', 'Menlo', monospace;
      font-size: 26px;
      color: #C4B5FD;
      letter-spacing: 1px;
      margin-bottom: 48px;
    }
    .main-title {
      font-size: 104px;
      font-weight: 900;
      line-height: 1.15;
      letter-spacing: -1px;
      margin-bottom: 28px;
    }
    .main-title .red {
      color: #EF4444;
    }
    .subtitle {
      font-size: 32px;
      color: #B0B0CC;
      font-weight: 500;
      margin-bottom: 64px;
    }
    .cards {
      display: flex;
      gap: 24px;
      width: 100%;
      justify-content: center;
      margin-bottom: 48px;
    }
    .card {
      flex: 1;
      background: #1A1A2E;
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-left: 4px solid #EF4444;
      border-radius: 12px;
      padding: 32px 24px;
      text-align: center;
    }
    .card-emoji {
      font-size: 42px;
      margin-bottom: 12px;
    }
    .card-title {
      font-size: 38px;
      font-weight: 800;
      color: #EF4444;
      margin-bottom: 10px;
    }
    .card-desc {
      font-size: 24px;
      color: #B0B0CC;
      line-height: 1.4;
    }
    .source-tag {
      display: inline-block;
      padding: 14px 28px;
      background: #1A1A30;
      border-radius: 999px;
      font-size: 22px;
      color: #6B6B80;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="series-label">精读AI · Codex /goal</div>
    <div class="command-badge">/goal</div>
    <h1 class="main-title">Agent <span class="red">死循环</span>？<br>目标定错了</h1>
    <div class="subtitle">大多数人都在用错 /goal</div>
    <div class="cards">
      <div class="card">
        <div class="card-emoji">⏱️</div>
        <div class="card-title">早退</div>
        <div class="card-desc">几分钟就<br>放弃</div>
      </div>
      <div class="card">
        <div class="card-emoji">🔁</div>
        <div class="card-title">死循环</div>
        <div class="card-desc">永远改不停<br>瞎转</div>
      </div>
    </div>
    <div class="source-tag">OpenAI · Chris Hayduk —《Using Codex Goals Effectively》</div>
  </div>
</body>
</html>
