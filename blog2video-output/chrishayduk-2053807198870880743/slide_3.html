<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .label {
      font-size: 22px;
      color: #EF4444;
      letter-spacing: 3px;
      font-weight: 600;
      margin-bottom: 24px;
    }
    .title {
      font-size: 64px;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 16px;
    }
    .title .red {
      color: #EF4444;
    }
    .sub {
      font-size: 28px;
      color: #B0B0CC;
      margin-bottom: 52px;
      line-height: 1.5;
    }
    .compare {
      width: 100%;
      display: flex;
      gap: 16px;
      margin-bottom: 32px;
    }
    .col {
      flex: 1;
      background: #1A1A2E;
      border-radius: 12px;
      padding: 28px 22px;
      text-align: center;
    }
    .col.neutral {
      border: 1px solid rgba(176, 176, 204, 0.25);
      border-left: 4px solid #6B7280;
    }
    .col-tag {
      font-size: 20px;
      color: #6B7280;
      letter-spacing: 2px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .col-title {
      font-size: 30px;
      font-weight: 800;
      color: #FFFFFF;
      margin-bottom: 14px;
      line-height: 1.3;
    }
    .col-effect {
      font-size: 24px;
      color: #B0B0CC;
      line-height: 1.4;
    }
    .vs {
      align-self: center;
      font-size: 28px;
      color: #6B7280;
      font-weight: 800;
    }
    .danger-cards {
      width: 100%;
      display: flex;
      gap: 18px;
    }
    .danger {
      flex: 1;
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.45);
      border-left: 4px solid #EF4444;
      border-radius: 12px;
      padding: 26px 22px;
      text-align: center;
    }
    .danger-emoji {
      font-size: 36px;
      margin-bottom: 10px;
    }
    .danger-title {
      font-size: 32px;
      font-weight: 800;
      color: #EF4444;
      margin-bottom: 8px;
    }
    .danger-desc {
      font-size: 22px;
      color: #FCA5A5;
      line-height: 1.4;
    }
    .conclusion {
      margin-top: 28px;
      font-size: 28px;
      color: #F59E0B;
      font-weight: 700;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="label">REVERSE INTUITION</div>
    <h1 class="title">模糊提示的<span class="red">两种死法</span></h1>
    <div class="sub">同一种模糊，两种相反的崩溃</div>
    <div class="compare">
      <div class="col neutral">
        <div class="col-tag">对话时代</div>
        <div class="col-title">质量打折</div>
        <div class="col-effect">连续劣化<br>差一点</div>
      </div>
      <div class="vs">→</div>
      <div class="col neutral" style="border-left-color:#EF4444;border-color:rgba(239,68,68,0.4);">
        <div class="col-tag" style="color:#EF4444;">Agent 循环</div>
        <div class="col-title" style="color:#EF4444;">两个极端</div>
        <div class="col-effect">非此即彼<br>直接崩溃</div>
      </div>
    </div>
    <div class="danger-cards">
      <div class="danger">
        <div class="danger-emoji">⏱️</div>
        <div class="danger-title">早退</div>
        <div class="danger-desc">几分钟就放弃<br>"差不多了吧"</div>
      </div>
      <div class="danger">
        <div class="danger-emoji">🔁</div>
        <div class="danger-title">死循环</div>
        <div class="danger-desc">永远改不停<br>追一个追不到的目标</div>
      </div>
    </div>
    <div class="conclusion">这是质变，不是量变</div>
  </div>
</body>
</html>
