<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .label {
      font-size: 22px;
      color: #10B981;
      letter-spacing: 3px;
      font-weight: 600;
      margin-bottom: 24px;
    }
    .title {
      font-size: 60px;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 14px;
    }
    .title .green {
      color: #10B981;
    }
    .sub {
      font-size: 26px;
      color: #B0B0CC;
      margin-bottom: 44px;
    }
    .example {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(16, 185, 129, 0.35);
      border-left: 4px solid #10B981;
      border-radius: 12px;
      padding: 28px 24px;
      margin-bottom: 32px;
      text-align: left;
    }
    .example-label {
      font-size: 20px;
      color: #10B981;
      letter-spacing: 2px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .example-text {
      font-size: 28px;
      line-height: 1.5;
      color: #E5E7EB;
    }
    .example-text .num {
      color: #10B981;
      font-weight: 800;
    }
    .example-text .hard {
      color: #F59E0B;
      font-weight: 700;
    }
    .badges {
      width: 100%;
      display: flex;
      gap: 18px;
      margin-bottom: 32px;
    }
    .badge {
      flex: 1;
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.45);
      border-left: 4px solid #10B981;
      border-radius: 12px;
      padding: 28px 22px;
      text-align: center;
    }
    .badge-tag {
      font-size: 22px;
      color: #10B981;
      letter-spacing: 2px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .badge-big {
      font-size: 64px;
      font-weight: 800;
      color: #10B981;
      line-height: 1.1;
      margin-bottom: 8px;
    }
    .badge-desc {
      font-size: 24px;
      color: #B0B0CC;
    }
    .why {
      font-size: 24px;
      color: #B0B0CC;
      line-height: 1.5;
      max-width: 920px;
    }
    .why strong {
      color: #F59E0B;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="label">THE FIX</div>
    <h1 class="title">好目标 = <span class="green">数字</span> + <span class="green">硬约束</span></h1>
    <div class="sub">可量化目标 + 可验证边界</div>
    <div class="example">
      <div class="example-label">PROMPT 范例</div>
      <div class="example-text">把某个文件里的代码运行时间<span class="num">减少 20%</span>，<span class="hard">同时单元测试和集成测试不能出现任何回归</span>。</div>
    </div>
    <div class="badges">
      <div class="badge">
        <div class="badge-tag">数字</div>
        <div class="badge-big">-20%</div>
        <div class="badge-desc">运行时</div>
      </div>
      <div class="badge">
        <div class="badge-tag">硬约束</div>
        <div class="badge-big">0</div>
        <div class="badge-desc">测试回归</div>
      </div>
    </div>
    <div class="why">为什么<strong>少一个都不行</strong>？没边界 → 删测试也算"达标"；没数字 → 不知道停在哪。</div>
  </div>
</body>
</html>
