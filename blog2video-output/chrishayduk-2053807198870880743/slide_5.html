<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .label {
      font-size: 22px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 600;
      margin-bottom: 20px;
    }
    .title {
      font-size: 56px;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 12px;
    }
    .title .purple {
      color: #8B5CF6;
    }
    .sub {
      font-size: 26px;
      color: #B0B0CC;
      margin-bottom: 44px;
      line-height: 1.5;
    }
    .compare {
      width: 100%;
      display: flex;
      gap: 18px;
      margin-bottom: 36px;
    }
    .col {
      flex: 1;
      border-radius: 12px;
      padding: 26px 22px;
      text-align: center;
    }
    .col-bad {
      background: rgba(239, 68, 68, 0.06);
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-left: 4px solid #EF4444;
    }
    .col-good {
      background: rgba(16, 185, 129, 0.06);
      border: 1px solid rgba(16, 185, 129, 0.4);
      border-left: 4px solid #10B981;
    }
    .col-tag {
      font-size: 20px;
      letter-spacing: 2px;
      font-weight: 700;
      margin-bottom: 14px;
    }
    .col-bad .col-tag { color: #EF4444; }
    .col-good .col-tag { color: #10B981; }
    .col-mark {
      font-size: 56px;
      margin-bottom: 10px;
    }
    .col-title {
      font-size: 30px;
      font-weight: 800;
      color: #FFFFFF;
      margin-bottom: 10px;
      line-height: 1.3;
    }
    .col-desc {
      font-size: 22px;
      color: #B0B0CC;
      line-height: 1.4;
    }
    .case {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-left: 4px solid #8B5CF6;
      border-radius: 12px;
      padding: 26px 24px;
      text-align: left;
    }
    .case-label {
      font-size: 20px;
      color: #8B5CF6;
      letter-spacing: 2px;
      font-weight: 700;
      margin-bottom: 10px;
    }
    .case-flow {
      font-size: 26px;
      line-height: 1.5;
      color: #E5E7EB;
    }
    .case-flow .big {
      font-size: 38px;
      font-weight: 800;
      color: #F59E0B;
    }
    .case-flow .arrow {
      color: #6B7280;
      margin: 0 8px;
    }
    .insight {
      margin-top: 24px;
      font-size: 26px;
      color: #F59E0B;
      font-weight: 700;
      line-height: 1.4;
      max-width: 920px;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="label">SELF-SCORING</div>
    <h1 class="title">模型可以<span class="purple">当裁判</span></h1>
    <div class="sub">前提：清单足够细</div>
    <div class="compare">
      <div class="col col-bad">
        <div class="col-tag">抽象目标</div>
        <div class="col-mark">❌</div>
        <div class="col-title">"改成 ICML 风格"</div>
        <div class="col-desc">整体感觉<br>模型评不准</div>
      </div>
      <div class="col col-good">
        <div class="col-tag">勾选清单</div>
        <div class="col-mark">✅</div>
        <div class="col-title">200+ 条规则</div>
        <div class="col-desc">局部事实<br>逐条判断</div>
      </div>
    </div>
    <div class="case">
      <div class="case-label">ICML LaTeX → CHECKLIST 技巧</div>
      <div class="case-flow">Codex 自己读 LaTeX 文件<span class="arrow">→</span>抽出 <span class="big">200+</span> 条规则<span class="arrow">→</span>边改边勾</div>
    </div>
    <div class="insight">关键不是"自评不可靠"，而是评分颗粒度</div>
  </div>
</body>
</html>
