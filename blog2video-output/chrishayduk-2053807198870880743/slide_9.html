<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .label {
      font-size: 22px;
      color: #10B981;
      letter-spacing: 3px;
      font-weight: 600;
      margin-bottom: 22px;
    }
    .title {
      font-size: 64px;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 14px;
    }
    .title .green {
      color: #10B981;
    }
    .sub {
      font-size: 26px;
      color: #B0B0CC;
      margin-bottom: 44px;
    }
    .checklist {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 28px;
    }
    .item {
      background: #1A1A2E;
      border: 1px solid rgba(16, 185, 129, 0.35);
      border-left: 4px solid #10B981;
      border-radius: 12px;
      padding: 22px 24px;
      display: flex;
      align-items: center;
      gap: 22px;
      text-align: left;
    }
    .item-num {
      font-size: 48px;
      font-weight: 800;
      color: #10B981;
      min-width: 60px;
      text-align: center;
    }
    .item-text {
      flex: 1;
      font-size: 28px;
      font-weight: 600;
      color: #E5E7EB;
      line-height: 1.4;
    }
    .item-text b {
      color: #F59E0B;
    }
    .signature {
      width: 100%;
      background: rgba(139, 92, 246, 0.1);
      border: 1px solid rgba(139, 92, 246, 0.4);
      border-left: 4px solid #8B5CF6;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 18px;
      font-size: 30px;
      font-weight: 700;
      color: #C4B5FD;
      line-height: 1.4;
    }
    .brand {
      font-size: 24px;
      color: #B0B0CC;
      font-weight: 600;
      line-height: 1.4;
    }
    .brand b {
      color: #F59E0B;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="label">ACTION CHECKLIST</div>
    <h1 class="title">三条<span class="green">行动清单</span></h1>
    <div class="sub">打开 /goal 之前，先问自己</div>
    <div class="checklist">
      <div class="item">
        <div class="item-num">①</div>
        <div class="item-text">目标里有没有<b>数字 + 硬约束</b>？</div>
      </div>
      <div class="item">
        <div class="item-num">②</div>
        <div class="item-text">反馈循环跑一遍要<b>多久</b>？</div>
      </div>
      <div class="item">
        <div class="item-num">③</div>
        <div class="item-text">有没有 <b>EXPERIMENTS.md</b>？</div>
      </div>
    </div>
    <div class="signature">清单不是模板<br>是 Agent 的呼吸方式</div>
    <div class="brand">AI 世界很吵，<b>精读一篇，胜过刷一百条</b></div>
  </div>
</body>
</html>
