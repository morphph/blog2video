<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
      position: relative;
    }
    .bg-glow {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 1300px;
      height: 1300px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.16) 0%, rgba(139, 92, 246, 0.04) 40%, transparent 70%);
      pointer-events: none;
    }
    .slide {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .series-label {
      font-size: 26px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 600;
      margin-bottom: 56px;
    }
    .command {
      display: inline-block;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.4);
      color: #F59E0B;
      font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace;
      font-size: 64px;
      font-weight: 800;
      padding: 18px 56px;
      border-radius: 16px;
      margin-bottom: 56px;
    }
    .title {
      font-size: 78px;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 80px;
      letter-spacing: -1px;
    }
    .title .accent {
      color: #EF4444;
    }
    .title .accent-yellow {
      color: #F59E0B;
    }
    .hint-card {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.25);
      border-left: 4px solid #8B5CF6;
      border-radius: 12px;
      padding: 28px 32px;
      font-size: 30px;
      color: #B0B0CC;
      font-weight: 500;
      line-height: 1.5;
    }
    .hint-card strong {
      color: #FFFFFF;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="slide">
    <div class="series-label">精读AI · Codex Goals</div>
    <div class="command">/goal</div>
    <div class="title">
      连续跑<span class="accent-yellow">几小时</span>，<br>
      甚至<span class="accent">几天</span>
    </div>
    <div class="hint-card">
      OpenAI 内部 FDE Chris Hayduk，<br><strong>真用它跑过几天的科研任务</strong>
    </div>
  </div>
</body>
</html>
