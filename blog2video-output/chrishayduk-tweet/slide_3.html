<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .section-label {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 24px;
      font-weight: 700;
      color: #EF4444;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 32px;
    }
    .section-label::before {
      content: '';
      width: 4px;
      height: 28px;
      background: #EF4444;
    }
    .title {
      font-size: 62px;
      font-weight: 900;
      line-height: 1.22;
      margin-bottom: 24px;
      letter-spacing: -1px;
    }
    .subtitle {
      font-size: 28px;
      color: #B0B0CC;
      font-weight: 500;
      line-height: 1.5;
      margin-bottom: 56px;
      max-width: 880px;
    }
    .subtitle .q {
      color: #6B7280;
      font-style: italic;
    }
    .failures {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .fail-card {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-left: 4px solid #EF4444;
      border-radius: 12px;
      padding: 28px 30px;
      text-align: left;
    }
    .fail-head {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 12px;
    }
    .fail-tag {
      flex-shrink: 0;
      width: 60px;
      height: 60px;
      border-radius: 12px;
      background: rgba(239, 68, 68, 0.18);
      color: #EF4444;
      font-size: 32px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .fail-title {
      font-size: 30px;
      font-weight: 800;
      color: #FFFFFF;
    }
    .fail-desc {
      font-size: 25px;
      color: #B0B0CC;
      line-height: 1.5;
      padding-left: 76px;
    }
    .fail-desc .hl {
      color: #EF4444;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="section-label">THE TRAP</div>
    <div class="title">
      模糊指令<br>在 /goal 模式里是<span style="color:#EF4444">灾难</span>
    </div>
    <div class="subtitle">
      <span class="q">"帮我把这段代码改好一点"</span><br>同一句话，能让 Agent 出两种相反故障
    </div>
    <div class="failures">
      <div class="fail-card">
        <div class="fail-head">
          <div class="fail-tag">A</div>
          <div class="fail-title">几分钟就放弃</div>
        </div>
        <div class="fail-desc">判断不出什么叫"更好"，干脆<span class="hl">早退</span></div>
      </div>
      <div class="fail-card">
        <div class="fail-head">
          <div class="fail-tag">B</div>
          <div class="fail-title">永远停不下来</div>
        </div>
        <div class="fail-desc">目标无法满足，盲目乱改，陷入<span class="hl">死循环</span></div>
      </div>
    </div>
  </div>
</body>
</html>
