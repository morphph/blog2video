<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 100px 72px 400px 72px;
      display: flex; flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .glow {
      position: absolute;
      top: 38%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 700px; height: 700px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, rgba(139, 92, 246, 0.05) 40%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }
    .series-tag {
      font-size: 30px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 600;
      margin-bottom: 64px;
      z-index: 1;
    }
    .title-block {
      z-index: 1;
      margin-bottom: 56px;
    }
    .title-line {
      font-size: 90px;
      font-weight: 900;
      line-height: 1.2;
    }
    .highlight-yellow { color: #F59E0B; }
    .highlight-red { color: #EF4444; }
    .source-tag {
      display: inline-block;
      background: #1A1A30;
      border-radius: 24px;
      padding: 12px 32px;
      font-size: 22px;
      color: #6B6B80;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="glow"></div>
    <div class="series-tag">精读AI · Agent Loop 深度拆解</div>
    <div class="title-block">
      <div class="title-line">Agent Loop</div>
      <div class="title-line">凭什么只用</div>
      <div class="title-line"><span class="highlight-yellow">14种</span><span class="highlight-red">状态</span>？</div>
    </div>
    <div class="source-tag">Claude Code Agent Loop: QueryEngine Deep Dive</div>
  </div>
</body>
</html>
