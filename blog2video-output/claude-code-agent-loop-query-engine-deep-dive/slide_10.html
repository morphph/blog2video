<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .section-label {
      font-size: 22px;
      color: #EF4444;
      letter-spacing: 4px;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 32px;
    }
    .main-title {
      font-size: 44px;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 40px;
    }
    .main-title .accent { color: #EF4444; }
    .retry-flow {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .retry-card {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 18px 22px;
      display: flex;
      align-items: center;
      gap: 16px;
      text-align: left;
    }
    .retry-card.blue { border-left: 4px solid #3B82F6; }
    .retry-card.yellow { border-left: 4px solid #F59E0B; }
    .retry-card.green { border-left: 4px solid #10B981; }
    .retry-card.red { border-left: 4px solid #EF4444; }
    .retry-icon {
      font-size: 28px;
      flex-shrink: 0;
    }
    .retry-text {
      font-size: 22px;
      color: #B0B0CC;
      line-height: 1.4;
    }
    .retry-text em {
      font-style: normal;
      color: #FFFFFF;
      font-weight: 700;
    }
    .retry-badge {
      font-size: 56px;
      font-weight: 800;
      color: #EF4444;
      margin-bottom: 4px;
    }
    .retry-badge-label {
      font-size: 20px;
      color: #6B7280;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="section-label">ERROR RECOVERY</div>
    <div class="main-title">分层恢复<br><span class="accent">先自动重试</span>，最后才报错</div>
    <div class="retry-badge">10</div>
    <div class="retry-badge-label">次最大重试 (withRetry)</div>
    <div class="retry-flow">
      <div class="retry-card blue">
        <div class="retry-icon">&#128260;</div>
        <div class="retry-text"><em>指数退避</em> + 随机抖动</div>
      </div>
      <div class="retry-card yellow">
        <div class="retry-icon">&#9200;</div>
        <div class="retry-text">尊重 <em>Retry-After</em> 头</div>
      </div>
      <div class="retry-card red">
        <div class="retry-icon">&#128293;</div>
        <div class="retry-text"><em>529</em> 过载 → 更长初始等待</div>
      </div>
      <div class="retry-card green">
        <div class="retry-icon">&#128274;</div>
        <div class="retry-text"><em>401</em> → 自动刷新 OAuth Token</div>
      </div>
    </div>
  </div>
</body>
</html>
