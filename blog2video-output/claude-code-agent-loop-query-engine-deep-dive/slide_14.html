<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .section-label {
      font-size: 22px;
      color: #8B5CF6;
      letter-spacing: 4px;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 36px;
    }
    .main-title {
      font-size: 44px;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 44px;
    }
    .main-title .accent { color: #8B5CF6; }
    .tasks {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .task-card {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 22px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      text-align: left;
    }
    .task-card:nth-child(1) { border-left: 4px solid #3B82F6; }
    .task-card:nth-child(2) { border-left: 4px solid #10B981; }
    .task-card:nth-child(3) { border-left: 4px solid #8B5CF6; }
    .task-num {
      font-size: 32px;
      font-weight: 800;
      flex-shrink: 0;
      width: 40px;
      text-align: center;
    }
    .task-card:nth-child(1) .task-num { color: #3B82F6; }
    .task-card:nth-child(2) .task-num { color: #10B981; }
    .task-card:nth-child(3) .task-num { color: #8B5CF6; }
    .task-info {
      flex: 1;
    }
    .task-name {
      font-size: 24px;
      font-weight: 700;
      color: #FFFFFF;
      margin-bottom: 6px;
    }
    .task-desc {
      font-size: 22px;
      color: #B0B0CC;
      line-height: 1.4;
    }
    .task-desc em {
      font-style: normal;
      color: #FFFFFF;
      font-weight: 700;
    }
    .silent-bar {
      width: 100%;
      background: rgba(139, 92, 246, 0.08);
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-radius: 12px;
      padding: 20px 24px;
      margin-top: 24px;
    }
    .silent-text {
      font-size: 24px;
      color: #B0B0CC;
      line-height: 1.4;
    }
    .silent-text em {
      font-style: normal;
      color: #8B5CF6;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="section-label">POST-LOOP</div>
    <div class="main-title">循环结束后的<br><span class="accent">静默学习</span></div>
    <div class="tasks">
      <div class="task-card">
        <div class="task-num">1</div>
        <div class="task-info">
          <div class="task-name">智能建议</div>
          <div class="task-desc">生成"顺便说一句"类型的<em>相关建议</em></div>
        </div>
      </div>
      <div class="task-card">
        <div class="task-num">2</div>
        <div class="task-info">
          <div class="task-name">记忆提取</div>
          <div class="task-desc">提取结构化事实，写入<em>记忆文件</em></div>
        </div>
      </div>
      <div class="task-card">
        <div class="task-num">3</div>
        <div class="task-info">
          <div class="task-name">KAIROS 探索</div>
          <div class="task-desc"><em>自主后台</em>探索和积累</div>
        </div>
      </div>
    </div>
    <div class="silent-bar">
      <div class="silent-text">每次对话后都在<em>悄悄学习</em><br>只是你看不到</div>
    </div>
  </div>
</body>
</html>
