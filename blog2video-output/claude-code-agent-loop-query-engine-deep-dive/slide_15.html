<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .glow {
      position: absolute;
      top: 35%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.1) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }
    .section-label {
      font-size: 22px;
      color: #8B5CF6;
      letter-spacing: 4px;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 36px;
      z-index: 1;
    }
    .main-title {
      font-size: 40px;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 40px;
      z-index: 1;
    }
    .main-title .accent { color: #8B5CF6; }
    .main-title .red { color: #EF4444; }
    .summary-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 28px;
      z-index: 1;
    }
    .summary-item {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 18px 22px;
      display: flex;
      align-items: center;
      gap: 16px;
      text-align: left;
    }
    .item-num {
      font-size: 32px;
      font-weight: 800;
      flex-shrink: 0;
      width: 40px;
      text-align: center;
    }
    .summary-item:nth-child(1) { border-left: 4px solid #10B981; }
    .summary-item:nth-child(1) .item-num { color: #10B981; }
    .summary-item:nth-child(2) { border-left: 4px solid #3B82F6; }
    .summary-item:nth-child(2) .item-num { color: #3B82F6; }
    .summary-item:nth-child(3) { border-left: 4px solid #F59E0B; }
    .summary-item:nth-child(3) .item-num { color: #F59E0B; }
    .item-text {
      font-size: 22px;
      font-weight: 600;
      color: #FFFFFF;
      line-height: 1.4;
    }
    .item-text em {
      font-style: normal;
      color: #F59E0B;
    }
    .cta-card {
      width: 100%;
      background: rgba(139, 92, 246, 0.08);
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-radius: 12px;
      padding: 24px 28px;
      z-index: 1;
    }
    .cta-text {
      font-size: 26px;
      color: #B0B0CC;
      line-height: 1.5;
    }
    .cta-text em {
      font-style: normal;
      color: #8B5CF6;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="glow"></div>
    <div class="section-label">TAKEAWAY</div>
    <div class="main-title">力量不在 <span class="accent">while(true)</span> 里面<br>而在<span class="red">外面挡住了什么</span></div>
    <div class="summary-list">
      <div class="summary-item">
        <div class="item-num">1</div>
        <div class="item-text">加 <em>transition 字段</em>让每次迭代自我解释</div>
      </div>
      <div class="summary-item">
        <div class="item-num">2</div>
        <div class="item-text">建立<em>分级预处理管道</em>而非无脑塞上下文</div>
      </div>
      <div class="summary-item">
        <div class="item-num">3</div>
        <div class="item-text">设计<em>双阈值停止机制</em>防止空转</div>
      </div>
    </div>
    <div class="cta-card">
      <div class="cta-text">不是理论，是<em>源码里正在运行</em>的工程实践</div>
    </div>
  </div>
</body>
</html>
