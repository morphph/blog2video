<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .section-label {
      font-size: 22px;
      color: #8B5CF6;
      letter-spacing: 4px;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 36px;
    }
    .main-title {
      font-size: 46px;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 48px;
    }
    .main-title .accent { color: #8B5CF6; }
    .loop-flow {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 0;
    }
    .flow-step {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .flow-step .icon {
      font-size: 32px;
      flex-shrink: 0;
    }
    .flow-step .text {
      font-size: 26px;
      font-weight: 600;
      color: #B0B0CC;
      text-align: left;
      line-height: 1.4;
    }
    .flow-step .text em {
      font-style: normal;
      color: #FFFFFF;
      font-weight: 700;
    }
    .flow-arrow {
      font-size: 28px;
      color: #6B7280;
      text-align: center;
    }
    .flow-step.highlight {
      border-left: 4px solid #F59E0B;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="section-label">AGENT LOOP</div>
    <div class="main-title">一个不断重复的<br><span class="accent">决策循环</span></div>
    <div class="loop-flow">
      <div class="flow-step">
        <div class="icon">&#128065;</div>
        <div class="text">看当前状态</div>
      </div>
      <div class="flow-arrow">&#8595;</div>
      <div class="flow-step">
        <div class="icon">&#129504;</div>
        <div class="text">调用模型，<em>决定下一步</em></div>
      </div>
      <div class="flow-arrow">&#8595;</div>
      <div class="flow-step">
        <div class="icon">&#128736;</div>
        <div class="text">执行工具，<em>送回结果</em></div>
      </div>
      <div class="flow-arrow">&#8595;</div>
      <div class="flow-step highlight">
        <div class="icon">&#128260;</div>
        <div class="text">重复，直到<em>"我完成了"</em></div>
      </div>
    </div>
  </div>
</body>
</html>
