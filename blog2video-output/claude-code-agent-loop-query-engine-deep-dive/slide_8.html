<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .section-label {
      font-size: 22px;
      color: #8B5CF6;
      letter-spacing: 4px;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 32px;
    }
    .main-title {
      font-size: 42px;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 40px;
    }
    .main-title .accent { color: #8B5CF6; }
    .cards {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .info-card {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 22px 24px;
      text-align: left;
    }
    .info-card.blue { border-left: 4px solid #3B82F6; }
    .info-card.purple { border-left: 4px solid #8B5CF6; }
    .info-card.green { border-left: 4px solid #10B981; }
    .card-label {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }
    .info-card.blue .card-label { color: #3B82F6; }
    .info-card.purple .card-label { color: #8B5CF6; }
    .info-card.green .card-label { color: #10B981; }
    .card-body {
      font-size: 24px;
      color: #B0B0CC;
      line-height: 1.5;
    }
    .card-body em {
      font-style: normal;
      color: #FFFFFF;
      font-weight: 700;
    }
    .batch-badge {
      display: inline-block;
      font-size: 56px;
      font-weight: 800;
      color: #8B5CF6;
      margin-top: 6px;
    }
    .batch-label {
      font-size: 18px;
      color: #6B7280;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="section-label">STREAMING</div>
    <div class="main-title">不是打字机效果<br>是<span class="accent">并行执行</span>的基础设施</div>
    <div class="cards">
      <div class="info-card blue">
        <div class="card-label">&#9889; 原始 SSE 事件流</div>
        <div class="card-body">直接消费原始事件<br>实现<em>逐事件级别</em>控制</div>
      </div>
      <div class="info-card purple">
        <div class="card-label">&#128260; 流式工具执行</div>
        <div class="card-body">模型<em>还在生成</em>的同时<br>工具就已经开始执行</div>
        <div class="batch-badge">10</div>
        <div class="batch-label">个工具 / 批并行</div>
      </div>
      <div class="info-card green">
        <div class="card-label">&#128172; 边想边做</div>
        <div class="card-body">前半段工具可能<em>已经执行完</em><br>后半段回答还在生成</div>
      </div>
    </div>
  </div>
</body>
</html>
