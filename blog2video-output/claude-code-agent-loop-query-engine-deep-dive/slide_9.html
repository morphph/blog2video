<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .glow {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.08) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }
    .quote-marks {
      font-size: 120px;
      color: rgba(245, 158, 11, 0.25);
      font-family: Georgia, serif;
      line-height: 0.6;
      margin-bottom: 32px;
      z-index: 1;
    }
    .quote-text {
      font-size: 40px;
      font-weight: 700;
      line-height: 1.5;
      margin-bottom: 48px;
      z-index: 1;
      max-width: 860px;
    }
    .quote-text .highlight { color: #F59E0B; }
    .divider {
      width: 80px;
      height: 3px;
      background: rgba(139, 92, 246, 0.4);
      margin-bottom: 40px;
      z-index: 1;
    }
    .tombstone-card {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-left: 4px solid #EF4444;
      border-radius: 12px;
      padding: 24px 28px;
      text-align: left;
      z-index: 1;
    }
    .tombstone-label {
      font-size: 20px;
      color: #EF4444;
      font-weight: 700;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }
    .tombstone-body {
      font-size: 24px;
      color: #B0B0CC;
      line-height: 1.5;
    }
    .tombstone-body em {
      font-style: normal;
      color: #FFFFFF;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="glow"></div>
    <div class="quote-marks">&#8220;</div>
    <div class="quote-text">流式传输在 Agent 场景下<br>不是 <span class="highlight">UI 优化</span><br>而是<span class="highlight">并行执行的基础设施</span></div>
    <div class="divider"></div>
    <div class="tombstone-card">
      <div class="tombstone-label">&#9760; Tombstone Messages</div>
      <div class="tombstone-body">流式中途失败 → 标记为<em>"墓碑"</em><br>重试前先移除，对话历史<em>始终干净</em></div>
    </div>
  </div>
</body>
</html>
