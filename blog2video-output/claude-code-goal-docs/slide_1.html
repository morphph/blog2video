<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
      background:
        radial-gradient(circle at 25% 18%, rgba(139, 92, 246, 0.18), transparent 55%),
        radial-gradient(circle at 80% 80%, rgba(245, 158, 11, 0.14), transparent 55%),
        #0D0D1A;
    }
    .series-tag {
      font-size: 28px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 56px;
    }
    .headline {
      font-size: 82px;
      font-weight: 900;
      line-height: 1.18;
      letter-spacing: -2px;
      margin-bottom: 56px;
    }
    .headline .yellow { color: #F59E0B; }
    .command-pill {
      display: inline-flex;
      align-items: baseline;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.45);
      border-left: 4px solid #8B5CF6;
      border-radius: 14px;
      padding: 24px 38px;
      margin-bottom: 48px;
      font-family: 'SF Mono', 'Menlo', 'Monaco', monospace;
    }
    .command-pill .slash { font-size: 54px; color: #8B5CF6; font-weight: 800; }
    .command-pill .cmd { font-size: 54px; color: #FFFFFF; font-weight: 800; letter-spacing: -1px; }
    .verdict {
      background: #1A1A2E;
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-left: 4px solid #F59E0B;
      border-radius: 14px;
      padding: 26px 32px;
      max-width: 900px;
      width: 100%;
      text-align: left;
    }
    .verdict .label {
      font-size: 22px;
      color: #F59E0B;
      letter-spacing: 2px;
      font-weight: 800;
      margin-bottom: 12px;
    }
    .verdict .text {
      font-size: 30px;
      color: #FFFFFF;
      font-weight: 700;
      line-height: 1.45;
    }
    .verdict .text .em { color: #F59E0B; font-weight: 800; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="series-tag">精读AI · Agent 工程</div>
    <div class="headline">
      让另一个模型<br>
      来判断 <span class="yellow">"做完了没"</span>？
    </div>
    <div class="command-pill">
      <span class="slash">/</span><span class="cmd">goal</span>
    </div>
    <div class="verdict">
      <div class="label">本期不聊用法</div>
      <div class="text">
        只聊一行命令背后<br>
        <span class="em">藏着的设计选择</span>
      </div>
    </div>
  </div>
</body>
</html>
