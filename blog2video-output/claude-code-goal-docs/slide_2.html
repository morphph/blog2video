<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
      background:
        radial-gradient(circle at 25% 18%, rgba(139, 92, 246, 0.14), transparent 55%),
        #0D0D1A;
    }
    .title {
      font-size: 56px;
      font-weight: 900;
      color: #FFFFFF;
      margin-bottom: 56px;
      letter-spacing: -1px;
    }
    .title .purple { color: #8B5CF6; }
    .flow {
      width: 100%;
      max-width: 936px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .step {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-radius: 14px;
      padding: 22px 28px;
      display: flex;
      align-items: center;
      gap: 22px;
      text-align: left;
    }
    .step.purple { border-left: 4px solid #8B5CF6; }
    .step.blue { border-left: 4px solid #3B82F6; }
    .step.yellow { border-left: 4px solid #F59E0B; }
    .step.green { border-left: 4px solid #10B981; }
    .step .num {
      font-size: 40px;
      font-weight: 900;
      width: 64px;
      flex-shrink: 0;
      text-align: center;
    }
    .step.purple .num { color: #8B5CF6; }
    .step.blue .num { color: #3B82F6; }
    .step.yellow .num { color: #F59E0B; }
    .step.green .num { color: #10B981; }
    .step .content {
      flex: 1;
    }
    .step .head {
      font-size: 30px;
      font-weight: 800;
      color: #FFFFFF;
      margin-bottom: 4px;
    }
    .step .desc {
      font-size: 22px;
      color: #B0B0CC;
      font-weight: 500;
      line-height: 1.4;
    }
    .arrow {
      text-align: center;
      color: #6B7280;
      font-size: 28px;
      line-height: 1;
      margin: -8px 0;
    }
    .haiku-badge {
      background: rgba(59, 130, 246, 0.18);
      color: #3B82F6;
      font-size: 18px;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 6px;
      margin-left: 8px;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="title"><span class="purple">/goal</span> 的运行机制</div>
    <div class="flow">
      <div class="step purple">
        <div class="num">1</div>
        <div class="content">
          <div class="head">输入条件</div>
          <div class="desc">条件本身就是任务说明</div>
        </div>
      </div>
      <div class="arrow">↓</div>
      <div class="step blue">
        <div class="num">2</div>
        <div class="content">
          <div class="head">主模型干活一轮</div>
          <div class="desc">完整执行后不交还控制权</div>
        </div>
      </div>
      <div class="arrow">↓</div>
      <div class="step yellow">
        <div class="num">3</div>
        <div class="content">
          <div class="head">小模型来判断<span class="haiku-badge">HAIKU 默认</span></div>
          <div class="desc">读历史 → 达成 / 没达成</div>
        </div>
      </div>
      <div class="arrow">↓</div>
      <div class="step green">
        <div class="num">4</div>
        <div class="content">
          <div class="head">达成 → 清除 goal</div>
          <div class="desc">没达成 → 理由喂回主模型</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
