<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
      background:
        radial-gradient(circle at 25% 18%, rgba(239, 68, 68, 0.16), transparent 55%),
        radial-gradient(circle at 80% 80%, rgba(16, 185, 129, 0.14), transparent 55%),
        #0D0D1A;
    }
    .title {
      font-size: 54px;
      font-weight: 900;
      color: #FFFFFF;
      margin-bottom: 16px;
      letter-spacing: -1px;
      line-height: 1.2;
    }
    .title .red { color: #EF4444; }
    .subtitle {
      font-size: 26px;
      color: #B0B0CC;
      font-weight: 600;
      margin-bottom: 44px;
    }
    .subtitle .em { color: #F59E0B; font-weight: 800; }
    .compare-row {
      display: flex;
      gap: 22px;
      width: 100%;
      max-width: 936px;
      margin-bottom: 24px;
    }
    .col {
      flex: 1;
      background: #1A1A2E;
      border-radius: 14px;
      padding: 22px 20px;
      text-align: left;
    }
    .col.bad {
      border: 1px solid rgba(239, 68, 68, 0.4);
      border-left: 4px solid #EF4444;
    }
    .col.good {
      border: 1px solid rgba(16, 185, 129, 0.4);
      border-left: 4px solid #10B981;
    }
    .col .col-label {
      font-size: 22px;
      letter-spacing: 2px;
      font-weight: 800;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .col.bad .col-label { color: #EF4444; }
    .col.good .col-label { color: #10B981; }
    .col .col-label .mark {
      font-size: 28px;
      font-weight: 900;
    }
    .item {
      font-size: 23px;
      font-weight: 700;
      color: #FFFFFF;
      line-height: 1.35;
      margin-bottom: 12px;
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 8px;
    }
    .item:last-child { margin-bottom: 0; }
    .item .note {
      display: block;
      font-size: 18px;
      color: #B0B0CC;
      font-weight: 500;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="title">评估器<br><span class="red">不能调任何工具</span></div>
    <div class="subtitle">只能读 <span class="em">Claude 晒在对话里的内容</span></div>
    <div class="compare-row">
      <div class="col bad">
        <div class="col-label"><span class="mark">✗</span> 写了等于没写</div>
        <div class="item">代码没有 bug<span class="note">没法跑代码验证</span></div>
        <div class="item">性能优化了<span class="note">没数据可看</span></div>
      </div>
      <div class="col good">
        <div class="col-label"><span class="mark">✓</span> 有效条件</div>
        <div class="item">npm test 退出码 0<span class="note">输出会进对话历史</span></div>
        <div class="item">lint 输出干净<span class="note">证据可被读到</span></div>
      </div>
    </div>
  </div>
</body>
</html>
