<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
      background:
        radial-gradient(circle at 50% 20%, rgba(239, 68, 68, 0.16), transparent 55%),
        #0D0D1A;
    }
    .title {
      font-size: 54px;
      font-weight: 900;
      color: #FFFFFF;
      margin-bottom: 44px;
      letter-spacing: -1px;
    }
    .title .red { color: #EF4444; }
    .cost-list {
      width: 100%;
      max-width: 936px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .cost {
      background: #1A1A2E;
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-left: 4px solid #EF4444;
      border-radius: 14px;
      padding: 22px 26px;
      text-align: left;
      display: flex;
      align-items: flex-start;
      gap: 24px;
    }
    .cost .num {
      font-size: 56px;
      font-weight: 900;
      color: #EF4444;
      line-height: 1;
      flex-shrink: 0;
      width: 72px;
      text-align: center;
    }
    .cost .body {
      flex: 1;
    }
    .cost .head {
      font-size: 28px;
      font-weight: 800;
      color: #FFFFFF;
      margin-bottom: 6px;
      line-height: 1.25;
    }
    .cost .desc {
      font-size: 21px;
      color: #B0B0CC;
      font-weight: 500;
      line-height: 1.4;
    }
    .cost .desc .em { color: #F59E0B; font-weight: 800; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="title">这个设计的 <span class="red">三层代价</span></div>
    <div class="cost-list">
      <div class="cost">
        <div class="num">1</div>
        <div class="body">
          <div class="head">评估器可能判错</div>
          <div class="desc">Haiku 能力有限，<span class="em">可能漏判或误判</span></div>
        </div>
      </div>
      <div class="cost">
        <div class="num">2</div>
        <div class="body">
          <div class="head">条件必须自带证据</div>
          <div class="desc">一半目标根本<span class="em">没法在对话里呈现</span></div>
        </div>
      </div>
      <div class="cost">
        <div class="num">3</div>
        <div class="body">
          <div class="head">token 会累积</div>
          <div class="desc">评估便宜，<span class="em">主轮一直在烧</span></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
