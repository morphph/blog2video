<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
      background:
        radial-gradient(circle at 30% 20%, rgba(139, 92, 246, 0.20), transparent 55%),
        radial-gradient(circle at 75% 80%, rgba(16, 185, 129, 0.12), transparent 55%),
        #0D0D1A;
    }
    .title {
      font-size: 50px;
      font-weight: 900;
      color: #FFFFFF;
      margin-bottom: 40px;
      letter-spacing: -1px;
    }
    .title .purple { color: #8B5CF6; }
    .quote-block {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.45);
      border-left: 4px solid #8B5CF6;
      border-radius: 14px;
      padding: 36px 36px;
      max-width: 936px;
      width: 100%;
      text-align: left;
      margin-bottom: 32px;
      position: relative;
    }
    .quote-block .qmark {
      font-size: 80px;
      color: #8B5CF6;
      font-weight: 900;
      line-height: 0.6;
      margin-bottom: 14px;
      font-family: Georgia, serif;
    }
    .quote-block .quote {
      font-size: 36px;
      color: #FFFFFF;
      font-weight: 800;
      line-height: 1.4;
    }
    .quote-block .quote .em { color: #F59E0B; }
    .applies {
      width: 100%;
      max-width: 936px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .apply-item {
      background: #1A1A2E;
      border: 1px solid rgba(16, 185, 129, 0.35);
      border-left: 4px solid #10B981;
      border-radius: 12px;
      padding: 18px 24px;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 18px;
    }
    .apply-item .check {
      font-size: 30px;
      color: #10B981;
      font-weight: 900;
      line-height: 1;
    }
    .apply-item .text {
      font-size: 24px;
      color: #FFFFFF;
      font-weight: 700;
      line-height: 1.35;
    }
    .apply-item .text .em { color: #10B981; font-weight: 800; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="title"><span class="purple">一句话</span> 总结</div>
    <div class="quote-block">
      <div class="qmark">“</div>
      <div class="quote">
        让 agent 跑下去的开关<br>
        <span class="em">不该握在干活的</span><br>
        <span class="em">那个模型手里</span>
      </div>
    </div>
    <div class="applies">
      <div class="apply-item">
        <div class="check">✓</div>
        <div class="text">生成与评估 <span class="em">职责切开</span></div>
      </div>
      <div class="apply-item">
        <div class="check">✓</div>
        <div class="text">评估器 <span class="em">轻量化</span></div>
      </div>
      <div class="apply-item">
        <div class="check">✓</div>
        <div class="text">评估反馈作为 <span class="em">下一轮指导</span></div>
      </div>
    </div>
  </div>
</body>
</html>
