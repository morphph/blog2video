<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 100px 72px 400px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .glow {
      position: absolute;
      top: 350px;
      left: 50%;
      transform: translateX(-50%);
      width: 950px;
      height: 700px;
      background: radial-gradient(ellipse at center, rgba(139, 92, 246, 0.22), transparent 70%);
      pointer-events: none;
    }
    .glow-red {
      position: absolute;
      top: 700px;
      left: 50%;
      transform: translateX(-50%);
      width: 700px;
      height: 400px;
      background: radial-gradient(ellipse at center, rgba(239, 68, 68, 0.12), transparent 70%);
      pointer-events: none;
    }
    .series {
      font-size: 30px;
      font-weight: 700;
      color: #8B5CF6;
      letter-spacing: 3px;
      margin-bottom: 72px;
      position: relative;
      z-index: 1;
    }
    .title {
      font-size: 96px;
      font-weight: 900;
      line-height: 1.25;
      letter-spacing: -1px;
      margin-bottom: 88px;
      position: relative;
      z-index: 1;
    }
    .title .red {
      color: #EF4444;
    }
    .source {
      display: inline-block;
      padding: 18px 36px;
      background: #1A1A30;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 999px;
      font-size: 22px;
      color: #6B6B80;
      letter-spacing: 0.5px;
      position: relative;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="glow"></div>
    <div class="glow-red"></div>
    <div class="series">精读AI · Claude Code</div>
    <div class="title">
      AI 看大代码库<br>
      <span class="red">不是用 RAG</span>
    </div>
    <div class="source">Anthropic · How Claude Code works in large codebases</div>
  </div>
</body>
</html>
