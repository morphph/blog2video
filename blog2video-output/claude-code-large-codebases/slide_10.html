<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .eyebrow {
      font-size: 26px;
      font-weight: 800;
      color: #F59E0B;
      letter-spacing: 3px;
      margin-bottom: 18px;
    }
    .title {
      font-size: 64px;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 56px;
    }
    .title .accent {
      color: #F59E0B;
    }
    .cards {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 24px;
      margin-bottom: 36px;
    }
    .card {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-left: 4px solid #F59E0B;
      border-radius: 12px;
      padding: 26px 28px;
      display: flex;
      gap: 24px;
      align-items: flex-start;
      text-align: left;
    }
    .card .num {
      font-size: 64px;
      font-weight: 900;
      color: #F59E0B;
      line-height: 1;
      min-width: 70px;
    }
    .card .body-text .head {
      font-size: 32px;
      font-weight: 800;
      color: #FFFFFF;
      margin-bottom: 8px;
      line-height: 1.3;
    }
    .card .body-text .head .mono {
      font-family: 'SF Mono', Menlo, monospace;
    }
    .card .body-text .desc {
      font-size: 26px;
      color: #B0B0CC;
      line-height: 1.5;
    }
    .signature {
      width: 100%;
      background: rgba(139, 92, 246, 0.08);
      border: 2px solid #8B5CF6;
      border-radius: 12px;
      padding: 26px 28px;
      font-size: 28px;
      font-weight: 700;
      color: #FFFFFF;
      line-height: 1.5;
      text-align: center;
      margin-bottom: 26px;
    }
    .signature .purple { color: #8B5CF6; }
    .brand {
      font-size: 22px;
      color: #6B7280;
      letter-spacing: 1px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="eyebrow">ACTION</div>
    <div class="title">今晚就能<br>做的<span class="accent">两件事</span></div>
    <div class="cards">
      <div class="card">
        <div class="num">①</div>
        <div class="body-text">
          <div class="head">看 <span class="mono">CLAUDE.md</span> 是否堆在根目录</div>
          <div class="desc">挪到真正相关的子目录</div>
        </div>
      </div>
      <div class="card">
        <div class="num">②</div>
        <div class="body-text">
          <div class="head">翻它的修改时间</div>
          <div class="desc">超过半年, 坐下来重写一遍</div>
        </div>
      </div>
    </div>
    <div class="signature">
      代码库本身够不够 <span class="purple">grep-friendly</span> ?<br>
      <span class="purple">CLAUDE.md</span> 还活着吗 ?
    </div>
    <div class="brand">AI 世界很吵, 精读一篇, 胜过刷一百条</div>
  </div>
</body>
</html>
