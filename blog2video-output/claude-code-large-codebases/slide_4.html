<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .eyebrow {
      font-size: 26px;
      font-weight: 800;
      color: #8B5CF6;
      letter-spacing: 3px;
      margin-bottom: 18px;
    }
    .title {
      font-size: 60px;
      font-weight: 900;
      line-height: 1.25;
      margin-bottom: 56px;
    }
    .title .mono {
      font-family: 'SF Mono', Menlo, monospace;
      color: #10B981;
    }
    .cards {
      width: 100%;
      display: flex;
      gap: 22px;
      margin-bottom: 40px;
    }
    .card {
      flex: 1;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 28px 22px;
      text-align: left;
    }
    .card.gray {
      opacity: 0.55;
    }
    .card.green {
      border-left: 4px solid #10B981;
    }
    .card .label {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 16px;
    }
    .card.gray .label { color: #6B7280; }
    .card.green .label { color: #10B981; }
    .card .head {
      font-size: 30px;
      font-weight: 800;
      color: #FFFFFF;
      margin-bottom: 14px;
      line-height: 1.3;
    }
    .card .desc {
      font-size: 24px;
      color: #B0B0CC;
      line-height: 1.5;
    }
    .card .desc .mono {
      font-family: 'SF Mono', Menlo, monospace;
      color: #FFFFFF;
    }
    .bottom {
      width: 100%;
      background: rgba(245, 158, 11, 0.08);
      border: 1px solid rgba(245, 158, 11, 0.35);
      border-left: 4px solid #F59E0B;
      border-radius: 12px;
      padding: 26px 28px;
      font-size: 28px;
      font-weight: 700;
      color: #FFFFFF;
      line-height: 1.5;
      text-align: left;
    }
    .bottom .amber {
      color: #F59E0B;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="eyebrow">推论一</div>
    <div class="title">CLAUDE.md 放<span class="mono">子目录</span>,<br>不放根</div>
    <div class="cards">
      <div class="card gray">
        <div class="label">直觉做法</div>
        <div class="head">全局配置写在 repo 根目录</div>
        <div class="desc">看起来"才合理"<br>每个 session 被无关信息淹没</div>
      </div>
      <div class="card green">
        <div class="label">ANTHROPIC 建议</div>
        <div class="head">CLAUDE.md 在子目录</div>
        <div class="desc">Claude 自动沿目录树<br>往上加载每一份配置</div>
      </div>
    </div>
    <div class="bottom">
      大代码库根本没有 <span class="amber">"全局视角"</span> —<br>
      每次工作只是其中一小块
    </div>
  </div>
</body>
</html>
