<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .eyebrow {
      font-size: 26px;
      font-weight: 800;
      color: #8B5CF6;
      letter-spacing: 3px;
      margin-bottom: 18px;
    }
    .title {
      font-size: 58px;
      font-weight: 900;
      line-height: 1.25;
      margin-bottom: 56px;
    }
    .title .red {
      color: #EF4444;
    }
    .timeline {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 24px;
      margin-bottom: 40px;
    }
    .row {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 28px 28px;
      display: flex;
      align-items: center;
      gap: 24px;
      text-align: left;
    }
    .row.now {
      border-left: 4px solid #10B981;
    }
    .row.later {
      border-left: 4px solid #EF4444;
    }
    .row .when {
      font-size: 32px;
      font-weight: 800;
      min-width: 200px;
    }
    .row.now .when { color: #10B981; }
    .row.later .when { color: #EF4444; }
    .row .body-text {
      flex: 1;
    }
    .row .body-text .head {
      font-size: 32px;
      font-weight: 700;
      color: #FFFFFF;
      margin-bottom: 6px;
    }
    .row .body-text .desc {
      font-size: 26px;
      color: #B0B0CC;
    }
    .row .mark {
      font-size: 48px;
      font-weight: 900;
    }
    .row.now .mark { color: #10B981; }
    .row.later .mark { color: #EF4444; }
    .bottom {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-left: 4px solid #8B5CF6;
      border-radius: 12px;
      padding: 26px 28px;
      font-size: 28px;
      font-weight: 700;
      color: #FFFFFF;
      line-height: 1.5;
      text-align: left;
    }
    .bottom .label {
      color: #8B5CF6;
      font-size: 22px;
      letter-spacing: 2px;
      margin-bottom: 8px;
      display: block;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="eyebrow">推论二</div>
    <div class="title">旧 CLAUDE.md<br>让 <span class="red">新模型变笨</span></div>
    <div class="timeline">
      <div class="row now">
        <div class="when">当下</div>
        <div class="body-text">
          <div class="head">为补丁写的指令</div>
          <div class="desc">帮模型绕过短板</div>
        </div>
        <div class="mark">✓</div>
      </div>
      <div class="row later">
        <div class="when">3 个月后</div>
        <div class="body-text">
          <div class="head">模型短板已补上</div>
          <div class="desc">老指令变成脚镣</div>
        </div>
        <div class="mark">✗</div>
      </div>
    </div>
    <div class="bottom">
      <span class="label">ANTHROPIC 节奏</span>
      每 3-6 个月一次 review · 主要模型发布后再来一次
    </div>
  </div>
</body>
</html>
