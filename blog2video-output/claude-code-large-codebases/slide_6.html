<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .eyebrow {
      font-size: 26px;
      font-weight: 800;
      color: #8B5CF6;
      letter-spacing: 3px;
      margin-bottom: 18px;
    }
    .title {
      font-size: 56px;
      font-weight: 900;
      line-height: 1.25;
      margin-bottom: 56px;
    }
    .title .accent {
      color: #10B981;
    }
    .cards {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 24px;
      margin-bottom: 40px;
    }
    .card {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 28px 28px;
      text-align: left;
    }
    .card.strike {
      opacity: 0.55;
    }
    .card.strike .head {
      text-decoration: line-through;
      color: #6B7280;
    }
    .card.green {
      border-left: 4px solid #10B981;
    }
    .card .label {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }
    .card.strike .label { color: #6B7280; }
    .card.green .label { color: #10B981; }
    .card .head {
      font-size: 32px;
      font-weight: 800;
      color: #FFFFFF;
      margin-bottom: 12px;
      line-height: 1.3;
    }
    .card .desc {
      font-size: 26px;
      color: #B0B0CC;
      line-height: 1.5;
    }
    .card .desc .mono {
      font-family: 'SF Mono', Menlo, monospace;
      color: #FFFFFF;
    }
    .bottom {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-left: 4px solid #8B5CF6;
      border-radius: 12px;
      padding: 24px 28px;
      font-size: 28px;
      font-weight: 700;
      color: #FFFFFF;
      line-height: 1.5;
      text-align: left;
    }
    .bottom .purple {
      color: #8B5CF6;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="eyebrow">推论三</div>
    <div class="title">Hooks 不是护栏,<br>是<span class="accent">自进化机制</span></div>
    <div class="cards">
      <div class="card strike">
        <div class="label">主流理解</div>
        <div class="head">防呆 / 拦截危险命令</div>
        <div class="desc">只把 hook 当作安全层</div>
      </div>
      <div class="card green">
        <div class="label">真正高价值</div>
        <div class="head">Stop hook 让模型回头反思</div>
        <div class="desc">主动提议改 <span class="mono">CLAUDE.md</span><br>系统帮你维护它</div>
      </div>
    </div>
    <div class="bottom">
      把 hook 从<span class="purple">安全层</span>,<br>
      升级成<span class="purple">元配置层</span>
    </div>
  </div>
</body>
</html>
