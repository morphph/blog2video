<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .eyebrow {
      font-size: 26px;
      font-weight: 800;
      color: #8B5CF6;
      letter-spacing: 3px;
      margin-bottom: 18px;
    }
    .title {
      font-size: 60px;
      font-weight: 900;
      line-height: 1.25;
      margin-bottom: 64px;
    }
    .flow {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 22px;
      margin-bottom: 44px;
    }
    .step {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-left: 4px solid #8B5CF6;
      border-radius: 12px;
      padding: 26px 28px;
      text-align: left;
    }
    .step .big {
      font-size: 38px;
      font-weight: 800;
      color: #FFFFFF;
      margin-bottom: 8px;
      line-height: 1.3;
    }
    .step .small {
      font-size: 26px;
      color: #B0B0CC;
      line-height: 1.5;
    }
    .step .small .purple { color: #8B5CF6; font-weight: 700; }
    .arrow {
      text-align: center;
      font-size: 36px;
      color: #8B5CF6;
      font-weight: 800;
    }
    .step.outcome {
      border-left-color: #10B981;
    }
    .step.outcome .big {
      color: #10B981;
    }
    .tag {
      display: inline-block;
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-radius: 999px;
      padding: 18px 32px;
      font-size: 28px;
      font-weight: 700;
      color: #F59E0B;
      line-height: 1.4;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="eyebrow">组织层面</div>
    <div class="title">一个人撬动一盘棋</div>
    <div class="flow">
      <div class="step">
        <div class="big">两个工程师</div>
        <div class="small">提前搭好 <span class="purple">plugin + MCP server</span></div>
      </div>
      <div class="arrow">↓</div>
      <div class="step">
        <div class="big">新人入职第一天</div>
        <div class="small">上下文 + 能力全在 — 无需手动配</div>
      </div>
      <div class="arrow">↓</div>
      <div class="step outcome">
        <div class="big">几千人产出加速</div>
        <div class="small">几个人的"地基"撬动整个组织</div>
      </div>
    </div>
    <div class="tag">卡点从来不是缺人,<br>是没人愿意先做地基</div>
  </div>
</body>
</html>
