<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .eyebrow {
      font-size: 26px;
      font-weight: 800;
      color: #EF4444;
      letter-spacing: 3px;
      margin-bottom: 18px;
    }
    .title {
      font-size: 56px;
      font-weight: 900;
      line-height: 1.25;
      margin-bottom: 56px;
    }
    .title .red {
      color: #EF4444;
    }
    .cards {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 22px;
      margin-bottom: 40px;
    }
    .card {
      background: #1A1A2E;
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-left: 4px solid #EF4444;
      border-radius: 12px;
      padding: 24px 26px;
      text-align: left;
      display: flex;
      gap: 20px;
      align-items: flex-start;
    }
    .card .num {
      font-size: 48px;
      font-weight: 900;
      color: #EF4444;
      min-width: 56px;
      line-height: 1;
    }
    .card .body-text .head {
      font-size: 30px;
      font-weight: 800;
      color: #FFFFFF;
      margin-bottom: 8px;
      line-height: 1.3;
    }
    .card .body-text .desc {
      font-size: 24px;
      color: #B0B0CC;
      line-height: 1.5;
    }
    .bottom {
      width: 100%;
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-left: 4px solid #EF4444;
      border-radius: 12px;
      padding: 24px 28px;
      font-size: 26px;
      font-weight: 700;
      color: #FFFFFF;
      line-height: 1.5;
      text-align: left;
    }
    .bottom .red {
      color: #EF4444;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="eyebrow">边界条件</div>
    <div class="title">什么时候<br>这套方法<span class="red">不适用</span></div>
    <div class="cards">
      <div class="card">
        <div class="num">①</div>
        <div class="body-text">
          <div class="head">小代码库</div>
          <div class="desc">embedding 常数响应,<br>agentic grep 反而慢</div>
        </div>
      </div>
      <div class="card">
        <div class="num">②</div>
        <div class="body-text">
          <div class="head">子目录初始化</div>
          <div class="desc">每个子目录都要有人写 + 维护,<br>协作成本不低</div>
        </div>
      </div>
      <div class="card">
        <div class="num">③</div>
        <div class="body-text">
          <div class="head">非常规环境</div>
          <div class="desc">游戏引擎大量二进制 ·<br>非工程师贡献代码 · 非标准版本控制</div>
        </div>
      </div>
    </div>
    <div class="bottom">
      诚实讲代价 — 这套方法只在<br>
      <span class="red">"索引追不上提交"</span>的规模下才显现
    </div>
  </div>
</body>
</html>
