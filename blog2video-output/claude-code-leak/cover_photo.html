<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 100px 72px 400px 72px;
      display: flex; flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
      background: radial-gradient(ellipse at center, rgba(239,68,68,0.12) 0%, transparent 70%);
    }
    .watermark {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-15deg);
      font-size: 140px;
      font-weight: 900;
      color: rgba(239,68,68,0.12);
      letter-spacing: 16px;
      pointer-events: none;
      user-select: none;
      white-space: nowrap;
    }
    .series-tag {
      font-size: 30px;
      color: #8B5CF6;
      font-weight: 700;
      margin-bottom: 48px;
      letter-spacing: 2px;
      position: relative;
      z-index: 1;
    }
    .main-title {
      position: relative;
      z-index: 1;
      margin-bottom: 60px;
    }
    .title-line {
      line-height: 1.2;
      margin-bottom: 8px;
    }
    .title-yellow {
      font-size: 92px;
      font-weight: 900;
      color: #F59E0B;
    }
    .title-white {
      font-size: 92px;
      font-weight: 900;
      color: #FFFFFF;
    }
    .title-red {
      font-size: 92px;
      font-weight: 900;
      color: #EF4444;
    }
    .source-tag {
      position: absolute;
      bottom: 420px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 22px;
      color: #6B6B80;
      background: #1A1A30;
      padding: 10px 28px;
      border-radius: 999px;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="watermark">LEAKED</div>
    <div class="series-tag">精读AI · 深度解读</div>
    <div class="main-title">
      <div class="title-line">
        <span class="title-yellow">51万行</span><span class="title-white">源代码</span>
      </div>
      <div class="title-line">
        <span class="title-red">全部泄漏了</span>
      </div>
    </div>
    <div class="source-tag">Claude Code 泄漏事件</div>
  </div>
</body>
</html>
