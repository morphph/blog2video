<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 120px 72px 520px 72px;
      display: flex; flex-direction: column;
      justify-content: center;
      position: relative;
    }
    .tag {
      font-size: 24px;
      color: #EF4444;
      letter-spacing: 3px;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 32px;
    }
    .title {
      font-size: 44px;
      font-weight: 800;
      margin-bottom: 10px;
    }
    .title-mono {
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      font-size: 24px;
      color: #F59E0B;
      margin-bottom: 40px;
    }
    .code-block {
      background: #1E1E2E;
      border-radius: 12px;
      padding: 24px 28px;
      border-left: 4px solid #EF4444;
      margin-bottom: 36px;
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      font-size: 20px;
      line-height: 1.8;
    }
    .code-block .comment { color: #6B7280; }
    .code-block .keyword { color: #C678DD; }
    .code-block .string { color: #98C379; }
    .code-block .func { color: #61AFEF; }
    .code-block .prop { color: #FFFFFF; }
    .dual-path {
      display: flex;
      gap: 20px;
      margin-bottom: 36px;
    }
    .path-card {
      flex: 1;
      background: #1A1A2E;
      border-radius: 12px;
      padding: 24px 22px;
    }
    .path-card.good {
      border-left: 4px solid #10B981;
    }
    .path-card.bad {
      border-left: 4px solid #EF4444;
    }
    .path-title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .path-title.green { color: #10B981; }
    .path-title.red { color: #EF4444; }
    .path-desc {
      font-size: 20px;
      color: #B0B0CC;
      line-height: 1.6;
    }
    .bottom-insight {
      font-size: 24px;
      color: #F59E0B;
      font-weight: 600;
      margin-top: auto;
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="tag">DISCOVERY #2</div>
    <div class="title">反蒸馏防御</div>
    <div class="title-mono">ANTI_DISTILLATION_CC</div>

    <div class="code-block">
      <span class="comment">// claude.ts</span><br>
      <span class="keyword">if</span> (<span class="prop">ANTI_DISTILLATION_CC</span>) {<br>
      &nbsp;&nbsp;<span class="comment">// 注入虚假工具定义到 API 请求</span><br>
      &nbsp;&nbsp;<span class="func">injectFakeToolDefinitions</span>(<span class="prop">request</span>);<br>
      }
    </div>

    <div class="dual-path">
      <div class="path-card good">
        <div class="path-title green">✅ 正常用户</div>
        <div class="path-desc">完全透明，无感知</div>
      </div>
      <div class="path-card bad">
        <div class="path-title red">☠️ 抄袭者</div>
        <div class="path-desc">假工具混入训练数据<br>Agent能力直接报废</div>
      </div>
    </div>

    <div class="bottom-insight">不是加密，不是混淆，而是主动「下毒」</div>
  </div>
</body>
</html>
