<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 120px 72px 520px 72px;
      display: flex; flex-direction: column;
      position: relative;
    }
    .tag {
      font-size: 24px;
      color: #F59E0B;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 28px;
    }
    .title {
      font-size: 44px;
      font-weight: 800;
      margin-bottom: 40px;
      line-height: 1.3;
    }
    .title .highlight {
      color: #F59E0B;
    }
    .fun-card {
      background: #1A1A2E;
      border: 1px solid rgba(139,92,246,0.2);
      border-left: 4px solid #F59E0B;
      border-radius: 12px;
      padding: 28px 32px;
      margin-bottom: 40px;
    }
    .fun-card .card-header {
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      font-size: 20px;
      color: #6B7280;
      margin-bottom: 24px;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 24px;
      padding: 8px 0;
    }
    .stat-row + .stat-row {
      margin-top: 8px;
    }
    .stat-label {
      color: #FFFFFF;
    }
    .stat-value-yellow { color: #F59E0B; font-weight: 700; }
    .stat-value-purple { color: #8B5CF6; font-weight: 700; }
    .stat-value-red { color: #EF4444; font-weight: 700; }
    .contrast {
      margin-bottom: 40px;
    }
    .contrast-line1 {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 8px;
    }
    .contrast-big {
      font-size: 48px;
      font-weight: 900;
      color: #F59E0B;
    }
    .contrast-normal {
      font-size: 32px;
      color: #FFFFFF;
    }
    .contrast-purple {
      font-size: 32px;
      color: #8B5CF6;
    }
    .insight-card {
      background: #1A1A2E;
      border: 1px solid rgba(139,92,246,0.2);
      border-left: 4px solid #10B981;
      border-radius: 12px;
      padding: 24px 28px;
    }
    .insight-title {
      font-size: 24px;
      color: #10B981;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .insight-desc {
      font-size: 22px;
      color: #B0B0CC;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="tag">EASTER EGG 🥚</div>
    <div class="title"><span class="highlight">Buddy</span> 电子宠物系统</div>
    <div class="fun-card">
      <div class="card-header">buddy/companion.ts</div>
      <div class="stat-row">
        <span class="stat-label">🐾 物种</span>
        <span class="stat-value-yellow">18 种</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">⭐ 稀有度</span>
        <span class="stat-value-purple">Common → Legendary</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">✨ 闪光变体</span>
        <span class="stat-value-red">1% 概率</span>
      </div>
    </div>
    <div class="contrast">
      <div class="contrast-line1">
        <span class="contrast-big">$25亿</span>
        <span class="contrast-normal">的严肃工具</span>
      </div>
      <div class="contrast-purple">× 电子宠物</div>
    </div>
    <div class="insight-card">
      <div class="insight-title">情感化设计 → 留存问题的解法</div>
      <div class="insight-desc">养了3个月的闪光宠物，你舍得换工具吗？</div>
    </div>
  </div>
</body>
</html>
