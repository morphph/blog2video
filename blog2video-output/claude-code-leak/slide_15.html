<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 120px 72px 520px 72px;
      display: flex; flex-direction: column;
      justify-content: center;
      position: relative;
    }
    .tag {
      font-size: 24px;
      color: #F59E0B;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 28px;
    }
    .giant-number {
      font-size: 160px;
      font-weight: 900;
      color: #8B5CF6;
      line-height: 1;
      margin-bottom: 8px;
    }
    .giant-label {
      font-size: 36px;
      color: #B0B0CC;
      margin-bottom: 32px;
    }
    .screenshot {
      max-width: 860px;
      width: 100%;
      border-radius: 12px;
      border: 2px solid rgba(139,92,246,0.3);
      margin: 24px auto;
      display: block;
    }
    .stats {
      margin-top: 32px;
      text-align: center;
    }
    .stats-views {
      font-size: 24px;
      color: #8B5CF6;
      font-weight: 700;
      margin-bottom: 16px;
    }
    .stats-insight {
      font-size: 22px;
      color: #B0B0CC;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="tag">EASTER EGG 🥚</div>
    <div class="giant-number">187</div>
    <div class="giant-label">个 Spinner 动词</div>
    <img src="screenshot_spinners.jpg" class="screenshot" alt="Wes Bos tweet about spinner verbs">
    <div class="stats">
      <div class="stats-views">1.7M views</div>
      <div class="stats-insight">爆款内容不需要多深度——一个有趣的细节就够了</div>
    </div>
  </div>
</body>
</html>
