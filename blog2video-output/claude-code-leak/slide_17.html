<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 120px 72px 520px 72px;
      display: flex; flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
      background: radial-gradient(ellipse at center, rgba(139,92,246,0.1) 0%, transparent 70%);
    }
    .quote-line1 {
      font-size: 48px;
      color: #FFFFFF;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .quote-line2 {
      font-size: 52px;
      font-weight: 900;
      color: #F59E0B;
      margin-bottom: 0;
    }
    .divider {
      width: 160px;
      height: 2px;
      background: #8B5CF6;
      margin: 36px auto;
    }
    .quote2-line1 {
      font-size: 32px;
      color: #B0B0CC;
      margin-bottom: 12px;
    }
    .quote2-line2 {
      font-size: 40px;
      font-weight: 900;
      color: #EF4444;
      margin-bottom: 0;
    }
    .footnote {
      font-size: 22px;
      color: #6B7280;
      position: absolute;
      bottom: 540px;
      left: 72px;
      right: 72px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="quote-line1">模型是引擎</div>
    <div class="quote-line2">Harness 是整辆车</div>
    <div class="divider"></div>
    <div class="quote2-line1">安全的最薄弱环节</div>
    <div class="quote2-line2">永远是人</div>
    <div class="footnote">.npmignore 打败了世界最精密的防泄漏系统</div>
  </div>
</body>
</html>
