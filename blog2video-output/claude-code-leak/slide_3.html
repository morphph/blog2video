<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 120px 72px 520px 72px;
      display: flex; flex-direction: column;
      justify-content: flex-start;
      position: relative;
    }
    .top-tag {
      font-size: 24px;
      color: #8B5CF6;
      letter-spacing: 4px;
      font-weight: 700;
      margin-bottom: 40px;
      text-transform: uppercase;
    }
    .title {
      font-size: 48px;
      font-weight: 800;
      margin-bottom: 48px;
      line-height: 1.2;
    }
    .compare-card {
      background: #1A1A2E;
      border-radius: 12px;
      padding: 32px 32px;
      border: 1px solid rgba(139, 92, 246, 0.2);
      margin-bottom: 24px;
    }
    .card-red { border-left: 4px solid #EF4444; }
    .card-green { border-left: 4px solid #10B981; }
    .card-header {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 20px;
    }
    .header-red { color: #EF4444; }
    .header-green { color: #10B981; }
    .card-item {
      font-size: 22px;
      color: #B0B0CC;
      line-height: 1.6;
      padding-left: 8px;
      margin-bottom: 6px;
    }
    .card-item::before {
      content: "·";
      margin-right: 10px;
      color: #6B7280;
    }
    .insight-box {
      margin-top: 40px;
      text-align: center;
      font-size: 26px;
      color: #F59E0B;
      font-weight: 600;
      padding: 20px;
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 12px;
      background: rgba(245, 158, 11, 0.05);
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="top-tag">HARNESS #1</div>
    <div class="title">智能上下文加载</div>

    <div class="compare-card card-red">
      <div class="card-header header-red">❌ 传统方法</div>
      <div class="card-item">把代码库尽可能塞进 Context Window</div>
      <div class="card-item">代码库大了就截断</div>
      <div class="card-item">30% 窗口装了无用代码</div>
    </div>

    <div class="compare-card card-green">
      <div class="card-header header-green">✅ Claude Code</div>
      <div class="card-item">Glob + Grep 快速扫描定位</div>
      <div class="card-item">只喂精准代码片段</div>
      <div class="card-item">信噪比更高，有效信息更多</div>
    </div>

    <div class="insight-box">同样 200K context → 更多有用信息</div>
  </div>
</body>
</html>
