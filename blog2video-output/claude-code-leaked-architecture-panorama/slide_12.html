<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .glow {
      position: absolute;
      top: 35%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.1) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }
    .section-label {
      font-size: 22px;
      color: #8B5CF6;
      letter-spacing: 4px;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 36px;
      z-index: 1;
    }
    .main-title {
      font-size: 44px;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 44px;
      z-index: 1;
    }
    .main-title .accent { color: #8B5CF6; }
    .main-title .red { color: #EF4444; }
    .summary-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 36px;
      z-index: 1;
    }
    .summary-item {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 20px;
      text-align: left;
    }
    .item-num {
      font-size: 36px;
      font-weight: 800;
      flex-shrink: 0;
      width: 48px;
      text-align: center;
    }
    .summary-item:nth-child(1) { border-left: 4px solid #10B981; }
    .summary-item:nth-child(1) .item-num { color: #10B981; }
    .summary-item:nth-child(2) { border-left: 4px solid #EF4444; }
    .summary-item:nth-child(2) .item-num { color: #EF4444; }
    .summary-item:nth-child(3) { border-left: 4px solid #3B82F6; }
    .summary-item:nth-child(3) .item-num { color: #3B82F6; }
    .item-text {
      font-size: 24px;
      font-weight: 600;
      color: #FFFFFF;
      line-height: 1.4;
    }
    .item-text em {
      font-style: normal;
      color: #F59E0B;
    }
    .cta-card {
      width: 100%;
      background: rgba(139, 92, 246, 0.08);
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-radius: 12px;
      padding: 24px 28px;
      z-index: 1;
    }
    .cta-text {
      font-size: 26px;
      color: #B0B0CC;
      line-height: 1.5;
    }
    .cta-text em {
      font-style: normal;
      color: #8B5CF6;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="glow"></div>
    <div class="section-label">TAKEAWAY</div>
    <div class="main-title"><span class="accent">1,296 行</span>让模型思考<br><span class="red">47 万行</span>让思考可靠</div>
    <div class="summary-list">
      <div class="summary-item">
        <div class="item-num">1</div>
        <div class="item-text">上下文工程：<em>管好模型该看什么</em></div>
      </div>
      <div class="summary-item">
        <div class="item-num">2</div>
        <div class="item-text">安全分类器：<em>拦住模型不能做什么</em></div>
      </div>
      <div class="summary-item">
        <div class="item-num">3</div>
        <div class="item-text">Multi-Agent：<em>一个模型不够就协同</em></div>
      </div>
    </div>
    <div class="cta-card">
      <div class="cta-text">护城河不在引擎多强<br>在你围绕引擎造了<em>一辆什么样的车</em></div>
    </div>
  </div>
</body>
</html>
