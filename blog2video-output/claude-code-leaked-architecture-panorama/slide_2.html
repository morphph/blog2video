<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .section-label {
      font-size: 22px;
      color: #8B5CF6;
      letter-spacing: 4px;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 40px;
    }
    .main-title {
      font-size: 52px;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 48px;
    }
    .main-title .accent { color: #F59E0B; }
    .flow-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }
    .flow-step {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 20px 32px;
      width: 100%;
      text-align: center;
    }
    .flow-step .step-text {
      font-size: 28px;
      font-weight: 600;
      color: #FFFFFF;
    }
    .flow-step .step-detail {
      font-size: 22px;
      color: #B0B0CC;
      margin-top: 6px;
    }
    .flow-step .step-text .kw { color: #8B5CF6; }
    .arrow {
      font-size: 32px;
      color: #6B7280;
      margin: 8px 0;
    }
    .loop-label {
      margin-top: 16px;
      font-size: 24px;
      color: #3B82F6;
      font-weight: 700;
      letter-spacing: 2px;
    }
    .bottom-note {
      margin-top: 40px;
      font-size: 26px;
      color: #B0B0CC;
      line-height: 1.5;
    }
    .bottom-note em {
      font-style: normal;
      color: #F59E0B;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="section-label">ARCHITECTURE OVERVIEW</div>
    <div class="main-title">核心逻辑：一个 <span class="accent">While 循环</span></div>
    <div class="flow-container">
      <div class="flow-step">
        <div class="step-text">用户输入</div>
      </div>
      <div class="arrow">&#8595;</div>
      <div class="flow-step">
        <div class="step-text"><span class="kw">QueryEngine</span> 组装 Prompt</div>
      </div>
      <div class="arrow">&#8595;</div>
      <div class="flow-step">
        <div class="step-text">调用模型</div>
      </div>
      <div class="arrow">&#8595;</div>
      <div class="flow-step">
        <div class="step-text">需要工具？执行 &#8594; 回传结果</div>
        <div class="step-detail">循环直到最终回答</div>
      </div>
      <div class="loop-label">&#8635; WHILE LOOP</div>
    </div>
    <div class="bottom-note">没有 DAG，没有条件路由<br>但周围包裹了一整套 <em>Harness 系统</em></div>
  </div>
</body>
</html>
