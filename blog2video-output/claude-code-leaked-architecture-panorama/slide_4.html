<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .section-label {
      font-size: 22px;
      color: #F59E0B;
      letter-spacing: 4px;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 36px;
    }
    .main-title {
      font-size: 46px;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 48px;
    }
    .main-title .accent { color: #EF4444; }
    .insight-card {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-left: 4px solid #F59E0B;
      border-radius: 12px;
      padding: 32px 28px;
      text-align: left;
      margin-bottom: 32px;
    }
    .insight-card .icon-line {
      font-size: 20px;
      color: #F59E0B;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 16px;
    }
    .insight-card .body-text {
      font-size: 26px;
      color: #B0B0CC;
      line-height: 1.55;
    }
    .insight-card .body-text em {
      font-style: normal;
      color: #FFFFFF;
      font-weight: 700;
    }
    .principle-row {
      width: 100%;
      display: flex;
      gap: 20px;
      margin-bottom: 0;
    }
    .principle-box {
      flex: 1;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 24px 20px;
      text-align: center;
    }
    .principle-box.green { border-left: 4px solid #10B981; }
    .principle-box.purple { border-left: 4px solid #8B5CF6; }
    .principle-box.red { border-left: 4px solid #EF4444; }
    .principle-box .label {
      font-size: 18px;
      color: #6B7280;
      margin-bottom: 10px;
      font-weight: 600;
    }
    .principle-box .value {
      font-size: 24px;
      font-weight: 700;
      color: #FFFFFF;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="section-label">COUNTER-INTUITIVE INSIGHT</div>
    <div class="main-title">"删旧内容省 Token"<br><span class="accent">不一定对</span></div>
    <div class="insight-card">
      <div class="icon-line">&#9888; 缓存前缀经济学</div>
      <div class="body-text">
        删除方式如果破坏了<em>缓存前缀连续性</em>，<br>
        后续所有请求都会 miss cache，<br>
        成本和延迟<em>反而大幅上升</em>
      </div>
    </div>
    <div class="principle-row">
      <div class="principle-box green">
        <div class="label">微压缩</div>
        <div class="value">去噪声</div>
      </div>
      <div class="principle-box purple">
        <div class="label">记忆压缩</div>
        <div class="value">提事实</div>
      </div>
      <div class="principle-box red">
        <div class="label">完整压缩</div>
        <div class="value">清历史</div>
      </div>
    </div>
  </div>
</body>
</html>
