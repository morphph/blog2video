<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .section-label {
      font-size: 22px;
      color: #EF4444;
      letter-spacing: 4px;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 36px;
    }
    .main-title {
      font-size: 46px;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 40px;
    }
    .main-title .accent { color: #EF4444; }
    .dual-layer {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 32px;
    }
    .layer-card {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 24px 28px;
      text-align: left;
      display: flex;
      align-items: flex-start;
      gap: 20px;
    }
    .layer-card.blue { border-left: 4px solid #3B82F6; }
    .layer-card.yellow { border-left: 4px solid #F59E0B; }
    .layer-icon {
      font-size: 36px;
      flex-shrink: 0;
    }
    .layer-body { flex: 1; }
    .layer-title {
      font-size: 26px;
      font-weight: 700;
      color: #FFFFFF;
      margin-bottom: 8px;
    }
    .layer-title .kw { color: #3B82F6; }
    .layer-title .kw-yellow { color: #F59E0B; }
    .layer-desc {
      font-size: 22px;
      color: #B0B0CC;
      line-height: 1.5;
    }
    .layer-desc em {
      font-style: normal;
      color: #FFFFFF;
      font-weight: 600;
    }
    .tension-card {
      width: 100%;
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 12px;
      padding: 24px 28px;
      text-align: left;
    }
    .tension-card .tension-label {
      font-size: 18px;
      color: #EF4444;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }
    .tension-card .tension-text {
      font-size: 24px;
      color: #B0B0CC;
      line-height: 1.5;
    }
    .tension-card .tension-text em {
      font-style: normal;
      color: #EF4444;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="section-label">LAYER 2 &middot; SAFETY SYSTEM</div>
    <div class="main-title">双层分类器：<span class="accent">模型不能做什么</span></div>
    <div class="dual-layer">
      <div class="layer-card blue">
        <div class="layer-icon">&#9889;</div>
        <div class="layer-body">
          <div class="layer-title"><span class="kw">Bash Classifier</span></div>
          <div class="layer-desc">纯规则匹配，<em>只读命令自动放行</em><br>不调模型，速度极快</div>
        </div>
      </div>
      <div class="layer-card yellow">
        <div class="layer-icon">&#128737;</div>
        <div class="layer-body">
          <div class="layer-title"><span class="kw-yellow">YOLO Classifier</span></div>
          <div class="layer-desc">LLM-as-Judge 系统<br>独立模型调用审查主 Agent 操作<br>两阶段架构：快速放行 / 完整推理</div>
        </div>
      </div>
    </div>
    <div class="tension-card">
      <div class="tension-label">&#9888; STRUCTURAL TENSION</div>
      <div class="tension-text">自动化越高，每次<em>误杀</em>的体验伤害越大<br>生成和评估必须分离</div>
    </div>
  </div>
</body>
</html>
