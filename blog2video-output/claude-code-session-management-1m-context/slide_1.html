<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .hook {
      font-size: 60px;
      font-weight: 800;
      line-height: 1.4;
      margin-bottom: 60px;
      letter-spacing: 1px;
    }
    .hook .highlight {
      color: #EF4444;
    }
    .divider {
      width: 80px;
      height: 4px;
      background: #8B5CF6;
      border-radius: 2px;
      margin-bottom: 60px;
    }
    .brand {
      font-size: 36px;
      font-weight: 600;
      color: #B0B0CC;
      letter-spacing: 2px;
    }
    .brand .accent {
      color: #8B5CF6;
    }
    .topic {
      font-size: 30px;
      color: #6B7280;
      margin-top: 24px;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="hook">窗口越大<br><span class="highlight">差距反而越大</span></div>
    <div class="divider"></div>
    <div class="brand"><span class="accent">精读AI</span> · AI编程</div>
    <div class="topic">Claude Code Context Management 深度解读</div>
  </div>
</body>
</html>
