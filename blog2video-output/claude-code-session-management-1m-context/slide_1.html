<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .hook {
      font-size: 52px;
      font-weight: 800;
      line-height: 1.4;
      margin-bottom: 48px;
      letter-spacing: 1px;
    }
    .hook .highlight {
      color: #EF4444;
    }
    .hook .yellow {
      color: #F59E0B;
    }
    .card {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-left: 4px solid #8B5CF6;
      border-radius: 12px;
      padding: 28px 32px;
      width: 100%;
      margin-bottom: 48px;
      text-align: left;
    }
    .card-text {
      font-size: 32px;
      line-height: 1.6;
      color: #B0B0CC;
    }
    .card-text .em {
      color: #FFFFFF;
      font-weight: 600;
    }
    .brand {
      font-size: 36px;
      font-weight: 600;
      color: #B0B0CC;
      letter-spacing: 2px;
    }
    .brand .accent {
      color: #8B5CF6;
    }
    .topic {
      font-size: 28px;
      color: #6B7280;
      margin-top: 20px;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="hook"><span class="yellow">100万 Token</span> 上下文<br>窗口越大<br><span class="highlight">差距反而越大</span></div>
    <div class="card">
      <div class="card-text">五个选项里<span class="em">大多数人只会第一个</span><br>这篇文章讲的是<span class="em">另外四个</span></div>
    </div>
    <div class="brand"><span class="accent">精读AI</span> · AI编程</div>
    <div class="topic">Claude Code Context Management 深度解读</div>
  </div>
</body>
</html>
