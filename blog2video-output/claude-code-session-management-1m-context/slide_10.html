<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .badge {
      font-size: 24px;
      font-weight: 600;
      color: #F59E0B;
      letter-spacing: 3px;
      margin-bottom: 28px;
    }
    .title {
      font-size: 52px;
      font-weight: 800;
      color: #8B5CF6;
      margin-bottom: 20px;
    }
    .subtitle {
      font-size: 34px;
      color: #B0B0CC;
      margin-bottom: 48px;
    }
    .diagram {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .main-ctx {
      background: #1A1A2E;
      border: 2px solid rgba(139, 92, 246, 0.4);
      border-radius: 12px;
      padding: 20px 40px;
      font-size: 30px;
      font-weight: 700;
      color: #8B5CF6;
    }
    .arrow-down {
      font-size: 32px;
      color: #6B7280;
    }
    .sub-ctx {
      background: #1A1A2E;
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 12px;
      padding: 20px 40px;
      width: 80%;
    }
    .sub-ctx .label {
      font-size: 24px;
      color: #F59E0B;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .sub-ctx .items {
      font-size: 26px;
      color: #B0B0CC;
      line-height: 1.6;
    }
    .result-arrow {
      font-size: 32px;
      color: #10B981;
    }
    .result-box {
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 12px;
      padding: 20px 40px;
      font-size: 30px;
      font-weight: 700;
      color: #10B981;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="badge">重新理解</div>
    <div class="title">Subagent</div>
    <div class="subtitle">不是并行执行，是上下文隔离</div>
    <div class="diagram">
      <div class="main-ctx">主上下文</div>
      <div class="arrow-down">|</div>
      <div class="sub-ctx">
        <div class="label">子代理（独立上下文）</div>
        <div class="items">读文件 / 调试 / 反复尝试</div>
      </div>
      <div class="result-arrow">|</div>
      <div class="result-box">只带结论回来</div>
    </div>
  </div>
</body>
</html>
