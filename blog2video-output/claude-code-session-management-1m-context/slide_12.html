<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .label {
      font-size: 26px;
      font-weight: 600;
      color: #10B981;
      letter-spacing: 4px;
      margin-bottom: 36px;
    }
    .core-message {
      font-size: 44px;
      font-weight: 800;
      line-height: 1.5;
      margin-bottom: 48px;
    }
    .core-message .purple { color: #8B5CF6; }
    .tools {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: center;
      margin-bottom: 48px;
    }
    .tool-tag {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.25);
      border-radius: 24px;
      padding: 10px 24px;
      font-size: 26px;
      color: #B0B0CC;
      font-weight: 500;
    }
    .tool-tag .action {
      font-weight: 600;
    }
    .tool-tag:nth-child(1) .action { color: #EF4444; }
    .tool-tag:nth-child(2) .action { color: #10B981; }
    .tool-tag:nth-child(3) .action { color: #3B82F6; }
    .tool-tag:nth-child(4) .action { color: #F59E0B; }
    .final-card {
      background: rgba(139, 92, 246, 0.08);
      border: 1px solid rgba(139, 92, 246, 0.25);
      border-radius: 12px;
      padding: 28px 32px;
      width: 100%;
    }
    .final-card .text {
      font-size: 30px;
      font-weight: 700;
      color: #F59E0B;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="label">核心认知</div>
    <div class="core-message">你管理的不是代码<br>而是<span class="purple">模型的注意力</span></div>
    <div class="tools">
      <div class="tool-tag">Rewind <span class="action">删除噪音</span></div>
      <div class="tool-tag">Compact <span class="action">压缩信号</span></div>
      <div class="tool-tag">/clear <span class="action">重置频道</span></div>
      <div class="tool-tag">Subagent <span class="action">隔离干扰</span></div>
    </div>
    <div class="final-card">
      <div class="text">每回合停一秒钟<br>这个决定比提示词更重要</div>
    </div>
  </div>
</body>
</html>
