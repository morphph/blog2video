<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    .title {
      font-size: 44px;
      font-weight: 800;
      color: #F59E0B;
      margin-bottom: 48px;
      text-align: center;
    }
    .checklist {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
    }
    .check-item {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 22px 28px;
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .check-num {
      font-size: 40px;
      font-weight: 800;
      width: 52px;
      text-align: center;
      flex-shrink: 0;
    }
    .check-item:nth-child(1) .check-num { color: #6B7280; }
    .check-item:nth-child(2) .check-num { color: #8B5CF6; }
    .check-item:nth-child(3) .check-num { color: #3B82F6; }
    .check-item:nth-child(4) .check-num { color: #10B981; }
    .check-item:nth-child(5) .check-num { color: #F59E0B; }
    .check-info .name {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .check-info .desc {
      font-size: 24px;
      color: #B0B0CC;
    }
    .check-item:nth-child(2) {
      border-color: rgba(139, 92, 246, 0.4);
    }
    .footnote {
      margin-top: 40px;
      font-size: 28px;
      color: #6B7280;
      text-align: center;
      line-height: 1.5;
    }
    .footnote em {
      color: #F59E0B;
      font-style: normal;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="title">每回合的五种选择</div>
    <div class="checklist">
      <div class="check-item">
        <div class="check-num">1</div>
        <div class="check-info">
          <div class="name">继续对话</div>
          <div class="desc">最自然，但不一定最优</div>
        </div>
      </div>
      <div class="check-item">
        <div class="check-num">2</div>
        <div class="check-info">
          <div class="name">Rewind</div>
          <div class="desc">双击 Esc，回退重来</div>
        </div>
      </div>
      <div class="check-item">
        <div class="check-num">3</div>
        <div class="check-info">
          <div class="name">/clear</div>
          <div class="desc">清空会话，写简报重开</div>
        </div>
      </div>
      <div class="check-item">
        <div class="check-num">4</div>
        <div class="check-info">
          <div class="name">Compact</div>
          <div class="desc">模型总结对话再继续</div>
        </div>
      </div>
      <div class="check-item">
        <div class="check-num">5</div>
        <div class="check-info">
          <div class="name">Subagent</div>
          <div class="desc">委派给独立上下文子代理</div>
        </div>
      </div>
    </div>
    <div class="footnote">高手在五种之间<em>灵活切换</em></div>
  </div>
</body>
</html>
