<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    .badge {
      font-size: 24px;
      font-weight: 600;
      color: #10B981;
      letter-spacing: 3px;
      margin-bottom: 32px;
    }
    .title {
      font-size: 52px;
      font-weight: 800;
      color: #8B5CF6;
      margin-bottom: 48px;
      text-align: center;
    }
    .scenario {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      margin-bottom: 28px;
    }
    .scenario .step-label {
      font-size: 22px;
      color: #6B7280;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }
    .scenario .step-text {
      font-size: 30px;
      line-height: 1.6;
      color: #B0B0CC;
    }
    .scenario .step-text .em {
      color: #FFFFFF;
      font-weight: 600;
    }
    .better-card {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-left: 4px solid #10B981;
      border-radius: 12px;
      padding: 32px;
      width: 100%;
    }
    .better-card .label {
      font-size: 26px;
      font-weight: 700;
      color: #10B981;
      margin-bottom: 12px;
    }
    .better-card .text {
      font-size: 28px;
      line-height: 1.6;
      color: #B0B0CC;
    }
    .better-card .text .key {
      color: #8B5CF6;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="badge">最推荐的习惯</div>
    <div class="title">Rewind 回退重来</div>
    <div class="scenario">
      <div class="step-label">常见场景</div>
      <div class="step-text">Claude 读了 5 个文件<br>尝试方案 A → <span class="em">失败了</span></div>
    </div>
    <div class="better-card">
      <div class="label">更好的做法</div>
      <div class="text"><span class="key">Rewind</span> 到读完文件的节点<br>直接告诉它走方案 B</div>
    </div>
  </div>
</body>
</html>
