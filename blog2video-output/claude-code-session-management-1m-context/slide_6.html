<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .icon-area {
      width: 100px;
      height: 100px;
      background: rgba(59, 130, 246, 0.12);
      border: 2px solid rgba(59, 130, 246, 0.3);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      margin-bottom: 40px;
    }
    .title {
      font-size: 48px;
      font-weight: 800;
      color: #3B82F6;
      margin-bottom: 32px;
    }
    .subtitle {
      font-size: 32px;
      color: #B0B0CC;
      line-height: 1.6;
      margin-bottom: 48px;
    }
    .metaphor-card {
      background: #1A1A2E;
      border: 1px solid rgba(59, 130, 246, 0.2);
      border-left: 4px solid #3B82F6;
      border-radius: 12px;
      padding: 32px;
      width: 100%;
    }
    .metaphor-card .text {
      font-size: 30px;
      line-height: 1.7;
      color: #B0B0CC;
    }
    .metaphor-card .text .em {
      color: #3B82F6;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="icon-area">S</div>
    <div class="title">Summarize from Here</div>
    <div class="subtitle">让 Claude 总结当前经验<br>生成一段交接消息</div>
    <div class="metaphor-card">
      <div class="text">相当于<span class="em">未来的自己</span><br>给过去的自己写封信：<br>这条路走不通，原因是什么<br>建议直接走另一条</div>
    </div>
  </div>
</body>
</html>
