<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    .title {
      font-size: 44px;
      font-weight: 800;
      color: #EF4444;
      margin-bottom: 44px;
      text-align: center;
    }
    .flow {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
    }
    .flow-step {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 24px 28px;
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .flow-num {
      font-size: 36px;
      font-weight: 800;
      color: #6B7280;
      width: 44px;
      text-align: center;
      flex-shrink: 0;
    }
    .flow-text {
      font-size: 28px;
      color: #B0B0CC;
      line-height: 1.5;
    }
    .flow-text .em {
      color: #FFFFFF;
      font-weight: 600;
    }
    .flow-text .red {
      color: #EF4444;
      font-weight: 600;
    }
    .flow-arrow {
      text-align: center;
      font-size: 28px;
      color: #6B7280;
    }
    .result-card {
      margin-top: 8px;
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.25);
      border-radius: 12px;
      padding: 24px 28px;
      width: 100%;
      text-align: center;
    }
    .result-card .text {
      font-size: 30px;
      font-weight: 700;
      color: #EF4444;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="title">Compact 失败的场景</div>
    <div class="flow">
      <div class="flow-step">
        <div class="flow-num">1</div>
        <div class="flow-text">长时间<span class="em">调试某个问题</span></div>
      </div>
      <div class="flow-arrow">|</div>
      <div class="flow-step">
        <div class="flow-num">2</div>
        <div class="flow-text">Autocompact 触发<br>摘要<span class="em">聚焦在调试内容</span></div>
      </div>
      <div class="flow-arrow">|</div>
      <div class="flow-step">
        <div class="flow-num">3</div>
        <div class="flow-text">你说"<span class="red">顺便修 bar.ts 的警告</span>"</div>
      </div>
    </div>
    <div class="result-card">
      <div class="text">那个警告只提过一次<br>已被摘要丢掉了</div>
    </div>
  </div>
</body>
</html>
