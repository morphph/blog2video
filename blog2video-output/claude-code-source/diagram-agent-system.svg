<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif">
  <!-- Background -->
  <rect width="800" height="1000" fill="#ffffff"/>

  <!-- Title -->
  <text x="400" y="52" text-anchor="middle" font-size="28" font-weight="bold" fill="#1a1a2e">Claude Code 泄漏源码</text>
  <text x="400" y="88" text-anchor="middle" font-size="28" font-weight="bold" fill="#1a1a2e">顶级Agent的底层设计</text>

  <!-- Misconception line -->
  <text x="400" y="140" text-anchor="middle" font-size="20" fill="#999999" text-decoration="line-through">Claude Code = Model + Prompt + Tools ?</text>

  <!-- Reality line -->
  <text x="400" y="175" text-anchor="middle" font-size="22" font-weight="bold" fill="#6366f1">Claude Code = Agent System</text>

  <!-- Main dashed container -->
  <rect x="60" y="210" width="680" height="560" rx="16" fill="none" stroke="#333333" stroke-width="2.5" stroke-dasharray="10,6"/>

  <!-- Left vertical label -->
  <text x="95" y="430" text-anchor="middle" font-size="20" font-weight="bold" fill="#333333" writing-mode="tb">顶 级 Agent 系 统</text>

  <!-- Layer 1: Prompt编排 -->
  <rect x="140" y="235" width="560" height="80" rx="12" fill="#EEF2FF" stroke="#6366f1" stroke-width="2"/>
  <text x="300" y="275" font-size="20" font-weight="bold" fill="#1e293b">① Prompt 编排</text>
  <text x="300" y="300" font-size="15" fill="#64748b">不是一段咒语，是运行时配置系统</text>
  <rect x="530" y="250" width="150" height="32" rx="8" fill="#6366f1" opacity="0.12"/>
  <text x="605" y="272" text-anchor="middle" font-size="14" font-weight="bold" fill="#6366f1">静态宪法 + 动态配置</text>

  <!-- Layer 2: 角色拆分 -->
  <rect x="140" y="330" width="560" height="80" rx="12" fill="#F0FDF4" stroke="#22c55e" stroke-width="2"/>
  <text x="300" y="370" font-size="20" font-weight="bold" fill="#1e293b">② 多Agent 职责拆分</text>
  <text x="300" y="395" font-size="15" fill="#64748b">不让一个人既当运动员又当裁判</text>
  <rect x="530" y="345" width="150" height="32" rx="8" fill="#22c55e" opacity="0.12"/>
  <text x="605" y="367" text-anchor="middle" font-size="13" font-weight="bold" fill="#16a34a">Explore / Plan / Verify</text>

  <!-- Layer 3: 验证机制 -->
  <rect x="140" y="425" width="560" height="80" rx="12" fill="#FEF9C3" stroke="#eab308" stroke-width="2"/>
  <text x="300" y="465" font-size="20" font-weight="bold" fill="#1e293b">③ 验证 &gt; 生成</text>
  <text x="300" y="490" font-size="15" fill="#64748b">核心能力不是写代码，是验收代码</text>
  <rect x="530" y="440" width="150" height="32" rx="8" fill="#eab308" opacity="0.12"/>
  <text x="605" y="462" text-anchor="middle" font-size="14" font-weight="bold" fill="#a16207">生成 ≠ 完成</text>

  <!-- Layer 4: 工具治理 -->
  <rect x="140" y="520" width="560" height="80" rx="12" fill="#FFF1F2" stroke="#ef4444" stroke-width="2"/>
  <text x="300" y="560" font-size="20" font-weight="bold" fill="#1e293b">④ 工具治理</text>
  <text x="300" y="585" font-size="15" fill="#64748b">防御性编程，默认事情会出问题</text>
  <rect x="500" y="535" width="185" height="32" rx="8" fill="#ef4444" opacity="0.10"/>
  <text x="592" y="557" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc2626">校验 → 权限 → 执行 → 兜底</text>

  <!-- Layer 5: 生命周期 -->
  <rect x="140" y="615" width="560" height="80" rx="12" fill="#F5F3FF" stroke="#8b5cf6" stroke-width="2"/>
  <text x="300" y="655" font-size="20" font-weight="bold" fill="#1e293b">⑤ 生命周期管理</text>
  <text x="300" y="680" font-size="15" fill="#64748b">决定它是demo还是产品</text>
  <rect x="530" y="630" width="150" height="32" rx="8" fill="#8b5cf6" opacity="0.12"/>
  <text x="605" y="652" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c3aed">记忆 / 恢复 / 主动</text>

  <!-- Arrows connecting layers -->
  <path d="M420 315 L420 330" stroke="#cbd5e1" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M420 410 L420 425" stroke="#cbd5e1" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M420 505 L420 520" stroke="#cbd5e1" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M420 600 L420 615" stroke="#cbd5e1" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cbd5e1"/>
    </marker>
  </defs>

  <!-- Bottom conclusion -->
  <rect x="140" y="800" width="520" height="50" rx="12" fill="linear-gradient(135deg, #6366f1, #8b5cf6)" fill-opacity="0.08" stroke="#6366f1" stroke-width="2"/>
  <text x="400" y="832" text-anchor="middle" font-size="20" font-weight="bold" fill="#4338ca">Agent 的竞争：模型能力 → 系统工程</text>

  <!-- Decorative bottom text -->
  <text x="400" y="890" text-anchor="middle" font-size="14" fill="#94a3b8">不要只看它会不会说</text>
  <text x="400" y="915" text-anchor="middle" font-size="14" fill="#94a3b8">看它有没有规则、分工、验证、治理、生命周期</text>

  <!-- Brand -->
  <text x="400" y="970" text-anchor="middle" font-size="13" fill="#c4b5fd">LoreAI · Claude Code 设计哲学</text>
</svg>