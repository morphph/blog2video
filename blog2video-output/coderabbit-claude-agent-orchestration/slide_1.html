<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .slide::before {
      content: '';
      position: absolute;
      top: 35%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 900px;
      height: 900px;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.14) 0%, rgba(245, 158, 11, 0) 70%);
      pointer-events: none;
    }
    .label {
      font-size: 28px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 600;
      margin-bottom: 60px;
      position: relative;
      z-index: 2;
    }
    .title {
      font-size: 96px;
      font-weight: 900;
      line-height: 1.2;
      letter-spacing: -1px;
      margin-bottom: 96px;
      position: relative;
      z-index: 2;
    }
    .amber { color: #F59E0B; }
    .red { color: #EF4444; }
    .cards {
      display: flex;
      flex-direction: column;
      gap: 28px;
      width: 100%;
      position: relative;
      z-index: 2;
    }
    .card {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-left: 4px solid #EF4444;
      border-radius: 12px;
      padding: 32px 36px;
      font-size: 38px;
      font-weight: 600;
      text-align: left;
      line-height: 1.4;
    }
    .card.amber {
      border-left-color: #F59E0B;
    }
    .card-tag {
      font-size: 22px;
      color: #6B6B80;
      letter-spacing: 2px;
      margin-bottom: 10px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="label">精读AI · Claude Code 实战</div>
    <div class="title">
      <span class="amber">200 万</span> PR / 周<br>
      他们在 Claude Code <span class="red">前加了一层</span>
    </div>
    <div class="cards">
      <div class="card">
        <div class="card-tag">悬念 1</div>
        Plan Mode 不够
      </div>
      <div class="card amber">
        <div class="card-tag">悬念 2</div>
        要在 Claude Code 前再加一层
      </div>
    </div>
  </div>
</body>
</html>
