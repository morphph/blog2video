<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .label {
      font-size: 26px;
      color: #F59E0B;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 36px;
    }
    .h {
      font-size: 60px;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 60px;
    }
    .amber { color: #F59E0B; }
    .define {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(245, 158, 11, 0.35);
      border-left: 4px solid #F59E0B;
      border-radius: 12px;
      padding: 30px 32px;
      text-align: left;
      margin-bottom: 28px;
    }
    .define-tag {
      font-size: 22px;
      letter-spacing: 2px;
      font-weight: 700;
      color: #F59E0B;
      margin-bottom: 12px;
    }
    .define-text {
      font-size: 34px;
      font-weight: 700;
      line-height: 1.45;
    }
    .example {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-left: 4px solid #EF4444;
      border-radius: 12px;
      padding: 30px 32px;
      text-align: left;
    }
    .example-tag {
      font-size: 22px;
      letter-spacing: 2px;
      font-weight: 700;
      color: #EF4444;
      margin-bottom: 12px;
    }
    .example-text {
      font-size: 32px;
      font-weight: 700;
      line-height: 1.5;
    }
    .arrow {
      color: #F59E0B;
      font-weight: 900;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="label">PM 的词，进了 AI 的 EVAL</div>
    <div class="h"><span class="amber">Scope Creep</span><br>变成可测量的维度</div>
    <div class="define">
      <div class="define-tag">原本含义</div>
      <div class="define-text">项目原本要做 A，做着做着把 B、C、D 也吞进来了</div>
    </div>
    <div class="example">
      <div class="example-tag">在 PLAN 里的体现</div>
      <div class="example-text">你让它做<b>登录</b> <span class="arrow">→</span> 它顺手把<b>注册</b>也规划上了</div>
    </div>
  </div>
</body>
</html>
