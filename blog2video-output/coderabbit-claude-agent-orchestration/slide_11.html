<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .label {
      font-size: 26px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 600;
      margin-bottom: 36px;
    }
    .h {
      font-size: 60px;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 56px;
    }
    .accent { color: #8B5CF6; }
    .pair {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 24px;
      margin-bottom: 28px;
    }
    .card {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.25);
      border-radius: 12px;
      padding: 28px 30px;
      text-align: left;
      display: flex;
      gap: 24px;
      align-items: center;
    }
    .card.thin { border-left: 4px solid #EF4444; }
    .card.thick { border-left: 4px solid #EF4444; }
    .card-tag {
      font-size: 24px;
      letter-spacing: 1px;
      font-weight: 800;
      color: #EF4444;
      min-width: 140px;
    }
    .card-text {
      font-size: 30px;
      font-weight: 700;
      line-height: 1.4;
      flex: 1;
    }
    .verdict {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(245, 158, 11, 0.35);
      border-left: 4px solid #F59E0B;
      border-radius: 12px;
      padding: 26px 30px;
      text-align: left;
    }
    .verdict-text {
      font-size: 32px;
      font-weight: 800;
      line-height: 1.4;
      color: #F59E0B;
    }
    .verdict-sub {
      font-size: 24px;
      color: #B0B0CC;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="label">PLAN 的抽象层级</div>
    <div class="h">是一个需要调的<br><span class="accent">超参数</span></div>
    <div class="pair">
      <div class="card thin">
        <div class="card-tag">太细</div>
        <div class="card-text">项目稍变一点，整份 plan 就 stale 了</div>
      </div>
      <div class="card thick">
        <div class="card-tag">太粗</div>
        <div class="card-text">给隐含假设留缝隙 → AI 又开始脑补</div>
      </div>
    </div>
    <div class="verdict">
      <div class="verdict-text">没有银弹</div>
      <div class="verdict-sub">每个团队 / 每类任务，都得自己迭代</div>
    </div>
  </div>
</body>
</html>
