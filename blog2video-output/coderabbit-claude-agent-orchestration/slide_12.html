<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .slide::before {
      content: '';
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 700px;
      height: 700px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.18) 0%, rgba(139, 92, 246, 0) 70%);
      pointer-events: none;
    }
    .label {
      font-size: 26px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 600;
      margin-bottom: 56px;
      position: relative;
      z-index: 2;
    }
    .quote-mark {
      font-size: 200px;
      color: #8B5CF6;
      line-height: 0.6;
      margin-bottom: 8px;
      font-weight: 900;
      position: relative;
      z-index: 2;
    }
    .quote {
      font-size: 50px;
      font-weight: 800;
      line-height: 1.4;
      max-width: 900px;
      letter-spacing: -0.5px;
      position: relative;
      z-index: 2;
      margin-bottom: 36px;
    }
    .quote .accent {
      color: #F59E0B;
    }
    .by {
      font-size: 26px;
      color: #B0B0CC;
      letter-spacing: 2px;
      font-weight: 600;
      position: relative;
      z-index: 2;
      margin-bottom: 48px;
    }
    .punch {
      font-size: 40px;
      font-weight: 900;
      color: #FFFFFF;
      position: relative;
      z-index: 2;
      line-height: 1.4;
    }
    .punch .ac {
      color: #F59E0B;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="label">LOKER 留给行业的那句话</div>
    <div class="quote-mark">"</div>
    <div class="quote">
      <span class="accent">Plan 本身</span>，就是一道质量门槛
    </div>
    <div class="by">— David Loker, CodeRabbit</div>
    <div class="punch">
      Code Review 的下半场<br>
      是 <span class="ac">Plan Review</span>
    </div>
  </div>
</body>
</html>
