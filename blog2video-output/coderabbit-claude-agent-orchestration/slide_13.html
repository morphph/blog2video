<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .label {
      font-size: 26px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 600;
      margin-bottom: 40px;
    }
    .h {
      font-size: 50px;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 56px;
    }
    .accent { color: #F59E0B; }
    .flow {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .box {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.25);
      border-radius: 12px;
      padding: 28px 30px;
      text-align: left;
    }
    .box.old {
      border-left: 4px solid #6B7280;
    }
    .box.old .tag { color: #6B7280; }
    .box.new {
      border-left: 4px solid #10B981;
    }
    .box.new .tag { color: #10B981; }
    .tag {
      font-size: 22px;
      letter-spacing: 2px;
      font-weight: 800;
      margin-bottom: 10px;
    }
    .text {
      font-size: 32px;
      font-weight: 700;
      line-height: 1.4;
    }
    .arrow {
      text-align: center;
      font-size: 36px;
      color: #F59E0B;
      font-weight: 900;
      letter-spacing: 4px;
    }
    .punch {
      margin-top: 30px;
      font-size: 32px;
      font-weight: 800;
      color: #F59E0B;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="label">质量关前移</div>
    <div class="h">代码写出来再 review<br>已经<span class="accent">太晚</span>了</div>
    <div class="flow">
      <div class="box old">
        <div class="tag">过去 · 旧位置</div>
        <div class="text">PR · Code Review · CI<br>过滤"写得不对"的几行代码</div>
      </div>
      <div class="arrow">▼ 前移</div>
      <div class="box new">
        <div class="tag">现在 · 新位置</div>
        <div class="text">Plan Review<br>评审"还没开始写"的那份 plan</div>
      </div>
    </div>
    <div class="punch">错的方向，code review 救不回来</div>
  </div>
</body>
</html>
