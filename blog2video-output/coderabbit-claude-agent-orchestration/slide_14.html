<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .label {
      font-size: 26px;
      color: #EF4444;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 36px;
    }
    .h {
      font-size: 56px;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 56px;
    }
    .red { color: #EF4444; }
    .cost-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 32px;
    }
    .cost {
      background: #1A1A2E;
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-left: 4px solid #EF4444;
      border-radius: 12px;
      padding: 22px 28px;
      text-align: left;
      display: flex;
      gap: 22px;
      align-items: center;
    }
    .mark {
      font-size: 36px;
      color: #EF4444;
      font-weight: 900;
      min-width: 40px;
    }
    .cost-text {
      font-size: 28px;
      font-weight: 700;
      line-height: 1.4;
      flex: 1;
    }
    .verdict {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(245, 158, 11, 0.35);
      border-left: 4px solid #F59E0B;
      border-radius: 12px;
      padding: 26px 30px;
      text-align: left;
    }
    .verdict-text {
      font-size: 30px;
      font-weight: 800;
      line-height: 1.45;
      color: #F59E0B;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="label">这套打法 · 不是免费的</div>
    <div class="h">值不值，看你被哪种<span class="red">疼</span>折磨</div>
    <div class="cost-list">
      <div class="cost">
        <div class="mark">−</div>
        <div class="cost-text">多一层延迟 · 多消耗多模型 token</div>
      </div>
      <div class="cost">
        <div class="mark">−</div>
        <div class="cost-text">团队要搭配套的 eval 基础设施</div>
      </div>
      <div class="cost">
        <div class="mark">−</div>
        <div class="cost-text">抽象层级要自己慢慢试 · 没有银弹</div>
      </div>
      <div class="cost">
        <div class="mark">−</div>
        <div class="cost-text">流程改变 · 写代码前先过 plan review</div>
      </div>
    </div>
    <div class="verdict">
      <div class="verdict-text">但如果你被"代码对了但解错题"反复折磨——值</div>
    </div>
  </div>
</body>
</html>
