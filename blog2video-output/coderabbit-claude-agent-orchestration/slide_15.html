<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .slide::before {
      content: '';
      position: absolute;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 800px;
      height: 800px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.16) 0%, rgba(139, 92, 246, 0) 70%);
      pointer-events: none;
    }
    .label {
      font-size: 26px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 36px;
      position: relative;
      z-index: 2;
    }
    .h {
      font-size: 52px;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 48px;
      position: relative;
      z-index: 2;
    }
    .accent { color: #F59E0B; }
    .takeaways {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 40px;
      position: relative;
      z-index: 2;
    }
    .row {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-radius: 12px;
      padding: 22px 26px;
      text-align: left;
      display: flex;
      gap: 22px;
      align-items: center;
    }
    .row.r1 { border-left: 4px solid #EF4444; }
    .row.r2 { border-left: 4px solid #8B5CF6; }
    .row.r3 { border-left: 4px solid #10B981; }
    .num {
      font-size: 44px;
      font-weight: 900;
      min-width: 56px;
      line-height: 1;
    }
    .row.r1 .num { color: #EF4444; }
    .row.r2 .num { color: #8B5CF6; }
    .row.r3 .num { color: #10B981; }
    .body {
      font-size: 26px;
      font-weight: 700;
      line-height: 1.4;
      flex: 1;
    }
    .signature {
      font-size: 32px;
      font-weight: 800;
      color: #F59E0B;
      line-height: 1.4;
      position: relative;
      z-index: 2;
      margin-bottom: 26px;
    }
    .brand {
      font-size: 22px;
      color: #6B6B80;
      letter-spacing: 3px;
      font-weight: 600;
      position: relative;
      z-index: 2;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="label">记住三件事</div>
    <div class="h">代码评审的下半场<br>是 <span class="accent">Plan 评审</span></div>
    <div class="takeaways">
      <div class="row r1">
        <div class="num">1</div>
        <div class="body">最大失败不是写错 · 是写对了别人没问的题</div>
      </div>
      <div class="row r2">
        <div class="num">2</div>
        <div class="body">Plan Mode 之上 · 再加一层产品级规划编排</div>
      </div>
      <div class="row r3">
        <div class="num">3</div>
        <div class="body">规划可以被 eval · 质量关前移传导整条下游</div>
      </div>
    </div>
    <div class="signature">问 AI 一句：<br>"我有哪几个地方没说清？"</div>
    <div class="brand">精读一篇 · 胜过刷一百条</div>
  </div>
</body>
</html>
