<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .label {
      font-size: 26px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 600;
      margin-bottom: 40px;
    }
    .stat {
      font-size: 140px;
      font-weight: 800;
      color: #F59E0B;
      line-height: 1;
      letter-spacing: -2px;
      margin-bottom: 16px;
    }
    .stat-unit {
      font-size: 38px;
      color: #B0B0CC;
      margin-bottom: 80px;
      font-weight: 500;
    }
    .verdict {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-left: 4px solid #EF4444;
      border-radius: 12px;
      padding: 36px 32px;
      text-align: left;
    }
    .verdict-tag {
      font-size: 22px;
      color: #EF4444;
      letter-spacing: 2px;
      font-weight: 700;
      margin-bottom: 18px;
    }
    .verdict-text {
      font-size: 40px;
      font-weight: 700;
      line-height: 1.4;
    }
    .verdict-sub {
      font-size: 28px;
      color: #B0B0CC;
      margin-top: 18px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="label">CODERABBIT 的体量</div>
    <div class="stat">200万</div>
    <div class="stat-unit">PR / 周 · 15000+ 客户</div>
    <div class="verdict">
      <div class="verdict-tag">最常见的失败模式</div>
      <div class="verdict-text">不是语法错误，也不是逻辑 bug</div>
      <div class="verdict-sub">是"功能上完全正确、但解的是另一道题"</div>
    </div>
  </div>
</body>
</html>
