<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .label {
      font-size: 26px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 600;
      margin-bottom: 48px;
    }
    .principle {
      font-size: 56px;
      font-weight: 800;
      line-height: 1.35;
      margin-bottom: 60px;
    }
    .accent { color: #F59E0B; }
    .quote-card {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-left: 4px solid #8B5CF6;
      border-radius: 12px;
      padding: 40px 36px;
      text-align: left;
      width: 100%;
    }
    .quote-mark {
      font-size: 80px;
      color: #8B5CF6;
      line-height: 0.5;
      margin-bottom: 8px;
      font-weight: 900;
    }
    .quote-text {
      font-size: 34px;
      line-height: 1.55;
      color: #FFFFFF;
      font-weight: 500;
    }
    .quote-by {
      font-size: 22px;
      color: #B0B0CC;
      margin-top: 20px;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="label">反直觉诊断</div>
    <div class="principle">
      焦点不在<span class="accent">模型</span><br>
      在你脑子里没说出口的事
    </div>
    <div class="quote-card">
      <div class="quote-mark">"</div>
      <div class="quote-text">
        我们做开发越久，知识就越是被内化进脑子里。所有这些东西全在我们脑子里，我们就默认其他开发者也知道。
      </div>
      <div class="quote-by">— David Loker, VP of AI, CodeRabbit</div>
    </div>
  </div>
</body>
</html>
