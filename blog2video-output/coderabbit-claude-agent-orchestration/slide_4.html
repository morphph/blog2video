<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .label {
      font-size: 26px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 600;
      margin-bottom: 48px;
    }
    .case-title {
      font-size: 44px;
      font-weight: 800;
      margin-bottom: 36px;
      line-height: 1.3;
    }
    .timeline {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .step {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.25);
      border-radius: 12px;
      padding: 26px 30px;
      text-align: left;
      display: flex;
      gap: 24px;
      align-items: flex-start;
    }
    .step-num {
      font-size: 28px;
      font-weight: 800;
      color: #8B5CF6;
      min-width: 40px;
      line-height: 1.5;
    }
    .step-body {
      font-size: 30px;
      line-height: 1.5;
      flex: 1;
    }
    .step.bad {
      border-left: 4px solid #EF4444;
    }
    .step.bad .step-num {
      color: #EF4444;
    }
    .punch {
      margin-top: 36px;
      font-size: 38px;
      font-weight: 800;
      color: #F59E0B;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="label">LOKER 自己踩的坑</div>
    <div class="case-title">让 Agent 做一个记忆系统</div>
    <div class="timeline">
      <div class="step">
        <div class="step-num">1</div>
        <div class="step-body">需求列了一堆，<b>漏写了登录方式</b></div>
      </div>
      <div class="step">
        <div class="step-num">2</div>
        <div class="step-body">Agent 没问，自己脑补了一套实现</div>
      </div>
      <div class="step bad">
        <div class="step-num">3</div>
        <div class="step-body">几小时之后，<b>全是白干的</b></div>
      </div>
    </div>
    <div class="punch">AI 只能在你没说的地方，自己猜</div>
  </div>
</body>
</html>
