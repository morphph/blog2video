<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .label {
      font-size: 26px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 600;
      margin-bottom: 36px;
    }
    .h {
      font-size: 48px;
      font-weight: 800;
      margin-bottom: 48px;
    }
    .vs-row {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .layer {
      background: #1A1A2E;
      border-radius: 12px;
      padding: 32px 30px;
      text-align: left;
      border: 1px solid rgba(139, 92, 246, 0.25);
    }
    .layer.top {
      border-left: 4px solid #F59E0B;
    }
    .layer.bot {
      border-left: 4px solid #3B82F6;
    }
    .layer-tag {
      font-size: 22px;
      letter-spacing: 2px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .layer.top .layer-tag { color: #F59E0B; }
    .layer.bot .layer-tag { color: #3B82F6; }
    .layer-name {
      font-size: 38px;
      font-weight: 800;
      margin-bottom: 12px;
      line-height: 1.3;
    }
    .layer-desc {
      font-size: 28px;
      color: #B0B0CC;
      line-height: 1.5;
    }
    .arrow {
      font-size: 38px;
      color: #6B6B80;
      text-align: center;
      font-weight: 800;
      letter-spacing: 4px;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="label">CODERABBIT 的解法</div>
    <div class="h">在 Claude Code 之前，再加一层</div>
    <div class="vs-row">
      <div class="layer top">
        <div class="layer-tag">上游 · 新增</div>
        <div class="layer-name">独立规划编排层</div>
        <div class="layer-desc">不写代码 · 把需求翻译成一份特别精确的执行计划</div>
      </div>
      <div class="arrow">▼</div>
      <div class="layer bot">
        <div class="layer-tag">下游 · 官方</div>
        <div class="layer-name">Claude Code + Plan Mode</div>
        <div class="layer-desc">写代码 · 被指向"又窄又准"的方向</div>
      </div>
    </div>
  </div>
</body>
</html>
