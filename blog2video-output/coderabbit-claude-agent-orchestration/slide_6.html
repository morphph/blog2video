<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .label {
      font-size: 26px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 600;
      margin-bottom: 40px;
    }
    .h {
      font-size: 56px;
      font-weight: 800;
      margin-bottom: 56px;
      line-height: 1.3;
    }
    .accent { color: #8B5CF6; }
    .duties {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 24px;
      margin-bottom: 48px;
    }
    .duty {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-radius: 12px;
      padding: 30px 30px;
      display: flex;
      align-items: center;
      gap: 28px;
      text-align: left;
    }
    .duty.up {
      border-left: 4px solid #8B5CF6;
    }
    .duty.down {
      border-left: 4px solid #3B82F6;
    }
    .duty-tag {
      font-size: 22px;
      letter-spacing: 2px;
      font-weight: 800;
      min-width: 130px;
    }
    .duty.up .duty-tag { color: #8B5CF6; }
    .duty.down .duty-tag { color: #3B82F6; }
    .duty-text {
      font-size: 36px;
      font-weight: 700;
      flex: 1;
      line-height: 1.4;
    }
    .punch {
      background: #1A1A2E;
      border: 1px solid rgba(245, 158, 11, 0.35);
      border-left: 4px solid #F59E0B;
      border-radius: 12px;
      padding: 24px 28px;
      width: 100%;
      text-align: left;
    }
    .punch-text {
      font-size: 30px;
      font-weight: 700;
      line-height: 1.4;
    }
    .punch-sub {
      font-size: 22px;
      color: #B0B0CC;
      margin-top: 6px;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="label">分工：两层在干两件事</div>
    <div class="h">规划不是 prompt 工程<br>是一个独立 <span class="accent">工程模块</span></div>
    <div class="duties">
      <div class="duty up">
        <div class="duty-tag">上游</div>
        <div class="duty-text">管"到底在写什么" → 产出 PRD</div>
      </div>
      <div class="duty down">
        <div class="duty-tag">下游</div>
        <div class="duty-text">管"怎么写" → 写代码</div>
      </div>
    </div>
    <div class="punch">
      <div class="punch-text">把团队决策 + 上下文 + 隐含假设全部显式化</div>
      <div class="punch-sub">沉淀成一份可协作编辑的文档</div>
    </div>
  </div>
</body>
</html>
