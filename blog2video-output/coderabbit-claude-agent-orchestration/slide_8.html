<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .label {
      font-size: 26px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 600;
      margin-bottom: 40px;
    }
    .principle {
      font-size: 56px;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 56px;
    }
    .accent { color: #F59E0B; }
    .quote-card {
      background: #1A1A2E;
      border: 1px solid rgba(245, 158, 11, 0.35);
      border-left: 4px solid #F59E0B;
      border-radius: 12px;
      padding: 36px 32px;
      text-align: left;
      width: 100%;
      margin-bottom: 28px;
    }
    .quote-text {
      font-size: 38px;
      font-weight: 700;
      line-height: 1.5;
      color: #FFFFFF;
    }
    .quote-by {
      font-size: 22px;
      color: #B0B0CC;
      margin-top: 18px;
      letter-spacing: 1px;
    }
    .ladder {
      width: 100%;
      display: flex;
      gap: 14px;
      align-items: stretch;
    }
    .step {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.25);
      border-radius: 10px;
      padding: 20px 16px;
      flex: 1;
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      line-height: 1.4;
    }
    .step b {
      display: block;
      font-size: 26px;
      color: #F59E0B;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="label">工程纪律</div>
    <div class="principle">
      能用 <span class="accent">Haiku</span> 就别上 Sonnet
    </div>
    <div class="quote-card">
      <div class="quote-text">"如果 Haiku 在某个任务上能做得跟 Sonnet 一样好，我们就用 Haiku。"</div>
      <div class="quote-by">— David Loker</div>
    </div>
    <div class="ladder">
      <div class="step"><b>每一步问</b>真的需要 Opus 吗？</div>
      <div class="step"><b>降一档</b>Sonnet 行不行？</div>
      <div class="step"><b>再降一档</b>Haiku 够不够？</div>
    </div>
  </div>
</body>
</html>
