<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .label {
      font-size: 26px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 600;
      margin-bottom: 36px;
    }
    .h {
      font-size: 52px;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 16px;
    }
    .sub {
      font-size: 28px;
      color: #B0B0CC;
      margin-bottom: 60px;
      letter-spacing: 1px;
    }
    .list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }
    .item {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.25);
      border-radius: 12px;
      padding: 28px 30px;
      text-align: left;
      display: flex;
      gap: 28px;
      align-items: center;
    }
    .item.green { border-left: 4px solid #10B981; }
    .item.amber { border-left: 4px solid #F59E0B; }
    .item.blue { border-left: 4px solid #3B82F6; }
    .num {
      font-size: 56px;
      font-weight: 900;
      min-width: 70px;
      line-height: 1;
    }
    .item.green .num { color: #10B981; }
    .item.amber .num { color: #F59E0B; }
    .item.blue .num { color: #3B82F6; }
    .body {
      flex: 1;
    }
    .name {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .desc {
      font-size: 24px;
      color: #B0B0CC;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="label">PLAN 的 EVAL 维度</div>
    <div class="h">规划本身要被打分</div>
    <div class="sub">手调样本 · 人工巡检 · 多维度 LLM judge</div>
    <div class="list">
      <div class="item green">
        <div class="num">1</div>
        <div class="body">
          <div class="name">功能完备度</div>
          <div class="desc">生成代码到底解没解决用户的题</div>
        </div>
      </div>
      <div class="item amber">
        <div class="num">2</div>
        <div class="body">
          <div class="name">Scope Creep</div>
          <div class="desc">范围有没有偷偷蔓延</div>
        </div>
      </div>
      <div class="item blue">
        <div class="num">3</div>
        <div class="body">
          <div class="name">Token 用量</div>
          <div class="desc">规划成本 / 延迟是否在预算内</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
