<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .cover {
      width: 100%;
      height: 100%;
      padding: 100px 72px 400px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .series-label {
      font-size: 30px;
      font-weight: 600;
      color: #8B5CF6;
      letter-spacing: 3px;
      margin-bottom: 64px;
    }
    .main-title {
      font-size: 92px;
      font-weight: 900;
      line-height: 1.3;
      margin-bottom: 56px;
      letter-spacing: 2px;
    }
    .main-title .red {
      color: #EF4444;
    }
    .main-title .yellow {
      color: #F59E0B;
    }
    .source-tag {
      background: #1A1A30;
      border-radius: 40px;
      padding: 14px 36px;
      font-size: 26px;
      color: #6B6B80;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="cover">
    <div class="series-label">精读AI · AI工具</div>
    <div class="main-title">AI编程助手<br><span class="red">不需要你</span><br><span class="yellow">也能干活了？</span></div>
    <div class="source-tag">Introducing Routines in Claude Code</div>
  </div>
</body>
</html>
