<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    .title {
      font-size: 48px;
      font-weight: 800;
      color: #8B5CF6;
      margin-bottom: 56px;
      text-align: center;
    }
    .diagram {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      width: 100%;
    }
    .component {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 28px 36px;
      display: flex;
      align-items: center;
      gap: 24px;
    }
    .component .icon {
      font-size: 40px;
      width: 56px;
      text-align: center;
      flex-shrink: 0;
    }
    .component .label {
      font-size: 34px;
      font-weight: 700;
      color: #FFFFFF;
    }
    .component .desc {
      font-size: 26px;
      color: #B0B0CC;
      margin-top: 4px;
    }
    .arrow {
      font-size: 32px;
      color: #6B7280;
    }
    .cloud-badge {
      margin-top: 40px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 40px;
      padding: 16px 40px;
      font-size: 30px;
      font-weight: 700;
      color: #10B981;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="title">什么是 Routine？</div>
    <div class="diagram">
      <div class="component">
        <div class="icon">📝</div>
        <div>
          <div class="label">Prompt</div>
          <div class="desc">告诉 AI 该做什么</div>
        </div>
      </div>
      <div class="arrow">＋</div>
      <div class="component">
        <div class="icon">📦</div>
        <div>
          <div class="label">代码仓库</div>
          <div class="desc">提供工作上下文</div>
        </div>
      </div>
      <div class="arrow">＋</div>
      <div class="component">
        <div class="icon">🔗</div>
        <div>
          <div class="label">Connector</div>
          <div class="desc">Slack · Linear · 外部工具</div>
        </div>
      </div>
    </div>
    <div class="cloud-badge">云端自主执行 · 无需人工干预</div>
  </div>
</body>
</html>
