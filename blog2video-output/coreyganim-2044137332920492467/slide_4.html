<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    .title {
      font-size: 44px;
      font-weight: 800;
      color: #3B82F6;
      margin-bottom: 48px;
      text-align: center;
    }
    .scenes {
      display: flex;
      flex-direction: column;
      gap: 24px;
      width: 100%;
    }
    .scene {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 28px 32px;
      position: relative;
    }
    .scene-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 12px;
    }
    .scene-num {
      background: #8B5CF6;
      color: #FFFFFF;
      font-size: 22px;
      font-weight: 800;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .scene-title {
      font-size: 32px;
      font-weight: 700;
    }
    .scene-flow {
      font-size: 24px;
      color: #B0B0CC;
      line-height: 1.6;
      padding-left: 56px;
    }
    .scene-flow .action {
      color: #10B981;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="title">真实场景 ①②③</div>
    <div class="scenes">
      <div class="scene">
        <div class="scene-header">
          <div class="scene-num">1</div>
          <div class="scene-title">积压工单维护</div>
        </div>
        <div class="scene-flow">每晚定时 → 读 issue → <span class="action">自动打标签分配</span></div>
      </div>
      <div class="scene">
        <div class="scene-header">
          <div class="scene-num">2</div>
          <div class="scene-title">报警分诊</div>
        </div>
        <div class="scene-flow">错误率超标 → API 触发 → <span class="action">开 draft PR 附修复方案</span></div>
      </div>
      <div class="scene">
        <div class="scene-header">
          <div class="scene-num">3</div>
          <div class="scene-title">代码审查</div>
        </div>
        <div class="scene-flow">PR 触发 → 按 checklist 审查 → <span class="action">行级评论标注问题</span></div>
      </div>
    </div>
  </div>
</body>
</html>
