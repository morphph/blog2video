<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .label {
      font-size: 26px;
      font-weight: 600;
      color: #EF4444;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 32px;
    }
    .principle-text {
      font-size: 52px;
      font-weight: 800;
      line-height: 1.4;
      margin-bottom: 48px;
    }
    .principle-text .highlight {
      color: #EF4444;
    }
    .divider-line {
      width: 120px;
      height: 3px;
      background: rgba(139, 92, 246, 0.4);
      border-radius: 2px;
      margin-bottom: 48px;
    }
    .detail-box {
      background: #1A1A2E;
      border: 1px solid rgba(239, 68, 68, 0.25);
      border-left: 4px solid #EF4444;
      border-radius: 12px;
      padding: 28px 36px;
      width: 100%;
      text-align: left;
    }
    .detail-row {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 16px;
    }
    .detail-row:last-child { margin-bottom: 0; }
    .detail-icon {
      font-size: 26px;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .detail-text {
      font-size: 28px;
      color: #B0B0CC;
      line-height: 1.5;
    }
    .detail-text strong {
      color: #FFFFFF;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="label">设计原则</div>
    <div class="principle-text">所有操作以<br><span class="highlight">你的身份</span>执行</div>
    <div class="divider-line"></div>
    <div class="detail-box">
      <div class="detail-row">
        <div class="detail-icon">→</div>
        <div class="detail-text"><strong>PR / Slack / Linear</strong> 都挂你的名字</div>
      </div>
      <div class="detail-row">
        <div class="detail-icon">→</div>
        <div class="detail-text"><strong>可追溯</strong>，但责任也绑定个人</div>
      </div>
      <div class="detail-row">
        <div class="detail-icon">→</div>
        <div class="detail-text"><strong>不支持团队共享</strong>，占个人额度</div>
      </div>
    </div>
  </div>
</body>
</html>
