<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .title {
      font-size: 44px;
      font-weight: 800;
      color: #FFFFFF;
      margin-bottom: 56px;
    }
    .tiers {
      display: flex;
      gap: 20px;
      width: 100%;
      justify-content: center;
    }
    .tier {
      flex: 1;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 32px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .tier.featured {
      border-color: rgba(139, 92, 246, 0.5);
      background: linear-gradient(180deg, #1A1A2E 0%, rgba(139, 92, 246, 0.08) 100%);
    }
    .tier-name {
      font-size: 28px;
      font-weight: 600;
      color: #B0B0CC;
    }
    .tier-number {
      font-size: 80px;
      font-weight: 800;
      line-height: 1;
    }
    .tier:nth-child(1) .tier-number { color: #6B7280; }
    .tier:nth-child(2) .tier-number { color: #8B5CF6; }
    .tier:nth-child(3) .tier-number { color: #F59E0B; }
    .tier-unit {
      font-size: 24px;
      color: #6B7280;
    }
    .insight {
      margin-top: 52px;
      background: #1A1A2E;
      border-left: 4px solid #8B5CF6;
      border-radius: 12px;
      padding: 24px 32px;
      width: 100%;
      text-align: left;
    }
    .insight-text {
      font-size: 28px;
      color: #B0B0CC;
      line-height: 1.6;
    }
    .insight-text em {
      color: #8B5CF6;
      font-style: normal;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="title">每日运行限额</div>
    <div class="tiers">
      <div class="tier">
        <div class="tier-name">Pro</div>
        <div class="tier-number">5</div>
        <div class="tier-unit">次/天</div>
      </div>
      <div class="tier featured">
        <div class="tier-name">Max</div>
        <div class="tier-number">15</div>
        <div class="tier-unit">次/天</div>
      </div>
      <div class="tier">
        <div class="tier-name">Enterprise</div>
        <div class="tier-number">25</div>
        <div class="tier-unit">次/天</div>
      </div>
    </div>
    <div class="insight">
      <div class="insight-text">定位为<em>高价值精准任务</em>，而非廉价批量自动化</div>
    </div>
  </div>
</body>
</html>
