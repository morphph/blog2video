<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .label {
      font-size: 26px;
      font-weight: 600;
      color: #10B981;
      letter-spacing: 4px;
      margin-bottom: 36px;
    }
    .shift {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 28px;
      margin-bottom: 52px;
      width: 100%;
    }
    .shift-box {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 24px 28px;
      flex: 1;
    }
    .shift-box .mode {
      font-size: 30px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .shift-box .desc {
      font-size: 22px;
      color: #6B7280;
    }
    .shift-box.old .mode { color: #6B7280; }
    .shift-box.new {
      border-color: rgba(16, 185, 129, 0.4);
    }
    .shift-box.new .mode { color: #10B981; }
    .shift-arrow {
      font-size: 40px;
      color: #8B5CF6;
      flex-shrink: 0;
    }
    .summary-title {
      font-size: 48px;
      font-weight: 800;
      line-height: 1.4;
      margin-bottom: 44px;
    }
    .summary-title .green { color: #10B981; }
    .traits {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .trait {
      background: rgba(139, 92, 246, 0.1);
      border: 1px solid rgba(139, 92, 246, 0.25);
      border-radius: 24px;
      padding: 10px 24px;
      font-size: 26px;
      color: #B0B0CC;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="label">范式变化</div>
    <div class="shift">
      <div class="shift-box old">
        <div class="mode">对话模式</div>
        <div class="desc">你问我答</div>
      </div>
      <div class="shift-arrow">→</div>
      <div class="shift-box new">
        <div class="mode">后台服务</div>
        <div class="desc">事件驱动</div>
      </div>
    </div>
    <div class="summary-title">下一步不是写得更好<br>而是<span class="green">不需要你在场</span></div>
    <div class="traits">
      <div class="trait">响应 GitHub 事件</div>
      <div class="trait">接收 API 调用</div>
      <div class="trait">按计划执行</div>
    </div>
  </div>
</body>
</html>
