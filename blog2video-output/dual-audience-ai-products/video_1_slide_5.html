<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1080px; height: 1920px; background: #0D0D1A; font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif; color: #FFFFFF; overflow: hidden; }
    .slide { width: 100%; height: 100%; padding: 120px 72px 520px 72px; display: flex; flex-direction: column; justify-content: flex-start; align-items: center; text-align: center; position: relative; }

    .slide-title {
      font-size: 40px;
      font-weight: 800;
      margin-bottom: 44px;
      color: #FFFFFF;
    }

    .slide-title .accent {
      color: #10B981;
    }

    /* Summary card */
    .summary-card {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 32px 28px;
      margin-bottom: 28px;
      text-align: left;
    }

    .summary-label {
      font-size: 20px;
      color: #6B7280;
      margin-bottom: 20px;
    }

    .summary-points {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .summary-point {
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }

    .summary-dot {
      flex-shrink: 0;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-top: 10px;
    }

    .summary-dot.red    { background: #EF4444; }
    .summary-dot.yellow { background: #F59E0B; }
    .summary-dot.purple { background: #8B5CF6; }

    .summary-text {
      font-size: 26px;
      color: #B0B0CC;
      line-height: 1.5;
    }

    .summary-text strong {
      color: #FFFFFF;
      font-weight: 700;
    }

    .summary-text .num {
      color: #EF4444;
      font-weight: 800;
    }

    .summary-text .concept {
      color: #8B5CF6;
      font-weight: 700;
    }

    /* Action card */
    .action-card {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-left: 4px solid #10B981;
      border-radius: 12px;
      padding: 28px;
      text-align: left;
    }

    .action-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .action-icon {
      font-size: 28px;
    }

    .action-label {
      font-size: 24px;
      font-weight: 700;
      color: #10B981;
    }

    .action-text {
      font-size: 28px;
      color: #FFFFFF;
      font-weight: 700;
      line-height: 1.5;
      margin-bottom: 12px;
    }

    .action-detail {
      font-size: 22px;
      color: #6B7280;
      line-height: 1.5;
    }

    .action-detail .hl {
      color: #10B981;
      font-weight: 600;
    }

    /* Footer */
    .footer-tagline {
      margin-top: 36px;
      font-size: 24px;
      color: #6B7280;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="slide-title"><span class="accent">&#x2714;</span> 总结</div>

    <div class="summary-card">
      <div class="summary-label">核心要点回顾</div>
      <div class="summary-points">
        <div class="summary-point">
          <div class="summary-dot red"></div>
          <div class="summary-text">YC 春季批次 <span class="num">47%</span> 做 AI Agent<br>Agent 经济不是未来，<strong>正在发生</strong></div>
        </div>
        <div class="summary-point">
          <div class="summary-dot yellow"></div>
          <div class="summary-text">市场从 <span class="num">$7.9B</span> 爆发至 <span class="num">$236B</span><br>Gartner 预测企业渗透率 <span class="num">40%</span></div>
        </div>
        <div class="summary-point">
          <div class="summary-dot purple"></div>
          <div class="summary-text"><span class="concept">B2A</span> 正在成为 B2C 和 B2B 之后的<br><strong>第三种商业模式</strong></div>
        </div>
      </div>
    </div>

    <div class="action-card">
      <div class="action-header">
        <div class="action-icon">&#x1F3AF;</div>
        <div class="action-label">现在就做一件事</div>
      </div>
      <div class="action-text">统计 API 调用中<br>Agent 类请求占比</div>
      <div class="action-detail">打开后台，查看有多少来自自动化或 Agent 请求<br>这个数字 = 你启动 <span class="hl">B2A 策略</span>的起点</div>
    </div>

    <div class="footer-tagline">AI 世界很吵，精读一篇，胜过刷一百条</div>
  </div>
</body>
</html>
