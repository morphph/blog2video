<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1080px; height: 1920px; background: #0D0D1A; font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif; color: #FFFFFF; overflow: hidden; }
    .slide { width: 100%; height: 100%; padding: 120px 72px 520px 72px; display: flex; flex-direction: column; justify-content: flex-start; align-items: center; text-align: center; position: relative; }
    .section-title { font-size: 40px; font-weight: 800; margin-bottom: 40px; color: #FFFFFF; }
    .section-title .accent { color: #8B5CF6; }
    .cards-container { width: 100%; display: flex; flex-direction: column; gap: 20px; margin-bottom: 40px; }
    .protocol-card { background: #1A1A2E; border-radius: 12px; padding: 28px 28px 24px 28px; text-align: left; position: relative; overflow: hidden; }
    .protocol-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; }
    .card-mcp::before { background: #8B5CF6; }
    .card-mcp { border: 1px solid rgba(139, 92, 246, 0.25); }
    .card-a2a::before { background: #3B82F6; }
    .card-a2a { border: 1px solid rgba(59, 130, 246, 0.25); }
    .card-llms::before { background: #10B981; }
    .card-llms { border: 1px solid rgba(16, 185, 129, 0.25); }
    .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .card-name { font-size: 36px; font-weight: 900; }
    .card-mcp .card-name { color: #8B5CF6; }
    .card-a2a .card-name { color: #3B82F6; }
    .card-llms .card-name { color: #10B981; }
    .card-org { font-size: 22px; color: #6B7280; font-weight: 600; }
    .card-metaphor { font-size: 28px; font-weight: 700; color: #FFFFFF; margin-bottom: 8px; }
    .card-detail { font-size: 24px; color: #B0B0CC; line-height: 1.5; }
    .card-tag { display: inline-block; padding: 4px 14px; border-radius: 14px; font-size: 20px; font-weight: 700; margin-top: 12px; }
    .card-mcp .card-tag { background: rgba(139, 92, 246, 0.15); color: #8B5CF6; }
    .card-a2a .card-tag { background: rgba(59, 130, 246, 0.15); color: #3B82F6; }
    .card-llms .card-tag { background: rgba(16, 185, 129, 0.15); color: #10B981; }
    .summary-row { width: 100%; display: flex; gap: 12px; }
    .summary-item { flex: 1; background: #1A1A2E; border: 1px solid rgba(139, 92, 246, 0.15); border-radius: 12px; padding: 20px 12px; text-align: center; }
    .summary-label { font-size: 22px; color: #6B7280; margin-bottom: 8px; font-weight: 600; }
    .summary-value { font-size: 26px; font-weight: 700; }
    .summary-item:nth-child(1) .summary-value { color: #8B5CF6; }
    .summary-item:nth-child(2) .summary-value { color: #3B82F6; }
    .summary-item:nth-child(3) .summary-value { color: #10B981; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="section-title"><span class="accent">三大协议</span>，各司其职</div>
    <div class="cards-container">
      <div class="protocol-card card-mcp">
        <div class="card-header">
          <div class="card-name">MCP</div>
          <div class="card-org">Anthropic</div>
        </div>
        <div class="card-metaphor">AI 界的 USB-C</div>
        <div class="card-detail">统一工具接口，让 Agent 即插即用地调用各种服务</div>
        <div class="card-tag">怎么用工具</div>
      </div>
      <div class="protocol-card card-a2a">
        <div class="card-header">
          <div class="card-name">A2A</div>
          <div class="card-org">Google · 150+ 组织</div>
        </div>
        <div class="card-metaphor">Agent 间的外交协议</div>
        <div class="card-detail">不同 Agent 之间的通信标准，实现跨系统协作</div>
        <div class="card-tag">怎么合作</div>
      </div>
      <div class="protocol-card card-llms">
        <div class="card-header">
          <div class="card-name">llms.txt</div>
          <div class="card-org">社区标准</div>
        </div>
        <div class="card-metaphor">AI 版 robots.txt</div>
        <div class="card-detail">告诉 AI Agent 你的网站有什么、怎么用</div>
        <div class="card-tag">怎么被发现</div>
      </div>
    </div>
    <div class="summary-row">
      <div class="summary-item">
        <div class="summary-label">MCP</div>
        <div class="summary-value">使用</div>
      </div>
      <div class="summary-item">
        <div class="summary-label">A2A</div>
        <div class="summary-value">协作</div>
      </div>
      <div class="summary-item">
        <div class="summary-label">llms.txt</div>
        <div class="summary-value">发现</div>
      </div>
    </div>
  </div>
</body>
</html>
