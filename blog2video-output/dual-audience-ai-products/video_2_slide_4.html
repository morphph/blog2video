<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1080px; height: 1920px; background: #0D0D1A; font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif; color: #FFFFFF; overflow: hidden; }
    .slide { width: 100%; height: 100%; padding: 120px 72px 520px 72px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; position: relative; }
    .quote-icon { font-size: 80px; color: #8B5CF6; opacity: 0.4; margin-bottom: 24px; font-family: Georgia, serif; line-height: 1; }
    .story-card { background: #1A1A2E; border: 1px solid rgba(139, 92, 246, 0.2); border-radius: 12px; padding: 36px 32px; margin-bottom: 40px; text-align: left; width: 100%; }
    .story-brand { font-size: 36px; font-weight: 900; color: #10B981; margin-bottom: 16px; display: flex; align-items: center; gap: 12px; }
    .story-brand .badge { background: rgba(16, 185, 129, 0.15); color: #10B981; font-size: 20px; font-weight: 700; padding: 4px 14px; border-radius: 14px; }
    .story-text { font-size: 28px; color: #B0B0CC; line-height: 1.6; }
    .story-text .em { color: #FFFFFF; font-weight: 700; }
    .featured-quote { width: 100%; background: linear-gradient(135deg, rgba(139, 92, 246, 0.12), rgba(245, 158, 11, 0.08)); border: 1px solid rgba(139, 92, 246, 0.3); border-left: 4px solid #8B5CF6; border-radius: 12px; padding: 36px 32px; margin-bottom: 40px; }
    .featured-text { font-size: 38px; font-weight: 800; color: #FFFFFF; line-height: 1.4; }
    .featured-text .highlight { color: #F59E0B; }
    .insight { font-size: 26px; color: #6B7280; line-height: 1.6; }
    .insight .key { color: #8B5CF6; font-weight: 700; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="quote-icon">"</div>
    <div class="story-card">
      <div class="story-brand">
        Supabase
        <span class="badge">Postgres</span>
      </div>
      <div class="story-text">
        被 Agent 选为<span class="em">默认 Postgres 方案</span><br>
        不是因为功能最强<br>
        不是因为价格最低<br>
        而是因为 —— <span class="em">文档写得最好</span>
      </div>
    </div>
    <div class="featured-quote">
      <div class="featured-text">
        <span class="highlight">文档质量</span><br>= Agent 获客能力
      </div>
    </div>
    <div class="insight">
      在 AX 时代，<span class="key">文档就是你的销售团队</span><br>
      Agent 不会打电话、不会看广告，只会读文档
    </div>
  </div>
</body>
</html>
