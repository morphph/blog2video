<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1080px; height: 1920px; background: #0D0D1A; font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif; color: #FFFFFF; overflow: hidden; }
    .slide { width: 100%; height: 100%; padding: 120px 72px 520px 72px; display: flex; flex-direction: column; justify-content: flex-start; align-items: center; text-align: center; position: relative; }

    .section-label {
      font-size: 22px;
      color: #8B5CF6;
      font-weight: 700;
      letter-spacing: 4px;
      margin-bottom: 32px;
    }

    .formula-card {
      width: 100%;
      background: #1A1A2E;
      border-radius: 12px;
      padding: 36px 32px;
      border: 1px solid rgba(139, 92, 246, 0.3);
      margin-bottom: 48px;
    }

    .formula-title {
      font-size: 24px;
      color: #B0B0CC;
      margin-bottom: 24px;
      font-weight: 500;
    }

    .formula {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .formula-item {
      font-size: 28px;
      font-weight: 800;
      padding: 12px 20px;
      border-radius: 10px;
    }

    .formula-item.doc {
      background: rgba(139, 92, 246, 0.15);
      color: #8B5CF6;
    }

    .formula-item.agent {
      background: rgba(59, 130, 246, 0.15);
      color: #3B82F6;
    }

    .formula-item.lever {
      background: rgba(245, 158, 11, 0.15);
      color: #F59E0B;
    }

    .formula-plus {
      font-size: 32px;
      color: #6B7280;
      font-weight: 700;
    }

    .formula-equals {
      font-size: 32px;
      color: #10B981;
      font-weight: 800;
    }

    .formula-result {
      font-size: 30px;
      font-weight: 900;
      color: #10B981;
      padding: 12px 24px;
      background: rgba(16, 185, 129, 0.12);
      border-radius: 10px;
    }

    .action-title {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 8px;
      color: #F59E0B;
    }

    .action-subtitle {
      font-size: 22px;
      color: #6B7280;
      margin-bottom: 28px;
    }

    .actions {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .action-item {
      display: flex;
      align-items: center;
      gap: 20px;
      background: #1A1A2E;
      border-radius: 12px;
      padding: 24px;
      border: 1px solid rgba(139, 92, 246, 0.2);
      text-align: left;
    }

    .action-num {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 800;
      flex-shrink: 0;
    }

    .action-item:nth-child(1) .action-num {
      background: rgba(239, 68, 68, 0.15);
      color: #EF4444;
    }

    .action-item:nth-child(2) .action-num {
      background: rgba(245, 158, 11, 0.15);
      color: #F59E0B;
    }

    .action-item:nth-child(3) .action-num {
      background: rgba(16, 185, 129, 0.15);
      color: #10B981;
    }

    .action-text {
      flex: 1;
    }

    .action-main {
      font-size: 26px;
      font-weight: 700;
      color: #FFFFFF;
      margin-bottom: 4px;
      line-height: 1.4;
    }

    .action-detail {
      font-size: 20px;
      color: #6B7280;
      line-height: 1.4;
    }
  </style>
</head>
<body>
<div class="slide">

  <div class="section-label">&#9733; &#26680;&#24515;&#20844;&#24335;</div>

  <div class="formula-card">
    <div class="formula-title">Agent-Ready 产品的三大支柱</div>
    <div class="formula">
      <span class="formula-item doc">文档即产品</span>
      <span class="formula-plus">+</span>
      <span class="formula-item agent">Agent即用户</span>
      <span class="formula-plus">+</span>
      <span class="formula-item lever">小改动大杠杆</span>
    </div>
    <div style="margin-top: 20px;">
      <div class="formula">
        <span class="formula-equals">=</span>
        <span class="formula-result">Agent-Ready &#9989;</span>
      </div>
    </div>
  </div>

  <div class="action-title">&#128640; 本周就能做的三步</div>
  <div class="action-subtitle">不需要重构，从最小切口开始</div>

  <div class="actions">
    <div class="action-item">
      <div class="action-num">1</div>
      <div class="action-text">
        <div class="action-main">审计你的 API 报错信息</div>
        <div class="action-detail">每条报错都加上"下一步该怎么做"</div>
      </div>
    </div>
    <div class="action-item">
      <div class="action-num">2</div>
      <div class="action-text">
        <div class="action-main">写一个 llms.txt 文件</div>
        <div class="action-detail">告诉 Agent 你的产品能做什么、怎么调用</div>
      </div>
    </div>
    <div class="action-item">
      <div class="action-num">3</div>
      <div class="action-text">
        <div class="action-main">用 Agent 跑一遍你的核心流程</div>
        <div class="action-detail">Cursor / Claude 实测，记录卡点并修复</div>
      </div>
    </div>
  </div>

</div>
</body>
</html>
