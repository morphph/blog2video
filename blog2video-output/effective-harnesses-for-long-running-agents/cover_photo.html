<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 120px 72px 180px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .series-tag {
      font-size: 28px;
      color: #8B5CF6;
      letter-spacing: 2px;
      font-weight: 600;
      margin-bottom: 64px;
    }

    .main-title {
      font-size: 68px;
      font-weight: 900;
      line-height: 1.4;
      text-align: center;
      margin-bottom: 64px;
    }
    .main-title .highlight-red {
      color: #EF4444;
    }
    .main-title .highlight-yellow {
      color: #F59E0B;
    }

    .source-capsule {
      display: inline-flex;
      align-items: center;
      background: #1A1A2E;
      border: 1px solid #2A2A4A;
      border-radius: 40px;
      padding: 14px 32px;
      font-size: 22px;
      color: #B0B0CC;
      line-height: 1.4;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="slide">

    <div class="series-tag">AI 精读 &middot; Agent 架构</div>

    <div class="main-title">
      Agent 写到一半<br>
      就<span class="highlight-red">失忆</span>了？<br>
      <span class="highlight-yellow">"接力方案"</span>怎么做
    </div>

    <div class="source-capsule">
      Anthropic《Effective Harnesses for Long-Running Agents》
    </div>

  </div>
</body>
</html>
