<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 120px 72px 180px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(139, 92, 246, 0.15);
      border: 1px solid rgba(139, 92, 246, 0.4);
      border-radius: 24px;
      padding: 10px 22px;
      font-size: 26px;
      color: #8B5CF6;
      width: fit-content;
      margin-bottom: 48px;
      letter-spacing: 1px;
      font-weight: 600;
    }

    .title-area {
      margin-bottom: 56px;
    }
    .title-line {
      font-size: 62px;
      font-weight: 800;
      line-height: 1.4;
      letter-spacing: -0.5px;
    }
    .highlight-purple {
      color: #8B5CF6;
    }
    .highlight-red {
      color: #EF4444;
    }
    .title-sub {
      font-size: 34px;
      color: #B0B0CC;
      margin-top: 20px;
      line-height: 1.5;
    }

    .cards {
      display: flex;
      flex-direction: column;
      gap: 22px;
    }
    .card {
      background: #1A1A2E;
      border: 1px solid #2A2A4A;
      border-radius: 12px;
      padding: 26px 28px;
      display: flex;
      align-items: flex-start;
      gap: 20px;
    }
    .card-icon {
      font-size: 32px;
      flex-shrink: 0;
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
    }
    .card-icon.red-bg {
      background: rgba(239, 68, 68, 0.12);
    }
    .card-icon.yellow-bg {
      background: rgba(245, 158, 11, 0.12);
    }
    .card-text {
      flex: 1;
    }
    .card-title {
      font-size: 30px;
      font-weight: 700;
      color: #FFFFFF;
      margin-bottom: 6px;
    }
    .card-desc {
      font-size: 25px;
      color: #B0B0CC;
      line-height: 1.5;
    }

    .source {
      margin-top: 40px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .source-dot {
      width: 10px;
      height: 10px;
      background: #8B5CF6;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .source-text {
      font-size: 24px;
      color: #6B7280;
    }
  </style>
</head>
<body>
  <div class="slide">

    <div class="badge">Anthropic 官方工程博客</div>

    <div class="title-area">
      <div class="title-line">让最强模型</div>
      <div class="title-line"><span class="highlight-purple">克隆 claude.ai</span></div>
      <div class="title-line">写到一半就<span class="highlight-red">失忆</span>了</div>
      <div class="title-sub">之前做的全不记得，怎么解？</div>
    </div>

    <div class="cards">
      <div class="card">
        <div class="card-icon red-bg">&#x1F4A5;</div>
        <div class="card-text">
          <div class="card-title">上下文爆掉</div>
          <div class="card-desc">写到一半的功能全部丢失，下个 session 只能从头猜</div>
        </div>
      </div>
      <div class="card">
        <div class="card-icon red-bg">&#x1F921;</div>
        <div class="card-text">
          <div class="card-title">谎报完工</div>
          <div class="card-desc">看到有点进度就宣布"做完了"——其实还差一大截</div>
        </div>
      </div>
      <div class="card">
        <div class="card-icon yellow-bg">&#x2753;</div>
        <div class="card-text">
          <div class="card-title">怎么解？</div>
          <div class="card-desc">方法比你想的要简单粗暴</div>
        </div>
      </div>
    </div>

  </div>
</body>
</html>
