<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .series-tag {
      font-size: 28px;
      color: #8B5CF6;
      font-weight: 600;
      margin-bottom: 40px;
      letter-spacing: 2px;
    }
    .title {
      font-size: 72px;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 48px;
    }
    .title .highlight {
      color: #EF4444;
    }
    .subtitle {
      font-size: 34px;
      color: #B0B0CC;
      line-height: 1.6;
      max-width: 860px;
    }
    .source-badge {
      position: absolute;
      bottom: 440px;
      display: inline-block;
      background: rgba(139, 92, 246, 0.12);
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-radius: 999px;
      padding: 10px 28px;
      font-size: 22px;
      color: #8B5CF6;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="series-tag">精读AI · Anthropic 官方工程博客</div>
    <div class="title">
      Agent连续工作数小时<br>到底怎么<span class="highlight">翻车</span>的？
    </div>
    <div class="subtitle">
      Anthropic 总结出<br><strong style="color:#F59E0B;">三种系统性失败模式</strong><br>搞清楚这些，才能真正用好 Agent
    </div>
    <div class="source-badge">📄 Effective Harnesses for Long-Running Agents</div>
  </div>
</body>
</html>
