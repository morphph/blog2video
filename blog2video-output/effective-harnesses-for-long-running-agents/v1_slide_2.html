<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .badge {
      font-size: 26px;
      color: #EF4444;
      font-weight: 700;
      letter-spacing: 3px;
      margin-bottom: 36px;
      text-transform: uppercase;
    }
    .title {
      font-size: 64px;
      font-weight: 800;
      margin-bottom: 48px;
      line-height: 1.3;
    }
    .title .highlight {
      color: #EF4444;
    }
    .card {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-left: 4px solid #F59E0B;
      border-radius: 12px;
      padding: 32px 36px;
      width: 100%;
      max-width: 900px;
      text-align: left;
      margin-bottom: 28px;
    }
    .card-label {
      font-size: 24px;
      color: #F59E0B;
      font-weight: 700;
      margin-bottom: 14px;
      letter-spacing: 1px;
    }
    .card-text {
      font-size: 32px;
      color: #B0B0CC;
      line-height: 1.6;
    }
    .card-text strong {
      color: #FFFFFF;
    }
    .analogy-card {
      border-left-color: #8B5CF6;
    }
    .analogy-card .card-label {
      color: #8B5CF6;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="badge">失败模式 #1</div>
    <div class="title">
      <span class="highlight">过早宣布胜利</span>
    </div>
    <div class="card">
      <div class="card-label">现象</div>
      <div class="card-text">
        Agent 看到项目里已有代码<br>就直接宣布<strong>"项目完成"</strong><br>根本<strong>不去验证</strong>代码能不能跑通
      </div>
    </div>
    <div class="card analogy-card">
      <div class="card-label">类比</div>
      <div class="card-text">
        装修工人看到一面墙有底漆<br>就说<strong>"活干完了"</strong><br>其他三面墙纹丝不动
      </div>
    </div>
  </div>
</body>
</html>
