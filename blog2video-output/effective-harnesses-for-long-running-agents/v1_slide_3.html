<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
      gap: 32px;
    }
    .section-title {
      font-size: 42px;
      font-weight: 700;
      color: #B0B0CC;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }
    .card {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 32px 36px;
      width: 100%;
      max-width: 900px;
      text-align: left;
    }
    .card-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
    }
    .card-number {
      font-size: 22px;
      font-weight: 800;
      color: #0D0D1A;
      background: #F59E0B;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card-title {
      font-size: 36px;
      font-weight: 800;
    }
    .card-desc {
      font-size: 30px;
      color: #B0B0CC;
      line-height: 1.6;
      padding-left: 56px;
    }
    .card-desc strong {
      color: #FFFFFF;
    }
    .card-2 {
      border-left: 4px solid #F59E0B;
    }
    .card-2 .card-title {
      color: #F59E0B;
    }
    .card-3 {
      border-left: 4px solid #EF4444;
    }
    .card-3 .card-title {
      color: #EF4444;
    }
    .card-3 .card-number {
      background: #EF4444;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="section-title">失败模式 #2 & #3</div>
    <div class="card card-2">
      <div class="card-header">
        <div class="card-number">2</div>
        <div class="card-title">Context Window 耗尽</div>
      </div>
      <div class="card-desc">
        Agent 的工作记忆就像一块<strong>白板</strong><br>面积有限，写满了就没法再记新东西<br>一口气处理所有任务 → <strong>白板写满</strong>
      </div>
    </div>
    <div class="card card-3">
      <div class="card-header">
        <div class="card-number">3</div>
        <div class="card-title">状态丢失</div>
      </div>
      <div class="card-desc">
        每个新会话启动时<br>Agent 对之前发生过什么<strong>一无所知</strong><br>没有交接 → <strong>浪费时间重新探索</strong>
      </div>
    </div>
  </div>
</body>
</html>
