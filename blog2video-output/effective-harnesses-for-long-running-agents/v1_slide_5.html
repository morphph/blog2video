<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
      gap: 48px;
    }
    .label {
      font-size: 26px;
      color: #8B5CF6;
      font-weight: 700;
      letter-spacing: 3px;
    }
    .takeaway {
      font-size: 56px;
      font-weight: 800;
      line-height: 1.4;
      max-width: 860px;
    }
    .takeaway .not {
      color: #EF4444;
    }
    .takeaway .yes {
      color: #10B981;
    }
    .recap-card {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 28px 36px;
      width: 100%;
      max-width: 900px;
      text-align: left;
    }
    .recap-item {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 18px;
      font-size: 30px;
      color: #B0B0CC;
      line-height: 1.5;
    }
    .recap-item:last-child {
      margin-bottom: 0;
    }
    .recap-num {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(139, 92, 246, 0.2);
      color: #8B5CF6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 800;
      margin-top: 4px;
    }
    .recap-text strong {
      color: #FFFFFF;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="label">核心结论</div>
    <div class="takeaway">
      Agent <span class="not">不是不够聪明</span><br>而是没有<span class="yes">防篡改的<br>任务清单和交接机制</span>
    </div>
    <div class="recap-card">
      <div class="recap-item">
        <div class="recap-num">1</div>
        <div class="recap-text"><strong>过早宣布胜利</strong> — 不验证就说完成</div>
      </div>
      <div class="recap-item">
        <div class="recap-num">2</div>
        <div class="recap-text"><strong>Context 耗尽</strong> — 工作记忆写满崩溃</div>
      </div>
      <div class="recap-item">
        <div class="recap-num">3</div>
        <div class="recap-text"><strong>状态丢失</strong> — 新会话从零开始</div>
      </div>
    </div>
  </div>
</body>
</html>
