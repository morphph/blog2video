<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .title {
      font-size: 48px;
      font-weight: 800;
      margin-bottom: 48px;
      color: #8B5CF6;
    }
    .card {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 28px 32px;
      width: 100%;
      text-align: left;
      margin-bottom: 24px;
    }
    .card-init {
      border-left: 4px solid #3B82F6;
    }
    .card-coding {
      border-left: 4px solid #10B981;
    }
    .card .role {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 10px;
    }
    .card .role-blue {
      color: #3B82F6;
    }
    .card .role-green {
      color: #10B981;
    }
    .card .desc {
      font-size: 32px;
      color: #B0B0CC;
      line-height: 1.5;
    }
    .card .desc .white {
      color: #FFFFFF;
      font-weight: 700;
    }
    .bottom-text {
      margin-top: 36px;
      font-size: 34px;
      font-weight: 700;
      line-height: 1.5;
      color: #F59E0B;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="title">双 Agent 架构：分工交接</div>

    <div class="card card-init">
      <div class="role role-blue">初始化 Agent = 项目经理</div>
      <div class="desc"><span class="white">只出场一次</span>，制定计划、分配任务</div>
    </div>

    <div class="card card-coding">
      <div class="role role-green">编码 Agent = 程序员</div>
      <div class="desc"><span class="white">每天来上班</span>，按计划推进开发</div>
    </div>

    <div class="bottom-text">
      精髓不是让 AI 更聪明<br>而是给它一套换班交接制度
    </div>
  </div>
</body>
</html>
