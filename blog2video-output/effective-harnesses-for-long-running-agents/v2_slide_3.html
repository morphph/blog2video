<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .title {
      font-size: 44px;
      font-weight: 800;
      margin-bottom: 40px;
      color: #8B5CF6;
    }
    .card {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 24px 28px;
      width: 100%;
      text-align: left;
      margin-bottom: 20px;
    }
    .card-1 { border-left: 4px solid #3B82F6; }
    .card-2 { border-left: 4px solid #F59E0B; }
    .card-3 { border-left: 4px solid #10B981; }
    .card .num {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .num-blue { color: #3B82F6; }
    .num-yellow { color: #F59E0B; }
    .num-green { color: #10B981; }
    .card .card-title {
      font-size: 34px;
      font-weight: 700;
      margin-bottom: 10px;
    }
    .card .desc {
      font-size: 28px;
      color: #B0B0CC;
      line-height: 1.5;
    }
    .code {
      color: #8B5CF6;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="title">三个核心组件</div>

    <div class="card card-1">
      <div class="num num-blue">组件 1</div>
      <div class="card-title">初始化三件套</div>
      <div class="desc"><span class="code">init.sh</span> + <span class="code">claude-progress.txt</span> + 初始 git commit</div>
    </div>

    <div class="card card-2">
      <div class="num num-yellow">组件 2</div>
      <div class="card-title">功能清单</div>
      <div class="desc">200+ JSON 任务项，只能改 <span class="code">passes</span> 字段</div>
    </div>

    <div class="card card-3">
      <div class="num num-green">组件 3</div>
      <div class="card-title">会话启动协议</div>
      <div class="desc">6步流程：确认目录 → 查日志 → 选任务 → 启服务 → 验旧功能 → 开始开发</div>
    </div>
  </div>
</body>
</html>
