<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .summary-card {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-left: 4px solid #8B5CF6;
      border-radius: 12px;
      padding: 48px 40px;
      width: 100%;
    }
    .summary-text {
      font-size: 44px;
      font-weight: 800;
      line-height: 1.5;
    }
    .dim {
      color: #B0B0CC;
    }
    .highlight {
      color: #F59E0B;
    }
    .series-tag {
      margin-top: 48px;
      font-size: 28px;
      color: #8B5CF6;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="summary-card">
      <div class="summary-text">
        <span class="dim">长时间 Agent 的秘诀</span><br>
        <span class="dim">不是让它更聪明</span><br><br>
        而是给它一套<br>
        <span class="highlight">换班交接制度</span>
      </div>
    </div>
    <div class="series-tag">精读AI · 长时Agent方案</div>
  </div>
</body>
</html>
