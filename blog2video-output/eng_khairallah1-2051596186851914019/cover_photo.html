<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .cover {
      width: 100%; height: 100%;
      padding: 140px 72px 400px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
      background:
        radial-gradient(circle at 22% 20%, rgba(239, 68, 68, 0.18), transparent 55%),
        radial-gradient(circle at 80% 78%, rgba(139, 92, 246, 0.18), transparent 55%),
        radial-gradient(circle at 50% 45%, rgba(245, 158, 11, 0.08), transparent 60%),
        #0D0D1A;
    }
    .series-tag {
      font-size: 30px;
      color: #8B5CF6;
      letter-spacing: 4px;
      font-weight: 700;
      margin-bottom: 60px;
    }
    .headline {
      font-size: 104px;
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: -2px;
      margin-bottom: 56px;
      color: #FFFFFF;
    }
    .headline .red { color: #EF4444; }
    .headline .yellow { color: #F59E0B; }
    .sub-hook {
      font-size: 42px;
      font-weight: 800;
      color: #B0B0CC;
      line-height: 1.35;
      margin-bottom: 64px;
      letter-spacing: 1px;
      max-width: 880px;
    }
    .sub-hook .k { color: #F59E0B; }
    .source-tag {
      display: inline-block;
      background: #1A1A30;
      border: 1px solid rgba(139, 92, 246, 0.25);
      border-radius: 999px;
      padding: 14px 32px;
      font-size: 22px;
      color: #6B6B80;
      font-weight: 600;
      letter-spacing: 0.5px;
      max-width: 880px;
      line-height: 1.4;
    }
    .source-tag .author { color: #8B8BA8; font-weight: 700; }
  </style>
</head>
<body>
  <div class="cover">
    <div class="series-tag">精读AI · Agent 架构</div>
    <div class="headline">
      <span class="yellow">$18 万</span>年薪的<br>
      三个员工<br>
      被一份<span class="red">订阅</span>替代了？
    </div>
    <div class="sub-hook">
      没人讲清楚的<br>
      那个<span class="k">最关键的机制</span>
    </div>
    <div class="source-tag">
      <span class="author">Khairallah</span>《How to Build a Team of AI Agents That Replace Your First 3 Hires》
    </div>
  </div>
</body>
</html>
