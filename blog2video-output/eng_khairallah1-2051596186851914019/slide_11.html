<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
      background:
        radial-gradient(circle at 50% 22%, rgba(239, 68, 68, 0.10), transparent 60%),
        #0D0D1A;
    }
    .eyebrow {
      font-size: 26px;
      color: #EF4444;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 28px;
    }
    .title {
      font-size: 56px;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 44px;
      letter-spacing: -1px;
    }
    .title .red { color: #EF4444; }
    .list {
      display: flex;
      flex-direction: column;
      gap: 22px;
      width: 100%;
      max-width: 920px;
    }
    .item {
      background: #1A1A2E;
      border: 1px solid rgba(239, 68, 68, 0.2);
      border-left: 4px solid #EF4444;
      border-radius: 12px;
      padding: 26px 32px;
      text-align: left;
      display: flex;
      gap: 24px;
      align-items: flex-start;
    }
    .item .num {
      font-size: 56px;
      font-weight: 800;
      color: #EF4444;
      line-height: 1;
      min-width: 80px;
    }
    .item .body { flex: 1; }
    .item .head {
      font-size: 30px;
      color: #FFFFFF;
      font-weight: 800;
      margin-bottom: 10px;
      line-height: 1.3;
    }
    .item .head .y { color: #F59E0B; }
    .item .desc {
      font-size: 22px;
      color: #B0B0CC;
      font-weight: 600;
      line-height: 1.45;
    }
    .item .desc .em { color: #F59E0B; font-weight: 700; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="eyebrow">三个代价</div>
    <div class="title">
      边界<span class="red">必须诚实地说</span>
    </div>
    <div class="list">
      <div class="item">
        <div class="num">01</div>
        <div class="body">
          <div class="head">共享 base 是<span class="y">单点故障</span></div>
          <div class="desc">一个 agent 写脏数据 → 三个一起喝毒。每个先单跑 <span class="em">2-3 周</span>校准</div>
        </div>
      </div>
      <div class="item">
        <div class="num">02</div>
        <div class="body">
          <div class="head">"三周搭完"有<span class="y">隐藏前提</span></div>
          <div class="desc">需要 <span class="em">brand voice / ICP / style guide</span> 文档。prompt 救不了想不清楚自己是谁的创始人</div>
        </div>
      </div>
      <div class="item">
        <div class="num">03</div>
        <div class="body">
          <div class="head"><span class="y">12-18 个月</span>之后覆盖率会掉</div>
          <div class="desc">业务复杂度 / 关系深度 / 品牌叙事——到某个点必须<span class="em">招真人</span></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
