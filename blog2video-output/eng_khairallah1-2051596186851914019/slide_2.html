<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
      background:
        radial-gradient(circle at 50% 20%, rgba(139, 92, 246, 0.10), transparent 60%),
        #0D0D1A;
    }
    .eyebrow {
      font-size: 26px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 36px;
    }
    .title {
      font-size: 64px;
      font-weight: 900;
      line-height: 1.2;
      letter-spacing: -1px;
      margin-bottom: 56px;
    }
    .title .yellow { color: #F59E0B; }
    .principle {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.25);
      border-left: 4px solid #8B5CF6;
      border-radius: 12px;
      padding: 36px 32px;
      max-width: 880px;
      width: 100%;
      margin-bottom: 32px;
    }
    .principle .label {
      font-size: 22px;
      color: #8B5CF6;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 16px;
    }
    .principle .text {
      font-size: 38px;
      color: #FFFFFF;
      font-weight: 800;
      line-height: 1.35;
    }
    .principle .text .k { color: #F59E0B; }
    .note {
      font-size: 28px;
      color: #B0B0CC;
      font-weight: 600;
      line-height: 1.5;
      max-width: 860px;
    }
    .note .em { color: #10B981; font-weight: 800; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="eyebrow">2026 年的真正拐点</div>
    <div class="title">
      不是模型变聪明<br>
      是 <span class="yellow">MCP</span> 让 agent<br>
      第一次能<span class="yellow">动手</span>
    </div>
    <div class="principle">
      <div class="label">Model Context Protocol</div>
      <div class="text">
        从会聊天的<span class="k">盒子</span><br>
        变成能动手的<span class="k">同事</span>
      </div>
    </div>
    <div class="note">
      不是 prompt 写得多牛<br>
      是<span class="em">通过 MCP 连了什么</span>
    </div>
  </div>
</body>
</html>
