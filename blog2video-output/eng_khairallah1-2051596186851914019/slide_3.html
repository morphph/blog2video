<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
    }
    .eyebrow {
      font-size: 26px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 32px;
    }
    .title {
      font-size: 56px;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 48px;
      letter-spacing: -1px;
    }
    .title .y { color: #F59E0B; }
    .cards {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
      max-width: 920px;
    }
    .card {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.25);
      border-radius: 12px;
      padding: 28px 32px;
      text-align: left;
      display: flex;
      gap: 24px;
      align-items: center;
    }
    .card.purple { border-left: 4px solid #8B5CF6; }
    .card.blue { border-left: 4px solid #3B82F6; }
    .card.green { border-left: 4px solid #10B981; }
    .card .num {
      font-size: 56px;
      font-weight: 800;
      min-width: 80px;
    }
    .card.purple .num { color: #8B5CF6; }
    .card.blue .num { color: #3B82F6; }
    .card.green .num { color: #10B981; }
    .card .body { flex: 1; }
    .card .role {
      font-size: 32px;
      font-weight: 800;
      color: #FFFFFF;
      margin-bottom: 8px;
    }
    .card .desc {
      font-size: 24px;
      color: #B0B0CC;
      font-weight: 600;
      line-height: 1.4;
    }
    .card .desc .k { color: #F59E0B; font-weight: 700; }
    .footer {
      margin-top: 40px;
      font-size: 28px;
      color: #6B7280;
      font-weight: 600;
      max-width: 880px;
      line-height: 1.5;
    }
    .footer .em { color: #EF4444; font-weight: 800; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="eyebrow">三人小团队</div>
    <div class="title">
      研究员 / 内容 / <span class="y">运营</span>
    </div>
    <div class="cards">
      <div class="card purple">
        <div class="num">01</div>
        <div class="body">
          <div class="role">研究员 agent</div>
          <div class="desc">每周一 brief：竞品 / 趋势 / 机会</div>
        </div>
      </div>
      <div class="card blue">
        <div class="num">02</div>
        <div class="body">
          <div class="role">内容 agent</div>
          <div class="desc">月产 30 选题 + 30 篇初稿，全平台分发</div>
        </div>
      </div>
      <div class="card green">
        <div class="num">03</div>
        <div class="body">
          <div class="role">运营 agent / chief of staff</div>
          <div class="desc">邮件 / 会议 / 周报，每天压到 15 分钟</div>
        </div>
      </div>
    </div>
    <div class="footer">
      但分工人人会讲——<br>
      凭什么它们就是<span class="em">一个团队</span>？
    </div>
  </div>
</body>
</html>
