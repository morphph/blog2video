<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
      background:
        radial-gradient(circle at 50% 28%, rgba(245, 158, 11, 0.10), transparent 60%),
        #0D0D1A;
    }
    .eyebrow {
      font-size: 26px;
      color: #F59E0B;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 36px;
    }
    .quote-mark {
      font-size: 120px;
      color: #F59E0B;
      font-weight: 900;
      line-height: 0.5;
      margin-bottom: 24px;
      opacity: 0.7;
    }
    .quote {
      font-size: 80px;
      font-weight: 900;
      line-height: 1.2;
      letter-spacing: -1px;
      margin-bottom: 28px;
    }
    .quote .y { color: #F59E0B; }
    .quote .g { color: #10B981; }
    .quote .lab {
      font-size: 36px;
      color: #B0B0CC;
      font-weight: 700;
      letter-spacing: 2px;
    }
    .divider {
      width: 80px; height: 4px;
      background: #F59E0B;
      margin: 28px 0 36px;
      border-radius: 2px;
    }
    .body {
      display: flex;
      gap: 24px;
      width: 100%;
      max-width: 920px;
      margin-bottom: 28px;
    }
    .col {
      flex: 1;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 24px 22px;
      text-align: left;
    }
    .col.production { border-left: 4px solid #F59E0B; }
    .col.soul { border-left: 4px solid #10B981; }
    .col .label {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }
    .col.production .label { color: #F59E0B; }
    .col.soul .label { color: #10B981; }
    .col .head {
      font-size: 28px;
      color: #FFFFFF;
      font-weight: 800;
      margin-bottom: 10px;
    }
    .col .desc {
      font-size: 22px;
      color: #B0B0CC;
      font-weight: 600;
      line-height: 1.4;
    }
    .footer {
      font-size: 26px;
      color: #B0B0CC;
      font-weight: 700;
      line-height: 1.45;
      max-width: 880px;
    }
    .footer .em { color: #EF4444; font-weight: 800; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="eyebrow">最后一道人工 PASS</div>
    <div class="quote">
      <span class="y">80%</span> production<br>
      <span class="g">20%</span> soul
    </div>
    <div class="divider"></div>
    <div class="body">
      <div class="col production">
        <div class="label">PRODUCTION</div>
        <div class="head">可以交出去</div>
        <div class="desc">格式 / 变体 / 调度 / 跑量</div>
      </div>
      <div class="col soul">
        <div class="label">SOUL</div>
        <div class="head">不能交</div>
        <div class="desc">立场 / 视角 / 行业内幕</div>
      </div>
    </div>
    <div class="footer">
      不是产能比例，是<span class="em">分工边界</span><br>
      看 agent 能不能识别"哪一步必须停下来等人"
    </div>
  </div>
</body>
</html>
