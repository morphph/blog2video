<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
      background:
        radial-gradient(circle at 50% 28%, rgba(239, 68, 68, 0.10), transparent 60%),
        #0D0D1A;
    }
    .eyebrow {
      font-size: 26px;
      color: #EF4444;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 36px;
    }
    .stats {
      display: flex;
      gap: 28px;
      margin-bottom: 44px;
    }
    .stat {
      flex: 1;
      background: #1A1A2E;
      border: 1px solid rgba(239, 68, 68, 0.25);
      border-left: 4px solid #EF4444;
      border-radius: 12px;
      padding: 28px 20px;
      min-width: 240px;
    }
    .stat .num {
      font-size: 80px;
      font-weight: 800;
      color: #EF4444;
      line-height: 1;
      margin-bottom: 12px;
    }
    .stat .label {
      font-size: 22px;
      color: #B0B0CC;
      font-weight: 700;
      line-height: 1.3;
    }
    .title {
      font-size: 44px;
      font-weight: 900;
      line-height: 1.3;
      margin-bottom: 36px;
      max-width: 880px;
    }
    .title .red { color: #EF4444; }
    .title .y { color: #F59E0B; }
    .limits {
      background: #1A1A2E;
      border: 1px solid rgba(239, 68, 68, 0.25);
      border-radius: 12px;
      padding: 24px 28px;
      max-width: 880px;
      width: 100%;
      text-align: left;
    }
    .limits .label {
      font-size: 22px;
      color: #EF4444;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 14px;
    }
    .limits .item {
      font-size: 24px;
      color: #FFFFFF;
      font-weight: 700;
      line-height: 1.5;
      padding-left: 22px;
      position: relative;
      margin-bottom: 6px;
    }
    .limits .item::before {
      content: "×";
      color: #EF4444;
      font-weight: 900;
      position: absolute;
      left: 0;
      font-size: 28px;
    }
    .limits .item .em { color: #B0B0CC; font-weight: 600; font-size: 20px; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="eyebrow">诚实的边界</div>
    <div class="stats">
      <div class="stat">
        <div class="num">70-80%</div>
        <div class="label">三个全职<br>工作量覆盖</div>
      </div>
      <div class="stat">
        <div class="num">12-18</div>
        <div class="label">个月<br>适用窗口</div>
      </div>
    </div>
    <div class="title">
      超过这个窗口<br>
      你需要的不是 agent 干更多<br>
      是<span class="y">真人</span>
    </div>
    <div class="limits">
      <div class="label">AGENT 的硬边界</div>
      <div class="item">定价时的市场感觉 <span class="em">— 判断</span></div>
      <div class="item">和受伤客户的情绪沟通 <span class="em">— 共情</span></div>
      <div class="item">产品方向上的反直觉转向 <span class="em">— 创造</span></div>
    </div>
  </div>
</body>
</html>
