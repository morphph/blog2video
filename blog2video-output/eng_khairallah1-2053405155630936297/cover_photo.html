<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 100px 72px 400px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .glow {
      position: absolute;
      top: 360px;
      left: 50%;
      transform: translateX(-50%);
      width: 1000px;
      height: 700px;
      background: radial-gradient(ellipse at center, rgba(139, 92, 246, 0.22) 0%, rgba(139, 92, 246, 0) 70%);
      pointer-events: none;
    }
    .series-tag {
      font-size: 30px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 70px;
      position: relative;
      z-index: 2;
    }
    .title {
      font-size: 92px;
      font-weight: 900;
      line-height: 1.25;
      letter-spacing: -2px;
      margin-bottom: 80px;
      position: relative;
      z-index: 2;
    }
    .title .red { color: #EF4444; }
    .source-pill {
      display: inline-block;
      padding: 14px 28px;
      border-radius: 999px;
      background: #1A1A30;
      color: #6B6B80;
      font-size: 22px;
      letter-spacing: 1px;
      position: relative;
      z-index: 2;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="glow"></div>
    <div class="series-tag">精读AI · Context Engineering</div>
    <div class="title">
      AI 输出像<span class="red">AI 写的</span>？<br/>
      你的 context <span class="red">是空的</span>
    </div>
    <div class="source-pill">Khairallah AL-Awady · X · 74 万阅读</div>
  </div>
</body>
</html>
