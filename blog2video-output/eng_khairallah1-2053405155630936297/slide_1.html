<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .glow {
      position: absolute;
      top: 280px;
      left: 50%;
      transform: translateX(-50%);
      width: 900px;
      height: 600px;
      background: radial-gradient(ellipse at center, rgba(139, 92, 246, 0.18) 0%, rgba(139, 92, 246, 0) 70%);
      pointer-events: none;
    }
    .title {
      font-size: 88px;
      font-weight: 900;
      line-height: 1.22;
      letter-spacing: -1px;
      margin-bottom: 56px;
      position: relative;
      z-index: 2;
    }
    .title .red { color: #EF4444; }
    .source-pill {
      display: inline-block;
      padding: 14px 28px;
      border-radius: 999px;
      background: #1A1A30;
      color: #6B6B80;
      font-size: 22px;
      letter-spacing: 1px;
      margin-bottom: 80px;
      position: relative;
      z-index: 2;
    }
    .cards {
      display: flex;
      gap: 28px;
      width: 100%;
      justify-content: center;
      position: relative;
      z-index: 2;
    }
    .card {
      flex: 1;
      max-width: 420px;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.35);
      border-left: 4px solid #8B5CF6;
      border-radius: 12px;
      padding: 36px 24px;
    }
    .card-label {
      font-size: 22px;
      color: #B0B0CC;
      letter-spacing: 2px;
      margin-bottom: 18px;
    }
    .card-text {
      font-size: 38px;
      font-weight: 800;
      color: #FFFFFF;
      line-height: 1.3;
    }
    .card-text .accent { color: #8B5CF6; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="glow"></div>
    <div class="title">
      AI 输出像<span class="red">AI 写的</span>？<br/>
      你的 context <span class="red">是空的</span>
    </div>
    <div class="source-pill">Khairallah AL-Awady · X · 74 万阅读</div>
    <div class="cards">
      <div class="card">
        <div class="card-label">PROMPT</div>
        <div class="card-text">= <span class="accent">配料</span></div>
      </div>
      <div class="card">
        <div class="card-label">CONTEXT</div>
        <div class="card-text">= 整个<span class="accent">厨房</span></div>
      </div>
    </div>
  </div>
</body>
</html>
