<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .title {
      font-size: 62px;
      font-weight: 900;
      line-height: 1.22;
      margin-bottom: 64px;
    }
    .title .red { color: #EF4444; }
    .warn-card {
      width: 100%;
      background: linear-gradient(180deg, rgba(239, 68, 68, 0.10) 0%, rgba(239, 68, 68, 0.04) 100%);
      border: 2px solid rgba(239, 68, 68, 0.55);
      border-left: 6px solid #EF4444;
      border-radius: 14px;
      padding: 56px 36px;
      margin-bottom: 48px;
    }
    .warn-label {
      font-size: 24px;
      letter-spacing: 3px;
      color: #EF4444;
      font-weight: 800;
      margin-bottom: 28px;
    }
    .chain {
      font-size: 36px;
      font-weight: 800;
      line-height: 1.5;
      color: #FFFFFF;
    }
    .chain .red { color: #EF4444; }
    .chain .arrow { color: #6B7280; padding: 0 6px; }
    .subtitle {
      font-size: 28px;
      color: #B0B0CC;
      font-weight: 600;
      line-height: 1.5;
    }
    .subtitle .accent { color: #8B5CF6; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="title">装得越多<br/><span class="red">反而越笨</span></div>
    <div class="warn-card">
      <div class="warn-label">FLOODED CONTEXT</div>
      <div class="chain">
        Context 太满<br/>
        <span class="arrow">↓</span><br/>
        <span class="red">attention 被稀释</span><br/>
        <span class="arrow">↓</span><br/>
        什么都想用<br/>
        <span class="arrow">↓</span><br/>
        <span class="red">什么都没用好</span>
      </div>
    </div>
    <div class="subtitle">不是 token 越多越好<br/>是<span class="accent">"该不该塞"</span>的工程</div>
  </div>
</body>
</html>
