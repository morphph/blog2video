<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .title {
      font-size: 52px;
      font-weight: 900;
      line-height: 1.22;
      margin-bottom: 12px;
    }
    .subtitle {
      font-size: 26px;
      color: #B0B0CC;
      font-weight: 600;
      margin-bottom: 40px;
    }
    .subtitle .accent { color: #8B5CF6; }
    .flow {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 40px;
    }
    .box {
      background: #1A1A2E;
      border-radius: 12px;
      padding: 24px 24px;
      text-align: left;
    }
    .b1 {
      border: 1px solid rgba(139, 92, 246, 0.4);
      border-left: 4px solid #8B5CF6;
    }
    .b2 {
      border: 1px solid rgba(59, 130, 246, 0.4);
      border-left: 4px solid #3B82F6;
    }
    .b3 {
      border: 1px solid rgba(16, 185, 129, 0.4);
      border-left: 4px solid #10B981;
    }
    .b-head {
      display: flex;
      align-items: baseline;
      gap: 14px;
      margin-bottom: 8px;
    }
    .b-num {
      font-size: 28px;
      font-weight: 900;
    }
    .b1 .b-num { color: #8B5CF6; }
    .b2 .b-num { color: #3B82F6; }
    .b3 .b-num { color: #10B981; }
    .b-name {
      font-size: 28px;
      font-weight: 800;
      color: #FFFFFF;
    }
    .b-detail {
      font-size: 20px;
      color: #B0B0CC;
      margin-bottom: 8px;
      line-height: 1.4;
    }
    .b-role {
      font-size: 18px;
      color: #6B7280;
      font-style: italic;
    }
    .b1 .b-role { color: #8B5CF6; }
    .b2 .b-role { color: #3B82F6; }
    .b3 .b-role { color: #10B981; }
    .arrow {
      text-align: center;
      color: #6B7280;
      font-size: 24px;
      font-weight: 700;
      margin: -6px 0;
    }
    .bottom-tag {
      width: 100%;
      background: rgba(239, 68, 68, 0.10);
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-radius: 12px;
      padding: 20px 22px;
      font-size: 26px;
      font-weight: 800;
      color: #FFFFFF;
    }
    .bottom-tag .red { color: #EF4444; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="title">组合顺序</div>
    <div class="subtitle">先 <span class="accent">context</span> · 再 tools · 再 task</div>
    <div class="flow">
      <div class="box b1">
        <div class="b-head">
          <div class="b-num">①</div>
          <div class="b-name">System Prompt</div>
        </div>
        <div class="b-detail">你是谁 · 知道什么 · 遵循什么标准</div>
        <div class="b-role">Context — why &amp; what</div>
      </div>
      <div class="arrow">↓</div>
      <div class="box b2">
        <div class="b-head">
          <div class="b-num">②</div>
          <div class="b-name">MCP Servers</div>
        </div>
        <div class="b-detail">搜索 · 文件 · 数据库 · 邮件 · 日历</div>
        <div class="b-role">Tools — how</div>
      </div>
      <div class="arrow">↓</div>
      <div class="box b3">
        <div class="b-head">
          <div class="b-num">③</div>
          <div class="b-name">Task Prompt</div>
        </div>
        <div class="b-detail">把两者粘起来</div>
        <div class="b-role">Task — when &amp; where</div>
      </div>
    </div>
    <div class="bottom-tag">Context → Tools → Task<br/><span class="red">顺序错了就崩</span></div>
  </div>
</body>
</html>
