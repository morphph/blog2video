<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .glow {
      position: absolute;
      top: 240px;
      left: 50%;
      transform: translateX(-50%);
      width: 900px;
      height: 600px;
      background: radial-gradient(ellipse at center, rgba(245, 158, 11, 0.15) 0%, rgba(13, 13, 26, 0) 70%);
      pointer-events: none;
    }
    .title {
      font-size: 96px;
      font-weight: 900;
      line-height: 1.2;
      letter-spacing: -1px;
      position: relative;
      z-index: 1;
      margin-bottom: 70px;
    }
    .title .amber { color: #F59E0B; }
    .title .red { color: #EF4444; }
    .cards {
      display: flex;
      gap: 24px;
      width: 100%;
      justify-content: center;
      margin-bottom: 56px;
    }
    .card {
      flex: 1;
      max-width: 420px;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.25);
      border-radius: 12px;
      padding: 36px 24px;
      font-size: 38px;
      font-weight: 700;
      line-height: 1.35;
      color: #FFFFFF;
    }
    .card .hint {
      display: block;
      font-size: 22px;
      font-weight: 500;
      color: #B0B0CC;
      margin-top: 14px;
      letter-spacing: 1px;
    }
    .source {
      margin-top: 8px;
      padding: 14px 28px;
      background: #1A1A30;
      border-radius: 999px;
      font-size: 22px;
      color: #6B6B80;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="glow"></div>
    <h1 class="title"><span class="amber">8 万个</span> Skill 没人装<br><span class="red">问题在哪？</span></h1>
    <div class="cards">
      <div class="card">Skill 不是 prompt<span class="hint">不是收藏夹</span></div>
      <div class="card">你的员工还没招<span class="hint">仓库门开着</span></div>
    </div>
    <div class="source">Khairallah AL-Awady · X · 1.3M views</div>
  </div>
</body>
</html>
