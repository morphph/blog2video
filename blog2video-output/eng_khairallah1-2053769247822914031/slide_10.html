<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .title {
      font-size: 56px;
      font-weight: 900;
      line-height: 1.25;
      margin-bottom: 50px;
    }
    .title .amber { color: #F59E0B; }
    .title .purple { color: #8B5CF6; }
    .math {
      display: flex;
      flex-direction: column;
      gap: 18px;
      width: 100%;
      margin-bottom: 36px;
    }
    .row {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-radius: 12px;
      padding: 22px 26px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }
    .row.big-row { border-left: 4px solid #F59E0B; }
    .row.small-row { border-left: 4px solid #B0B0CC; }
    .row .formula {
      font-size: 28px;
      font-weight: 700;
      color: #B0B0CC;
      text-align: left;
      flex: 1;
    }
    .row .formula .accent { color: #F59E0B; font-weight: 900; }
    .row .formula .blue { color: #3B82F6; font-weight: 800; }
    .row .equals {
      font-size: 28px;
      color: #6B7280;
    }
    .row .result {
      font-size: 38px;
      font-weight: 900;
      color: #F59E0B;
      text-align: right;
      min-width: 240px;
    }
    .row.small-row .result { color: #B0B0CC; font-size: 32px; }
    .row .result .sub {
      display: block;
      font-size: 22px;
      color: #B0B0CC;
      font-weight: 500;
      margin-top: 4px;
    }
    .leap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 22px;
      padding: 22px 28px;
      background: #1A1A30;
      border: 1px solid rgba(139, 92, 246, 0.4);
      border-radius: 12px;
      font-size: 32px;
      font-weight: 900;
      width: 100%;
    }
    .leap .from { color: #B0B0CC; }
    .leap .arrow { color: #8B5CF6; font-size: 36px; }
    .leap .to { color: #8B5CF6; }
    .leap .note {
      display: block;
      font-size: 22px;
      color: #B0B0CC;
      font-weight: 500;
      margin-top: 6px;
      letter-spacing: 0;
    }
  </style>
</head>
<body>
  <div class="slide">
    <h1 class="title">ROI ≠ <span class="amber">效率提升</span><br>而是<span class="purple">层级跃迁</span></h1>
    <div class="math">
      <div class="row small-row">
        <div class="formula"><span class="accent">1 Skill</span> × 30 min × 52 周</div>
        <div class="equals">=</div>
        <div class="result">26 小时/年</div>
      </div>
      <div class="row big-row">
        <div class="formula"><span class="accent">10 Skills</span> × 30 min × 52 周</div>
        <div class="equals">=</div>
        <div class="result">260 小时<span class="sub">≈ 6.5 工作周</span></div>
      </div>
    </div>
    <div class="leap">
      <div>
        <span class="from">执行</span>
        <span class="arrow">→</span>
        <span class="to">策略</span>
        <span class="note">工作层级跃迁 · 不是 productivity hack</span>
      </div>
    </div>
  </div>
</body>
</html>
