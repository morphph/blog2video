<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .title {
      font-size: 60px;
      font-weight: 900;
      line-height: 1.25;
      margin-bottom: 40px;
    }
    .title .amber { color: #F59E0B; }
    .checklist {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      margin-bottom: 36px;
    }
    .item {
      display: flex;
      align-items: center;
      gap: 18px;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.25);
      border-left: 4px solid #8B5CF6;
      border-radius: 12px;
      padding: 18px 24px;
      text-align: left;
    }
    .item .num {
      font-size: 36px;
      font-weight: 900;
      color: #8B5CF6;
      min-width: 56px;
    }
    .item .text {
      font-size: 26px;
      font-weight: 700;
      color: #FFFFFF;
      line-height: 1.4;
    }
    .item .text .accent { color: #F59E0B; }
    .signature {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.5);
      border-left: 4px solid #8B5CF6;
      border-radius: 12px;
      padding: 26px 28px;
      width: 100%;
      margin-bottom: 22px;
    }
    .signature .text {
      font-size: 26px;
      font-weight: 700;
      line-height: 1.5;
      color: #FFFFFF;
    }
    .signature .text .purple { color: #8B5CF6; }
    .brand {
      font-size: 22px;
      font-weight: 600;
      color: #B0B0CC;
      letter-spacing: 2px;
    }
    .brand .accent { color: #8B5CF6; }
  </style>
</head>
<body>
  <div class="slide">
    <h1 class="title">今天就做<span class="amber">一件事</span></h1>
    <div class="checklist">
      <div class="item"><span class="num">①</span><span class="text">挑你<span class="accent">重复最多</span>的那件事，写一个 SKILL.md</span></div>
      <div class="item"><span class="num">②</span><span class="text"><span class="accent">500 行</span>以内 · 禁止任何模糊措辞</span></div>
      <div class="item"><span class="num">③</span><span class="text">跑<span class="accent">三场景</span>测试</span></div>
      <div class="item"><span class="num">④</span><span class="text">每周五<span class="accent">迭代一次</span></span></div>
      <div class="item"><span class="num">⑤</span><span class="text">一个月后<span class="accent">再回来看输出</span></span></div>
    </div>
    <div class="signature">
      <div class="text">你以为 Skill 是 prompt 的升级版<br>其实它是你<span class="purple">雇的第一个数字员工</span></div>
    </div>
    <div class="brand">AI 世界很吵 · <span class="accent">精读一篇，胜过刷一百条</span></div>
  </div>
</body>
</html>
