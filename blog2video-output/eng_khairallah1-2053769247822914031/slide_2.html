<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .title {
      font-size: 64px;
      font-weight: 900;
      line-height: 1.25;
      margin-bottom: 60px;
    }
    .title .purple { color: #8B5CF6; }
    .cards {
      display: flex;
      gap: 24px;
      width: 100%;
      margin-bottom: 50px;
    }
    .card {
      flex: 1;
      background: #1A1A2E;
      border-radius: 12px;
      padding: 32px 26px;
      text-align: left;
    }
    .card.left {
      border: 1px solid rgba(107, 114, 128, 0.4);
      border-left: 4px solid #6B7280;
    }
    .card.right {
      border: 1px solid rgba(139, 92, 246, 0.4);
      border-left: 4px solid #8B5CF6;
    }
    .card .label {
      font-size: 22px;
      color: #B0B0CC;
      letter-spacing: 1px;
      margin-bottom: 14px;
      font-weight: 600;
    }
    .card .head {
      font-size: 36px;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 22px;
    }
    .card.right .head { color: #8B5CF6; }
    .card .items {
      list-style: none;
      padding: 0;
    }
    .card .items li {
      font-size: 26px;
      color: #FFFFFF;
      line-height: 1.5;
      margin-bottom: 10px;
      padding-left: 18px;
      position: relative;
    }
    .card .items li::before {
      content: "·";
      position: absolute;
      left: 0;
      color: #6B7280;
      font-weight: 900;
    }
    .card.right .items li::before { color: #8B5CF6; }
    .card .quality {
      margin-top: 16px;
      font-size: 22px;
      font-style: italic;
      color: #6B7280;
      padding-top: 14px;
      border-top: 1px solid rgba(139, 92, 246, 0.15);
    }
    .card.right .quality { color: #8B5CF6; }
    .tag {
      padding: 16px 36px;
      background: #1A1A30;
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-radius: 999px;
      font-size: 28px;
      font-weight: 700;
      color: #FFFFFF;
    }
    .tag .accent { color: #8B5CF6; }
  </style>
</head>
<body>
  <div class="slide">
    <h1 class="title">Skill 不是 saved prompt<br>是 <span class="purple">数字员工</span></h1>
    <div class="cards">
      <div class="card left">
        <div class="label">SAVED PROMPT</div>
        <div class="head">对话开场白</div>
        <ul class="items">
          <li>一次性</li>
          <li>对话的起点</li>
          <li>"你可以从这里开始聊"</li>
        </ul>
        <div class="quality">one-off quality</div>
      </div>
      <div class="card right">
        <div class="label">SKILL</div>
        <div class="head">完整作业 SOP</div>
        <ul class="items">
          <li>从头到尾怎么做</li>
          <li>好坏标准</li>
          <li>异常处理 · 工具 · 输出</li>
        </ul>
        <div class="quality">standardized quality</div>
      </div>
    </div>
    <div class="tag">员工 <span class="accent">≠</span> 修辞，是工作方法</div>
  </div>
</body>
</html>
