<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .title {
      font-size: 60px;
      font-weight: 900;
      line-height: 1.25;
      margin-bottom: 70px;
    }
    .title .purple { color: #8B5CF6; }
    .steps {
      display: flex;
      flex-direction: column;
      gap: 18px;
      width: 100%;
      margin-bottom: 56px;
    }
    .step {
      display: flex;
      align-items: center;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.25);
      border-left: 4px solid #8B5CF6;
      border-radius: 12px;
      padding: 22px 28px;
      text-align: left;
    }
    .step .num {
      font-size: 44px;
      font-weight: 900;
      color: #8B5CF6;
      margin-right: 26px;
      min-width: 64px;
    }
    .step .work {
      font-size: 32px;
      font-weight: 700;
      color: #B0B0CC;
      min-width: 140px;
    }
    .step .arrow {
      color: #6B7280;
      font-size: 28px;
      margin: 0 18px;
    }
    .step .action {
      font-size: 32px;
      font-weight: 700;
      color: #FFFFFF;
    }
    .tag {
      padding: 18px 32px;
      background: #1A1A30;
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 12px;
      font-size: 26px;
      font-weight: 600;
      color: #FFFFFF;
      line-height: 1.5;
      max-width: 880px;
    }
    .tag .amber { color: #F59E0B; font-weight: 800; }
  </style>
</head>
<body>
  <div class="slide">
    <h1 class="title">员工类比 = <span class="purple">工作方法变了</span></h1>
    <div class="steps">
      <div class="step">
        <span class="num">①</span>
        <span class="work">招人</span>
        <span class="arrow">→</span>
        <span class="action">找别人写好的 Skill</span>
      </div>
      <div class="step">
        <span class="num">②</span>
        <span class="work">培训</span>
        <span class="arrow">→</span>
        <span class="action">写 SKILL.md</span>
      </div>
      <div class="step">
        <span class="num">③</span>
        <span class="work">考核</span>
        <span class="arrow">→</span>
        <span class="action">跑测试</span>
      </div>
      <div class="step">
        <span class="num">④</span>
        <span class="work">管理</span>
        <span class="arrow">→</span>
        <span class="action">每周迭代</span>
      </div>
    </div>
    <div class="tag">把"<span class="amber">每来一个任务重新组织 prompt</span>"<br>换成"<span class="amber">调度已经训练好的员工</span>"</div>
  </div>
</body>
</html>
