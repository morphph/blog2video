<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .title {
      font-size: 58px;
      font-weight: 900;
      line-height: 1.25;
      margin-bottom: 70px;
    }
    .title .amber { color: #F59E0B; }
    .title .red { color: #EF4444; }
    .splash {
      display: flex;
      flex-direction: column;
      gap: 28px;
      width: 100%;
      margin-bottom: 50px;
    }
    .block {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.25);
      border-radius: 12px;
      padding: 36px 32px;
      text-align: left;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .block.amber-block { border-left: 4px solid #F59E0B; }
    .block.red-block { border-left: 4px solid #EF4444; }
    .block .num {
      font-size: 140px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -3px;
    }
    .block.amber-block .num { color: #F59E0B; }
    .block.red-block .num { color: #EF4444; }
    .block .desc {
      font-size: 28px;
      font-weight: 600;
      line-height: 1.45;
      color: #FFFFFF;
      text-align: right;
      max-width: 380px;
    }
    .block .desc .sub {
      display: block;
      font-size: 22px;
      color: #B0B0CC;
      font-weight: 500;
      margin-top: 8px;
    }
    .tag {
      padding: 18px 32px;
      background: #1A1A30;
      border-radius: 12px;
      font-size: 28px;
      font-weight: 700;
      color: #FFFFFF;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }
    .tag .amber { color: #F59E0B; }
  </style>
</head>
<body>
  <div class="slide">
    <h1 class="title"><span class="amber">8 万个</span> Skill<br><span class="red">99%</span> 用户一个都没装</h1>
    <div class="splash">
      <div class="block amber-block">
        <div class="num">80,000+</div>
        <div class="desc">社区 Skill 数量<span class="sub">每周以"thousands"增长</span></div>
      </div>
      <div class="block red-block">
        <div class="num">99%</div>
        <div class="desc">用户一个都没装<span class="sub">仓库门开着，没人进</span></div>
      </div>
    </div>
    <div class="tag">能力不需要被发明 · <span class="amber">已经堆在仓库门口</span></div>
  </div>
</body>
</html>
