<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
      background:
        radial-gradient(circle at 20% 15%, rgba(16, 185, 129, 0.08), transparent 55%),
        radial-gradient(circle at 85% 80%, rgba(139, 92, 246, 0.12), transparent 55%),
        #0D0D1A;
    }
    .eyebrow {
      font-size: 26px;
      color: #10B981;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 24px;
    }
    .thesis {
      font-size: 46px;
      font-weight: 900;
      line-height: 1.3;
      margin-bottom: 36px;
    }
    .thesis .k { color: #F59E0B; }
    .thesis .g { color: #10B981; }
    .action {
      background: #1A1A2E;
      border-radius: 10px;
      padding: 16px 22px;
      width: 100%;
      margin-bottom: 14px;
      border: 1px solid rgba(139, 92, 246, 0.25);
      text-align: left;
      display: flex;
      align-items: center;
      gap: 18px;
    }
    .action.a1 { border-left: 4px solid #8B5CF6; }
    .action.a2 { border-left: 4px solid #3B82F6; }
    .action.a3 { border-left: 4px solid #10B981; }
    .a-num {
      font-size: 36px;
      font-weight: 800;
      line-height: 1;
      min-width: 52px;
    }
    .a1 .a-num { color: #8B5CF6; }
    .a2 .a-num { color: #3B82F6; }
    .a3 .a-num { color: #10B981; }
    .a-text {
      font-size: 24px;
      color: #FFFFFF;
      font-weight: 700;
      line-height: 1.35;
    }
    .a-text .muted { color: #B0B0CC; font-weight: 500; }
    .a-text .k { color: #F59E0B; }
    .punch {
      margin-top: 24px;
      font-size: 32px;
      color: #EF4444;
      font-weight: 800;
      line-height: 1.4;
    }
    .punch .em { color: #FFFFFF; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="eyebrow">今天就能动手做的</div>
    <div class="thesis">
      Agent 缺的不是更大的大脑<br>
      是一张<span class="k">组织架构图</span>
    </div>
    <div class="action a1">
      <div class="a-num">01</div>
      <div class="a-text">
        数一下系统提示词行数<br>
        <span class="muted">&gt;1000 行，一半可以抽成</span> <span class="k">路由表</span>
      </div>
    </div>
    <div class="action a2">
      <div class="a-num">02</div>
      <div class="a-text">
        审每个工具的<span class="k">默认行为</span><br>
        <span class="muted">抽到共享规则文档里</span>
      </div>
    </div>
    <div class="action a3">
      <div class="a-num">03</div>
      <div class="a-text">
        写 10 条 <span class="k">trigger eval</span><br>
        <span class="muted">不过的地方，就是在漂的地方</span>
      </div>
    </div>
    <div class="punch">
      系统不会崩<br>
      <span class="em">它只会慢慢失联</span>
    </div>
  </div>
</body>
</html>
