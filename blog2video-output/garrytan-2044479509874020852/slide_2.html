<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
    }
    .eyebrow {
      font-size: 26px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 28px;
    }
    .title {
      font-size: 58px;
      font-weight: 900;
      line-height: 1.25;
      margin-bottom: 52px;
    }
    .title .k { color: #F59E0B; }
    .big {
      background: #1A1A2E;
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-left: 4px solid #EF4444;
      border-radius: 12px;
      padding: 32px 28px;
      width: 100%;
      margin-bottom: 32px;
    }
    .big-label {
      font-size: 22px;
      color: #EF4444;
      letter-spacing: 2px;
      font-weight: 700;
      margin-bottom: 14px;
    }
    .big-num {
      font-size: 128px;
      font-weight: 800;
      color: #EF4444;
      line-height: 1;
      margin-bottom: 10px;
    }
    .big-num .unit {
      font-size: 40px;
      color: #B0B0CC;
      font-weight: 600;
      margin-left: 10px;
    }
    .big-sub {
      font-size: 28px;
      color: #FFFFFF;
      font-weight: 600;
    }
    .quote {
      font-size: 32px;
      color: #B0B0CC;
      line-height: 1.5;
      font-weight: 600;
      max-width: 820px;
    }
    .quote .em { color: #F59E0B; font-weight: 800; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="eyebrow">YC 总裁 Garry Tan 的 CLAUDE.md</div>
    <div class="title">
      什么都往<span class="k">系统提示词</span>里塞<br>
      结果塞到了……
    </div>
    <div class="big">
      <div class="big-label">CLAUDE.md 行数</div>
      <div class="big-num">20,000<span class="unit">行</span></div>
      <div class="big-sub">模型变慢 · 回答开始飘</div>
    </div>
    <div class="quote">
      "我以为我在让模型变聪明<br>
      其实我在<span class="em">把它淹死</span>"
    </div>
  </div>
</body>
</html>
