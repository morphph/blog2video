<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
      background:
        radial-gradient(circle at 50% 30%, rgba(239, 68, 68, 0.08), transparent 60%),
        #0D0D1A;
    }
    .eyebrow {
      font-size: 26px;
      color: #EF4444;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 40px;
    }
    .quote {
      font-size: 62px;
      font-weight: 900;
      line-height: 1.3;
      color: #FFFFFF;
      letter-spacing: -1px;
      margin-bottom: 48px;
    }
    .quote .red { color: #EF4444; }
    .quote .yellow { color: #F59E0B; }
    .divider {
      width: 80px;
      height: 4px;
      background: #EF4444;
      margin-bottom: 40px;
      border-radius: 2px;
    }
    .desc {
      font-size: 32px;
      color: #B0B0CC;
      line-height: 1.5;
      font-weight: 600;
      max-width: 820px;
    }
    .desc .em { color: #F59E0B; font-weight: 800; }
    .desc .big {
      color: #EF4444;
      font-size: 48px;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="eyebrow">Agent 独有的失败模式</div>
    <div class="quote">
      不是幻觉<br>
      是一种<span class="red">缓慢的</span><br>
      <span class="yellow">安静的漂移</span>
    </div>
    <div class="divider"></div>
    <div class="desc">
      结构化的知识库<br>
      慢慢变成一个装着<br>
      <span class="big">14,700</span> 个文件的<span class="em">杂物抽屉</span>
    </div>
  </div>
</body>
</html>
