<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
    }
    .eyebrow {
      font-size: 26px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 28px;
    }
    .title {
      font-size: 54px;
      font-weight: 900;
      line-height: 1.25;
      margin-bottom: 40px;
    }
    .title .k { color: #F59E0B; }
    .title .red { color: #EF4444; }
    .compare {
      display: flex;
      gap: 20px;
      width: 100%;
      margin-bottom: 28px;
    }
    .card {
      flex: 1;
      background: #1A1A2E;
      border-radius: 12px;
      padding: 24px 18px;
      border: 1px solid rgba(139, 92, 246, 0.25);
      text-align: left;
    }
    .card.honest { border-left: 4px solid #10B981; }
    .card.lie { border-left: 4px solid #EF4444; }
    .card-label { font-size: 20px; letter-spacing: 2px; font-weight: 700; margin-bottom: 10px; }
    .card.honest .card-label { color: #10B981; }
    .card.lie .card-label { color: #EF4444; }
    .card-head { font-size: 26px; color: #FFFFFF; font-weight: 800; margin-bottom: 10px; line-height: 1.3; }
    .card-text { font-size: 22px; color: #B0B0CC; font-weight: 500; line-height: 1.45; }
    .metaphor {
      background: #1A1A2E;
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-left: 4px solid #F59E0B;
      border-radius: 12px;
      padding: 22px 24px;
      width: 100%;
      text-align: left;
    }
    .meta-label { font-size: 20px; color: #F59E0B; letter-spacing: 2px; font-weight: 700; margin-bottom: 10px; }
    .meta-text { font-size: 26px; color: #FFFFFF; font-weight: 600; line-height: 1.4; }
    .meta-text .k { color: #F59E0B; font-weight: 700; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="eyebrow">更让人警觉的失败</div>
    <div class="title">
      能力存在<br>
      但系统<span class="red">够不到</span>
    </div>
    <div class="compare">
      <div class="card honest">
        <div class="card-label">诚实的 · 没有</div>
        <div class="card-head">我做不到</div>
        <div class="card-text">你知道要去建它</div>
      </div>
      <div class="card lie">
        <div class="card-label">撒谎的 · 不可达</div>
        <div class="card-head">以为在处理</div>
        <div class="card-text">合同过期才发现</div>
      </div>
    </div>
    <div class="metaphor">
      <div class="meta-label">他的比喻</div>
      <div class="meta-text">
        医院里有<span class="k">外科医生</span><br>
        但不在科室名录里
      </div>
    </div>
  </div>
</body>
</html>
