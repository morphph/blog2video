<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
    }
    .eyebrow {
      font-size: 26px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 28px;
    }
    .title {
      font-size: 54px;
      font-weight: 900;
      line-height: 1.25;
      margin-bottom: 36px;
    }
    .title .k { color: #F59E0B; }
    .checkrunner {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.35);
      border-left: 4px solid #8B5CF6;
      border-radius: 12px;
      padding: 22px 24px;
      width: 100%;
      margin-bottom: 28px;
      text-align: left;
    }
    .cr-label { font-size: 20px; color: #8B5CF6; letter-spacing: 2px; font-weight: 700; margin-bottom: 8px; }
    .cr-text { font-size: 28px; color: #FFFFFF; font-weight: 700; line-height: 1.35; }
    .cr-text .k { color: #F59E0B; }
    .result-row {
      display: flex;
      gap: 20px;
      width: 100%;
      align-items: center;
      margin-bottom: 24px;
    }
    .stat {
      flex: 1;
      background: #1A1A2E;
      border-radius: 12px;
      padding: 22px 16px;
      border: 1px solid rgba(139, 92, 246, 0.25);
    }
    .stat.total { border-left: 4px solid #B0B0CC; }
    .stat.dark { border-left: 4px solid #EF4444; }
    .stat-num { font-size: 88px; font-weight: 800; line-height: 1; margin-bottom: 6px; }
    .stat.total .stat-num { color: #FFFFFF; }
    .stat.dark .stat-num { color: #EF4444; }
    .stat-label { font-size: 22px; color: #B0B0CC; font-weight: 600; }
    .arrow { font-size: 40px; color: #8B5CF6; font-weight: 900; }
    .verdict {
      font-size: 36px;
      font-weight: 800;
      color: #EF4444;
      line-height: 1.3;
    }
    .verdict .em { color: #F59E0B; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="eyebrow">一个月后数一数</div>
    <div class="title">
      建了 40+ 个技能<br>
      跑一遍 <span class="k">check-resolvable</span>
    </div>
    <div class="checkrunner">
      <div class="cr-label">元技能</div>
      <div class="cr-text">专门检查<span class="k">能不能被触达</span></div>
    </div>
    <div class="result-row">
      <div class="stat total">
        <div class="stat-num">40+</div>
        <div class="stat-label">总技能数</div>
      </div>
      <div class="arrow">→</div>
      <div class="stat dark">
        <div class="stat-num">6</div>
        <div class="stat-label">完全不可达</div>
      </div>
    </div>
    <div class="verdict">
      <span class="em">15%</span> 的能力是黑的
    </div>
  </div>
</body>
</html>
