<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
      background:
        radial-gradient(circle at 25% 18%, rgba(239, 68, 68, 0.16), transparent 55%),
        radial-gradient(circle at 80% 80%, rgba(139, 92, 246, 0.18), transparent 55%),
        #0D0D1A;
    }
    .tag {
      font-size: 28px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 48px;
    }
    .headline {
      font-size: 80px;
      font-weight: 900;
      line-height: 1.18;
      letter-spacing: -2px;
      margin-bottom: 56px;
    }
    .headline .red { color: #EF4444; }
    .headline .yellow { color: #F59E0B; }
    .stats-row {
      display: flex;
      gap: 20px;
      margin-bottom: 40px;
      width: 100%;
      max-width: 920px;
    }
    .stat {
      flex: 1;
      background: #1A1A2E;
      border: 1px solid rgba(239, 68, 68, 0.4);
      border-left: 4px solid #EF4444;
      border-radius: 14px;
      padding: 26px 22px;
      text-align: center;
    }
    .stat .num {
      font-size: 72px;
      font-weight: 800;
      color: #EF4444;
      line-height: 1;
      margin-bottom: 10px;
    }
    .stat .num .unit { font-size: 32px; }
    .stat .label {
      font-size: 22px;
      color: #B0B0CC;
      font-weight: 600;
    }
    .verdict {
      background: #1A1A2E;
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-left: 4px solid #F59E0B;
      border-radius: 14px;
      padding: 22px 28px;
      max-width: 920px;
      width: 100%;
      text-align: left;
    }
    .verdict .label {
      font-size: 22px;
      color: #F59E0B;
      letter-spacing: 2px;
      font-weight: 800;
      margin-bottom: 10px;
    }
    .verdict .text {
      font-size: 30px;
      color: #FFFFFF;
      font-weight: 700;
      line-height: 1.45;
    }
    .verdict .text .em { color: #F59E0B; font-weight: 800; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="tag">YC 总裁博客 · 上周</div>
    <div class="headline">
      第一句话就点名了<br>
      <span class="red">LangChain</span>
    </div>
    <div class="stats-row">
      <div class="stat">
        <div class="num">1.6<span class="unit">亿$</span></div>
        <div class="label">融资</div>
      </div>
      <div class="stat">
        <div class="num">3<span class="unit">年</span></div>
        <div class="label">时间</div>
      </div>
      <div class="stat">
        <div class="num">独<span class="unit">角兽</span></div>
        <div class="label">估值</div>
      </div>
    </div>
    <div class="verdict">
      <div class="label">GARRY 原话</div>
      <div class="text">
        卖的是健身房会员卡<br>
        <span class="em">没给训练计划</span>
      </div>
    </div>
  </div>
</body>
</html>
