<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
      background:
        radial-gradient(circle at 25% 20%, rgba(139, 92, 246, 0.22), transparent 55%),
        radial-gradient(circle at 80% 82%, rgba(245, 158, 11, 0.14), transparent 55%),
        #0D0D1A;
    }
    .tag {
      font-size: 28px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 32px;
    }
    .quote-mark {
      font-size: 130px;
      color: #8B5CF6;
      font-weight: 900;
      line-height: 0.6;
      margin-bottom: 22px;
    }
    .quote-text {
      font-size: 48px;
      font-weight: 800;
      line-height: 1.32;
      color: #FFFFFF;
      margin-bottom: 18px;
      max-width: 920px;
    }
    .quote-text .em { color: #F59E0B; }
    .quote-text .p { color: #8B5CF6; }
    .attribution {
      font-size: 24px;
      color: #8B8BA8;
      font-weight: 600;
      margin-bottom: 38px;
      letter-spacing: 1px;
    }
    .verdict {
      background: #1A1A2E;
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-left: 4px solid #F59E0B;
      border-radius: 14px;
      padding: 22px 28px;
      max-width: 920px;
      width: 100%;
      text-align: left;
    }
    .verdict .label {
      font-size: 22px;
      color: #F59E0B;
      letter-spacing: 2px;
      font-weight: 800;
      margin-bottom: 10px;
    }
    .verdict .text {
      font-size: 28px;
      color: #FFFFFF;
      font-weight: 700;
      line-height: 1.4;
    }
    .verdict .text .em { color: #F59E0B; font-weight: 800; }
    .verdict .text .gray { color: #8B8BA8; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="tag">这不是 HIT PIECE</div>
    <div class="quote-mark">"</div>
    <div class="quote-text">
      每个失败<br>
      变成一个 <span class="p">skill</span><br>
      每个 skill <span class="em">配测试</span>
    </div>
    <div class="attribution">— Garry Tan</div>
    <div class="verdict">
      <div class="label">LANGCHAIN 的真正问题</div>
      <div class="text">
        <span class="gray">1.6 亿$ 买到了</span>零件<br>
        <span class="em">没买到方法论</span>
      </div>
    </div>
  </div>
</body>
</html>
