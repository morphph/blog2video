<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
      background:
        radial-gradient(circle at 25% 18%, rgba(239, 68, 68, 0.22), transparent 55%),
        radial-gradient(circle at 80% 80%, rgba(245, 158, 11, 0.14), transparent 55%),
        #0D0D1A;
    }
    .tag {
      font-size: 28px;
      color: #EF4444;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 32px;
    }
    .title {
      font-size: 56px;
      font-weight: 900;
      line-height: 1.18;
      margin-bottom: 40px;
      letter-spacing: -1px;
    }
    .title .r { color: #EF4444; }
    .vs-row {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 36px;
      width: 100%;
      max-width: 920px;
    }
    .vs-card {
      flex: 1;
      background: #1A1A2E;
      border-radius: 14px;
      padding: 26px 22px;
      text-align: center;
    }
    .vs-card.red {
      border: 1px solid rgba(239, 68, 68, 0.4);
      border-left: 4px solid #EF4444;
    }
    .vs-card.green {
      border: 1px solid rgba(16, 185, 129, 0.4);
      border-left: 4px solid #10B981;
    }
    .vs-card .num {
      font-size: 84px;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 8px;
    }
    .vs-card .num .unit { font-size: 32px; font-weight: 700; }
    .vs-card.red .num { color: #EF4444; }
    .vs-card.green .num { color: #10B981; }
    .vs-card .label {
      font-size: 22px;
      color: #B0B0CC;
      font-weight: 600;
    }
    .vs-sep {
      font-size: 32px;
      color: #6B7280;
      font-weight: 800;
      letter-spacing: 2px;
    }
    .reason {
      background: #1A1A2E;
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-left: 4px solid #F59E0B;
      border-radius: 14px;
      padding: 22px 28px;
      max-width: 920px;
      width: 100%;
      text-align: left;
    }
    .reason .label {
      font-size: 22px;
      color: #F59E0B;
      letter-spacing: 2px;
      font-weight: 800;
      margin-bottom: 10px;
    }
    .reason .text {
      font-size: 30px;
      color: #FFFFFF;
      font-weight: 700;
      line-height: 1.45;
    }
    .reason .text .em { color: #F59E0B; font-weight: 800; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="tag">他这周亲身踩的坑</div>
    <div class="title">Agent 撒了一个 <span class="r">1 小时</span>的谎</div>
    <div class="vs-row">
      <div class="vs-card red">
        <div class="num">28<span class="unit">分钟</span></div>
        <div class="label">Agent 算的</div>
      </div>
      <div class="vs-sep">VS</div>
      <div class="vs-card green">
        <div class="num">88<span class="unit">分钟</span></div>
        <div class="label">真实距离</div>
      </div>
    </div>
    <div class="reason">
      <div class="label">BUG 在哪</div>
      <div class="text">
        在脑子里心算时区<br>
        <span class="em">UTC → 太平洋时间算错了</span>
      </div>
    </div>
  </div>
</body>
</html>
