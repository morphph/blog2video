<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
      background:
        radial-gradient(circle at 25% 20%, rgba(139, 92, 246, 0.22), transparent 55%),
        radial-gradient(circle at 80% 82%, rgba(16, 185, 129, 0.14), transparent 55%),
        #0D0D1A;
    }
    .tag {
      font-size: 28px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 36px;
    }
    .title {
      font-size: 60px;
      font-weight: 900;
      line-height: 1.18;
      margin-bottom: 44px;
      letter-spacing: -1px;
    }
    .title .p { color: #8B5CF6; }
    .compare {
      display: flex;
      gap: 18px;
      width: 100%;
      max-width: 920px;
      margin-bottom: 28px;
    }
    .col {
      flex: 1;
      background: #1A1A2E;
      border-radius: 14px;
      padding: 24px 22px;
      text-align: left;
    }
    .col.purple {
      border: 1px solid rgba(139, 92, 246, 0.4);
      border-left: 4px solid #8B5CF6;
    }
    .col.green {
      border: 1px solid rgba(16, 185, 129, 0.4);
      border-left: 4px solid #10B981;
    }
    .col .name {
      font-size: 32px;
      font-weight: 900;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }
    .col.purple .name { color: #8B5CF6; }
    .col.green .name { color: #10B981; }
    .col .head {
      font-size: 24px;
      color: #FFFFFF;
      font-weight: 700;
      margin-bottom: 10px;
      line-height: 1.4;
    }
    .col .desc {
      font-size: 20px;
      color: #B0B0CC;
      font-weight: 600;
      line-height: 1.45;
    }
    .verdict {
      background: #1A1A2E;
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-left: 4px solid #F59E0B;
      border-radius: 14px;
      padding: 22px 28px;
      max-width: 920px;
      width: 100%;
      text-align: left;
    }
    .verdict .label {
      font-size: 22px;
      color: #F59E0B;
      letter-spacing: 2px;
      font-weight: 800;
      margin-bottom: 10px;
    }
    .verdict .text {
      font-size: 28px;
      color: #FFFFFF;
      font-weight: 700;
      line-height: 1.45;
    }
    .verdict .text .em { color: #F59E0B; font-weight: 800; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="tag">问题的本质 · 命名它</div>
    <div class="title">Agent 答在了 <span class="p">错的机器空间</span></div>
    <div class="compare">
      <div class="col purple">
        <div class="name">latent</div>
        <div class="head">靠判断力</div>
        <div class="desc">写邮件 / 做总结 / 读语境<br>这是模型该做的事</div>
      </div>
      <div class="col green">
        <div class="name">deterministic</div>
        <div class="head">靠精确</div>
        <div class="desc">同样输入永远同样输出<br>grep / 时间戳相减</div>
      </div>
    </div>
    <div class="verdict">
      <div class="label">真正的诊断</div>
      <div class="text">
        模型选了<span class="em">耍小聪明</span><br>
        而不是去执行纪律
      </div>
    </div>
  </div>
</body>
</html>
