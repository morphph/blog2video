<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
      background:
        radial-gradient(circle at 25% 20%, rgba(139, 92, 246, 0.22), transparent 55%),
        radial-gradient(circle at 80% 82%, rgba(245, 158, 11, 0.14), transparent 55%),
        #0D0D1A;
    }
    .tag {
      font-size: 28px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 32px;
    }
    .title {
      font-size: 54px;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 32px;
      letter-spacing: -1px;
    }
    .title .p { color: #8B5CF6; }
    .loop {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      max-width: 920px;
      margin-bottom: 28px;
    }
    .step {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.4);
      border-left: 4px solid #8B5CF6;
      border-radius: 12px;
      padding: 18px 22px;
      display: flex;
      gap: 16px;
      align-items: center;
      text-align: left;
    }
    .step .num {
      font-size: 36px;
      color: #8B5CF6;
      font-weight: 900;
      line-height: 1;
      min-width: 44px;
    }
    .step .body { flex: 1; }
    .step .head {
      font-size: 26px;
      color: #FFFFFF;
      font-weight: 800;
      margin-bottom: 4px;
    }
    .step .desc {
      font-size: 20px;
      color: #B0B0CC;
      font-weight: 600;
    }
    .step .desc .em { color: #F59E0B; font-weight: 800; }
    .quote {
      background: #1A1A2E;
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-left: 4px solid #F59E0B;
      border-radius: 14px;
      padding: 22px 28px;
      max-width: 920px;
      width: 100%;
      text-align: left;
    }
    .quote .label {
      font-size: 22px;
      color: #F59E0B;
      letter-spacing: 2px;
      font-weight: 800;
      margin-bottom: 10px;
    }
    .quote .text {
      font-size: 28px;
      color: #FFFFFF;
      font-weight: 700;
      line-height: 1.4;
    }
    .quote .text .em { color: #F59E0B; font-weight: 800; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="tag">那个很妙的回路</div>
    <div class="title">智能 <span class="p">造出</span> 约束自己的脚手架</div>
    <div class="loop">
      <div class="step">
        <div class="num">1</div>
        <div class="body">
          <div class="head">写 skill 合约</div>
          <div class="desc">一份 markdown 规则</div>
        </div>
      </div>
      <div class="step">
        <div class="num">2</div>
        <div class="body">
          <div class="head">Agent 自己写脚本</div>
          <div class="desc">不到 <span class="em">100 毫秒</span>跑完，零 LLM</div>
        </div>
      </div>
      <div class="step">
        <div class="num">3</div>
        <div class="body">
          <div class="head">skill 反向锁死 Agent</div>
          <div class="desc">下次必须跑脚本，不许思考</div>
        </div>
      </div>
    </div>
    <div class="quote">
      <div class="label">GARRY 原话</div>
      <div class="text">
        模型的智能创造了<br>
        <span class="em">防止模型变蠢的约束</span>
      </div>
    </div>
  </div>
</body>
</html>
