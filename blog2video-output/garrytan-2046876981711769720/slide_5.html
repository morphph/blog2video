<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
      background:
        radial-gradient(circle at 25% 18%, rgba(245, 158, 11, 0.22), transparent 55%),
        radial-gradient(circle at 80% 80%, rgba(139, 92, 246, 0.18), transparent 55%),
        #0D0D1A;
    }
    .tag {
      font-size: 28px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 32px;
    }
    .quote-mark {
      font-size: 120px;
      color: #F59E0B;
      font-weight: 900;
      line-height: 0.6;
      margin-bottom: 18px;
    }
    .verb {
      font-size: 110px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -2px;
      color: #F59E0B;
      margin-bottom: 14px;
      font-style: italic;
    }
    .attribution {
      font-size: 24px;
      color: #8B8BA8;
      font-weight: 600;
      margin-bottom: 40px;
      letter-spacing: 1px;
    }
    .trigger {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.4);
      border-left: 4px solid #8B5CF6;
      border-radius: 14px;
      padding: 22px 28px;
      width: 100%;
      max-width: 920px;
      text-align: left;
    }
    .trigger .label {
      font-size: 22px;
      color: #8B5CF6;
      letter-spacing: 2px;
      font-weight: 800;
      margin-bottom: 14px;
    }
    .trigger .row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 8px;
    }
    .trigger .num {
      font-size: 56px;
      font-weight: 800;
      color: #F59E0B;
      line-height: 1;
      min-width: 80px;
    }
    .trigger .info { flex: 1; }
    .trigger .head {
      font-size: 26px;
      color: #FFFFFF;
      font-weight: 800;
      line-height: 1.3;
    }
    .trigger .desc {
      font-size: 20px;
      color: #B0B0CC;
      font-weight: 600;
      line-height: 1.4;
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="tag">一句话 · 整套流程</div>
    <div class="quote-mark">"</div>
    <div class="verb">skillify it.</div>
    <div class="attribution">— Garry Tan</div>
    <div class="trigger">
      <div class="label">这一个动词触发</div>
      <div class="row">
        <div class="num">10</div>
        <div class="info">
          <div class="head">步永久基础设施</div>
          <div class="desc">合约 · 脚本 · 单测 · 评测 · 路由 · 审计</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
