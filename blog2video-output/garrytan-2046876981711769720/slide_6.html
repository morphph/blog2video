<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
      background:
        radial-gradient(circle at 25% 18%, rgba(59, 130, 246, 0.18), transparent 55%),
        radial-gradient(circle at 80% 80%, rgba(245, 158, 11, 0.16), transparent 55%),
        #0D0D1A;
    }
    .tag {
      font-size: 28px;
      color: #3B82F6;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 32px;
    }
    .title {
      font-size: 54px;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 36px;
      letter-spacing: -1px;
    }
    .title .b { color: #3B82F6; }
    .num-card {
      background: #1A1A2E;
      border: 1px solid rgba(59, 130, 246, 0.4);
      border-left: 4px solid #3B82F6;
      border-radius: 14px;
      padding: 26px 30px;
      max-width: 920px;
      width: 100%;
      text-align: left;
      margin-bottom: 20px;
    }
    .num-card .label {
      font-size: 22px;
      color: #3B82F6;
      letter-spacing: 2px;
      font-weight: 800;
      margin-bottom: 14px;
    }
    .num-card .row {
      display: flex;
      align-items: center;
      gap: 18px;
    }
    .num-card .num {
      font-size: 72px;
      font-weight: 800;
      color: #F59E0B;
      line-height: 1;
      min-width: 130px;
    }
    .num-card .info { flex: 1; }
    .num-card .head {
      font-size: 26px;
      color: #FFFFFF;
      font-weight: 800;
      line-height: 1.3;
    }
    .num-card .desc {
      font-size: 20px;
      color: #B0B0CC;
      font-weight: 600;
      line-height: 1.4;
      margin-top: 4px;
    }
    .risk {
      background: #1A1A2E;
      border: 1px solid rgba(239, 68, 68, 0.4);
      border-left: 4px solid #EF4444;
      border-radius: 14px;
      padding: 20px 26px;
      max-width: 920px;
      width: 100%;
      text-align: left;
    }
    .risk .label {
      font-size: 22px;
      color: #EF4444;
      letter-spacing: 2px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .risk .text {
      font-size: 26px;
      color: #FFFFFF;
      font-weight: 700;
      line-height: 1.4;
    }
    .risk .text .em { color: #EF4444; font-weight: 800; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="tag">第 7 步 · RESOLVER EVAL</div>
    <div class="title">路由表也得 <span class="b">被测试</span></div>
    <div class="num-card">
      <div class="label">RESOLVER 评测套件</div>
      <div class="row">
        <div class="num">50+</div>
        <div class="info">
          <div class="head">用例覆盖路由</div>
          <div class="desc">告诉 Agent 哪句话该调哪个 skill</div>
        </div>
      </div>
    </div>
    <div class="risk">
      <div class="label">两种失败</div>
      <div class="text">
        该触发<span class="em">没触发</span><br>
        或触发到<span class="em">错的 skill</span>
      </div>
    </div>
  </div>
</body>
</html>
