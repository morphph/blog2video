<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
      background:
        radial-gradient(circle at 25% 18%, rgba(239, 68, 68, 0.20), transparent 55%),
        radial-gradient(circle at 80% 80%, rgba(245, 158, 11, 0.14), transparent 55%),
        #0D0D1A;
    }
    .tag {
      font-size: 28px;
      color: #EF4444;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 32px;
    }
    .title {
      font-size: 50px;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 30px;
      letter-spacing: -1px;
    }
    .title .r { color: #EF4444; }
    .stats-row {
      display: flex;
      gap: 16px;
      width: 100%;
      max-width: 920px;
      margin-bottom: 22px;
    }
    .stat {
      flex: 1;
      background: #1A1A2E;
      border: 1px solid rgba(239, 68, 68, 0.4);
      border-left: 4px solid #EF4444;
      border-radius: 12px;
      padding: 22px 18px;
      text-align: center;
    }
    .stat .num {
      font-size: 64px;
      font-weight: 800;
      color: #EF4444;
      line-height: 1;
      margin-bottom: 8px;
    }
    .stat .num.y { color: #F59E0B; }
    .stat .label {
      font-size: 20px;
      color: #B0B0CC;
      font-weight: 600;
      line-height: 1.3;
    }
    .name-card {
      background: #1A1A2E;
      border: 1px solid rgba(239, 68, 68, 0.4);
      border-left: 4px solid #EF4444;
      border-radius: 14px;
      padding: 22px 28px;
      max-width: 920px;
      width: 100%;
      text-align: left;
      margin-bottom: 18px;
    }
    .name-card .label {
      font-size: 22px;
      color: #EF4444;
      letter-spacing: 2px;
      font-weight: 800;
      margin-bottom: 10px;
    }
    .name-card .text {
      font-size: 32px;
      color: #FFFFFF;
      font-weight: 800;
      line-height: 1.35;
    }
    .name-card .text .em { color: #EF4444; font-weight: 900; }
    .extra {
      background: #1A1A2E;
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-left: 4px solid #F59E0B;
      border-radius: 12px;
      padding: 18px 24px;
      max-width: 920px;
      width: 100%;
      text-align: left;
    }
    .extra .row {
      font-size: 24px;
      color: #FFFFFF;
      font-weight: 700;
      line-height: 1.4;
    }
    .extra .row .em { color: #F59E0B; font-weight: 800; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="tag">第 8 步 · CHECK-RESOLVABLE</div>
    <div class="title">写完只是一半 · 路由层是 <span class="r">真瓶颈</span></div>
    <div class="stats-row">
      <div class="stat">
        <div class="num y">40+</div>
        <div class="label">总 skill 数</div>
      </div>
      <div class="stat">
        <div class="num">6</div>
        <div class="label">unreachable</div>
      </div>
      <div class="stat">
        <div class="num">15%</div>
        <div class="label">是"暗的"</div>
      </div>
    </div>
    <div class="name-card">
      <div class="label">他给起了个名字</div>
      <div class="text">
        <span class="em">dark skill</span><br>
        比没有这个能力更糟
      </div>
    </div>
    <div class="extra">
      <div class="row">
        13 个写入 skill 中 <span class="em">10 个</span>归错目录
      </div>
    </div>
  </div>
</body>
</html>
