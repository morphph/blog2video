<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
      background:
        radial-gradient(circle at 22% 22%, rgba(239, 68, 68, 0.18), transparent 55%),
        radial-gradient(circle at 80% 80%, rgba(245, 158, 11, 0.14), transparent 55%),
        #0D0D1A;
    }
    .tag {
      font-size: 28px;
      color: #EF4444;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 24px;
    }
    .title {
      font-size: 54px;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 32px;
      letter-spacing: -1px;
    }
    .title .r { color: #EF4444; }
    .list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      max-width: 920px;
    }
    .item {
      background: #1A1A2E;
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-left: 4px solid #EF4444;
      border-radius: 12px;
      padding: 18px 22px;
      text-align: left;
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }
    .item .num {
      font-size: 36px;
      color: #EF4444;
      font-weight: 900;
      line-height: 1;
      min-width: 48px;
    }
    .item .body { flex: 1; }
    .item .head {
      font-size: 26px;
      color: #FFFFFF;
      font-weight: 800;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }
    .item .desc {
      font-size: 20px;
      color: #B0B0CC;
      font-weight: 600;
      line-height: 1.4;
    }
    .item .desc .em { color: #F59E0B; font-weight: 800; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="tag">不是爽文 · 讲代价</div>
    <div class="title">这套方法的 <span class="r">3 个代价</span></div>
    <div class="list">
      <div class="item">
        <div class="num">1</div>
        <div class="body">
          <div class="head">评测成本非线性</div>
          <div class="desc">单 skill 每天 <span class="em">35 个评测</span><br>系统共 <span class="em">179 个单测</span>，×40 skill</div>
        </div>
      </div>
      <div class="item">
        <div class="num">2</div>
        <div class="body">
          <div class="head">假设长期 Agent</div>
          <div class="desc">偶尔写邮件的人不适用<br>10 步成本压不平</div>
        </div>
      </div>
      <div class="item">
        <div class="num">3</div>
        <div class="body">
          <div class="head">早期会拖慢节奏</div>
          <div class="desc">没踩过坑 难接受造护栏<br>功能开发会被显著拖慢</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
