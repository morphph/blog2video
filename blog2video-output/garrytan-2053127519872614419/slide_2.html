<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
      background:
        radial-gradient(circle at 20% 22%, rgba(139, 92, 246, 0.16), transparent 55%),
        radial-gradient(circle at 80% 80%, rgba(16, 185, 129, 0.12), transparent 55%),
        #0D0D1A;
    }
    .tag {
      font-size: 28px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 40px;
    }
    .title {
      font-size: 64px;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 14px;
      letter-spacing: -1px;
    }
    .title .y { color: #F59E0B; }
    .subtitle {
      font-size: 26px;
      color: #B0B0CC;
      font-weight: 600;
      margin-bottom: 44px;
    }
    .book {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-left: 4px solid #8B5CF6;
      border-radius: 14px;
      padding: 24px 28px;
      width: 100%;
      max-width: 920px;
      text-align: left;
      margin-bottom: 40px;
    }
    .book .book-title {
      font-size: 30px;
      font-weight: 800;
      color: #FFFFFF;
      margin-bottom: 6px;
    }
    .book .book-meta {
      font-size: 22px;
      color: #8B8BA8;
      font-weight: 600;
    }
    .cols {
      display: flex;
      gap: 24px;
      width: 100%;
      max-width: 920px;
      margin-bottom: 36px;
    }
    .col {
      flex: 1;
      background: #1A1A2E;
      border-radius: 14px;
      padding: 22px;
      text-align: left;
    }
    .col.left {
      border: 1px solid rgba(59, 130, 246, 0.35);
      border-left: 4px solid #3B82F6;
    }
    .col.right {
      border: 1px solid rgba(16, 185, 129, 0.35);
      border-left: 4px solid #10B981;
    }
    .col .col-label {
      font-size: 22px;
      letter-spacing: 2px;
      font-weight: 800;
      margin-bottom: 10px;
    }
    .col.left .col-label { color: #3B82F6; }
    .col.right .col-label { color: #10B981; }
    .col .col-text {
      font-size: 24px;
      color: #FFFFFF;
      font-weight: 600;
      line-height: 1.4;
    }
    .result {
      background: #1A1A2E;
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-left: 4px solid #F59E0B;
      border-radius: 14px;
      padding: 26px 32px;
      width: 100%;
      max-width: 920px;
      text-align: left;
    }
    .result .big {
      font-size: 72px;
      font-weight: 800;
      color: #F59E0B;
      line-height: 1;
      margin-bottom: 8px;
    }
    .result .desc {
      font-size: 26px;
      color: #FFFFFF;
      font-weight: 700;
    }
    .badge {
      display: inline-block;
      background: rgba(139, 92, 246, 0.15);
      color: #B299FF;
      font-size: 22px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 999px;
      margin-right: 10px;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="tag">案例 · BOOK MIRROR</div>
    <div class="title">让 AI <span class="y">反过来照</span>他自己</div>
    <div class="subtitle">普通人让 AI 总结，他做了一件别的事</div>
    <div class="book">
      <div class="book-title">When Things Fall Apart</div>
      <div class="book-meta">
        <span class="badge">162 页</span>
        <span class="badge">22 章</span>
        朋友在低谷时推荐的佛教书
      </div>
    </div>
    <div class="cols">
      <div class="col left">
        <div class="col-label">左栏</div>
        <div class="col-text">作者讲了什么</div>
      </div>
      <div class="col right">
        <div class="col-label">右栏</div>
        <div class="col-text">映射到他人生具体场景</div>
      </div>
    </div>
    <div class="result">
      <div class="big">3 万字</div>
      <div class="desc">一份只属于他的自我地图</div>
    </div>
  </div>
</body>
</html>
