<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
      background:
        radial-gradient(circle at 22% 22%, rgba(239, 68, 68, 0.16), transparent 55%),
        radial-gradient(circle at 80% 80%, rgba(139, 92, 246, 0.16), transparent 55%),
        #0D0D1A;
    }
    .tag {
      font-size: 28px;
      color: #EF4444;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 32px;
    }
    .title {
      font-size: 62px;
      font-weight: 900;
      line-height: 1.18;
      margin-bottom: 32px;
      letter-spacing: -1px;
    }
    .title .r { color: #EF4444; }
    .errors {
      background: #1A1A2E;
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-left: 4px solid #EF4444;
      border-radius: 14px;
      padding: 22px 26px;
      max-width: 920px;
      width: 100%;
      text-align: left;
      margin-bottom: 28px;
    }
    .errors .label {
      font-size: 22px;
      color: #EF4444;
      letter-spacing: 2px;
      font-weight: 800;
      margin-bottom: 12px;
    }
    .errors .item {
      font-size: 24px;
      color: #FFFFFF;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 6px;
    }
    .errors .item .x { color: #EF4444; font-weight: 800; }
    .fix-title {
      font-size: 30px;
      color: #10B981;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 18px;
    }
    .models {
      display: flex;
      gap: 16px;
      width: 100%;
      max-width: 920px;
      margin-bottom: 28px;
    }
    .model {
      flex: 1;
      background: #1A1A2E;
      border: 1px solid rgba(59, 130, 246, 0.3);
      border-left: 4px solid #3B82F6;
      border-radius: 12px;
      padding: 18px 14px;
      text-align: center;
    }
    .model .name {
      font-size: 22px;
      color: #3B82F6;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .model .duty {
      font-size: 20px;
      color: #FFFFFF;
      font-weight: 600;
      line-height: 1.35;
    }
    .principle {
      background: #1A1A2E;
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-left: 4px solid #F59E0B;
      border-radius: 14px;
      padding: 24px 28px;
      max-width: 920px;
      width: 100%;
      text-align: left;
    }
    .principle .label {
      font-size: 22px;
      color: #F59E0B;
      letter-spacing: 2px;
      font-weight: 800;
      margin-bottom: 12px;
    }
    .principle .text {
      font-size: 30px;
      color: #FFFFFF;
      font-weight: 700;
      line-height: 1.4;
    }
    .principle .text .em { color: #F59E0B; font-weight: 800; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="tag">第一版是个<span style="color:#FFF;">灾难</span></div>
    <div class="title">系统编了 <span class="r">3 个</span> 假事实</div>
    <div class="errors">
      <div class="label">关于他家庭的</div>
      <div class="item"><span class="x">✗</span> 说他父母离婚（没有）</div>
      <div class="item"><span class="x">✗</span> 说他在香港长大（出生加拿大）</div>
      <div class="item"><span class="x">✗</span> 分享出去，关系就完了</div>
    </div>
    <div class="fix-title">CROSS-MODAL EVAL · 三模型互评</div>
    <div class="models">
      <div class="model">
        <div class="name">Opus 4.7</div>
        <div class="duty">精度错误</div>
      </div>
      <div class="model">
        <div class="name">GPT-5.5</div>
        <div class="duty">缺失上下文</div>
      </div>
      <div class="model">
        <div class="name">DeepSeek V4</div>
        <div class="duty">读起来太泛</div>
      </div>
    </div>
    <div class="principle">
      <div class="label">反直觉</div>
      <div class="text">
        <span class="em">第一版必须烂</span><br>
        否则没东西可以提炼成流程
      </div>
    </div>
  </div>
</body>
</html>
