<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
      background:
        radial-gradient(circle at 25% 20%, rgba(245, 158, 11, 0.18), transparent 55%),
        radial-gradient(circle at 80% 80%, rgba(139, 92, 246, 0.16), transparent 55%),
        #0D0D1A;
    }
    .tag {
      font-size: 28px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 32px;
    }
    .big-num {
      font-size: 180px;
      font-weight: 900;
      color: #F59E0B;
      line-height: 1;
      margin-bottom: 8px;
      letter-spacing: -4px;
    }
    .big-label {
      font-size: 36px;
      color: #FFFFFF;
      font-weight: 800;
      margin-bottom: 48px;
      letter-spacing: 2px;
    }
    .core {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.4);
      border-left: 4px solid #8B5CF6;
      border-radius: 14px;
      padding: 22px 28px;
      width: 100%;
      max-width: 920px;
      text-align: left;
      margin-bottom: 24px;
    }
    .core .label {
      font-size: 22px;
      color: #8B5CF6;
      letter-spacing: 2px;
      font-weight: 800;
      margin-bottom: 10px;
    }
    .core .text {
      font-size: 28px;
      color: #FFFFFF;
      font-weight: 700;
      line-height: 1.4;
    }
    .core .text .em { color: #F59E0B; font-weight: 800; }
    .meta {
      background: #1A1A2E;
      border: 1px solid rgba(16, 185, 129, 0.4);
      border-left: 4px solid #10B981;
      border-radius: 14px;
      padding: 22px 28px;
      width: 100%;
      max-width: 920px;
      text-align: left;
    }
    .meta .label {
      font-size: 22px;
      color: #10B981;
      letter-spacing: 2px;
      font-weight: 800;
      margin-bottom: 10px;
    }
    .meta .text {
      font-size: 28px;
      color: #FFFFFF;
      font-weight: 700;
      line-height: 1.4;
    }
    .meta .text .em { color: #F59E0B; font-weight: 800; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="tag">他到底攒了多少？</div>
    <div class="big-num">10 万</div>
    <div class="big-label">页结构化知识</div>
    <div class="core">
      <div class="label">ENTITY PROPAGATION</div>
      <div class="text">
        会议页本身不是产物<br>
        <span class="em">信息扩散回 10 个关系页</span> 才是
      </div>
    </div>
    <div class="meta">
      <div class="label">他的比喻</div>
      <div class="text">
        这不是档案柜<br>
        是 <span class="em">神经系统</span>
      </div>
    </div>
  </div>
</body>
</html>
