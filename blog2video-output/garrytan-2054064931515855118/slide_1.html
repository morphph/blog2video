<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
      background:
        radial-gradient(circle at 25% 18%, rgba(16, 185, 129, 0.18), transparent 55%),
        radial-gradient(circle at 80% 80%, rgba(245, 158, 11, 0.16), transparent 55%),
        #0D0D1A;
    }
    .tag {
      font-size: 28px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 36px;
    }
    .headline {
      font-size: 60px;
      font-weight: 900;
      line-height: 1.2;
      letter-spacing: -1px;
      margin-bottom: 40px;
    }
    .headline .y { color: #F59E0B; }
    .stats-row {
      display: flex;
      gap: 16px;
      margin-bottom: 36px;
      width: 100%;
      max-width: 920px;
    }
    .stat {
      flex: 1;
      background: #1A1A2E;
      border: 1px solid rgba(16, 185, 129, 0.4);
      border-left: 4px solid #10B981;
      border-radius: 14px;
      padding: 24px 14px;
      text-align: center;
    }
    .stat .num {
      font-size: 68px;
      font-weight: 900;
      color: #10B981;
      line-height: 1;
      margin-bottom: 8px;
      letter-spacing: -1px;
    }
    .stat .num .unit { font-size: 26px; font-weight: 800; }
    .stat .label {
      font-size: 20px;
      color: #B0B0CC;
      font-weight: 600;
    }
    .verdict {
      background: #1A1A2E;
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-left: 4px solid #F59E0B;
      border-radius: 14px;
      padding: 22px 28px;
      max-width: 920px;
      width: 100%;
      text-align: left;
    }
    .verdict .label {
      font-size: 22px;
      color: #F59E0B;
      letter-spacing: 2px;
      font-weight: 800;
      margin-bottom: 10px;
    }
    .verdict .text {
      font-size: 30px;
      color: #FFFFFF;
      font-weight: 700;
      line-height: 1.45;
    }
    .verdict .text .em { color: #F59E0B; font-weight: 800; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="tag">YC 总裁 · 一个真在跑的开源</div>
    <div class="headline">
      为什么 <span class="y">90%</span> 这条线<br>
      突然不再昂贵
    </div>
    <div class="stats-row">
      <div class="stat">
        <div class="num">72<span class="unit">小时</span></div>
        <div class="label">连续输出</div>
      </div>
      <div class="stat">
        <div class="num">14<span class="unit">PR</span></div>
        <div class="label">全部合并</div>
      </div>
      <div class="stat">
        <div class="num">29K<span class="unit">行</span></div>
        <div class="label">新增代码</div>
      </div>
    </div>
    <div class="verdict">
      <div class="label">他说</div>
      <div class="text">
        每个 release 的测试质量<br>
        都比上一个 <span class="em">更高</span>
      </div>
    </div>
  </div>
</body>
</html>
