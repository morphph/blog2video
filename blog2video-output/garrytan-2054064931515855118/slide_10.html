<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
      background:
        radial-gradient(circle at 25% 18%, rgba(245, 158, 11, 0.24), transparent 55%),
        radial-gradient(circle at 80% 80%, rgba(139, 92, 246, 0.18), transparent 55%),
        #0D0D1A;
    }
    .tag {
      font-size: 28px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 28px;
    }
    .quote-mark {
      font-size: 120px;
      color: #F59E0B;
      font-weight: 900;
      line-height: 0.6;
      margin-bottom: 22px;
    }
    .quote {
      font-size: 64px;
      font-weight: 900;
      line-height: 1.2;
      letter-spacing: -1px;
      margin-bottom: 18px;
      color: #FFFFFF;
    }
    .quote .y { color: #F59E0B; }
    .subquote {
      font-size: 30px;
      color: #B0B0CC;
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 44px;
      max-width: 880px;
    }
    .anchor {
      background: #1A1A2E;
      border: 1px solid rgba(16, 185, 129, 0.4);
      border-left: 4px solid #10B981;
      border-radius: 14px;
      padding: 22px 28px;
      max-width: 920px;
      width: 100%;
      text-align: left;
    }
    .anchor .label {
      font-size: 22px;
      color: #10B981;
      letter-spacing: 2px;
      font-weight: 800;
      margin-bottom: 10px;
    }
    .anchor .text {
      font-size: 30px;
      color: #FFFFFF;
      font-weight: 800;
      line-height: 1.4;
    }
    .anchor .text .em { color: #10B981; font-weight: 800; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="tag">整篇博客 · 最锋利的一句</div>
    <div class="quote-mark">"</div>
    <div class="quote">
      AI 不知道<br>
      什么叫 <span class="y">累</span>
    </div>
    <div class="subquote">
      凌晨两点补第 14 个边界测试<br>
      一句怨言都没有
    </div>
    <div class="anchor">
      <div class="label">真正的解锁</div>
      <div class="text">
        不是写得快<br>
        是 <span class="em">"验证"</span> 第一次便宜得起
      </div>
    </div>
  </div>
</body>
</html>
