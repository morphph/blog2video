<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
      background:
        radial-gradient(circle at 25% 18%, rgba(59, 130, 246, 0.22), transparent 55%),
        radial-gradient(circle at 80% 80%, rgba(139, 92, 246, 0.18), transparent 55%),
        #0D0D1A;
    }
    .tag {
      font-size: 28px;
      color: #3B82F6;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 24px;
    }
    .title {
      font-size: 54px;
      font-weight: 900;
      line-height: 1.18;
      margin-bottom: 30px;
      letter-spacing: -1px;
    }
    .title .b { color: #3B82F6; }
    .chain {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      max-width: 920px;
      margin-bottom: 24px;
    }
    .chain-item {
      background: #1A1A2E;
      border: 1px solid rgba(59, 130, 246, 0.4);
      border-left: 4px solid #3B82F6;
      border-radius: 12px;
      padding: 14px 22px;
      text-align: center;
      font-size: 26px;
      color: #FFFFFF;
      font-weight: 800;
    }
    .chain-item .em { color: #3B82F6; }
    .chain-arrow {
      font-size: 24px;
      color: #6B7280;
      font-weight: 900;
      text-align: center;
    }
    .pr-card {
      background: #1A1A2E;
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-left: 4px solid #F59E0B;
      border-radius: 14px;
      padding: 20px 26px;
      max-width: 920px;
      width: 100%;
      text-align: left;
    }
    .pr-card .label {
      font-size: 22px;
      color: #F59E0B;
      letter-spacing: 2px;
      font-weight: 800;
      margin-bottom: 10px;
    }
    .pr-row {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .pr-row .num {
      font-size: 56px;
      font-weight: 900;
      color: #F59E0B;
      line-height: 1;
      letter-spacing: -1px;
    }
    .pr-row .desc {
      flex: 1;
      font-size: 22px;
      color: #FFFFFF;
      font-weight: 700;
      line-height: 1.4;
    }
    .pr-row .desc .em { color: #F59E0B; font-weight: 800; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="tag">边界还在扩张 · TTY 层</div>
    <div class="title">可观察 = <span class="b">可测</span></div>
    <div class="chain">
      <div class="chain-item">只要被 <span class="em">harness 包住</span></div>
      <div class="chain-arrow">↓</div>
      <div class="chain-item">就可以被 <span class="em">观察</span></div>
      <div class="chain-arrow">↓</div>
      <div class="chain-item">就可以被 <span class="em">断言</span></div>
      <div class="chain-arrow">↓</div>
      <div class="chain-item">就可以被 <span class="em">棘轮锁住</span></div>
    </div>
    <div class="pr-card">
      <div class="label">GSTACK · PR #1354</div>
      <div class="pr-row">
        <div class="num">TTY</div>
        <div class="desc">
          伪终端里 spawn Claude Code<br>
          盯 Agent <span class="em">有没有问问题</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
