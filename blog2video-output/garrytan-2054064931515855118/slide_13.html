<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
      background:
        radial-gradient(circle at 25% 18%, rgba(16, 185, 129, 0.22), transparent 55%),
        radial-gradient(circle at 80% 80%, rgba(245, 158, 11, 0.18), transparent 55%),
        #0D0D1A;
    }
    .tag {
      font-size: 28px;
      color: #10B981;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 28px;
    }
    .title {
      font-size: 50px;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 36px;
      letter-spacing: -1px;
    }
    .title .g { color: #10B981; }
    .flip {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      max-width: 920px;
      margin-bottom: 28px;
    }
    .row {
      background: #1A1A2E;
      border-radius: 14px;
      padding: 22px 28px;
      text-align: left;
    }
    .row.old {
      border: 1px solid rgba(239, 68, 68, 0.4);
      border-left: 4px solid #EF4444;
    }
    .row.new {
      border: 1px solid rgba(16, 185, 129, 0.4);
      border-left: 4px solid #10B981;
    }
    .row .label {
      font-size: 22px;
      letter-spacing: 2px;
      font-weight: 800;
      margin-bottom: 10px;
    }
    .row.old .label { color: #EF4444; }
    .row.new .label { color: #10B981; }
    .row .text {
      font-size: 30px;
      color: #FFFFFF;
      font-weight: 800;
      line-height: 1.35;
    }
    .row.old .text .em { color: #EF4444; }
    .row.new .text .em { color: #10B981; }
    .arrow {
      text-align: center;
      font-size: 32px;
      color: #F59E0B;
      font-weight: 900;
      margin: -6px 0;
    }
    .anchor {
      background: #1A1A2E;
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-left: 4px solid #F59E0B;
      border-radius: 14px;
      padding: 22px 28px;
      max-width: 920px;
      width: 100%;
      text-align: left;
    }
    .anchor .label {
      font-size: 22px;
      color: #F59E0B;
      letter-spacing: 2px;
      font-weight: 800;
      margin-bottom: 10px;
    }
    .anchor .text {
      font-size: 26px;
      color: #FFFFFF;
      font-weight: 800;
      line-height: 1.4;
    }
    .anchor .text .em { color: #F59E0B; font-weight: 800; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="tag">认知翻转 · 一句话</div>
    <div class="title">从"防止" <span class="g">到"棘轮"</span></div>
    <div class="flip">
      <div class="row old">
        <div class="label">过去 50 年</div>
        <div class="text">
          <span class="em">防止</span>错误发生
        </div>
      </div>
      <div class="arrow">↓</div>
      <div class="row new">
        <div class="label">现在的相位</div>
        <div class="text">
          错误一旦发生<br>
          <span class="em">永远钉在棘轮上</span>
        </div>
      </div>
    </div>
    <div class="anchor">
      <div class="label">每家不采用的公司</div>
      <div class="text">
        速度和质量已经在被 <span class="em">单人项目超过</span>
      </div>
    </div>
  </div>
</body>
</html>
