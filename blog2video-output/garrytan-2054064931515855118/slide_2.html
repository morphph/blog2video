<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
      background:
        radial-gradient(circle at 25% 18%, rgba(139, 92, 246, 0.20), transparent 55%),
        radial-gradient(circle at 80% 80%, rgba(239, 68, 68, 0.16), transparent 55%),
        #0D0D1A;
    }
    .tag {
      font-size: 28px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 28px;
    }
    .title {
      font-size: 54px;
      font-weight: 900;
      line-height: 1.18;
      margin-bottom: 32px;
      letter-spacing: -1px;
    }
    .title .p { color: #8B5CF6; }
    .stats-grid {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      max-width: 920px;
      margin-bottom: 24px;
    }
    .stat-row {
      display: flex;
      gap: 14px;
    }
    .stat {
      flex: 1;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.4);
      border-left: 4px solid #8B5CF6;
      border-radius: 12px;
      padding: 20px 18px;
      text-align: center;
    }
    .stat .num {
      font-size: 60px;
      font-weight: 900;
      color: #8B5CF6;
      line-height: 1;
      margin-bottom: 6px;
      letter-spacing: -1px;
    }
    .stat .num .unit { font-size: 24px; font-weight: 800; }
    .stat .label {
      font-size: 20px;
      color: #B0B0CC;
      font-weight: 600;
      line-height: 1.3;
    }
    .conflict {
      background: #1A1A2E;
      border: 1px solid rgba(239, 68, 68, 0.4);
      border-left: 4px solid #EF4444;
      border-radius: 14px;
      padding: 20px 26px;
      max-width: 920px;
      width: 100%;
      text-align: left;
    }
    .conflict .label {
      font-size: 22px;
      color: #EF4444;
      letter-spacing: 2px;
      font-weight: 800;
      margin-bottom: 10px;
    }
    .conflict .text {
      font-size: 26px;
      color: #FFFFFF;
      font-weight: 700;
      line-height: 1.45;
    }
    .conflict .text .em { color: #EF4444; font-weight: 800; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="tag">背景 · 这不是 DEMO</div>
    <div class="title">GStack + GBrain <span class="p">的体量</span></div>
    <div class="stats-grid">
      <div class="stat-row">
        <div class="stat">
          <div class="num">970K<span class="unit">行</span></div>
          <div class="label">代码总量</div>
        </div>
        <div class="stat">
          <div class="num">665<span class="unit">个</span></div>
          <div class="label">测试文件</div>
        </div>
      </div>
      <div class="stat-row">
        <div class="stat">
          <div class="num">15<span class="unit">个</span></div>
          <div class="label">并发 session</div>
        </div>
        <div class="stat">
          <div class="num">1<span class="unit">人</span></div>
          <div class="label">几乎全 AI 写</div>
        </div>
      </div>
    </div>
    <div class="conflict">
      <div class="label">过去 50 年常识</div>
      <div class="text">
        速度 vs 质量 <span class="em">二选一</span><br>
        但 Garry 说：今天不用选了
      </div>
    </div>
  </div>
</body>
</html>
