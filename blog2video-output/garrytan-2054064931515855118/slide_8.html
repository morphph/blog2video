<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
      background:
        radial-gradient(circle at 25% 18%, rgba(245, 158, 11, 0.22), transparent 55%),
        radial-gradient(circle at 80% 80%, rgba(16, 185, 129, 0.16), transparent 55%),
        #0D0D1A;
    }
    .tag {
      font-size: 28px;
      color: #F59E0B;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 24px;
    }
    .title {
      font-size: 50px;
      font-weight: 900;
      line-height: 1.18;
      margin-bottom: 32px;
      letter-spacing: -1px;
    }
    .title .y { color: #F59E0B; }
    .curve-card {
      background: #1A1A2E;
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-left: 4px solid #F59E0B;
      border-radius: 14px;
      padding: 22px 26px;
      max-width: 920px;
      width: 100%;
      text-align: left;
      margin-bottom: 18px;
    }
    .curve-card .label {
      font-size: 22px;
      color: #F59E0B;
      letter-spacing: 2px;
      font-weight: 800;
      margin-bottom: 12px;
    }
    .curve-card .author {
      font-size: 20px;
      color: #B0B0CC;
      font-weight: 600;
      margin-bottom: 14px;
    }
    .vs-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .vs-card {
      flex: 1;
      text-align: center;
      padding: 14px 8px;
      border-radius: 10px;
    }
    .vs-card.red {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.4);
    }
    .vs-card.green {
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.4);
    }
    .vs-card .num {
      font-size: 56px;
      font-weight: 900;
      line-height: 1;
      margin-bottom: 4px;
      letter-spacing: -1px;
    }
    .vs-card.red .num { color: #EF4444; }
    .vs-card.green .num { color: #10B981; }
    .vs-card .label2 {
      font-size: 18px;
      color: #B0B0CC;
      font-weight: 600;
      line-height: 1.3;
    }
    .vs-sep {
      font-size: 28px;
      color: #F59E0B;
      font-weight: 900;
    }
    .six-sigma {
      background: #1A1A2E;
      border: 1px solid rgba(59, 130, 246, 0.4);
      border-left: 4px solid #3B82F6;
      border-radius: 14px;
      padding: 18px 26px;
      max-width: 920px;
      width: 100%;
      text-align: left;
    }
    .six-sigma .label {
      font-size: 20px;
      color: #3B82F6;
      letter-spacing: 2px;
      font-weight: 800;
      margin-bottom: 10px;
    }
    .sigma-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .sigma {
      flex: 1;
      text-align: center;
    }
    .sigma .n {
      font-size: 32px;
      color: #FFFFFF;
      font-weight: 900;
      line-height: 1;
    }
    .sigma .n .em { color: #3B82F6; }
    .sigma .d {
      font-size: 16px;
      color: #B0B0CC;
      font-weight: 600;
      margin-top: 4px;
    }
    .sigma-arrow {
      font-size: 24px;
      color: #6B7280;
      font-weight: 900;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="tag">为什么是 90% · 数据告诉你</div>
    <div class="title">非线性曲线 <span class="y">85% 是膝盖</span></div>
    <div class="curve-card">
      <div class="label">CAPERS JONES · 缺陷清除效率</div>
      <div class="author">10,000+ 软件项目研究</div>
      <div class="vs-row">
        <div class="vs-card red">
          <div class="num">70%</div>
          <div class="label2">覆盖率 → 65~75% 抓 bug</div>
        </div>
        <div class="vs-sep">→</div>
        <div class="vs-card green">
          <div class="num">90%</div>
          <div class="label2">覆盖率 → 92~97% 抓 bug</div>
        </div>
      </div>
    </div>
    <div class="six-sigma">
      <div class="label">SIX SIGMA · 同一种曲线</div>
      <div class="sigma-row">
        <div class="sigma">
          <div class="n">3<span class="em">σ</span></div>
          <div class="d">67K 缺陷</div>
        </div>
        <div class="sigma-arrow">→</div>
        <div class="sigma">
          <div class="n">4<span class="em">σ</span></div>
          <div class="d">6.2K 缺陷</div>
        </div>
        <div class="sigma-arrow">→</div>
        <div class="sigma">
          <div class="n">5<span class="em">σ</span></div>
          <div class="d">233 缺陷</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
