<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
      background:
        radial-gradient(circle at 25% 18%, rgba(239, 68, 68, 0.22), transparent 55%),
        radial-gradient(circle at 80% 80%, rgba(245, 158, 11, 0.14), transparent 55%),
        #0D0D1A;
    }
    .tag {
      font-size: 28px;
      color: #EF4444;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 24px;
    }
    .title {
      font-size: 50px;
      font-weight: 900;
      line-height: 1.18;
      margin-bottom: 28px;
      letter-spacing: -1px;
    }
    .title .r { color: #EF4444; }
    .study {
      background: #1A1A2E;
      border: 1px solid rgba(239, 68, 68, 0.4);
      border-left: 4px solid #EF4444;
      border-radius: 14px;
      padding: 22px 26px;
      max-width: 920px;
      width: 100%;
      text-align: left;
      margin-bottom: 20px;
    }
    .study .label {
      font-size: 22px;
      color: #EF4444;
      letter-spacing: 2px;
      font-weight: 800;
      margin-bottom: 12px;
    }
    .study .text {
      font-size: 28px;
      color: #FFFFFF;
      font-weight: 800;
      line-height: 1.4;
    }
    .study .text .em { color: #EF4444; }
    .study .author {
      font-size: 18px;
      color: #6B7280;
      font-weight: 600;
      margin-top: 8px;
    }
    .list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 920px;
      margin-bottom: 20px;
    }
    .item {
      background: #1A1A2E;
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-left: 4px solid #EF4444;
      border-radius: 12px;
      padding: 16px 22px;
      text-align: left;
    }
    .item .head {
      font-size: 22px;
      color: #FFFFFF;
      font-weight: 800;
      margin-bottom: 4px;
    }
    .item .desc {
      font-size: 18px;
      color: #B0B0CC;
      font-weight: 600;
      line-height: 1.4;
    }
    .item .desc .em { color: #EF4444; font-weight: 800; }
    .verdict {
      background: #1A1A2E;
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-left: 4px solid #F59E0B;
      border-radius: 14px;
      padding: 18px 28px;
      max-width: 920px;
      width: 100%;
      text-align: left;
    }
    .verdict .label {
      font-size: 22px;
      color: #F59E0B;
      letter-spacing: 2px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .verdict .text {
      font-size: 24px;
      color: #FFFFFF;
      font-weight: 700;
      line-height: 1.4;
    }
    .verdict .text .em { color: #F59E0B; font-weight: 800; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="tag">为什么过去没人用 · 努力曲线</div>
    <div class="title">最后 <span class="r">20%</span> 的代价</div>
    <div class="study">
      <div class="label">VISTA 研究</div>
      <div class="text">
        最后 20% 的覆盖率<br>
        所需工作量 <span class="em">远远超过前 70%</span>
      </div>
      <div class="author">Mockus / Nagappan / Dinh-Trong</div>
    </div>
    <div class="list">
      <div class="item">
        <div class="head">第 14 个边界测试</div>
        <div class="desc">不是技术难 是 <span class="em">消耗意志力</span></div>
      </div>
      <div class="item">
        <div class="head">周五下午五点</div>
        <div class="desc">那个又脏又长的 integration test</div>
      </div>
    </div>
    <div class="verdict">
      <div class="label">所以过去</div>
      <div class="text">
        90% 是 <span class="em">航电级 / 医疗级</span> 才砸钱的天花板
      </div>
    </div>
  </div>
</body>
</html>
