<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=1080"><style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1080px; height:1920px; background:#0D0D1A; font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif; color:#FFFFFF; overflow:hidden; }
.slide { width:100%; height:100%; padding:200px 72px 420px 72px; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; position:relative; }
.glow { position:absolute; top:34%; left:50%; transform:translate(-50%,-50%); width:760px; height:760px; background:radial-gradient(circle, rgba(139,92,246,0.28) 0%, rgba(139,92,246,0) 68%); pointer-events:none; }
.kicker { font-size:30px; color:#8B5CF6; font-weight:700; letter-spacing:2px; margin-bottom:34px; }
.title { font-size:92px; font-weight:800; line-height:1.18; }
.title .big { color:#F59E0B; }
.cards { display:flex; gap:24px; width:100%; margin-top:80px; }
.card { flex:1; background:#1A1A2E; border:1px solid rgba(139,92,246,0.35); border-left:4px solid #EF4444; border-radius:12px; padding:32px 24px; text-align:left; }
.card.b { border-left-color:#8B5CF6; }
.card .lab { font-size:26px; color:#6B7280; margin-bottom:14px; letter-spacing:1px; }
.card .txt { font-size:34px; font-weight:700; line-height:1.35; color:#B0B0CC; }
.card .txt em { color:#FFFFFF; font-style:normal; }
</style></head><body><div class="slide">
<div class="glow"></div>
<div class="kicker">// 99% 的人都用错了 /goal</div>
<div class="title">一个 prompt 跑 <span class="big">30 小时</span><br>把对手做到 <span class="big">50 倍</span></div>
<div class="cards">
<div class="card"><div class="lab">别人的想象</div><div class="txt">挂机走人<br><em>回来就是能跑的代码</em></div></div>
<div class="card b"><div class="lab">他真正做的</div><div class="txt">反向拆解对手产品<br><em>做到 50 倍</em></div></div>
</div>
</div></body></html>
