<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=1080"><style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1080px; height:1920px; background:#0D0D1A; font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif; color:#FFFFFF; overflow:hidden; }
.slide { width:100%; height:100%; padding:200px 72px 420px 72px; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; position:relative; }
.glow { position:absolute; top:30%; left:50%; transform:translate(-50%,-50%); width:720px; height:720px; background:radial-gradient(circle, rgba(16,185,129,0.2) 0%, rgba(16,185,129,0) 68%); pointer-events:none; }
.head { font-size:32px; color:#6B7280; margin-bottom:26px; letter-spacing:1px; }
.title { font-size:56px; font-weight:800; line-height:1.35; margin-bottom:50px; }
.title .old { color:#EF4444; }
.title .new { color:#10B981; }
.card { width:100%; background:#1A1A2E; border:1px solid rgba(16,185,129,0.45); border-left:4px solid #10B981; border-radius:12px; padding:36px 32px; text-align:left; margin-bottom:30px; font-size:36px; font-weight:700; line-height:1.5; }
.card em { color:#10B981; font-style:normal; font-weight:800; }
.steps { width:100%; display:flex; flex-direction:column; gap:16px; }
.step { background:#1A1A2E; border:1px solid rgba(139,92,246,0.3); border-radius:10px; padding:22px 26px; text-align:left; font-size:30px; color:#B0B0CC; }
.step em { color:#F59E0B; font-style:normal; font-weight:700; }
</style></head><body><div class="slide">
<div class="glow"></div>
<div class="head">// 一句话总结</div>
<div class="title"><span class="old">「我们造出来了」</span>不再是护城河<br>产品是<span class="old">一个周末</span>的活儿</div>
<div class="card">唯一造不出、抄不走的，是对手 Agent<br><em>打不到分的那份 eval</em></div>
<div class="steps">
<div class="step">① <em>先蒙住答案</em></div>
<div class="step">② 给每条约束配一把<em>能测量的尺</em></div>
<div class="step">③ 把每条廉价捷径<em>一条条围死</em></div>
</div>
</div></body></html>
