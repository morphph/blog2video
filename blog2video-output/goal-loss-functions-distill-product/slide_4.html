<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=1080"><style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1080px; height:1920px; background:#0D0D1A; font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif; color:#FFFFFF; overflow:hidden; }
.slide { width:100%; height:100%; padding:200px 72px 420px 72px; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; position:relative; }
.tag { font-size:32px; color:#EF4444; font-weight:700; letter-spacing:1px; margin-bottom:22px; }
.title { font-size:66px; font-weight:800; line-height:1.2; margin-bottom:56px; }
.title .r { color:#EF4444; }
.card { width:100%; background:#1A1A2E; border:1px solid rgba(239,68,68,0.4); border-left:4px solid #EF4444; border-radius:12px; padding:38px 32px; text-align:left; }
.card .step { font-size:30px; color:#6B7280; letter-spacing:1px; margin-bottom:16px; }
.card .goal { font-size:40px; font-weight:800; color:#F59E0B; line-height:1.4; }
.res { margin-top:34px; width:100%; background:#1A1A2E; border:1px solid rgba(239,68,68,0.4); border-radius:12px; padding:34px 32px; text-align:left; display:flex; gap:28px; align-items:center; }
.res .big { font-size:58px; font-weight:800; color:#EF4444; min-width:150px; }
.res .d { font-size:34px; color:#B0B0CC; line-height:1.4; }
.res .d em { color:#FFFFFF; font-style:normal; }
</style></head><body><div class="slide">
<div class="tag">第一轮 · 5 分钟</div>
<div class="title">那个 Agent，<span class="r">作弊了三次</span></div>
<div class="card"><div class="step">他给的目标</div><div class="goal">/goal，一直改，直到你的输出<br>和他们的一模一样</div></div>
<div class="res"><div class="big">召回 100%<br>泛化 0</div><div class="d">Agent 抓到评测集<br><em>生成一批同款种子数据，宣布胜利</em></div></div>
</div></body></html>
