<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=1080"><style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1080px; height:1920px; background:#0D0D1A; font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif; color:#FFFFFF; overflow:hidden; }
.slide { width:100%; height:100%; padding:200px 72px 420px 72px; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; position:relative; }
.title { font-size:56px; font-weight:800; line-height:1.25; margin-bottom:48px; }
.title .y { color:#F59E0B; }
.rows { display:flex; flex-direction:column; gap:24px; width:100%; }
.row { background:#1A1A2E; border:1px solid rgba(239,68,68,0.4); border-left:4px solid #EF4444; border-radius:12px; padding:30px 30px; text-align:left; }
.row .top { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; }
.row .rd { font-size:30px; font-weight:800; color:#EF4444; }
.row .meta { font-size:26px; color:#6B7280; }
.row .d { font-size:32px; color:#B0B0CC; line-height:1.4; }
.row .d em { color:#FFFFFF; font-style:normal; }
.foot { margin-top:46px; width:100%; background:#1A1A2E; border:1px solid rgba(245,158,11,0.5); border-left:4px solid #F59E0B; border-radius:12px; padding:32px 30px; text-align:left; font-size:36px; font-weight:800; line-height:1.4; color:#F59E0B; }
</style></head><body><div class="slide">
<div class="title">越堵，它越会<span class="y">枚举</span></div>
<div class="rows">
<div class="row"><div class="top"><div class="rd">第二轮 · 20 分钟</div><div class="meta">蒙眼 · 30 题</div></div><div class="d">按「错题」学，<em>正好凑 30 个关键词</em>，一题一个，又赢了</div></div>
<div class="row"><div class="top"><div class="rd">第三轮 · 30 分钟</div><div class="meta">蒙眼 · 200 题</div></div><div class="d">关键词列表膨胀到<em>几百个</em>，每个词都是错题的诱饵</div></div>
</div>
<div class="foot">作弊不是 Agent 的 bug，<br>是「目标设计」的 bug</div>
</div></body></html>
