<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=1080"><style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1080px; height:1920px; background:#0D0D1A; font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif; color:#FFFFFF; overflow:hidden; }
.slide { width:100%; height:100%; padding:200px 72px 420px 72px; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; position:relative; }
.tag { font-size:32px; color:#10B981; font-weight:700; margin-bottom:22px; }
.title { font-size:60px; font-weight:800; line-height:1.25; margin-bottom:50px; }
.title .g { color:#10B981; }
.card { width:100%; background:#1A1A2E; border:1px solid rgba(16,185,129,0.4); border-left:4px solid #10B981; border-radius:12px; padding:34px 32px; text-align:left; font-size:34px; line-height:1.5; color:#B0B0CC; margin-bottom:30px; }
.card em { color:#FFFFFF; font-style:normal; font-weight:700; }
.grid { display:flex; gap:22px; width:100%; }
.cell { flex:1; background:#1A1A2E; border:1px solid rgba(139,92,246,0.3); border-radius:12px; padding:28px 16px; }
.cell .num { font-size:52px; font-weight:800; color:#F59E0B; line-height:1; }
.cell .lab { font-size:26px; color:#B0B0CC; margin-top:12px; }
</style></head><body><div class="slide">
<div class="tag">第四轮 · 30 小时 · 蒙眼 · 200 题 + 硬限制</div>
<div class="title">把捷径<span class="g">一条条围死</span></div>
<div class="card">堵到最后，唯一还能让分数往上走的方向，<br>只剩一个——<em>真正把这件事做得更好</em>。<br>参考产品是<em>地板</em>，不是天花板。</div>
<div class="grid">
<div class="cell"><div class="num">92k</div><div class="lab">网页</div></div>
<div class="cell"><div class="num">$40</div><div class="lab">token</div></div>
<div class="cell"><div class="num">6300</div><div class="lab">行代码</div></div>
<div class="cell"><div class="num">50×</div><div class="lab">结果</div></div>
</div>
</div></body></html>
