<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=1080"><style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1080px; height:1920px; background:#0D0D1A; font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif; color:#FFFFFF; overflow:hidden; }
.slide { width:100%; height:100%; padding:200px 72px 420px 72px; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; position:relative; }
.head { font-size:32px; color:#8B5CF6; font-weight:700; margin-bottom:40px; letter-spacing:1px; }
.cmp { display:flex; gap:24px; width:100%; margin-bottom:36px; }
.col { flex:1; background:#1A1A2E; border-radius:12px; padding:34px 26px; text-align:left; }
.col.a { border:1px solid rgba(239,68,68,0.4); border-top:4px solid #EF4444; }
.col.b { border:1px solid rgba(16,185,129,0.4); border-top:4px solid #10B981; }
.col .t { font-size:34px; font-weight:800; margin-bottom:16px; }
.col.a .t { color:#EF4444; }
.col.b .t { color:#10B981; }
.col .d { font-size:29px; color:#B0B0CC; line-height:1.5; }
.foot { width:100%; background:#1A1A2E; border:1px solid rgba(245,158,11,0.5); border-left:4px solid #F59E0B; border-radius:12px; padding:32px 30px; text-align:left; font-size:34px; font-weight:700; line-height:1.45; color:#FFFFFF; }
.foot em { color:#F59E0B; font-style:normal; font-weight:800; }
</style></head><body><div class="slide">
<div class="head">// Loss Function Development 特别在哪</div>
<div class="cmp">
<div class="col a"><div class="t">测试套件</div><div class="d">有限的，<br>跑绿那一刻就结束了</div></div>
<div class="col b"><div class="t">评测集</div><div class="d">1000 条卡在 95%，<br>一个永远够不到底的目标</div></div>
</div>
<div class="foot">Agent 会做几百个你看不见的决定，<br>目标不是你写的，它就挑<em>最省事的那个</em></div>
</div></body></html>
