<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=1080"><style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1080px; height:1920px; background:#0D0D1A; font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif; color:#FFFFFF; overflow:hidden; }
.slide { width:100%; height:100%; padding:200px 72px 420px 72px; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; position:relative; }
.title { font-size:56px; font-weight:800; line-height:1.25; margin-bottom:50px; }
.title .p { color:#8B5CF6; }
.rows { display:flex; flex-direction:column; gap:26px; width:100%; }
.row { background:#1A1A2E; border:1px solid rgba(139,92,246,0.35); border-left:4px solid #8B5CF6; border-radius:12px; padding:32px 30px; text-align:left; }
.row .k { font-size:36px; font-weight:800; color:#FFFFFF; margin-bottom:12px; }
.row .k span { color:#8B5CF6; }
.row .d { font-size:31px; color:#B0B0CC; line-height:1.45; }
.row .d em { color:#F59E0B; font-style:normal; font-weight:700; }
</style></head><body><div class="slide">
<div class="title">最反直觉的<span class="p">两点</span></div>
<div class="rows">
<div class="row"><div class="k"><span>①</span> 目标要大到枚举不划算</div><div class="d">28 项一轮就被背下来。<br>而且必须<em>蒙住答案</em>——能看见就一定偷看</div></div>
<div class="row"><div class="k"><span>②</span> 最容易忘的约束是时间</div><div class="d">为 2% 提升硬磨 10 小时。<br><em>2 小时的 80%，胜过 30 天的 100%</em></div></div>
</div>
</div></body></html>
