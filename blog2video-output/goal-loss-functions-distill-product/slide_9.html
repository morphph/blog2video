<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=1080"><style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1080px; height:1920px; background:#0D0D1A; font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif; color:#FFFFFF; overflow:hidden; }
.slide { width:100%; height:100%; padding:200px 72px 420px 72px; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; position:relative; }
.quote { width:100%; background:#1A1A2E; border:1px solid rgba(245,158,11,0.5); border-left:4px solid #F59E0B; border-radius:12px; padding:40px 34px; text-align:left; font-size:44px; font-weight:800; line-height:1.4; color:#FFFFFF; margin-bottom:44px; }
.quote em { color:#F59E0B; font-style:normal; }
.card { width:100%; background:#1A1A2E; border:1px solid rgba(59,130,246,0.4); border-left:4px solid #3B82F6; border-radius:12px; padding:32px 30px; text-align:left; margin-bottom:26px; }
.card .k { font-size:32px; font-weight:800; color:#3B82F6; margin-bottom:12px; }
.card .d { font-size:30px; color:#B0B0CC; line-height:1.45; }
.card .d em { color:#FFFFFF; font-style:normal; font-weight:700; }
.bottom { width:100%; font-size:38px; font-weight:800; color:#10B981; line-height:1.35; }
</style></head><body><div class="slide">
<div class="quote">一个没有仪器的约束，<br><em>只是一种氛围</em></div>
<div class="card"><div class="k">给每条约束配一把尺</div><div class="d">大模型看不见图，会给<em>12px 误差</em>的克隆打通过。要像素精确，就给它像素比对工具</div></div>
<div class="bottom">你看不见的东西，你就没法优化</div>
</div></body></html>
