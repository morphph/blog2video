<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 100px 72px 400px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    /* 多层背景光晕 */
    .bg-glow-1 {
      position: absolute;
      top: 38%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 900px;
      height: 900px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.18) 0%, rgba(13, 13, 26, 0) 65%);
      pointer-events: none;
    }
    .bg-glow-2 {
      position: absolute;
      top: 30%;
      left: 30%;
      transform: translate(-50%, -50%);
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.10) 0%, rgba(13, 13, 26, 0) 70%);
      pointer-events: none;
    }
    .bg-glow-3 {
      position: absolute;
      top: 50%;
      left: 70%;
      transform: translate(-50%, -50%);
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.07) 0%, rgba(13, 13, 26, 0) 70%);
      pointer-events: none;
    }
    /* 装饰线条 */
    .deco-line {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
    }
    .deco-line::before {
      content: '';
      position: absolute;
      top: 15%;
      left: -100px;
      width: 1400px;
      height: 1px;
      background: linear-gradient(90deg, transparent 0%, rgba(139, 92, 246, 0.15) 30%, rgba(139, 92, 246, 0.15) 70%, transparent 100%);
    }
    .deco-line::after {
      content: '';
      position: absolute;
      top: 78%;
      left: -100px;
      width: 1400px;
      height: 1px;
      background: linear-gradient(90deg, transparent 0%, rgba(139, 92, 246, 0.1) 30%, rgba(139, 92, 246, 0.1) 70%, transparent 100%);
    }

    .content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    .series-label {
      font-size: 30px;
      color: #8B5CF6;
      letter-spacing: 4px;
      font-weight: 500;
      margin-bottom: 60px;
    }

    .main-title-wrap {
      margin-bottom: 64px;
    }
    .main-title {
      font-size: 92px;
      font-weight: 900;
      line-height: 1.15;
      letter-spacing: -1px;
    }
    .highlight-red { color: #EF4444; }
    .highlight-yellow { color: #F59E0B; }

    .source-tag {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #1A1A30;
      border: 1px solid rgba(107, 107, 128, 0.3);
      border-radius: 100px;
      padding: 12px 28px;
    }
    .source-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #6B6B80;
      flex-shrink: 0;
    }
    .source-text {
      font-size: 20px;
      color: #6B6B80;
      font-weight: 500;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>
    <div class="bg-glow-3"></div>
    <div class="deco-line"></div>

    <div class="content">
      <div class="series-label">精读AI · Agent Skill</div>

      <div class="main-title-wrap">
        <div class="main-title">
          把规范<span class="highlight-red">全塞</span><br>
          进提示词<br>
          Context <span class="highlight-yellow">撑爆</span>了
        </div>
      </div>

      <div class="source-tag">
        <div class="source-dot"></div>
        <div class="source-text">Google Cloud Tech @GoogleCloudTech</div>
      </div>
    </div>
  </div>
</body>
</html>
