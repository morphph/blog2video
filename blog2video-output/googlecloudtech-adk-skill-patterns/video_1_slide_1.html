<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .bg-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -60%);
      width: 800px;
      height: 800px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.12) 0%, rgba(13, 13, 26, 0) 70%);
      pointer-events: none;
    }
    .series-label {
      font-size: 28px;
      color: #8B5CF6;
      letter-spacing: 3px;
      margin-bottom: 48px;
      font-weight: 500;
    }
    .main-title {
      font-size: 72px;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 56px;
      max-width: 900px;
    }
    .highlight-red {
      color: #EF4444;
    }
    .highlight-yellow {
      color: #F59E0B;
    }
    .pain-cards {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-top: 16px;
    }
    .pain-card {
      background: #1A1A2E;
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-left: 4px solid #EF4444;
      border-radius: 12px;
      padding: 24px 28px;
      text-align: left;
    }
    .pain-card .card-label {
      font-size: 13px;
      color: #EF4444;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 10px;
      font-weight: 600;
    }
    .pain-card .card-text {
      font-size: 26px;
      font-weight: 600;
      color: #FFFFFF;
      line-height: 1.4;
    }
    .pain-card .card-sub {
      font-size: 20px;
      color: #B0B0CC;
      margin-top: 8px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="bg-glow"></div>
    <div class="series-label">精读AI · Agent Skill</div>
    <div class="main-title">
      把规范<span class="highlight-red">全塞进</span>提示词<br>
      Context Window<br>
      <span class="highlight-yellow">迟早撑爆</span>
    </div>
    <div class="pain-cards">
      <div class="pain-card">
        <div class="card-label">真实痛点</div>
        <div class="card-text">一碰到具体项目约定，Agent 立刻跑偏</div>
        <div class="card-sub">越塞越多，越多越乱——问题不是长度，是架构</div>
      </div>
      <div class="pain-card">
        <div class="card-label">今天解决</div>
        <div class="card-text">Agent 怎么「装」领域知识</div>
        <div class="card-sub">按需加载，用时再拿，不占 Context</div>
      </div>
    </div>
  </div>
</body>
</html>
