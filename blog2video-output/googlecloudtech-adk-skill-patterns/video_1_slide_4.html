<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .bg-glow {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 700px;
      height: 700px;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.08) 0%, rgba(13, 13, 26, 0) 70%);
      pointer-events: none;
    }
    .section-label {
      font-size: 14px;
      color: #F59E0B;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 20px;
      font-weight: 600;
    }
    .main-title {
      font-size: 52px;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 44px;
    }
    .highlight-yellow { color: #F59E0B; }

    .signal-cards {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .signal-card {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 24px 28px;
      display: flex;
      align-items: flex-start;
      gap: 18px;
      text-align: left;
    }
    .signal-icon {
      flex-shrink: 0;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    .icon-blue { background: rgba(59, 130, 246, 0.15); border: 2px solid rgba(59, 130, 246, 0.4); }
    .icon-purple { background: rgba(139, 92, 246, 0.15); border: 2px solid rgba(139, 92, 246, 0.4); }
    .icon-green { background: rgba(16, 185, 129, 0.15); border: 2px solid rgba(16, 185, 129, 0.4); }

    .signal-content .question {
      font-size: 20px;
      color: #B0B0CC;
      line-height: 1.5;
      margin-bottom: 8px;
    }
    .signal-content .answer {
      font-size: 22px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .tag {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 16px;
      font-weight: 700;
    }
    .tag-blue { background: rgba(59, 130, 246, 0.2); color: #3B82F6; }
    .tag-purple { background: rgba(139, 92, 246, 0.2); color: #8B5CF6; }
    .tag-green { background: rgba(16, 185, 129, 0.2); color: #10B981; }

    .bottom-note {
      width: 100%;
      margin-top: 28px;
      padding: 20px 24px;
      background: rgba(245, 158, 11, 0.08);
      border: 1px solid rgba(245, 158, 11, 0.25);
      border-radius: 12px;
      text-align: center;
    }
    .bottom-note .note-text {
      font-size: 22px;
      font-weight: 600;
      color: #F59E0B;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="bg-glow"></div>

    <div class="section-label">决策信号</div>
    <div class="main-title">你的场景<br>用<span class="highlight-yellow">哪种模式</span>？</div>

    <div class="signal-cards">
      <div class="signal-card">
        <div class="signal-icon icon-blue">📋</div>
        <div class="signal-content">
          <div class="question">经常需要 Agent 遵守特定框架或团队规范，但每次都要重复写进提示词？</div>
          <div class="answer">→ <span class="tag tag-blue">Tool Wrapper</span> 的信号</div>
        </div>
      </div>

      <div class="signal-card">
        <div class="signal-icon icon-purple">📄</div>
        <div class="signal-content">
          <div class="question">Agent 需要产出结构化内容，但格式总是不一致？</div>
          <div class="answer">→ <span class="tag tag-purple">Generator</span> 的信号</div>
        </div>
      </div>

      <div class="signal-card">
        <div class="signal-icon icon-green">✅</div>
        <div class="signal-content">
          <div class="question">需要对某类产出物进行重复性标准评审，评审标准还可能因场景而变？</div>
          <div class="answer">→ <span class="tag tag-green">Reviewer</span> 的信号</div>
        </div>
      </div>
    </div>

    <div class="bottom-note">
      <div class="note-text">三种模式覆盖日常 Agent 开发 90% 场景</div>
    </div>
  </div>
</body>
</html>
