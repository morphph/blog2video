<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .bg-glow {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 800px;
      height: 800px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.08) 0%, rgba(139, 92, 246, 0.06) 40%, rgba(13, 13, 26, 0) 70%);
      pointer-events: none;
    }
    .section-label {
      font-size: 14px;
      color: #10B981;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 20px;
      font-weight: 600;
    }
    .main-title {
      font-size: 56px;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 40px;
    }
    .highlight-purple { color: #8B5CF6; }
    .highlight-green { color: #10B981; }

    .summary-points {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 28px;
    }
    .summary-point {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      text-align: left;
    }
    .point-num {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(139, 92, 246, 0.2);
      border: 2px solid #8B5CF6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 800;
      color: #8B5CF6;
    }
    .point-text {
      font-size: 21px;
      font-weight: 600;
      color: #FFFFFF;
      line-height: 1.45;
    }
    .point-text .sub {
      font-size: 17px;
      font-weight: 400;
      color: #B0B0CC;
      display: block;
      margin-top: 4px;
    }

    .action-card {
      width: 100%;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.1) 0%, rgba(139, 92, 246, 0.08) 100%);
      border: 1px solid rgba(16, 185, 129, 0.35);
      border-left: 4px solid #10B981;
      border-radius: 12px;
      padding: 24px 28px;
      text-align: left;
    }
    .action-label {
      font-size: 13px;
      color: #10B981;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .action-title {
      font-size: 24px;
      font-weight: 700;
      color: #FFFFFF;
      margin-bottom: 10px;
    }
    .action-steps {
      font-size: 19px;
      color: #B0B0CC;
      line-height: 1.6;
    }
    .action-steps .step {
      display: block;
      padding-left: 4px;
    }
    .code-inline {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      background: rgba(255,255,255,0.08);
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 17px;
      color: #A78BFA;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="bg-glow"></div>

    <div class="section-label">总结</div>
    <div class="main-title">
      Skill = <span class="highlight-purple">知识包</span><br>
      不是工具
    </div>

    <div class="summary-points">
      <div class="summary-point">
        <div class="point-num">L1</div>
        <div class="point-text">
          元数据——永远可见
          <span class="sub">YAML 文件头，书名目录，始终在 Context 里</span>
        </div>
      </div>
      <div class="summary-point">
        <div class="point-num">L2</div>
        <div class="point-text">
          指令——按需加载
          <span class="sub">SKILL.md 正文，需要时才进入 Context</span>
        </div>
      </div>
      <div class="summary-point">
        <div class="point-num">L3</div>
        <div class="point-text">
          资源文件——用时拉取
          <span class="sub">references/ 和 assets/，用完就放回去</span>
        </div>
      </div>
    </div>

    <div class="action-card">
      <div class="action-label">立刻可做的一件事</div>
      <div class="action-title">创建你的第一个 Tool Wrapper Skill</div>
      <div class="action-steps">
        <span class="step">① 新建 <span class="code-inline">SKILL.md</span> 写触发关键词</span>
        <span class="step">② 把团队规范放进 <span class="code-inline">references/conventions.md</span></span>
        <span class="step">③ 让 Agent 随时按需加载——比改 100 遍系统提示词有效</span>
      </div>
    </div>
  </div>
</body>
</html>
