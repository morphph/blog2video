<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 100px 72px 400px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }

    /* 多层背景光晕 */
    .bg-glow-1 {
      position: absolute;
      top: 38%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 1000px;
      height: 1000px;
      background: radial-gradient(ellipse at center,
        rgba(139, 92, 246, 0.18) 0%,
        rgba(59, 130, 246, 0.08) 35%,
        transparent 65%);
      pointer-events: none;
    }

    .bg-glow-2 {
      position: absolute;
      top: 25%;
      left: 20%;
      width: 500px;
      height: 500px;
      background: radial-gradient(ellipse at center,
        rgba(239, 68, 68, 0.08) 0%,
        transparent 60%);
      pointer-events: none;
    }

    /* 装饰粒子 */
    .deco-dot {
      position: absolute;
      border-radius: 50%;
    }

    .dot-1 {
      width: 6px; height: 6px;
      background: rgba(139, 92, 246, 0.5);
      top: 18%; left: 15%;
    }
    .dot-2 {
      width: 4px; height: 4px;
      background: rgba(59, 130, 246, 0.4);
      top: 22%; right: 18%;
    }
    .dot-3 {
      width: 8px; height: 8px;
      background: rgba(16, 185, 129, 0.3);
      top: 55%; left: 8%;
    }
    .dot-4 {
      width: 5px; height: 5px;
      background: rgba(245, 158, 11, 0.4);
      top: 48%; right: 12%;
    }

    /* 装饰线条 */
    .deco-line {
      position: absolute;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(139, 92, 246, 0.3), transparent);
    }

    .line-top {
      width: 800px;
      top: 180px;
      left: 50%;
      transform: translateX(-50%);
    }

    .content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 56px;
      width: 100%;
    }

    /* 系列标签 */
    .series-label {
      font-size: 28px;
      color: #8B5CF6;
      letter-spacing: 4px;
      font-weight: 500;
    }

    /* 主标题块 */
    .title-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    .main-title {
      font-size: 96px;
      font-weight: 900;
      line-height: 1.15;
      color: #FFFFFF;
      letter-spacing: -1px;
    }

    .main-title .line-1 { display: block; }
    .main-title .line-2 { display: block; }
    .main-title .line-3 { display: block; }

    .main-title .hl-red { color: #EF4444; }
    .main-title .hl-yellow { color: #F59E0B; }

    /* 来源标签 */
    .source-tag {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #1A1A30;
      border: 1px solid rgba(107, 107, 128, 0.3);
      border-radius: 50px;
      padding: 14px 32px;
    }

    .source-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #6B7280;
    }

    .source-text {
      font-size: 20px;
      color: #6B6B80;
      font-weight: 400;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>
    <div class="deco-dot dot-1"></div>
    <div class="deco-dot dot-2"></div>
    <div class="deco-dot dot-3"></div>
    <div class="deco-dot dot-4"></div>
    <div class="deco-line line-top"></div>

    <div class="content">

      <div class="series-label">精读AI · Agent Skill</div>

      <div class="title-block">
        <div class="main-title">
          <span class="line-1">现在<span class="hl-red">谁</span>在</span>
          <span class="line-2">指挥<span class="hl-yellow">谁</span>？</span>
        </div>
      </div>

      <div class="source-tag">
        <div class="source-dot"></div>
        <div class="source-text">Google Cloud Tech @GoogleCloudTech</div>
      </div>

    </div>
  </div>
</body>
</html>
