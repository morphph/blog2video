<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }

    /* 背景装饰光晕 */
    .bg-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -60%);
      width: 900px;
      height: 900px;
      background: radial-gradient(ellipse at center, rgba(139, 92, 246, 0.12) 0%, rgba(59, 130, 246, 0.06) 40%, transparent 70%);
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 48px;
      width: 100%;
    }

    /* 系列标签 */
    .series-label {
      font-size: 26px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 500;
    }

    /* 主标题区 */
    .title-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .main-title {
      font-size: 72px;
      font-weight: 900;
      line-height: 1.2;
      color: #FFFFFF;
    }

    .main-title .highlight-red {
      color: #EF4444;
    }

    .main-title .highlight-yellow {
      color: #F59E0B;
    }

    /* 副标题 */
    .subtitle {
      font-size: 32px;
      color: #B0B0CC;
      font-weight: 400;
      line-height: 1.5;
      max-width: 800px;
    }

    /* 悬念卡片 */
    .teaser-card {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-left: 4px solid #EF4444;
      border-radius: 12px;
      padding: 32px 40px;
      text-align: left;
    }

    .teaser-label {
      font-size: 13px;
      color: #EF4444;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 16px;
      font-weight: 600;
    }

    .teaser-text {
      font-size: 28px;
      color: #FFFFFF;
      line-height: 1.6;
      font-weight: 400;
    }

    .teaser-text em {
      font-style: normal;
      color: #F59E0B;
      font-weight: 600;
    }

    /* 本期预告 */
    .preview-row {
      display: flex;
      gap: 16px;
      width: 100%;
    }

    .preview-chip {
      flex: 1;
      background: rgba(139, 92, 246, 0.12);
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-radius: 10px;
      padding: 20px 16px;
      text-align: center;
    }

    .preview-chip .chip-icon {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .preview-chip .chip-text {
      font-size: 22px;
      color: #B0B0CC;
      font-weight: 500;
      line-height: 1.4;
    }

    .preview-chip .chip-text strong {
      color: #8B5CF6;
      display: block;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="bg-glow"></div>
    <div class="content">

      <div class="series-label">精读AI · Agent Skill</div>

      <div class="title-block">
        <div class="main-title">
          现在<span class="highlight-red">谁</span>在<br>指挥<span class="highlight-yellow">谁</span>？
        </div>
        <div class="subtitle">Agent反客为主来问你<br>这5种模式选哪个？</div>
      </div>

      <div class="teaser-card">
        <div class="teaser-label">你遇到过这个场景吗</div>
        <div class="teaser-text">
          你给Agent发了需求，<br>
          它礼貌地回复：请先告诉我<br>
          <em>你要解决什么问题、用户是谁、规模有多大……</em>
        </div>
      </div>

      <div class="preview-row">
        <div class="preview-chip">
          <div class="chip-icon">🔄</div>
          <div class="chip-text"><strong>Inversion</strong>高阶反转模式</div>
        </div>
        <div class="preview-chip">
          <div class="chip-icon">🏭</div>
          <div class="chip-text"><strong>Pipeline</strong>流水线+Gate</div>
        </div>
        <div class="preview-chip">
          <div class="chip-icon">🌲</div>
          <div class="chip-text"><strong>决策树</strong>5秒选对模式</div>
        </div>
      </div>

    </div>
  </div>
</body>
</html>
