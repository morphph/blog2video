<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }

    .bg-glow {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 800px;
      height: 800px;
      background: radial-gradient(ellipse at center, rgba(59, 130, 246, 0.08) 0%, transparent 65%);
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 36px;
      width: 100%;
    }

    /* 顶部标签 */
    .section-label {
      font-size: 14px;
      color: #8B5CF6;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 600;
    }

    /* 主标题 */
    .main-title {
      font-size: 52px;
      font-weight: 800;
      line-height: 1.25;
      color: #FFFFFF;
    }

    /* 前提说明 */
    .premise-card {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-left: 4px solid #8B5CF6;
      border-radius: 12px;
      padding: 28px 32px;
      text-align: left;
    }

    .premise-label {
      font-size: 13px;
      color: #8B5CF6;
      letter-spacing: 2px;
      font-weight: 600;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .premise-text {
      font-size: 26px;
      color: #B0B0CC;
      line-height: 1.6;
    }

    .premise-text strong {
      color: #FFFFFF;
    }

    /* 两类问题 */
    .problems-title {
      font-size: 24px;
      color: #6B7280;
      letter-spacing: 1px;
    }

    .problem-cards {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
    }

    .problem-card {
      background: #1A1A2E;
      border: 1px solid rgba(239, 68, 68, 0.25);
      border-left: 4px solid #EF4444;
      border-radius: 12px;
      padding: 26px 32px;
      text-align: left;
      display: flex;
      align-items: flex-start;
      gap: 20px;
    }

    .problem-number {
      font-size: 40px;
      font-weight: 900;
      color: #EF4444;
      opacity: 0.4;
      line-height: 1;
      flex-shrink: 0;
      width: 48px;
    }

    .problem-body {
      flex: 1;
    }

    .problem-type {
      font-size: 20px;
      color: #EF4444;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .problem-desc {
      font-size: 24px;
      color: #B0B0CC;
      line-height: 1.5;
    }

    .problem-desc em {
      font-style: normal;
      color: #FFFFFF;
    }

    /* 解法引出 */
    .solution-card {
      width: 100%;
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.1), rgba(59, 130, 246, 0.1));
      border: 1px solid rgba(139, 92, 246, 0.35);
      border-radius: 12px;
      padding: 28px 32px;
      text-align: center;
    }

    .solution-label {
      font-size: 18px;
      color: #6B7280;
      margin-bottom: 12px;
    }

    .solution-names {
      font-size: 38px;
      font-weight: 800;
      color: #FFFFFF;
    }

    .solution-names .name-inv {
      color: #8B5CF6;
    }

    .solution-names .name-pip {
      color: #3B82F6;
    }

    .solution-names .divider {
      color: #6B7280;
      font-weight: 300;
      margin: 0 8px;
    }

    .solution-sub {
      font-size: 20px;
      color: #B0B0CC;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="bg-glow"></div>
    <div class="content">

      <div class="section-label">为什么前3种模式不够用</div>

      <div class="main-title">有两类任务<br>这套逻辑撑不住</div>

      <div class="premise-card">
        <div class="premise-label">前提：前3种模式</div>
        <div class="premise-text">
          Tool Wrapper、Generator、Reviewer<br>
          共同前提：<strong>Agent知道要做什么</strong><br>
          「你说，Agent做」
        </div>
      </div>

      <div class="problems-title">但有两类任务例外 ↓</div>

      <div class="problem-cards">
        <div class="problem-card">
          <div class="problem-number">1</div>
          <div class="problem-body">
            <div class="problem-type">信息不完整</div>
            <div class="problem-desc">关键信息只有<em>你</em>知道<br>Agent猜不到，<em>乱猜才是真麻烦</em></div>
          </div>
        </div>
        <div class="problem-card">
          <div class="problem-body">
            <div class="problem-number">2</div>
          </div>
          <div class="problem-body">
            <div class="problem-type">流程太复杂</div>
            <div class="problem-desc">不等你确认就跑下一步<br>出了错再回头——<em>代价太大</em></div>
          </div>
        </div>
      </div>

      <div class="solution-card">
        <div class="solution-label">Google ADK 的两种解法</div>
        <div class="solution-names">
          <span class="name-inv">Inversion</span>
          <span class="divider">vs</span>
          <span class="name-pip">Pipeline</span>
        </div>
        <div class="solution-sub">截然不同的两条路</div>
      </div>

    </div>
  </div>
</body>
</html>
