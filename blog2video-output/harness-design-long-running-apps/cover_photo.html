<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 100px 72px 400px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .slide::before {
      content: '';
      position: absolute;
      top: 35%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 700px;
      height: 700px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.12) 0%, transparent 70%);
      pointer-events: none;
    }
    .series-tag {
      font-size: 30px;
      color: #8B5CF6;
      letter-spacing: 3px;
      margin-bottom: 56px;
      font-weight: 500;
    }
    .main-title {
      font-size: 92px;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 56px;
    }
    .highlight-red {
      color: #EF4444;
    }
    .highlight-yellow {
      color: #F59E0B;
    }
    .source-tag {
      display: inline-block;
      background: #1A1A30;
      border-radius: 100px;
      padding: 14px 32px;
      font-size: 22px;
      color: #6B6B80;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="series-tag">精读AI · AI Agent架构设计</div>
    <div class="main-title">
      AI<span class="highlight-red">永远夸自己</span>？<br>
      用<span class="highlight-yellow">GAN思路</span><br>
      破局
    </div>
    <div class="source-tag">Anthropic · Harness Design for Long-Running Apps</div>
  </div>
</body>
</html>
