<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .title {
      font-size: 52px;
      font-weight: 800;
      margin-bottom: 48px;
      line-height: 1.3;
    }
    .title .accent {
      color: #8B5CF6;
    }
    .concept-card {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-left: 4px solid #8B5CF6;
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      margin-bottom: 36px;
      text-align: left;
    }
    .concept-label {
      font-size: 22px;
      color: #8B5CF6;
      letter-spacing: 2px;
      margin-bottom: 16px;
      font-weight: 600;
    }
    .concept-text {
      font-size: 30px;
      line-height: 1.6;
      color: #B0B0CC;
    }
    .concept-text em {
      color: #FFFFFF;
      font-style: normal;
      font-weight: 700;
    }
    .analogy-section {
      width: 100%;
      margin-bottom: 36px;
    }
    .analogy-card {
      background: #1A1A2E;
      border: 1px solid rgba(239, 68, 68, 0.2);
      border-left: 4px solid #EF4444;
      border-radius: 12px;
      padding: 28px 32px;
      text-align: left;
      margin-bottom: 16px;
    }
    .analogy-text {
      font-size: 28px;
      line-height: 1.5;
      color: #B0B0CC;
    }
    .analogy-text .red {
      color: #EF4444;
      font-weight: 700;
    }
    .gan-section {
      width: 100%;
      display: flex;
      gap: 20px;
    }
    .gan-card {
      flex: 1;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 28px 20px;
      text-align: center;
    }
    .gan-card.generator {
      border-top: 4px solid #3B82F6;
    }
    .gan-card.evaluator {
      border-top: 4px solid #10B981;
    }
    .gan-icon {
      font-size: 44px;
      margin-bottom: 12px;
    }
    .gan-label {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .gan-card.generator .gan-label {
      color: #3B82F6;
    }
    .gan-card.evaluator .gan-label {
      color: #10B981;
    }
    .gan-desc {
      font-size: 22px;
      color: #6B7280;
      line-height: 1.4;
    }
    .vs-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 800;
      color: #F59E0B;
      flex-shrink: 0;
      width: 56px;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="title">借鉴 <span class="accent">GAN</span> 的双Agent架构</div>

    <div class="concept-card">
      <div class="concept-label">核心矛盾</div>
      <div class="concept-text">生成和评估在认知上<em>天然冲突</em><br>一个Agent无法一边创作，一边严格挑刺</div>
    </div>

    <div class="analogy-section">
      <div class="analogy-card">
        <div class="analogy-text">🎓 学生<span class="red">自己给自己打分</span>，永远手下留情<br>换一个严格考官，分数才真实</div>
      </div>
    </div>

    <div class="gan-section">
      <div class="gan-card generator">
        <div class="gan-icon">🎨</div>
        <div class="gan-label">生成 Agent</div>
        <div class="gan-desc">专注创作<br>产出作品</div>
      </div>
      <div class="vs-badge">⚡</div>
      <div class="gan-card evaluator">
        <div class="gan-icon">🔍</div>
        <div class="gan-label">评估 Agent</div>
        <div class="gan-desc">独立评审<br>严格打分</div>
      </div>
    </div>
  </div>
</body>
</html>
