<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .title {
      font-size: 48px;
      font-weight: 800;
      margin-bottom: 44px;
      line-height: 1.3;
    }
    .title .accent {
      color: #10B981;
    }
    .dimensions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      width: 100%;
      margin-bottom: 36px;
    }
    .dim-card {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 28px 24px;
      text-align: center;
    }
    .dim-card:nth-child(1) { border-top: 4px solid #8B5CF6; }
    .dim-card:nth-child(2) { border-top: 4px solid #3B82F6; }
    .dim-card:nth-child(3) { border-top: 4px solid #F59E0B; }
    .dim-card:nth-child(4) { border-top: 4px solid #10B981; }
    .dim-icon {
      font-size: 40px;
      margin-bottom: 12px;
    }
    .dim-en {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }
    .dim-card:nth-child(1) .dim-en { color: #8B5CF6; }
    .dim-card:nth-child(2) .dim-en { color: #3B82F6; }
    .dim-card:nth-child(3) .dim-en { color: #F59E0B; }
    .dim-card:nth-child(4) .dim-en { color: #10B981; }
    .dim-zh {
      font-size: 24px;
      color: #B0B0CC;
      line-height: 1.4;
    }
    .method-card {
      background: #1A1A2E;
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-left: 4px solid #10B981;
      border-radius: 12px;
      padding: 28px 32px;
      width: 100%;
      text-align: left;
    }
    .method-label {
      font-size: 22px;
      color: #10B981;
      letter-spacing: 2px;
      margin-bottom: 14px;
      font-weight: 600;
    }
    .method-text {
      font-size: 28px;
      line-height: 1.6;
      color: #B0B0CC;
    }
    .method-text strong {
      color: #FFFFFF;
      font-weight: 700;
    }
    .method-text .green {
      color: #10B981;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="title">评估Agent的<span class="accent">四个维度</span></div>

    <div class="dimensions-grid">
      <div class="dim-card">
        <div class="dim-icon">🎨</div>
        <div class="dim-en">Design Quality</div>
        <div class="dim-zh">风格统一 · 氛围感</div>
      </div>
      <div class="dim-card">
        <div class="dim-icon">💡</div>
        <div class="dim-en">Originality</div>
        <div class="dim-zh">自主设计决策</div>
      </div>
      <div class="dim-card">
        <div class="dim-icon">🔧</div>
        <div class="dim-en">Craft</div>
        <div class="dim-zh">字体 · 间距 · 配色</div>
      </div>
      <div class="dim-card">
        <div class="dim-icon">✅</div>
        <div class="dim-en">Functionality</div>
        <div class="dim-zh">用户能顺畅操作</div>
      </div>
    </div>

    <div class="method-card">
      <div class="method-label">评估方式</div>
      <div class="method-text">用 <strong>Playwright</strong> 实际操作页面<br>点按钮、滚页面、填表单<br>像<span class="green">神秘访客</span>亲自体验后再评分</div>
    </div>
  </div>
</body>
</html>
