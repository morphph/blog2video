<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .title {
      font-size: 52px;
      font-weight: 800;
      margin-bottom: 48px;
      line-height: 1.3;
    }
    .title .accent {
      color: #8B5CF6;
    }
    .points {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 40px;
    }
    .point-card {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 24px 28px;
      display: flex;
      align-items: center;
      gap: 20px;
      text-align: left;
    }
    .point-num {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(139, 92, 246, 0.15);
      border: 2px solid #8B5CF6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 800;
      color: #8B5CF6;
      flex-shrink: 0;
    }
    .point-text {
      font-size: 28px;
      line-height: 1.5;
      color: #B0B0CC;
    }
    .point-text strong {
      color: #FFFFFF;
      font-weight: 700;
    }
    .point-text .purple {
      color: #8B5CF6;
      font-weight: 700;
    }
    .action-card {
      width: 100%;
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.12), rgba(59, 130, 246, 0.08));
      border: 1px solid rgba(139, 92, 246, 0.35);
      border-left: 4px solid #F59E0B;
      border-radius: 12px;
      padding: 28px 32px;
      text-align: left;
    }
    .action-label {
      font-size: 22px;
      color: #F59E0B;
      letter-spacing: 2px;
      margin-bottom: 12px;
      font-weight: 600;
    }
    .action-text {
      font-size: 28px;
      line-height: 1.6;
      color: #FFFFFF;
    }
    .action-text .yellow {
      color: #F59E0B;
      font-weight: 700;
    }
    .action-text .red {
      color: #EF4444;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="title"><span class="accent">核心要点</span>总结</div>

    <div class="points">
      <div class="point-card">
        <div class="point-num">1</div>
        <div class="point-text">AI自评<strong>天然不可靠</strong><br>这是<span class="purple">架构问题</span>，不是能力问题</div>
      </div>
      <div class="point-card">
        <div class="point-num">2</div>
        <div class="point-text">把<strong>生成</strong>和<strong>评估</strong>拆开<br>交给<span class="purple">不同的Agent</span></div>
      </div>
      <div class="point-card">
        <div class="point-num">3</div>
        <div class="point-text">评估要像<strong>真实用户</strong>一样操作<br>用具体维度打分，驱动<span class="purple">5-15轮</span>迭代</div>
      </div>
    </div>

    <div class="action-card">
      <div class="action-label">今天就做一件事</div>
      <div class="action-text">把"生成"和"评估"<span class="yellow">拆成两个独立Agent</span><br><span class="red">永远别指望</span>一个Agent能自我纠错</div>
    </div>
  </div>
</body>
</html>
