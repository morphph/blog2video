<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .title {
      font-size: 48px;
      font-weight: 800;
      margin-bottom: 40px;
    }
    .title .accent {
      color: #10B981;
    }
    .comparison-row {
      width: 100%;
      display: flex;
      gap: 20px;
      margin-bottom: 28px;
    }
    .comp-card {
      flex: 1;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 28px 20px;
      text-align: center;
    }
    .comp-card.before {
      border-top: 4px solid #6B7280;
    }
    .comp-card.after {
      border-top: 4px solid #10B981;
    }
    .comp-label {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    .comp-card.before .comp-label { color: #6B7280; }
    .comp-card.after .comp-label { color: #10B981; }
    .comp-number {
      font-size: 60px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .comp-card.before .comp-number { color: #B0B0CC; }
    .comp-card.after .comp-number { color: #10B981; }
    .comp-detail {
      font-size: 22px;
      color: #6B7280;
    }
    .cost-breakdown {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-left: 4px solid #3B82F6;
      border-radius: 12px;
      padding: 24px 28px;
      margin-bottom: 24px;
    }
    .breakdown-title {
      font-size: 24px;
      font-weight: 700;
      color: #3B82F6;
      margin-bottom: 16px;
      text-align: left;
    }
    .breakdown-items {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .breakdown-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 24px;
      color: #B0B0CC;
    }
    .breakdown-item .role {
      text-align: left;
    }
    .breakdown-item .cost {
      font-weight: 700;
      color: #FFFFFF;
    }
    .breakdown-item .time {
      color: #6B7280;
      font-size: 20px;
    }
    .insight-card {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-left: 4px solid #F59E0B;
      border-radius: 12px;
      padding: 24px 28px;
      text-align: left;
    }
    .insight-text {
      font-size: 26px;
      color: #B0B0CC;
      line-height: 1.6;
    }
    .insight-text .yellow {
      color: #F59E0B;
      font-weight: 700;
    }
    .insight-text .em {
      color: #FFFFFF;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="title">砍掉Sprint后 <span class="accent">效果如何？</span></div>
    <div class="comparison-row">
      <div class="comp-card before">
        <div class="comp-label">Sprint 制</div>
        <div class="comp-number">$200</div>
        <div class="comp-detail">6 小时</div>
      </div>
      <div class="comp-card after">
        <div class="comp-label">简化后</div>
        <div class="comp-number">$125</div>
        <div class="comp-detail">3 小时 50 分</div>
      </div>
    </div>
    <div class="cost-breakdown">
      <div class="breakdown-title">DAW 项目成本明细</div>
      <div class="breakdown-items">
        <div class="breakdown-item">
          <span class="role">Planner</span>
          <span class="time">4.7 min</span>
          <span class="cost">$0.46</span>
        </div>
        <div class="breakdown-item">
          <span class="role">Build 第一轮</span>
          <span class="time">2h 7min</span>
          <span class="cost">$71.08</span>
        </div>
        <div class="breakdown-item">
          <span class="role">QA 第一轮</span>
          <span class="time">8.8 min</span>
          <span class="cost">$3.24</span>
        </div>
      </div>
    </div>
    <div class="insight-card">
      <div class="insight-text">
        评估器<span class="yellow">没有被砍</span>——QA第一轮就<br>
        抓到了<span class="em">核心交互缺失</span>的大问题
      </div>
    </div>
  </div>
</body>
</html>
