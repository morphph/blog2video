<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .title {
      font-size: 48px;
      font-weight: 800;
      margin-bottom: 20px;
    }
    .title .accent {
      color: #F59E0B;
    }
    .subtitle {
      font-size: 26px;
      color: #6B7280;
      margin-bottom: 40px;
    }
    .warn-card {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-left: 4px solid #EF4444;
      border-radius: 12px;
      padding: 24px 28px;
      margin-bottom: 28px;
      text-align: left;
    }
    .warn-text {
      font-size: 26px;
      color: #B0B0CC;
      line-height: 1.5;
    }
    .warn-text .red {
      color: #EF4444;
      font-weight: 700;
    }
    .checklist {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .check-item {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 24px 28px;
      display: flex;
      align-items: center;
      gap: 20px;
      text-align: left;
    }
    .check-number {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(139, 92, 246, 0.15);
      color: #8B5CF6;
      font-size: 24px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .check-text {
      font-size: 26px;
      color: #B0B0CC;
      line-height: 1.5;
    }
    .check-text .em {
      color: #FFFFFF;
      font-weight: 700;
    }
    .check-text .green {
      color: #10B981;
      font-weight: 700;
    }
    .check-text .red {
      color: #EF4444;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="title">怎么砍？<span class="accent">做实验</span></div>
    <div class="subtitle">不是做减法，是做控制变量</div>
    <div class="warn-card">
      <div class="warn-text">
        大刀阔斧一口气砍？<span class="red">直接失败</span><br>
        Anthropic自己踩过这个坑
      </div>
    </div>
    <div class="checklist">
      <div class="check-item">
        <div class="check-number">1</div>
        <div class="check-text">
          列出每个组件 +<br>
          <span class="em">它补偿了什么不足</span>
        </div>
      </div>
      <div class="check-item">
        <div class="check-number">2</div>
        <div class="check-text">
          <span class="em">一次只关掉一个</span><br>
          跑完整测试对比效果
        </div>
      </div>
      <div class="check-item">
        <div class="check-number">3</div>
        <div class="check-text">
          不变差 → <span class="green">砍掉</span><br>
          变差 → <span class="red">留下</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
