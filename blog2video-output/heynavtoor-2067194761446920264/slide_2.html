<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0D0D1A;font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;color:#FFFFFF;overflow:hidden}
.slide{width:100%;height:100%;padding:200px 72px 420px 72px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.kicker{font-family:'JetBrains Mono',monospace;font-size:26px;color:#8B5CF6;letter-spacing:0.08em;margin-bottom:24px;font-weight:600}
.title{font-size:72px;font-weight:900;line-height:1.18;color:#FFFFFF;margin-bottom:48px}
.title .em{color:#EF4444}
.bigcard{background:#1A1A2E;border:1px solid rgba(239,68,68,0.35);border-left:4px solid #EF4444;border-radius:12px;padding:36px 40px;width:100%;text-align:left;margin-bottom:36px}
.bigcard .lab{font-family:'JetBrains Mono',monospace;font-size:22px;color:#EF4444;font-weight:700;letter-spacing:0.05em;margin-bottom:14px}
.bigcard .txt{font-size:38px;color:#FFFFFF;font-weight:600;line-height:1.4}
.bigcard .txt .gray{color:#B0B0CC;font-weight:500}
.divider{font-family:'JetBrains Mono',monospace;font-size:28px;color:#F59E0B;font-weight:700;margin-bottom:32px;letter-spacing:0.08em}
.result{background:#1A1A2E;border:1px solid rgba(245,158,11,0.35);border-left:4px solid #F59E0B;border-radius:12px;padding:36px 40px;width:100%;text-align:left}
.result .lab{font-family:'JetBrains Mono',monospace;font-size:22px;color:#F59E0B;font-weight:700;letter-spacing:0.05em;margin-bottom:14px}
.result .txt{font-size:40px;color:#FFFFFF;font-weight:700;line-height:1.35}
.result .em{color:#F59E0B}
</style>
</head>
<body>
<div class="slide">
<div class="kicker">// 不舒服的真相</div>
<div class="title">大多数人，<br>把 Claude <span class="em">当搜索框</span></div>
<div class="bigcard">
<div class="lab">YOU ASK</div>
<div class="txt">"告诉我关于 <span class="gray">X</span> 的情况"</div>
</div>
<div class="divider">▼</div>
<div class="result">
<div class="lab">YOU GET</div>
<div class="txt">永远是 <span class="em">多数派观点</span><br>被说得最多 / 不会得罪人的那个</div>
</div>
</div>
</body>
</html>
