<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0D0D1A;font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;color:#FFFFFF;overflow:hidden}
.slide{width:100%;height:100%;padding:200px 72px 420px 72px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.kicker{font-family:'JetBrains Mono',monospace;font-size:26px;color:#8B5CF6;letter-spacing:0.08em;margin-bottom:20px;font-weight:600}
.title{font-size:80px;font-weight:900;line-height:1.12;color:#FFFFFF;margin-bottom:14px;letter-spacing:-0.01em}
.title .em{color:#8B5CF6}
.fullname{font-family:'JetBrains Mono',monospace;font-size:24px;color:#6B7280;line-height:1.45;margin-bottom:56px;letter-spacing:0.02em}
.stats{display:flex;gap:24px;width:100%;margin-bottom:40px}
.stat{flex:1;background:#1A1A2E;border:1px solid rgba(245,158,11,0.4);border-left:4px solid #F59E0B;border-radius:12px;padding:32px 24px;text-align:center}
.stat.cyan{border-color:rgba(59,130,246,0.4);border-left-color:#3B82F6}
.stat .num{font-family:'JetBrains Mono',monospace;font-size:88px;font-weight:800;color:#F59E0B;line-height:1;letter-spacing:-0.02em}
.stat.cyan .num{color:#3B82F6}
.stat .lab{margin-top:14px;font-size:26px;color:#B0B0CC;font-weight:500;line-height:1.3}
.tag{font-family:'JetBrains Mono',monospace;font-size:24px;color:#10B981;font-weight:700;letter-spacing:0.06em;background:#1A1A2E;border:1px solid rgba(16,185,129,0.4);padding:16px 28px;border-radius:8px}
</style>
</head>
<body>
<div class="slide">
<div class="kicker">// THE METHOD</div>
<div class="title">这套方法叫 <span class="em">STORM</span></div>
<div class="fullname">Synthesis of Topic Outlines through Retrieval<br>and Multi-perspective Question Asking</div>
<div class="stats">
<div class="stat"><div class="num">+25%</div><div class="lab">组织度<br>对照最强方法</div></div>
<div class="stat cyan"><div class="num">+10%</div><div class="lab">覆盖广度<br>对照最强方法</div></div>
</div>
<div class="tag">PEER-REVIEWED · NAACL 2024</div>
</div>
</body>
</html>
