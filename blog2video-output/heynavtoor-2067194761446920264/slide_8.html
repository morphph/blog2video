<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0D0D1A;font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;color:#FFFFFF;overflow:hidden}
.slide{width:100%;height:100%;padding:200px 72px 420px 72px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
.kicker{font-family:'JetBrains Mono',monospace;font-size:26px;color:#EF4444;letter-spacing:0.08em;margin-bottom:20px;font-weight:600}
.title{font-size:64px;font-weight:900;line-height:1.18;color:#FFFFFF;margin-bottom:40px}
.title .em{color:#EF4444}
.warn{display:flex;flex-direction:column;gap:16px;width:100%}
.card{background:#1A1A2E;border:1px solid rgba(239,68,68,0.3);border-left:4px solid #EF4444;border-radius:10px;padding:22px 28px;text-align:left}
.card .lab{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:700;color:#EF4444;letter-spacing:0.05em;margin-bottom:10px}
.card .txt{font-size:28px;color:#FFFFFF;font-weight:600;line-height:1.4}
.card .txt .gray{color:#B0B0CC;font-weight:500}
.card.warn-yellow{border-left-color:#F59E0B;border-color:rgba(245,158,11,0.3)}
.card.warn-yellow .lab{color:#F59E0B}
.card.warn-blue{border-left-color:#3B82F6;border-color:rgba(59,130,246,0.3)}
.card.warn-blue .lab{color:#3B82F6}
</style>
</head>
<body>
<div class="slide">
<div class="kicker">// HONEST TRADEOFFS</div>
<div class="title">这套方法 <span class="em">不是万能的</span></div>
<div class="warn">
<div class="card">
<div class="lab">LIMIT 01 · CAST 偏倚</div>
<div class="txt">5 个角色本身就是一种偏倚<br><span class="gray">监管者 / 终端用户 / 弱势群体的声音呢？</span></div>
</div>
<div class="card warn-yellow">
<div class="lab">LIMIT 02 · 适用边界</div>
<div class="txt">只在 <span class="gray">争议性 + 多方利益</span> 议题回报最高<br><span class="gray">查 API 签名也跑五视角 → 杀鸡用牛刀</span></div>
</div>
<div class="card warn-blue">
<div class="lab">LIMIT 03 · 隐藏依赖</div>
<div class="txt">天花板 = <span class="gray">Prompt 1 的输出质量</span><br>5 个人格写成 5 个换皮多数派 → 全套塌缩</div>
</div>
</div>
</div>
</body>
</html>
