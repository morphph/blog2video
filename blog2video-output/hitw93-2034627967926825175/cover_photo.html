<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .cover {
      width: 100%;
      height: 100%;
      padding: 100px 72px 400px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .glow {
      position: absolute;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 900px;
      height: 900px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.18) 0%, rgba(139, 92, 246, 0) 70%);
      pointer-events: none;
      z-index: 0;
    }
    .series-tag {
      font-size: 30px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 600;
      margin-bottom: 80px;
      z-index: 1;
    }
    .title {
      font-size: 96px;
      font-weight: 900;
      line-height: 1.25;
      letter-spacing: -1px;
      margin-bottom: 100px;
      z-index: 1;
    }
    .title .red {
      color: #EF4444;
    }
    .source-pill {
      background: #1A1A30;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 999px;
      padding: 18px 36px;
      font-size: 22px;
      color: #6B6B80;
      max-width: 880px;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="cover">
    <div class="glow"></div>
    <div class="series-tag">精读AI · Agent 工程</div>
    <div class="title">
      换更贵的模型<br>
      为什么<span class="red">没救</span>？
    </div>
    <div class="source-pill">Tw93《你不知道的 Agent：原理、架构与工程实践》</div>
  </div>
</body>
</html>
