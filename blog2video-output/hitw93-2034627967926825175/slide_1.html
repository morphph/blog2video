<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .glow {
      position: absolute;
      top: 28%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 900px;
      height: 900px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.20) 0%, rgba(139, 92, 246, 0) 70%);
      pointer-events: none;
      z-index: 0;
    }
    .source-pill {
      background: #1A1A30;
      border: 1px solid rgba(139, 92, 246, 0.25);
      border-radius: 999px;
      padding: 14px 30px;
      font-size: 22px;
      color: #B0B0CC;
      margin-bottom: 60px;
      z-index: 1;
    }
    .title {
      font-size: 92px;
      font-weight: 900;
      line-height: 1.25;
      letter-spacing: -1px;
      margin-bottom: 80px;
      z-index: 1;
    }
    .title .red {
      color: #EF4444;
    }
    .cards {
      display: flex;
      gap: 28px;
      width: 100%;
      justify-content: center;
      z-index: 1;
    }
    .card {
      flex: 1;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.35);
      border-left: 4px solid #8B5CF6;
      border-radius: 12px;
      padding: 32px 24px;
      text-align: center;
    }
    .card-label {
      font-size: 20px;
      color: #8B5CF6;
      letter-spacing: 2px;
      margin-bottom: 14px;
      font-weight: 600;
    }
    .card-text {
      font-size: 38px;
      font-weight: 800;
      color: #FFFFFF;
      line-height: 1.35;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="glow"></div>
    <div class="source-pill">Tw93《你不知道的 Agent：原理、架构与工程实践》</div>
    <div class="title">
      换更贵的模型<br>
      <span class="red">为什么没救</span>？
    </div>
    <div class="cards">
      <div class="card">
        <div class="card-label">悬念 1</div>
        <div class="card-text">Harness &gt; 模型</div>
      </div>
      <div class="card">
        <div class="card-label">悬念 2</div>
        <div class="card-text">工具描述<br>是第一嫌疑人</div>
      </div>
    </div>
  </div>
</body>
</html>
