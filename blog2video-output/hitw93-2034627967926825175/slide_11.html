<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .h2 {
      font-size: 60px;
      font-weight: 900;
      margin-bottom: 36px;
      color: #FFFFFF;
      line-height: 1.2;
    }
    .h2 .accent { color: #8B5CF6; }
    .checklist {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 36px;
    }
    .item {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 20px 22px;
      display: flex;
      align-items: center;
      gap: 18px;
      text-align: left;
    }
    .item.b { border-left: 4px solid #3B82F6; border-color: rgba(59, 130, 246, 0.4); }
    .item.a { border-left: 4px solid #F59E0B; border-color: rgba(245, 158, 11, 0.4); }
    .item.r { border-left: 4px solid #EF4444; border-color: rgba(239, 68, 68, 0.4); }
    .num {
      flex-shrink: 0;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: 900;
      color: #FFFFFF;
    }
    .item.b .num { background: rgba(59, 130, 246, 0.25); color: #3B82F6; }
    .item.a .num { background: rgba(245, 158, 11, 0.25); color: #F59E0B; }
    .item.r .num { background: rgba(239, 68, 68, 0.25); color: #EF4444; }
    .text {
      font-size: 28px;
      font-weight: 700;
      color: #FFFFFF;
      line-height: 1.4;
    }
    .text .muted { color: #B0B0CC; font-weight: 500; }
    .signature {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.5);
      border-left: 4px solid #8B5CF6;
      border-radius: 12px;
      padding: 26px 28px;
      width: 100%;
      margin-bottom: 24px;
      text-align: left;
    }
    .signature-label {
      font-size: 18px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 10px;
    }
    .signature-text {
      font-size: 28px;
      font-weight: 800;
      color: #FFFFFF;
      line-height: 1.4;
    }
    .brand {
      font-size: 22px;
      color: #B0B0CC;
      font-weight: 500;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="h2"><span class="accent">行动清单</span></div>
    <div class="checklist">
      <div class="item b">
        <div class="num">1</div>
        <div class="text">Agent 出问题，<span class="muted">先看评测有没有自己崩</span></div>
      </div>
      <div class="item a">
        <div class="num">2</div>
        <div class="text">工具描述有没有讲清<span class="muted">"什么时候不该用"</span></div>
      </div>
      <div class="item r">
        <div class="num">3</div>
        <div class="text">最后才动模型</div>
      </div>
    </div>
    <div class="signature">
      <div class="signature-label">SIGNATURE</div>
      <div class="signature-text">换更贵的模型救不了一个<br>工具描述写错的 Agent</div>
    </div>
    <div class="brand">AI 世界很吵，精读一篇，胜过刷一百条</div>
  </div>
</body>
</html>
