<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .h2 {
      font-size: 64px;
      font-weight: 900;
      margin-bottom: 60px;
      color: #FFFFFF;
    }
    .h2 .red {
      color: #EF4444;
    }
    .reflex {
      background: #1A1A2E;
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-left: 4px solid #EF4444;
      border-radius: 12px;
      padding: 28px 32px;
      width: 100%;
      margin-bottom: 36px;
      font-size: 36px;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: 1px;
    }
    .reflex .arrow {
      color: #6B7280;
      margin: 0 14px;
    }
    .reflex .x {
      color: #EF4444;
      font-weight: 900;
      margin-left: 10px;
    }
    .three {
      display: flex;
      gap: 18px;
      width: 100%;
      margin-bottom: 28px;
    }
    .item {
      flex: 1;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 22px 14px;
      font-size: 28px;
      font-weight: 600;
      color: #B0B0CC;
      line-height: 1.4;
    }
    .funnel {
      font-size: 44px;
      color: #6B7280;
      margin-bottom: 18px;
    }
    .conclusion-wrong {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.5);
      border-radius: 12px;
      padding: 24px 32px;
      font-size: 40px;
      font-weight: 800;
      color: #EF4444;
      margin-bottom: 50px;
    }
    .note {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.35);
      border-left: 4px solid #8B5CF6;
      border-radius: 12px;
      padding: 24px 28px;
      font-size: 30px;
      font-weight: 600;
      color: #FFFFFF;
      width: 100%;
      line-height: 1.45;
      text-align: left;
    }
    .note .accent {
      color: #8B5CF6;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="h2">直觉错在哪里</div>
    <div class="reflex">Agent 出问题 <span class="arrow">→</span> 换模型 <span class="x">✗</span></div>
    <div class="three">
      <div class="item">Agent<br>答错了</div>
      <div class="item">用错<br>工具</div>
      <div class="item">长对话<br>迷路了</div>
    </div>
    <div class="funnel">↓ 都归到 ↓</div>
    <div class="conclusion-wrong">"都怪模型"</div>
    <div class="note">
      <span class="accent">本篇视角 = 调试视角</span><br>
      → 因果顺序需要重排
    </div>
  </div>
</body>
</html>
