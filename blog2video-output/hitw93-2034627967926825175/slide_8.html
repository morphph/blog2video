<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .h2 {
      font-size: 60px;
      font-weight: 900;
      margin-bottom: 16px;
      color: #FFFFFF;
      line-height: 1.2;
    }
    .h2 .blue { color: #3B82F6; }
    .h2 .amber { color: #F59E0B; }
    .subtitle {
      font-size: 26px;
      color: #B0B0CC;
      margin-bottom: 50px;
      font-weight: 500;
    }
    .cards {
      display: flex;
      gap: 24px;
      width: 100%;
      margin-bottom: 36px;
    }
    .card {
      flex: 1;
      background: #1A1A2E;
      border-radius: 16px;
      padding: 32px 24px;
      text-align: center;
    }
    .card.blue {
      border: 1px solid rgba(59, 130, 246, 0.45);
      border-left: 4px solid #3B82F6;
    }
    .card.amber {
      border: 1px solid rgba(245, 158, 11, 0.45);
      border-left: 4px solid #F59E0B;
    }
    .notation {
      font-size: 78px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -2px;
      margin-bottom: 12px;
      font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    }
    .card.blue .notation { color: #3B82F6; }
    .card.amber .notation { color: #F59E0B; }
    .nota-hint {
      font-size: 20px;
      color: #6B7280;
      letter-spacing: 1px;
      margin-bottom: 22px;
      font-weight: 600;
    }
    .quote {
      font-size: 28px;
      font-weight: 800;
      color: #FFFFFF;
      line-height: 1.4;
      margin-bottom: 16px;
    }
    .purpose {
      font-size: 24px;
      color: #B0B0CC;
      font-weight: 600;
      line-height: 1.4;
    }
    .card.blue .purpose strong { color: #3B82F6; }
    .card.amber .purpose strong { color: #F59E0B; }
    .warning {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.5);
      border-radius: 12px;
      padding: 22px 28px;
      width: 100%;
      font-size: 28px;
      font-weight: 800;
      color: #FFFFFF;
      line-height: 1.45;
    }
    .warning .red { color: #EF4444; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="h2">Pass<span class="blue">@</span>k vs Pass<span class="amber">^</span>k</div>
    <div class="subtitle">长得像，讲的是完全不同的事</div>
    <div class="cards">
      <div class="card blue">
        <div class="notation">@</div>
        <div class="nota-hint">尖号朝外</div>
        <div class="quote">k 次有一次对<br>就算对</div>
        <div class="purpose"><strong>能力上限</strong>探测<br>"理论上能不能做到"</div>
      </div>
      <div class="card amber">
        <div class="notation">^</div>
        <div class="nota-hint">尖号朝上</div>
        <div class="quote">k 次必须全对<br>才算对</div>
        <div class="purpose"><strong>回归测试</strong><br>"有没有被改坏"</div>
      </div>
    </div>
    <div class="warning"><span class="red">混用的代价 →</span><br>回归漏 bug · 能力被掐死</div>
  </div>
</body>
</html>
