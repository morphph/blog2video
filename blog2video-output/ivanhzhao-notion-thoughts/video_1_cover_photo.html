<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 100px 72px 400px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .bg-glow {
      position: absolute;
      top: 38%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 800px;
      height: 800px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.1) 0%, rgba(139, 92, 246, 0.03) 40%, transparent 70%);
      pointer-events: none;
    }
    .bg-glow-2 {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.05) 0%, transparent 60%);
      pointer-events: none;
    }
    .series-label {
      font-size: 30px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 600;
      margin-bottom: 48px;
    }
    .main-title {
      font-size: 92px;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 56px;
    }
    .main-title .highlight-red {
      color: #EF4444;
    }
    .main-title .highlight-yellow {
      color: #F59E0B;
    }
    .source-tag {
      display: inline-block;
      background: #1A1A30;
      border-radius: 100px;
      padding: 14px 32px;
      font-size: 22px;
      color: #6B6B80;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="bg-glow"></div>
    <div class="bg-glow-2"></div>
    <div class="series-label">精读AI · AI思想</div>
    <div class="main-title">
      <span class="highlight-red">10x</span>程序员<br>
      变<span class="highlight-yellow">40x</span>？<br>
      Notion创始人的秘密
    </div>
    <div class="source-tag">Ivan Zhao「Steam, Steel, and Infinite Minds」</div>
  </div>
</body>
</html>
