<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .bg-glow {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 800px;
      height: 600px;
      background: radial-gradient(ellipse, rgba(239, 68, 68, 0.05) 0%, transparent 70%);
      pointer-events: none;
    }
    .section-label {
      font-size: 22px;
      color: #EF4444;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 24px;
      font-weight: 600;
    }
    .slide-title {
      font-size: 46px;
      font-weight: 800;
      margin-bottom: 48px;
      line-height: 1.3;
    }
    .slide-title .red {
      color: #EF4444;
    }
    .cards-container {
      display: flex;
      flex-direction: column;
      gap: 28px;
      width: 100%;
    }
    .bottleneck-card {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 28px 32px;
      text-align: left;
      display: flex;
      gap: 24px;
      align-items: flex-start;
    }
    .bottleneck-card.context {
      border-left: 4px solid #EF4444;
    }
    .bottleneck-card.verify {
      border-left: 4px solid #F59E0B;
    }
    .card-number {
      font-size: 56px;
      font-weight: 800;
      line-height: 1;
      flex-shrink: 0;
    }
    .bottleneck-card.context .card-number {
      color: #EF4444;
    }
    .bottleneck-card.verify .card-number {
      color: #F59E0B;
    }
    .card-content {
      flex: 1;
    }
    .card-title {
      font-size: 30px;
      font-weight: 700;
      margin-bottom: 10px;
      color: #FFFFFF;
    }
    .card-en {
      font-size: 18px;
      color: #6B7280;
      margin-bottom: 12px;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.5px;
    }
    .card-desc {
      font-size: 24px;
      color: #B0B0CC;
      line-height: 1.5;
    }
    .card-example {
      margin-top: 14px;
      font-size: 22px;
      color: #6B7280;
      line-height: 1.4;
      font-style: italic;
    }
    .vs-divider {
      font-size: 28px;
      color: #6B7280;
      font-weight: 700;
      letter-spacing: 4px;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="bg-glow"></div>
    <div class="section-label">两大瓶颈</div>
    <div class="slide-title">
      为什么你<span class="red">做不到</span>？
    </div>
    <div class="cards-container">
      <div class="bottleneck-card context">
        <div class="card-number">1</div>
        <div class="card-content">
          <div class="card-title">上下文碎片化</div>
          <div class="card-en">Context Fragmentation</div>
          <div class="card-desc">信息散落在十几个工具里<br>你就是复制粘贴的胶水</div>
        </div>
      </div>
      <div class="vs-divider">VS</div>
      <div class="bottleneck-card verify">
        <div class="card-number">2</div>
        <div class="card-content">
          <div class="card-title">工作不可验证</div>
          <div class="card-en">Verifiability Gap</div>
          <div class="card-desc">代码跑测试就知道对错<br>但战略 memo 谁来打分？</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
