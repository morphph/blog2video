<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .bg-glow {
      position: absolute;
      top: 35%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 700px;
      height: 500px;
      background: radial-gradient(ellipse, rgba(16, 185, 129, 0.06) 0%, transparent 70%);
      pointer-events: none;
    }
    .section-label {
      font-size: 22px;
      color: #10B981;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 28px;
      font-weight: 600;
    }
    .takeaway-card {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-left: 4px solid #8B5CF6;
      border-radius: 12px;
      padding: 28px 32px;
      width: 100%;
      text-align: left;
      margin-bottom: 36px;
    }
    .takeaway-title {
      font-size: 24px;
      color: #8B5CF6;
      font-weight: 700;
      margin-bottom: 14px;
    }
    .takeaway-text {
      font-size: 30px;
      font-weight: 600;
      line-height: 1.5;
      color: #FFFFFF;
    }
    .takeaway-text .purple {
      color: #8B5CF6;
    }
    .action-title {
      font-size: 26px;
      font-weight: 700;
      color: #F59E0B;
      margin-bottom: 24px;
    }
    .action-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .action-item {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 22px 28px;
      display: flex;
      align-items: center;
      gap: 20px;
      text-align: left;
    }
    .action-item.highlight {
      border-left: 4px solid #10B981;
    }
    .action-number {
      font-size: 32px;
      font-weight: 800;
      color: #F59E0B;
      flex-shrink: 0;
      width: 44px;
    }
    .action-text {
      font-size: 26px;
      color: #B0B0CC;
      line-height: 1.4;
    }
    .action-text .em {
      color: #FFFFFF;
      font-weight: 600;
    }
    .action-text .green {
      color: #10B981;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="bg-glow"></div>
    <div class="section-label">核心结论</div>
    <div class="takeaway-card">
      <div class="takeaway-title">终局不是 Copilot</div>
      <div class="takeaway-text">
        从骑车 → 开车 → <span class="purple">自动驾驶</span><br>
        前提：可整合 + 可验证
      </div>
    </div>
    <div class="action-title">今天就可以做的一件事</div>
    <div class="action-list">
      <div class="action-item">
        <div class="action-number">1</div>
        <div class="action-text">
          列出日常任务清单
        </div>
      </div>
      <div class="action-item">
        <div class="action-number">2</div>
        <div class="action-text">
          标出<span class="em">上下文分散</span>的任务
        </div>
      </div>
      <div class="action-item highlight">
        <div class="action-number">3</div>
        <div class="action-text">
          找到<span class="green">有明确对错标准</span>的<br>
          → 最先交给 Agent
        </div>
      </div>
    </div>
  </div>
</body>
</html>
