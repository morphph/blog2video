<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1080px; height: 1920px; background: #0D0D1A; font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif; color: #FFFFFF; overflow: hidden; }
    .slide { width: 100%; height: 100%; padding: 200px 72px 420px 72px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; position: relative; }
    .slide-label {
      font-size: 20px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 600;
      margin-bottom: 20px;
    }
    .slide-title {
      font-size: 40px;
      font-weight: 800;
      color: #FFFFFF;
      margin-bottom: 40px;
      line-height: 1.3;
    }
    .slide-title .purple { color: #8B5CF6; }
    .analogy-row {
      display: flex;
      gap: 24px;
      width: 100%;
      margin-bottom: 36px;
    }
    .analogy-card {
      flex: 1;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 28px 20px;
      text-align: center;
      position: relative;
    }
    .analogy-card.before {
      border-left: 4px solid #EF4444;
    }
    .analogy-card.after {
      border-left: 4px solid #10B981;
    }
    .analogy-era {
      font-size: 18px;
      color: #6B7280;
      font-weight: 600;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }
    .analogy-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }
    .analogy-material {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .analogy-material.red { color: #EF4444; }
    .analogy-material.green { color: #10B981; }
    .analogy-limit {
      font-size: 56px;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 4px;
    }
    .analogy-limit.red { color: #EF4444; }
    .analogy-limit.green { color: #10B981; }
    .analogy-desc {
      font-size: 20px;
      color: #B0B0CC;
      line-height: 1.4;
    }
    .arrow-center {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 48px;
      height: 48px;
      background: rgba(139, 92, 246, 0.2);
      border: 1px solid rgba(139, 92, 246, 0.4);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      color: #8B5CF6;
      font-weight: 800;
      z-index: 10;
    }
    .analogy-wrapper {
      position: relative;
      width: 100%;
      margin-bottom: 36px;
    }
    .insight-card {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-left: 4px solid #8B5CF6;
      border-radius: 12px;
      padding: 28px 32px;
      width: 100%;
      text-align: left;
    }
    .insight-label {
      font-size: 18px;
      color: #8B5CF6;
      font-weight: 600;
      letter-spacing: 2px;
      margin-bottom: 16px;
    }
    .insight-text {
      font-size: 28px;
      color: #FFFFFF;
      font-weight: 600;
      line-height: 1.5;
    }
    .insight-text .purple { color: #8B5CF6; font-weight: 700; }
    .insight-text .muted { color: #B0B0CC; font-weight: 400; }
    .bottom-line {
      margin-top: 32px;
      font-size: 26px;
      color: #B0B0CC;
      line-height: 1.5;
    }
    .bottom-line .yellow { color: #F59E0B; font-weight: 700; }
  </style>
</head>
<body>
<div class="slide">
  <div class="slide-label">CORE PRINCIPLE</div>
  <div class="slide-title">
    AI是组织的<span class="purple">钢铁</span>
  </div>

  <div class="analogy-wrapper">
    <div class="analogy-row">
      <div class="analogy-card before">
        <div class="analogy-era">19世纪之前</div>
        <div class="analogy-icon">&#127975;</div>
        <div class="analogy-material red">铁 — 脆而沉</div>
        <div class="analogy-limit red">6-7<span style="font-size:28px;">层</span></div>
        <div class="analogy-desc">再高就被自重压垮</div>
      </div>
      <div class="analogy-card after">
        <div class="analogy-era">钢铁时代</div>
        <div class="analogy-icon">&#127959;</div>
        <div class="analogy-material green">钢 — 轻而强</div>
        <div class="analogy-limit green">60<span style="font-size:28px;">层+</span></div>
        <div class="analogy-desc">摩天大楼拔地而起</div>
      </div>
    </div>
    <div class="arrow-center">&rarr;</div>
  </div>

  <div class="insight-card">
    <div class="insight-label">IVAN ZHAO 的洞察</div>
    <div class="insight-text">
      <span class="muted">组织的承重墙 =</span> 人与人的沟通<br>
      <span class="purple">AI跨工作流维护上下文</span><br>
      <span class="muted">沟通不再是瓶颈</span>
    </div>
  </div>

  <div class="bottom-line">
    两小时对齐会 &rarr; <span class="yellow">五分钟异步审阅</span>
  </div>
</div>
</body>
</html>
