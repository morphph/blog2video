<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1080px; height: 1920px; background: #0D0D1A; font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif; color: #FFFFFF; overflow: hidden; }
    .slide { width: 100%; height: 100%; padding: 200px 72px 420px 72px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; position: relative; }
    .bg-glow {
      position: absolute;
      width: 700px;
      height: 700px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.08) 0%, transparent 70%);
      top: 350px;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
    }
    .slide-label {
      font-size: 20px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 600;
      margin-bottom: 32px;
      position: relative;
      z-index: 1;
    }
    .quote-mark {
      font-size: 120px;
      color: rgba(139, 92, 246, 0.25);
      line-height: 0.6;
      margin-bottom: 16px;
      position: relative;
      z-index: 1;
    }
    .quote-text {
      font-size: 36px;
      font-weight: 700;
      line-height: 1.6;
      color: #FFFFFF;
      margin-bottom: 40px;
      position: relative;
      z-index: 1;
    }
    .quote-text .purple { color: #8B5CF6; }
    .quote-text .yellow { color: #F59E0B; }
    .transition-row {
      display: flex;
      align-items: center;
      gap: 24px;
      margin-bottom: 40px;
      position: relative;
      z-index: 1;
    }
    .city-card {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 24px 32px;
      text-align: center;
    }
    .city-card.before {
      border-left: 4px solid #6B7280;
    }
    .city-card.after {
      border-left: 4px solid #8B5CF6;
    }
    .city-icon {
      font-size: 40px;
      margin-bottom: 8px;
    }
    .city-name {
      font-size: 28px;
      font-weight: 700;
      color: #FFFFFF;
      margin-bottom: 4px;
    }
    .city-desc {
      font-size: 20px;
      color: #B0B0CC;
    }
    .arrow-text {
      font-size: 32px;
      color: #8B5CF6;
      font-weight: 800;
    }
    .data-card {
      background: #1A1A2E;
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-left: 4px solid #F59E0B;
      border-radius: 12px;
      padding: 24px 32px;
      width: 100%;
      position: relative;
      z-index: 1;
    }
    .data-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }
    .data-number {
      font-size: 64px;
      font-weight: 800;
      color: #F59E0B;
      line-height: 1;
    }
    .data-text {
      font-size: 24px;
      color: #B0B0CC;
      text-align: left;
      line-height: 1.4;
    }
    .data-text .white { color: #FFFFFF; font-weight: 600; }
  </style>
</head>
<body>
<div class="slide">
  <div class="bg-glow"></div>

  <div class="slide-label">INFLECTION POINT</div>

  <div class="quote-mark">&ldquo;</div>

  <div class="quote-text">
    我们建造的不再是<br>
    <span class="purple">佛罗伦萨</span><br>
    而是<span class="yellow">东京</span>
  </div>

  <div class="transition-row">
    <div class="city-card before">
      <div class="city-icon">&#127963;</div>
      <div class="city-name">佛罗伦萨</div>
      <div class="city-desc">40分钟走完全城</div>
    </div>
    <div class="arrow-text">&rarr;</div>
    <div class="city-card after">
      <div class="city-icon">&#127747;</div>
      <div class="city-name">东京</div>
      <div class="city-desc">爆炸式膨胀</div>
    </div>
  </div>

  <div class="data-card">
    <div class="data-row">
      <div class="data-number">~50%</div>
      <div class="data-text">
        <span class="white">知识工作</span>占美国GDP<br>
        但仍按人的节奏运转
      </div>
    </div>
  </div>
</div>
</body>
</html>
