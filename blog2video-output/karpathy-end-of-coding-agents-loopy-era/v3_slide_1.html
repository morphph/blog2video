<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .bg-glow {
      position: absolute;
      width: 700px;
      height: 700px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.1) 0%, transparent 70%);
      top: 200px;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
    }
    .bg-glow-2 {
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(239, 68, 68, 0.06) 0%, transparent 70%);
      top: 550px;
      right: 60px;
      pointer-events: none;
    }
    .topic-tag {
      display: inline-block;
      background: rgba(139, 92, 246, 0.15);
      border: 1px solid rgba(139, 92, 246, 0.4);
      color: #8B5CF6;
      font-size: 28px;
      font-weight: 600;
      padding: 10px 32px;
      border-radius: 50px;
      letter-spacing: 3px;
      margin-bottom: 48px;
      position: relative;
      z-index: 1;
    }
    .hook-title {
      font-size: 58px;
      font-weight: 900;
      line-height: 1.4;
      margin-bottom: 48px;
      letter-spacing: 1px;
      position: relative;
      z-index: 1;
    }
    .hook-title .red {
      color: #EF4444;
    }
    .hook-title .yellow {
      color: #F59E0B;
    }
    .pain-cards {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 48px;
      position: relative;
      z-index: 1;
    }
    .pain-card {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-left: 4px solid #EF4444;
      border-radius: 12px;
      padding: 24px 28px;
      display: flex;
      align-items: center;
      gap: 20px;
      text-align: left;
    }
    .pain-card.paradox {
      border-left-color: #F59E0B;
    }
    .pain-icon {
      font-size: 32px;
      flex-shrink: 0;
      width: 56px;
      height: 56px;
      background: rgba(239, 68, 68, 0.15);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .pain-card.paradox .pain-icon {
      background: rgba(245, 158, 11, 0.15);
    }
    .pain-text {
      font-size: 30px;
      color: #B0B0CC;
      line-height: 1.5;
    }
    .pain-text strong {
      color: #EF4444;
      font-weight: 700;
    }
    .pain-card.paradox .pain-text strong {
      color: #F59E0B;
    }
    .brand-line {
      font-size: 26px;
      color: #6B7280;
      letter-spacing: 3px;
      position: relative;
      z-index: 1;
    }
    .brand-line span {
      color: #8B5CF6;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="bg-glow"></div>
    <div class="bg-glow-2"></div>
    <div class="topic-tag">精读AI · Karpathy</div>

    <div class="hook-title">
      "我们成功了<br>
      我们<span class="red">所有人都失业</span>"<br>
      <span class="yellow">但程序员反而会更多？</span>
    </div>

    <div class="pain-cards">
      <div class="pain-card">
        <div class="pain-icon">💀</div>
        <div class="pain-text">Karpathy 对 OpenAI 同事说<br><strong>"我们最终都会被替代"</strong></div>
      </div>
      <div class="pain-card paradox">
        <div class="pain-icon">🔄</div>
        <div class="pain-text">转头又说<br><strong>软件工程需求反而会增加</strong></div>
      </div>
    </div>

    <div class="brand-line"><span>精读AI</span> · Karpathy × No Priors</div>
  </div>
</body>
</html>
