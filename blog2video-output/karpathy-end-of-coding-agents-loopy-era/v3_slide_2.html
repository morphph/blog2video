<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .bg-glow {
      position: absolute;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.08) 0%, transparent 70%);
      top: 280px;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
    }
    .section-label {
      font-size: 24px;
      color: #F59E0B;
      letter-spacing: 3px;
      font-weight: 600;
      margin-bottom: 32px;
      position: relative;
      z-index: 1;
    }
    .quote-mark {
      font-size: 100px;
      color: rgba(245, 158, 11, 0.3);
      font-family: Georgia, serif;
      line-height: 1;
      margin-bottom: 8px;
      position: relative;
      z-index: 1;
    }
    .quote-text {
      font-size: 44px;
      font-weight: 800;
      line-height: 1.5;
      margin-bottom: 40px;
      position: relative;
      z-index: 1;
    }
    .quote-text .yellow {
      color: #F59E0B;
    }
    .quote-text .green {
      color: #10B981;
    }
    .quote-source {
      font-size: 24px;
      color: #6B7280;
      margin-bottom: 40px;
      position: relative;
      z-index: 1;
    }
    .example-card {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-left: 4px solid #F59E0B;
      border-radius: 12px;
      padding: 28px;
      text-align: left;
      position: relative;
      z-index: 1;
      margin-bottom: 20px;
    }
    .example-title {
      font-size: 28px;
      font-weight: 700;
      color: #F59E0B;
      margin-bottom: 12px;
    }
    .example-desc {
      font-size: 26px;
      color: #B0B0CC;
      line-height: 1.6;
    }
    .example-desc strong {
      color: #FFFFFF;
      font-weight: 700;
    }
    .insight-card {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-left: 4px solid #10B981;
      border-radius: 12px;
      padding: 28px;
      text-align: left;
      position: relative;
      z-index: 1;
    }
    .insight-title {
      font-size: 28px;
      font-weight: 700;
      color: #10B981;
      margin-bottom: 12px;
    }
    .insight-desc {
      font-size: 26px;
      color: #B0B0CC;
      line-height: 1.6;
    }
    .insight-desc strong {
      color: #10B981;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="bg-glow"></div>
    <div class="section-label">JEVONS PARADOX</div>
    <div class="quote-mark">"</div>
    <div class="quote-text">
      某样东西<span class="yellow">变便宜了</span><br>
      需求不降反升<br>
      总消耗<span class="green">反而暴涨</span>
    </div>
    <div class="quote-source">— 杰文斯悖论 (Jevons Paradox)</div>

    <div class="example-card">
      <div class="example-title">ATM 案例</div>
      <div class="example-desc">ATM 让开银行网点<strong>成本大降</strong><br>银行反而开了更多网点 → <strong>雇了更多柜员</strong></div>
    </div>

    <div class="insight-card">
      <div class="insight-title">代码正在变成一次性的</div>
      <div class="insight-desc">不再精心雕琢用十年<br>而是<strong>随时生成、随时修改、用完就丢</strong></div>
    </div>
  </div>
</body>
</html>
