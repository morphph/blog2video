<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .section-label {
      font-size: 24px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 600;
      margin-bottom: 28px;
    }
    .main-title {
      font-size: 46px;
      font-weight: 800;
      margin-bottom: 12px;
    }
    .main-title .purple {
      color: #8B5CF6;
    }
    .main-title .yellow {
      color: #F59E0B;
    }
    .subtitle {
      font-size: 26px;
      color: #6B7280;
      margin-bottom: 32px;
    }
    .cards-wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .card {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 26px 28px;
      text-align: left;
      display: flex;
      align-items: flex-start;
      gap: 20px;
    }
    .card.digital {
      border-left: 4px solid #3B82F6;
    }
    .card.interface {
      border-left: 4px solid #F59E0B;
    }
    .card.physical {
      border-left: 4px solid #10B981;
    }
    .card-icon {
      flex-shrink: 0;
      width: 52px;
      height: 52px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }
    .card.digital .card-icon {
      background: rgba(59, 130, 246, 0.15);
    }
    .card.interface .card-icon {
      background: rgba(245, 158, 11, 0.15);
    }
    .card.physical .card-icon {
      background: rgba(16, 185, 129, 0.15);
    }
    .card-content {
      flex: 1;
    }
    .card-layer {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 2px;
      margin-bottom: 6px;
    }
    .card.digital .card-layer { color: #3B82F6; }
    .card.interface .card-layer { color: #F59E0B; }
    .card.physical .card-layer { color: #10B981; }
    .card-title {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .card.digital .card-title { color: #3B82F6; }
    .card.interface .card-title { color: #F59E0B; }
    .card.physical .card-title { color: #10B981; }
    .card-desc {
      font-size: 24px;
      color: #B0B0CC;
      line-height: 1.5;
    }
    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .tag {
      display: inline-block;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 6px;
      padding: 4px 12px;
      font-size: 20px;
      color: #8B8BA0;
    }
    .core-insight {
      width: 100%;
      margin-top: 24px;
      background: rgba(139, 92, 246, 0.08);
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-radius: 12px;
      padding: 20px 28px;
      text-align: center;
    }
    .core-insight-text {
      font-size: 28px;
      font-weight: 700;
      color: #8B5CF6;
      line-height: 1.5;
    }
    .core-insight-text .white {
      color: #FFFFFF;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="section-label">BITS VS ATOMS</div>
    <div class="main-title">AI影响的<span class="purple">三层框架</span></div>
    <div class="subtitle">翻转比特比移动原子快一百万倍</div>

    <div class="cards-wrapper">
      <div class="card digital">
        <div class="card-icon">💻</div>
        <div class="card-content">
          <div class="card-layer">LAYER 1</div>
          <div class="card-title">纯数字工作</div>
          <div class="card-desc">在家远程能做的一切<br>率先经历巨变</div>
          <div class="card-tags">
            <span class="tag">写代码</span>
            <span class="tag">做研究</span>
            <span class="tag">数据分析</span>
            <span class="tag">文档处理</span>
          </div>
        </div>
      </div>

      <div class="card interface">
        <div class="card-icon">🔌</div>
        <div class="card-content">
          <div class="card-layer">LAYER 2</div>
          <div class="card-title">数字×物理接口</div>
          <div class="card-desc">传感器 + 执行器<br>催生大量新公司</div>
          <div class="card-tags">
            <span class="tag">材料科学</span>
            <span class="tag">AutoResearch</span>
            <span class="tag">实验设备</span>
          </div>
        </div>
      </div>

      <div class="card physical">
        <div class="card-icon">🤖</div>
        <div class="card-content">
          <div class="card-layer">LAYER 3</div>
          <div class="card-title">纯物理世界</div>
          <div class="card-desc">时间最晚、资本最重<br>但市场可能最大</div>
          <div class="card-tags">
            <span class="tag">机器人</span>
            <span class="tag">自动驾驶</span>
            <span class="tag">制造业</span>
          </div>
        </div>
      </div>
    </div>

    <div class="core-insight">
      <div class="core-insight-text"><span class="white">物理世界总市场</span>远比数字世界大</div>
    </div>
  </div>
</body>
</html>
