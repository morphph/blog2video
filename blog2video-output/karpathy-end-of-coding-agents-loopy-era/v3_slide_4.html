<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .section-label {
      font-size: 24px;
      color: #3B82F6;
      letter-spacing: 3px;
      font-weight: 600;
      margin-bottom: 28px;
    }
    .main-title {
      font-size: 48px;
      font-weight: 800;
      margin-bottom: 36px;
    }
    .main-title .blue {
      color: #3B82F6;
    }
    .main-title .red {
      color: #EF4444;
    }
    .versus-container {
      width: 100%;
      display: flex;
      gap: 20px;
      margin-bottom: 28px;
    }
    .versus-card {
      flex: 1;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 28px 20px;
      text-align: center;
    }
    .versus-card.closed {
      border-top: 4px solid #EF4444;
    }
    .versus-card.open {
      border-top: 4px solid #10B981;
    }
    .versus-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
    .versus-label {
      font-size: 34px;
      font-weight: 800;
      margin-bottom: 10px;
    }
    .versus-card.closed .versus-label { color: #EF4444; }
    .versus-card.open .versus-label { color: #10B981; }
    .versus-desc {
      font-size: 24px;
      color: #B0B0CC;
      line-height: 1.5;
    }
    .gap-indicator {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 22px 28px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    .gap-bar {
      flex: 1;
      height: 8px;
      border-radius: 4px;
      background: linear-gradient(to right, #EF4444, #10B981);
    }
    .gap-text {
      font-size: 28px;
      font-weight: 700;
      color: #F59E0B;
      white-space: nowrap;
    }
    .quote-card {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-left: 4px solid #3B82F6;
      border-radius: 12px;
      padding: 24px 28px;
      text-align: left;
      margin-bottom: 20px;
    }
    .quote-card-text {
      font-size: 26px;
      color: #B0B0CC;
      line-height: 1.6;
    }
    .quote-card-text strong {
      color: #3B82F6;
      font-weight: 700;
    }
    .warning-card {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-left: 4px solid #EF4444;
      border-radius: 12px;
      padding: 24px 28px;
      text-align: left;
    }
    .warning-card-text {
      font-size: 26px;
      color: #B0B0CC;
      line-height: 1.6;
    }
    .warning-card-text strong {
      color: #EF4444;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="section-label">OPEN VS CLOSED</div>
    <div class="main-title"><span class="blue">开源</span> vs <span class="red">闭源</span></div>

    <div class="versus-container">
      <div class="versus-card closed">
        <div class="versus-icon">🔒</div>
        <div class="versus-label">闭源</div>
        <div class="versus-desc">前沿探索<br>跑在最前面</div>
      </div>
      <div class="versus-card open">
        <div class="versus-icon">🌐</div>
        <div class="versus-label">开源</div>
        <div class="versus-desc">基础设施<br>公共安全平台</div>
      </div>
    </div>

    <div class="gap-indicator">
      <div class="gap-text">差距 6~8 个月</div>
      <div class="gap-bar"></div>
    </div>

    <div class="quote-card">
      <div class="quote-card-text">"就像 <strong>Windows 和 Linux</strong> 的关系<br>Linux 运行在 60%+ 的电脑上<br>行业需要一个<strong>开放的公共平台</strong>"</div>
    </div>

    <div class="warning-card">
      <div class="warning-card-text">担忧：前沿实验室<strong>进一步集中化</strong><br>不希望最重要的技术决定<br>在<strong>两三个人的闭门会议</strong>上做出</div>
    </div>
  </div>
</body>
</html>
