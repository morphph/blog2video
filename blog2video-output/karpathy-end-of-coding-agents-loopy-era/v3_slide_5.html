<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .bg-glow {
      position: absolute;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.08) 0%, transparent 70%);
      top: 300px;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
    }
    .section-label {
      font-size: 24px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 600;
      margin-bottom: 32px;
      position: relative;
      z-index: 1;
    }
    .main-title {
      font-size: 48px;
      font-weight: 800;
      margin-bottom: 40px;
      position: relative;
      z-index: 1;
    }
    .main-title .purple {
      color: #8B5CF6;
    }
    .summary-cards {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 18px;
      margin-bottom: 32px;
      position: relative;
      z-index: 1;
    }
    .summary-card {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 22px 28px;
      display: flex;
      align-items: center;
      gap: 20px;
      text-align: left;
    }
    .summary-card:nth-child(1) {
      border-left: 4px solid #F59E0B;
    }
    .summary-card:nth-child(2) {
      border-left: 4px solid #3B82F6;
    }
    .summary-card:nth-child(3) {
      border-left: 4px solid #10B981;
    }
    .summary-number {
      flex-shrink: 0;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 800;
    }
    .summary-card:nth-child(1) .summary-number {
      background: rgba(245, 158, 11, 0.2);
      color: #F59E0B;
    }
    .summary-card:nth-child(2) .summary-number {
      background: rgba(59, 130, 246, 0.2);
      color: #3B82F6;
    }
    .summary-card:nth-child(3) .summary-number {
      background: rgba(16, 185, 129, 0.2);
      color: #10B981;
    }
    .summary-text {
      font-size: 28px;
      color: #B0B0CC;
      line-height: 1.5;
    }
    .summary-card:nth-child(1) .summary-text strong { color: #F59E0B; }
    .summary-card:nth-child(2) .summary-text strong { color: #3B82F6; }
    .summary-card:nth-child(3) .summary-text strong { color: #10B981; }
    .action-card {
      width: 100%;
      background: rgba(139, 92, 246, 0.08);
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-radius: 12px;
      padding: 28px;
      position: relative;
      z-index: 1;
    }
    .action-label {
      font-size: 22px;
      color: #8B5CF6;
      font-weight: 600;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }
    .action-text {
      font-size: 28px;
      color: #FFFFFF;
      line-height: 1.6;
      font-weight: 600;
    }
    .action-text .purple {
      color: #8B5CF6;
    }
    .brand-line {
      font-size: 24px;
      color: #6B7280;
      margin-top: 32px;
      letter-spacing: 3px;
      position: relative;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="bg-glow"></div>
    <div class="section-label">TAKEAWAYS</div>
    <div class="main-title">Karpathy 三期<span class="purple">核心洞察</span></div>

    <div class="summary-cards">
      <div class="summary-card">
        <div class="summary-number">1</div>
        <div class="summary-text"><strong>杰文斯悖论</strong>：AI让代码变便宜<br>需求不降反升</div>
      </div>
      <div class="summary-card">
        <div class="summary-number">2</div>
        <div class="summary-text"><strong>Bits vs Atoms</strong>：数字世界先变<br>物理世界市场更大</div>
      </div>
      <div class="summary-card">
        <div class="summary-number">3</div>
        <div class="summary-text"><strong>教 Agent 而非教人</strong><br>写 Skill 文档取代录教程</div>
      </div>
    </div>

    <div class="action-card">
      <div class="action-label">ACTION</div>
      <div class="action-text">把你最擅长的知识领域<br>写成一份给 Agent 的 <span class="purple">Skill 文档</span><br>而不是给人的教程</div>
    </div>

    <div class="brand-line">精读一篇，胜过刷一百条</div>
  </div>
</body>
</html>
