<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
      background:
        radial-gradient(circle at 25% 18%, rgba(239, 68, 68, 0.16), transparent 55%),
        radial-gradient(circle at 80% 80%, rgba(139, 92, 246, 0.16), transparent 55%),
        #0D0D1A;
    }
    .tag {
      font-size: 28px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 56px;
    }
    .headline {
      font-size: 88px;
      font-weight: 900;
      line-height: 1.16;
      letter-spacing: -2px;
      margin-bottom: 56px;
    }
    .headline .red { color: #EF4444; }
    .headline .yellow { color: #F59E0B; }
    .verdict {
      background: #1A1A2E;
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-left: 4px solid #EF4444;
      border-radius: 14px;
      padding: 28px 32px;
      max-width: 900px;
      width: 100%;
      text-align: left;
      margin-bottom: 32px;
    }
    .verdict .label {
      font-size: 22px;
      color: #EF4444;
      letter-spacing: 2px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .verdict .text {
      font-size: 32px;
      color: #FFFFFF;
      font-weight: 700;
      line-height: 1.45;
    }
    .verdict .text .em { color: #F59E0B; font-weight: 800; }
    .source {
      display: inline-block;
      background: #1A1A30;
      border: 1px solid rgba(139, 92, 246, 0.25);
      border-radius: 999px;
      padding: 12px 26px;
      font-size: 22px;
      color: #8B8BA8;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="tag">精读AI · Claude Code</div>
    <div class="headline">
      跑得起 Agent 的<br>
      不是模型<br>
      是<span class="yellow">缓存命中率</span>
    </div>
    <div class="verdict">
      <div class="label">ANTHROPIC 内部总结</div>
      <div class="text">
        命中率掉几个点 = <span class="em">SEV 事故</span><br>
        缓存击穿 = 成本结构崩掉
      </div>
    </div>
    <div class="source">Anthropic · Claude Code 工程实录</div>
  </div>
</body>
</html>
