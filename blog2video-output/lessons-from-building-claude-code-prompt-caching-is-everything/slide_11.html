<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
      background: radial-gradient(circle at 50% 22%, rgba(245, 158, 11, 0.12), transparent 60%), #0D0D1A;
    }
    .eyebrow {
      font-size: 26px;
      color: #F59E0B;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 22px;
    }
    .quote-mark {
      font-size: 110px;
      color: #F59E0B;
      font-weight: 900;
      line-height: 0.5;
      margin-bottom: 28px;
      opacity: 0.7;
    }
    .quote {
      font-size: 64px;
      font-weight: 900;
      line-height: 1.22;
      letter-spacing: -1px;
      margin-bottom: 24px;
    }
    .quote .y { color: #F59E0B; }
    .quote .g { color: #10B981; }
    .divider {
      width: 80px; height: 4px;
      background: #F59E0B;
      margin: 12px 0 32px;
      border-radius: 2px;
    }
    .footer {
      background: #1A1A2E;
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-left: 4px solid #F59E0B;
      border-radius: 12px;
      padding: 22px 28px;
      max-width: 940px;
      width: 100%;
      text-align: left;
    }
    .footer .label {
      font-size: 22px;
      color: #F59E0B;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }
    .footer .text {
      font-size: 24px;
      color: #FFFFFF;
      font-weight: 700;
      line-height: 1.5;
    }
    .footer .text .em { color: #EF4444; font-weight: 800; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="eyebrow">五条原则的底层</div>
    <div class="quote-mark">"</div>
    <div class="quote">
      让一段对话<br>
      <span class="g">从头到尾</span><br>
      共享<span class="y">同一个前缀</span>
    </div>
    <div class="divider"></div>
    <div class="footer">
      <div class="label">这条约束改写一切</div>
      <div class="text">
        动态调工具 = 反模式<br>
        切便宜模型 = <span class="em">可能更贵</span><br>
        独立总结 &gt; 延伸任务 ← 错的
      </div>
    </div>
  </div>
</body>
</html>
