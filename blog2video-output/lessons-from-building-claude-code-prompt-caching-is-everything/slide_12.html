<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
      background:
        radial-gradient(circle at 25% 20%, rgba(139, 92, 246, 0.14), transparent 55%),
        radial-gradient(circle at 80% 78%, rgba(245, 158, 11, 0.12), transparent 55%),
        #0D0D1A;
    }
    .eyebrow {
      font-size: 26px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 28px;
    }
    .headline {
      font-size: 76px;
      font-weight: 900;
      line-height: 1.18;
      letter-spacing: -1px;
      margin-bottom: 38px;
    }
    .headline .y { color: #F59E0B; }
    .headline .g { color: #10B981; }
    .action {
      background: #1A1A2E;
      border: 1px solid rgba(16, 185, 129, 0.35);
      border-left: 4px solid #10B981;
      border-radius: 12px;
      padding: 22px 30px;
      max-width: 940px;
      width: 100%;
      text-align: left;
      margin-bottom: 22px;
    }
    .action .label {
      font-size: 22px;
      color: #10B981;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }
    .action .text {
      font-size: 28px;
      color: #FFFFFF;
      font-weight: 700;
      line-height: 1.45;
    }
    .action .text .em { color: #F59E0B; font-weight: 800; }
    .closer {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.35);
      border-left: 4px solid #8B5CF6;
      border-radius: 12px;
      padding: 22px 30px;
      max-width: 940px;
      width: 100%;
      text-align: left;
    }
    .closer .label {
      font-size: 22px;
      color: #8B5CF6;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }
    .closer .text {
      font-size: 28px;
      color: #FFFFFF;
      font-weight: 700;
      line-height: 1.45;
    }
    .closer .text .em { color: #F59E0B; font-weight: 800; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="eyebrow">一句话总结</div>
    <div class="headline">
      Agent 不是<br>
      加工具<br>
      是<span class="y">给缓存让路</span>
    </div>
    <div class="action">
      <div class="label">我做的事</div>
      <div class="text">把<span class="em">缓存命中率</span>放进监控<br>和可用性同一页面</div>
    </div>
    <div class="closer">
      <div class="label">精读一篇 &gt; 刷一百条</div>
      <div class="text">AI 世界很吵<br><span class="em">下期再见</span></div>
    </div>
  </div>
</body>
</html>
