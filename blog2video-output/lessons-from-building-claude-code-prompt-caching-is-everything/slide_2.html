<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
      background: radial-gradient(circle at 50% 25%, rgba(239, 68, 68, 0.10), transparent 60%), #0D0D1A;
    }
    .eyebrow {
      font-size: 26px;
      color: #EF4444;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 28px;
    }
    .headline {
      font-size: 72px;
      font-weight: 900;
      line-height: 1.2;
      letter-spacing: -1px;
      margin-bottom: 40px;
    }
    .headline .red { color: #EF4444; }
    .compare {
      display: flex;
      gap: 24px;
      width: 100%;
      max-width: 940px;
      margin-bottom: 36px;
    }
    .card {
      flex: 1;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.25);
      border-radius: 14px;
      padding: 28px 24px;
      text-align: left;
    }
    .card.bad { border-left: 4px solid #6B7280; }
    .card.good { border-left: 4px solid #EF4444; }
    .card .tag {
      font-size: 20px;
      letter-spacing: 2px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .card.bad .tag { color: #6B7280; }
    .card.good .tag { color: #EF4444; }
    .card .title {
      font-size: 30px;
      font-weight: 800;
      color: #FFFFFF;
      line-height: 1.3;
      margin-bottom: 12px;
    }
    .card .desc {
      font-size: 22px;
      color: #B0B0CC;
      line-height: 1.5;
      font-weight: 600;
    }
    .verdict {
      background: #1A1A2E;
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-left: 4px solid #EF4444;
      border-radius: 12px;
      padding: 26px 30px;
      max-width: 940px;
      width: 100%;
      text-align: left;
    }
    .verdict .label {
      font-size: 22px;
      color: #EF4444;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }
    .verdict .text {
      font-size: 28px;
      color: #FFFFFF;
      font-weight: 700;
      line-height: 1.45;
    }
    .verdict .text .em { color: #F59E0B; font-weight: 800; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="eyebrow">态度的差距</div>
    <div class="headline">
      缓存不是<br>
      "<span class="red">性能优化</span>"
    </div>
    <div class="compare">
      <div class="card bad">
        <div class="tag">普通团队</div>
        <div class="title">做了更好<br>没做也能上</div>
        <div class="desc">优化项之一，可延后</div>
      </div>
      <div class="card good">
        <div class="tag">CLAUDE CODE</div>
        <div class="title">第一天起<br>整套围绕它</div>
        <div class="desc">命中率掉点 = SEV 事故</div>
      </div>
    </div>
    <div class="verdict">
      <div class="label">这意味着</div>
      <div class="text">
        订阅额度 / 可接受延迟<br>
        全都建立在<span class="em">高命中率</span>之上
      </div>
    </div>
  </div>
</body>
</html>
