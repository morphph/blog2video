<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
      background: radial-gradient(circle at 50% 22%, rgba(139, 92, 246, 0.12), transparent 60%), #0D0D1A;
    }
    .eyebrow {
      font-size: 26px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 24px;
    }
    .headline {
      font-size: 68px;
      font-weight: 900;
      line-height: 1.18;
      letter-spacing: -1px;
      margin-bottom: 36px;
    }
    .headline .p { color: #8B5CF6; }
    .stack {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 940px;
      margin-bottom: 32px;
    }
    .layer {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.22);
      border-radius: 12px;
      padding: 20px 28px;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .layer.l1 { border-left: 4px solid #10B981; }
    .layer.l2 { border-left: 4px solid #3B82F6; }
    .layer.l3 { border-left: 4px solid #F59E0B; }
    .layer.l4 { border-left: 4px solid #EF4444; }
    .layer .idx {
      font-size: 42px;
      font-weight: 900;
      line-height: 1;
      min-width: 56px;
    }
    .layer.l1 .idx { color: #10B981; }
    .layer.l2 .idx { color: #3B82F6; }
    .layer.l3 .idx { color: #F59E0B; }
    .layer.l4 .idx { color: #EF4444; }
    .layer .body { flex: 1; }
    .layer .name {
      font-size: 26px;
      font-weight: 800;
      color: #FFFFFF;
      line-height: 1.2;
      margin-bottom: 4px;
    }
    .layer .scope {
      font-size: 20px;
      color: #B0B0CC;
      font-weight: 600;
    }
    .rule {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.35);
      border-left: 4px solid #8B5CF6;
      border-radius: 12px;
      padding: 22px 28px;
      max-width: 940px;
      width: 100%;
      text-align: left;
    }
    .rule .label {
      font-size: 22px;
      color: #8B5CF6;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }
    .rule .text {
      font-size: 28px;
      color: #FFFFFF;
      font-weight: 700;
      line-height: 1.4;
    }
    .rule .text .em { color: #F59E0B; font-weight: 800; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="eyebrow">前缀匹配规则</div>
    <div class="headline">
      稳的放前面<br>
      变的放<span class="p">最后</span>
    </div>
    <div class="stack">
      <div class="layer l1">
        <div class="idx">1</div>
        <div class="body">
          <div class="name">System Prompt + 工具定义</div>
          <div class="scope">全局共享缓存</div>
        </div>
      </div>
      <div class="layer l2">
        <div class="idx">2</div>
        <div class="body">
          <div class="name">CLAUDE.md</div>
          <div class="scope">项目内复用</div>
        </div>
      </div>
      <div class="layer l3">
        <div class="idx">3</div>
        <div class="body">
          <div class="name">Session Context</div>
          <div class="scope">本次会话复用</div>
        </div>
      </div>
      <div class="layer l4">
        <div class="idx">4</div>
        <div class="body">
          <div class="name">对话消息</div>
          <div class="scope">每轮都在变</div>
        </div>
      </div>
    </div>
    <div class="rule">
      <div class="label">代价</div>
      <div class="text">失去<span class="em">动态调整 prompt</span> 的自由</div>
    </div>
  </div>
</body>
</html>
