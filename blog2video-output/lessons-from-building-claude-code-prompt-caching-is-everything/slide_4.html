<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
      background: radial-gradient(circle at 50% 22%, rgba(239, 68, 68, 0.12), transparent 60%), #0D0D1A;
    }
    .eyebrow {
      font-size: 26px;
      color: #EF4444;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 24px;
    }
    .headline {
      font-size: 76px;
      font-weight: 900;
      line-height: 1.16;
      letter-spacing: -1px;
      margin-bottom: 40px;
    }
    .headline .r { color: #EF4444; }
    .traps {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      max-width: 940px;
      margin-bottom: 28px;
    }
    .trap {
      background: #1A1A2E;
      border: 1px solid rgba(239, 68, 68, 0.25);
      border-left: 4px solid #EF4444;
      border-radius: 12px;
      padding: 20px 26px;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 22px;
    }
    .trap .idx {
      font-size: 56px;
      font-weight: 900;
      color: #EF4444;
      line-height: 1;
      min-width: 60px;
    }
    .trap .body { flex: 1; }
    .trap .name {
      font-size: 26px;
      font-weight: 800;
      color: #FFFFFF;
      margin-bottom: 4px;
      line-height: 1.25;
    }
    .trap .desc {
      font-size: 20px;
      color: #B0B0CC;
      font-weight: 600;
      line-height: 1.4;
    }
    .silent {
      background: #1A1A2E;
      border: 1px solid rgba(245, 158, 11, 0.35);
      border-left: 4px solid #F59E0B;
      border-radius: 12px;
      padding: 22px 28px;
      max-width: 940px;
      width: 100%;
      text-align: left;
    }
    .silent .label {
      font-size: 22px;
      color: #F59E0B;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }
    .silent .text {
      font-size: 26px;
      color: #FFFFFF;
      font-weight: 700;
      line-height: 1.4;
    }
    .silent .text .em { color: #EF4444; font-weight: 800; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="eyebrow">真实踩过的坑</div>
    <div class="headline">
      三种<span class="r">无声击穿</span>
    </div>
    <div class="traps">
      <div class="trap">
        <div class="idx">1</div>
        <div class="body">
          <div class="name">塞入精确时间戳</div>
          <div class="desc">每个请求 prefix 都不同，静态缓存全失效</div>
        </div>
      </div>
      <div class="trap">
        <div class="idx">2</div>
        <div class="body">
          <div class="name">工具序列化顺序漂移</div>
          <div class="desc">功能等价，但 prefix 不同</div>
        </div>
      </div>
      <div class="trap">
        <div class="idx">3</div>
        <div class="body">
          <div class="name">子 agent 参数改动</div>
          <div class="desc">无害修改落在 cached prefix 里</div>
        </div>
      </div>
    </div>
    <div class="silent">
      <div class="label">最难处理的地方</div>
      <div class="text">
        不报错、不崩溃<br>
        只是<span class="em">变贵了、变慢了</span>
      </div>
    </div>
  </div>
</body>
</html>
