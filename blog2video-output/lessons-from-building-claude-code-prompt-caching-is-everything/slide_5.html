<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
      background: radial-gradient(circle at 50% 25%, rgba(16, 185, 129, 0.10), transparent 60%), #0D0D1A;
    }
    .eyebrow {
      font-size: 26px;
      color: #10B981;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 24px;
    }
    .headline {
      font-size: 72px;
      font-weight: 900;
      line-height: 1.18;
      letter-spacing: -1px;
      margin-bottom: 40px;
    }
    .headline .g { color: #10B981; }
    .compare {
      display: flex;
      gap: 22px;
      width: 100%;
      max-width: 940px;
      margin-bottom: 32px;
    }
    .card {
      flex: 1;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.22);
      border-radius: 14px;
      padding: 26px 24px;
      text-align: left;
    }
    .card.bad { border-left: 4px solid #EF4444; }
    .card.good { border-left: 4px solid #10B981; }
    .card .tag {
      font-size: 20px;
      letter-spacing: 2px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .card.bad .tag { color: #EF4444; }
    .card.good .tag { color: #10B981; }
    .card .title {
      font-size: 32px;
      font-weight: 900;
      color: #FFFFFF;
      line-height: 1.25;
      margin-bottom: 10px;
    }
    .card .desc {
      font-size: 22px;
      color: #B0B0CC;
      font-weight: 600;
      line-height: 1.45;
    }
    .verdict {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.35);
      border-left: 4px solid #8B5CF6;
      border-radius: 12px;
      padding: 24px 30px;
      max-width: 940px;
      width: 100%;
      text-align: left;
    }
    .verdict .label {
      font-size: 22px;
      color: #8B5CF6;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }
    .verdict .text {
      font-size: 28px;
      color: #FFFFFF;
      font-weight: 700;
      line-height: 1.4;
    }
    .verdict .text .em { color: #F59E0B; font-weight: 800; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="eyebrow">信息更新怎么走</div>
    <div class="headline">
      改 message<br>
      不改 <span class="g">prompt</span>
    </div>
    <div class="compare">
      <div class="card bad">
        <div class="tag">直觉做法</div>
        <div class="title">把新时间<br>写进 prompt</div>
        <div class="desc">prefix 变了，缓存击穿</div>
      </div>
      <div class="card good">
        <div class="tag">CLAUDE CODE</div>
        <div class="title">塞进下一条<br>system-reminder</div>
        <div class="desc">prefix 不动，缓存继续有效</div>
      </div>
    </div>
    <div class="verdict">
      <div class="label">真正的边界</div>
      <div class="text">
        prompt vs message<br>
        是<span class="em">缓存这条规则</span>划出来的
      </div>
    </div>
  </div>
</body>
</html>
