<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
      background: radial-gradient(circle at 50% 22%, rgba(245, 158, 11, 0.10), transparent 60%), #0D0D1A;
    }
    .eyebrow {
      font-size: 26px;
      color: #F59E0B;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 24px;
    }
    .headline {
      font-size: 72px;
      font-weight: 900;
      line-height: 1.18;
      letter-spacing: -1px;
      margin-bottom: 40px;
    }
    .headline .y { color: #F59E0B; }
    .funnel {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 36px;
    }
    .pill {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.22);
      border-radius: 14px;
      padding: 22px 28px;
      min-width: 240px;
      text-align: center;
    }
    .pill.bad { border-left: 4px solid #EF4444; }
    .pill.good { border-left: 4px solid #10B981; }
    .pill .num {
      font-size: 64px;
      font-weight: 900;
      line-height: 1;
      margin-bottom: 6px;
    }
    .pill.bad .num { color: #EF4444; }
    .pill.good .num { color: #10B981; }
    .pill .lbl {
      font-size: 20px;
      color: #B0B0CC;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .arrow {
      font-size: 56px;
      color: #8B5CF6;
      font-weight: 900;
    }
    .reason {
      background: #1A1A2E;
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-left: 4px solid #EF4444;
      border-radius: 12px;
      padding: 22px 28px;
      max-width: 940px;
      width: 100%;
      text-align: left;
      margin-bottom: 16px;
    }
    .reason .label {
      font-size: 22px;
      color: #EF4444;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }
    .reason .text {
      font-size: 26px;
      color: #FFFFFF;
      font-weight: 700;
      line-height: 1.4;
    }
    .reason .text .em { color: #F59E0B; font-weight: 800; }
    .answer {
      background: #1A1A2E;
      border: 1px solid rgba(16, 185, 129, 0.35);
      border-left: 4px solid #10B981;
      border-radius: 12px;
      padding: 20px 28px;
      max-width: 940px;
      width: 100%;
      text-align: left;
    }
    .answer .label {
      font-size: 22px;
      color: #10B981;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 6px;
    }
    .answer .text {
      font-size: 24px;
      color: #FFFFFF;
      font-weight: 700;
      line-height: 1.4;
    }
    .answer .text .em { color: #10B981; font-weight: 800; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="eyebrow">最反直觉的一条</div>
    <div class="headline">
      切到 <span class="y">Haiku</span><br>
      反而更贵
    </div>
    <div class="funnel">
      <div class="pill bad">
        <div class="num">Opus</div>
        <div class="lbl">10万 token 已缓存</div>
      </div>
      <div class="arrow">→</div>
      <div class="pill good">
        <div class="num">Haiku</div>
        <div class="lbl">一字节都用不上</div>
      </div>
    </div>
    <div class="reason">
      <div class="label">缓存按模型隔离</div>
      <div class="text">
        整段历史要在 Haiku 这边<br>
        <span class="em">从头算一遍</span>
      </div>
    </div>
    <div class="answer">
      <div class="label">真要切怎么办</div>
      <div class="text">用<span class="em">子 agent</span>，开一段干净 prompt 独立跑</div>
    </div>
  </div>
</body>
</html>
