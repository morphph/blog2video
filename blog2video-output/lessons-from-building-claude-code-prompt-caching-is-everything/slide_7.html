<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
      background: radial-gradient(circle at 50% 22%, rgba(59, 130, 246, 0.12), transparent 60%), #0D0D1A;
    }
    .eyebrow {
      font-size: 26px;
      color: #3B82F6;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 24px;
    }
    .headline {
      font-size: 72px;
      font-weight: 900;
      line-height: 1.16;
      letter-spacing: -1px;
      margin-bottom: 36px;
    }
    .headline .b { color: #3B82F6; }
    .compare {
      display: flex;
      gap: 22px;
      width: 100%;
      max-width: 940px;
      margin-bottom: 30px;
    }
    .card {
      flex: 1;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.22);
      border-radius: 14px;
      padding: 26px 24px;
      text-align: left;
    }
    .card.bad { border-left: 4px solid #EF4444; }
    .card.good { border-left: 4px solid #10B981; }
    .card .tag {
      font-size: 20px;
      letter-spacing: 2px;
      font-weight: 700;
      margin-bottom: 10px;
    }
    .card.bad .tag { color: #EF4444; }
    .card.good .tag { color: #10B981; }
    .card .title {
      font-size: 28px;
      font-weight: 900;
      color: #FFFFFF;
      line-height: 1.25;
      margin-bottom: 10px;
    }
    .card .desc {
      font-size: 20px;
      color: #B0B0CC;
      font-weight: 600;
      line-height: 1.45;
    }
    .principle {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.35);
      border-left: 4px solid #8B5CF6;
      border-radius: 12px;
      padding: 22px 30px;
      max-width: 940px;
      width: 100%;
      text-align: left;
    }
    .principle .label {
      font-size: 22px;
      color: #8B5CF6;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }
    .principle .text {
      font-size: 26px;
      color: #FFFFFF;
      font-weight: 700;
      line-height: 1.45;
    }
    .principle .text .em { color: #F59E0B; font-weight: 800; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="eyebrow">Plan Mode 的解法</div>
    <div class="headline">
      工具<span class="b">一个不删</span><br>
      用调用切状态
    </div>
    <div class="compare">
      <div class="card bad">
        <div class="tag">直觉做法</div>
        <div class="title">进入 Plan Mode<br>切换工具集</div>
        <div class="desc">改工具 = prefix 变 = 缓存全失效</div>
      </div>
      <div class="card good">
        <div class="tag">CLAUDE CODE</div>
        <div class="title">Plan Mode<br>本身就是工具</div>
        <div class="desc">EnterPlanMode / ExitPlanMode</div>
      </div>
    </div>
    <div class="principle">
      <div class="label">底层逻辑</div>
      <div class="text">
        状态切换不靠<span class="em">改工具集</span><br>
        靠<span class="em">工具调用</span>本身表达
      </div>
    </div>
  </div>
</body>
</html>
