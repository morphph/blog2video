<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
      background: radial-gradient(circle at 50% 22%, rgba(239, 68, 68, 0.12), transparent 60%), #0D0D1A;
    }
    .eyebrow {
      font-size: 26px;
      color: #EF4444;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 24px;
    }
    .headline {
      font-size: 72px;
      font-weight: 900;
      line-height: 1.18;
      letter-spacing: -1px;
      margin-bottom: 36px;
    }
    .headline .r { color: #EF4444; }
    .scene {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.25);
      border-left: 4px solid #6B7280;
      border-radius: 12px;
      padding: 20px 28px;
      max-width: 940px;
      width: 100%;
      text-align: left;
      margin-bottom: 18px;
    }
    .scene .label {
      font-size: 22px;
      color: #6B7280;
      letter-spacing: 2px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .scene .text {
      font-size: 24px;
      color: #B0B0CC;
      font-weight: 700;
      line-height: 1.4;
    }
    .scene .text .em { color: #FFFFFF; }
    .cost {
      background: #1A1A2E;
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-left: 4px solid #EF4444;
      border-radius: 12px;
      padding: 22px 28px;
      max-width: 940px;
      width: 100%;
      text-align: left;
      margin-bottom: 16px;
    }
    .cost .label {
      font-size: 22px;
      color: #EF4444;
      letter-spacing: 2px;
      font-weight: 700;
      margin-bottom: 10px;
    }
    .cost .text {
      font-size: 28px;
      color: #FFFFFF;
      font-weight: 700;
      line-height: 1.4;
    }
    .cost .text .em { color: #F59E0B; font-weight: 800; }
    .trap {
      background: #1A1A2E;
      border: 1px solid rgba(245, 158, 11, 0.35);
      border-left: 4px solid #F59E0B;
      border-radius: 12px;
      padding: 20px 28px;
      max-width: 940px;
      width: 100%;
      text-align: left;
    }
    .trap .label {
      font-size: 22px;
      color: #F59E0B;
      letter-spacing: 2px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .trap .text {
      font-size: 24px;
      color: #FFFFFF;
      font-weight: 700;
      line-height: 1.4;
    }
    .trap .text .em { color: #EF4444; font-weight: 800; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="eyebrow">压缩的陷阱</div>
    <div class="headline">
      "干净的总结"<br>
      恰恰<span class="r">最贵</span>
    </div>
    <div class="scene">
      <div class="label">直觉做法</div>
      <div class="text">
        <span class="em">另起一个 API call</span><br>
        新 system prompt + 整段历史 → 吐摘要
      </div>
    </div>
    <div class="cost">
      <div class="label">代价</div>
      <div class="text">
        prefix 从第一个 token 不同<br>
        父对话缓存<span class="em">一字节都用不上</span>
      </div>
    </div>
    <div class="trap">
      <div class="label">反向放大</div>
      <div class="text">越长越要压，越压<span class="em">这一刀越贵</span></div>
    </div>
  </div>
</body>
</html>
