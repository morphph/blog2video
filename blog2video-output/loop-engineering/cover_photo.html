<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 100px 72px 400px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
    }
    .glow {
      position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%);
      width: 1000px; height: 900px;
      background: radial-gradient(ellipse at center, rgba(139,92,246,0.2) 0%, rgba(13,13,26,0) 70%);
      pointer-events: none;
    }
    .series {
      font-size: 30px; color: #8B5CF6; letter-spacing: 3px;
      font-weight: 600; margin-bottom: 64px;
    }
    .title {
      font-size: 94px; font-weight: 900; line-height: 1.3;
      margin-bottom: 72px;
    }
    .title .hl { color: #F59E0B; }
    .source-pill {
      background: #1A1A30;
      border-radius: 100px; padding: 18px 44px;
      font-size: 22px; color: #6B6B80;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="glow"></div>
    <div class="series">精读AI · LOOP ENGINEERING</div>
    <div class="title">Claude Code之父：<br><span class="hl">「我不再写</span><br><span class="hl">提示词了」</span></div>
    <div class="source-pill">Loop Engineering — Boris Cherny · Addy Osmani · Anthropic</div>
  </div>
</body>
</html>
