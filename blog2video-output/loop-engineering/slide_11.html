<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
    }
    .label {
      font-size: 28px; color: #8B5CF6; letter-spacing: 3px; font-weight: 600;
      margin-bottom: 20px;
    }
    .title { font-size: 60px; font-weight: 800; margin-bottom: 16px; }
    .sub { font-size: 30px; color: #F59E0B; font-weight: 700; margin-bottom: 44px; }
    .cols { width: 100%; display: flex; gap: 20px; }
    .col {
      flex: 1; background: #1A1A2E; border-radius: 12px;
      padding: 34px 28px; text-align: left;
    }
    .col.claude { border: 1px solid rgba(139,92,246,0.45); border-top: 5px solid #8B5CF6; }
    .col.codex { border: 1px solid rgba(59,130,246,0.4); border-top: 5px solid #3B82F6; }
    .col .head { font-size: 32px; font-weight: 800; margin-bottom: 24px; text-align: center; }
    .col.claude .head { color: #8B5CF6; }
    .col.codex .head { color: #3B82F6; }
    .item { margin-bottom: 20px; }
    .item:last-child { margin-bottom: 0; }
    .item .name { font-size: 27px; font-weight: 700; margin-bottom: 8px; }
    .item .desc { font-size: 23px; color: #B0B0CC; line-height: 1.45; }
    code {
      font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace;
      font-size: 23px; color: #A78BFA;
      background: rgba(139,92,246,0.12);
      border: 1px solid rgba(139,92,246,0.3);
      border-radius: 8px; padding: 2px 10px;
    }
    .col.codex code { color: #7EB3F7; background: rgba(59,130,246,0.12); border-color: rgba(59,130,246,0.3); }
    .punch {
      width: 100%; margin-top: 40px;
      background: rgba(245,158,11,0.08);
      border: 1px dashed rgba(245,158,11,0.5);
      border-radius: 12px; padding: 26px 36px;
      font-size: 30px; font-weight: 700; color: #F59E0B; line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="label">模块 5 / 5 · SUB-AGENTS</div>
    <div class="title">早上埋的伏笔，揭开</div>
    <div class="sub">Maker / Checker 分离：写修复的、审修复的，是两个</div>
    <div class="cols">
      <div class="col claude">
        <div class="head">Claude Code</div>
        <div class="item">
          <div class="name">定义在<br><code>.claude/agents/</code></div>
        </div>
        <div class="item">
          <div class="name">Agent Team</div>
          <div class="desc">子智能体能组队<br>互相传活</div>
        </div>
      </div>
      <div class="col codex">
        <div class="head">Codex</div>
        <div class="item">
          <div class="name">对应<br><code>.codex/agents/</code></div>
        </div>
        <div class="item">
          <div class="name">TOML 文件</div>
          <div class="desc">用 TOML 格式<br>定义子智能体</div>
        </div>
      </div>
    </div>
    <div class="punch">为什么必须分开？<br>下一节，用一个真实系统给你看证据</div>
  </div>
</body>
</html>
