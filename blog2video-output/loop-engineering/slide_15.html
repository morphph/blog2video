<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
    }
    .label {
      font-size: 28px; color: #EF4444; letter-spacing: 3px; font-weight: 600;
      margin-bottom: 20px;
    }
    .title { font-size: 60px; font-weight: 800; margin-bottom: 52px; }
    .bug {
      width: 100%; background: #1A1A2E;
      border: 1px solid rgba(239,68,68,0.4);
      border-left: 5px solid #EF4444;
      border-radius: 12px; padding: 32px 36px;
      text-align: left; margin-bottom: 24px;
    }
    .bug .head {
      font-size: 30px; font-weight: 700; margin-bottom: 14px;
      display: flex; align-items: center; gap: 14px;
    }
    .bug .head .n {
      background: rgba(239,68,68,0.18); color: #EF4444;
      font-size: 23px; font-weight: 800;
      border-radius: 100px; padding: 4px 18px;
    }
    .bug .desc { font-size: 26px; color: #B0B0CC; line-height: 1.55; margin-bottom: 14px; }
    .bug .cause {
      background: #13131F; border-radius: 8px; padding: 18px 22px;
      font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace;
      font-size: 24px; line-height: 1.6; color: #B0B0CC;
    }
    .bug .cause .fn { color: #F59E0B; }
    .bug .cause .err { color: #EF4444; font-weight: 700; }
    .zh-note { font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="label">EVALUATOR 的战绩</div>
    <div class="title">它能抓到多具体的 bug？</div>
    <div class="bug">
      <div class="head"><span class="n">真实例子 1</span>矩形填充工具</div>
      <div class="desc">只在拖拽的起点和终点放了图块，中间全空</div>
      <div class="cause"><span class="fn">fillRectangle()</span> 函数存在<br><span class="err">但 mouseUp 时没被正确触发</span></div>
    </div>
    <div class="bug">
      <div class="head"><span class="n">真实例子 2</span>路由顺序错误</div>
      <div class="desc">PUT <span style="color:#A78BFA">/frames/reorder</span> 定义在 <span style="color:#A78BFA">/{frame_id}</span> 之后</div>
      <div class="cause"><span class="zh-note">框架把 </span><span class="fn">reorder</span><span class="zh-note"> 当成整数 ID 解析</span><br><span class="err">→ 422 Unprocessable Entity</span></div>
    </div>
  </div>
</body>
</html>
