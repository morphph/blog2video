<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
    }
    .qmark {
      font-size: 130px; font-weight: 900; color: #8B5CF6;
      line-height: 0.8; margin-bottom: 8px; font-family: Georgia, serif;
    }
    .quote {
      font-size: 44px; font-weight: 700; line-height: 1.6;
      margin-bottom: 18px;
    }
    .quote .hl { color: #EF4444; }
    .src { font-size: 26px; color: #6B7280; margin-bottom: 48px; }
    .costs { width: 100%; display: flex; gap: 18px; margin-bottom: 24px; }
    .c {
      flex: 1; background: #1A1A2E;
      border: 1px solid rgba(139,92,246,0.25);
      border-radius: 12px; padding: 26px 12px;
    }
    .c .num { font-size: 58px; font-weight: 800; margin-bottom: 8px; }
    .c .what { font-size: 23px; color: #B0B0CC; line-height: 1.4; }
    .c1 .num { color: #6B7280; }
    .c2 .num { color: #3B82F6; }
    .c3 { border-color: rgba(245,158,11,0.45); }
    .c3 .num { color: #F59E0B; }
    .win {
      width: 100%; background: rgba(16,185,129,0.08);
      border: 1px solid rgba(16,185,129,0.45);
      border-radius: 12px; padding: 26px 32px; margin-bottom: 28px;
    }
    .win .num { font-size: 64px; font-weight: 800; color: #10B981; }
    .win .what { font-size: 26px; color: #B0B0CC; margin-top: 6px; }
    .punch {
      width: 100%;
      background: rgba(245,158,11,0.08);
      border: 1px solid rgba(245,158,11,0.45);
      border-radius: 12px; padding: 26px 36px;
      font-size: 30px; font-weight: 700; color: #F59E0B; line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="qmark">“</div>
    <div class="quote">让模型评判自己的工作，<br>它会<span class="hl">自信地称赞自己</span>，<br>哪怕质量明显平庸</div>
    <div class="src">—— 团队原话 · 自我批评永远拿不到这种反馈</div>
    <div class="costs">
      <div class="c c1"><div class="num">1×</div><div class="what">标准对话<br>token 消耗</div></div>
      <div class="c c2"><div class="num">4×</div><div class="what">单智能体<br>循环</div></div>
      <div class="c c3"><div class="num">15×</div><div class="what">多智能体<br>系统</div></div>
    </div>
    <div class="win">
      <div class="num">+90.2%</div>
      <div class="what">多智能体在内部评估里比单智能体好这么多</div>
    </div>
    <div class="punch">15 倍不是浪费——你在买一个<br>不会给自己放水的裁判</div>
  </div>
</body>
</html>
