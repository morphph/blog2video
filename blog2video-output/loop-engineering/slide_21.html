<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
    }
    .label {
      font-size: 28px; color: #EF4444; letter-spacing: 3px; font-weight: 600;
      margin-bottom: 20px;
    }
    .title { font-size: 60px; font-weight: 800; margin-bottom: 52px; }
    .list { width: 100%; display: flex; flex-direction: column; gap: 20px; }
    .item {
      width: 100%; background: #1A1A2E;
      border: 1px solid rgba(239,68,68,0.35);
      border-left: 5px solid #EF4444;
      border-radius: 12px; padding: 30px 34px;
      text-align: left; display: flex; gap: 24px; align-items: flex-start;
    }
    .item .n {
      flex-shrink: 0; width: 54px; height: 54px; border-radius: 50%;
      background: rgba(239,68,68,0.15); color: #EF4444;
      font-size: 28px; font-weight: 800;
      display: flex; align-items: center; justify-content: center;
    }
    .item .name { font-size: 31px; font-weight: 700; margin-bottom: 10px; }
    .item .desc { font-size: 25px; color: #B0B0CC; line-height: 1.55; }
    .item .desc .ok { color: #10B981; font-weight: 600; }
    .item .desc .bad { color: #EF4444; font-weight: 600; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="label">避坑指南</div>
    <div class="title">新手最容易踩的三个坑</div>
    <div class="list">
      <div class="item">
        <div class="n">1</div>
        <div>
          <div class="name">工具给太多，描述写太模糊</div>
          <div class="desc">人类工程师都说不清用哪个，智能体也选不对<br><span class="ok">少而精的工具集</span> ≫ 大而全的工具库</div>
        </div>
      </div>
      <div class="item">
        <div class="n">2</div>
        <div>
          <div class="name">工具出错：返回错误字符串，不要抛异常</div>
          <div class="desc"><span class="bad">异常会杀死循环本身</span><br><span class="ok">错误字符串</span>才给模型自己纠错的机会</div>
        </div>
      </div>
      <div class="item">
        <div class="n">3</div>
        <div>
          <div class="name">保留失败的痕迹，不要清理现场</div>
          <div class="desc">失败记录是模型避免重复尝试的唯一证据<br><span class="bad">擦掉失败 = 擦掉证据</span></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
