<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
    }
    .label {
      font-size: 28px; color: #10B981; letter-spacing: 3px; font-weight: 600;
      margin-bottom: 20px;
    }
    .title { font-size: 60px; font-weight: 800; margin-bottom: 48px; }
    .action {
      width: 100%; background: #1A1A2E;
      border: 1px solid rgba(16,185,129,0.45);
      border-left: 6px solid #10B981;
      border-radius: 12px; padding: 36px 40px;
      text-align: left; margin-bottom: 24px;
    }
    .action .step { font-size: 30px; line-height: 1.7; color: #B0B0CC; }
    .action .step strong { color: #FFFFFF; }
    code {
      font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace;
      font-size: 27px; color: #6EE7B7;
      background: rgba(16,185,129,0.12);
      border: 1px solid rgba(16,185,129,0.35);
      border-radius: 8px; padding: 2px 12px;
    }
    .first-loop {
      width: 100%; background: rgba(139,92,246,0.1);
      border: 1px solid rgba(139,92,246,0.45);
      border-radius: 12px; padding: 28px 36px;
      font-size: 34px; font-weight: 800; color: #A78BFA;
      margin-bottom: 40px;
    }
    .cta {
      width: 100%; background: #1A1A2E;
      border: 1px solid rgba(245,158,11,0.4);
      border-radius: 12px; padding: 26px 34px;
      font-size: 27px; color: #B0B0CC; line-height: 1.55; margin-bottom: 40px;
    }
    .cta strong { color: #F59E0B; }
    .slogan {
      font-size: 34px; font-weight: 700; line-height: 1.5;
    }
    .slogan .hl { color: #8B5CF6; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="label">今晚就能做的最小动作</div>
    <div class="title">你的第一个循环</div>
    <div class="action">
      <div class="step">① 打开 <strong>Claude Code</strong></div>
      <div class="step">② 把你本来要一路盯着的事，写成一个 <code>/goal</code></div>
      <div class="step">③ 给它一个<strong>机器能检查的完成条件</strong></div>
    </div>
    <div class="first-loop">你的第一个循环，就这么开始</div>
    <div class="cta">📄 完整文字版指南在<strong>公众号文章</strong>里<br>所有命令、参数和成本数据，对照着搭</div>
    <div class="slogan">AI 世界很吵<br><span class="hl">精读一篇，胜过刷一百条</span></div>
  </div>
</body>
</html>
