<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
    }
    .label {
      font-size: 28px; color: #8B5CF6; letter-spacing: 3px; font-weight: 600;
      margin-bottom: 20px;
    }
    .title { font-size: 60px; font-weight: 800; margin-bottom: 48px; }
    .pair { width: 100%; display: flex; gap: 20px; margin-bottom: 12px; }
    .agent-card {
      flex: 1; background: #1A1A2E; border-radius: 12px;
      padding: 30px 26px; text-align: center;
    }
    .agent-card.maker { border: 1px solid rgba(59,130,246,0.4); border-top: 5px solid #3B82F6; }
    .agent-card.checker { border: 1px solid rgba(16,185,129,0.4); border-top: 5px solid #10B981; }
    .agent-card .icon { font-size: 52px; margin-bottom: 14px; }
    .agent-card .role { font-size: 34px; font-weight: 800; margin-bottom: 10px; }
    .agent-card.maker .role { color: #3B82F6; }
    .agent-card.checker .role { color: #10B981; }
    .agent-card .desc { font-size: 25px; color: #B0B0CC; line-height: 1.45; }
    .foreshadow {
      width: 100%; background: rgba(245,158,11,0.08);
      border: 1px dashed rgba(245,158,11,0.5);
      border-radius: 12px; padding: 22px 32px;
      font-size: 30px; font-weight: 700; color: #F59E0B;
      margin-bottom: 32px;
    }
    .steps { width: 100%; display: flex; flex-direction: column; gap: 14px; }
    .row {
      width: 100%; background: #1A1A2E;
      border: 1px solid rgba(139,92,246,0.25);
      border-left: 5px solid #8B5CF6;
      border-radius: 12px; padding: 22px 30px;
      font-size: 29px; font-weight: 600; text-align: left;
      display: flex; align-items: center; gap: 20px;
    }
    .row .ic { font-size: 36px; flex-shrink: 0; }
    code {
      font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace;
      font-size: 26px; color: #A78BFA;
      background: rgba(139,92,246,0.12);
      border: 1px solid rgba(139,92,246,0.3);
      border-radius: 8px; padding: 2px 10px;
    }
    .punch {
      width: 100%; margin-top: 34px;
      background: rgba(139,92,246,0.1);
      border: 1px solid rgba(139,92,246,0.45);
      border-radius: 12px; padding: 26px 36px;
      font-size: 33px; font-weight: 700;
    }
    .punch .big { color: #8B5CF6; font-size: 44px; font-weight: 900; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="label">一个循环的一天 · 白天到夜里</div>
    <div class="title">写的和查的，不是同一个</div>
    <div class="pair">
      <div class="agent-card maker">
        <div class="icon">✍️</div>
        <div class="role">子智能体 A</div>
        <div class="desc">在 worktree 里<br>起草修复</div>
      </div>
      <div class="agent-card checker">
        <div class="icon">🔍</div>
        <div class="role">子智能体 B</div>
        <div class="desc">按项目规范和测试<br>审查这份修复</div>
      </div>
    </div>
    <div class="foreshadow">⚡ 全片最重要的伏笔，记住这个细节</div>
    <div class="steps">
      <div class="row"><span class="ic">🔌</span><span>审查通过 → <code>MCP</code> 自动开 PR、更新工单</span></div>
      <div class="row"><span class="ic">📥</span><span>处理不了的 → 落进收件箱，等人来看</span></div>
      <div class="row"><span class="ic">💾</span><span>状态文件 = 循环唯一的记忆，明天接着跑</span></div>
    </div>
    <div class="punch">这一天里，你出现了几次？<span class="big">一次</span></div>
  </div>
</body>
</html>
