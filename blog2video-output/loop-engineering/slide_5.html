<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
    }
    .label {
      font-size: 28px; color: #8B5CF6; letter-spacing: 3px; font-weight: 600;
      margin-bottom: 20px;
    }
    .title { font-size: 62px; font-weight: 800; margin-bottom: 32px; }
    .concept {
      width: 100%; background: #1A1A2E;
      border: 1px solid rgba(139,92,246,0.3);
      border-left: 6px solid #8B5CF6;
      border-radius: 12px; padding: 32px 36px;
      font-size: 32px; font-weight: 600; line-height: 1.55;
      margin-bottom: 48px;
    }
    .concept .hl { color: #8B5CF6; font-weight: 800; }
    .concept .metaphor { display: block; font-size: 26px; color: #B0B0CC; font-weight: 400; margin-top: 14px; }
    .timeline { width: 100%; display: flex; flex-direction: column; gap: 14px; }
    .tl-row {
      width: 100%; display: flex; align-items: center; gap: 24px;
      background: #1A1A2E; border: 1px solid rgba(139,92,246,0.2);
      border-radius: 12px; padding: 22px 30px; text-align: left;
    }
    .tl-row .year {
      flex-shrink: 0; width: 130px;
      font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace;
      font-size: 36px; font-weight: 800;
    }
    .tl-row .what { font-size: 30px; font-weight: 600; line-height: 1.4; }
    .y23 .year { color: #6B7280; } .y23 .what { color: #B0B0CC; }
    .y24 .year { color: #3B82F6; }
    .y25 .year { color: #10B981; }
    .y26 { border: 1px solid rgba(245,158,11,0.5); background: rgba(245,158,11,0.08); }
    .y26 .year { color: #F59E0B; }
    .y26 .what .now {
      display: inline-block; margin-left: 14px;
      background: #F59E0B; color: #0D0D1A;
      font-size: 22px; font-weight: 800; border-radius: 100px; padding: 3px 14px;
    }
    .src { margin-top: 32px; font-size: 24px; color: #6B7280; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="label">FIRST PRINCIPLE</div>
    <div class="title">Loop Engineering<br>是这条路的收敛点</div>
    <div class="concept">
      不是把<span class="hl">一次运行</span>做好，<br>而是设计一个系统，<span class="hl">持续调度</span>这些运行
      <span class="metaphor">🚗 从手动开车 → 运营整个自动驾驶车队</span>
    </div>
    <div class="timeline">
      <div class="tl-row y23"><div class="year">2023</div><div class="what">你写代码</div></div>
      <div class="tl-row y24"><div class="year">2024</div><div class="what">你提示 Claude 写代码</div></div>
      <div class="tl-row y25"><div class="year">2025</div><div class="what">你写循环，让循环提示 Claude</div></div>
      <div class="tl-row y26"><div class="year">2026</div><div class="what">你构建系统，运行这些循环<span class="now">你刚看完的那一天</span></div></div>
    </div>
    <div class="src">—— Boris Cherny 的时间线</div>
  </div>
</body>
</html>
