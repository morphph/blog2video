<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
    }
    .label {
      font-size: 28px; color: #3B82F6; letter-spacing: 3px; font-weight: 600;
      margin-bottom: 20px;
    }
    .title { font-size: 60px; font-weight: 800; margin-bottom: 16px; }
    .pain { font-size: 28px; color: #B0B0CC; margin-bottom: 44px; line-height: 1.5; }
    .pain .red { color: #EF4444; font-weight: 700; }
    .cols { width: 100%; display: flex; gap: 20px; margin-bottom: 28px; }
    .col {
      flex: 1; background: #1A1A2E; border-radius: 12px;
      padding: 30px 26px; text-align: left;
      display: flex; flex-direction: column;
    }
    .col.codex { border: 1px solid rgba(59,130,246,0.4); border-top: 5px solid #3B82F6; }
    .col.claude { border: 1px solid rgba(139,92,246,0.45); border-top: 5px solid #8B5CF6; }
    .col .head { font-size: 32px; font-weight: 800; margin-bottom: 22px; text-align: center; }
    .col.codex .head { color: #3B82F6; }
    .col.claude .head { color: #8B5CF6; }
    .item { margin-bottom: 18px; }
    .item:last-child { margin-bottom: 0; }
    code {
      font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace;
      font-size: 26px; color: #A78BFA;
      background: rgba(139,92,246,0.12);
      border: 1px solid rgba(139,92,246,0.3);
      border-radius: 8px; padding: 2px 10px;
    }
    .col.codex code { color: #7EB3F7; background: rgba(59,130,246,0.12); border-color: rgba(59,130,246,0.3); }
    .item .name { font-size: 28px; font-weight: 700; margin-bottom: 6px; }
    .item .desc { font-size: 23px; color: #B0B0CC; line-height: 1.45; }
    .fav {
      display: inline-block; background: rgba(245,158,11,0.18);
      color: #F59E0B; font-size: 20px; font-weight: 700;
      border-radius: 100px; padding: 2px 12px; margin-left: 8px;
    }
    .footer {
      width: 100%; background: rgba(16,185,129,0.08);
      border: 1px solid rgba(16,185,129,0.4);
      border-radius: 12px; padding: 24px 32px;
      font-size: 28px; font-weight: 600; color: #10B981;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="label">模块 1 / 5 · AUTOMATION</div>
    <div class="title">没有触发器，就不叫循环</div>
    <div class="pain">靠你记得去启动的循环，<span class="red">不是循环</span></div>
    <div class="cols">
      <div class="col codex">
        <div class="head">Codex</div>
        <div class="item">
          <div class="name">Automations 面板</div>
          <div class="desc">配好项目＋提示词＋频率</div>
        </div>
        <div class="item">
          <div class="name">自动归档</div>
          <div class="desc">没发现问题的运行<br>不来烦你</div>
        </div>
      </div>
      <div class="col claude">
        <div class="head">Claude Code</div>
        <div class="item">
          <div class="name"><code>/loop</code></div>
          <div class="desc">任务按节奏反复跑</div>
        </div>
        <div class="item">
          <div class="name">Hooks</div>
          <div class="desc">生命周期关键节点挂命令</div>
        </div>
        <div class="item">
          <div class="name"><code>/goal</code><span class="fav">案例里讲</span></div>
          <div class="desc">最喜欢的设计，按下不表</div>
        </div>
      </div>
    </div>
    <div class="footer">🌙 想让循环过夜？接上 GitHub Actions 这类 CI 设施</div>
  </div>
</body>
</html>
