<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
    }
    .label {
      font-size: 28px; color: #F59E0B; letter-spacing: 3px; font-weight: 600;
      margin-bottom: 20px;
    }
    .title { font-size: 60px; font-weight: 800; margin-bottom: 16px; }
    .pain { font-size: 28px; color: #B0B0CC; margin-bottom: 44px; line-height: 1.5; }
    .pain .red { color: #EF4444; font-weight: 700; }
    .folder {
      width: 100%; background: #13131F;
      border: 1px solid rgba(245,158,11,0.35);
      border-radius: 12px; padding: 36px 44px;
      text-align: left; margin-bottom: 28px;
      font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace;
    }
    .folder .line { font-size: 30px; line-height: 2.0; color: #B0B0CC; }
    .folder .line .name { color: #F59E0B; font-weight: 700; }
    .folder .line .zh {
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif;
      font-size: 24px; color: #6B7280; margin-left: 18px;
    }
    .trait {
      width: 100%; background: #1A1A2E;
      border: 1px solid rgba(139,92,246,0.25);
      border-left: 5px solid #3B82F6;
      border-radius: 12px; padding: 22px 32px;
      font-size: 27px; font-weight: 600; text-align: left; margin-bottom: 16px;
    }
    .punch {
      width: 100%; margin-top: 24px;
      background: rgba(245,158,11,0.08);
      border: 1px solid rgba(245,158,11,0.45);
      border-radius: 12px; padding: 30px 36px;
      font-size: 34px; font-weight: 800; color: #F59E0B; line-height: 1.45;
    }
    .punch .sub { display: block; font-size: 25px; font-weight: 400; color: #B0B0CC; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="label">模块 3 / 5 · SKILL</div>
    <div class="title">打包好的项目知识</div>
    <div class="pain">解决的失败模式：项目里的门道，<span class="red">每开新会话都得重教一遍</span></div>
    <div class="folder">
      <div class="line"><span class="name">📁 my-skill/</span></div>
      <div class="line">&nbsp;&nbsp;├─ <span class="name">SKILL.md</span><span class="zh">写清指令</span></div>
      <div class="line">&nbsp;&nbsp;├─ scripts/<span class="zh">配套脚本</span></div>
      <div class="line">&nbsp;&nbsp;└─ references/<span class="zh">参考资料</span></div>
    </div>
    <div class="trait">✅ 两边格式完全一样：Claude Code = Codex</div>
    <div class="trait">✅ 可手动调用，也能按任务描述自动触发</div>
    <div class="punch">反直觉经验：<br>技能描述要写得越「无聊」越好<span class="sub">精确、朴素，自动匹配才准；写得花哨，反而触发不准</span></div>
  </div>
</body>
</html>
