<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 100px 72px 400px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .series-label {
      font-size: 30px;
      color: #8B5CF6;
      letter-spacing: 3px;
      margin-bottom: 56px;
      font-weight: 600;
    }
    .main-title {
      font-size: 92px;
      font-weight: 900;
      line-height: 1.25;
      margin-bottom: 24px;
    }
    .main-title .highlight {
      color: #EF4444;
    }
    .sub-title {
      font-size: 72px;
      font-weight: 900;
      line-height: 1.25;
      margin-bottom: 64px;
      color: #F59E0B;
    }
    .source-pill {
      background: #1A1A30;
      color: #6B6B80;
      font-size: 26px;
      padding: 14px 32px;
      border-radius: 100px;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="series-label">精读AI · Agent架构</div>
    <div class="main-title">Anthropic把Agent<br>拆成"<span class="highlight">脑</span>"和"<span class="highlight">手</span>"</div>
    <div class="sub-title">性能暴涨90%？</div>
    <div class="source-pill">ANTHROPIC《Scaling Managed Agents》</div>
  </div>
</body>
</html>
