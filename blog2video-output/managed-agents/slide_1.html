<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .series-label {
      font-size: 28px;
      color: #8B5CF6;
      letter-spacing: 3px;
      margin-bottom: 40px;
      font-weight: 600;
    }
    .main-title {
      font-size: 80px;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 48px;
    }
    .main-title .highlight {
      color: #EF4444;
    }
    .source-pill {
      background: #1A1A30;
      color: #8B8BA0;
      font-size: 24px;
      padding: 12px 28px;
      border-radius: 100px;
      margin-bottom: 56px;
    }
    .pain-cards {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 12px;
    }
    .pain-card {
      background: #1A1A2E;
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-left: 4px solid #EF4444;
      border-radius: 12px;
      padding: 20px 28px;
      font-size: 30px;
      color: #F0F0F0;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .pain-icon {
      font-size: 28px;
      color: #EF4444;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="series-label">精读AI · Agent架构</div>
    <div class="main-title">
      把Agent的<br>
      "<span class="highlight">脑</span>"和"<span class="highlight">手</span>"拆开
    </div>
    <div class="source-pill">ANTHROPIC《Scaling Managed Agents》</div>
    <div class="pain-cards">
      <div class="pain-card">
        <span class="pain-icon">✕</span>
        harness 补丁变废代码
      </div>
      <div class="pain-card">
        <span class="pain-icon">✕</span>
        容器挂了连调试都不行
      </div>
      <div class="pain-card">
        <span class="pain-icon">✕</span>
        客户要连VPC？先互联网络
      </div>
    </div>
  </div>
</body>
</html>
