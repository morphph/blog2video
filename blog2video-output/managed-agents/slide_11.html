<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      position: relative;
    }
    .slide-label {
      font-size: 22px;
      color: #8B5CF6;
      letter-spacing: 2px;
      margin-bottom: 24px;
      font-weight: 600;
    }
    .title {
      font-size: 46px;
      font-weight: 800;
      margin-bottom: 40px;
      line-height: 1.3;
    }
    .title .purple { color: #8B5CF6; }
    .split-row {
      width: 100%;
      display: flex;
      gap: 16px;
      margin-bottom: 28px;
    }
    .split-card {
      flex: 1;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 28px 20px;
    }
    .split-card.storage {
      border-top: 4px solid #3B82F6;
    }
    .split-card.manage {
      border-top: 4px solid #F59E0B;
    }
    .split-header {
      font-size: 20px;
      color: #6B7280;
      margin-bottom: 10px;
      font-weight: 600;
      letter-spacing: 1px;
    }
    .split-name {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 14px;
    }
    .split-name.blue { color: #3B82F6; }
    .split-name.yellow { color: #F59E0B; }
    .split-props {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .split-prop {
      font-size: 24px;
      color: #B0B0CC;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .prop-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .prop-dot.blue { background: #3B82F6; }
    .prop-dot.yellow { background: #F59E0B; }
    .why-box {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-left: 4px solid #8B5CF6;
      border-radius: 12px;
      padding: 24px 28px;
    }
    .why-label {
      font-size: 20px;
      color: #6B7280;
      font-weight: 600;
      margin-bottom: 10px;
    }
    .why-text {
      font-size: 28px;
      color: #FFFFFF;
      line-height: 1.6;
    }
    .why-text .highlight {
      color: #8B5CF6;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="slide-label">设计巧思</div>
    <div class="title"><span class="purple">存储</span> vs <span class="purple">管理</span> 分离</div>
    <div class="split-row">
      <div class="split-card storage">
        <div class="split-header">存储</div>
        <div class="split-name blue">Session</div>
        <div class="split-props">
          <div class="split-prop"><div class="prop-dot blue"></div>持久</div>
          <div class="split-prop"><div class="prop-dot blue"></div>可查询</div>
          <div class="split-prop"><div class="prop-dot blue"></div>数据不丢</div>
        </div>
      </div>
      <div class="split-card manage">
        <div class="split-header">管理</div>
        <div class="split-name yellow">Harness</div>
        <div class="split-props">
          <div class="split-prop"><div class="prop-dot yellow"></div>任意变换</div>
          <div class="split-prop"><div class="prop-dot yellow"></div>可替换</div>
          <div class="split-prop"><div class="prop-dot yellow"></div>随时升级</div>
        </div>
      </div>
    </div>
    <div class="why-box">
      <div class="why-label">为什么要拆？</div>
      <div class="why-text">未来模型需要什么样的 context engineering <span class="highlight">无法预测</span><br>数据在那里，怎么用 harness 说了算</div>
    </div>
  </div>
</body>
</html>
