<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    .slide-label {
      font-size: 22px;
      color: #10B981;
      letter-spacing: 2px;
      margin-bottom: 24px;
      font-weight: 600;
      align-self: flex-start;
    }
    .title {
      font-size: 48px;
      font-weight: 800;
      margin-bottom: 44px;
      width: 100%;
      text-align: left;
      line-height: 1.3;
    }
    .title .green { color: #10B981; }
    .metrics {
      width: 100%;
      display: flex;
      gap: 20px;
      margin-bottom: 36px;
    }
    .metric {
      flex: 1;
      background: #1A1A2E;
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 12px;
      padding: 32px 20px;
      text-align: center;
    }
    .metric-label {
      font-size: 22px;
      color: #6B7280;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .metric-value {
      font-size: 72px;
      font-weight: 800;
      color: #10B981;
      line-height: 1;
      margin-bottom: 8px;
    }
    .metric-unit {
      font-size: 36px;
      color: #10B981;
      font-weight: 700;
    }
    .metric-desc {
      font-size: 20px;
      color: #B0B0CC;
      margin-top: 8px;
    }
    .metric.highlight {
      border: 2px solid rgba(16, 185, 129, 0.5);
      background: linear-gradient(180deg, rgba(16, 185, 129, 0.08) 0%, #1A1A2E 100%);
    }
    .old-new {
      width: 100%;
      display: flex;
      gap: 16px;
      margin-bottom: 28px;
    }
    .old-card {
      flex: 1;
      background: #1A1A2E;
      border: 1px solid rgba(239, 68, 68, 0.2);
      border-top: 3px solid #EF4444;
      border-radius: 12px;
      padding: 20px 16px;
      text-align: center;
    }
    .new-card {
      flex: 1;
      background: #1A1A2E;
      border: 1px solid rgba(16, 185, 129, 0.2);
      border-top: 3px solid #10B981;
      border-radius: 12px;
      padding: 20px 16px;
      text-align: center;
    }
    .card-header {
      font-size: 20px;
      color: #6B7280;
      font-weight: 600;
      margin-bottom: 10px;
    }
    .card-body {
      font-size: 24px;
      line-height: 1.5;
    }
    .card-body.red { color: #EF4444; }
    .card-body.green { color: #10B981; }
    .insight-text {
      font-size: 26px;
      color: #B0B0CC;
      text-align: center;
      line-height: 1.5;
    }
    .insight-text .em {
      color: #FFFFFF;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="slide-label">性能红利</div>
    <div class="title">TTFT <span class="green">断崖式下降</span></div>
    <div class="old-new">
      <div class="old-card">
        <div class="card-header">旧架构</div>
        <div class="card-body red">每次都要<br>拉容器 → 克隆 → 启动</div>
      </div>
      <div class="new-card">
        <div class="card-header">新架构</div>
        <div class="card-body green">容器按需分配<br>推理立即开始</div>
      </div>
    </div>
    <div class="metrics">
      <div class="metric">
        <div class="metric-label">p50 TTFT</div>
        <div class="metric-value">60<span class="metric-unit">%</span></div>
        <div class="metric-desc">延迟下降</div>
      </div>
      <div class="metric highlight">
        <div class="metric-label">p95 TTFT</div>
        <div class="metric-value">90<span class="metric-unit">%+</span></div>
        <div class="metric-desc">延迟下降</div>
      </div>
    </div>
    <div class="insight-text">不是加速容器，是<span class="em">消除不必要的依赖</span></div>
  </div>
</body>
</html>
