<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      position: relative;
    }
    .slide-label {
      font-size: 22px;
      color: #8B5CF6;
      letter-spacing: 2px;
      margin-bottom: 24px;
      font-weight: 600;
    }
    .title {
      font-size: 52px;
      font-weight: 800;
      margin-bottom: 44px;
      line-height: 1.3;
    }
    .title .purple { color: #8B5CF6; }
    .diagram {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      margin-bottom: 32px;
    }
    .brains-row {
      display: flex;
      gap: 16px;
    }
    .brain-box {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-top: 4px solid #8B5CF6;
      border-radius: 12px;
      padding: 20px 28px;
      text-align: center;
    }
    .brain-emoji {
      font-size: 32px;
      margin-bottom: 6px;
    }
    .brain-label {
      font-size: 22px;
      color: #8B5CF6;
      font-weight: 700;
    }
    .connector {
      display: flex;
      align-items: center;
      gap: 0;
    }
    .conn-line {
      width: 80px;
      height: 2px;
      background: #6B7280;
    }
    .conn-down {
      width: 2px;
      height: 32px;
      background: #6B7280;
      margin: 0 auto;
    }
    .conn-text {
      font-size: 20px;
      color: #6B7280;
      font-style: italic;
    }
    .sandbox-box {
      background: #1A1A2E;
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-top: 4px solid #F59E0B;
      border-radius: 12px;
      padding: 20px 40px;
      text-align: center;
    }
    .sandbox-emoji {
      font-size: 32px;
      margin-bottom: 6px;
    }
    .sandbox-label {
      font-size: 22px;
      color: #F59E0B;
      font-weight: 700;
    }
    .features {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .feature {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .feature-check {
      color: #10B981;
      font-size: 24px;
      font-weight: 800;
      flex-shrink: 0;
    }
    .feature-text {
      font-size: 28px;
      color: #F0F0F0;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="slide-label">扩展能力</div>
    <div class="title"><span class="purple">多脑</span>：无状态扩展</div>
    <div class="diagram">
      <div class="brains-row">
        <div class="brain-box">
          <div class="brain-emoji">🧠</div>
          <div class="brain-label">Harness A</div>
        </div>
        <div class="brain-box">
          <div class="brain-emoji">🧠</div>
          <div class="brain-label">Harness B</div>
        </div>
        <div class="brain-box">
          <div class="brain-emoji">🧠</div>
          <div class="brain-label">Harness C</div>
        </div>
      </div>
      <div class="conn-text">按需连接 ↓</div>
      <div class="sandbox-box">
        <div class="sandbox-emoji">📦</div>
        <div class="sandbox-label">Sandbox (按需分配)</div>
      </div>
    </div>
    <div class="features">
      <div class="feature">
        <div class="feature-check">+</div>
        <div class="feature-text">无状态，启动多个即可</div>
      </div>
      <div class="feature">
        <div class="feature-check">+</div>
        <div class="feature-text">不独占容器</div>
      </div>
      <div class="feature">
        <div class="feature-check">+</div>
        <div class="feature-text">VPC → 远程工具调用解决</div>
      </div>
    </div>
  </div>
</body>
</html>
