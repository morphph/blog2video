<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      position: relative;
    }
    .slide-label {
      font-size: 22px;
      color: #F59E0B;
      letter-spacing: 2px;
      margin-bottom: 24px;
      font-weight: 600;
    }
    .title {
      font-size: 52px;
      font-weight: 800;
      margin-bottom: 40px;
      line-height: 1.3;
    }
    .title .yellow { color: #F59E0B; }
    .interface-box {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 20px 24px;
      text-align: center;
      margin-bottom: 24px;
    }
    .interface-code {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 26px;
      color: #10B981;
      font-weight: 600;
    }
    .hands-grid {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 28px;
    }
    .hand-card {
      background: #1A1A2E;
      border: 1px solid rgba(245, 158, 11, 0.2);
      border-radius: 12px;
      padding: 22px 20px;
      text-align: center;
    }
    .hand-icon {
      font-size: 36px;
      margin-bottom: 8px;
    }
    .hand-name {
      font-size: 24px;
      color: #F59E0B;
      font-weight: 700;
    }
    .transfer-box {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-left: 4px solid #8B5CF6;
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 20px;
    }
    .transfer-text {
      font-size: 26px;
      color: #B0B0CC;
      line-height: 1.5;
    }
    .transfer-text .em {
      color: #FFFFFF;
      font-weight: 700;
    }
    .tradeoff-box {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(239, 68, 68, 0.2);
      border-left: 4px solid #EF4444;
      border-radius: 12px;
      padding: 20px 24px;
    }
    .tradeoff-label {
      font-size: 18px;
      color: #EF4444;
      font-weight: 700;
      margin-bottom: 6px;
      letter-spacing: 1px;
    }
    .tradeoff-text {
      font-size: 26px;
      color: #B0B0CC;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="slide-label">扩展能力</div>
    <div class="title"><span class="yellow">多手</span>：万物皆工具</div>
    <div class="interface-box">
      <div class="interface-code">execute(name, input) → string</div>
    </div>
    <div class="hands-grid">
      <div class="hand-card">
        <div class="hand-icon">📦</div>
        <div class="hand-name">容器</div>
      </div>
      <div class="hand-card">
        <div class="hand-icon">🔌</div>
        <div class="hand-name">MCP Server</div>
      </div>
      <div class="hand-card">
        <div class="hand-icon">📱</div>
        <div class="hand-name">手机</div>
      </div>
      <div class="hand-card">
        <div class="hand-icon">🎮</div>
        <div class="hand-name">游戏模拟器</div>
      </div>
    </div>
    <div class="transfer-box">
      <div class="transfer-text">Hand 不绑定 Brain<br>Agent A 用完 → <span class="em">交给 Agent B 继续</span></div>
    </div>
    <div class="tradeoff-box">
      <div class="tradeoff-label">TRADEOFF</div>
      <div class="tradeoff-text">多环境推理是更难的认知任务<br>模型够强才能驾驭</div>
    </div>
  </div>
</body>
</html>
