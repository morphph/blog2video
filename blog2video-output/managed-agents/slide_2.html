<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      position: relative;
    }
    .slide-label {
      font-size: 22px;
      color: #8B5CF6;
      letter-spacing: 2px;
      margin-bottom: 32px;
      font-weight: 600;
    }
    .title {
      font-size: 56px;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 48px;
    }
    .title .accent {
      color: #F59E0B;
    }
    .concept-box {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-left: 4px solid #8B5CF6;
      border-radius: 12px;
      padding: 32px 28px;
      margin-bottom: 24px;
    }
    .concept-label {
      font-size: 22px;
      color: #6B7280;
      margin-bottom: 12px;
      font-weight: 600;
    }
    .concept-text {
      font-size: 34px;
      color: #FFFFFF;
      line-height: 1.5;
      font-weight: 600;
    }
    .arrow-down {
      width: 100%;
      text-align: center;
      font-size: 40px;
      color: #6B7280;
      margin-bottom: 24px;
    }
    .warning-box {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-left: 4px solid #EF4444;
      border-radius: 12px;
      padding: 32px 28px;
    }
    .warning-text {
      font-size: 38px;
      color: #EF4444;
      font-weight: 800;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="slide-label">核心认知</div>
    <div class="title">Harness = <span class="accent">过期的假设</span></div>
    <div class="concept-box">
      <div class="concept-label">HARNESS 编码的是</div>
      <div class="concept-text">"模型做不到什么"的假设</div>
    </div>
    <div class="arrow-down">↓</div>
    <div class="warning-box">
      <div class="warning-text">模型在进步<br>假设会过期</div>
    </div>
  </div>
</body>
</html>
