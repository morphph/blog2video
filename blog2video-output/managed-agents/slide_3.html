<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      position: relative;
    }
    .slide-label {
      font-size: 22px;
      color: #F59E0B;
      letter-spacing: 2px;
      margin-bottom: 28px;
      font-weight: 600;
    }
    .title {
      font-size: 48px;
      font-weight: 800;
      margin-bottom: 44px;
      line-height: 1.3;
    }
    .timeline {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0;
      position: relative;
    }
    .timeline::before {
      content: '';
      position: absolute;
      left: 24px;
      top: 24px;
      bottom: 24px;
      width: 3px;
      background: linear-gradient(to bottom, #F59E0B, #10B981);
    }
    .step {
      display: flex;
      align-items: flex-start;
      gap: 24px;
      padding: 20px 0;
    }
    .dot {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 700;
      z-index: 1;
    }
    .dot-yellow {
      background: #F59E0B;
      color: #0D0D1A;
    }
    .dot-green {
      background: #10B981;
      color: #0D0D1A;
    }
    .step-content {
      flex: 1;
    }
    .step-model {
      font-size: 24px;
      color: #6B7280;
      margin-bottom: 6px;
      font-weight: 600;
    }
    .step-text {
      font-size: 32px;
      color: #FFFFFF;
      font-weight: 600;
      line-height: 1.4;
    }
    .step-sub {
      font-size: 26px;
      color: #B0B0CC;
      margin-top: 6px;
      line-height: 1.4;
    }
    .result-box {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-left: 4px solid #EF4444;
      border-radius: 12px;
      padding: 24px 28px;
      margin-top: 32px;
    }
    .result-text {
      font-size: 30px;
      color: #EF4444;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="slide-label">真实案例</div>
    <div class="title">Context Anxiety</div>
    <div class="timeline">
      <div class="step">
        <div class="dot dot-yellow">1</div>
        <div class="step-content">
          <div class="step-model">Sonnet 4.5</div>
          <div class="step-text">上下文焦虑 → 草草收场</div>
          <div class="step-sub">加了 context reset 补丁</div>
        </div>
      </div>
      <div class="step">
        <div class="dot dot-green">2</div>
        <div class="step-content">
          <div class="step-model">Opus 4.5</div>
          <div class="step-text">行为已消失</div>
          <div class="step-sub">reset 补丁 → 死重量</div>
        </div>
      </div>
    </div>
    <div class="result-box">
      <div class="result-text">越精心优化，过期越快</div>
    </div>
  </div>
</body>
</html>
