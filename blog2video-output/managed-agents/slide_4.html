<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    .slide-label {
      font-size: 22px;
      color: #EF4444;
      letter-spacing: 2px;
      margin-bottom: 28px;
      font-weight: 600;
      align-self: flex-start;
    }
    .title {
      font-size: 52px;
      font-weight: 800;
      margin-bottom: 48px;
      text-align: left;
      width: 100%;
      line-height: 1.3;
    }
    .title .red { color: #EF4444; }
    .container-box {
      width: 100%;
      background: #1A1A2E;
      border: 2px solid rgba(239, 68, 68, 0.4);
      border-radius: 16px;
      padding: 36px 32px;
      position: relative;
      margin-bottom: 36px;
    }
    .container-header {
      font-size: 20px;
      color: #6B7280;
      letter-spacing: 2px;
      margin-bottom: 24px;
      font-weight: 600;
    }
    .components {
      display: flex;
      gap: 16px;
    }
    .component {
      flex: 1;
      background: #252542;
      border-radius: 10px;
      padding: 20px 16px;
      text-align: center;
    }
    .comp-icon {
      font-size: 36px;
      margin-bottom: 8px;
    }
    .comp-name {
      font-size: 24px;
      font-weight: 700;
      color: #B0B0CC;
    }
    .pet-label {
      position: absolute;
      top: -16px;
      right: 24px;
      background: #EF4444;
      color: #FFFFFF;
      font-size: 22px;
      font-weight: 800;
      padding: 6px 20px;
      border-radius: 100px;
    }
    .problem-cards {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .problem-card {
      background: #1A1A2E;
      border: 1px solid rgba(239, 68, 68, 0.2);
      border-radius: 12px;
      padding: 20px 24px;
      font-size: 28px;
      color: #F0F0F0;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .problem-icon {
      color: #EF4444;
      font-size: 24px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="slide-label">旧架构</div>
    <div class="title">全部塞进一个<span class="red">容器</span></div>
    <div class="container-box">
      <div class="pet-label">宠物</div>
      <div class="container-header">ALL-IN-ONE CONTAINER</div>
      <div class="components">
        <div class="component">
          <div class="comp-icon">📋</div>
          <div class="comp-name">Session</div>
        </div>
        <div class="component">
          <div class="comp-icon">🧠</div>
          <div class="comp-name">Harness</div>
        </div>
        <div class="component">
          <div class="comp-icon">📦</div>
          <div class="comp-name">Sandbox</div>
        </div>
      </div>
    </div>
    <div class="problem-cards">
      <div class="problem-card">
        <span class="problem-icon">!</span>
        容器挂了 → session 丢失
      </div>
      <div class="problem-card">
        <span class="problem-icon">!</span>
        容器卡了 → 必须去救它
      </div>
    </div>
  </div>
</body>
</html>
