<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      position: relative;
    }
    .slide-label {
      font-size: 22px;
      color: #EF4444;
      letter-spacing: 2px;
      margin-bottom: 24px;
      font-weight: 600;
    }
    .title {
      font-size: 48px;
      font-weight: 800;
      margin-bottom: 40px;
      line-height: 1.3;
    }
    .section {
      width: 100%;
      margin-bottom: 28px;
    }
    .section-header {
      font-size: 22px;
      color: #6B7280;
      font-weight: 600;
      letter-spacing: 1px;
      margin-bottom: 14px;
    }
    .card {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(239, 68, 68, 0.2);
      border-left: 4px solid #EF4444;
      border-radius: 12px;
      padding: 22px 24px;
      margin-bottom: 12px;
    }
    .card-text {
      font-size: 28px;
      color: #F0F0F0;
      line-height: 1.5;
    }
    .card-text .muted {
      color: #6B7280;
      font-size: 24px;
    }
    .card-yellow {
      border-color: rgba(245, 158, 11, 0.3);
      border-left-color: #F59E0B;
    }
    .dilemma-box {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 22px 24px;
      text-align: center;
    }
    .dilemma-text {
      font-size: 30px;
      color: #B0B0CC;
      line-height: 1.5;
    }
    .dilemma-text .highlight {
      color: #EF4444;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="slide-label">运维噩梦</div>
    <div class="title">调试 vs 安全 的两难</div>
    <div class="section">
      <div class="section-header">故障排查</div>
      <div class="card">
        <div class="card-text">3种故障在事件流里<br><span class="muted">harness bug / 网络丢包 / 容器离线</span></div>
      </div>
      <div class="card">
        <div class="card-text">看起来完全一样</div>
      </div>
    </div>
    <div class="section">
      <div class="section-header">VPC 困境</div>
      <div class="card card-yellow">
        <div class="card-text">客户私有云 → 网络对等互联<br><span class="muted">一个 harness 假设 → 架构级限制</span></div>
      </div>
    </div>
    <div class="dilemma-box">
      <div class="dilemma-text">要调试 → 进容器<br>进容器 → <span class="highlight">碰用户数据</span></div>
    </div>
  </div>
</body>
</html>
