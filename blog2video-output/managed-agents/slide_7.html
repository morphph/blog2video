<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      position: relative;
    }
    .slide-label {
      font-size: 22px;
      color: #10B981;
      letter-spacing: 2px;
      margin-bottom: 24px;
      font-weight: 600;
    }
    .title {
      font-size: 50px;
      font-weight: 800;
      margin-bottom: 44px;
      line-height: 1.3;
    }
    .title .green { color: #10B981; }
    .flow-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0;
      margin-bottom: 32px;
    }
    .flow-step {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 22px 24px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .flow-num {
      width: 40px;
      height: 40px;
      background: #8B5CF6;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 800;
      flex-shrink: 0;
    }
    .flow-code {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 26px;
      color: #10B981;
      font-weight: 600;
    }
    .flow-desc {
      font-size: 24px;
      color: #B0B0CC;
      margin-left: auto;
    }
    .flow-arrow {
      text-align: center;
      font-size: 28px;
      color: #6B7280;
      margin-bottom: 6px;
    }
    .key-insight {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-left: 4px solid #10B981;
      border-radius: 12px;
      padding: 24px 28px;
      text-align: center;
    }
    .key-text {
      font-size: 32px;
      color: #FFFFFF;
      font-weight: 700;
      line-height: 1.5;
    }
    .key-text .highlight {
      color: #10B981;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="slide-label">恢复机制</div>
    <div class="title">Harness 也是<span class="green">牲畜</span></div>
    <div class="flow-container">
      <div class="flow-step">
        <div class="flow-num">1</div>
        <div class="flow-code">wake(sessionId)</div>
        <div class="flow-desc">唤醒</div>
      </div>
      <div class="flow-arrow">↓</div>
      <div class="flow-step">
        <div class="flow-num">2</div>
        <div class="flow-code">getSession(id)</div>
        <div class="flow-desc">取回日志</div>
      </div>
      <div class="flow-arrow">↓</div>
      <div class="flow-step">
        <div class="flow-num">3</div>
        <div class="flow-code">emitEvent(...)</div>
        <div class="flow-desc">持续写入</div>
      </div>
    </div>
    <div class="key-insight">
      <div class="key-text"><span class="highlight">没有任何组件</span>是不可替换的<br>所有状态在 session 日志里</div>
    </div>
  </div>
</body>
</html>
