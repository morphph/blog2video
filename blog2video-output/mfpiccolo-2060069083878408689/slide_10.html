<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .eyebrow {
      font-size: 26px;
      color: #EF4444;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 20px;
    }
    .title {
      font-size: 54px;
      font-weight: 900;
      margin-bottom: 14px;
      line-height: 1.2;
    }
    .title .red { color: #EF4444; }
    .gate {
      background: #1A1A2E;
      border: 1px solid rgba(239, 68, 68, 0.4);
      border-radius: 12px;
      padding: 24px 28px;
      margin-bottom: 36px;
      font-size: 24px;
      font-weight: 700;
      color: #B0B0CC;
      width: 100%;
    }
    .gate .mono {
      color: #F59E0B;
      font-family: 'SF Mono', Menlo, monospace;
      font-size: 22px;
    }
    .gate .timeout {
      color: #EF4444;
      font-weight: 800;
    }
    .outcomes {
      display: flex;
      flex-direction: column;
      gap: 18px;
      width: 100%;
    }
    .out {
      display: flex;
      align-items: stretch;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      overflow: hidden;
    }
    .out-tag {
      padding: 24px 20px;
      font-size: 26px;
      font-weight: 900;
      color: #FFFFFF;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      min-width: 220px;
      justify-content: center;
    }
    .out.allow .out-tag { background: rgba(16, 185, 129, 0.18); color: #10B981; }
    .out.deny .out-tag { background: rgba(239, 68, 68, 0.18); color: #EF4444; }
    .out.approval .out-tag { background: rgba(245, 158, 11, 0.18); color: #F59E0B; }
    .out-text {
      flex: 1;
      padding: 22px 24px;
      font-size: 22px;
      color: #FFFFFF;
      font-weight: 600;
      text-align: left;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="eyebrow">工 具 调 用 前 的 那 道 门</div>
    <div class="title">统一入口 → <span class="red">policy 校验</span></div>
    <div class="gate"><span class="mono">policy::check_permissions</span> · <span class="timeout">5 秒超时</span> · 同步</div>
    <div class="outcomes">
      <div class="out allow">
        <div class="out-tag">allow</div>
        <div class="out-text">直接派发，工具跑，结果写回</div>
      </div>
      <div class="out deny">
        <div class="out-tag">deny</div>
        <div class="out-text">短路掉，拒绝信封写回结果</div>
      </div>
      <div class="out approval">
        <div class="out-tag">needs_approval</div>
        <div class="out-text">挂到"等待审批"列表，其他调用继续派发</div>
      </div>
    </div>
  </div>
</body>
</html>
