<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .eyebrow {
      font-size: 24px;
      color: #10B981;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 18px;
    }
    .title {
      font-size: 48px;
      font-weight: 900;
      margin-bottom: 36px;
      line-height: 1.25;
    }
    .title .green { color: #10B981; }
    .change-box {
      background: #1A1A2E;
      border: 1px solid rgba(245, 158, 11, 0.5);
      border-left: 4px solid #F59E0B;
      border-radius: 12px;
      padding: 28px 32px;
      width: 100%;
      margin-bottom: 32px;
      text-align: left;
    }
    .change-label {
      font-size: 22px;
      color: #F59E0B;
      letter-spacing: 3px;
      font-weight: 800;
      margin-bottom: 14px;
    }
    .fsm-line {
      display: flex;
      align-items: baseline;
      gap: 20px;
      justify-content: center;
      margin-bottom: 12px;
    }
    .fsm-num {
      font-size: 80px;
      font-weight: 900;
      color: #EF4444;
      line-height: 1;
    }
    .fsm-arrow {
      font-size: 50px;
      font-weight: 800;
      color: #F59E0B;
    }
    .fsm-num.after { color: #10B981; }
    .fsm-label {
      font-size: 22px;
      color: #B0B0CC;
      text-align: center;
    }
    .unchanged {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(16, 185, 129, 0.4);
      border-left: 4px solid #10B981;
      border-radius: 12px;
      padding: 22px 26px;
      text-align: left;
    }
    .un-label {
      font-size: 22px;
      color: #10B981;
      letter-spacing: 3px;
      font-weight: 800;
      margin-bottom: 14px;
    }
    .workers-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      font-size: 20px;
      color: #FFFFFF;
      font-weight: 600;
    }
    .workers-grid .w {
      padding: 6px 0;
    }
    .workers-grid .check { color: #10B981; margin-right: 8px; font-weight: 800; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="eyebrow">具 体 证 据 · 不 是 口 号</div>
    <div class="title">orchestrator 重构 <span class="green">邻居零改动</span></div>
    <div class="change-box">
      <div class="change-label">F S M 状 态 合 并</div>
      <div class="fsm-line">
        <span class="fsm-num">11</span>
        <span class="fsm-arrow">→</span>
        <span class="fsm-num after">7</span>
      </div>
      <div class="fsm-label">+ 删 per-call 唤醒机制 / + tearing_down 内联</div>
    </div>
    <div class="unchanged">
      <div class="un-label">8 个 邻 居 W O R K E R · 完 全 没 动</div>
      <div class="workers-grid">
        <div class="w"><span class="check">✓</span>approval-gate</div>
        <div class="w"><span class="check">✓</span>session</div>
        <div class="w"><span class="check">✓</span>llm-budget</div>
        <div class="w"><span class="check">✓</span>provider 系列</div>
        <div class="w"><span class="check">✓</span>models-catalog</div>
        <div class="w"><span class="check">✓</span>auth-credentials</div>
        <div class="w"><span class="check">✓</span>hook-fanout</div>
        <div class="w"><span class="check">✓</span>context-compaction</div>
      </div>
    </div>
  </div>
</body>
</html>
