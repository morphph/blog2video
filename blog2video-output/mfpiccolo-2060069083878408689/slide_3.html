<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .eyebrow {
      font-size: 26px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 28px;
    }
    .title {
      font-size: 56px;
      font-weight: 900;
      margin-bottom: 56px;
      line-height: 1.25;
    }
    .gap-cards {
      display: flex;
      flex-direction: column;
      gap: 22px;
      width: 100%;
      margin-bottom: 56px;
    }
    .gap {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-left: 4px solid #F59E0B;
      border-radius: 12px;
      padding: 22px 28px;
      text-align: left;
      font-size: 30px;
      font-weight: 600;
      line-height: 1.4;
    }
    .gap .key { color: #F59E0B; font-weight: 800; }
    .end {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(239, 68, 68, 0.4);
      border-left: 4px solid #EF4444;
      border-radius: 12px;
      padding: 28px 32px;
      text-align: left;
    }
    .end-label {
      font-size: 20px;
      color: #EF4444;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 10px;
    }
    .end-text {
      font-size: 38px;
      font-weight: 800;
      line-height: 1.35;
    }
    .end-text .red { color: #EF4444; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="eyebrow">一年之后</div>
    <div class="title">每个长跑团队都撞到同一堵墙</div>
    <div class="gap-cards">
      <div class="gap">想要的 <span class="key">policy engine</span>，不是框架那个</div>
      <div class="gap">想要的 <span class="key">approval UI</span>，不是框架那个</div>
      <div class="gap">想要的 <span class="key">budget tracker</span>，框架看不见</div>
    </div>
    <div class="end">
      <div class="end-label">第 四 条 路</div>
      <div class="end-text"><span class="red">整个 Harness 推倒重写</span></div>
    </div>
  </div>
</body>
</html>
