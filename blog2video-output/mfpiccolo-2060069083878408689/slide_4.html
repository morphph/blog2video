<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .question {
      font-size: 44px;
      font-weight: 700;
      color: #B0B0CC;
      margin-bottom: 36px;
      line-height: 1.4;
    }
    .big-number-wrap {
      display: flex;
      align-items: baseline;
      gap: 28px;
      margin-bottom: 56px;
    }
    .big-number {
      font-size: 220px;
      font-weight: 900;
      color: #F59E0B;
      line-height: 1;
      letter-spacing: -4px;
    }
    .big-suffix {
      font-size: 50px;
      font-weight: 800;
      color: #FFFFFF;
    }
    .jobs-preview {
      display: flex;
      flex-direction: column;
      gap: 18px;
      width: 100%;
    }
    .job {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-left: 4px solid #8B5CF6;
      border-radius: 12px;
      padding: 20px 26px;
      text-align: left;
      font-size: 26px;
      font-weight: 600;
      color: #FFFFFF;
      line-height: 1.4;
    }
    .job .idx {
      color: #8B5CF6;
      font-weight: 800;
      margin-right: 14px;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="question">Harness 里到底装了多少件事？</div>
    <div class="big-number-wrap">
      <span class="big-number">15</span>
      <span class="big-suffix">件 job</span>
    </div>
    <div class="jobs-preview">
      <div class="job"><span class="idx">01</span>接收 turn 请求并持久化</div>
      <div class="job"><span class="idx">02</span>解析模型 credentials</div>
      <div class="job"><span class="idx">03</span>查模型 capability（vision/流式/context）</div>
      <div class="job"><span class="idx">04</span>驱动每一轮对话的状态机</div>
    </div>
  </div>
</body>
</html>
