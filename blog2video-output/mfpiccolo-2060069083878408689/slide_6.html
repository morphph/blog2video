<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .quote-mark {
      font-size: 200px;
      color: #EF4444;
      line-height: 1;
      font-family: Georgia, serif;
      margin-bottom: -20px;
      opacity: 0.85;
    }
    .quote-text {
      font-size: 52px;
      font-weight: 800;
      line-height: 1.4;
      margin-bottom: 64px;
      max-width: 100%;
    }
    .quote-text .red { color: #EF4444; }
    .quote-text .amber { color: #F59E0B; }
    .cost-card {
      background: #1A1A2E;
      border: 1px solid rgba(239, 68, 68, 0.4);
      border-left: 4px solid #EF4444;
      border-radius: 12px;
      padding: 32px 36px;
      width: 100%;
      text-align: left;
    }
    .cost-label {
      font-size: 20px;
      color: #EF4444;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 14px;
    }
    .cost-text {
      font-size: 34px;
      font-weight: 700;
      line-height: 1.35;
      color: #FFFFFF;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="quote-mark">"</div>
    <div class="quote-text">把 15 件事打成<br><span class="red">一个 monolith</span><br>每件事只 ship <span class="amber">一个版本</span></div>
    <div class="cost-card">
      <div class="cost-label">代 价</div>
      <div class="cost-text">想换内置 policy engine？<br>得把<span style="color:#EF4444">整个 Harness</span>一起换走</div>
    </div>
  </div>
</body>
</html>
