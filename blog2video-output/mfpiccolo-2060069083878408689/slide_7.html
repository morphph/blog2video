<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .eyebrow {
      font-size: 26px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 24px;
    }
    .title {
      font-size: 52px;
      font-weight: 900;
      line-height: 1.25;
      margin-bottom: 48px;
    }
    .title .purple { color: #8B5CF6; }
    .architecture {
      position: relative;
      width: 100%;
      height: 480px;
      margin-bottom: 40px;
    }
    .bus {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: #1A1A2E;
      border: 2px solid #8B5CF6;
      border-radius: 999px;
      padding: 28px 48px;
      font-size: 32px;
      font-weight: 800;
      color: #8B5CF6;
      letter-spacing: 1px;
      box-shadow: 0 0 60px rgba(139, 92, 246, 0.35);
    }
    .worker {
      position: absolute;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.4);
      border-radius: 10px;
      padding: 14px 18px;
      font-size: 22px;
      font-weight: 700;
      color: #FFFFFF;
    }
    .w1 { top: 0; left: 20px; }
    .w2 { top: 0; right: 20px; border-color: rgba(245,158,11,0.5); }
    .w3 { top: 50%; left: 0; transform: translateY(-50%); border-color: rgba(59,130,246,0.5); }
    .w4 { top: 50%; right: 0; transform: translateY(-50%); border-color: rgba(16,185,129,0.5); }
    .w5 { bottom: 0; left: 20px; border-color: rgba(239,68,68,0.5); }
    .w6 { bottom: 0; right: 20px; }
    .verdict {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.4);
      border-left: 4px solid #8B5CF6;
      border-radius: 12px;
      padding: 26px 32px;
      width: 100%;
      text-align: left;
      font-size: 32px;
      font-weight: 800;
      line-height: 1.4;
    }
    .verdict .purple { color: #8B5CF6; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="eyebrow">I I I 的 下 注</div>
    <div class="title">单一原语 + <span class="purple">一组 Worker</span></div>
    <div class="architecture">
      <div class="worker w1">turn-orchestrator</div>
      <div class="worker w2">provider</div>
      <div class="worker w3">policy</div>
      <div class="worker w4">approval-gate</div>
      <div class="worker w5">budget</div>
      <div class="worker w6">auth-credentials</div>
      <div class="bus">engine bus · iii.trigger</div>
    </div>
    <div class="verdict">每件事都是<span class="purple">独立 Worker</span>，独立版本号，独立替换</div>
  </div>
</body>
</html>
