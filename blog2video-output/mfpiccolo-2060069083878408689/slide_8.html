<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .eyebrow {
      font-size: 26px;
      color: #3B82F6;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 24px;
    }
    .title {
      font-size: 50px;
      font-weight: 900;
      margin-bottom: 48px;
      line-height: 1.25;
    }
    .title .amber { color: #F59E0B; }
    .flow {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
    }
    .step {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-left: 4px solid #3B82F6;
      border-radius: 12px;
      padding: 20px 28px;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .step-num {
      font-size: 36px;
      font-weight: 900;
      color: #3B82F6;
      min-width: 50px;
    }
    .step-content {
      flex: 1;
    }
    .step-worker {
      font-size: 22px;
      font-weight: 700;
      color: #F59E0B;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }
    .step-text {
      font-size: 24px;
      color: #FFFFFF;
      font-weight: 600;
      line-height: 1.35;
    }
    .arrow {
      text-align: center;
      color: #6B7280;
      font-size: 24px;
      margin: -8px 0;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="eyebrow">一 轮 对 话 · 11 个 W O R K E R</div>
    <div class="title">turn 请求<span class="amber">怎么流动</span>？</div>
    <div class="flow">
      <div class="step">
        <div class="step-num">01</div>
        <div class="step-content">
          <div class="step-worker">harness · 元 Worker</div>
          <div class="step-text">注入 session_id / message_id 成 OTel baggage</div>
        </div>
      </div>
      <div class="arrow">▼</div>
      <div class="step">
        <div class="step-num">02</div>
        <div class="step-content">
          <div class="step-worker">turn-orchestrator</div>
          <div class="step-text">写状态到 iii state，立刻返回</div>
        </div>
      </div>
      <div class="arrow">▼</div>
      <div class="step">
        <div class="step-num">03</div>
        <div class="step-content">
          <div class="step-worker">可持久状态机</div>
          <div class="step-text">由队列消息驱动逐步前进</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
