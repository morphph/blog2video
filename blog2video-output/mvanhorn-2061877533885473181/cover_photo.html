<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 100px 72px 400px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .glow {
      position: absolute;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 900px;
      height: 900px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.18) 0%, rgba(13, 13, 26, 0) 65%);
      pointer-events: none;
      z-index: 0;
    }
    .series-tag {
      position: relative;
      z-index: 1;
      font-size: 30px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 600;
      margin-bottom: 80px;
    }
    .title {
      position: relative;
      z-index: 1;
      font-size: 92px;
      font-weight: 900;
      line-height: 1.25;
      color: #FFFFFF;
      margin-bottom: 100px;
      letter-spacing: -1px;
    }
    .highlight-amber { color: #F59E0B; }
    .highlight-red { color: #EF4444; }
    .source-pill {
      position: relative;
      z-index: 1;
      background: #1A1A30;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 999px;
      padding: 18px 36px;
      font-size: 22px;
      color: #6B6B80;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="glow"></div>
    <div class="series-tag">精读AI · Agentic Engineering</div>
    <div class="title">
      <span class="highlight-amber">22 招</span>让你一年内<br>
      成为<span class="highlight-red">重度 Agent</span><br>
      用户
    </div>
    <div class="source-pill">Matt Van Horn · Cinder 创始人 · 91 万阅读</div>
  </div>
</body>
</html>
