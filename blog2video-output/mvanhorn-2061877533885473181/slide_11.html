<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .glow {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 900px;
      height: 700px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, rgba(13, 13, 26, 0) 65%);
      z-index: 0;
    }
    .label {
      position: relative;
      z-index: 1;
      font-size: 28px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 600;
      margin-bottom: 40px;
    }
    .quote-card {
      position: relative;
      z-index: 1;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.35);
      border-left: 4px solid #8B5CF6;
      border-radius: 16px;
      padding: 50px 44px;
      width: 100%;
      text-align: left;
      margin-bottom: 36px;
    }
    .quote-mark {
      font-size: 120px;
      color: #8B5CF6;
      line-height: 0.5;
      margin-bottom: 24px;
      font-weight: 900;
    }
    .quote-body {
      font-size: 44px;
      color: #FFFFFF;
      line-height: 1.45;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .quote-body .key {
      color: #F59E0B;
    }
    .quote-body .neg {
      color: #6B7280;
      text-decoration: line-through;
      text-decoration-color: rgba(239, 68, 68, 0.6);
      text-decoration-thickness: 2px;
    }
    .echo {
      position: relative;
      z-index: 1;
      font-size: 26px;
      color: #B0B0CC;
      line-height: 1.5;
      font-weight: 500;
      letter-spacing: 0.5px;
    }
    .echo b {
      color: #FFFFFF;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="glow"></div>
    <div class="label">Agentic Engineering 的真正含义</div>
    <div class="quote-card">
      <div class="quote-mark">"</div>
      <div class="quote-body">
        不是 <span class="neg">AI 帮我写代码</span><br>
        是 <span class="key">Agent 帮我办杂事</span><br>
        看球、热车、订机票
      </div>
    </div>
    <div class="echo">
      前 19 招在终端里打转<br>
      <b>第 20 招让整套体系有了非编程的意义</b>
    </div>
  </div>
</body>
</html>
