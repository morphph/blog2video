<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .label {
      font-size: 26px;
      color: #EF4444;
      letter-spacing: 3px;
      font-weight: 600;
      margin-bottom: 32px;
    }
    .title {
      font-size: 56px;
      font-weight: 900;
      line-height: 1.25;
      margin-bottom: 44px;
      letter-spacing: -0.5px;
    }
    .title .en {
      color: #EF4444;
      font-family: -apple-system, sans-serif;
    }
    .quote-card {
      background: #1A1A2E;
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-left: 4px solid #EF4444;
      border-radius: 16px;
      padding: 36px 36px;
      width: 100%;
      text-align: left;
      margin-bottom: 28px;
    }
    .quote-head {
      font-size: 22px;
      color: #EF4444;
      letter-spacing: 2px;
      margin-bottom: 14px;
      font-weight: 600;
    }
    .quote-body {
      font-size: 32px;
      color: #FFFFFF;
      line-height: 1.5;
      font-weight: 700;
    }
    .quote-body .red { color: #EF4444; }
    .trap {
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.12), rgba(13, 13, 26, 0));
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 12px;
      padding: 28px 32px;
      width: 100%;
      text-align: center;
    }
    .trap-text {
      font-size: 30px;
      font-weight: 800;
      color: #FFFFFF;
      line-height: 1.4;
    }
    .trap-text .key {
      color: #EF4444;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="label">第 21 招 · The Honest Part</div>
    <div class="title">"<span class="en">AI Psychosis</span>"<br>这套东西非常上瘾</div>
    <div class="quote-card">
      <div class="quote-head">他亲眼看到的</div>
      <div class="quote-body">
        Agent 本来是替我们干活的<br>
        结果我所有朋友都在<br>
        <span class="red">自己生命里前所未有地拼命</span>
      </div>
    </div>
    <div class="trap">
      <div class="trap-text">
        陷阱不是发布失败<br>
        是<span class="key">你消失在了建造里</span><br>
        丢掉了身边的人
      </div>
    </div>
  </div>
</body>
</html>
