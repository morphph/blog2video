<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .label {
      font-size: 28px;
      color: #10B981;
      letter-spacing: 3px;
      font-weight: 600;
      margin-bottom: 32px;
    }
    .title {
      font-size: 56px;
      font-weight: 900;
      line-height: 1.25;
      margin-bottom: 48px;
      letter-spacing: -0.5px;
    }
    .title .key { color: #10B981; }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 22px;
      width: 100%;
      margin-bottom: 36px;
    }
    .action {
      background: #1A1A2E;
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-left: 4px solid #10B981;
      border-radius: 12px;
      padding: 26px 30px;
      display: flex;
      align-items: center;
      gap: 24px;
      text-align: left;
    }
    .num {
      font-size: 48px;
      font-weight: 900;
      color: #10B981;
      line-height: 1;
      flex-shrink: 0;
      width: 50px;
      text-align: center;
    }
    .action-text {
      font-size: 30px;
      color: #FFFFFF;
      line-height: 1.4;
      font-weight: 700;
    }
    .note {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.1), rgba(139, 92, 246, 0.1));
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 12px;
      padding: 24px 28px;
      width: 100%;
      text-align: center;
    }
    .note-text {
      font-size: 26px;
      color: #F59E0B;
      line-height: 1.5;
      font-weight: 700;
    }
    .note-text .white {
      color: #FFFFFF;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="label">Matt 的三件事建议</div>
    <div class="title">比前 20 招<br><span class="key">加起来都重要</span></div>
    <div class="actions">
      <div class="action">
        <div class="num">1</div>
        <div class="action-text">休息，去摸摸草</div>
      </div>
      <div class="action">
        <div class="num">2</div>
        <div class="action-text">跟你爱的人聊天</div>
      </div>
      <div class="action">
        <div class="num">3</div>
        <div class="action-text">问一问<br>你做的东西到底有没有人要</div>
      </div>
    </div>
    <div class="note">
      <div class="note-text">
        <span class="white">如果答案是</span>"只是为了你自己"<br>
        <span class="white">那也可以</span>
      </div>
    </div>
  </div>
</body>
</html>
