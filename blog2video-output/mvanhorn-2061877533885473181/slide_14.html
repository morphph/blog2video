<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .glow {
      position: absolute;
      top: 35%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 950px;
      height: 800px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.18) 0%, rgba(13, 13, 26, 0) 65%);
      z-index: 0;
    }
    .label {
      position: relative;
      z-index: 1;
      font-size: 28px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 600;
      margin-bottom: 32px;
    }
    .title {
      position: relative;
      z-index: 1;
      font-size: 58px;
      font-weight: 900;
      line-height: 1.25;
      margin-bottom: 48px;
      letter-spacing: -0.5px;
    }
    .title .key { color: #F59E0B; }
    .quote-card {
      position: relative;
      z-index: 1;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.4);
      border-left: 4px solid #8B5CF6;
      border-radius: 16px;
      padding: 44px 40px;
      width: 100%;
      text-align: left;
      margin-bottom: 32px;
    }
    .quote-mark {
      font-size: 100px;
      color: #8B5CF6;
      line-height: 0.5;
      margin-bottom: 20px;
      font-weight: 900;
    }
    .quote-body {
      font-size: 36px;
      color: #FFFFFF;
      line-height: 1.45;
      font-weight: 700;
    }
    .quote-body .h { color: #F59E0B; }
    .quote-body .p { color: #8B5CF6; }
    .echo {
      position: relative;
      z-index: 1;
      font-size: 28px;
      color: #B0B0CC;
      line-height: 1.5;
      font-weight: 500;
      text-align: center;
    }
    .echo b {
      color: #FFFFFF;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="glow"></div>
    <div class="label">整体形状 · Synthesis</div>
    <div class="title">Agent 不是更强的 IDE<br>是<span class="key">工作流和生活流</span><br>之间被拆掉的门</div>
    <div class="quote-card">
      <div class="quote-mark">"</div>
      <div class="quote-body">
        当你跑 6 个 Agent<br>
        你的工作不是干活<br>
        <span class="h">是当那个信号</span><br><br>
        <span class="p">Agent 是手，你是大脑</span>
      </div>
    </div>
    <div class="echo">门拆掉之后你能多做很多事<br><b>但也再没有一个明确的下班时刻</b></div>
  </div>
</body>
</html>
