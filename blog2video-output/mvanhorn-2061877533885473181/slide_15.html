<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .glow {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 950px;
      height: 800px;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.15) 0%, rgba(13, 13, 26, 0) 65%);
      z-index: 0;
    }
    .label {
      position: relative;
      z-index: 1;
      font-size: 26px;
      color: #F59E0B;
      letter-spacing: 3px;
      font-weight: 600;
      margin-bottom: 28px;
    }
    .title {
      position: relative;
      z-index: 1;
      font-size: 60px;
      font-weight: 900;
      line-height: 1.25;
      margin-bottom: 44px;
      letter-spacing: -0.5px;
    }
    .title .key { color: #F59E0B; }
    .action-card {
      position: relative;
      z-index: 1;
      background: #1A1A2E;
      border: 1px solid rgba(245, 158, 11, 0.35);
      border-left: 4px solid #F59E0B;
      border-radius: 16px;
      padding: 36px 32px;
      width: 100%;
      text-align: left;
      margin-bottom: 28px;
    }
    .action-head {
      font-size: 24px;
      color: #F59E0B;
      letter-spacing: 2px;
      margin-bottom: 14px;
      font-weight: 700;
    }
    .action-body {
      font-size: 32px;
      color: #FFFFFF;
      line-height: 1.5;
      font-weight: 700;
    }
    .action-body .key {
      color: #F59E0B;
    }
    .action-body .neg {
      color: #6B7280;
      text-decoration: line-through;
      text-decoration-color: rgba(239, 68, 68, 0.5);
    }
    .commands {
      display: flex;
      gap: 16px;
      margin-top: 16px;
    }
    .cmd {
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 24px;
      font-weight: 700;
      color: #F59E0B;
      font-family: 'SF Mono', monospace;
    }
    .brand {
      position: relative;
      z-index: 1;
      font-size: 26px;
      color: #8B5CF6;
      letter-spacing: 2px;
      font-weight: 700;
      line-height: 1.5;
    }
    .brand .gray { color: #B0B0CC; font-weight: 500; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="glow"></div>
    <div class="label">22 招挑 1 招</div>
    <div class="title">做计划<br>但<span class="key">不要读计划</span></div>
    <div class="action-card">
      <div class="action-head">今天就做</div>
      <div class="action-body">
        让 Agent 写 plan.md<br>
        <span class="neg">逐行读 markdown</span> →<br>
        会话里追问 <span class="key">TLDR / eli5</span>
        <div class="commands">
          <div class="cmd">TLDR</div>
          <div class="cmd">eli5</div>
        </div>
      </div>
    </div>
    <div class="brand">
      精读AI<br>
      <span class="gray">AI 世界很吵，精读一篇</span><br>
      <span class="gray">胜过刷一百条</span>
    </div>
  </div>
</body>
</html>
