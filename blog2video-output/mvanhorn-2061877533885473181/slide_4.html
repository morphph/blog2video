<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .label {
      font-size: 26px;
      color: #3B82F6;
      letter-spacing: 3px;
      font-weight: 600;
      margin-bottom: 32px;
    }
    .title {
      font-size: 60px;
      font-weight: 900;
      line-height: 1.25;
      margin-bottom: 60px;
      letter-spacing: -0.5px;
    }
    .title .key { color: #3B82F6; }
    .scenario {
      background: #1A1A2E;
      border: 1px solid rgba(59, 130, 246, 0.3);
      border-left: 4px solid #3B82F6;
      border-radius: 12px;
      padding: 32px 36px;
      width: 100%;
      text-align: left;
      margin-bottom: 32px;
    }
    .scenario-head {
      font-size: 24px;
      color: #3B82F6;
      letter-spacing: 1.5px;
      margin-bottom: 12px;
      font-weight: 600;
    }
    .scenario-body {
      font-size: 32px;
      color: #FFFFFF;
      line-height: 1.5;
      font-weight: 600;
    }
    .stat-row {
      display: flex;
      gap: 24px;
      width: 100%;
    }
    .stat {
      flex: 1;
      background: #1A1A2E;
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-left: 4px solid #F59E0B;
      border-radius: 12px;
      padding: 24px;
      text-align: center;
    }
    .stat-num {
      font-size: 72px;
      font-weight: 900;
      color: #F59E0B;
      line-height: 1;
      margin-bottom: 8px;
    }
    .stat-sub {
      font-size: 22px;
      color: #B0B0CC;
      line-height: 1.3;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="label">Plan 不只用在编程</div>
    <div class="title">让 Agent 做<br>"<span class="key">怎么写文档的 Plan</span>"</div>
    <div class="scenario">
      <div class="scenario-head">现场</div>
      <div class="scenario-body">一本免费 PDF<br>+ 2 小时会议转录<br>全部丢给 Agent</div>
    </div>
    <div class="scenario">
      <div class="scenario-head">指令</div>
      <div class="scenario-body">"先不要写文档<br>给我一份'怎么写文档的 Plan'"</div>
    </div>
    <div class="stat-row">
      <div class="stat">
        <div class="stat-num">45 分钟</div>
        <div class="stat-sub">"史诗级" plan</div>
      </div>
      <div class="stat">
        <div class="stat-num">深度版</div>
        <div class="stat-sub">不偷懒的<br>最佳技巧</div>
      </div>
    </div>
  </div>
</body>
</html>
