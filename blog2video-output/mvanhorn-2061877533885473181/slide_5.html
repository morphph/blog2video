<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .label {
      font-size: 28px;
      color: #EF4444;
      letter-spacing: 3px;
      font-weight: 600;
      margin-bottom: 36px;
    }
    .title {
      font-size: 62px;
      font-weight: 900;
      line-height: 1.25;
      margin-bottom: 60px;
      letter-spacing: -0.5px;
    }
    .title .key { color: #EF4444; }
    .big {
      background: #1A1A2E;
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-left: 4px solid #EF4444;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      margin-bottom: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 30px;
    }
    .big-num {
      font-size: 144px;
      font-weight: 900;
      color: #EF4444;
      line-height: 1;
    }
    .big-sub {
      text-align: left;
      font-size: 32px;
      color: #FFFFFF;
      line-height: 1.3;
      font-weight: 700;
    }
    .big-sub-small {
      font-size: 22px;
      color: #B0B0CC;
      margin-top: 6px;
      font-weight: 500;
    }
    .conclusion {
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.1), rgba(139, 92, 246, 0.1));
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      text-align: center;
    }
    .conclusion-text {
      font-size: 34px;
      font-weight: 800;
      color: #FFFFFF;
      line-height: 1.4;
    }
    .conclusion-text .red { color: #EF4444; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="label">第 2 招 · YOLO 模式</div>
    <div class="title">不是任性<br>是<span class="key">物理必须</span></div>
    <div class="big">
      <div class="big-num">6</div>
      <div class="big-sub">
        cmux tabs 并行<br>
        <div class="big-sub-small">plan / build / 调研 / 修 bug</div>
      </div>
    </div>
    <div class="conclusion">
      <div class="conclusion-text">
        6 个 session 并行<br>
        <span class="red">根本没法挨个点确认</span>
      </div>
    </div>
  </div>
</body>
</html>
