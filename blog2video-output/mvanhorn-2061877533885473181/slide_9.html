<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .label {
      font-size: 28px;
      color: #EF4444;
      letter-spacing: 3px;
      font-weight: 600;
      margin-bottom: 32px;
    }
    .title {
      font-size: 58px;
      font-weight: 900;
      line-height: 1.25;
      margin-bottom: 56px;
      letter-spacing: -0.5px;
    }
    .title .key { color: #EF4444; }
    .product-box {
      background: #1A1A2E;
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-left: 4px solid #EF4444;
      border-radius: 16px;
      padding: 36px;
      width: 100%;
      margin-bottom: 28px;
      text-align: left;
    }
    .product-name {
      font-size: 38px;
      font-weight: 900;
      color: #EF4444;
      margin-bottom: 12px;
      font-family: 'SF Mono', monospace;
    }
    .product-desc {
      font-size: 26px;
      color: #FFFFFF;
      line-height: 1.5;
      font-weight: 500;
    }
    .product-box.purple {
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-left: 4px solid #8B5CF6;
    }
    .product-box.purple .product-name { color: #8B5CF6; }
    .preview {
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.1), rgba(245, 158, 11, 0.1));
      border: 1px dashed rgba(245, 158, 11, 0.5);
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      text-align: center;
    }
    .preview-text {
      font-size: 28px;
      font-weight: 800;
      color: #F59E0B;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="label">第 20 招 · 破圈时刻</div>
    <div class="title">Agent 接管你的<br><span class="key">下午</span>，不只是代码</div>
    <div class="product-box">
      <div class="product-name">Printing Press</div>
      <div class="product-desc">把现实世界的服务<br>一个个包装成 CLI</div>
    </div>
    <div class="product-box purple">
      <div class="product-name">Agent Cookie</div>
      <div class="product-desc">浏览器登录状态交给 CLI<br>不用粘密码、不用重新登录</div>
    </div>
    <div class="preview">
      <div class="preview-text">↓ 真实的一个下午 ↓</div>
    </div>
  </div>
</body>
</html>
