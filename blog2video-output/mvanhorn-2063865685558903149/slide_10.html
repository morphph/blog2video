<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .label {
      font-size: 24px;
      color: #8B5CF6;
      letter-spacing: 2px;
      font-weight: 600;
      margin-bottom: 18px;
    }
    .tag-quote {
      font-size: 22px;
      color: #6B7280;
      font-family: 'Courier New', monospace;
      margin-bottom: 30px;
    }
    .headline {
      font-size: 52px;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 36px;
    }
    .headline .red { color: #EF4444; }
    .headline .green { color: #10B981; }
    .compare {
      display: flex;
      gap: 22px;
      width: 100%;
      margin-bottom: 30px;
    }
    .col {
      flex: 1;
      background: #1A1A2E;
      border: 1px solid rgba(107, 114, 128, 0.4);
      border-left: 4px solid #6B7280;
      border-radius: 12px;
      padding: 24px 22px;
      text-align: left;
    }
    .col.loop {
      border-left-color: #10B981;
      border-color: rgba(16, 185, 129, 0.35);
    }
    .col-title {
      font-size: 30px;
      font-weight: 800;
      margin-bottom: 4px;
    }
    .col-title.cron { color: #6B7280; }
    .col-title.loop { color: #10B981; }
    .col-sub {
      font-size: 20px;
      color: #6B7280;
      margin-bottom: 16px;
      font-family: 'Courier New', monospace;
    }
    .col-body {
      font-size: 22px;
      line-height: 1.5;
      color: #B0B0CC;
    }
    .col.loop .col-body { color: #FFFFFF; }
    .col-body .em { color: #F59E0B; font-weight: 700; }
    .formula {
      width: 100%;
      background: rgba(245, 158, 11, 0.08);
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-left: 4px solid #F59E0B;
      border-radius: 12px;
      padding: 24px 28px;
      font-size: 30px;
      line-height: 1.4;
      color: #FFFFFF;
      text-align: center;
    }
    .formula .key { color: #F59E0B; font-weight: 800; }
    .formula .plus { color: #10B981; font-weight: 800; margin: 0 8px; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="label">最让人笑出声的吐槽</div>
    <div class="tag-quote">"Cronjobs have funny re-branding rn."</div>
    <div class="headline">
      <span class="red">说对了一半</span><br>
      但<span class="green">差中间一段</span>
    </div>
    <div class="compare">
      <div class="col">
        <div class="col-title cron">Cron</div>
        <div class="col-sub">1975</div>
        <div class="col-body">跑<span class="em">固定脚本</span><br>按时间触发<br>if-else 你预写</div>
      </div>
      <div class="col loop">
        <div class="col-title loop">Loop</div>
        <div class="col-sub">2026</div>
        <div class="col-body">跑<span class="em">一个模型</span><br>看状态、决定、自检<br>决策权在模型手里</div>
      </div>
    </div>
    <div class="formula">
      Loop = <span class="key">Cron</span> <span class="plus">+</span> 会做决定的<span class="key">脑子</span>
    </div>
  </div>
</body>
</html>
