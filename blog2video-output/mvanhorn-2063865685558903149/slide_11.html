<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .label {
      font-size: 26px;
      color: #8B5CF6;
      letter-spacing: 2px;
      font-weight: 600;
      margin-bottom: 28px;
    }
    .headline {
      font-size: 56px;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 32px;
    }
    .headline .accent { color: #10B981; }
    .cmd-card {
      width: 100%;
      background: #0F1B17;
      border: 1px solid rgba(16, 185, 129, 0.4);
      border-left: 4px solid #10B981;
      border-radius: 12px;
      padding: 26px 28px;
      margin-bottom: 28px;
      text-align: left;
    }
    .cmd-tag {
      font-size: 20px;
      color: #10B981;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }
    .cmd {
      font-family: 'Courier New', monospace;
      font-size: 24px;
      color: #FFFFFF;
      line-height: 1.45;
    }
    .cmd .key { color: #10B981; font-weight: 700; }
    .tips-title {
      font-size: 26px;
      color: #B0B0CC;
      margin-bottom: 16px;
      align-self: flex-start;
      text-align: left;
    }
    .tips-title .accent { color: #F59E0B; font-weight: 700; }
    .tips {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .tip {
      background: #1A1A2E;
      border: 1px solid rgba(59, 130, 246, 0.3);
      border-left: 4px solid #3B82F6;
      border-radius: 12px;
      padding: 18px 20px;
      text-align: left;
      font-size: 20px;
      line-height: 1.4;
      color: #FFFFFF;
    }
    .tip .num {
      color: #3B82F6;
      font-weight: 800;
      margin-right: 8px;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="label">入口便宜得像玩笑</div>
    <div class="headline">
      其实入口<span class="accent">只有一行</span>
    </div>
    <div class="cmd-card">
      <div class="cmd-tag">▸ Boris 的起手式</div>
      <div class="cmd">
        <span class="key">/loop</span> babysit all my PRs.<br>
        Auto-fix build issues, and<br>
        when comments come in, use<br>
        a worktree agent to fix them.
      </div>
    </div>
    <div class="tips-title">Boris 让 Opus 自驱跑 <span class="accent">5 条 tip (前 4 条)</span></div>
    <div class="tips">
      <div class="tip"><span class="num">1.</span>权限开 auto<br>别老来问</div>
      <div class="tip"><span class="num">2.</span>dynamic workflow<br>编排成百上千子 agent</div>
      <div class="tip"><span class="num">3.</span>/goal 或 /loop<br>推它跑到完成</div>
      <div class="tip"><span class="num">4.</span>任务挪到云上跑<br>可以关笔电</div>
    </div>
  </div>
</body>
</html>
