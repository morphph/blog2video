<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .label {
      font-size: 26px;
      color: #8B5CF6;
      letter-spacing: 2px;
      font-weight: 600;
      margin-bottom: 28px;
    }
    .headline {
      font-size: 56px;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 36px;
    }
    .headline .red { color: #EF4444; }
    .headline .amber { color: #F59E0B; }
    .quote-card {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(245, 158, 11, 0.35);
      border-left: 4px solid #F59E0B;
      border-radius: 12px;
      padding: 26px 28px;
      margin-bottom: 28px;
      text-align: left;
    }
    .q-text {
      font-size: 24px;
      line-height: 1.45;
      color: #FFFFFF;
      margin-bottom: 14px;
    }
    .q-text .em { color: #F59E0B; font-weight: 700; }
    .q-by {
      font-size: 18px;
      color: #6B7280;
      text-align: right;
      font-family: 'Courier New', monospace;
    }
    .receipt {
      width: 100%;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.5);
      border-left: 4px solid #EF4444;
      border-radius: 12px;
      padding: 26px 28px;
      margin-bottom: 26px;
      text-align: left;
    }
    .receipt-head {
      font-size: 22px;
      color: #B0B0CC;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }
    .receipt-body {
      display: flex;
      align-items: baseline;
      gap: 24px;
    }
    .receipt-num {
      font-size: 72px;
      font-weight: 800;
      color: #EF4444;
      line-height: 1;
    }
    .receipt-text {
      font-size: 22px;
      color: #FFFFFF;
      line-height: 1.4;
    }
    .receipt-text .em { color: #EF4444; font-weight: 700; }
    .verdict {
      width: 100%;
      background: rgba(139, 92, 246, 0.08);
      border: 1px solid rgba(139, 92, 246, 0.4);
      border-left: 4px solid #8B5CF6;
      border-radius: 12px;
      padding: 22px 26px;
      font-size: 24px;
      line-height: 1.5;
      color: #FFFFFF;
      text-align: left;
    }
    .verdict .em { color: #8B5CF6; font-weight: 700; }
    .verdict .name { color: #6B7280; font-family: 'Courier New', monospace; font-size: 18px; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="label">钱包反转</div>
    <div class="headline">
      模型几乎免费时<br>
      <span class="amber">loop</span> 才是<span class="red">最贵</span>的
    </div>
    <div class="quote-card">
      <div class="q-text">"每个 AI agent 都是 for 循环 + 一次 LLM 调用 + try/catch。<br>它唯一'agent'的地方，<span class="em">是月底那张 Anthropic 账单。</span>"</div>
      <div class="q-by">— @rohit_jsfreaky</div>
    </div>
    <div class="receipt">
      <div class="receipt-head">— Uber 这周最具体的账单 —</div>
      <div class="receipt-body">
        <div class="receipt-num">$1,500</div>
        <div class="receipt-text">/工程师/月上限<br><span class="em">4 个月烧光全年 AI 预算</span></div>
      </div>
    </div>
    <div class="verdict">
      "AI 编程里最贵的事，不再是写代码，<span class="em">是管理 agent loop</span>。"<br>
      <span class="name">— @runes_leo</span>
    </div>
  </div>
</body>
</html>
