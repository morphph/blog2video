<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .label {
      font-size: 26px;
      color: #8B5CF6;
      letter-spacing: 2px;
      font-weight: 600;
      margin-bottom: 28px;
    }
    .headline {
      font-size: 54px;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 42px;
    }
    .headline .accent { color: #10B981; }
    .cards {
      display: flex;
      flex-direction: column;
      gap: 24px;
      width: 100%;
    }
    .card {
      background: #1A1A2E;
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-left: 4px solid #10B981;
      border-radius: 12px;
      padding: 26px 28px;
      text-align: left;
    }
    .card.blue { border-left-color: #3B82F6; border-color: rgba(59, 130, 246, 0.3); }
    .head {
      display: flex;
      align-items: baseline;
      gap: 16px;
      margin-bottom: 8px;
    }
    .num {
      font-size: 28px;
      font-weight: 800;
      color: #10B981;
    }
    .card.blue .num { color: #3B82F6; }
    .year {
      font-size: 22px;
      color: #6B7280;
      font-family: 'Courier New', monospace;
    }
    .title {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .key {
      font-size: 22px;
      color: #B0B0CC;
      line-height: 1.45;
    }
    .key .hot { color: #F59E0B; font-weight: 700; }
    .key .green { color: #10B981; font-weight: 700; }
    .price {
      display: inline-block;
      margin-top: 10px;
      padding: 6px 14px;
      background: rgba(245, 158, 11, 0.15);
      border-radius: 6px;
      color: #F59E0B;
      font-weight: 700;
      font-size: 22px;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="label">五层旧词 · 2 / 5</div>
    <div class="headline">
      纪律 + 产品化<br>
      <span class="accent">出现</span>
    </div>
    <div class="cards">
      <div class="card">
        <div class="head">
          <div class="num">L3</div>
          <div class="year">2025/7</div>
        </div>
        <div class="title">ralph by Huntley</div>
        <div class="key">一行 bash 反复 pipe prompt<br>每轮<span class="green">重置 context 到锚点文件</span><br><span class="price">&lt; $300 搭出一整门编程语言</span></div>
      </div>
      <div class="card blue">
        <div class="head">
          <div class="num">L4</div>
          <div class="year">2026 春</div>
        </div>
        <div class="title">/goal 命令</div>
        <div class="key">Codex + Claude Code 同时上线<br>加小验证模型判断<span class="hot">"完成没"</span></div>
      </div>
    </div>
  </div>
</body>
</html>
