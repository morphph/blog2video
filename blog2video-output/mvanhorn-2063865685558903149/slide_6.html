<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .label {
      font-size: 26px;
      color: #8B5CF6;
      letter-spacing: 2px;
      font-weight: 600;
      margin-bottom: 28px;
    }
    .headline {
      font-size: 60px;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 38px;
    }
    .headline .accent { color: #8B5CF6; }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      width: 100%;
      margin-bottom: 32px;
    }
    .item {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-left: 4px solid #8B5CF6;
      border-radius: 12px;
      padding: 20px 22px;
      text-align: left;
    }
    .num {
      font-size: 26px;
      font-weight: 800;
      color: #8B5CF6;
      margin-bottom: 6px;
    }
    .text {
      font-size: 22px;
      line-height: 1.4;
      color: #FFFFFF;
    }
    .text .hot { color: #F59E0B; font-weight: 700; }
    .footer {
      width: 100%;
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-left: 4px solid #EF4444;
      border-radius: 12px;
      padding: 24px 28px;
      font-size: 28px;
      line-height: 1.4;
      text-align: left;
      color: #FFFFFF;
    }
    .footer .em { color: #EF4444; font-weight: 700; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="label">五层旧词 · L5 = 2026 真新</div>
    <div class="headline">
      四件事变了 — <span class="accent">真的新</span>
    </div>
    <div class="grid">
      <div class="item">
        <div class="num">01</div>
        <div class="text">Loop 自己 = <span class="hot">工作单元</span><br>不再是任务</div>
      </div>
      <div class="item">
        <div class="num">02</div>
        <div class="text">Loop 开始<span class="hot">监督其它 loop</span><br>并发 · 按调度</div>
      </div>
      <div class="item">
        <div class="num">03</div>
        <div class="text">调度器<span class="hot">替代人类启动</span><br>跑在基础设施时间</div>
      </div>
      <div class="item">
        <div class="num">04</div>
        <div class="text">状态 durable · 存 git<br><span class="hot">崩了能恢复</span></div>
      </div>
    </div>
    <div class="footer">
      Ralph 假设终端开着<br>
      2026 版 <span class="em">假设终端关着</span>
    </div>
  </div>
</body>
</html>
