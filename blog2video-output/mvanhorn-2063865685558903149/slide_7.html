<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .label {
      font-size: 26px;
      color: #8B5CF6;
      letter-spacing: 2px;
      font-weight: 600;
      margin-bottom: 40px;
    }
    .quote-mark {
      font-size: 180px;
      font-weight: 800;
      color: #8B5CF6;
      line-height: 0.8;
      margin-bottom: 20px;
    }
    .quote {
      font-size: 40px;
      font-weight: 700;
      line-height: 1.45;
      color: #FFFFFF;
      margin-bottom: 36px;
    }
    .quote .strike {
      color: #6B7280;
      text-decoration: line-through;
      text-decoration-color: rgba(239, 68, 68, 0.7);
      text-decoration-thickness: 3px;
    }
    .quote .hot { color: #F59E0B; font-weight: 800; }
    .by {
      font-size: 24px;
      color: #B0B0CC;
      margin-bottom: 50px;
    }
    .punch {
      width: 100%;
      background: rgba(139, 92, 246, 0.08);
      border: 1px solid rgba(139, 92, 246, 0.35);
      border-left: 4px solid #8B5CF6;
      border-radius: 12px;
      padding: 26px 28px;
      font-size: 26px;
      line-height: 1.5;
      text-align: left;
      color: #FFFFFF;
    }
    .punch .em { color: #8B5CF6; font-weight: 700; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="label">最接近正确答案的一条</div>
    <div class="quote-mark">"</div>
    <div class="quote">
      <span class="strike">ralph / /goal 的 loop</span><br>
      <span class="hot">那已经老掉牙</span>。这是某种<br>
      <span class="hot">持续编排</span>的循环，去监督<br>
      别的线程和别的 agent。
    </div>
    <div class="by">— Trash Panda</div>
    <div class="punch">
      单 agent ralph 是老东西<br>
      <span class="em">多 agent 互相监督的编排 loop</span> 才是新层
    </div>
  </div>
</body>
</html>
