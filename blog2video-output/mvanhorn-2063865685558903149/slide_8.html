<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .label {
      font-size: 26px;
      color: #8B5CF6;
      letter-spacing: 2px;
      font-weight: 600;
      margin-bottom: 24px;
    }
    .who {
      font-size: 22px;
      color: #B0B0CC;
      margin-bottom: 18px;
    }
    .who .name { color: #8B5CF6; font-weight: 700; }
    .defn {
      width: 100%;
      background: rgba(139, 92, 246, 0.1);
      border: 1px solid rgba(139, 92, 246, 0.4);
      border-left: 4px solid #8B5CF6;
      border-radius: 12px;
      padding: 36px 32px;
      margin-bottom: 32px;
    }
    .defn-q {
      font-size: 44px;
      font-weight: 800;
      color: #FFFFFF;
      line-height: 1.25;
      text-align: center;
    }
    .defn-q .em { color: #8B5CF6; }
    .receipts-title {
      font-size: 24px;
      color: #6B7280;
      letter-spacing: 2px;
      margin-bottom: 20px;
    }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 18px;
      width: 100%;
    }
    .stat {
      background: #1A1A2E;
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-left: 4px solid #F59E0B;
      border-radius: 12px;
      padding: 22px 16px;
      text-align: center;
    }
    .stat-num {
      font-size: 60px;
      font-weight: 800;
      color: #F59E0B;
      line-height: 1;
      margin-bottom: 10px;
    }
    .stat-num.small { font-size: 40px; }
    .stat-label {
      font-size: 18px;
      color: #B0B0CC;
      line-height: 1.3;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="label">Boris 在 WorkOS · 2026/6/2</div>
    <div class="who"><span class="name">Boris Cherny</span> 的干净定义</div>
    <div class="defn">
      <div class="defn-q">"我的工作是<br><span class="em">写 loop</span>。"</div>
    </div>
    <div class="receipts-title">— 没法反驳的收据 ——</div>
    <div class="stats">
      <div class="stat">
        <div class="stat-num">100%</div>
        <div class="stat-label">30 天对 Claude Code<br>的贡献由 Claude Code 写</div>
      </div>
      <div class="stat">
        <div class="stat-num">259</div>
        <div class="stat-label">个 PR<br>本人 land</div>
      </div>
      <div class="stat">
        <div class="stat-num small">2025/11</div>
        <div class="stat-label">删掉 IDE<br>再没打开过</div>
      </div>
    </div>
  </div>
</body>
</html>
