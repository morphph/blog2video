<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .label {
      font-size: 26px;
      color: #8B5CF6;
      letter-spacing: 2px;
      font-weight: 600;
      margin-bottom: 28px;
    }
    .headline {
      font-size: 56px;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 50px;
    }
    .headline .accent { color: #EF4444; }
    .ladder {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 36px;
    }
    .step {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.25);
      border-left: 4px solid #6B7280;
      border-radius: 12px;
      padding: 22px 28px;
      text-align: left;
      font-size: 28px;
      color: #B0B0CC;
    }
    .step.up {
      border-left-color: #10B981;
      color: #FFFFFF;
      font-weight: 700;
    }
    .step .arrow {
      color: #10B981;
      font-weight: 800;
      margin-right: 12px;
    }
    .punch {
      width: 100%;
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.4);
      border-left: 4px solid #10B981;
      border-radius: 12px;
      padding: 24px 28px;
      font-size: 26px;
      line-height: 1.5;
      color: #FFFFFF;
      text-align: left;
    }
    .punch .em { color: #10B981; font-weight: 700; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="label">被普遍误读的真正分量</div>
    <div class="headline">
      Boris 没说工程师没用<br>
      他说<span class="accent">恰恰相反</span>
    </div>
    <div class="ladder">
      <div class="step">从前 · 写代码</div>
      <div class="step up"><span class="arrow">↑</span>升一格 · 写"写代码的那个东西"</div>
    </div>
    <div class="punch">
      决定造什么、跟客户聊、协调团队<br>
      <span class="em">还是要人做 — 好工程师比以往更重要</span>
    </div>
  </div>
</body>
</html>
