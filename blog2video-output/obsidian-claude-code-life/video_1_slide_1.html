<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1080px; height: 1920px; background: #0D0D1A; font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif; color: #FFFFFF; overflow: hidden; }
    .slide { width: 100%; height: 100%; padding: 200px 72px 420px 72px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; position: relative; }

    .series-label {
      font-size: 28px;
      color: #8B5CF6;
      letter-spacing: 3px;
      margin-bottom: 40px;
      font-weight: 600;
    }

    .hook-title {
      font-size: 64px;
      font-weight: 900;
      line-height: 1.3;
      margin-bottom: 48px;
    }

    .hook-title .highlight { color: #EF4444; }
    .hook-title .highlight-yellow { color: #F59E0B; }

    .tension-cards {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-top: 16px;
    }

    .tension-card {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 24px 28px;
      display: flex;
      align-items: center;
      gap: 20px;
      text-align: left;
    }

    .tension-card.purple { border-left: 4px solid #8B5CF6; }
    .tension-card.red { border-left: 4px solid #EF4444; }

    .tension-card .icon {
      font-size: 36px;
      flex-shrink: 0;
    }

    .tension-card .text {
      font-size: 28px;
      color: #B0B0CC;
      line-height: 1.5;
    }

    .tension-card .text strong {
      color: #FFFFFF;
      font-weight: 700;
    }

    .tension-card .text .accent {
      color: #8B5CF6;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="series-label">精读AI &middot; AI工具</div>
    <div class="hook-title">
      一个命令<br>
      AI <span class="highlight">立刻加载</span>你的<br>
      <span class="highlight-yellow">整个人生</span>
    </div>
    <div class="tension-cards">
      <div class="tension-card red">
        <div class="icon">&#x1F504;</div>
        <div class="text">每次新对话<br><strong>又要从头解释你是谁</strong></div>
      </div>
      <div class="tension-card purple">
        <div class="icon">&#x26A1;</div>
        <div class="text">项目描述、播客上下文、工作流<br><span class="accent">一个字都不用解释</span></div>
      </div>
    </div>
  </div>
</body>
</html>
