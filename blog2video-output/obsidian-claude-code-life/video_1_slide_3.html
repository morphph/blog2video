<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1080px; height: 1920px; background: #0D0D1A; font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif; color: #FFFFFF; overflow: hidden; }
    .slide { width: 100%; height: 100%; padding: 200px 72px 420px 72px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; position: relative; }

    .section-label {
      font-size: 22px;
      color: #8B5CF6;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 24px;
      font-weight: 600;
    }

    .slide-title {
      font-size: 48px;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 40px;
    }

    .slide-title .accent { color: #F59E0B; }

    .layers {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .layer-card {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 24px 28px;
      display: flex;
      align-items: flex-start;
      gap: 20px;
      text-align: left;
    }

    .layer-card.blue { border-left: 4px solid #3B82F6; }
    .layer-card.purple { border-left: 4px solid #8B5CF6; }
    .layer-card.green { border-left: 4px solid #10B981; }

    .layer-number {
      font-size: 42px;
      font-weight: 900;
      flex-shrink: 0;
      line-height: 1;
      width: 52px;
      text-align: center;
    }

    .layer-number.blue { color: #3B82F6; }
    .layer-number.purple { color: #8B5CF6; }
    .layer-number.green { color: #10B981; }

    .layer-content {
      flex: 1;
    }

    .layer-title {
      font-size: 30px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #FFFFFF;
    }

    .layer-desc {
      font-size: 24px;
      color: #B0B0CC;
      line-height: 1.5;
    }

    .layer-desc code {
      color: #8B5CF6;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
    }

    .layer-example {
      font-size: 22px;
      color: #6B7280;
      margin-top: 8px;
      line-height: 1.4;
      font-style: italic;
    }

    .layer-highlight {
      color: #F59E0B;
      font-weight: 800;
      font-size: 28px;
      font-style: normal;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="section-label">THREE LAYERS</div>
    <div class="slide-title">关系网的<span class="accent">三层威力</span></div>
    <div class="layers">
      <div class="layer-card blue">
        <div class="layer-number blue">1</div>
        <div class="layer-content">
          <div class="layer-title">消灭重复解释</div>
          <div class="layer-desc">一个 <code>/context</code> 命令<br>加载全部背景信息</div>
          <div class="layer-example">像直接递过一份完整病历</div>
        </div>
      </div>
      <div class="layer-card purple">
        <div class="layer-number purple">2</div>
        <div class="layer-content">
          <div class="layer-title">理解你的意图</div>
          <div class="layer-desc"><code>/today</code> 拉取日历、任务、日记<br>生成当日计划</div>
          <div class="layer-example">发现日历和笔记的落差</div>
        </div>
      </div>
      <div class="layer-card green">
        <div class="layer-number green">3</div>
        <div class="layer-content">
          <div class="layer-title">发现隐藏模式</div>
          <div class="layer-desc"><code>/trace</code> 追踪想法演变<br>跨度 <span class="layer-highlight">13个月</span></div>
          <div class="layer-example">他自己都没意识到这个想法的酝酿</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
