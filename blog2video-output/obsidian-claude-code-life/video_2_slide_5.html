<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1080px; height: 1920px; background: #0D0D1A; font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif; color: #FFFFFF; overflow: hidden; }
    .slide { width: 100%; height: 100%; padding: 200px 72px 420px 72px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; position: relative; }
    .bg-glow { position: absolute; width: 600px; height: 600px; border-radius: 50%; background: radial-gradient(circle, rgba(139, 92, 246, 0.1) 0%, transparent 70%); top: 400px; left: 50%; transform: translateX(-50%); pointer-events: none; }
    .quote-mark { font-size: 80px; color: #8B5CF6; opacity: 0.35; font-family: Georgia, serif; line-height: 1; margin-bottom: 24px; position: relative; z-index: 1; }
    .core-quote { width: 100%; background: linear-gradient(135deg, rgba(139, 92, 246, 0.12), rgba(245, 158, 11, 0.06)); border: 1px solid rgba(139, 92, 246, 0.3); border-left: 4px solid #8B5CF6; border-radius: 12px; padding: 36px 32px; margin-bottom: 48px; position: relative; z-index: 1; }
    .quote-text { font-size: 36px; font-weight: 800; color: #FFFFFF; line-height: 1.45; }
    .quote-text .highlight { color: #F59E0B; }
    .quote-text .purple { color: #8B5CF6; }
    .action-title { font-size: 28px; font-weight: 700; color: #10B981; letter-spacing: 2px; margin-bottom: 24px; position: relative; z-index: 1; }
    .action-card { width: 100%; background: #1A1A2E; border: 1px solid rgba(16, 185, 129, 0.25); border-left: 4px solid #10B981; border-radius: 12px; padding: 28px 32px; text-align: left; margin-bottom: 32px; position: relative; z-index: 1; }
    .action-text { font-size: 26px; color: #B0B0CC; line-height: 1.6; }
    .action-text .em { color: #FFFFFF; font-weight: 700; }
    .action-text .cmd { font-family: 'SF Mono', 'JetBrains Mono', monospace; color: #10B981; font-weight: 700; background: rgba(16, 185, 129, 0.1); padding: 2px 8px; border-radius: 6px; }
    .next-ep { font-size: 26px; color: #6B7280; line-height: 1.5; position: relative; z-index: 1; }
    .next-ep .yellow { color: #F59E0B; font-weight: 700; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="bg-glow"></div>
    <div class="quote-mark">"</div>
    <div class="core-quote">
      <div class="quote-text">AI最强大的用法<br>不是替你<span class="highlight">写东西</span><br>而是告诉你——你<span class="purple">自己都没发现</span>的模式</div>
    </div>
    <div class="action-title">NOW DO THIS</div>
    <div class="action-card">
      <div class="action-text">用 <span class="cmd">Claude Code</span> 创建你的第一个自定义命令<br>让它读取过去一周的笔记<br>总结你<span class="em">最关心的三件事</span></div>
    </div>
    <div class="next-ep">下期：让AI<span class="yellow">自己设计命令</span>，比你想的还好用？</div>
  </div>
</body>
</html>
