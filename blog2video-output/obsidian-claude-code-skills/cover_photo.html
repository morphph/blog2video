<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 100px 72px 400px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }

    /* Background radial glow for depth */
    .bg-glow-main {
      position: absolute;
      top: 42%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 900px;
      height: 900px;
      background: radial-gradient(ellipse at center,
        rgba(139, 92, 246, 0.18) 0%,
        rgba(139, 92, 246, 0.06) 40%,
        transparent 70%);
      pointer-events: none;
    }

    .bg-glow-accent {
      position: absolute;
      top: 55%;
      left: 30%;
      width: 400px;
      height: 400px;
      background: radial-gradient(ellipse at center,
        rgba(239, 68, 68, 0.08) 0%,
        transparent 65%);
      pointer-events: none;
    }

    /* Series label */
    .series-label {
      font-size: 28px;
      font-weight: 600;
      color: #8B5CF6;
      letter-spacing: 4px;
      margin-bottom: 64px;
      opacity: 0.9;
      position: relative;
    }

    /* Main title block */
    .title-block {
      position: relative;
      margin-bottom: 64px;
    }

    .title-line {
      font-size: 96px;
      font-weight: 900;
      line-height: 1.2;
      letter-spacing: -1px;
    }

    .title-line-1 {
      color: #FFFFFF;
    }

    .title-line-2 {
      color: #FFFFFF;
    }

    .title-line-3 {
      color: #FFFFFF;
    }

    .highlight-red { color: #EF4444; }
    .highlight-yellow { color: #F59E0B; }

    /* Decorative line accent */
    .title-divider {
      width: 80px;
      height: 4px;
      background: linear-gradient(90deg, #8B5CF6, #EF4444);
      border-radius: 2px;
      margin: 32px auto 48px;
    }

    /* Sub-context text */
    .context-text {
      font-size: 36px;
      font-weight: 500;
      color: #B0B0CC;
      line-height: 1.55;
      max-width: 820px;
      margin-bottom: 56px;
    }
    .context-text .bold-white { color: #FFFFFF; font-weight: 700; }

    /* Source pill / tag */
    .source-tag {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-radius: 40px;
      padding: 14px 32px;
      font-size: 28px;
      color: #B0B0CC;
      font-weight: 500;
    }
    .source-tag .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #8B5CF6;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="bg-glow-main"></div>
    <div class="bg-glow-accent"></div>

    <div class="series-label">精读AI · Obsidian</div>

    <div class="title-block">
      <div class="title-line title-line-1">存了几年笔记</div>
      <div class="title-line title-line-2">AI却<span class="highlight-red">看不懂</span>？</div>
    </div>

    <div class="title-divider"></div>

    <div class="context-text">
      Callout <span class="bold-white">语法全乱</span>，wikilink 失效<br>
      Obsidian CEO <span class="highlight-yellow">亲自出手</span>了
    </div>

    <div class="source-tag">
      <div class="dot"></div>
      Obsidian + Claude Code
    </div>
  </div>
</body>
</html>
