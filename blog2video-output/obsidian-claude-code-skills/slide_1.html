<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }

    /* Background glow */
    .bg-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 800px;
      height: 800px;
      background: radial-gradient(ellipse at center, rgba(139, 92, 246, 0.08) 0%, transparent 70%);
      pointer-events: none;
    }

    /* Series label */
    .series-label {
      font-size: 26px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 500;
      margin-bottom: 48px;
      opacity: 0.9;
    }

    /* Main hook */
    .hook-text {
      font-size: 52px;
      font-weight: 800;
      line-height: 1.45;
      color: #FFFFFF;
      margin-bottom: 56px;
      max-width: 900px;
    }
    .hook-text .highlight-red {
      color: #EF4444;
    }
    .hook-text .highlight-yellow {
      color: #F59E0B;
    }

    /* Pain point cards */
    .cards-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
      max-width: 900px;
      margin-bottom: 52px;
    }
    .pain-card {
      background: #1A1A2E;
      border: 1px solid rgba(239, 68, 68, 0.25);
      border-left: 4px solid #EF4444;
      border-radius: 12px;
      padding: 24px 28px;
      text-align: left;
      display: flex;
      align-items: flex-start;
      gap: 16px;
    }
    .pain-icon {
      font-size: 28px;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .pain-text {
      font-size: 32px;
      font-weight: 600;
      color: #FFFFFF;
      line-height: 1.4;
    }
    .pain-text .dim {
      color: #B0B0CC;
      font-size: 28px;
      font-weight: 400;
    }

    /* Breaking news banner */
    .breaking-banner {
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.15) 0%, rgba(139, 92, 246, 0.05) 100%);
      border: 1px solid rgba(139, 92, 246, 0.4);
      border-left: 4px solid #8B5CF6;
      border-radius: 12px;
      padding: 28px 32px;
      width: 100%;
      max-width: 900px;
      text-align: left;
    }
    .breaking-tag {
      font-size: 22px;
      font-weight: 700;
      color: #8B5CF6;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }
    .breaking-text {
      font-size: 30px;
      font-weight: 600;
      color: #FFFFFF;
      line-height: 1.5;
    }
    .breaking-text .accent {
      color: #F59E0B;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="bg-glow"></div>

    <div class="series-label">精读AI · Obsidian</div>

    <div class="hook-text">
      存了几年笔记，<br>
      AI生成的格式<br>
      在Obsidian里<span class="highlight-red">全是乱的</span>
    </div>

    <div class="cards-container">
      <div class="pain-card">
        <div class="pain-icon">⚠️</div>
        <div class="pain-text">
          Callout语法不对，wikilink失效
          <div class="dim">折腾半天不如自己手打</div>
        </div>
      </div>
      <div class="pain-card">
        <div class="pain-icon">🔥</div>
        <div class="pain-text">
          Obsidian CEO <span style="color:#EF4444">亲自出手</span>
          <div class="dim">史上第一个官方维护的 Agent Skills</div>
        </div>
      </div>
    </div>

    <div class="breaking-banner">
      <div class="breaking-tag">今天讲什么</div>
      <div class="breaking-text">
        15分钟，让 Claude <span class="accent">真正读懂</span>你的知识库
      </div>
    </div>
  </div>
</body>
</html>
