<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }

    .bg-glow {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 900px;
      height: 700px;
      background: radial-gradient(ellipse at center, rgba(139, 92, 246, 0.07) 0%, transparent 70%);
      pointer-events: none;
    }

    .section-tag {
      font-size: 24px;
      font-weight: 600;
      color: #8B5CF6;
      letter-spacing: 3px;
      margin-bottom: 32px;
      opacity: 0.85;
    }

    .main-title {
      font-size: 58px;
      font-weight: 900;
      line-height: 1.3;
      margin-bottom: 16px;
      color: #FFFFFF;
    }
    .main-title .accent {
      color: #8B5CF6;
    }

    .subtitle {
      font-size: 30px;
      color: #B0B0CC;
      margin-bottom: 60px;
      font-weight: 400;
    }

    /* Equation / analogy section */
    .analogy-container {
      width: 100%;
      max-width: 920px;
      margin-bottom: 40px;
    }

    .analogy-row {
      display: flex;
      align-items: stretch;
      gap: 0;
      margin-bottom: 16px;
      border-radius: 12px;
      overflow: hidden;
    }

    .analogy-label {
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.3);
      border-right: none;
      border-radius: 12px 0 0 12px;
      padding: 24px 28px;
      font-size: 26px;
      font-weight: 700;
      color: #3B82F6;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 180px;
      flex-shrink: 0;
    }

    .analogy-content {
      background: #1A1A2E;
      border: 1px solid rgba(59, 130, 246, 0.2);
      border-radius: 0 12px 12px 0;
      padding: 24px 28px;
      font-size: 28px;
      color: #FFFFFF;
      line-height: 1.5;
      text-align: left;
      flex: 1;
      display: flex;
      align-items: center;
    }
    .analogy-content .dim {
      color: #B0B0CC;
      font-size: 25px;
      display: block;
      margin-top: 4px;
    }

    .equals-sign {
      font-size: 44px;
      font-weight: 900;
      color: #10B981;
      text-align: center;
      margin: 8px 0;
    }

    /* Insight card */
    .insight-card {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.1) 0%, rgba(16, 185, 129, 0.03) 100%);
      border: 1px solid rgba(16, 185, 129, 0.35);
      border-left: 4px solid #10B981;
      border-radius: 12px;
      padding: 28px 32px;
      width: 100%;
      max-width: 920px;
      text-align: left;
      margin-bottom: 32px;
    }
    .insight-label {
      font-size: 22px;
      color: #10B981;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }
    .insight-text {
      font-size: 30px;
      font-weight: 600;
      color: #FFFFFF;
      line-height: 1.5;
    }

    /* Key fact */
    .key-fact {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.25);
      border-radius: 12px;
      padding: 24px 28px;
      width: 100%;
      max-width: 920px;
      text-align: left;
    }
    .key-fact-row {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 12px;
    }
    .key-fact-row:last-child {
      margin-bottom: 0;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #8B5CF6;
      flex-shrink: 0;
    }
    .key-fact-text {
      font-size: 28px;
      color: #FFFFFF;
      line-height: 1.4;
    }
    .key-fact-text .code {
      font-family: 'SF Mono', 'Courier New', monospace;
      background: rgba(139, 92, 246, 0.15);
      color: #A78BFA;
      padding: 2px 10px;
      border-radius: 6px;
      font-size: 26px;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="bg-glow"></div>

    <div class="section-tag">核心认知</div>

    <div class="main-title">
      你的 Vault 本质上<br>
      就是一个<span class="accent">代码仓库</span>
    </div>
    <div class="subtitle">不是比喻，是字面意思</div>

    <div class="analogy-container">
      <div class="analogy-row">
        <div class="analogy-label">代码库</div>
        <div class="analogy-content">
          纯文本文件，按文件夹组织
          <span class="dim">文件之间互相引用</span>
        </div>
      </div>

      <div class="equals-sign">=</div>

      <div class="analogy-row">
        <div class="analogy-label">Vault</div>
        <div class="analogy-content">
          纯文本 Markdown，按文件夹组织
          <span class="dim">用双链 [[wikilink]] 互相引用</span>
        </div>
      </div>
    </div>

    <div class="insight-card">
      <div class="insight-label">为什么天然匹配</div>
      <div class="insight-text">
        Claude Code 本来就是为读写代码仓库设计的。你的笔记库，对它来说是同一种东西。
      </div>
    </div>

    <div class="key-fact">
      <div class="key-fact-row">
        <div class="dot"></div>
        <div class="key-fact-text">笔记存在本地文件系统，无 API 无账号验证</div>
      </div>
      <div class="key-fact-row">
        <div class="dot"></div>
        <div class="key-fact-text">进入 vault 目录，运行 <span class="code">claude</span> 就接上了</div>
      </div>
    </div>
  </div>
</body>
</html>
