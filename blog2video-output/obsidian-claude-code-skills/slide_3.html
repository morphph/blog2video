<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }

    .bg-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 900px;
      height: 800px;
      background: radial-gradient(ellipse at center, rgba(59, 130, 246, 0.06) 0%, transparent 70%);
      pointer-events: none;
    }

    .section-tag {
      font-size: 24px;
      font-weight: 600;
      color: #3B82F6;
      letter-spacing: 3px;
      margin-bottom: 28px;
    }

    .main-title {
      font-size: 54px;
      font-weight: 900;
      line-height: 1.3;
      margin-bottom: 12px;
      color: #FFFFFF;
    }

    .subtitle {
      font-size: 28px;
      color: #B0B0CC;
      margin-bottom: 52px;
    }

    /* Mode cards */
    .modes-container {
      display: flex;
      flex-direction: column;
      gap: 24px;
      width: 100%;
      max-width: 936px;
    }

    .mode-card {
      background: #1A1A2E;
      border: 1px solid rgba(59, 130, 246, 0.2);
      border-radius: 12px;
      padding: 28px 28px 28px 0;
      display: flex;
      align-items: stretch;
      overflow: hidden;
      text-align: left;
    }

    .mode-number-bar {
      width: 8px;
      flex-shrink: 0;
      border-radius: 4px 0 0 4px;
      margin-right: 24px;
    }
    .mode-number-bar.blue { background: #3B82F6; }
    .mode-number-bar.purple { background: #8B5CF6; }
    .mode-number-bar.green { background: #10B981; }

    .mode-body {
      flex: 1;
    }

    .mode-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 12px;
    }

    .mode-badge {
      font-size: 20px;
      font-weight: 800;
      padding: 4px 16px;
      border-radius: 20px;
      flex-shrink: 0;
    }
    .mode-badge.blue {
      background: rgba(59, 130, 246, 0.15);
      color: #3B82F6;
      border: 1px solid rgba(59, 130, 246, 0.3);
    }
    .mode-badge.purple {
      background: rgba(139, 92, 246, 0.15);
      color: #8B5CF6;
      border: 1px solid rgba(139, 92, 246, 0.3);
    }
    .mode-badge.green {
      background: rgba(16, 185, 129, 0.15);
      color: #10B981;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .mode-name {
      font-size: 30px;
      font-weight: 800;
      color: #FFFFFF;
    }

    .mode-desc {
      font-size: 26px;
      color: #FFFFFF;
      line-height: 1.5;
      margin-bottom: 10px;
    }

    .mode-tip {
      font-size: 23px;
      color: #B0B0CC;
      line-height: 1.4;
    }

    .mode-tip .code {
      font-family: 'SF Mono', 'Courier New', monospace;
      background: rgba(139, 92, 246, 0.15);
      color: #A78BFA;
      padding: 1px 8px;
      border-radius: 5px;
      font-size: 22px;
    }

    .choose-hint {
      font-size: 26px;
      color: #6B7280;
      margin-top: 32px;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="bg-glow"></div>

    <div class="section-tag">连接方式</div>
    <div class="main-title">三种模式，任选其一</div>
    <div class="subtitle">根据你的习惯选择最顺手的</div>

    <div class="modes-container">

      <div class="mode-card">
        <div class="mode-number-bar blue"></div>
        <div class="mode-body">
          <div class="mode-header">
            <div class="mode-badge blue">模式 1</div>
            <div class="mode-name">直接文件系统访问</div>
          </div>
          <div class="mode-desc">最简单，零配置</div>
          <div class="mode-tip">
            进入 vault 目录 → 运行 <span class="code">claude</span> → 完成<br>
            适合已经习惯命令行的用户
          </div>
        </div>
      </div>

      <div class="mode-card">
        <div class="mode-number-bar purple"></div>
        <div class="mode-body">
          <div class="mode-header">
            <div class="mode-badge purple">模式 2</div>
            <div class="mode-name">MCP Bridge</div>
          </div>
          <div class="mode-desc">Obsidian 内部运行 MCP 服务器</div>
          <div class="mode-tip">
            用 WebSocket 连接 Claude Code 与 Obsidian<br>
            Claude 能感知你当前打开的是哪个文件
          </div>
        </div>
      </div>

      <div class="mode-card">
        <div class="mode-number-bar green"></div>
        <div class="mode-body">
          <div class="mode-header">
            <div class="mode-badge green">模式 3</div>
            <div class="mode-name">嵌入式终端</div>
          </div>
          <div class="mode-desc">Obsidian 界面里内嵌终端</div>
          <div class="mode-tip">
            左边笔记，右边 Claude Code，并排工作<br>
            不喜欢来回切窗口的首选
          </div>
        </div>
      </div>

    </div>

    <div class="choose-hint">选好模式之后，下一步：配置 Claude 的「记忆」</div>
  </div>
</body>
</html>
