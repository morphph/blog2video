<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }

    .bg-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 800px;
      height: 800px;
      background: radial-gradient(ellipse at center, rgba(16, 185, 129, 0.06) 0%, transparent 70%);
      pointer-events: none;
    }

    .section-tag {
      font-size: 24px;
      font-weight: 600;
      color: #10B981;
      letter-spacing: 3px;
      margin-bottom: 24px;
    }

    .main-title {
      font-size: 54px;
      font-weight: 900;
      line-height: 1.3;
      margin-bottom: 12px;
      color: #FFFFFF;
    }

    .subtitle {
      font-size: 28px;
      color: #B0B0CC;
      margin-bottom: 52px;
    }
    .subtitle .accent { color: #10B981; font-weight: 700; }

    /* Checklist steps */
    .checklist {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
      max-width: 936px;
      margin-bottom: 44px;
    }

    .check-item {
      background: #1A1A2E;
      border: 1px solid rgba(16, 185, 129, 0.2);
      border-radius: 12px;
      padding: 26px 28px;
      display: flex;
      align-items: flex-start;
      gap: 20px;
      text-align: left;
      position: relative;
      overflow: hidden;
    }

    .check-item::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: #10B981;
    }

    .step-circle {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(16, 185, 129, 0.15);
      border: 2px solid rgba(16, 185, 129, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 900;
      color: #10B981;
      flex-shrink: 0;
    }

    .check-body {
      flex: 1;
    }

    .check-title {
      font-size: 30px;
      font-weight: 700;
      color: #FFFFFF;
      margin-bottom: 6px;
      line-height: 1.35;
    }

    .check-detail {
      font-size: 24px;
      color: #B0B0CC;
      line-height: 1.45;
    }

    .check-detail .code {
      font-family: 'SF Mono', 'Courier New', monospace;
      background: rgba(16, 185, 129, 0.12);
      color: #34D399;
      padding: 1px 10px;
      border-radius: 5px;
      font-size: 22px;
    }

    .check-detail .warn {
      color: #F59E0B;
      font-weight: 600;
    }

    /* Time estimate */
    .time-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 40px;
      padding: 16px 40px;
    }
    .time-number {
      font-size: 64px;
      font-weight: 900;
      color: #10B981;
      line-height: 1;
    }
    .time-unit {
      font-size: 28px;
      color: #B0B0CC;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="bg-glow"></div>

    <div class="section-tag">安装路径</div>
    <div class="main-title">四步完成配置</div>
    <div class="subtitle">按顺序执行，<span class="accent">15分钟搞定</span></div>

    <div class="checklist">

      <div class="check-item">
        <div class="step-circle">1</div>
        <div class="check-body">
          <div class="check-title">确认订阅权限</div>
          <div class="check-detail">
            需要 Claude <span class="warn">Pro / Max / Team / Enterprise</span><br>
            Claude Code 需要这个级别的访问权限
          </div>
        </div>
      </div>

      <div class="check-item">
        <div class="step-circle">2</div>
        <div class="check-body">
          <div class="check-title">进入 vault 目录并启动</div>
          <div class="check-detail">
            打开终端 → <span class="code">cd ~/your-vault</span> → <span class="code">claude</span>
          </div>
        </div>
      </div>

      <div class="check-item">
        <div class="step-circle">3</div>
        <div class="check-body">
          <div class="check-title">执行 /init，创建 CLAUDE.md</div>
          <div class="check-detail">
            Claude 在 vault 根目录生成「记忆文件」<br>
            写入你的 vault 结构和命名规范
          </div>
        </div>
      </div>

      <div class="check-item">
        <div class="step-circle">4</div>
        <div class="check-body">
          <div class="check-title">安装官方 Skills 包</div>
          <div class="check-detail">
            <span class="code">/plugin marketplace add kepano/obsidian-skills</span>
          </div>
        </div>
      </div>

    </div>

    <div class="time-badge">
      <div class="time-number">15</div>
      <div class="time-unit">分钟<br>完成</div>
    </div>
  </div>
</body>
</html>
