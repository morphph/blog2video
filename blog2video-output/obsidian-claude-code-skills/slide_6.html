<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }

    .bg-glow-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 1000px;
      height: 900px;
      background: radial-gradient(ellipse at center, rgba(139, 92, 246, 0.09) 0%, transparent 65%);
      pointer-events: none;
    }

    .section-tag {
      font-size: 24px;
      font-weight: 600;
      color: #8B5CF6;
      letter-spacing: 3px;
      margin-bottom: 36px;
    }

    .main-title {
      font-size: 50px;
      font-weight: 900;
      line-height: 1.35;
      margin-bottom: 48px;
      color: #FFFFFF;
    }
    .main-title .accent { color: #8B5CF6; }

    /* Core conclusion */
    .conclusion-card {
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.12) 0%, rgba(139, 92, 246, 0.04) 100%);
      border: 1px solid rgba(139, 92, 246, 0.35);
      border-radius: 12px;
      padding: 32px 36px;
      width: 100%;
      max-width: 936px;
      text-align: left;
      margin-bottom: 28px;
    }
    .conclusion-label {
      font-size: 21px;
      color: #8B5CF6;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 14px;
    }
    .conclusion-text {
      font-size: 30px;
      font-weight: 600;
      color: #FFFFFF;
      line-height: 1.6;
    }
    .conclusion-text .accent-red { color: #EF4444; }
    .conclusion-text .accent-green { color: #10B981; }
    .conclusion-text .accent-purple { color: #8B5CF6; }

    /* Action card */
    .action-card {
      background: #1A1A2E;
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-left: 4px solid #10B981;
      border-radius: 12px;
      padding: 28px 28px;
      width: 100%;
      max-width: 936px;
      text-align: left;
      margin-bottom: 28px;
    }
    .action-label {
      font-size: 21px;
      color: #10B981;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 14px;
    }
    .action-steps {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .action-step {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 26px;
      color: #FFFFFF;
    }
    .action-step .arrow {
      color: #10B981;
      font-weight: 700;
      flex-shrink: 0;
    }
    .action-step .code {
      font-family: 'SF Mono', 'Courier New', monospace;
      background: rgba(16, 185, 129, 0.12);
      color: #34D399;
      padding: 2px 10px;
      border-radius: 5px;
      font-size: 23px;
    }

    /* Next episode teaser */
    .teaser-card {
      background: rgba(59, 130, 246, 0.07);
      border: 1px solid rgba(59, 130, 246, 0.25);
      border-radius: 12px;
      padding: 24px 28px;
      width: 100%;
      max-width: 936px;
      text-align: left;
    }
    .teaser-label {
      font-size: 20px;
      color: #3B82F6;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }
    .teaser-text {
      font-size: 27px;
      color: #B0B0CC;
      line-height: 1.5;
    }
    .teaser-text b { color: #FFFFFF; }

    /* Brand footer */
    .brand-footer {
      margin-top: 40px;
      text-align: center;
    }
    .brand-name {
      font-size: 30px;
      font-weight: 800;
      color: #8B5CF6;
      letter-spacing: 2px;
      margin-bottom: 6px;
    }
    .brand-tagline {
      font-size: 22px;
      color: #6B7280;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="bg-glow-center"></div>

    <div class="section-tag">核心结论</div>
    <div class="main-title">
      你的 Vault <span class="accent">从来就不需要</span><br>
      专门的 AI 接口
    </div>

    <div class="conclusion-card">
      <div class="conclusion-label">关键洞察</div>
      <div class="conclusion-text">
        你的笔记库本身就是个<span class="accent-green">文件系统</span>，Claude Code <span class="accent-green">天生就能读</span>。<br><br>
        你缺的只是让 Claude 说正确语法的「词典」——<span class="accent-purple">官方 Skills 包</span>就是这本词典。
      </div>
    </div>

    <div class="action-card">
      <div class="action-label">现在就能做的一件事</div>
      <div class="action-steps">
        <div class="action-step">
          <span class="arrow">→</span>
          打开终端，<span class="code">cd</span> 进入 vault 目录
        </div>
        <div class="action-step">
          <span class="arrow">→</span>
          运行 <span class="code">claude</span>，执行 <span class="code">/init</span>
        </div>
        <div class="action-step">
          <span class="arrow">→</span>
          AI 工作流就跑起来了
        </div>
      </div>
    </div>

    <div class="teaser-card">
      <div class="teaser-label">下期预告</div>
      <div class="teaser-text">
        配好之后 Claude 能帮你做哪些<br>
        <b>以前要花 15 分钟的事？</b>
      </div>
    </div>

    <div class="brand-footer">
      <div class="brand-name">精读AI</div>
      <div class="brand-tagline">AI世界很吵，精读一篇，胜过刷一百条</div>
    </div>
  </div>
</body>
</html>
