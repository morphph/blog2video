<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .cover {
      width: 100%; height: 100%;
      padding: 140px 72px 400px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
      background:
        radial-gradient(circle at 22% 18%, rgba(139, 92, 246, 0.22), transparent 55%),
        radial-gradient(circle at 80% 78%, rgba(239, 68, 68, 0.18), transparent 55%),
        radial-gradient(circle at 50% 48%, rgba(245, 158, 11, 0.10), transparent 60%),
        #0D0D1A;
    }
    .series-tag {
      font-size: 30px;
      color: #8B5CF6;
      letter-spacing: 4px;
      font-weight: 700;
      margin-bottom: 50px;
    }
    .headline {
      font-size: 86px;
      font-weight: 900;
      line-height: 1.14;
      letter-spacing: -2px;
      margin-bottom: 60px;
      color: #FFFFFF;
    }
    .headline .red { color: #EF4444; }
    .headline .yellow { color: #F59E0B; }
    .headline .quote { color: #B0B0CC; font-weight: 800; }
    .stats-row {
      display: flex;
      gap: 18px;
      margin-bottom: 56px;
      width: 100%;
      max-width: 920px;
    }
    .stat {
      flex: 1;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.35);
      border-left: 4px solid #8B5CF6;
      border-radius: 14px;
      padding: 24px 14px;
      text-align: center;
    }
    .stat.red { border-color: rgba(239, 68, 68, 0.4); border-left-color: #EF4444; }
    .stat.yellow { border-color: rgba(245, 158, 11, 0.4); border-left-color: #F59E0B; }
    .stat .num {
      font-size: 72px;
      font-weight: 800;
      color: #8B5CF6;
      line-height: 1;
      margin-bottom: 10px;
    }
    .stat.red .num { color: #EF4444; }
    .stat.yellow .num { color: #F59E0B; }
    .stat .label {
      font-size: 22px;
      color: #B0B0CC;
      font-weight: 600;
    }
    .source-tag {
      display: inline-block;
      background: #1A1A30;
      border: 1px solid rgba(139, 92, 246, 0.25);
      border-radius: 999px;
      padding: 14px 32px;
      font-size: 22px;
      color: #6B6B80;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .source-tag .author { color: #8B8BA8; font-weight: 700; }
  </style>
</head>
<body>
  <div class="cover">
    <div class="series-tag">精读AI · Agent 工程</div>
    <div class="headline">
      睡前推 <span class="yellow">50 张</span> ticket<br>
      醒来 <span class="red">7000 行</span>没了
    </div>
    <div class="stats-row">
      <div class="stat">
        <div class="num">50</div>
        <div class="label">Ticket</div>
      </div>
      <div class="stat red">
        <div class="num">30</div>
        <div class="label">PR 合并</div>
      </div>
      <div class="stat yellow">
        <div class="num">7K</div>
        <div class="label">行净删</div>
      </div>
    </div>
    <div class="source-tag">
      <span class="author">George · @odysseus0z</span> · OpenAI Symphony
    </div>
  </div>
</body>
</html>
