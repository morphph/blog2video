<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
      background:
        radial-gradient(circle at 25% 18%, rgba(245, 158, 11, 0.16), transparent 55%),
        radial-gradient(circle at 80% 80%, rgba(239, 68, 68, 0.18), transparent 55%),
        #0D0D1A;
    }
    .tag {
      font-size: 28px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 40px;
    }
    .headline {
      font-size: 64px;
      font-weight: 900;
      line-height: 1.18;
      letter-spacing: -1px;
      margin-bottom: 56px;
    }
    .headline .yellow { color: #F59E0B; }
    .headline .red { color: #EF4444; }
    .stats-row {
      display: flex;
      gap: 20px;
      margin-bottom: 40px;
      width: 100%;
      max-width: 920px;
    }
    .stat {
      flex: 1;
      background: #1A1A2E;
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-left: 4px solid #F59E0B;
      border-radius: 14px;
      padding: 26px 18px;
      text-align: center;
    }
    .stat.red { border-color: rgba(239, 68, 68, 0.4); border-left-color: #EF4444; }
    .stat.green { border-color: rgba(16, 185, 129, 0.4); border-left-color: #10B981; }
    .stat .num {
      font-size: 80px;
      font-weight: 800;
      color: #F59E0B;
      line-height: 1;
      margin-bottom: 10px;
    }
    .stat.red .num { color: #EF4444; }
    .stat.green .num { color: #10B981; }
    .stat .num .unit { font-size: 32px; }
    .stat .label {
      font-size: 22px;
      color: #B0B0CC;
      font-weight: 600;
    }
    .verdict {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.4);
      border-left: 4px solid #8B5CF6;
      border-radius: 14px;
      padding: 22px 28px;
      max-width: 920px;
      width: 100%;
      text-align: left;
    }
    .verdict .label {
      font-size: 22px;
      color: #8B5CF6;
      letter-spacing: 2px;
      font-weight: 800;
      margin-bottom: 10px;
    }
    .verdict .text {
      font-size: 28px;
      color: #FFFFFF;
      font-weight: 700;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="tag">真实战报 · 一晚上</div>
    <div class="headline">
      睡前推 <span class="yellow">50 张</span> ticket<br>
      醒来 <span class="red">7000 行</span>没了
    </div>
    <div class="stats-row">
      <div class="stat">
        <div class="num">50</div>
        <div class="label">Ticket</div>
      </div>
      <div class="stat red">
        <div class="num">30</div>
        <div class="label">PR 合并</div>
      </div>
      <div class="stat green">
        <div class="num">7K<span class="unit">行</span></div>
        <div class="label">净删代码</div>
      </div>
    </div>
    <div class="verdict">
      <div class="label">主角 · 工具</div>
      <div class="text">
        George @odysseus0z<br>
        OpenAI Symphony 编排器
      </div>
    </div>
  </div>
</body>
</html>
