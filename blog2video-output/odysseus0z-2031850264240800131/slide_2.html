<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
    }
    .title {
      font-size: 60px;
      font-weight: 900;
      line-height: 1.18;
      letter-spacing: -1px;
      margin-bottom: 56px;
    }
    .title .yellow { color: #F59E0B; }
    .parts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 22px;
      width: 100%;
      max-width: 920px;
      margin-bottom: 40px;
    }
    .part {
      background: #1A1A2E;
      border: 1px solid rgba(59, 130, 246, 0.4);
      border-left: 4px solid #3B82F6;
      border-radius: 14px;
      padding: 28px 24px;
      text-align: left;
    }
    .part.brain {
      border-color: rgba(245, 158, 11, 0.5);
      border-left-color: #F59E0B;
      grid-column: span 2;
    }
    .part .role {
      font-size: 20px;
      color: #6B7280;
      letter-spacing: 1.5px;
      font-weight: 700;
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    .part.brain .role { color: #F59E0B; }
    .part .name {
      font-size: 38px;
      font-weight: 800;
      color: #FFFFFF;
      margin-bottom: 6px;
    }
    .part .name .accent { color: #3B82F6; }
    .part.brain .name { font-size: 44px; }
    .part.brain .name .accent { color: #F59E0B; }
    .part .desc {
      font-size: 22px;
      color: #B0B0CC;
      font-weight: 600;
    }
    .verdict {
      background: #1A1A2E;
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-left: 4px solid #F59E0B;
      border-radius: 14px;
      padding: 22px 28px;
      max-width: 920px;
      width: 100%;
      text-align: left;
    }
    .verdict .text {
      font-size: 28px;
      color: #FFFFFF;
      font-weight: 700;
      line-height: 1.45;
    }
    .verdict .em { color: #F59E0B; font-weight: 800; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="title">骨架 <span class="yellow">四个零件</span></div>
    <div class="parts">
      <div class="part">
        <div class="role">编排器</div>
        <div class="name">Symphony</div>
        <div class="desc">轮询 / 派发 / 并发</div>
      </div>
      <div class="part">
        <div class="role">控制面</div>
        <div class="name">Linear</div>
        <div class="desc">看板 = 指令</div>
      </div>
      <div class="part">
        <div class="role">Agent</div>
        <div class="name">Codex</div>
        <div class="desc">真正干活的工人</div>
      </div>
      <div class="part">
        <div class="role">Prompt</div>
        <div class="name">WORKFLOW.md</div>
        <div class="desc">藏在仓库里的大脑</div>
      </div>
      <div class="part brain">
        <div class="role">真正起作用的</div>
        <div class="name">第四个 · <span class="accent">那段 prompt</span></div>
      </div>
    </div>
  </div>
</body>
</html>
