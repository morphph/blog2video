<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
      background:
        radial-gradient(circle at 20% 22%, rgba(245, 158, 11, 0.14), transparent 55%),
        radial-gradient(circle at 80% 80%, rgba(139, 92, 246, 0.16), transparent 55%),
        #0D0D1A;
    }
    .tag {
      font-size: 26px;
      color: #F59E0B;
      letter-spacing: 3px;
      font-weight: 800;
      margin-bottom: 30px;
    }
    .quote-mark {
      font-size: 140px;
      font-weight: 900;
      color: #F59E0B;
      line-height: 0.5;
      margin-bottom: 30px;
      opacity: 0.7;
    }
    .quote-en {
      font-size: 40px;
      font-weight: 800;
      color: #FFFFFF;
      line-height: 1.35;
      margin-bottom: 36px;
      max-width: 920px;
    }
    .quote-en .em { color: #F59E0B; }
    .translate {
      background: #1A1A2E;
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-left: 4px solid #F59E0B;
      border-radius: 14px;
      padding: 22px 28px;
      max-width: 920px;
      width: 100%;
      text-align: left;
      margin-bottom: 22px;
    }
    .translate .label {
      font-size: 20px;
      color: #F59E0B;
      letter-spacing: 2px;
      font-weight: 800;
      margin-bottom: 10px;
    }
    .translate .text {
      font-size: 30px;
      color: #FFFFFF;
      font-weight: 800;
      line-height: 1.4;
    }
    .translate .em { color: #F59E0B; }
    .source {
      font-size: 22px;
      color: #6B7280;
      font-weight: 600;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="tag">作者亲口否定</div>
    <div class="quote-mark">"</div>
    <div class="quote-en">
      It's <span class="em">the prompt</span><br>
      in WORKFLOW.md.<br>
      Symphony is <span class="em">plumbing</span>.
    </div>
    <div class="translate">
      <div class="label">中文</div>
      <div class="text">
        起作用的是<span class="em">那段 prompt</span><br>
        Symphony 只是<span class="em">水管</span>
      </div>
    </div>
    <div class="source">— George · @odysseus0z</div>
  </div>
</body>
</html>
