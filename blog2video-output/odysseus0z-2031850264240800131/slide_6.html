<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
    }
    .title {
      font-size: 56px;
      font-weight: 900;
      line-height: 1.2;
      letter-spacing: -1px;
      margin-bottom: 14px;
    }
    .title .red { color: #EF4444; }
    .subtitle {
      font-size: 22px;
      color: #B0B0CC;
      font-weight: 600;
      margin-bottom: 36px;
    }
    .checklist {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      max-width: 920px;
    }
    .item {
      display: flex;
      align-items: flex-start;
      gap: 18px;
      background: #1A1A2E;
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-left: 4px solid #EF4444;
      border-radius: 14px;
      padding: 22px 24px;
      text-align: left;
    }
    .item .num {
      font-size: 40px;
      font-weight: 800;
      color: #EF4444;
      min-width: 50px;
      line-height: 1;
    }
    .item .body { flex: 1; }
    .item .name {
      font-size: 28px;
      font-weight: 800;
      color: #FFFFFF;
      margin-bottom: 4px;
    }
    .item .desc {
      font-size: 20px;
      color: #B0B0CC;
      font-weight: 600;
      line-height: 1.4;
    }
    .item .desc .em { color: #F59E0B; font-weight: 800; }
    .item .desc .big {
      color: #F59E0B;
      font-size: 28px;
      font-weight: 900;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="title">代价 <span class="red">四条</span></div>
    <div class="subtitle">不是开箱即用的爽文</div>
    <div class="checklist">
      <div class="item">
        <div class="num">1</div>
        <div class="body">
          <div class="name">活必须是 ticket 形状</div>
          <div class="desc">每张 ticket = 一个可审 PR</div>
        </div>
      </div>
      <div class="item">
        <div class="num">2</div>
        <div class="body">
          <div class="name">敢合没逐行看的 PR</div>
          <div class="desc">信任问题，不是技术问题</div>
        </div>
      </div>
      <div class="item">
        <div class="num">3</div>
        <div class="body">
          <div class="name">核心 prompt 没公开</div>
          <div class="desc">想复现要自己摸索</div>
        </div>
      </div>
      <div class="item">
        <div class="num">4</div>
        <div class="body">
          <div class="name">并发要慢慢加</div>
          <div class="desc">从 <span class="big">2-3</span> 起步往上调</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
