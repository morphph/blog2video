<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
    }
    .title {
      font-size: 54px;
      font-weight: 900;
      line-height: 1.2;
      letter-spacing: -1px;
      margin-bottom: 30px;
    }
    .title .purple { color: #8B5CF6; }
    .stats-row {
      display: flex;
      gap: 14px;
      width: 100%;
      max-width: 920px;
      margin-bottom: 28px;
    }
    .stat {
      flex: 1;
      background: #1A1A2E;
      border: 1px solid rgba(59, 130, 246, 0.35);
      border-left: 4px solid #3B82F6;
      border-radius: 14px;
      padding: 22px 12px;
      text-align: center;
    }
    .stat.gray { border-color: rgba(107, 114, 128, 0.4); border-left-color: #6B7280; }
    .stat.green { border-color: rgba(16, 185, 129, 0.5); border-left-color: #10B981; }
    .stat .num {
      font-size: 60px;
      font-weight: 800;
      color: #3B82F6;
      line-height: 1;
      margin-bottom: 8px;
    }
    .stat.gray .num { color: #6B7280; }
    .stat.green .num { color: #10B981; }
    .stat .num .unit { font-size: 26px; }
    .stat .label {
      font-size: 20px;
      color: #B0B0CC;
      font-weight: 600;
    }
    .signal {
      background: #1A1A2E;
      border: 1px solid rgba(16, 185, 129, 0.4);
      border-left: 4px solid #10B981;
      border-radius: 14px;
      padding: 20px 28px;
      max-width: 920px;
      width: 100%;
      text-align: left;
      margin-bottom: 22px;
    }
    .signal .label {
      font-size: 20px;
      color: #10B981;
      letter-spacing: 2px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .signal .text {
      font-size: 26px;
      color: #FFFFFF;
      font-weight: 700;
      line-height: 1.4;
    }
    .signal .em { color: #10B981; font-weight: 800; }
    .verdict {
      background: #1A1A2E;
      border: 1px solid rgba(245, 158, 11, 0.45);
      border-left: 4px solid #F59E0B;
      border-radius: 14px;
      padding: 22px 28px;
      max-width: 920px;
      width: 100%;
      text-align: left;
    }
    .verdict .text {
      font-size: 30px;
      color: #FFFFFF;
      font-weight: 800;
      line-height: 1.4;
    }
    .verdict .em { color: #F59E0B; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="title">观众<span class="purple">不是围观</span>，是收藏</div>
    <div class="stats-row">
      <div class="stat">
        <div class="num">222<span class="unit">K</span></div>
        <div class="label">浏览</div>
      </div>
      <div class="stat gray">
        <div class="num">840</div>
        <div class="label">点赞</div>
      </div>
      <div class="stat green">
        <div class="num">1996</div>
        <div class="label">Bookmark</div>
      </div>
    </div>
    <div class="signal">
      <div class="label">异常信号</div>
      <div class="text">
        Bookmark <span class="em">比点赞多 2 倍</span><br>
        准备回家自己试
      </div>
    </div>
    <div class="verdict">
      <div class="text">
        合并 PR <span class="em">比写 PR 难</span><br>
        这是被低估的瓶颈
      </div>
    </div>
  </div>
</body>
</html>
