<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
      background:
        radial-gradient(circle at 20% 20%, rgba(139, 92, 246, 0.18), transparent 55%),
        radial-gradient(circle at 80% 80%, rgba(245, 158, 11, 0.14), transparent 55%),
        #0D0D1A;
    }
    .tag {
      font-size: 28px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 800;
      margin-bottom: 40px;
    }
    .core {
      font-size: 60px;
      font-weight: 900;
      line-height: 1.22;
      letter-spacing: -1px;
      margin-bottom: 44px;
    }
    .core .yellow { color: #F59E0B; }
    .core .purple { color: #8B5CF6; }
    .contrast {
      display: flex;
      gap: 20px;
      width: 100%;
      max-width: 920px;
      margin-bottom: 36px;
    }
    .card {
      flex: 1;
      background: #1A1A2E;
      border: 1px solid rgba(107, 114, 128, 0.35);
      border-left: 4px solid #6B7280;
      border-radius: 14px;
      padding: 26px 22px;
      text-align: left;
    }
    .card.brain {
      border-color: rgba(245, 158, 11, 0.5);
      border-left-color: #F59E0B;
    }
    .card .role {
      font-size: 22px;
      color: #6B7280;
      letter-spacing: 1.5px;
      font-weight: 800;
      margin-bottom: 10px;
      text-transform: uppercase;
    }
    .card.brain .role { color: #F59E0B; }
    .card .name {
      font-size: 36px;
      font-weight: 900;
      color: #FFFFFF;
      margin-bottom: 6px;
    }
    .card .desc {
      font-size: 20px;
      color: #B0B0CC;
      font-weight: 600;
    }
    .closing {
      font-size: 26px;
      color: #B0B0CC;
      font-weight: 600;
      letter-spacing: 1px;
    }
    .closing .em { color: #8B5CF6; font-weight: 800; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="tag">最后一句话</div>
    <div class="core">
      不是<span class="purple">编排器</span><br>
      是你写的<span class="yellow">那段 prompt</span>
    </div>
    <div class="contrast">
      <div class="card">
        <div class="role">水管</div>
        <div class="name">Symphony</div>
        <div class="desc">轮询 / 派发 / 并发</div>
      </div>
      <div class="card brain">
        <div class="role">大脑</div>
        <div class="name">WORKFLOW.md</div>
        <div class="desc">你自己写的 prompt</div>
      </div>
    </div>
    <div class="closing">
      精读一篇，<span class="em">胜过刷一百条</span>
    </div>
  </div>
</body>
</html>
