<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 100px 72px 400px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
      background:
        radial-gradient(ellipse at center 40%, rgba(139, 92, 246, 0.16) 0%, transparent 55%),
        #0D0D1A;
    }
    .series-tag {
      font-size: 30px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 600;
      margin-bottom: 80px;
    }
    .title {
      font-size: 92px;
      font-weight: 900;
      line-height: 1.25;
      letter-spacing: -1px;
      margin-bottom: 90px;
    }
    .title .highlight {
      color: #F59E0B;
    }
    .source-pill {
      background: #1A1A30;
      padding: 18px 38px;
      border-radius: 999px;
      font-size: 22px;
      color: #6B6B80;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="series-tag">精读AI · Agent Improvement</div>
    <div class="title">
      Agent 不是改 prompt<br>
      是改 <span class="highlight">5 个面</span>
    </div>
    <div class="source-pill">OpenAI Cookbook · Agent Improvement Loop</div>
  </div>
</body>
</html>
