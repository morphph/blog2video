<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .title {
      font-size: 56px;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 40px;
      letter-spacing: -1px;
    }
    .title .em { color: #F59E0B; }
    .questions {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 36px;
    }
    .q {
      background: #1A1A2E;
      border: 1px solid rgba(245, 158, 11, 0.28);
      border-left: 4px solid #F59E0B;
      border-radius: 12px;
      padding: 22px 24px;
      display: flex;
      align-items: flex-start;
      gap: 20px;
      text-align: left;
    }
    .q-num {
      font-size: 44px;
      font-weight: 800;
      color: #F59E0B;
      flex-shrink: 0;
      line-height: 1;
    }
    .q-text {
      font-size: 26px;
      font-weight: 700;
      color: #FFFFFF;
      line-height: 1.45;
    }
    .signature {
      width: 100%;
      background: rgba(139, 92, 246, 0.10);
      border: 1px solid rgba(139, 92, 246, 0.55);
      border-left: 4px solid #8B5CF6;
      border-radius: 12px;
      padding: 26px 28px;
      margin-bottom: 22px;
      font-size: 30px;
      font-weight: 800;
      color: #8B5CF6;
      line-height: 1.4;
    }
    .brand {
      width: 100%;
      font-size: 22px;
      font-weight: 600;
      color: #B0B0CC;
      letter-spacing: 0.5px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="title">下次跑挂之前<br>先答 <span class="em">3 个问题</span></div>
    <div class="questions">
      <div class="q">
        <div class="q-num">①</div>
        <div class="q-text">这次的失败,<br>能不能变成一条 eval?</div>
      </div>
      <div class="q">
        <div class="q-num">②</div>
        <div class="q-text">这条 eval<br>下次还会被跑吗?</div>
      </div>
      <div class="q">
        <div class="q-num">③</div>
        <div class="q-text">要改的, 是 prompt,<br>还是工具/路由/输出契约/校验?</div>
      </div>
    </div>
    <div class="signature">Harness = 5 个面, 不是 1 个 prompt</div>
    <div class="brand">AI 世界很吵，精读一篇，胜过刷一百条</div>
  </div>
</body>
</html>
