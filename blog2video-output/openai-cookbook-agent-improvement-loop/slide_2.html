<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .title {
      font-size: 64px;
      font-weight: 900;
      line-height: 1.25;
      margin-bottom: 56px;
      letter-spacing: -1px;
    }
    .title .em { color: #F59E0B; }
    .columns {
      display: flex;
      gap: 22px;
      width: 100%;
      margin-bottom: 44px;
    }
    .col {
      flex: 1;
      background: #1A1A2E;
      border-radius: 12px;
      padding: 28px 22px;
      text-align: left;
      min-height: 620px;
    }
    .col.left {
      border: 1px solid rgba(107, 114, 128, 0.45);
      border-left: 4px solid #6B7280;
    }
    .col.right {
      border: 1px solid rgba(16, 185, 129, 0.35);
      border-left: 4px solid #10B981;
    }
    .col-label {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 1.5px;
      margin-bottom: 18px;
    }
    .left .col-label { color: #6B7280; }
    .right .col-label { color: #10B981; }
    .col-head {
      font-size: 30px;
      font-weight: 800;
      line-height: 1.35;
      margin-bottom: 22px;
      color: #FFFFFF;
    }
    .quote {
      font-size: 22px;
      color: #B0B0CC;
      line-height: 1.55;
      padding: 12px 14px;
      background: rgba(255,255,255,0.03);
      border-radius: 8px;
      margin-bottom: 10px;
    }
    .arrow {
      font-size: 24px;
      color: #6B7280;
      margin: 16px 0 10px 0;
      text-align: center;
    }
    .conclusion {
      font-size: 22px;
      font-weight: 700;
      margin-top: 14px;
      text-align: center;
    }
    .left .conclusion { color: #EF4444; }
    .flow {
      font-size: 22px;
      line-height: 1.7;
      color: #FFFFFF;
      font-weight: 600;
    }
    .flow .step {
      display: inline-block;
      padding: 6px 12px;
      background: rgba(16, 185, 129, 0.12);
      border-radius: 6px;
      margin: 4px 2px;
    }
    .right .conclusion { color: #10B981; }
    .bottom {
      width: 100%;
      background: rgba(245, 158, 11, 0.10);
      border: 1px solid rgba(245, 158, 11, 0.45);
      border-radius: 12px;
      padding: 22px 24px;
      font-size: 26px;
      font-weight: 700;
      color: #F59E0B;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="title">你在改 prompt<br>别人在搭<span class="em">飞轮</span></div>
    <div class="columns">
      <div class="col left">
        <div class="col-label">SLACK 模式</div>
        <div class="col-head">Disconnected Comments</div>
        <div class="quote">"下次注意要引用真实数据"</div>
        <div class="quote">"下次不要瞎推断指标"</div>
        <div class="arrow">↓ 下次重来</div>
        <div class="conclusion">教训 = 一次性消耗品</div>
      </div>
      <div class="col right">
        <div class="col-label">FLYWHEEL 模式</div>
        <div class="col-head">Improvement Flywheel</div>
        <div class="flow">
          <span class="step">Trace</span> →
          <span class="step">Feedback</span> →
          <span class="step">Eval</span> →
          <span class="step">HALO</span> →
          <span class="step">Codex PR</span>
        </div>
        <div class="arrow">↓ 教训沉淀成代码</div>
        <div class="conclusion">学到的东西不靠人记<br>靠代码记</div>
      </div>
    </div>
    <div class="bottom">越用越强 = 经验从一次性变可复用</div>
  </div>
</body>
</html>
