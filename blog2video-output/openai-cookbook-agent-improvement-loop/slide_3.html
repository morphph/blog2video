<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .title {
      font-size: 70px;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 48px;
      letter-spacing: -1px;
    }
    .title .em { color: #8B5CF6; }
    .cards {
      display: flex;
      flex-direction: column;
      gap: 18px;
      width: 100%;
      margin-bottom: 48px;
    }
    .card {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.22);
      border-radius: 12px;
      padding: 22px 26px;
      display: flex;
      align-items: center;
      gap: 22px;
      text-align: left;
    }
    .num {
      font-size: 56px;
      font-weight: 800;
      flex-shrink: 0;
      width: 80px;
    }
    .body { flex: 1; }
    .name {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: 0.3px;
    }
    .desc {
      font-size: 22px;
      color: #B0B0CC;
      margin-top: 4px;
    }
    .c1 { border-left: 4px solid #8B5CF6; }
    .c1 .num, .c1 .name { color: #8B5CF6; }
    .c2 { border-left: 4px solid #3B82F6; }
    .c2 .num, .c2 .name { color: #3B82F6; }
    .c3 { border-left: 4px solid #F59E0B; }
    .c3 .num, .c3 .name { color: #F59E0B; }
    .c4 { border-left: 4px solid #10B981; }
    .c4 .num, .c4 .name { color: #10B981; }
    .c5 { border-left: 4px solid #EF4444; }
    .c5 .num, .c5 .name { color: #EF4444; }
    .bottom {
      width: 100%;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.5);
      border-radius: 12px;
      padding: 26px;
      font-size: 32px;
      font-weight: 800;
      color: #EF4444;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="title">Harness = <span class="em">5 个面</span></div>
    <div class="cards">
      <div class="card c1">
        <div class="num">①</div>
        <div class="body">
          <div class="name">Instructions</div>
          <div class="desc">系统指令</div>
        </div>
      </div>
      <div class="card c2">
        <div class="num">②</div>
        <div class="body">
          <div class="name">Tools</div>
          <div class="desc">工具集</div>
        </div>
      </div>
      <div class="card c3">
        <div class="num">③</div>
        <div class="body">
          <div class="name">Routing</div>
          <div class="desc">调用顺序</div>
        </div>
      </div>
      <div class="card c4">
        <div class="num">④</div>
        <div class="body">
          <div class="name">Output Requirements</div>
          <div class="desc">输出契约</div>
        </div>
      </div>
      <div class="card c5">
        <div class="num">⑤</div>
        <div class="body">
          <div class="name">Validation Checks</div>
          <div class="desc">校验</div>
        </div>
      </div>
    </div>
    <div class="bottom">改 prompt = 只动了 1/5</div>
  </div>
</body>
</html>
