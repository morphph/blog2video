<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .title {
      font-size: 60px;
      font-weight: 900;
      line-height: 1.25;
      margin-bottom: 48px;
      letter-spacing: -1px;
    }
    .title .em { color: #10B981; }
    .flow {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(16, 185, 129, 0.35);
      border-left: 4px solid #10B981;
      border-radius: 12px;
      padding: 36px 30px;
      margin-bottom: 36px;
    }
    .step {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
    }
    .step:last-child { margin-bottom: 0; }
    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #10B981;
      flex-shrink: 0;
    }
    .step-text {
      font-size: 28px;
      font-weight: 700;
      color: #FFFFFF;
      text-align: left;
      line-height: 1.4;
    }
    .step-text .accent { color: #10B981; }
    .arrow {
      color: #6B7280;
      font-size: 22px;
      margin-left: 6px;
      padding: 2px 0 6px 24px;
      text-align: left;
    }
    .warn {
      width: 100%;
      background: rgba(239, 68, 68, 0.10);
      border: 1px solid rgba(239, 68, 68, 0.4);
      border-radius: 12px;
      padding: 24px 28px;
      margin-bottom: 30px;
      font-size: 22px;
      color: #B0B0CC;
      line-height: 1.6;
      text-align: left;
    }
    .warn .head {
      color: #EF4444;
      font-weight: 800;
      font-size: 24px;
      margin-bottom: 8px;
    }
    .bottom {
      width: 100%;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.5);
      border-radius: 12px;
      padding: 22px 24px;
      font-size: 26px;
      font-weight: 800;
      color: #10B981;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="title">Feedback → Eval<br>是<span class="em">杠杆最大</span>的一步</div>
    <div class="flow">
      <div class="step">
        <div class="dot"></div>
        <div class="step-text">失败 <span class="accent">trace</span></div>
      </div>
      <div class="arrow">↓</div>
      <div class="step">
        <div class="dot"></div>
        <div class="step-text">human + LLM <span class="accent">feedback</span></div>
      </div>
      <div class="arrow">↓</div>
      <div class="step">
        <div class="dot"></div>
        <div class="step-text">转成 <span class="accent">Promptfoo eval</span></div>
      </div>
      <div class="arrow">↓</div>
      <div class="step">
        <div class="dot"></div>
        <div class="step-text"><span class="accent">永久回归</span></div>
      </div>
    </div>
    <div class="warn">
      <div class="head">少了这一步</div>
      其他组件全是空转 — 经验从"一次性"变成"可复用"的唯一接口
    </div>
    <div class="bottom">下次老错误自动被拦下来</div>
  </div>
</body>
</html>
