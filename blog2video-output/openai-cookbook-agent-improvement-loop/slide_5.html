<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .title {
      font-size: 64px;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 16px;
      letter-spacing: -1px;
    }
    .title .em { color: #EF4444; }
    .sub {
      font-size: 26px;
      color: #B0B0CC;
      margin-bottom: 44px;
      font-weight: 600;
    }
    .cards {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      margin-bottom: 36px;
    }
    .card {
      background: #1A1A2E;
      border: 1px solid rgba(239, 68, 68, 0.28);
      border-left: 4px solid #EF4444;
      border-radius: 12px;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 22px;
      text-align: left;
    }
    .num {
      font-size: 44px;
      font-weight: 800;
      color: #EF4444;
      flex-shrink: 0;
      width: 56px;
    }
    .name {
      font-size: 28px;
      font-weight: 800;
      color: #FFFFFF;
    }
    .desc {
      font-size: 20px;
      color: #B0B0CC;
      margin-top: 2px;
    }
    .bottom {
      width: 100%;
      background: rgba(245, 158, 11, 0.10);
      border: 1px solid rgba(245, 158, 11, 0.5);
      border-radius: 12px;
      padding: 22px 24px;
      font-size: 24px;
      font-weight: 800;
      color: #F59E0B;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="title">5 条 trace<br>全是<span class="em">失败模式</span></div>
    <div class="sub">没有一条是 happy path</div>
    <div class="cards">
      <div class="card">
        <div class="num">①</div>
        <div>
          <div class="name">融资风险</div>
          <div class="desc">烧钱速度 + 现金跑道</div>
        </div>
      </div>
      <div class="card">
        <div class="num">②</div>
        <div>
          <div class="name">营收质量</div>
          <div class="desc">ARR bridge 对账</div>
        </div>
      </div>
      <div class="card">
        <div class="num">③</div>
        <div>
          <div class="name">客户集中度</div>
          <div class="desc">母账户合并后重看</div>
        </div>
      </div>
      <div class="card">
        <div class="num">④</div>
        <div>
          <div class="name">企业安全</div>
          <div class="desc">SOC 2 缺位评估</div>
        </div>
      </div>
      <div class="card">
        <div class="num">⑤</div>
        <div>
          <div class="name">不该推断的指标</div>
          <div class="desc">模型容易硬猜</div>
        </div>
      </div>
    </div>
    <div class="bottom">Happy path 不用测 — 真正测的是栽过跟头的地方</div>
  </div>
</body>
</html>
