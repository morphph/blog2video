<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .title {
      font-size: 56px;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 36px;
      letter-spacing: -1px;
    }
    .title .em { color: #10B981; }
    .section-label {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 14px;
      width: 100%;
      text-align: left;
    }
    .top-label { color: #10B981; }
    .bottom-label { color: #EF4444; margin-top: 26px; }
    .grid6 {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 8px;
    }
    .file-card {
      background: #1A1A2E;
      border: 1px solid rgba(16, 185, 129, 0.28);
      border-left: 4px solid #10B981;
      border-radius: 10px;
      padding: 16px 18px;
      text-align: left;
      font-size: 22px;
      font-weight: 700;
      color: #FFFFFF;
      font-family: 'Menlo', 'SF Mono', monospace;
      letter-spacing: 0.2px;
    }
    .check-cards {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 28px;
    }
    .check-card {
      background: #1A1A2E;
      border: 1px solid rgba(239, 68, 68, 0.4);
      border-left: 4px solid #EF4444;
      border-radius: 12px;
      padding: 20px 22px;
      text-align: left;
    }
    .check-name {
      font-size: 22px;
      font-weight: 800;
      color: #EF4444;
      font-family: 'Menlo', 'SF Mono', monospace;
      margin-bottom: 6px;
    }
    .check-desc {
      font-size: 22px;
      color: #B0B0CC;
      font-weight: 600;
      line-height: 1.4;
    }
    .bottom-tag {
      width: 100%;
      background: rgba(139, 92, 246, 0.10);
      border: 1px solid rgba(139, 92, 246, 0.5);
      border-radius: 12px;
      padding: 22px 24px;
      font-size: 24px;
      font-weight: 800;
      color: #8B5CF6;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="title">输出契约 <span class="em">6 件套</span> + 2 个校验</div>
    <div class="section-label top-label">6 件 ARTIFACTS</div>
    <div class="grid6">
      <div class="file-card">summary_answer.md</div>
      <div class="file-card">investment_memo.md</div>
      <div class="file-card">risk_register.json</div>
      <div class="file-card">open_questions.md</div>
      <div class="file-card">citations.json</div>
      <div class="file-card">evidence_table.csv</div>
    </div>
    <div class="section-label bottom-label">2 个 VALIDATORS</div>
    <div class="check-cards">
      <div class="check-card">
        <div class="check-name">check_evidence_coverage.py</div>
        <div class="check-desc">claim 是否引用真实文件</div>
      </div>
      <div class="check-card">
        <div class="check-name">validate_output_contract.py</div>
        <div class="check-desc">6 件套结构是否合法</div>
      </div>
    </div>
    <div class="bottom-tag">"完成" 必须可机器校验 — Promptfoo 才能 pass/fail</div>
  </div>
</body>
</html>
