<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .title {
      font-size: 60px;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 48px;
      letter-spacing: -1px;
    }
    .title .em { color: #10B981; }
    .cards {
      display: flex;
      flex-direction: column;
      gap: 22px;
      width: 100%;
      margin-bottom: 40px;
    }
    .card {
      background: #1A1A2E;
      border-radius: 12px;
      padding: 26px 28px;
      text-align: left;
    }
    .card.bad {
      border: 1px solid rgba(107, 114, 128, 0.45);
      border-left: 4px solid #6B7280;
    }
    .card.good {
      border: 1px solid rgba(16, 185, 129, 0.4);
      border-left: 4px solid #10B981;
    }
    .label {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 1.5px;
      margin-bottom: 12px;
    }
    .bad .label { color: #6B7280; }
    .good .label { color: #10B981; }
    .quote {
      font-size: 30px;
      font-weight: 800;
      color: #FFFFFF;
      line-height: 1.35;
      margin-bottom: 14px;
      font-family: 'Menlo', 'SF Mono', monospace;
    }
    .desc {
      font-size: 22px;
      color: #B0B0CC;
      line-height: 1.5;
    }
    .code-line {
      font-size: 24px;
      font-weight: 800;
      color: #10B981;
      font-family: 'Menlo', 'SF Mono', monospace;
      line-height: 1.5;
      margin-bottom: 12px;
    }
    .traits {
      display: flex;
      gap: 12px;
      margin-top: 6px;
      flex-wrap: wrap;
    }
    .trait {
      background: rgba(16, 185, 129, 0.12);
      color: #10B981;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 20px;
      font-weight: 700;
    }
    .bottom {
      width: 100%;
      background: rgba(139, 92, 246, 0.10);
      border: 1px solid rgba(139, 92, 246, 0.5);
      border-radius: 12px;
      padding: 22px 24px;
      font-size: 24px;
      font-weight: 800;
      color: #8B5CF6;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="title">Harness 不靠 prompt<br>靠 <span class="em">dataclass</span></div>
    <div class="cards">
      <div class="card bad">
        <div class="label">PROMPT-BASED</div>
        <div class="quote">"请引用真实数据"</div>
        <div class="desc">请求 / 模型可以不听</div>
      </div>
      <div class="card good">
        <div class="label">DATACLASS-BASED</div>
        <div class="code-line">ModelSettings · AgentConfig · ToolPolicy</div>
        <div class="traits">
          <span class="trait">代码对象</span>
          <span class="trait">HALO 可打分</span>
          <span class="trait">Codex 可直接改</span>
        </div>
      </div>
    </div>
    <div class="bottom">harness 一旦数据结构化 → 自动优化的对象</div>
  </div>
</body>
</html>
