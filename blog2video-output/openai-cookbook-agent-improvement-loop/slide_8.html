<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .title {
      font-size: 52px;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 20px;
      letter-spacing: -1px;
    }
    .big-num {
      font-size: 140px;
      font-weight: 900;
      line-height: 1;
      color: #EF4444;
      letter-spacing: -2px;
      margin-bottom: 6px;
    }
    .big-label {
      font-size: 28px;
      font-weight: 700;
      color: #B0B0CC;
      margin-bottom: 36px;
      letter-spacing: 2px;
    }
    .bullets {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 30px;
    }
    .bullet {
      background: #1A1A2E;
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-left: 4px solid #EF4444;
      border-radius: 12px;
      padding: 18px 22px;
      display: flex;
      align-items: flex-start;
      gap: 18px;
      text-align: left;
    }
    .b-num {
      font-size: 32px;
      font-weight: 800;
      color: #EF4444;
      flex-shrink: 0;
      width: 36px;
    }
    .b-text {
      font-size: 22px;
      font-weight: 700;
      color: #FFFFFF;
      line-height: 1.4;
    }
    .b-text .accent {
      color: #F59E0B;
    }
    .bottom {
      width: 100%;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.5);
      border-radius: 12px;
      padding: 22px 24px;
      font-size: 26px;
      font-weight: 800;
      color: #EF4444;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="title">20 分钟一轮的代价</div>
    <div class="big-num">20 min</div>
    <div class="big-label">PER LOOP · DEFAULT SETTING</div>
    <div class="bullets">
      <div class="bullet">
        <div class="b-num">①</div>
        <div class="b-text">4 套系统并行: <span class="accent">Agents SDK · Promptfoo · HALO · Codex</span></div>
      </div>
      <div class="bullet">
        <div class="b-num">②</div>
        <div class="b-text">HALO 是 <span class="accent">OpenAI 专有</span>, 脱栈无替代</div>
      </div>
      <div class="bullet">
        <div class="b-num">③</div>
        <div class="b-text">feedback 入库需要人筛, 低质量 = <span class="accent">污染 eval 集</span></div>
      </div>
      <div class="bullet">
        <div class="b-num">④</div>
        <div class="b-text">eval 从 5 涨到 100, HALO + Promptfoo <span class="accent">线性/超线性变长</span></div>
      </div>
    </div>
    <div class="bottom">飞轮跑得越久, 转速越慢</div>
  </div>
</body>
</html>
