<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 100px 72px 400px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .glow {
      position: absolute;
      top: 400px;
      left: 50%;
      transform: translateX(-50%);
      width: 1100px;
      height: 800px;
      background: radial-gradient(ellipse, rgba(16, 185, 129, 0.22) 0%, rgba(139, 92, 246, 0.10) 40%, rgba(13, 13, 26, 0) 75%);
      pointer-events: none;
      z-index: 0;
    }
    .series-label {
      font-size: 30px;
      color: #8B5CF6;
      letter-spacing: 4px;
      font-weight: 700;
      margin-bottom: 88px;
      position: relative;
      z-index: 1;
    }
    h1 {
      font-size: 96px;
      font-weight: 900;
      line-height: 1.25;
      letter-spacing: -2px;
      margin-bottom: 100px;
      position: relative;
      z-index: 1;
    }
    h1 .green {
      color: #10B981;
    }
    .source-pill {
      display: inline-block;
      padding: 16px 36px;
      background: #1A1A30;
      border: 1px solid rgba(139, 92, 246, 0.15);
      border-radius: 999px;
      font-size: 22px;
      color: #6B6B80;
      font-weight: 500;
      position: relative;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="glow"></div>
    <div class="series-label">精读AI · AGENT LOOPS</div>
    <h1>Agent 不是改了<br>是<span class="green">差距变小</span></h1>
    <div class="source-pill">OpenAI Cookbook · Iterative Repair Loops with Codex</div>
  </div>
</body>
</html>
