<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .glow {
      position: absolute;
      top: 360px;
      left: 50%;
      transform: translateX(-50%);
      width: 900px;
      height: 600px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.18) 0%, rgba(13, 13, 26, 0) 70%);
      pointer-events: none;
      z-index: 0;
    }
    .series-label {
      font-size: 30px;
      color: #8B5CF6;
      letter-spacing: 4px;
      font-weight: 600;
      margin-bottom: 56px;
      position: relative;
      z-index: 1;
    }
    h1 {
      font-size: 110px;
      font-weight: 900;
      line-height: 1.18;
      letter-spacing: -1px;
      margin-bottom: 56px;
      position: relative;
      z-index: 1;
    }
    h1 .green {
      color: #10B981;
    }
    .source-pill {
      display: inline-block;
      padding: 14px 32px;
      background: #1A1A30;
      border-radius: 999px;
      font-size: 22px;
      color: #6B6B80;
      margin-bottom: 80px;
      position: relative;
      z-index: 1;
    }
    .cards {
      display: flex;
      gap: 28px;
      width: 100%;
      position: relative;
      z-index: 1;
    }
    .card {
      flex: 1;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-radius: 12px;
      padding: 32px 24px;
      text-align: center;
    }
    .card .num {
      font-size: 28px;
      color: #8B5CF6;
      font-weight: 800;
      margin-bottom: 14px;
      letter-spacing: 2px;
    }
    .card .text {
      font-size: 34px;
      color: #FFFFFF;
      font-weight: 700;
      line-height: 1.35;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="glow"></div>
    <div class="series-label">精读AI · AGENT LOOPS</div>
    <h1>Agent 不是改了<br>是<span class="green">差距变小</span></h1>
    <div class="source-pill">OpenAI Cookbook · Build Iterative Repair Loops with Codex</div>
    <div class="cards">
      <div class="card">
        <div class="num">悬念 01</div>
        <div class="text">delta 才是<br>真信号</div>
      </div>
      <div class="card">
        <div class="num">悬念 02</div>
        <div class="text">三阶段<br>必须分离</div>
      </div>
    </div>
  </div>
</body>
</html>
