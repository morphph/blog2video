<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    h1 {
      font-size: 64px;
      font-weight: 900;
      line-height: 1.25;
      margin-bottom: 64px;
      letter-spacing: -0.5px;
    }
    h1 .accent {
      color: #10B981;
    }
    .compare {
      display: flex;
      gap: 24px;
      width: 100%;
      margin-bottom: 56px;
    }
    .col {
      flex: 1;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 32px 24px;
      text-align: left;
    }
    .col.wrong {
      opacity: 0.55;
    }
    .col.right {
      border-left: 4px solid #10B981;
    }
    .col .head {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }
    .col.wrong .head {
      color: #6B7280;
    }
    .col.right .head {
      color: #10B981;
    }
    .col .sub {
      font-size: 28px;
      font-weight: 700;
      color: #FFFFFF;
      line-height: 1.35;
      margin-bottom: 22px;
    }
    .col.wrong .sub {
      color: #B0B0CC;
    }
    .col ul {
      list-style: none;
    }
    .col li {
      font-size: 26px;
      line-height: 1.6;
      padding: 6px 0;
      color: #FFFFFF;
    }
    .col.wrong li {
      color: #6B7280;
    }
    .col .var {
      font-size: 22px;
      color: #10B981;
      font-weight: 700;
      margin-right: 8px;
    }
    .bottom {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.25);
      border-left: 4px solid #F59E0B;
      border-radius: 12px;
      padding: 24px 28px;
      width: 100%;
      font-size: 30px;
      font-weight: 700;
      color: #F59E0B;
      text-align: center;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="slide">
    <h1>真正的成功信号<br>不是 Agent 在<span class="accent">动手</span></h1>
    <div class="compare">
      <div class="col wrong">
        <div class="head">❌ 看动作</div>
        <div class="sub">看 Agent 有没有<br>在改</div>
        <ul>
          <li>日志在刷</li>
          <li>文件在改</li>
          <li>看着努力</li>
        </ul>
      </div>
      <div class="col right">
        <div class="head">✓ 看 delta</div>
        <div class="sub">看每轮验证后<br>剩多少问题</div>
        <ul>
          <li><span class="var">↓</span>变少 = 收敛</li>
          <li><span class="var">=</span>不变 = 卡住</li>
          <li><span class="var">↑</span>变多 = 跑偏</li>
        </ul>
      </div>
    </div>
    <div class="bottom">Agent 一直在动, 我们就被动作骗了</div>
  </div>
</body>
</html>
