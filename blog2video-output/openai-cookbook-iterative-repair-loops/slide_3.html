<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    h1 {
      font-size: 68px;
      font-weight: 900;
      line-height: 1.25;
      margin-bottom: 64px;
      letter-spacing: -0.5px;
    }
    .cards {
      display: flex;
      gap: 20px;
      width: 100%;
      margin-bottom: 56px;
    }
    .card {
      flex: 1;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 32px 18px;
      text-align: center;
    }
    .card.blue { border-left: 4px solid #3B82F6; }
    .card.purple { border-left: 4px solid #8B5CF6; }
    .card.green { border-left: 4px solid #10B981; }
    .card .num {
      font-size: 56px;
      font-weight: 800;
      margin-bottom: 10px;
      line-height: 1;
    }
    .card.blue .num { color: #3B82F6; }
    .card.purple .num { color: #8B5CF6; }
    .card.green .num { color: #10B981; }
    .card .stage {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 4px;
    }
    .card.blue .stage { color: #3B82F6; }
    .card.purple .stage { color: #8B5CF6; }
    .card.green .stage { color: #10B981; }
    .card .verb {
      font-size: 40px;
      font-weight: 900;
      color: #FFFFFF;
      margin-bottom: 22px;
    }
    .card .rule {
      font-size: 24px;
      color: #FFFFFF;
      line-height: 1.45;
      font-weight: 600;
    }
    .card .forbid {
      display: block;
      margin-top: 10px;
      font-size: 22px;
      color: #EF4444;
      font-weight: 700;
    }
    .bottom {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.25);
      border-left: 4px solid #8B5CF6;
      border-radius: 12px;
      padding: 24px 28px;
      width: 100%;
      font-size: 30px;
      font-weight: 700;
      color: #8B5CF6;
      text-align: center;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="slide">
    <h1>三阶段, 每个动词单一</h1>
    <div class="cards">
      <div class="card blue">
        <div class="num">①</div>
        <div class="stage">REVIEW</div>
        <div class="verb">查</div>
        <div class="rule">只找问题<span class="forbid">✗ 不准改文件</span></div>
      </div>
      <div class="card purple">
        <div class="num">②</div>
        <div class="stage">REPAIR</div>
        <div class="verb">改</div>
        <div class="rule">按清单改<span class="forbid">✗ 不准重评估</span></div>
      </div>
      <div class="card green">
        <div class="num">③</div>
        <div class="stage">VALIDATE</div>
        <div class="verb">验</div>
        <div class="rule">只跑验证<span class="forbid">✗ 不准修</span></div>
      </div>
    </div>
    <div class="bottom">三个动作被刻意隔离</div>
  </div>
</body>
</html>
