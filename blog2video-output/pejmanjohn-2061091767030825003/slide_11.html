<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .glow {
      position: absolute;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 1100px;
      height: 700px;
      background: radial-gradient(ellipse at center, rgba(139, 92, 246, 0.15) 0%, rgba(13, 13, 26, 0) 65%);
      pointer-events: none;
      z-index: 0;
    }
    .quote-mark {
      font-size: 180px;
      color: #8B5CF6;
      line-height: 0.8;
      font-family: Georgia, serif;
      font-weight: 700;
      margin-bottom: 16px;
      opacity: 0.7;
      z-index: 1;
    }
    .quote-text {
      font-size: 68px;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 48px;
      z-index: 1;
    }
    .purple { color: #8B5CF6; }
    .red { color: #EF4444; }
    .amber { color: #F59E0B; }
    .cite {
      font-size: 26px;
      color: #B0B0CC;
      margin-bottom: 40px;
      font-weight: 500;
      z-index: 1;
    }
    .reverse {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-left: 4px solid #EF4444;
      border-radius: 12px;
      padding: 26px 30px;
      width: 100%;
      font-size: 28px;
      font-weight: 600;
      line-height: 1.5;
      text-align: left;
      color: #FFFFFF;
      z-index: 1;
    }
    .reverse b { color: #EF4444; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="glow"></div>
    <div class="quote-mark">"</div>
    <div class="quote-text">
      这层记忆<br>
      <span class="purple">归你所有</span>
    </div>
    <div class="cite">不归 OpenAI · 不归 Anthropic · 不归任何一家厂商</div>
    <div class="reverse">
      今天的默认：每家厂商各记一份，<b>你换工具就等于换记忆</b>。Pejman 主张反过来——用户自己拥有跨工具的记忆层
    </div>
  </div>
</body>
</html>
