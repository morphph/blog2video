<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .eyebrow {
      font-size: 26px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 600;
      margin-bottom: 32px;
    }
    .headline {
      font-size: 68px;
      font-weight: 900;
      line-height: 1.25;
      margin-bottom: 56px;
    }
    .red { color: #EF4444; }
    .amber { color: #F59E0B; }
    .compare {
      display: flex;
      gap: 24px;
      width: 100%;
      margin-bottom: 40px;
    }
    .col {
      flex: 1;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.25);
      border-radius: 14px;
      padding: 32px 28px;
      text-align: center;
    }
    .col.left { border-top: 4px solid #6B7280; }
    .col.right { border-top: 4px solid #F59E0B; }
    .col-label {
      font-size: 24px;
      letter-spacing: 2px;
      font-weight: 700;
      margin-bottom: 18px;
    }
    .col.left .col-label { color: #6B7280; }
    .col.right .col-label { color: #F59E0B; }
    .col-main {
      font-size: 44px;
      font-weight: 800;
      line-height: 1.3;
      color: #FFFFFF;
    }
    .arrow {
      display: flex;
      align-items: center;
      font-size: 56px;
      color: #B0B0CC;
    }
    .takeaway {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-left: 4px solid #8B5CF6;
      border-radius: 12px;
      padding: 28px 32px;
      width: 100%;
      font-size: 30px;
      font-weight: 600;
      line-height: 1.5;
      text-align: left;
      color: #FFFFFF;
    }
    .takeaway b {
      color: #F59E0B;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="eyebrow">REPO 不是 MEMORY</div>
    <div class="headline">
      写下来的<br>
      只是<span class="amber">终点</span>，不是<span class="red">路径</span>
    </div>
    <div class="compare">
      <div class="col left">
        <div class="col-label">结论</div>
        <div class="col-main">留下来</div>
      </div>
      <div class="arrow">→</div>
      <div class="col right">
        <div class="col-label">路径</div>
        <div class="col-main">基本扔光</div>
      </div>
    </div>
    <div class="takeaway">那条<b>被你扔掉的路径</b>，过几天又突然重要起来了</div>
  </div>
</body>
</html>
