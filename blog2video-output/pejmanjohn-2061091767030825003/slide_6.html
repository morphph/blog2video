<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .eyebrow {
      font-size: 26px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 600;
      margin-bottom: 28px;
    }
    .headline {
      font-size: 62px;
      font-weight: 900;
      line-height: 1.25;
      margin-bottom: 48px;
    }
    .amber { color: #F59E0B; }
    .red { color: #EF4444; }
    .green { color: #10B981; }
    .iceberg {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.25);
      border-radius: 14px;
      padding: 32px 28px;
      width: 100%;
      margin-bottom: 28px;
    }
    .tip {
      font-size: 28px;
      color: #F59E0B;
      font-weight: 700;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }
    .tip-text {
      font-size: 24px;
      color: #B0B0CC;
      margin-bottom: 18px;
    }
    .bar {
      height: 8px;
      background: #F59E0B;
      width: 10%;
      border-radius: 4px;
      margin-bottom: 24px;
    }
    .sub {
      font-size: 28px;
      color: #3B82F6;
      font-weight: 700;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }
    .sub-text {
      font-size: 24px;
      color: #B0B0CC;
      margin-bottom: 18px;
    }
    .bar-blue {
      height: 8px;
      background: #3B82F6;
      width: 90%;
      border-radius: 4px;
    }
    .insight {
      background: #1A1A2E;
      border: 1px solid rgba(239, 68, 68, 0.4);
      border-left: 4px solid #EF4444;
      border-radius: 12px;
      padding: 26px 32px;
      width: 100%;
      font-size: 28px;
      font-weight: 600;
      line-height: 1.5;
      text-align: left;
      color: #FFFFFF;
    }
    .insight b {
      color: #EF4444;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="eyebrow">最值钱的判断</div>
    <div class="headline">
      文档丢的不是<span class="amber">细节</span><br>
      是<span class="red">过程</span>
    </div>
    <div class="iceberg">
      <div class="tip">冰山的尖 · 写下来的计划</div>
      <div class="tip-text">结论 / 最终决定 / Markdown</div>
      <div class="bar"></div>
      <div class="sub">水面下的 90% · 对话本身</div>
      <div class="sub-text">来回博弈 · 走错的岔路 · 剪掉的分支</div>
      <div class="bar-blue"></div>
    </div>
    <div class="insight">
      多数人默认<b>"记忆就是文档"</b>。但下次你想换条路时，需要的恰恰是落不进 markdown 的那一层
    </div>
  </div>
</body>
</html>
