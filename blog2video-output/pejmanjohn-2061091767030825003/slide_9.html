<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .eyebrow {
      font-size: 26px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 600;
      margin-bottom: 32px;
    }
    .headline {
      font-size: 64px;
      font-weight: 900;
      line-height: 1.25;
      margin-bottom: 56px;
    }
    .red { color: #EF4444; }
    .amber { color: #F59E0B; }
    .stack {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .row {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.25);
      border-radius: 14px;
      padding: 28px 32px;
      text-align: left;
    }
    .row.top {
      border-left: 4px solid #10B981;
    }
    .row.bottom {
      border-left: 4px solid #EF4444;
    }
    .tag {
      font-size: 24px;
      letter-spacing: 2px;
      font-weight: 700;
      margin-bottom: 10px;
    }
    .row.top .tag { color: #10B981; }
    .row.bottom .tag { color: #EF4444; }
    .text {
      font-size: 32px;
      color: #FFFFFF;
      font-weight: 600;
      line-height: 1.4;
    }
    .small {
      font-size: 22px;
      color: #B0B0CC;
      margin-top: 6px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="eyebrow">把视角拉到最高</div>
    <div class="headline">
      工具越来越<span class="amber">能干</span><br>
      记忆层却一直<span class="red">是碎的</span>
    </div>
    <div class="stack">
      <div class="row top">
        <div class="tag">工具层</div>
        <div class="text">Agent 专业化 · 越来越能干</div>
      </div>
      <div class="row bottom">
        <div class="tag">记忆层</div>
        <div class="text">Agent 越散布，碎得越厉害</div>
        <div class="small">越多 app · 越多机器 · 越多云 · 越多本地环境</div>
      </div>
    </div>
  </div>
</body>
</html>
