<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1920px; background:#0D0D1A;
    font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;
    color:#FFFFFF; overflow:hidden; }
  .slide { width:100%; height:100%; padding:200px 72px 420px 72px;
    display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; position:relative; }
  .slide::before { content:''; position:absolute; inset:0;
    background:radial-gradient(circle at 50% 30%, rgba(239,68,68,0.12) 0%, transparent 55%); }
  .kicker { font-size:30px; color:#8B5CF6; letter-spacing:3px; font-weight:600; margin-bottom:40px; position:relative; }
  .title { font-size:78px; font-weight:900; line-height:1.25; margin-bottom:64px; position:relative; }
  .title .red { color:#EF4444; }
  .stat-row { display:flex; gap:24px; width:100%; position:relative; }
  .stat-card { flex:1; background:#1A1A2E;
    border:1px solid rgba(139,92,246,0.25); border-left:4px solid #F59E0B;
    border-radius:12px; padding:32px 24px; text-align:left; }
  .stat-num { font-size:64px; font-weight:800; color:#F59E0B; line-height:1; margin-bottom:14px; }
  .stat-label { font-size:24px; color:#B0B0CC; line-height:1.4; }
</style>
</head>
<body>
  <div class="slide">
    <div class="kicker">Day 30 的真相</div>
    <div class="title">用 Claude Code<br><span class="red">越用越累</span></div>
    <div class="stat-row">
      <div class="stat-card">
        <div class="stat-num">2.3M</div>
        <div class="stat-label">这条 X 长帖<br>累计阅读量</div>
      </div>
      <div class="stat-card">
        <div class="stat-num">6 → 7</div>
        <div class="stat-label">6 个工种压一个 session<br>拆成 7 个专职 agent</div>
      </div>
    </div>
  </div>
</body>
</html>
