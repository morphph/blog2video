<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1920px; background:#0D0D1A;
    font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;
    color:#FFFFFF; overflow:hidden; }
  .slide { width:100%; height:100%; padding:200px 72px 420px 72px;
    display:flex; flex-direction:column; justify-content:center; align-items:center; }
  .kicker { font-size:28px; color:#8B5CF6; letter-spacing:3px; font-weight:600; margin-bottom:28px; }
  .title { font-size:64px; font-weight:900; line-height:1.3; margin-bottom:48px; text-align:center; }
  .title .amber { color:#F59E0B; }
  .gates { width:100%; display:flex; flex-direction:column; gap:18px; margin-bottom:30px; }
  .gate { background:#1A1A2E; border:1px solid rgba(139,92,246,0.25);
    border-left:4px solid #8B5CF6; border-radius:12px; padding:24px 28px;
    display:flex; align-items:center; gap:24px; }
  .gate-num { font-size:48px; font-weight:800; color:#8B5CF6; min-width:72px; }
  .gate-text { font-size:30px; font-weight:700; color:#FFFFFF; }
  .gate-text .label { color:#B0B0CC; font-size:22px; font-weight:500; display:block; margin-top:6px; }
  .redflag { width:100%; background:#1A1A2E; border:1px solid rgba(239,68,68,0.4);
    border-left:4px solid #EF4444; border-radius:12px; padding:28px 28px; }
  .redflag-title { font-size:24px; color:#EF4444; font-weight:700; letter-spacing:2px; margin-bottom:14px; }
  .redflag-quote { font-family:'SF Mono','Monaco',monospace; font-size:30px; color:#FFFFFF; font-weight:700; margin-bottom:10px; }
  .redflag-text { font-size:22px; color:#B0B0CC; line-height:1.5; }
</style>
</head>
<body>
  <div class="slide">
    <div class="kicker">真正的杠杆</div>
    <div class="title"><span class="amber">3 个</span>人类闸口<br>其他全自动</div>
    <div class="gates">
      <div class="gate"><div class="gate-num">1</div><div class="gate-text">Story 批准<span class="label">问题对不对</span></div></div>
      <div class="gate"><div class="gate-num">2</div><div class="gate-text">Brief 批准<span class="label">设计合不合理</span></div></div>
      <div class="gate"><div class="gate-num">3</div><div class="gate-text">PR 合入<span class="label">能不能 ship</span></div></div>
    </div>
    <div class="redflag">
      <div class="redflag-title">第 2 关 · 红旗举例</div>
      <div class="redflag-quote">"store IDs in memory"</div>
      <div class="redflag-text">brief 里 5 秒拦截 vs. 10 个文件改完才暴露</div>
    </div>
  </div>
</body>
</html>
