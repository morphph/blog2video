<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1920px; background:#0D0D1A;
    font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;
    color:#FFFFFF; overflow:hidden; }
  .slide { width:100%; height:100%; padding:200px 72px 420px 72px;
    display:flex; flex-direction:column; justify-content:center; align-items:center; }
  .kicker { font-size:28px; color:#8B5CF6; letter-spacing:3px; font-weight:600; margin-bottom:28px; }
  .title { font-size:56px; font-weight:900; line-height:1.3; margin-bottom:36px; text-align:center; }
  .title .amber { color:#F59E0B; }
  .prompt { width:100%; background:#0D0D1A; border:2px solid rgba(139,92,246,0.5);
    border-radius:12px; padding:24px 28px; margin-bottom:28px; font-family:'SF Mono','Monaco',monospace;
    font-size:26px; color:#B0B0CC; }
  .prompt .quote { color:#FFFFFF; }
  .chain { width:100%; display:flex; flex-direction:column; gap:12px; }
  .step { background:#1A1A2E; border:1px solid rgba(139,92,246,0.25);
    border-left:4px solid #8B5CF6; border-radius:10px; padding:18px 22px;
    display:flex; align-items:center; gap:18px; font-size:24px; }
  .step.human { border-left-color:#F59E0B; background:#2A1F0F; }
  .step.fail { border-left-color:#EF4444; }
  .step.pass { border-left-color:#10B981; }
  .step-role { font-weight:800; min-width:175px; }
  .step.human .step-role { color:#F59E0B; }
  .step.fail .step-role { color:#EF4444; }
  .step.pass .step-role { color:#10B981; }
  .step-desc { color:#B0B0CC; }
  .step-desc strong { color:#FFFFFF; }
</style>
</head>
<body>
  <div class="slide">
    <div class="kicker">一句话触发完整链路</div>
    <div class="title">7 个 agent<br><span class="amber">咬合演示</span></div>
    <div class="prompt"><span class="quote">"给超过 7 天没付款的发票做个提醒功能"</span></div>
    <div class="chain">
      <div class="step"><div class="step-role">Researcher</div><div class="step-desc">扫现有代码 · 列文件/风险</div></div>
      <div class="step human"><div class="step-role">→ 你批准 Story</div><div class="step-desc">第 1 个闸口</div></div>
      <div class="step human"><div class="step-role">→ 你批准 Brief</div><div class="step-desc">第 2 个闸口</div></div>
      <div class="step"><div class="step-role">Backend / Frontend</div><div class="step-desc">实现 · 自测试全绿</div></div>
      <div class="step fail"><div class="step-role">Test Verifier</div><div class="step-desc"><strong>7 通过 / 1 失败</strong> · 漏租户检查</div></div>
      <div class="step pass"><div class="step-role">Validator → 修复</div><div class="step-desc"><strong>8 / 8 全过</strong> · PR 合入</div></div>
    </div>
  </div>
</body>
</html>
