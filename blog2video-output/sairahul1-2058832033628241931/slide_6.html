<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1920px; background:#0D0D1A;
    font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;
    color:#FFFFFF; overflow:hidden; }
  .slide { width:100%; height:100%; padding:200px 72px 420px 72px;
    display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; }
  .kicker { font-size:28px; color:#8B5CF6; letter-spacing:3px; font-weight:600; margin-bottom:60px; }
  .quote-mark { font-size:160px; color:#8B5CF6; line-height:0.6; font-family:Georgia,serif; margin-bottom:8px; opacity:0.85; }
  .quote-en { font-size:62px; font-weight:900; line-height:1.25; color:#FFFFFF; margin-bottom:36px; font-style:italic; }
  .quote-en .accent { color:#F59E0B; }
  .quote-cn { font-size:42px; font-weight:700; color:#B0B0CC; margin-bottom:60px; line-height:1.4; }
  .takeaway { background:#1A1A2E; border:1px solid rgba(139,92,246,0.25);
    border-left:4px solid #8B5CF6; border-radius:12px; padding:28px 32px;
    font-size:26px; line-height:1.55; color:#FFFFFF; text-align:left; width:100%; }
  .takeaway strong { color:#8B5CF6; }
</style>
</head>
<body>
  <div class="slide">
    <div class="kicker">Validator 的存在理由</div>
    <div class="quote-mark">"</div>
    <div class="quote-en">A self-graded paper<br>is <span class="accent">worthless</span>.</div>
    <div class="quote-cn">自评的作业是没有价值的</div>
    <div class="takeaway">真正诚实的审稿人<strong>看不到代码是怎么写出来的</strong>，只看磁盘上现在长什么样。</div>
  </div>
</body>
</html>
