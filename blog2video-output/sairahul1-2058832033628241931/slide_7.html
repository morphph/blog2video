<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1920px; background:#0D0D1A;
    font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;
    color:#FFFFFF; overflow:hidden; }
  .slide { width:100%; height:100%; padding:200px 72px 420px 72px;
    display:flex; flex-direction:column; justify-content:center; align-items:center; }
  .kicker { font-size:28px; color:#8B5CF6; letter-spacing:3px; font-weight:600; margin-bottom:32px; }
  .title { font-size:62px; font-weight:900; line-height:1.3; margin-bottom:48px; text-align:center; }
  .title .amber { color:#F59E0B; }
  .questions { width:100%; display:flex; flex-direction:column; gap:18px; margin-bottom:36px; }
  .q { background:#1A1A2E; border:1px solid rgba(139,92,246,0.25);
    border-left:4px solid #8B5CF6; border-radius:12px; padding:24px 28px;
    display:flex; align-items:center; gap:24px; }
  .q-num { font-size:42px; font-weight:800; color:#8B5CF6; min-width:60px; }
  .q-text { font-size:30px; font-weight:700; }
  .q-stage { color:#B0B0CC; font-size:22px; display:block; margin-top:4px; font-weight:500; }
  .punch { width:100%; background:linear-gradient(135deg,#1A1A2E,#2A1A3A);
    border:1px solid rgba(139,92,246,0.4); border-radius:12px; padding:28px 32px;
    font-size:28px; line-height:1.5; text-align:center; }
  .punch strong { color:#F59E0B; }
</style>
</head>
<body>
  <div class="slide">
    <div class="kicker">这套系统真正的核心问题</div>
    <div class="title"><span class="amber">哪些决定</span><br>必须由人做？</div>
    <div class="questions">
      <div class="q"><div class="q-num">1</div><div><div class="q-text">问题对不对</div><div class="q-stage">Story</div></div></div>
      <div class="q"><div class="q-num">2</div><div><div class="q-text">设计合不合理</div><div class="q-stage">Brief</div></div></div>
      <div class="q"><div class="q-num">3</div><div><div class="q-text">能不能 ship</div><div class="q-stage">PR</div></div></div>
    </div>
    <div class="punch">流水线不是把你赶出流程<br>它只是把你从<strong>不需要你的部分</strong>里拿出来</div>
  </div>
</body>
</html>
