<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1920px; background:#0D0D1A;
    font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;
    color:#FFFFFF; overflow:hidden; }
  .slide { width:100%; height:100%; padding:200px 72px 420px 72px;
    display:flex; flex-direction:column; justify-content:center; align-items:center; }
  .kicker { font-size:28px; color:#8B5CF6; letter-spacing:3px; font-weight:600; margin-bottom:28px; }
  .title { font-size:60px; font-weight:900; line-height:1.3; margin-bottom:40px; text-align:center; }
  .title .green { color:#10B981; }
  .action { width:100%; background:#1A1A2E; border:1px solid rgba(16,185,129,0.4);
    border-left:4px solid #10B981; border-radius:12px; padding:32px 32px; margin-bottom:28px; }
  .action-tag { font-size:24px; color:#10B981; font-weight:700; letter-spacing:2px; margin-bottom:18px; }
  .action-text { font-size:32px; font-weight:700; color:#FFFFFF; line-height:1.4; }
  .action-text strong { color:#F59E0B; }
  .anchor { width:100%; background:linear-gradient(135deg,#1A1A2E,#2A1A3A);
    border:1px solid rgba(139,92,246,0.4); border-radius:12px; padding:32px;
    text-align:center; font-size:34px; font-weight:800; line-height:1.5; }
  .anchor .amber { color:#F59E0B; }
  .anchor .arrow { color:#8B5CF6; margin:0 12px; }
</style>
</head>
<body>
  <div class="slide">
    <div class="kicker">本周可以做的一件事</div>
    <div class="title">把"<span class="green">先研究 后建造</span>"<br>变成肌肉记忆</div>
    <div class="action">
      <div class="action-tag">MINIMAL VIABLE GATE</div>
      <div class="action-text">下次让 Claude Code 写功能之前<br>要求它 <strong>只 research，不写代码</strong></div>
    </div>
    <div class="anchor">
      错假设<span class="arrow">→</span><span class="amber">第 1 段就暴露</span><br>而不是 10 个文件之后
    </div>
  </div>
</body>
</html>
