<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1920px; background:#0D0D1A;
    font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;
    color:#FFFFFF; overflow:hidden; }
  .slide { width:100%; height:100%; padding:200px 72px 420px 72px;
    display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; position:relative; }
  .slide::before { content:''; position:absolute; inset:0;
    background:radial-gradient(circle at 50% 30%, rgba(239,68,68,0.12) 0%, transparent 55%); }
  .kicker { font-size:30px; color:#8B5CF6; letter-spacing:3px; font-weight:600; margin-bottom:40px; position:relative; }
  .title { font-size:72px; font-weight:900; line-height:1.25; margin-bottom:50px; position:relative; }
  .title .red { color:#EF4444; }
  .title .amber { color:#F59E0B; }
  .reason { width:100%; background:#1A1A2E; border:1px solid rgba(239,68,68,0.4);
    border-left:4px solid #EF4444; border-radius:12px; padding:36px 32px; text-align:left; position:relative; }
  .reason-label { font-size:24px; color:#EF4444; font-weight:700; letter-spacing:2px; margin-bottom:18px; }
  .reason-text { font-size:32px; font-weight:700; line-height:1.4; }
  .reason-text strong { color:#F59E0B; }
</style>
</head>
<body>
  <div class="slide">
    <div class="kicker">证书攒了一抽屉 · 还是写不出 Agent</div>
    <div class="title">不是你<span class="red">不够聪明</span><br>是<span class="amber">顺序错了</span></div>
    <div class="reason">
      <div class="reason-label">14 周路线图</div>
      <div class="reason-text">self.dll 烧过 <strong>$300/月</strong> 订阅费才看明白：<br>这不是钱的问题</div>
    </div>
  </div>
</body>
</html>
