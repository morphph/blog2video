<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1920px; background:#0D0D1A;
    font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;
    color:#FFFFFF; overflow:hidden; }
  .slide { width:100%; height:100%; padding:200px 72px 420px 72px;
    display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; }
  .kicker { font-size:28px; color:#8B5CF6; letter-spacing:3px; font-weight:600; margin-bottom:50px; }
  .quote-mark { font-size:140px; color:#8B5CF6; line-height:0.6; font-family:Georgia,serif; opacity:0.85; margin-bottom:24px; }
  .quote { font-size:52px; font-weight:900; line-height:1.3; margin-bottom:48px; }
  .quote .red { color:#EF4444; }
  .quote .amber { color:#F59E0B; }
  .vs { width:100%; display:flex; gap:18px; }
  .vs-card { flex:1; background:#1A1A2E; border:1px solid rgba(139,92,246,0.25); border-radius:12px; padding:24px; }
  .vs-l { border-left:4px solid #B0B0CC; color:#B0B0CC; }
  .vs-r { border-left:4px solid #F59E0B; }
  .vs-label { font-size:20px; font-weight:800; letter-spacing:2px; margin-bottom:12px; }
  .vs-r .vs-label { color:#F59E0B; }
  .vs-val { font-size:24px; font-weight:700; line-height:1.4; }
  .vs-r .vs-val { color:#FFFFFF; }
</style>
</head>
<body>
  <div class="slide">
    <div class="kicker">这份路线图最贵的部分</div>
    <div class="quote-mark">"</div>
    <div class="quote">2026 学 AI 最贵的<br>不是<span class="red">订阅费</span><br>是把第 5 步<br>当成<span class="amber">第 1 步</span>的代价</div>
    <div class="vs">
      <div class="vs-card vs-l"><div class="vs-label">链接</div><div class="vs-val">谁都能搜到</div></div>
      <div class="vs-card vs-r"><div class="vs-label">顺序</div><div class="vs-val">真正值钱的东西</div></div>
    </div>
  </div>
</body>
</html>
