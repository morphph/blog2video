<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1920px; background:#0D0D1A;
    font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;
    color:#FFFFFF; overflow:hidden; }
  .slide { width:100%; height:100%; padding:200px 72px 420px 72px;
    display:flex; flex-direction:column; justify-content:center; align-items:center; }
  .kicker { font-size:28px; color:#8B5CF6; letter-spacing:3px; font-weight:600; margin-bottom:28px; }
  .title { font-size:60px; font-weight:900; line-height:1.3; margin-bottom:40px; text-align:center; }
  .title .green { color:#10B981; }
  .tonight { width:100%; display:flex; flex-direction:column; gap:14px; margin-bottom:28px; }
  .t { background:#1A1A2E; border:1px solid rgba(139,92,246,0.25); border-left:4px solid #10B981;
    border-radius:12px; padding:20px 26px; display:flex; align-items:center; gap:20px; }
  .t-num { font-size:36px; font-weight:800; color:#10B981; min-width:50px; }
  .t-text { font-size:24px; font-weight:700; line-height:1.4; }
  .t-text .sub { display:block; font-size:18px; color:#B0B0CC; font-weight:500; margin-top:4px; }
  .punch { width:100%; background:linear-gradient(135deg,#1A1A2E,#2A1A3A);
    border:1px solid rgba(139,92,246,0.4); border-radius:12px; padding:24px;
    text-align:center; font-size:24px; font-weight:700; line-height:1.5; }
  .punch .red { color:#EF4444; }
  .punch .green { color:#10B981; }
</style>
</head>
<body>
  <div class="slide">
    <div class="kicker">今晚 60 分钟可以做的</div>
    <div class="title">3 件事<br>就开始<span class="green">动起来</span></div>
    <div class="tonight">
      <div class="t"><div class="t-num">1</div><div class="t-text">装 Obsidian<div class="sub">建好 AI-Learning 文件夹结构</div></div></div>
      <div class="t"><div class="t-num">2</div><div class="t-text">注册 Anthropic Academy<div class="sub">看完 AI Fluency 第一个模块 · 写笔记</div></div></div>
      <div class="t"><div class="t-num">3</div><div class="t-text">Fork generative-ai-for-beginners<div class="sub">读完 Lesson 1</div></div></div>
    </div>
    <div class="punch">不是<span class="red">收藏 50 篇</span>的人<br>是<span class="green">今晚打开终端</span>的人</div>
  </div>
</body>
</html>
