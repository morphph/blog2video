<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1920px; background:#0D0D1A;
    font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;
    color:#FFFFFF; overflow:hidden; }
  .slide { width:100%; height:100%; padding:200px 72px 420px 72px;
    display:flex; flex-direction:column; justify-content:center; align-items:center; }
  .kicker { font-size:28px; color:#8B5CF6; letter-spacing:3px; font-weight:600; margin-bottom:28px; }
  .title { font-size:54px; font-weight:900; line-height:1.3; margin-bottom:32px; text-align:center; }
  .title .amber { color:#F59E0B; }
  .project { width:100%; background:#1A1A2E; border:1px solid rgba(139,92,246,0.25);
    border-left:4px solid #F59E0B; border-radius:12px; padding:28px 32px; margin-bottom:24px; }
  .week { font-size:22px; color:#F59E0B; font-weight:800; letter-spacing:2px; margin-bottom:14px; }
  .project-title { font-size:32px; font-weight:800; line-height:1.3; margin-bottom:14px; }
  .project-desc { font-size:22px; color:#B0B0CC; line-height:1.5; }
  .project-desc strong { color:#FFFFFF; }
  .insight { width:100%; background:linear-gradient(135deg,#1A1A2E,#2A1A3A);
    border:1px solid rgba(245,158,11,0.4); border-radius:12px; padding:26px;
    text-align:center; font-size:26px; font-weight:700; line-height:1.45; }
  .insight strong { color:#F59E0B; }
  .insight .red { color:#EF4444; }
</style>
</head>
<body>
  <div class="slide">
    <div class="kicker">第二大脑 + 第二大脑</div>
    <div class="title">为什么 RAG<br>放在 <span class="amber">Week 10</span>？</div>
    <div class="project">
      <div class="week">WEEK 10 · LLM PROJECT</div>
      <div class="project-title">给自己的 Obsidian 笔记<br>建一个 RAG</div>
      <div class="project-desc">ChromaDB / LanceDB · 免费本地向量库<br>问它："我学过的 transformer 是什么？"<strong>它从你自己笔记里翻答案</strong></div>
    </div>
    <div class="insight">放在<strong>架构 / 量化 / 评测</strong>之后<br>跳过这些，建出来的 RAG <span class="red">是个黑盒</span></div>
  </div>
</body>
</html>
