<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1920px; background:#0D0D1A;
    font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;
    color:#FFFFFF; overflow:hidden; }
  .slide { width:100%; height:100%; padding:200px 72px 420px 72px;
    display:flex; flex-direction:column; justify-content:center; align-items:center; }
  .kicker { font-size:28px; color:#8B5CF6; letter-spacing:3px; font-weight:600; margin-bottom:28px; }
  .title { font-size:60px; font-weight:900; line-height:1.3; margin-bottom:32px; text-align:center; }
  .title .amber { color:#F59E0B; }
  .nums { display:flex; gap:18px; width:100%; margin-bottom:24px; }
  .nc { flex:1; background:#1A1A2E; border:1px solid rgba(139,92,246,0.25);
    border-left:4px solid #F59E0B; border-radius:12px; padding:24px 18px; text-align:center; }
  .n-val { font-size:48px; font-weight:800; color:#F59E0B; line-height:1; margin-bottom:8px; }
  .n-lab { font-size:18px; color:#B0B0CC; line-height:1.3; }
  .rule { width:100%; background:#1A1A2E; border:1px solid rgba(239,68,68,0.4);
    border-left:4px solid #EF4444; border-radius:12px; padding:24px 28px; margin-bottom:24px; }
  .rule-label { font-size:22px; color:#EF4444; font-weight:800; letter-spacing:2px; margin-bottom:10px; }
  .rule-text { font-size:30px; font-weight:800; line-height:1.4; }
  .rule-text .red { color:#EF4444; }
  .maint { width:100%; background:linear-gradient(135deg,#1A1A2E,#2A1A3A);
    border:1px solid rgba(139,92,246,0.4); border-radius:12px; padding:24px;
    text-align:center; font-size:22px; line-height:1.5; }
  .maint strong { color:#F59E0B; }
</style>
</head>
<body>
  <div class="slide">
    <div class="kicker">14 周不便宜 · 时间是真实代价</div>
    <div class="title">免费只对<br><span class="amber">愿意花 200 小时</span>的人成立</div>
    <div class="nums">
      <div class="nc"><div class="n-val">14 周</div><div class="n-lab">总长</div></div>
      <div class="nc"><div class="n-val">10–15h</div><div class="n-lab">每周投入</div></div>
      <div class="nc"><div class="n-val">200h</div><div class="n-lab">真实成本</div></div>
    </div>
    <div class="rule">
      <div class="rule-label">每步 CHECKPOINT</div>
      <div class="rule-text"><span class="red">做不到就回去</span>——是规则，不是建议</div>
    </div>
    <div class="maint">学完不是终点 · <strong>Maintenance Mode</strong> 每周再投 1 小时</div>
  </div>
</body>
</html>
