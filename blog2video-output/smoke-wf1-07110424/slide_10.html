<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px; background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center; text-align: center;
      position: relative;
    }
    .kicker { font-size: 32px; color: #6B7280; letter-spacing: 3px; margin-bottom: 24px; }
    .title { font-size: 76px; font-weight: 800; line-height: 1.16; margin-bottom: 52px; }
    .title .em { color: #8B5CF6; }
    .items { width: 100%; display: flex; flex-direction: column; gap: 30px; }
    .item { background: #1A1A2E; border-radius: 12px; padding: 40px 40px; text-align: left; display: flex; align-items: center; gap: 30px; border: 1px solid rgba(139,92,246,0.2); border-left: 4px solid #8B5CF6; }
    .item .n { font-size: 60px; font-weight: 800; color: #8B5CF6; min-width: 90px; }
    .item .body .en { font-size: 42px; font-weight: 800; color: #FFFFFF; }
    .item .body .cn { font-size: 32px; color: #B0B0CC; margin-top: 6px; line-height: 1.36; }
    .diff { width: 100%; background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.4); border-radius: 12px; padding: 36px 36px; margin-top: 44px; text-align: left; }
    .diff .d { font-size: 36px; line-height: 1.44; }
    .diff .d .y { color: #F59E0B; font-weight: 700; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="kicker">光有精力想象力还不够 · 再加两样</div>
    <div class="title">韧性 + <span class="em">判断力</span></div>
    <div class="items">
      <div class="item"><div class="n">03</div><div class="body"><div class="en">Resilience</div><div class="cn">韧性 —— 挫折改变不了你的士气</div></div></div>
      <div class="item"><div class="n">04</div><div class="body"><div class="en">Good Judgement</div><div class="cn">判断力 —— 盯着期望值，理性而非鲁莽</div></div></div>
    </div>
    <div class="diff"><div class="d"><span class="y">韧性 ≠ 固执</span>：韧性是士气不被改变，固执是想法不被改变</div></div>
  </div>
</body>
</html>
