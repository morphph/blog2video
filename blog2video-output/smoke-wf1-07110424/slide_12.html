<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px; background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center; text-align: center;
      position: relative;
    }
    .glow { position: absolute; top: 260px; left: 50%; transform: translateX(-50%); width: 720px; height: 720px; background: radial-gradient(circle, rgba(16,185,129,0.18) 0%, rgba(13,13,26,0) 68%); pointer-events: none; }
    .kicker { font-size: 32px; color: #10B981; letter-spacing: 3px; font-weight: 700; margin-bottom: 34px; position: relative; }
    .title { font-size: 88px; font-weight: 800; line-height: 1.14; position: relative; }
    .title .em { color: #F59E0B; }
    .row { width: 100%; display: flex; gap: 26px; margin-top: 60px; position: relative; }
    .cell { flex: 1; background: #1A1A2E; border-radius: 12px; padding: 40px 26px; text-align: left; }
    .cell.a { border: 1px solid rgba(239,68,68,0.25); border-left: 4px solid #EF4444; }
    .cell.b { border: 1px solid rgba(16,185,129,0.3); border-left: 4px solid #10B981; }
    .cell .h { font-size: 34px; font-weight: 800; margin-bottom: 14px; }
    .cell.a .h { color: #EF4444; } .cell.b .h { color: #10B981; }
    .cell .d { font-size: 34px; color: #FFFFFF; line-height: 1.42; }
    .punch { width: 100%; background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.4); border-radius: 12px; padding: 44px 40px; margin-top: 44px; position: relative; }
    .punch .d { font-size: 44px; font-weight: 800; line-height: 1.34; }
    .punch .d .em { color: #F59E0B; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="glow"></div>
    <div class="kicker">摊开来看 · 它一点都不像固执</div>
    <div class="title">凑齐这五样，<br>结果是<span class="em">魔法般的</span></div>
    <div class="row">
      <div class="cell a"><div class="h">固执</div><div class="d">谁都会——小孩、醉汉、傻瓜最擅长</div></div>
      <div class="cell b"><div class="h">对的固执</div><div class="d">稀有得多，结果也好得多</div></div>
    </div>
    <div class="punch"><div class="d">很少有人能同时凑齐<span class="em">这五种品质</span></div></div>
  </div>
</body>
</html>
