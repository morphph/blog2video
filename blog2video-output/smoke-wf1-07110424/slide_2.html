<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px; background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center; text-align: center;
      position: relative;
    }
    .q { font-size: 88px; font-weight: 800; line-height: 1.16; }
    .q .em { color: #8B5CF6; }
    .card {
      width: 100%; background: #1A1A2E; border-radius: 12px; padding: 44px 40px;
      border: 1px solid rgba(139,92,246,0.2); border-left: 4px solid #F59E0B;
      margin-top: 64px; text-align: left;
    }
    .card .line { font-size: 42px; color: #FFFFFF; line-height: 1.5; }
    .card .line .hl { color: #F59E0B; font-weight: 700; }
    .foot { font-size: 40px; color: #B0B0CC; margin-top: 56px; line-height: 1.5; }
    .foot .em { color: #10B981; font-weight: 700; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="q">同一件事，<br>只是<span class="em">结果不同</span>？</div>
    <div class="card">
      <div class="line">叫人“要坚持、别固执",<br>等于叫人<span class="hl">“要对、别错"</span>——这是废话。</div>
    </div>
    <div class="foot">只有当它们是<span class="em">两种真正不同的行为</span>，<br>拆开才有意义。</div>
  </div>
</body>
</html>
