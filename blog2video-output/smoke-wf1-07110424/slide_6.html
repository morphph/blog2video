<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px; background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center; text-align: center;
      position: relative;
    }
    .kicker { font-size: 32px; color: #F59E0B; letter-spacing: 3px; font-weight: 700; margin-bottom: 40px; }
    .card { width: 100%; background: #1A1A2E; border-radius: 12px; padding: 48px 40px; text-align: left; margin-bottom: 30px; }
    .card.a { border: 1px solid rgba(16,185,129,0.3); border-left: 4px solid #10B981; }
    .card.b { border: 1px solid rgba(239,68,68,0.3); border-left: 4px solid #EF4444; }
    .card .h { font-size: 34px; font-weight: 800; margin-bottom: 16px; }
    .card.a .h { color: #10B981; }
    .card.b .h { color: #EF4444; }
    .card .d { font-size: 46px; font-weight: 700; line-height: 1.34; }
    .note { font-size: 38px; color: #B0B0CC; margin-top: 34px; line-height: 1.5; }
    .note .em { color: #EF4444; font-weight: 700; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="kicker">全文最锋利的一刀</div>
    <div class="card a"><div class="h">坚持的人</div><div class="d">执着于<span style="color:#F59E0B">目标</span></div></div>
    <div class="card b"><div class="h">固执的人</div><div class="d">执着于自己<span style="color:#F59E0B">关于怎么达成的那个想法</span></div></div>
    <div class="note">更糟：他抓的往往是<span class="em">最没被打磨过的第一版路线</span></div>
  </div>
</body>
</html>
