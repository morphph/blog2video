<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px; background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center; text-align: center;
      position: relative;
    }
    .title { font-size: 80px; font-weight: 800; line-height: 1.16; margin-bottom: 54px; }
    .title .em { color: #8B5CF6; }
    .test { width: 100%; display: flex; flex-direction: column; gap: 26px; }
    .row { background: #1A1A2E; border-radius: 12px; padding: 38px 36px; text-align: left; border: 1px solid rgba(139,92,246,0.2); }
    .row .q { font-size: 34px; color: #B0B0CC; margin-bottom: 12px; }
    .row .a { font-size: 40px; font-weight: 700; line-height: 1.38; }
    .row .a .g { color: #10B981; }
    .row .a .r { color: #EF4444; }
    .concl { width: 100%; background: rgba(139,92,246,0.12); border: 1px solid rgba(139,92,246,0.4); border-radius: 12px; padding: 42px 40px; margin-top: 40px; }
    .concl .d { font-size: 46px; font-weight: 800; line-height: 1.34; }
    .concl .d .em { color: #8B5CF6; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="title">它不是<span class="em">被压垮</span>，<br>而是天生如此</div>
    <div class="test">
      <div class="row"><div class="q">给坚持的人更难的题</div><div class="a">他不会变固执，反而<span class="g">更开放</span></div></div>
      <div class="row"><div class="q">给固执的人简单的题</div><div class="a">他也不会因此<span class="r">变开放</span></div></div>
    </div>
    <div class="concl"><div class="d">处境改变不了它 →<br>它是一种<span class="em">人格特质</span></div></div>
  </div>
</body>
</html>
