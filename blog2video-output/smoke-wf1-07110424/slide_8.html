<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px; background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center; text-align: center;
      position: relative;
    }
    .kicker { font-size: 32px; color: #F59E0B; letter-spacing: 3px; font-weight: 700; margin-bottom: 30px; }
    .title { font-size: 80px; font-weight: 800; line-height: 1.16; margin-bottom: 24px; }
    .title .em { color: #10B981; }
    .analogy { width: 100%; background: #1A1A2E; border-radius: 12px; padding: 40px 40px; text-align: left; border: 1px solid rgba(139,92,246,0.2); border-left: 4px solid #3B82F6; margin: 40px 0; }
    .analogy .d { font-size: 40px; line-height: 1.44; }
    .analogy .d .b { color: #3B82F6; font-weight: 700; }
    .cards { display: flex; gap: 28px; width: 100%; }
    .c { flex: 1; background: #1A1A2E; border-radius: 12px; padding: 34px 26px; text-align: left; }
    .c.ok { border: 1px solid rgba(16,185,129,0.3); border-left: 4px solid #10B981; }
    .c.no { border: 1px solid rgba(239,68,68,0.3); border-left: 4px solid #EF4444; }
    .c .h { font-size: 30px; font-weight: 800; margin-bottom: 12px; }
    .c.ok .h { color: #10B981; } .c.no .h { color: #EF4444; }
    .c .t { font-size: 32px; color: #FFFFFF; line-height: 1.4; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="kicker">别急着把固执一脚踢开</div>
    <div class="title">最优的固执量<br><span class="em">不是零</span></div>
    <div class="analogy"><div class="d">像<span class="b">无氧呼吸</span>——更原始，却让你在危险前一跃跳开，防止 panic</div></div>
    <div class="cards">
      <div class="c ok"><div class="h">简单 · 单一路径</div><div class="t">固执管用，连很轴的人都能用</div></div>
      <div class="c no"><div class="h">复杂 · 需外部检验</div><div class="t">退化成“诱导性的愚蠢"</div></div>
    </div>
  </div>
</body>
</html>
