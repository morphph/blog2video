<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px; background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center; text-align: center;
      position: relative;
    }
    .kicker { font-size: 32px; color: #6B7280; letter-spacing: 3px; margin-bottom: 24px; }
    .title { font-size: 80px; font-weight: 800; line-height: 1.16; margin-bottom: 56px; }
    .title .em { color: #8B5CF6; }
    .items { width: 100%; display: flex; flex-direction: column; gap: 30px; }
    .item { background: #1A1A2E; border-radius: 12px; padding: 42px 40px; text-align: left; display: flex; align-items: center; gap: 30px; border: 1px solid rgba(139,92,246,0.2); border-left: 4px solid #8B5CF6; }
    .item .n { font-size: 64px; font-weight: 800; color: #8B5CF6; min-width: 90px; }
    .item .body .en { font-size: 44px; font-weight: 800; color: #FFFFFF; }
    .item .body .cn { font-size: 34px; color: #B0B0CC; margin-top: 6px; line-height: 1.36; }
    .note { font-size: 36px; color: #B0B0CC; margin-top: 50px; line-height: 1.48; }
    .note .em { color: #F59E0B; font-weight: 700; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="kicker">坚持的内部结构 · 5 种品质</div>
    <div class="title">坚持，<br>拆得开的<span class="em">复杂结构</span></div>
    <div class="items">
      <div class="item"><div class="n">01</div><div class="body"><div class="en">Energy</div><div class="cn">精力 —— 持续进取，一直在试新东西</div></div></div>
      <div class="item"><div class="n">02</div><div class="body"><div class="en">Imagination</div><div class="cn">想象力 —— 不断想出可以试的东西</div></div></div>
    </div>
    <div class="note">两者<span class="em">互相喂养</span>：精力造需求，想象力给出口</div>
  </div>
</body>
</html>
