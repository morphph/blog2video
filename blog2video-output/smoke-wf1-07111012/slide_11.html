<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width:1080px; height:1920px; background:#0D0D1A; font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif; color:#FFFFFF; overflow:hidden; }
    .slide { width:100%; height:100%; padding:200px 72px 420px 72px; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; position:relative; }
    .head { font-size:48px; font-weight:800; line-height:1.32; margin-bottom:20px; }
    .head .em { color:#8B5CF6; }
    .big { font-size:120px; font-weight:800; color:#8B5CF6; line-height:1; margin-bottom:10px; }
    .biglab { font-size:30px; color:#B0B0CC; margin-bottom:52px; }
    .a { font-size:40px; color:#B0B0CC; margin-bottom:16px; }
    .a b { color:#10B981; font-weight:800; }
    .card { width:100%; background:#1A1A2E; border:1px solid rgba(16,185,129,0.35); border-left:4px solid #10B981; border-radius:12px; padding:34px 30px; text-align:left; font-size:32px; line-height:1.44; }
    .card b { color:#10B981; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="big">2–3</div>
    <div class="biglab">最好的创业公司 · 创始人数</div>
    <div class="a">去哪找联合创始人?答案还是 <b>项目</b></div>
    <div class="card">你要判断两件事:他<b>做的事够不够强</b>,以及<b>你俩合不合得来</b>——唯一的方式,就是真的一起做事</div>
  </div>
</body>
</html>
