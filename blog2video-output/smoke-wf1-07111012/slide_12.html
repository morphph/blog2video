<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width:1080px; height:1920px; background:#0D0D1A; font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif; color:#FFFFFF; overflow:hidden; }
    .slide { width:100%; height:100%; padding:200px 72px 420px 72px; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; position:relative; }
    .head { font-size:50px; font-weight:800; line-height:1.3; margin-bottom:20px; }
    .head .em { color:#F59E0B; }
    .sub { font-size:30px; color:#B0B0CC; line-height:1.5; margin-bottom:52px; }
    .card { width:100%; background:#1A1A2E; border:1px solid rgba(59,130,246,0.3); border-left:4px solid #3B82F6; border-radius:12px; padding:32px 30px; text-align:left; margin-bottom:24px; font-size:32px; line-height:1.42; }
    .card b { color:#3B82F6; }
    .punch { width:100%; background:#1A1A2E; border:1px solid rgba(139,92,246,0.45); border-left:4px solid #8B5CF6; border-radius:12px; padding:36px 30px; text-align:left; }
    .punch .t { font-size:26px; color:#8B5CF6; font-weight:700; margin-bottom:14px; }
    .punch .x { font-size:36px; font-weight:700; line-height:1.4; }
    .punch .x .em { color:#8B5CF6; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="head">功课,<span class="em">还是得考好</span></div>
    <div class="sub">因为你要进最好的大学</div>
    <div class="card">那里有<b>最好的联合创始人和员工</b>——Larry 和 Sergey 一上来就把斯坦福最聪明的人全招了进来</div>
    <div class="punch">
      <div class="t">名校真正的价值</div>
      <div class="x">不在名气、不在教学<br>纯粹在于——<span class="em">"进去有多难"</span></div>
    </div>
  </div>
</body>
</html>
