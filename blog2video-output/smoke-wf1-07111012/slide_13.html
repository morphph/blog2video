<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width:1080px; height:1920px; background:#0D0D1A; font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif; color:#FFFFFF; overflow:hidden; }
    .slide { width:100%; height:100%; padding:200px 72px 420px 72px; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; position:relative; }
    .head { font-size:44px; font-weight:800; line-height:1.3; margin-bottom:44px; }
    .head .em { color:#10B981; }
    .rev { display:flex; flex-direction:column; gap:16px; width:100%; margin-bottom:44px; }
    .r { display:flex; align-items:center; background:#1A1A2E; border-radius:12px; padding:24px 28px; text-align:left; }
    .r.old { border:1px solid rgba(239,68,68,0.3); border-left:4px solid #EF4444; }
    .r.new { border:1px solid rgba(16,185,129,0.35); border-left:4px solid #10B981; }
    .r .k { font-size:24px; font-weight:700; width:120px; flex-shrink:0; letter-spacing:1px; }
    .r.old .k { color:#EF4444; }
    .r.new .k { color:#10B981; }
    .r .v { font-size:29px; color:#FFFFFF; line-height:1.35; }
    .r .v b { color:#10B981; }
    .final { width:100%; background:#1A1A2E; border:1px solid rgba(245,158,11,0.4); border-left:4px solid #F59E0B; border-radius:12px; padding:36px 30px; }
    .final .x { font-size:52px; font-weight:800; line-height:1.35; }
    .final .x .em { color:#F59E0B; }
    .final .cost { margin-top:18px; font-size:26px; color:#6B7280; line-height:1.4; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="head">看清那个<span class="em">认知反转</span></div>
    <div class="rev">
      <div class="r old"><div class="k">你以为</div><div class="v">先有点子 → 创业 → 再学技术</div></div>
      <div class="r new"><div class="k">真相</div><div class="v">先<b>擅长技术</b> → 做项目 → 点子和联合创始人自己冒出来</div></div>
    </div>
    <div class="final">
      <div class="x">造东西,<span class="em">把书念好</span></div>
      <div class="cost">但要诚实:这只是光谱最极端那端,有幸存者偏差,是起点不是保证书</div>
    </div>
  </div>
</body>
</html>
