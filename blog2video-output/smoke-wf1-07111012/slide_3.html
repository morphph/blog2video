<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width:1080px; height:1920px; background:#0D0D1A; font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif; color:#FFFFFF; overflow:hidden; }
    .slide { width:100%; height:100%; padding:200px 72px 420px 72px; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; position:relative; }
    .head { font-size:50px; font-weight:800; line-height:1.32; margin-bottom:26px; }
    .head .em { color:#8B5CF6; }
    .sub { font-size:30px; color:#B0B0CC; line-height:1.5; margin-bottom:56px; }
    .sub b { color:#F59E0B; }
    .steps { display:flex; flex-direction:column; gap:22px; width:100%; }
    .step { display:flex; align-items:center; background:#1A1A2E; border:1px solid rgba(139,92,246,0.3); border-left:4px solid #8B5CF6; border-radius:12px; padding:30px 32px; text-align:left; }
    .step .n { font-size:56px; font-weight:800; color:#8B5CF6; width:96px; flex-shrink:0; }
    .step .t { font-size:38px; font-weight:700; color:#FFFFFF; }
    .step .t span { color:#B0B0CC; font-size:30px; font-weight:500; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="head">"教你创办 Google"<br>真正的意思</div>
    <div class="sub">不是保证你做出万亿公司<br>是把你带到<b>那个起点</b></div>
    <div class="steps">
      <div class="step"><div class="n">01</div><div class="t">擅长某种技术</div></div>
      <div class="step"><div class="n">02</div><div class="t">一个想做的点子</div></div>
      <div class="step"><div class="n">03</div><div class="t">联合创始人</div></div>
    </div>
  </div>
</body>
</html>
