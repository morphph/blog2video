<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width:1080px; height:1920px; background:#0D0D1A; font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif; color:#FFFFFF; overflow:hidden; }
    .slide { width:100%; height:100%; padding:200px 72px 420px 72px; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; position:relative; }
    .q { font-size:40px; color:#B0B0CC; line-height:1.4; margin-bottom:24px; }
    .a { font-size:62px; font-weight:800; color:#8B5CF6; margin-bottom:56px; }
    .card { width:100%; background:#1A1A2E; border-radius:12px; padding:34px 30px; text-align:left; margin-bottom:24px; }
    .card.warn { border:1px solid rgba(239,68,68,0.4); border-left:4px solid #EF4444; }
    .card.hi { border:1px solid rgba(245,158,11,0.4); border-left:4px solid #F59E0B; }
    .card .tag { font-size:26px; font-weight:700; margin-bottom:14px; letter-spacing:1px; }
    .card.warn .tag { color:#EF4444; }
    .card.hi .tag { color:#F59E0B; }
    .card .txt { font-size:34px; color:#FFFFFF; line-height:1.42; }
    .card .txt b { color:#F59E0B; }
    .split { display:flex; gap:24px; width:100%; }
    .split .c { flex:1; background:#1A1A2E; border:1px solid rgba(139,92,246,0.3); border-radius:12px; padding:30px 24px; }
    .split .c .k { font-size:28px; font-weight:700; color:#10B981; margin-bottom:12px; }
    .split .c.no .k { color:#6B7280; }
    .split .c .v { font-size:34px; font-weight:800; color:#FFFFFF; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="q">怎么擅长技术?选哪种技术?</div>
    <div class="a">做你自己的项目</div>
    <div class="card warn"><div class="tag">反常识</div><div class="txt">上计算机课 <b>不够</b>——成绩证明不了会写代码,所以要现场 coding test</div></div>
    <div class="split">
      <div class="c"><div class="k">生产</div><div class="v">写游戏</div></div>
      <div class="c no"><div class="k">消费</div><div class="v">玩游戏</div></div>
    </div>
  </div>
</body>
</html>
