<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width:1080px; height:1920px; background:#0D0D1A; font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif; color:#FFFFFF; overflow:hidden; }
    .slide { width:100%; height:100%; padding:200px 72px 420px 72px; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; position:relative; }
    .name { font-size:30px; color:#F59E0B; font-weight:700; letter-spacing:2px; margin-bottom:24px; }
    .head { font-size:48px; font-weight:800; line-height:1.32; margin-bottom:52px; }
    .head .em { color:#F59E0B; }
    .flow { display:flex; flex-direction:column; gap:18px; width:100%; margin-bottom:52px; }
    .box { background:#1A1A2E; border:1px solid rgba(245,158,11,0.3); border-left:4px solid #F59E0B; border-radius:12px; padding:28px 30px; text-align:left; font-size:32px; line-height:1.4; }
    .box b { color:#F59E0B; }
    .stats { display:flex; gap:24px; width:100%; }
    .stat { flex:1; background:#1A1A2E; border:1px solid rgba(139,92,246,0.3); border-radius:12px; padding:32px 20px; }
    .stat .num { font-size:72px; font-weight:800; color:#8B5CF6; line-height:1; }
    .stat.g .num { color:#10B981; }
    .stat .lab { margin-top:14px; font-size:26px; color:#B0B0CC; line-height:1.3; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="name">STEVE JOBS</div>
    <div class="head">纯粹感兴趣的东西<br>后来<span class="em">碾压了所有对手</span></div>
    <div class="flow">
      <div class="box">青少年学<b>书法</b>——没人觉得有用</div>
      <div class="box">Macintosh 做出<b>印刷级字体</b>,Apple 无人能敌</div>
    </div>
    <div class="stats">
      <div class="stat"><div class="num">90%</div><div class="lab">程序员<br>从做游戏开始</div></div>
      <div class="stat g"><div class="num">7 年</div><div class="lab">22 岁前练技术<br>就已相当不错</div></div>
    </div>
  </div>
</body>
</html>
