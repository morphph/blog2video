<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width:1080px; height:1920px; background:#0D0D1A; font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif; color:#FFFFFF; overflow:hidden; }
    .slide { width:100%; height:100%; padding:200px 72px 420px 72px; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; position:relative; }
    .head { font-size:48px; font-weight:800; line-height:1.32; margin-bottom:52px; }
    .head .em { color:#8B5CF6; }
    .door { width:100%; background:#1A1A2E; border:1px solid rgba(245,158,11,0.35); border-left:4px solid #F59E0B; border-radius:12px; padding:36px 32px; text-align:left; margin-bottom:24px; }
    .door .t { font-size:30px; color:#F59E0B; font-weight:700; margin-bottom:14px; }
    .door .x { font-size:34px; color:#FFFFFF; line-height:1.42; }
    .door .x b { color:#10B981; }
    .punch { width:100%; background:#1A1A2E; border:1px solid rgba(139,92,246,0.4); border-left:4px solid #8B5CF6; border-radius:12px; padding:36px 32px; text-align:left; }
    .punch .x { font-size:38px; font-weight:700; line-height:1.4; }
    .punch .x .em { color:#8B5CF6; }
    .punch .x .warn { color:#EF4444; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="head">擅长技术后<br>点子会<span class="em">自己浮现</span></div>
    <div class="door">
      <div class="t">那扇卡住的门</div>
      <div class="x">店主挂牌"这门很难关",挂了好几年——可任何木匠都会想:<b>为什么不把卡住的部分刨掉?</b></div>
    </div>
    <div class="punch">
      <div class="x">找不到好点子,从来不是 <span class="warn">运气问题</span>,是 <span class="em">能力问题</span></div>
    </div>
  </div>
</body>
</html>
