<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width:1080px; height:1920px; background:#0D0D1A; font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif; color:#FFFFFF; overflow:hidden; }
    .slide { width:100%; height:100%; padding:200px 72px 420px 72px; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; position:relative; }
    .name { font-size:30px; color:#3B82F6; font-weight:700; letter-spacing:2px; margin-bottom:24px; }
    .head { font-size:50px; font-weight:800; line-height:1.3; margin-bottom:52px; }
    .head .em { color:#3B82F6; }
    .card { width:100%; background:#1A1A2E; border:1px solid rgba(59,130,246,0.3); border-left:4px solid #3B82F6; border-radius:12px; padding:34px 30px; text-align:left; margin-bottom:24px; font-size:32px; line-height:1.42; }
    .card b { color:#3B82F6; }
    .big { width:100%; background:#1A1A2E; border:1px solid rgba(16,185,129,0.4); border-left:4px solid #10B981; border-radius:12px; padding:36px 30px; display:flex; align-items:center; gap:28px; margin-bottom:24px; }
    .big .num { font-size:64px; font-weight:800; color:#10B981; line-height:1; flex-shrink:0; }
    .big .lab { font-size:32px; color:#FFFFFF; text-align:left; line-height:1.35; }
    .foot { width:100%; background:#1A1A2E; border:1px solid rgba(139,92,246,0.4); border-left:4px solid #8B5CF6; border-radius:12px; padding:30px; text-align:left; font-size:34px; font-weight:700; line-height:1.4; }
    .foot .em { color:#8B5CF6; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="name">MARK ZUCKERBERG</div>
    <div class="head">"我<span class="em">一晚上</span>就能写个程序修好它"</div>
    <div class="card">哈佛没把全校 <b>facebook</b> 搬上网,校方开会讨论,十年都解决不了</div>
    <div class="big"><div class="num">数千</div><div class="lab">用户几乎<br>一夜之间涌入</div></div>
    <div class="foot">但那时的 Facebook,还只是个 <span class="em">项目</span></div>
  </div>
</body>
</html>
