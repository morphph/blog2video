<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width:1080px; height:1920px; background:#0D0D1A; font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif; color:#FFFFFF; overflow:hidden; }
    .slide { width:100%; height:100%; padding:200px 72px 420px 72px; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; position:relative; }
    .head { font-size:52px; font-weight:800; line-height:1.3; margin-bottom:48px; }
    .head .em { color:#8B5CF6; }
    .row { display:flex; gap:24px; width:100%; margin-bottom:40px; }
    .card { flex:1; background:#1A1A2E; border:1px solid rgba(139,92,246,0.3); border-left:4px solid #8B5CF6; border-radius:12px; padding:32px 26px; text-align:left; }
    .card .n { font-size:34px; font-weight:800; color:#8B5CF6; margin-bottom:14px; }
    .card .x { font-size:29px; color:#B0B0CC; line-height:1.4; }
    .card .x b { color:#FFFFFF; }
    .rugby { width:100%; background:#1A1A2E; border:1px solid rgba(239,68,68,0.35); border-left:4px solid #EF4444; border-radius:12px; padding:34px 30px; text-align:left; }
    .rugby .t { font-size:28px; font-weight:700; color:#EF4444; margin-bottom:14px; }
    .rugby .x { font-size:32px; color:#FFFFFF; line-height:1.42; }
    .rugby .x b { color:#F59E0B; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="head">Apple 和 Google<br>一开始也只是<span class="em">项目</span></div>
    <div class="row">
      <div class="card"><div class="n">Apple</div><div class="x">Wozniak 只想给自己造台电脑,一开始<b>只卖图纸</b></div></div>
      <div class="card"><div class="n">Google</div><div class="x">Larry 和 Sergey 只想把<b>搜索做好一点</b></div></div>
    </div>
    <div class="rugby">
      <div class="t">卡住的门 · 搜索排序</div>
      <div class="x">搜 <b>rugby</b> 就把每个含这词的网页全甩给你——网络指数膨胀,这笨办法也指数变糟</div>
    </div>
  </div>
</body>
</html>
