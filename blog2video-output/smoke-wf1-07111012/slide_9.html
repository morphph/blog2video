<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width:1080px; height:1920px; background:#0D0D1A; font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif; color:#FFFFFF; overflow:hidden; }
    .slide { width:100%; height:100%; padding:200px 72px 420px 72px; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; position:relative; }
    .glow { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:760px; height:760px; background:radial-gradient(circle, rgba(139,92,246,0.22) 0%, rgba(139,92,246,0) 70%); pointer-events:none; }
    .mark { font-size:150px; font-weight:800; color:#8B5CF6; line-height:0.6; height:80px; position:relative; }
    .quote { font-size:56px; font-weight:800; line-height:1.4; position:relative; margin:20px 0 44px; }
    .quote .em { color:#F59E0B; }
    .sub { width:100%; background:#1A1A2E; border:1px solid rgba(139,92,246,0.35); border-radius:12px; padding:34px 30px; font-size:32px; color:#B0B0CC; line-height:1.45; position:relative; }
    .sub b { color:#FFFFFF; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="glow"></div>
    <div class="mark">"</div>
    <div class="quote">好主意在当时<br><span class="em">永远不会明显</span></div>
    <div class="sub">如果 Apple、Google、Facebook 当时是明摆着的好生意,<b>早被抢着做了</b>——正因不像好生意,才轮到这几个年轻人</div>
  </div>
</body>
</html>
