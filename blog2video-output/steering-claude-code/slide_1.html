<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .glow {
      position: absolute;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 980px;
      height: 640px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.18) 0%, rgba(13, 13, 26, 0) 70%);
      pointer-events: none;
    }
    .badge {
      font-size: 28px;
      font-weight: 600;
      color: #F59E0B;
      letter-spacing: 0.08em;
      margin-bottom: 36px;
      padding: 12px 28px;
      border: 1px solid rgba(245, 158, 11, 0.45);
      border-radius: 999px;
      background: rgba(245, 158, 11, 0.08);
    }
    .title {
      font-size: 88px;
      font-weight: 900;
      line-height: 1.18;
      letter-spacing: -0.01em;
      position: relative;
      margin-bottom: 56px;
    }
    .hl { color: #F59E0B; }
    .num { color: #8B5CF6; }
    .subtitle {
      font-size: 34px;
      color: #B0B0CC;
      line-height: 1.45;
      max-width: 880px;
    }
    .subtitle .term {
      color: #FFFFFF;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="glow"></div>
    <div class="badge">ANTHROPIC 官方指南</div>
    <div class="title">
      调教 Claude Code 的<br>
      <span class="num">7 种</span>武器，<br>
      你用错了几个？
    </div>
    <div class="subtitle">
      <span class="term">Subagent · Skill · Hooks · CLAUDE.md</span><br>
      加载时机、压缩行为、强制力完全不同
    </div>
  </div>
</body>
</html>
