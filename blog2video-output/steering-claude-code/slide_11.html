<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 180px 64px 420px 64px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .title {
      font-size: 52px;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 36px;
    }
    .title .hl { color: #F59E0B; }
    .row-block {
      width: 100%;
      margin-bottom: 22px;
    }
    .row-label {
      font-family: 'SF Mono', 'JetBrains Mono', Menlo, monospace;
      font-size: 22px;
      font-weight: 700;
      color: #F59E0B;
      letter-spacing: 0.08em;
      margin-bottom: 12px;
      text-align: left;
    }
    .row {
      display: flex;
      gap: 12px;
      width: 100%;
    }
    .tier {
      flex: 1;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 10px;
      padding: 18px 16px;
      text-align: left;
    }
    .tier.high { border-left: 3px solid #EF4444; }
    .tier.mid { border-left: 3px solid #F59E0B; }
    .tier.low { border-left: 3px solid #10B981; }
    .tier .tag {
      font-family: 'SF Mono', 'JetBrains Mono', Menlo, monospace;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }
    .tier.high .tag { color: #EF4444; }
    .tier.mid .tag { color: #F59E0B; }
    .tier.low .tag { color: #10B981; }
    .tier .items {
      font-size: 20px;
      color: #FFFFFF;
      line-height: 1.4;
    }
    .quote {
      width: 100%;
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.4);
      border-radius: 12px;
      padding: 22px 26px;
      font-size: 26px;
      font-weight: 700;
      line-height: 1.4;
      color: #FFFFFF;
      text-align: left;
      margin-top: 8px;
    }
    .quote .hl { color: #10B981; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="title">7 个槽 · <span class="hl">3 个维度</span>对照</div>

    <div class="row-block">
      <div class="row-label">// 上下文成本</div>
      <div class="row">
        <div class="tier high">
          <div class="tag">高</div>
          <div class="items">CLAUDE.md 根目录<br>Unscoped Rule<br>Output Styles</div>
        </div>
        <div class="tier mid">
          <div class="tag">中</div>
          <div class="items">Append<br>System Prompt</div>
        </div>
        <div class="tier low">
          <div class="tag">低</div>
          <div class="items">子目录 CLAUDE.md<br>Path-scoped Rule<br>Skill / Subagent / Hook</div>
        </div>
      </div>
    </div>

    <div class="row-block">
      <div class="row-label">// 压缩行为</div>
      <div class="row">
        <div class="tier high">
          <div class="tag">永不丢</div>
          <div class="items">CLAUDE.md<br>Rule<br>Output Styles</div>
        </div>
        <div class="tier mid">
          <div class="tag">会挤出</div>
          <div class="items">Skill<br>(共享 budget<br>oldest 先 drop)</div>
        </div>
        <div class="tier low">
          <div class="tag">绕过</div>
          <div class="items">Hook · Append</div>
        </div>
      </div>
    </div>

    <div class="quote">
      按强制力分 · 只有 <span class="hl">Hook</span> 是真护栏<br>
      其它六种都是建议
    </div>
  </div>
</body>
</html>
