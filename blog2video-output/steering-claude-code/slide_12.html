<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 180px 64px 420px 64px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .title {
      font-size: 50px;
      font-weight: 900;
      line-height: 1.22;
      margin-bottom: 32px;
    }
    .title .hl { color: #F59E0B; }
    .map {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 28px;
    }
    .row {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 10px;
      padding: 16px 22px;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 18px;
    }
    .row .what {
      flex: 1;
      font-size: 26px;
      color: #FFFFFF;
      font-weight: 600;
      line-height: 1.3;
    }
    .row .arrow {
      font-family: 'SF Mono', 'JetBrains Mono', Menlo, monospace;
      font-size: 22px;
      color: #6B7280;
    }
    .row .where {
      font-family: 'SF Mono', 'JetBrains Mono', Menlo, monospace;
      font-size: 24px;
      font-weight: 700;
      min-width: 180px;
      text-align: right;
    }
    .row.p { border-left: 4px solid #8B5CF6; }
    .row.p .where { color: #8B5CF6; }
    .row.r { border-left: 4px solid #3B82F6; }
    .row.r .where { color: #3B82F6; }
    .row.s { border-left: 4px solid #10B981; }
    .row.s .where { color: #10B981; }
    .row.a { border-left: 4px solid #5fd3e8; }
    .row.a .where { color: #5fd3e8; }
    .row.h { border-left: 4px solid #F59E0B; }
    .row.h .where { color: #F59E0B; }
    .row.o { border-left: 4px solid #EF4444; }
    .row.o .where { color: #EF4444; }
    .cta {
      width: 100%;
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.45);
      border-radius: 12px;
      padding: 24px 28px;
      text-align: left;
    }
    .cta .tag {
      font-family: 'SF Mono', 'JetBrains Mono', Menlo, monospace;
      font-size: 20px;
      font-weight: 700;
      color: #F59E0B;
      letter-spacing: 0.06em;
      margin-bottom: 10px;
    }
    .cta .text {
      font-size: 28px;
      font-weight: 700;
      color: #FFFFFF;
      line-height: 1.4;
    }
    .cta .text .hl { color: #F59E0B; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="title">你在选指令<span class="hl">住哪</span></div>
    <div class="map">
      <div class="row p">
        <div class="what">事实</div>
        <div class="arrow">→</div>
        <div class="where">CLAUDE.md</div>
      </div>
      <div class="row r">
        <div class="what">路径约束</div>
        <div class="arrow">→</div>
        <div class="where">Rule</div>
      </div>
      <div class="row s">
        <div class="what">过程 / procedure</div>
        <div class="arrow">→</div>
        <div class="where">Skill</div>
      </div>
      <div class="row a">
        <div class="what">隔离的副任务</div>
        <div class="arrow">→</div>
        <div class="where">Subagent</div>
      </div>
      <div class="row h">
        <div class="what">确定性自动化</div>
        <div class="arrow">→</div>
        <div class="where">Hook</div>
      </div>
      <div class="row o">
        <div class="what">角色重塑</div>
        <div class="arrow">→</div>
        <div class="where">Output Style</div>
      </div>
      <div class="row a">
        <div class="what">临时调整</div>
        <div class="arrow">→</div>
        <div class="where">Append</div>
      </div>
    </div>
    <div class="cta">
      <div class="tag">// 今天就做一件事</div>
      <div class="text">
        打开你的 CLAUDE.md · 数一下行数<br>
        超过 <span class="hl">200 行</span>的部分，挑出来搬家
      </div>
    </div>
  </div>
</body>
</html>
