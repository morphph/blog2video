<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .title {
      font-size: 60px;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 16px;
    }
    .title .hl { color: #8B5CF6; }
    .subtitle {
      font-size: 28px;
      color: #B0B0CC;
      font-family: 'SF Mono', 'JetBrains Mono', Menlo, monospace;
      margin-bottom: 56px;
    }
    .vs {
      display: flex;
      gap: 24px;
      width: 100%;
      align-items: stretch;
      margin-bottom: 40px;
    }
    .card {
      flex: 1;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 32px 26px;
      text-align: left;
    }
    .card.bad { border-left: 4px solid #EF4444; }
    .card.good { border-left: 4px solid #10B981; }
    .card .tag {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.06em;
      margin-bottom: 14px;
    }
    .card.bad .tag { color: #EF4444; }
    .card.good .tag { color: #10B981; }
    .card .name {
      font-size: 36px;
      font-weight: 800;
      color: #FFFFFF;
      margin-bottom: 16px;
      line-height: 1.2;
    }
    .card .desc {
      font-size: 24px;
      color: #B0B0CC;
      line-height: 1.45;
    }
    .code {
      width: 100%;
      background: #0F0F1E;
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 12px;
      padding: 28px 32px;
      font-family: 'SF Mono', 'JetBrains Mono', Menlo, monospace;
      font-size: 26px;
      line-height: 1.55;
      text-align: left;
    }
    .code .key { color: #8B5CF6; }
    .code .str { color: #10B981; }
    .code .com { color: #6B7280; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="title"><span class="hl">Rules</span> 的真正价值<br>= path-scoped</div>
    <div class="subtitle">.claude/rules/ · 带 frontmatter 的 markdown</div>
    <div class="vs">
      <div class="card bad">
        <div class="tag">UNSCOPED</div>
        <div class="name">没 paths</div>
        <div class="desc">机制上等于<br>写在 CLAUDE.md 里<br>一样常驻，一样烧 token</div>
      </div>
      <div class="card good">
        <div class="tag">PATH-SCOPED</div>
        <div class="name">带 paths</div>
        <div class="desc">只在 Claude 读到<br>对应目录文件时才<br>进上下文</div>
      </div>
    </div>
    <div class="code">
      <span class="com"># frontmatter</span><br>
      <span class="key">paths:</span> [<span class="str">"src/api/**"</span>, <span class="str">"**/*.handler.ts"</span>]<br>
      <span class="com"># 只在写 API 时才出现</span>
    </div>
  </div>
</body>
</html>
