<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .title {
      font-size: 60px;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 16px;
    }
    .title .hl { color: #8B5CF6; }
    .subtitle {
      font-size: 28px;
      color: #B0B0CC;
      font-family: 'SF Mono', 'JetBrains Mono', Menlo, monospace;
      margin-bottom: 48px;
    }
    .split {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 36px;
    }
    .row {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-left: 4px solid #8B5CF6;
      border-radius: 12px;
      padding: 24px 28px;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 24px;
    }
    .row .label {
      font-family: 'SF Mono', 'JetBrains Mono', Menlo, monospace;
      font-size: 24px;
      font-weight: 700;
      color: #8B5CF6;
      min-width: 220px;
      letter-spacing: 0.04em;
    }
    .row .text {
      font-size: 28px;
      color: #FFFFFF;
      line-height: 1.4;
    }
    .row.fact {
      border-left-color: #10B981;
    }
    .row.fact .label { color: #10B981; }
    .verdict {
      background: rgba(245, 158, 11, 0.08);
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-radius: 12px;
      padding: 28px 32px;
      width: 100%;
      font-size: 32px;
      line-height: 1.45;
      font-weight: 700;
      color: #FFFFFF;
      text-align: left;
    }
    .verdict .hl { color: #F59E0B; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="title"><span class="hl">Skills</span> 治的是<br>"30 行 procedure"病</div>
    <div class="subtitle">.claude/skills/ · SKILL.md</div>
    <div class="split">
      <div class="row">
        <div class="label">SESSION START</div>
        <div class="text">只加载 <b>name + description</b></div>
      </div>
      <div class="row fact">
        <div class="label">ON INVOKE</div>
        <div class="text">body 才加载进上下文</div>
      </div>
    </div>
    <div class="verdict">
      程序性的东西放 <span class="hl">skill</span><br>
      事实性的东西放 <span class="hl">CLAUDE.md</span>
    </div>
  </div>
</body>
</html>
