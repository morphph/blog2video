<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .title {
      font-size: 60px;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 16px;
    }
    .title .hl { color: #8B5CF6; }
    .subtitle {
      font-size: 28px;
      color: #B0B0CC;
      font-family: 'SF Mono', 'JetBrains Mono', Menlo, monospace;
      margin-bottom: 48px;
    }
    .core {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-left: 4px solid #8B5CF6;
      border-radius: 12px;
      padding: 36px 32px;
      text-align: left;
      margin-bottom: 32px;
    }
    .core .big {
      font-size: 38px;
      font-weight: 800;
      color: #FFFFFF;
      line-height: 1.3;
      margin-bottom: 14px;
    }
    .core .big .hl { color: #8B5CF6; }
    .core .desc {
      font-size: 26px;
      color: #B0B0CC;
      line-height: 1.45;
    }
    .stats {
      display: flex;
      gap: 22px;
      width: 100%;
      margin-bottom: 32px;
    }
    .stat {
      flex: 1;
      background: #1A1A2E;
      border: 1px solid rgba(245, 158, 11, 0.35);
      border-radius: 12px;
      padding: 28px 22px;
      text-align: left;
    }
    .stat .num {
      font-family: 'SF Mono', 'JetBrains Mono', Menlo, monospace;
      font-size: 76px;
      font-weight: 800;
      color: #F59E0B;
      line-height: 1;
      margin-bottom: 10px;
    }
    .stat .lab {
      font-size: 22px;
      color: #B0B0CC;
      line-height: 1.4;
    }
    .scenarios {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .chip {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.4);
      border-radius: 999px;
      padding: 14px 24px;
      font-size: 24px;
      font-weight: 600;
      color: #10B981;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="title"><span class="hl">Subagent</span> 真正省的<br>是"中间过程"</div>
    <div class="subtitle">.claude/agents/ · 跑在独立 context window</div>
    <div class="core">
      <div class="big">回到主会话的<br>只有 <span class="hl">最终一条消息</span></div>
      <div class="desc">所有 tool call、思考、中间结果<br>都关在 subagent 自己的窗口里</div>
    </div>
    <div class="stats">
      <div class="stat">
        <div class="num">5 层</div>
        <div class="lab">可嵌套深度</div>
      </div>
      <div class="stat">
        <div class="num">100+</div>
        <div class="lab">可并行编排的<br>后台 agent</div>
      </div>
    </div>
    <div class="scenarios">
      <div class="chip">深度搜索</div>
      <div class="chip">日志分析</div>
      <div class="chip">依赖审计</div>
    </div>
  </div>
</body>
</html>
