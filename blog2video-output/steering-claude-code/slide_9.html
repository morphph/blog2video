<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .title {
      font-size: 60px;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 16px;
    }
    .title .hl { color: #8B5CF6; }
    .subtitle {
      font-size: 28px;
      color: #B0B0CC;
      font-family: 'SF Mono', 'JetBrains Mono', Menlo, monospace;
      margin-bottom: 40px;
    }
    .pro {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.35);
      border-left: 4px solid #8B5CF6;
      border-radius: 12px;
      padding: 26px 28px;
      text-align: left;
      margin-bottom: 22px;
    }
    .pro .tag {
      font-family: 'SF Mono', 'JetBrains Mono', Menlo, monospace;
      font-size: 22px;
      font-weight: 700;
      color: #8B5CF6;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }
    .pro .text {
      font-size: 28px;
      color: #FFFFFF;
      line-height: 1.4;
    }
    .cost {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-left: 4px solid #EF4444;
      border-radius: 12px;
      padding: 28px;
      text-align: left;
      margin-bottom: 24px;
    }
    .cost .tag {
      font-family: 'SF Mono', 'JetBrains Mono', Menlo, monospace;
      font-size: 22px;
      font-weight: 700;
      color: #EF4444;
      letter-spacing: 0.06em;
      margin-bottom: 12px;
    }
    .cost .big {
      font-size: 34px;
      font-weight: 800;
      color: #FFFFFF;
      line-height: 1.3;
      margin-bottom: 12px;
    }
    .cost .desc {
      font-size: 26px;
      color: #B0B0CC;
      line-height: 1.45;
    }
    .escape {
      width: 100%;
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.4);
      border-radius: 12px;
      padding: 22px 28px;
      text-align: left;
      font-family: 'SF Mono', 'JetBrains Mono', Menlo, monospace;
      font-size: 26px;
      line-height: 1.4;
    }
    .escape .key { color: #10B981; font-weight: 700; }
    .escape .val { color: #F59E0B; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="title"><span class="hl">Output Styles</span><br>权重最高，代价最重</div>
    <div class="subtitle">.claude/output-styles/ · 注入 system prompt</div>
    <div class="pro">
      <div class="tag">// PRO</div>
      <div class="text">永不被压缩 · 指令遵循权重最高</div>
    </div>
    <div class="cost">
      <div class="tag">// COST</div>
      <div class="big">替换掉默认 system prompt</div>
      <div class="desc">"软件工程师助手"退化成"通用助手"<br>scope、注释、安全、测试纪律全丢</div>
    </div>
    <div class="escape">
      <span class="key">keep-coding-instructions:</span> <span class="val">true</span>
    </div>
  </div>
</body>
</html>
