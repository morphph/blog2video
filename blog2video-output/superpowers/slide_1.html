<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .slide::before {
      content: '';
      position: absolute;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.12) 0%, transparent 70%);
      pointer-events: none;
    }
    .series-tag {
      font-size: 28px;
      color: #8B5CF6;
      letter-spacing: 3px;
      margin-bottom: 48px;
      font-weight: 500;
    }
    .main-title {
      font-size: 82px;
      font-weight: 900;
      line-height: 1.25;
      margin-bottom: 56px;
      max-width: 900px;
    }
    .main-title .highlight-red {
      color: #EF4444;
    }
    .main-title .highlight-yellow {
      color: #F59E0B;
    }
    .pain-cards {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
      max-width: 900px;
    }
    .pain-card {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-left: 4px solid #EF4444;
      border-radius: 12px;
      padding: 24px 28px;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .pain-icon {
      font-size: 32px;
      flex-shrink: 0;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(239, 68, 68, 0.15);
      border-radius: 10px;
      color: #EF4444;
      font-weight: 700;
    }
    .pain-text {
      font-size: 30px;
      color: #B0B0CC;
      line-height: 1.4;
    }
    .pain-text strong {
      color: #FFFFFF;
      font-weight: 700;
    }
    .time-tag {
      margin-top: 48px;
      font-size: 56px;
      font-weight: 800;
      color: #EF4444;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="series-tag">精读AI &middot; AI编程</div>
    <div class="main-title">
      AI写代码<span class="highlight-red">45分钟</span><br>全部<span class="highlight-yellow">白干</span>？
    </div>
    <div class="pain-cards">
      <div class="pain-card">
        <div class="pain-icon">!</div>
        <div class="pain-text"><strong>选错方案</strong>，方向完全反了</div>
      </div>
      <div class="pain-card">
        <div class="pain-icon">!</div>
        <div class="pain-text"><strong>加一堆没人要的功能</strong></div>
      </div>
      <div class="pain-card">
        <div class="pain-icon">!</div>
        <div class="pain-text">测试没跑就说<strong>"全部通过"</strong></div>
      </div>
    </div>
    <div class="time-tag">45分钟，白干</div>
  </div>
</body>
</html>
