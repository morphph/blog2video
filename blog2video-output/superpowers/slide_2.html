<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .title {
      font-size: 52px;
      font-weight: 800;
      margin-bottom: 48px;
      line-height: 1.3;
    }
    .title .accent {
      color: #8B5CF6;
    }
    .concept-card {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-left: 4px solid #8B5CF6;
      border-radius: 12px;
      padding: 32px 28px;
      width: 100%;
      max-width: 920px;
      text-align: left;
      margin-bottom: 36px;
    }
    .concept-label {
      font-size: 22px;
      color: #8B5CF6;
      letter-spacing: 2px;
      margin-bottom: 12px;
      font-weight: 600;
    }
    .concept-en {
      font-size: 36px;
      font-weight: 800;
      color: #F59E0B;
      margin-bottom: 8px;
      font-style: italic;
    }
    .concept-zh {
      font-size: 28px;
      color: #B0B0CC;
      line-height: 1.5;
    }
    .analogy-section {
      width: 100%;
      max-width: 920px;
      margin-bottom: 32px;
    }
    .analogy-title {
      font-size: 26px;
      color: #F59E0B;
      margin-bottom: 20px;
      font-weight: 700;
    }
    .analogy-steps {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .step {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 20px 24px;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .step-num {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(239, 68, 68, 0.2);
      color: #EF4444;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 22px;
      flex-shrink: 0;
    }
    .step-text {
      font-size: 28px;
      color: #B0B0CC;
      line-height: 1.4;
    }
    .step-text strong {
      color: #FFFFFF;
    }
    .bottom-line {
      margin-top: 36px;
      font-size: 34px;
      font-weight: 700;
      color: #EF4444;
      background: rgba(239, 68, 68, 0.1);
      padding: 16px 32px;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="title">AI写砸了，不是<span class="accent">不聪明</span><br>是<span class="accent">太急了</span></div>

    <div class="concept-card">
      <div class="concept-label">核心概念</div>
      <div class="concept-en">Pathologically Eager to Please</div>
      <div class="concept-zh">病态讨好倾向 —— AI 刚听半句就冲去干活</div>
    </div>

    <div class="analogy-section">
      <div class="analogy-title">天才实习生的翻车三连</div>
      <div class="analogy-steps">
        <div class="step">
          <div class="step-num">1</div>
          <div class="step-text">听了<strong>半句需求</strong>就冲出去干</div>
        </div>
        <div class="step">
          <div class="step-num">2</div>
          <div class="step-text">干了一整天，<strong>方向完全反了</strong></div>
        </div>
        <div class="step">
          <div class="step-num">3</div>
          <div class="step-text">给反馈秒改，<strong>改崩原有代码</strong></div>
        </div>
      </div>
    </div>

    <div class="bottom-line">不是能力问题，是纪律问题</div>
  </div>
</body>
</html>
