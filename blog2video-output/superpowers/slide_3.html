<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .title {
      font-size: 48px;
      font-weight: 800;
      margin-bottom: 44px;
      line-height: 1.3;
    }
    .title .accent {
      color: #10B981;
    }
    .quote-block {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-left: 4px solid #10B981;
      border-radius: 12px;
      padding: 36px 32px;
      width: 100%;
      max-width: 920px;
      text-align: left;
      margin-bottom: 40px;
      position: relative;
    }
    .quote-mark {
      position: absolute;
      top: -10px;
      left: 20px;
      font-size: 80px;
      color: rgba(16, 185, 129, 0.3);
      font-family: Georgia, serif;
      line-height: 1;
    }
    .quote-text {
      font-size: 32px;
      line-height: 1.6;
      color: #FFFFFF;
      font-weight: 600;
      padding-left: 8px;
    }
    .quote-text .highlight {
      color: #F59E0B;
    }
    .quote-source {
      font-size: 22px;
      color: #6B7280;
      margin-top: 16px;
      padding-left: 8px;
    }
    .what-section {
      width: 100%;
      max-width: 920px;
      margin-bottom: 32px;
    }
    .what-title {
      font-size: 28px;
      color: #8B5CF6;
      font-weight: 700;
      margin-bottom: 20px;
    }
    .what-cards {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .what-card {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 20px 24px;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .what-icon {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 800;
      flex-shrink: 0;
    }
    .what-icon.green {
      background: rgba(16, 185, 129, 0.15);
      color: #10B981;
    }
    .what-text {
      font-size: 28px;
      color: #B0B0CC;
      line-height: 1.4;
    }
    .what-text strong {
      color: #FFFFFF;
    }
    .stats-row {
      display: flex;
      gap: 20px;
      width: 100%;
      max-width: 920px;
    }
    .stat-card {
      flex: 1;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 24px 16px;
      text-align: center;
    }
    .stat-num {
      font-size: 56px;
      font-weight: 800;
      color: #8B5CF6;
      line-height: 1;
      margin-bottom: 8px;
    }
    .stat-label {
      font-size: 22px;
      color: #6B7280;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="title">解法：不是框架<br>是一本<span class="accent">操作手册</span></div>

    <div class="quote-block">
      <div class="quote-mark">&ldquo;</div>
      <div class="quote-text">新员工入职第一天的操作手册<br>不是建议，是<span class="highlight">"没有例外"</span>的流程</div>
      <div class="quote-source">Superpowers 设计理念</div>
    </div>

    <div class="what-section">
      <div class="what-title">Superpowers 是什么</div>
      <div class="what-cards">
        <div class="what-card">
          <div class="what-icon green">M</div>
          <div class="what-text">一组结构化的 <strong>Markdown 技能文档</strong></div>
        </div>
        <div class="what-card">
          <div class="what-icon green">A</div>
          <div class="what-text">AI 会话启动时<strong>自动注入</strong></div>
        </div>
        <div class="what-card">
          <div class="what-icon green">R</div>
          <div class="what-text">提前堵住 AI <strong>偷懒的每条路</strong></div>
        </div>
      </div>
    </div>

    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-num">15</div>
        <div class="stat-label">技能文档</div>
      </div>
      <div class="stat-card">
        <div class="stat-num">6.7万</div>
        <div class="stat-label">GitHub Stars</div>
      </div>
    </div>
  </div>
</body>
</html>
