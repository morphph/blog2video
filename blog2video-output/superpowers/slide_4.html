<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .title {
      font-size: 48px;
      font-weight: 800;
      margin-bottom: 44px;
      line-height: 1.3;
    }
    .title .accent {
      color: #3B82F6;
    }
    .flow-section {
      width: 100%;
      max-width: 920px;
      margin-bottom: 36px;
    }
    .flow-label {
      font-size: 24px;
      color: #6B7280;
      margin-bottom: 18px;
      letter-spacing: 1px;
    }
    .flow-steps {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .flow-step {
      background: #1A1A2E;
      border: 1px solid rgba(59, 130, 246, 0.3);
      border-radius: 12px;
      padding: 16px 20px;
      font-size: 24px;
      color: #FFFFFF;
      font-weight: 600;
    }
    .flow-arrow {
      font-size: 28px;
      color: #3B82F6;
    }
    .platforms {
      display: flex;
      gap: 16px;
      margin-bottom: 40px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .platform-tag {
      background: rgba(59, 130, 246, 0.12);
      border: 1px solid rgba(59, 130, 246, 0.3);
      border-radius: 24px;
      padding: 10px 24px;
      font-size: 24px;
      color: #3B82F6;
      font-weight: 600;
    }
    .mandate-card {
      background: #1A1A2E;
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-left: 4px solid #EF4444;
      border-radius: 12px;
      padding: 32px 28px;
      width: 100%;
      max-width: 920px;
      text-align: left;
      margin-bottom: 36px;
    }
    .mandate-label {
      font-size: 20px;
      color: #EF4444;
      letter-spacing: 2px;
      margin-bottom: 14px;
      font-weight: 700;
    }
    .mandate-en {
      font-size: 26px;
      font-weight: 800;
      color: #F59E0B;
      line-height: 1.5;
      margin-bottom: 12px;
      font-style: italic;
    }
    .mandate-zh {
      font-size: 28px;
      color: #B0B0CC;
      line-height: 1.5;
    }
    .mandate-zh strong {
      color: #FFFFFF;
    }
    .hook-card {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-left: 4px solid #8B5CF6;
      border-radius: 12px;
      padding: 24px 28px;
      width: 100%;
      max-width: 920px;
      text-align: left;
    }
    .hook-label {
      font-size: 20px;
      color: #8B5CF6;
      letter-spacing: 2px;
      margin-bottom: 10px;
      font-weight: 700;
    }
    .hook-text {
      font-size: 28px;
      color: #B0B0CC;
      line-height: 1.5;
    }
    .hook-text strong {
      color: #FFFFFF;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="title">工作原理：<span class="accent">Session Hook</span></div>

    <div class="platforms">
      <div class="platform-tag">Claude Code</div>
      <div class="platform-tag">Cursor</div>
      <div class="platform-tag">Codex</div>
      <div class="platform-tag">OpenCode</div>
    </div>

    <div class="flow-section">
      <div class="flow-label">每次新会话启动</div>
      <div class="flow-steps">
        <div class="flow-step">启动会话</div>
        <div class="flow-arrow">&rarr;</div>
        <div class="flow-step">Session Hook 触发</div>
        <div class="flow-arrow">&rarr;</div>
        <div class="flow-step">注入技能文档</div>
        <div class="flow-arrow">&rarr;</div>
        <div class="flow-step">开始工作</div>
      </div>
    </div>

    <div class="mandate-card">
      <div class="mandate-label">强制规则（原文加粗大写）</div>
      <div class="mandate-en">"IF A SKILL APPLIES TO YOUR TASK,<br>YOU DO NOT HAVE A CHOICE.<br>YOU MUST USE IT."</div>
      <div class="mandate-zh"><strong>该用的技能，没有选择权</strong>，必须用</div>
    </div>

    <div class="hook-card">
      <div class="hook-label">类比</div>
      <div class="hook-text">像公司大门的<strong>门禁系统</strong><br>每次开工前，先刷一遍规章制度</div>
    </div>
  </div>
</body>
</html>
