<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .title {
      font-size: 52px;
      font-weight: 800;
      margin-bottom: 48px;
      line-height: 1.3;
    }
    .title .accent {
      color: #10B981;
    }
    .summary-list {
      width: 100%;
      max-width: 920px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      margin-bottom: 44px;
    }
    .summary-item {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 22px 28px;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 18px;
    }
    .summary-num {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 24px;
      flex-shrink: 0;
    }
    .summary-num.purple {
      background: rgba(139, 92, 246, 0.2);
      color: #8B5CF6;
    }
    .summary-num.green {
      background: rgba(16, 185, 129, 0.2);
      color: #10B981;
    }
    .summary-num.yellow {
      background: rgba(245, 158, 11, 0.2);
      color: #F59E0B;
    }
    .summary-text {
      font-size: 28px;
      color: #B0B0CC;
      line-height: 1.4;
    }
    .summary-text strong {
      color: #FFFFFF;
    }
    .summary-text .stat {
      color: #F59E0B;
      font-weight: 800;
    }
    .action-card {
      background: #1A1A2E;
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-left: 4px solid #10B981;
      border-radius: 12px;
      padding: 28px 28px;
      width: 100%;
      max-width: 920px;
      text-align: left;
      margin-bottom: 36px;
    }
    .action-label {
      font-size: 22px;
      color: #10B981;
      letter-spacing: 2px;
      margin-bottom: 14px;
      font-weight: 700;
    }
    .action-text {
      font-size: 30px;
      color: #FFFFFF;
      line-height: 1.6;
      font-weight: 600;
    }
    .action-text .quote-mark {
      color: #F59E0B;
    }
    .next-ep {
      font-size: 28px;
      color: #8B5CF6;
      font-weight: 600;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="title"><span class="accent">总结</span></div>

    <div class="summary-list">
      <div class="summary-item">
        <div class="summary-num purple">1</div>
        <div class="summary-text">AI 最大的问题：缺少<strong>"先想后做"</strong>的纪律</div>
      </div>
      <div class="summary-item">
        <div class="summary-num green">2</div>
        <div class="summary-text"><strong>15 份 Markdown</strong> 文档解决纪律问题</div>
      </div>
      <div class="summary-item">
        <div class="summary-num yellow">3</div>
        <div class="summary-text">4 个月拿下 <span class="stat">6.7万</span> GitHub Stars</div>
      </div>
    </div>

    <div class="action-card">
      <div class="action-label">今天就能用的一句话</div>
      <div class="action-text"><span class="quote-mark">&ldquo;</span>别急，先告诉我你打算怎么做，<br>给我 2-3 个方案和各自的取舍。<span class="quote-mark">&rdquo;</span></div>
    </div>

    <div class="next-ep">下期：它最狠的一招是什么？</div>
  </div>
</body>
</html>
