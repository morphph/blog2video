<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 100px 72px 400px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }

    /* Background glow effects */
    .slide::before {
      content: '';
      position: absolute;
      top: 35%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 700px;
      height: 700px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.1) 0%, rgba(139, 92, 246, 0.03) 40%, transparent 70%);
      pointer-events: none;
    }

    .slide::after {
      content: '';
      position: absolute;
      top: 55%;
      left: 30%;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(239, 68, 68, 0.05) 0%, transparent 60%);
      pointer-events: none;
    }

    .series-tag {
      font-size: 30px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 500;
      margin-bottom: 52px;
      position: relative;
      z-index: 1;
    }

    .main-title {
      font-size: 92px;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 56px;
      max-width: 920px;
      position: relative;
      z-index: 1;
    }

    .highlight-red {
      color: #EF4444;
    }

    .highlight-yellow {
      color: #F59E0B;
    }

    .source-tag {
      background: #1A1A30;
      border-radius: 24px;
      padding: 14px 36px;
      font-size: 22px;
      color: #6B6B80;
      position: relative;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="series-tag">精读AI · Superpowers</div>

    <div class="main-title">
      AI说<span class="highlight-red">"测试通过了"</span><br>你<span class="highlight-yellow">敢信</span>？
    </div>

    <div class="source-tag">GitHub Project: Superpowers</div>
  </div>
</body>
</html>
