<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }

    .slide::before {
      content: '';
      position: absolute;
      top: 25%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.06) 0%, transparent 70%);
      pointer-events: none;
    }

    .section-title {
      font-size: 48px;
      font-weight: 800;
      color: #8B5CF6;
      margin-bottom: 16px;
    }

    .section-subtitle {
      font-size: 26px;
      color: #6B7280;
      margin-bottom: 40px;
      letter-spacing: 1px;
    }

    .excuse-list {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .excuse-item {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 22px 28px;
      display: flex;
      align-items: flex-start;
      gap: 20px;
      text-align: left;
    }

    .excuse-left {
      flex: 1;
      border-right: 1px solid rgba(139, 92, 246, 0.15);
      padding-right: 20px;
    }

    .excuse-label {
      font-size: 14px;
      color: #EF4444;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .excuse-text {
      font-size: 26px;
      color: #FFFFFF;
      line-height: 1.4;
      font-weight: 600;
    }

    .excuse-right {
      flex: 1;
      padding-left: 4px;
    }

    .rebuttal-label {
      font-size: 14px;
      color: #10B981;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 6px;
    }

    .rebuttal-text {
      font-size: 24px;
      color: #B0B0CC;
      line-height: 1.4;
    }

    .bottom-tag {
      margin-top: 36px;
      background: rgba(139, 92, 246, 0.12);
      border: 1px solid rgba(139, 92, 246, 0.25);
      border-radius: 24px;
      padding: 12px 32px;
      font-size: 24px;
      color: #8B5CF6;
      font-weight: 600;
    }

    .count-badge {
      display: inline-block;
      font-size: 56px;
      font-weight: 800;
      color: #EF4444;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="section-title">反借口工程</div>
    <div class="section-subtitle">Anti-Rationalization Engineering</div>

    <div class="excuse-list">
      <div class="excuse-item">
        <div class="excuse-left">
          <div class="excuse-label">借口</div>
          <div class="excuse-text">"这个功能太简单，不用写测试"</div>
        </div>
        <div class="excuse-right">
          <div class="rebuttal-label">反驳</div>
          <div class="rebuttal-text">简单功能受伤率最高</div>
        </div>
      </div>

      <div class="excuse-item">
        <div class="excuse-left">
          <div class="excuse-label">借口</div>
          <div class="excuse-text">"先写代码，回头再补测试"</div>
        </div>
        <div class="excuse-right">
          <div class="rebuttal-label">反驳</div>
          <div class="rebuttal-text">你从来没补过</div>
        </div>
      </div>

      <div class="excuse-item">
        <div class="excuse-left">
          <div class="excuse-label">借口</div>
          <div class="excuse-text">"删掉几小时的工作太浪费了"</div>
        </div>
        <div class="excuse-right">
          <div class="rebuttal-label">反驳</div>
          <div class="rebuttal-text">沉没成本谬误</div>
        </div>
      </div>
    </div>

    <div class="bottom-tag">TDD 技能共列出 <span style="color:#EF4444; font-weight:800;">11</span> 种逃避话术</div>
  </div>
</body>
</html>
