<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }

    .slide::before {
      content: '';
      position: absolute;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.06) 0%, transparent 70%);
      pointer-events: none;
    }

    .summary-title {
      font-size: 44px;
      font-weight: 800;
      color: #FFFFFF;
      margin-bottom: 40px;
    }

    .summary-title span {
      color: #8B5CF6;
    }

    .summary-list {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 36px;
    }

    .summary-item {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 22px 28px;
      display: flex;
      align-items: center;
      gap: 20px;
      text-align: left;
    }

    .summary-item:nth-child(1) {
      border-left: 4px solid #EF4444;
    }

    .summary-item:nth-child(2) {
      border-left: 4px solid #F59E0B;
    }

    .summary-item:nth-child(3) {
      border-left: 4px solid #3B82F6;
    }

    .summary-item:nth-child(4) {
      border-left: 4px solid #10B981;
    }

    .item-number {
      font-size: 40px;
      font-weight: 800;
      min-width: 52px;
      text-align: center;
    }

    .item-number.n1 { color: #EF4444; }
    .item-number.n2 { color: #F59E0B; }
    .item-number.n3 { color: #3B82F6; }
    .item-number.n4 { color: #10B981; }

    .item-content {
      flex: 1;
    }

    .item-title {
      font-size: 28px;
      font-weight: 700;
      color: #FFFFFF;
      margin-bottom: 4px;
      line-height: 1.3;
    }

    .item-detail {
      font-size: 22px;
      color: #B0B0CC;
      line-height: 1.4;
    }

    .next-card {
      background: rgba(139, 92, 246, 0.1);
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-radius: 12px;
      padding: 20px 32px;
      width: 100%;
      max-width: 900px;
    }

    .next-label {
      font-size: 18px;
      color: #8B5CF6;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .next-text {
      font-size: 26px;
      color: #FFFFFF;
      font-weight: 600;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="summary-title">管住 AI 靠<span>三件事</span></div>

    <div class="summary-list">
      <div class="summary-item">
        <div class="item-number n1">1</div>
        <div class="item-content">
          <div class="item-title">预判逃避模式</div>
          <div class="item-detail">把借口表提前列好，逐条堵死</div>
        </div>
      </div>

      <div class="summary-item">
        <div class="item-number n2">2</div>
        <div class="item-content">
          <div class="item-title">心理学提高合规率</div>
          <div class="item-detail">33% &rarr; 72%，翻倍</div>
        </div>
      </div>

      <div class="summary-item">
        <div class="item-number n3">3</div>
        <div class="item-content">
          <div class="item-title">双重审查堵漏洞</div>
          <div class="item-detail">先查对不对，再查好不好</div>
        </div>
      </div>

      <div class="summary-item">
        <div class="item-number n4">+</div>
        <div class="item-content">
          <div class="item-title">子 Agent 满血上场</div>
          <div class="item-detail">每个执行者都是全新状态</div>
        </div>
      </div>
    </div>

    <div class="next-card">
      <div class="next-label">下期预告</div>
      <div class="next-text">背后押注的反直觉理念是什么？</div>
    </div>
  </div>
</body>
</html>
