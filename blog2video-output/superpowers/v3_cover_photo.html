<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 100px 72px 400px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    /* radial glow behind title */
    .slide::before {
      content: '';
      position: absolute;
      top: 38%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 700px;
      height: 700px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.1) 0%, rgba(239, 68, 68, 0.04) 40%, transparent 70%);
      pointer-events: none;
    }
    .series-tag {
      font-size: 30px;
      color: #8B5CF6;
      letter-spacing: 3px;
      margin-bottom: 56px;
      font-weight: 500;
    }
    .main-title {
      font-size: 92px;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 48px;
    }
    .main-title .highlight-red {
      color: #EF4444;
    }
    .main-title .highlight-yellow {
      color: #F59E0B;
    }
    .source-tag {
      display: inline-block;
      background: #1A1A30;
      color: #6B6B80;
      font-size: 22px;
      padding: 12px 28px;
      border-radius: 999px;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="series-tag">精读AI &middot; AI纪律哲学</div>
    <div class="main-title">
      别人让AI<span class="highlight-yellow">更快</span><br>
      他偏要让AI<span class="highlight-red">更慢</span><br>
      凭啥赢了？
    </div>
    <div class="source-tag">GitHub &middot; Superpowers</div>
  </div>
</body>
</html>
