<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .series-tag {
      font-size: 28px;
      color: #8B5CF6;
      letter-spacing: 3px;
      margin-bottom: 48px;
      font-weight: 500;
    }
    .main-title {
      font-size: 72px;
      font-weight: 900;
      line-height: 1.25;
      margin-bottom: 56px;
    }
    .main-title .highlight-red {
      color: #EF4444;
    }
    .main-title .highlight-yellow {
      color: #F59E0B;
    }
    .hook-card {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-left: 4px solid #8B5CF6;
      border-radius: 12px;
      padding: 28px 32px;
      width: 100%;
      margin-bottom: 28px;
    }
    .hook-card p {
      font-size: 30px;
      line-height: 1.6;
      color: #B0B0CC;
    }
    .hook-card .accent {
      color: #F59E0B;
      font-weight: 700;
    }
    .stats-row {
      display: flex;
      gap: 24px;
      width: 100%;
      margin-bottom: 32px;
    }
    .stat-card {
      flex: 1;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 24px 16px;
      text-align: center;
    }
    .stat-number {
      font-size: 60px;
      font-weight: 800;
      color: #10B981;
      line-height: 1.1;
    }
    .stat-label {
      font-size: 22px;
      color: #6B7280;
      margin-top: 8px;
    }
    .episode-tag {
      font-size: 22px;
      color: #6B7280;
      margin-top: 16px;
      letter-spacing: 1px;
    }
    /* subtle glow behind title area */
    .slide::before {
      content: '';
      position: absolute;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.08) 0%, transparent 70%);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="series-tag">精读AI · Superpowers</div>
    <div class="main-title">
      所有AI在卷<span class="highlight-yellow">更快</span><br>
      它偏要<span class="highlight-red">加摩擦</span>
    </div>
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-number">6.7万</div>
        <div class="stat-label">GitHub Stars</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" style="color: #EF4444;">反着来</div>
        <div class="stat-label">故意给AI加限制</div>
      </div>
    </div>
    <div class="hook-card">
      <p>加摩擦、加限制、加规矩<br>
      <span class="accent">凭什么能赢？</span></p>
    </div>
    <div class="episode-tag">第三期 · 完结篇</div>
  </div>
</body>
</html>
