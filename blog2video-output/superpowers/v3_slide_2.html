<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .section-label {
      font-size: 22px;
      color: #8B5CF6;
      letter-spacing: 3px;
      margin-bottom: 24px;
      font-weight: 500;
    }
    .title {
      font-size: 52px;
      font-weight: 800;
      margin-bottom: 48px;
      line-height: 1.3;
    }
    .title .en {
      color: #F59E0B;
    }
    .analogy-card {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-left: 4px solid #3B82F6;
      border-radius: 12px;
      padding: 28px 32px;
      width: 100%;
      margin-bottom: 32px;
      text-align: left;
    }
    .analogy-icon {
      font-size: 36px;
      margin-bottom: 12px;
    }
    .analogy-text {
      font-size: 28px;
      line-height: 1.6;
      color: #B0B0CC;
    }
    .analogy-text .bold {
      color: #FFFFFF;
      font-weight: 700;
    }
    .core-card {
      background: linear-gradient(135deg, #1A1A2E 0%, #1E1538 100%);
      border: 1px solid rgba(139, 92, 246, 0.35);
      border-left: 4px solid #8B5CF6;
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      margin-bottom: 32px;
      text-align: center;
    }
    .core-label {
      font-size: 20px;
      color: #6B7280;
      letter-spacing: 2px;
      margin-bottom: 16px;
    }
    .core-quote {
      font-size: 32px;
      font-weight: 700;
      color: #8B5CF6;
      line-height: 1.4;
      font-style: italic;
    }
    .logic-card {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-left: 4px solid #10B981;
      border-radius: 12px;
      padding: 24px 32px;
      width: 100%;
      text-align: left;
    }
    .logic-text {
      font-size: 27px;
      line-height: 1.6;
      color: #B0B0CC;
    }
    .logic-text .green {
      color: #10B981;
      font-weight: 700;
    }
    .logic-text .red {
      color: #EF4444;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="section-label">核心哲学</div>
    <div class="title">
      <span class="en">Radical Discipline</span><br>
      纪律优于便利
    </div>
    <div class="analogy-card">
      <div class="analogy-text">
        飞行员飞了一万次，起飞前<span class="bold">仍必须逐项打钩</span><br>
        不是因为不会飞，是因为<span class="bold">出事代价太高</span>
      </div>
    </div>
    <div class="core-card">
      <div class="core-label">SUPERPOWERS 核心逻辑</div>
      <div class="core-quote">"AI跑得越快<br>犯错的代价越高"</div>
    </div>
    <div class="logic-card">
      <div class="logic-text">
        <span class="red">3秒写完模块</span> &rarr; 跳过设计、测试、验证<br>
        &rarr; <span class="red">3小时返工</span><br><br>
        <span class="green">多花30秒确认方向</span> &rarr; <span class="green">真正的效率</span>
      </div>
    </div>
  </div>
</body>
</html>
