<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .section-label {
      font-size: 22px;
      color: #8B5CF6;
      letter-spacing: 3px;
      margin-bottom: 20px;
      font-weight: 500;
    }
    .title {
      font-size: 44px;
      font-weight: 800;
      margin-bottom: 36px;
      line-height: 1.3;
    }
    .pillar-grid {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
    }
    .pillar-card {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 22px 28px;
      text-align: left;
      display: flex;
      align-items: flex-start;
      gap: 20px;
    }
    .pillar-card.purple { border-left: 4px solid #8B5CF6; }
    .pillar-card.blue { border-left: 4px solid #3B82F6; }
    .pillar-card.green { border-left: 4px solid #10B981; }
    .pillar-card.yellow { border-left: 4px solid #F59E0B; }
    .pillar-num {
      font-size: 36px;
      font-weight: 800;
      min-width: 44px;
      line-height: 1;
      padding-top: 4px;
    }
    .pillar-card.purple .pillar-num { color: #8B5CF6; }
    .pillar-card.blue .pillar-num { color: #3B82F6; }
    .pillar-card.green .pillar-num { color: #10B981; }
    .pillar-card.yellow .pillar-num { color: #F59E0B; }
    .pillar-content {
      flex: 1;
    }
    .pillar-title {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 6px;
      line-height: 1.3;
    }
    .pillar-desc {
      font-size: 22px;
      color: #B0B0CC;
      line-height: 1.5;
    }
    .pillar-desc .red { color: #EF4444; font-weight: 600; }
    .pillar-desc .green { color: #10B981; font-weight: 600; }
    .pillar-desc .accent { color: #F59E0B; font-weight: 600; }
    .data-row {
      display: flex;
      gap: 16px;
      width: 100%;
      margin-top: 24px;
    }
    .data-card {
      flex: 1;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 18px 12px;
      text-align: center;
    }
    .data-num {
      font-size: 56px;
      font-weight: 800;
      line-height: 1.1;
    }
    .data-num.good { color: #10B981; }
    .data-num.bad { color: #EF4444; }
    .data-label {
      font-size: 19px;
      color: #6B7280;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="section-label">设计哲学</div>
    <div class="title">四大支柱</div>
    <div class="pillar-grid">
      <div class="pillar-card purple">
        <div class="pillar-num">01</div>
        <div class="pillar-content">
          <div class="pillar-title">纪律优于便利</div>
          <div class="pillar-desc">Iron Law: <span class="red">先写代码再补测试？删掉重来</span></div>
        </div>
      </div>
      <div class="pillar-card blue">
        <div class="pillar-num">02</div>
        <div class="pillar-content">
          <div class="pillar-title">系统化优于随机试错</div>
          <div class="pillar-desc">查根因 &rarr; 找规律 &rarr; 验假设 &rarr; 再动手</div>
        </div>
      </div>
      <div class="pillar-card green">
        <div class="pillar-num">03</div>
        <div class="pillar-content">
          <div class="pillar-title">证据优于声明</div>
          <div class="pillar-desc">AI说"改好了"<span class="red">不算数</span>，必须拿出验证证据</div>
        </div>
      </div>
      <div class="pillar-card yellow">
        <div class="pillar-num">04</div>
        <div class="pillar-content">
          <div class="pillar-title">把AI当准人类来管理</div>
          <div class="pillar-desc">不是"编程"AI，是<span class="accent">"管理"AI</span></div>
        </div>
      </div>
    </div>
    <div class="data-row">
      <div class="data-card">
        <div class="data-num good">95%</div>
        <div class="data-label">系统化一次修复率</div>
      </div>
      <div class="data-card">
        <div class="data-num bad">40%</div>
        <div class="data-label">随机试错修复率</div>
      </div>
    </div>
  </div>
</body>
</html>
