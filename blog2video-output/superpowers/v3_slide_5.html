<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    /* subtle glow */
    .slide::before {
      content: '';
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.06) 0%, transparent 70%);
      pointer-events: none;
    }
    .section-label {
      font-size: 22px;
      color: #8B5CF6;
      letter-spacing: 3px;
      margin-bottom: 24px;
      font-weight: 500;
    }
    .title {
      font-size: 48px;
      font-weight: 800;
      margin-bottom: 44px;
      line-height: 1.3;
    }
    .title .yellow { color: #F59E0B; }
    .quote-card {
      background: linear-gradient(135deg, #1A1A2E 0%, #1E1538 100%);
      border: 1px solid rgba(139, 92, 246, 0.35);
      border-left: 4px solid #8B5CF6;
      border-radius: 12px;
      padding: 36px 32px;
      width: 100%;
      margin-bottom: 36px;
      text-align: center;
    }
    .quote-mark {
      font-size: 48px;
      color: #8B5CF6;
      opacity: 0.5;
      line-height: 1;
      margin-bottom: 8px;
    }
    .quote-text {
      font-size: 32px;
      font-weight: 700;
      line-height: 1.5;
      color: #FFFFFF;
    }
    .quote-text .purple { color: #8B5CF6; }
    .action-card {
      background: #1A1A2E;
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-left: 4px solid #10B981;
      border-radius: 12px;
      padding: 28px 32px;
      width: 100%;
      text-align: left;
    }
    .action-label {
      font-size: 20px;
      color: #10B981;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }
    .action-text {
      font-size: 26px;
      color: #B0B0CC;
      line-height: 1.6;
    }
    .action-text .bold {
      color: #FFFFFF;
      font-weight: 700;
    }
    .series-end {
      margin-top: 32px;
      font-size: 22px;
      color: #6B7280;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="section-label">总结</div>
    <div class="title">AI越强大<br><span class="yellow">纪律越重要</span></div>
    <div class="quote-card">
      <div class="quote-mark">"</div>
      <div class="quote-text">
        管理AI的方式<br>
        可能比<span class="purple">AI本身</span>更重要
      </div>
    </div>
    <div class="action-card">
      <div class="action-label">ACTION ITEM</div>
      <div class="action-text">
        给AI助手设一条硬规则：<br>
        <span class="bold">任何任务开始前</span>，必须先输出方案和检查清单，<span class="bold">确认后才能动手</span>
      </div>
    </div>
    <div class="series-end">Superpowers 精读 &middot; 完</div>
  </div>
</body>
</html>
