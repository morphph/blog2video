<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
/*@@BASE@@*/
/* —— scene-08 CTA 尾卡特有 —— */
[data-composition-id='s08'] .cta-wrap{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
[data-composition-id='s08'] .logo{
  font-family:'MiSans',sans-serif;font-weight:900;font-size:120px;
  color:#ccff4d;letter-spacing:-.02em;line-height:1;
}
[data-composition-id='s08'] .sub-line{
  margin-top:32px;
  font-family:'JetBrains Mono',monospace;font-size:32px;font-weight:400;
  color:rgba(237,235,230,.6);letter-spacing:.06em;
}
[data-composition-id='s08'] .cur-wrap{
  margin-top:28px;
}
</style>
</head>
<body>
  <div id="root" class="stage" data-composition-id="s08" data-start="0" data-duration="5" data-width="1080" data-height="1920">
    <div class="grid"></div>

    <div class="cta-wrap">
      <div class="logo">精读AI</div>
      <div class="sub-line">AI产品 · 完</div>
      <div class="cur-wrap"><span class="cur cblink"></span></div>
    </div>
  </div>

  <script>
  /*@@MOTION@@*/
  </script>
  <script>
  (function(){
    var R="[data-composition-id='s08'] ";
    var tl = gsap.timeline({ paused: true });
    tl.from(R+'.grid',    { opacity:0, duration:0.5, ease:'power1.out' }, 0.02);
    tl.from(R+'.logo',    { opacity:0, y:20, duration:0.5, ease:'expo.out' }, 0.3);
    tl.from(R+'.sub-line',{ opacity:0, y:14, duration:0.38, ease:'power3.out' }, 0.7);
    tl.from(R+'.cur-wrap',{ opacity:0, duration:0.25, ease:'power1.out' }, 1.0);
    D2.blink(tl, R+'.cblink', 1.2, 5);
    window.__timelines = window.__timelines || {};
    window.__timelines['s08'] = tl;
  })();
  </script>
</body>
</html>
