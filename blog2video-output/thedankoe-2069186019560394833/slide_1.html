<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px; background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%; padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      text-align: center; position: relative;
    }
    .glow { position: absolute; top: 280px; left: 50%; transform: translateX(-50%);
      width: 800px; height: 800px; border-radius: 50%;
      background: radial-gradient(circle, rgba(139,92,246,0.22) 0%, rgba(13,13,26,0) 70%); }
    .kicker { font-size: 30px; color: #B0B0CC; letter-spacing: 2px; margin-bottom: 36px; z-index: 1; }
    .kicker .hit { color: #F59E0B; font-weight: 800; }
    .title { font-size: 92px; font-weight: 800; line-height: 1.18; z-index: 1; }
    .title .danger { color: #EF4444; }
    .title .good { color: #10B981; }
    .cards { display: flex; gap: 24px; margin-top: 72px; width: 100%; z-index: 1; }
    .card { flex: 1; background: #1A1A2E; border: 1px solid rgba(139,92,246,0.2);
      border-left: 4px solid #8B5CF6; border-radius: 12px; padding: 28px 24px; text-align: left; }
    .card .lab { font-size: 28px; color: #6B7280; margin-bottom: 12px; }
    .card .txt { font-size: 38px; font-weight: 700; line-height: 1.3; color: #FFFFFF; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="glow"></div>
    <div class="kicker">一封信，几小时冲到 <span class="hit">将近两百万阅读</span></div>
    <div class="title">真正威胁你的<br><span class="danger">从来不是 AI</span></div>
    <div class="cards">
      <div class="card">
        <div class="lab">作者</div>
        <div class="txt">Dan Koe<br>写给打工人的公开信</div>
      </div>
      <div class="card">
        <div class="lab">那威胁是什么</div>
        <div class="txt">你把整个生存<br>押在了别人身上</div>
      </div>
    </div>
  </div>
</body>
</html>
