<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px; background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%; padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      text-align: center; position: relative;
    }
    .src { font-size: 30px; color: #6B7280; margin-bottom: 16px; }
    .title { font-size: 56px; font-weight: 800; line-height: 1.3; margin-bottom: 48px; }
    .title .key { color: #F59E0B; }
    .stats { display: flex; gap: 24px; width: 100%; margin-bottom: 40px; }
    .stat { flex: 1; background: #1A1A2E; border: 1px solid rgba(139,92,246,0.2);
      border-radius: 12px; padding: 36px 24px; }
    .stat.up { border-left: 4px solid #3B82F6; }
    .stat.down { border-left: 4px solid #EF4444; }
    .stat .num { font-size: 96px; font-weight: 800; line-height: 1; }
    .stat.up .num { color: #3B82F6; }
    .stat.down .num { color: #EF4444; }
    .stat .lab { font-size: 30px; color: #B0B0CC; margin-top: 18px; line-height: 1.35; }
    .concl { background: #1A1A2E; border-left: 4px solid #F59E0B; border-radius: 12px;
      padding: 32px; width: 100%; text-align: left; font-size: 40px; font-weight: 700; line-height: 1.4; }
    .concl .key { color: #F59E0B; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="src">《金融时报》图表 · 以 2024 年均值 = 100</div>
    <div class="title">App 发布潮，<span class="key">却毫无起色</span></div>
    <div class="stats">
      <div class="stat up"><div class="num">180+</div><div class="lab">App 发布量<br>一路飙升</div></div>
      <div class="stat down"><div class="num">&lt;80</div><div class="lab">真正被人用、被评价<br>一路跌破</div></div>
    </div>
    <div class="concl">"做得出来" 和 "被人用"<br>已经<span class="key">彻底脱钩</span>了</div>
  </div>
</body>
</html>
