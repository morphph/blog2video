<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px; background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%; padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      text-align: center; position: relative;
    }
    .src { font-size: 30px; color: #6B7280; margin-bottom: 14px; }
    .title { font-size: 60px; font-weight: 800; line-height: 1.25; margin-bottom: 48px; }
    .title .key { color: #F59E0B; }
    .stats { display: flex; gap: 24px; width: 100%; margin-bottom: 40px; }
    .stat { flex: 1; background: #1A1A2E; border: 1px solid rgba(139,92,246,0.2);
      border-radius: 12px; padding: 36px 24px; }
    .stat.up { border-left: 4px solid #3B82F6; }
    .stat.down { border-left: 4px solid #EF4444; }
    .stat .num { font-size: 88px; font-weight: 800; line-height: 1; }
    .stat.up .num { color: #3B82F6; }
    .stat.down .num { color: #EF4444; }
    .stat .lab { font-size: 32px; color: #B0B0CC; margin-top: 18px; }
    .concl { background: #1A1A2E; border-left: 4px solid #F59E0B; border-radius: 12px;
      padding: 32px; width: 100%; text-align: left; font-size: 42px; font-weight: 700; line-height: 1.4; }
    .concl .key { color: #F59E0B; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="src">游戏圈大佬 Strauss Zelnick</div>
    <div class="title">一年上千款手游<br><span class="key">几款爆款？</span></div>
    <div class="stats">
      <div class="stat up"><div class="num">上千款</div><div class="lab">一年上市</div></div>
      <div class="stat down"><div class="num">0–5</div><div class="lab">真正爆款</div></div>
    </div>
    <div class="concl">技术早是白菜价，谁都能做<br>做得出来，<span class="key">根本不等于做得成</span></div>
  </div>
</body>
</html>
