<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px; background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%; padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      text-align: center; position: relative;
    }
    .kicker { font-size: 32px; color: #6B7280; margin-bottom: 24px; }
    .title { font-size: 64px; font-weight: 800; line-height: 1.25; margin-bottom: 48px; }
    .title .key { color: #EF4444; }
    .shift { background: #1A1A2E; border: 1px solid rgba(139,92,246,0.2);
      border-left: 4px solid #8B5CF6; border-radius: 12px; padding: 34px; width: 100%;
      margin-bottom: 28px; text-align: left; font-size: 40px; font-weight: 700; line-height: 1.45; }
    .shift .from { color: #6B7280; text-decoration: line-through; }
    .shift .to { color: #8B5CF6; }
    .only { background: #1A1A2E; border-left: 4px solid #10B981; border-radius: 12px;
      padding: 30px; width: 100%; text-align: left; font-size: 38px; line-height: 1.45; color: #B0B0CC; }
    .only .key { color: #10B981; font-weight: 700; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="kicker">反常识的点</div>
    <div class="title">创业门槛降低<br><span class="key">对你不是好消息</span></div>
    <div class="shift">竞争从 <span class="from">"你能不能造"</span><br>挪到 <span class="to">"你有没有品味、能不能让人在乎"</span></div>
    <div class="only">能动性、品味、说服力，不是刷教程能上手的<br>练它们的<span class="key">唯一办法，是开始做你自己的东西</span></div>
  </div>
</body>
</html>
