<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px; background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%; padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      text-align: center; position: relative;
    }
    .pillar { font-size: 30px; color: #6B7280; letter-spacing: 2px; margin-bottom: 20px; }
    .big { font-size: 150px; font-weight: 800; color: #10B981; line-height: 1; margin-bottom: 12px; }
    .sub { font-size: 38px; color: #B0B0CC; margin-bottom: 48px; }
    .story { background: #1A1A2E; border: 1px solid rgba(139,92,246,0.2);
      border-left: 4px solid #10B981; border-radius: 12px; padding: 34px; width: 100%;
      margin-bottom: 26px; text-align: left; font-size: 38px; line-height: 1.45; }
    .story .key { color: #10B981; font-weight: 700; }
    .punch { background: #1A1A2E; border-left: 4px solid #F59E0B; border-radius: 12px;
      padding: 30px; width: 100%; text-align: left; font-size: 42px; font-weight: 700; line-height: 1.4; }
    .punch .key { color: #F59E0B; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="pillar">第三根支柱 · 一个故事</div>
    <div class="big">$300</div>
    <div class="sub">第一个网页客户：本地床垫公司 · 手写的烂网站</div>
    <div class="story">那一刻有个东西<span class="key">"咔哒"接通了</span>——<br>只要把这件事重复、改进、迭代，我就能拿回掌控权</div>
    <div class="punch">那一刻，我变得<span class="key">"不可雇佣"</span>了</div>
  </div>
</body>
</html>
