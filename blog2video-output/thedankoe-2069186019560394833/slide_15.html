<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px; background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%; padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      text-align: center; position: relative;
    }
    .step { font-size: 30px; color: #6B7280; letter-spacing: 2px; margin-bottom: 18px; }
    .title { font-size: 66px; font-weight: 800; line-height: 1.2; margin-bottom: 48px; }
    .title .key { color: #8B5CF6; }
    .why { background: #1A1A2E; border: 1px solid rgba(139,92,246,0.2);
      border-left: 4px solid #8B5CF6; border-radius: 12px; padding: 32px; width: 100%;
      margin-bottom: 26px; text-align: left; font-size: 38px; line-height: 1.45; }
    .why .key { color: #8B5CF6; font-weight: 700; }
    .action { background: #1A1A2E; border-left: 4px solid #F59E0B; border-radius: 12px;
      padding: 30px; width: 100%; text-align: left; font-size: 42px; font-weight: 700; line-height: 1.4; }
    .action .key { color: #F59E0B; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="step">第一步</div>
    <div class="title">把自己扔进<br>一个<span class="key">逼你成长的环境</span></div>
    <div class="why">$300 这个数字，说明不了全部——<br>它背后是一次<span class="key">身份的转变</span>，先骗自己相信"这件事是可能的"</div>
    <div class="action">物理环境、数字环境<br><span class="key">一夜之间，全换掉</span></div>
  </div>
</body>
</html>
