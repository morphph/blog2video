<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px; background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%; padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      text-align: center; position: relative;
    }
    .kicker { font-size: 32px; color: #6B7280; margin-bottom: 36px; }
    .quotemark { font-size: 180px; color: #8B5CF6; line-height: 0.6; font-family: Georgia, serif;
      opacity: 0.4; margin-bottom: 10px; }
    .quote { font-size: 76px; font-weight: 800; line-height: 1.3; }
    .quote .key { color: #8B5CF6; }
    .ex { margin-top: 52px; background: #1A1A2E; border-left: 4px solid #EF4444;
      border-radius: 12px; padding: 32px; width: 100%; text-align: left;
      font-size: 38px; line-height: 1.45; color: #B0B0CC; }
    .ex .key { color: #EF4444; font-weight: 700; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="kicker">为什么是换环境，而不是更努力？</div>
    <div class="quotemark">"</div>
    <div class="quote"><span class="key">行为改变</span><br>等于<span class="key">身份改变</span></div>
    <div class="ex">减掉三十斤，但没变成"重视健康的人"<br>→ 你会像大多数人一样，<span class="key">全部反弹回来</span></div>
  </div>
</body>
</html>
