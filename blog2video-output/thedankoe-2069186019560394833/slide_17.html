<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px; background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%; padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      text-align: center; position: relative;
    }
    .title { font-size: 64px; font-weight: 800; line-height: 1.2; margin-bottom: 20px; }
    .title .key { color: #F59E0B; }
    .sub { font-size: 34px; color: #B0B0CC; margin-bottom: 44px; }
    .list { width: 100%; display: flex; flex-direction: column; gap: 18px; }
    .item { background: #1A1A2E; border: 1px solid rgba(139,92,246,0.2);
      border-left: 4px solid #F59E0B; border-radius: 12px; padding: 24px 28px;
      display: flex; align-items: center; gap: 22px; text-align: left; }
    .item .ic { font-size: 36px; color: #F59E0B; font-weight: 800; }
    .item .t { font-size: 40px; font-weight: 700; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="title">一夜之间<br><span class="key">把开关全部翻过来</span></div>
    <div class="sub">明天醒来，至少这一天，什么都跟以前不一样</div>
    <div class="list">
      <div class="item"><span class="ic">✓</span><span class="t">换个时间定闹钟</span></div>
      <div class="item"><span class="ic">✓</span><span class="t">提前想好醒来要做什么</span></div>
      <div class="item"><span class="ic">✓</span><span class="t">吃不一样的东西</span></div>
      <div class="item"><span class="ic">✓</span><span class="t">和不一样的人说话</span></div>
      <div class="item"><span class="ic">✓</span><span class="t">看不一样的内容 · 全部</span></div>
    </div>
  </div>
</body>
</html>
