<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px; background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%; padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      text-align: center; position: relative;
    }
    .step { font-size: 30px; color: #6B7280; letter-spacing: 2px; margin-bottom: 18px; }
    .title { font-size: 60px; font-weight: 800; line-height: 1.25; margin-bottom: 46px; }
    .title .key { color: #3B82F6; }
    .danger { background: #1A1A2E; border: 1px solid rgba(139,92,246,0.2);
      border-left: 4px solid #EF4444; border-radius: 12px; padding: 32px; width: 100%;
      margin-bottom: 26px; text-align: left; font-size: 38px; line-height: 1.45; }
    .danger .key { color: #EF4444; font-weight: 700; }
    .rocket { background: #1A1A2E; border-left: 4px solid #3B82F6; border-radius: 12px;
      padding: 32px; width: 100%; text-align: left; font-size: 40px; font-weight: 700; line-height: 1.45; }
    .rocket .key { color: #3B82F6; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="step">第二步</div>
    <div class="title">选一个载体<br>让<span class="key">反馈贴近现实</span></div>
    <div class="danger">最危险的生活方式，是<span class="key">脱离持续的试错</span><br>——也就脱离了挑战、发现，和成长的智慧</div>
    <div class="rocket">第一枚火箭怎么造的？<br>他们<span class="key">试，失败，据现实反馈重新定方向</span></div>
  </div>
</body>
</html>
