<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px; background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%; padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      text-align: center; position: relative;
    }
    .title { font-size: 60px; font-weight: 800; line-height: 1.25; margin-bottom: 44px; }
    .title .key { color: #F59E0B; }
    .diagram { position: relative; width: 100%; height: 360px; background: #1A1A2E;
      border: 1px solid rgba(139,92,246,0.2); border-radius: 12px; margin-bottom: 30px; overflow: hidden; }
    .boat { position: absolute; left: 60px; bottom: 50px; font-size: 32px; color: #B0B0CC; font-weight: 700; }
    .light { position: absolute; right: 60px; top: 50px; font-size: 32px; color: #F59E0B; font-weight: 800; }
    .ideal { position: absolute; left: 110px; bottom: 90px; width: 760px; height: 3px;
      background: repeating-linear-gradient(90deg,#6B7280 0,#6B7280 14px,transparent 14px,transparent 26px);
      transform: rotate(-19deg); transform-origin: left; }
    .zig { position: absolute; left: 110px; bottom: 88px; width: 760px; height: 220px; }
    .quad { background: #1A1A2E; border-left: 4px solid #10B981; border-radius: 12px;
      padding: 30px; width: 100%; text-align: left; font-size: 38px; line-height: 1.45; }
    .quad .key { color: #10B981; font-weight: 700; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="title">智能的标志：<br><span class="key">据反馈纠偏</span></div>
    <div class="diagram">
      <div class="boat">⛵ boat</div>
      <div class="light">🗼 lighthouse</div>
      <div class="ideal"></div>
      <svg class="zig" viewBox="0 0 760 220" preserveAspectRatio="none">
        <polyline points="0,200 120,90 240,150 360,60 480,110 600,40 720,20"
          fill="none" stroke="#10B981" stroke-width="6" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="quad">船被吹偏，往左修、往右修，眼睛始终盯着灯塔<br>对成功者，<span class="key">失败是好生活里一个必需的常量</span></div>
  </div>
</body>
</html>
