<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px; background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%; padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      text-align: center; position: relative;
    }
    .title { font-size: 72px; font-weight: 800; line-height: 1.2; margin-bottom: 64px; }
    .title .hit { color: #EF4444; }
    .row { display: flex; align-items: center; gap: 28px; width: 100%; margin-bottom: 36px; }
    .box { flex: 1; background: #1A1A2E; border: 1px solid rgba(139,92,246,0.2);
      border-radius: 12px; padding: 28px; text-align: left; }
    .box.bad { border-left: 4px solid #EF4444; }
    .box.real { border-left: 4px solid #3B82F6; }
    .box .lab { font-size: 28px; color: #6B7280; margin-bottom: 10px; }
    .box .txt { font-size: 40px; font-weight: 700; line-height: 1.3; }
    .arrow { font-size: 56px; color: #6B7280; font-weight: 800; }
    .punch { margin-top: 28px; background: #1A1A2E; border-left: 4px solid #F59E0B;
      border-radius: 12px; padding: 32px; width: 100%; font-size: 42px; font-weight: 700; line-height: 1.4; }
    .punch .key { color: #F59E0B; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="title">骂 <span class="hit">AI</span>，是拦不住的</div>
    <div class="row">
      <div class="box bad"><div class="lab">"反 AI" 当成新身份</div><div class="txt">天天发帖骂它，很爽</div></div>
      <div class="arrow">→</div>
      <div class="box real"><div class="lab">但现实</div><div class="txt">行为没变，技能没扩展</div></div>
    </div>
    <div class="punch">骂它，拦不住工作被替代<br>更拦不住<span class="key">成功需要的技能</span>在悄悄改变</div>
  </div>
</body>
</html>
