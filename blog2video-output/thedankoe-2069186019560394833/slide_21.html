<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px; background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%; padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      text-align: center; position: relative;
    }
    .title { font-size: 60px; font-weight: 800; line-height: 1.2; margin-bottom: 44px; }
    .title .key { color: #10B981; }
    .two { display: flex; gap: 24px; width: 100%; margin-bottom: 30px; }
    .card { flex: 1; background: #1A1A2E; border: 1px solid rgba(139,92,246,0.2);
      border-radius: 12px; padding: 30px 24px; text-align: left; }
    .card.media { border-left: 4px solid #10B981; }
    .card.code { border-left: 4px solid #3B82F6; }
    .card .h { font-size: 40px; font-weight: 800; margin-bottom: 18px; }
    .card.media .h { color: #10B981; }
    .card.code .h { color: #3B82F6; }
    .card .line { font-size: 32px; color: #B0B0CC; line-height: 1.4; margin-bottom: 10px; }
    .answer { background: #1A1A2E; border-left: 4px solid #F59E0B; border-radius: 12px;
      padding: 30px; width: 100%; text-align: left; font-size: 36px; line-height: 1.45; }
    .answer .key { color: #F59E0B; font-weight: 700; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="title">为什么<span class="key">媒体 > 代码</span>？</div>
    <div class="two">
      <div class="card media">
        <div class="h">媒体</div>
        <div class="line">价值是<b>主观</b>的</div>
        <div class="line">每个读者解读都不一样</div>
        <div class="line">没有唯一正确的写法</div>
        <div class="line" style="color:#10B981;font-weight:700">→ 只有你能写</div>
      </div>
      <div class="card code">
        <div class="h">代码</div>
        <div class="line">价值是<b>客观</b>的</div>
        <div class="line">能跑出结果就行</div>
        <div class="line">很容易被商品化</div>
        <div class="line" style="color:#EF4444;font-weight:700">→ 谁都能复制</div>
      </div>
    </div>
    <div class="answer">App 越来越多，使用却在降——<br>因为它们<span class="key">没有分发能力，不懂媒体</span></div>
  </div>
</body>
</html>
