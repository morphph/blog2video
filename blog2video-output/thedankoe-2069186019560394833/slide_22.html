<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px; background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%; padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      text-align: center; position: relative;
    }
    .kicker { font-size: 32px; color: #6B7280; margin-bottom: 36px; }
    .quotemark { font-size: 180px; color: #F59E0B; line-height: 0.6; font-family: Georgia, serif;
      opacity: 0.4; margin-bottom: 10px; }
    .quote { font-size: 88px; font-weight: 800; line-height: 1.25; }
    .quote .key { color: #F59E0B; }
    .warn { margin-top: 52px; background: #1A1A2E; border-left: 4px solid #EF4444;
      border-radius: 12px; padding: 32px; width: 100%; text-align: left;
      font-size: 38px; line-height: 1.45; color: #B0B0CC; }
    .warn .key { color: #EF4444; font-weight: 700; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="kicker">一句提醒</div>
    <div class="quotemark">"</div>
    <div class="quote"><span class="key">点赞</span><br>不是<span class="key">现金</span></div>
    <div class="warn">我说的内容，绝不是"交给 AI 一夜涨粉十万"那种<br>真正的内容，是用<span class="key">叙事和权威建立信任</span></div>
  </div>
</body>
</html>
