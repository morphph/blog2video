<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px; background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%; padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      text-align: center; position: relative;
    }
    .kicker { font-size: 32px; color: #6B7280; margin-bottom: 24px; }
    .title { font-size: 76px; font-weight: 800; line-height: 1.2; margin-bottom: 48px; }
    .title .key { color: #8B5CF6; }
    .vs { background: #1A1A2E; border: 1px solid rgba(139,92,246,0.2);
      border-left: 4px solid #8B5CF6; border-radius: 12px; padding: 34px; width: 100%;
      margin-bottom: 28px; text-align: left; font-size: 40px; font-weight: 700; line-height: 1.45; }
    .vs .good { color: #8B5CF6; }
    .vs .bad { color: #6B7280; }
    .core { background: #1A1A2E; border-left: 4px solid #10B981; border-radius: 12px;
      padding: 32px; width: 100%; text-align: left; font-size: 38px; line-height: 1.45; }
    .core .key { color: #10B981; font-weight: 700; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="kicker">只剩唯一一个真正重要的问题</div>
    <div class="title">什么是你的<br><span class="key">人生事业？</span></div>
    <div class="vs">要建的是一份 <span class="good">人生事业</span><br>不是一个 <span class="bad">"个人品牌"</span></div>
    <div class="core">你人生事业的原材料，<span class="key">早就在你身体里了</span><br>只是被"要专精、别问那么多"的教导埋住了</div>
  </div>
</body>
</html>
