<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px; background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%; padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      text-align: center; position: relative;
    }
    .step { font-size: 30px; color: #6B7280; letter-spacing: 2px; margin-bottom: 14px; }
    .title { font-size: 60px; font-weight: 800; line-height: 1.2; margin-bottom: 16px; }
    .title .key { color: #F59E0B; }
    .setup { font-size: 32px; color: #B0B0CC; margin-bottom: 40px; line-height: 1.4; }
    .list { width: 100%; display: flex; flex-direction: column; gap: 18px; }
    .item { background: #1A1A2E; border: 1px solid rgba(139,92,246,0.2);
      border-left: 4px solid #F59E0B; border-radius: 12px; padding: 24px 28px;
      display: flex; align-items: baseline; gap: 22px; text-align: left; }
    .item .q { font-size: 40px; font-weight: 800; color: #F59E0B; min-width: 52px; }
    .item .t { font-size: 35px; font-weight: 600; line-height: 1.4; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="step">第二步 · 找你那根"逆主流的脊梁"</div>
    <div class="title">再问 <span class="key">3 个问题</span></div>
    <div class="setup">品味，是你看见了什么是坏掉的，没办法移开视线</div>
    <div class="list">
      <div class="item"><span class="q">Q1</span><span class="t">哪条主流建议，实实在在让你的生活变更糟？</span></div>
      <div class="item"><span class="q">Q2</span><span class="t">你坚信什么，但专家会说你幼稚？</span></div>
      <div class="item"><span class="q">Q3</span><span class="t">你这一行里，所有人都假装看不见的是什么？</span></div>
    </div>
  </div>
</body>
</html>
