<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px; background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%; padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      text-align: center; position: relative;
    }
    .step { font-size: 30px; color: #6B7280; letter-spacing: 2px; margin-bottom: 18px; }
    .title { font-size: 72px; font-weight: 800; line-height: 1.2; margin-bottom: 48px; }
    .title .key { color: #10B981; }
    .recipe { background: #1A1A2E; border: 1px solid rgba(139,92,246,0.2);
      border-left: 4px solid #10B981; border-radius: 12px; padding: 32px; width: 100%;
      margin-bottom: 26px; text-align: left; font-size: 38px; line-height: 1.5; }
    .recipe .key { color: #10B981; font-weight: 700; }
    .form { background: #1A1A2E; border-left: 4px solid #F59E0B; border-radius: 12px;
      padding: 30px; width: 100%; text-align: left; font-size: 38px; line-height: 1.45; color: #B0B0CC; }
    .form .key { color: #F59E0B; font-weight: 700; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="step">第三步</div>
    <div class="title">明天，把第一个<br><span class="key">想法发出去</span></div>
    <div class="recipe">从第一步挑一个答案，从第二步挑一个答案<br>合成一句<span class="key">只有你能写出来的话</span></div>
    <div class="form">一条帖子、一个视频、一封邮件——<span class="key">形式不重要</span><br>你就拿到了来自真实世界的反馈</div>
  </div>
</body>
</html>
