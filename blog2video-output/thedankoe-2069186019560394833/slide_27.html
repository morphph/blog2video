<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px; background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%; padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      text-align: center; position: relative;
    }
    .title { font-size: 56px; font-weight: 800; line-height: 1.2; margin-bottom: 18px; }
    .title .key { color: #10B981; }
    .sub { font-size: 32px; color: #6B7280; margin-bottom: 40px; }
    .list { width: 100%; display: flex; flex-direction: column; gap: 20px; }
    .item { background: #1A1A2E; border: 1px solid rgba(139,92,246,0.2);
      border-radius: 12px; padding: 26px 28px; display: flex; align-items: baseline; gap: 22px; text-align: left; }
    .item.one { border-left: 4px solid #F59E0B; }
    .item.two { border-left: 4px solid #8B5CF6; }
    .item .n { font-size: 48px; font-weight: 800; min-width: 56px; }
    .item.one .n { color: #F59E0B; }
    .item.two .n { color: #8B5CF6; }
    .item .t { font-size: 38px; font-weight: 700; line-height: 1.35; }
    .item.one .t .k { color: #F59E0B; }
    .item.two .t .k { color: #8B5CF6; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="title">解药从来不是反 AI<br>是把自己变成<span class="key">"不可雇佣"的人</span></div>
    <div class="sub">记住那两条真正的分水岭</div>
    <div class="list">
      <div class="item one">
        <span class="n">1</span>
        <span class="t">能做出来已经<span class="k">不值钱</span>了<br>能让人<span class="k">在乎</span>，才稀缺</span>
      </div>
      <div class="item two">
        <span class="n">2</span>
        <span class="t">你改不掉某个行为<br>往往是<span class="k">还没变成那个人</span></span>
      </div>
    </div>
  </div>
</body>
</html>
