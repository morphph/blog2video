<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px; background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%; padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      text-align: center; position: relative;
    }
    .kicker { font-size: 34px; color: #B0B0CC; margin-bottom: 28px; }
    .title { font-size: 80px; font-weight: 800; line-height: 1.2; margin-bottom: 56px; }
    .title .key { color: #EF4444; }
    .concept { background: #1A1A2E; border: 1px solid rgba(139,92,246,0.2);
      border-left: 4px solid #EF4444; border-radius: 12px; padding: 36px; width: 100%;
      margin-bottom: 28px; text-align: left; }
    .concept .txt { font-size: 44px; font-weight: 700; line-height: 1.4; }
    .concept .who { font-size: 34px; color: #F59E0B; font-weight: 700; }
    .foot { background: #1A1A2E; border-left: 4px solid #8B5CF6; border-radius: 12px;
      padding: 32px; width: 100%; text-align: left; font-size: 40px; font-weight: 700; line-height: 1.4; }
    .foot .key { color: #8B5CF6; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="kicker">那真正的威胁是什么？</div>
    <div class="title">你对所有人的<br><span class="key">生存依赖</span></div>
    <div class="concept">
      <div class="txt">你的<span class="who">雇主</span>、你的<span class="who">政府</span><br>都有自己的生存要顾<br>一受威胁，人性会先保自己</div>
    </div>
    <div class="foot">AI 只是按下了这个<br>一直存在的<span class="key">"依赖"快进键</span></div>
  </div>
</body>
</html>
