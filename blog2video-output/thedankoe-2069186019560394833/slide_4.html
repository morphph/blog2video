<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px; background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%; padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      text-align: center; position: relative;
    }
    .pillar { font-size: 32px; color: #6B7280; letter-spacing: 2px; margin-bottom: 20px; }
    .title { font-size: 88px; font-weight: 800; line-height: 1.15; margin-bottom: 48px; }
    .title .key { color: #EF4444; }
    .def { background: #1A1A2E; border: 1px solid rgba(139,92,246,0.2);
      border-left: 4px solid #EF4444; border-radius: 12px; padding: 34px; width: 100%;
      margin-bottom: 28px; text-align: left; font-size: 40px; font-weight: 700; line-height: 1.4; }
    .note { background: #1A1A2E; border-left: 4px solid #10B981; border-radius: 12px;
      padding: 30px; width: 100%; text-align: left; font-size: 38px; line-height: 1.4; color: #B0B0CC; }
    .note .key { color: #10B981; font-weight: 700; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="pillar">第一根支柱</div>
    <div class="title"><span class="key">工资奴役</span></div>
    <div class="def">做着自己没得选的、毫无意义的苦活<br>为别人做，只为了活下去</div>
    <div class="note"><span class="key">不是在骂工作本身</span>——工作是很好的踏脚石<br>能练手、攒经验、积累技能</div>
  </div>
</body>
</html>
