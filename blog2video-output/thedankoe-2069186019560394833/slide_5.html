<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px; background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%; padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      text-align: center; position: relative;
    }
    .title { font-size: 64px; font-weight: 800; line-height: 1.2; margin-bottom: 48px; }
    .title .key { color: #F59E0B; }
    .thirds { display: flex; gap: 20px; width: 100%; margin-bottom: 40px; }
    .third { flex: 1; background: #1A1A2E; border: 1px solid rgba(139,92,246,0.2);
      border-radius: 12px; padding: 28px 18px; }
    .third .frac { font-size: 64px; font-weight: 800; color: #EF4444; line-height: 1; }
    .third .lab { font-size: 30px; color: #B0B0CC; margin-top: 16px; line-height: 1.3; }
    .years { font-size: 36px; color: #6B7280; margin-bottom: 40px; }
    .years .key { color: #EF4444; font-weight: 800; }
    .edge { background: #1A1A2E; border-left: 4px solid #10B981; border-radius: 12px;
      padding: 32px; width: 100%; text-align: left; font-size: 40px; font-weight: 700; line-height: 1.4; }
    .edge .key { color: #10B981; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="title">人生被切成 <span class="key">三个 1/3</span></div>
    <div class="thirds">
      <div class="third"><div class="frac">1/3</div><div class="lab">做没得选的工作</div></div>
      <div class="third"><div class="frac">1/3</div><div class="lab">累到做不了有意义的事</div></div>
      <div class="third"><div class="frac">1/3</div><div class="lab">睡觉</div></div>
    </div>
    <div class="years">这样过 <span class="key">四十多年</span></div>
    <div class="edge">真正的享受，来自活在<span class="key">能力的边缘</span><br>挑战一个略高于当前水平的目标 = 心流</div>
  </div>
</body>
</html>
