<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px; background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%; padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      text-align: center; position: relative;
    }
    .title { font-size: 70px; font-weight: 800; line-height: 1.2; margin-bottom: 52px; }
    .title .key { color: #EF4444; }
    .core { background: #1A1A2E; border: 1px solid rgba(139,92,246,0.2);
      border-left: 4px solid #EF4444; border-radius: 12px; padding: 36px; width: 100%;
      margin-bottom: 28px; text-align: left; font-size: 42px; font-weight: 700; line-height: 1.45; }
    .core .a { color: #10B981; }
    .core .b { color: #EF4444; }
    .loop { background: #1A1A2E; border-left: 4px solid #F59E0B; border-radius: 12px;
      padding: 30px; width: 100%; text-align: left; font-size: 38px; line-height: 1.45; color: #B0B0CC; }
    .loop .key { color: #F59E0B; font-weight: 700; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="title">只做一件事<br>你对系统是<span class="key">瞎的</span></div>
    <div class="core">你懂那个<span class="a">让你拿工资的技能</span><br>却没想过搞懂<span class="b">那个付你工资的系统</span></div>
    <div class="loop">你不会搭自己的东西，只会在别人的东西里填角色<br>→ 陷进<span class="key">慢性压力循环</span>，视野越来越窄</div>
  </div>
</body>
</html>
