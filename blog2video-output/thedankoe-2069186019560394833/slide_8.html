<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px; background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%; padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      text-align: center; position: relative;
    }
    .kicker { font-size: 32px; color: #6B7280; margin-bottom: 36px; }
    .quotemark { font-size: 180px; color: #EF4444; line-height: 0.6; font-family: Georgia, serif;
      opacity: 0.4; margin-bottom: 8px; }
    .quote { font-size: 60px; font-weight: 800; line-height: 1.35; }
    .quote .key { color: #EF4444; }
    .verdict { margin-top: 56px; background: #1A1A2E; border-left: 4px solid #EF4444;
      border-radius: 12px; padding: 32px; width: 100%; text-align: left;
      font-size: 38px; line-height: 1.45; color: #B0B0CC; }
    .verdict .key { color: #EF4444; font-weight: 800; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="kicker">判断你是不是奴隶，看一条硬标准</div>
    <div class="quotemark">"</div>
    <div class="quote">没办法停止上班<br><span class="key">一停就是灾难</span></div>
    <div class="verdict">又没有创造其他出路的技能<br>那按定义，你就是个<span class="key">奴隶</span>——不管感受怎么说</div>
  </div>
</body>
</html>
