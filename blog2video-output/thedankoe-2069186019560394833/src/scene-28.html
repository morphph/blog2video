<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
/*@@BASE@@*/
/* —— scene-28 特有(纯尾卡)—— */
[data-composition-id='s28'] .endcard{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;transform-origin:50% 50%}
[data-composition-id='s28'] .logo{font-family:'MiSans',sans-serif;font-weight:900;font-size:140px;color:#edebe6;line-height:1;display:flex;align-items:center}
[data-composition-id='s28'] .logo .cur{width:34px;height:108px;vertical-align:-12px;margin-left:18px}
[data-composition-id='s28'] .rule{width:120px;height:2px;background:#ccff4d;margin-top:42px;transform-origin:center}
[data-composition-id='s28'] .sub2{margin-top:40px;font-family:'JetBrains Mono',monospace;font-size:38px;font-weight:500;color:#8a8a85;letter-spacing:.14em}
[data-composition-id='s28'] .sub2 .done{color:#ccff4d;font-weight:700}
</style>
</head>
<body>
  <div id="root" class="stage" data-composition-id="s28" data-start="0" data-duration="5" data-width="1080" data-height="1920">
    <div class="grid"></div>
    <div class="endcard">
      <div class="logo">精读AI<span class="cur cblink"></span></div>
      <div class="rule"></div>
      <div class="sub2">逃离工资奴役 · <span class="done">完</span></div>
    </div>
  </div>

  <script>
  /*@@MOTION@@*/
  </script>
  <script>
  (function(){
    var R="[data-composition-id='s28'] ";
    var tl=gsap.timeline({paused:true});
    tl.from(R+'.grid',{opacity:0,duration:.5,ease:'power1.out'},.02);
    D2.enter(tl, R+'.logo', .3, {y:22, d:.5, ease:'expo.out'});
    tl.fromTo(R+'.rule', {scaleX:0}, {scaleX:1, duration:.4, ease:'power3.out'}, .9);
    D2.enter(tl, R+'.sub2', 1.1, {y:14, d:.4, ease:'power2.out'});
    D2.blink(tl, R+'.cblink', 1.6, 6);
    D2.breath(tl, R+'.endcard', 5, 'out');
    window.__timelines = window.__timelines || {};
    window.__timelines['s28'] = tl;
  })();
  </script>
</body>
</html>
