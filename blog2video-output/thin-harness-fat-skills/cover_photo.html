<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .cover {
      width: 100%;
      height: 100%;
      padding: 100px 72px 400px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
      background:
        radial-gradient(circle at 25% 20%, rgba(239, 68, 68, 0.16), transparent 55%),
        radial-gradient(circle at 80% 78%, rgba(139, 92, 246, 0.16), transparent 55%),
        radial-gradient(circle at 50% 45%, rgba(245, 158, 11, 0.08), transparent 60%),
        #0D0D1A;
    }
    .series-tag {
      font-size: 30px;
      color: #8B5CF6;
      letter-spacing: 4px;
      font-weight: 700;
      margin-bottom: 60px;
      text-transform: none;
    }
    .headline {
      font-size: 108px;
      font-weight: 900;
      line-height: 1.12;
      letter-spacing: -2px;
      margin-bottom: 48px;
      color: #FFFFFF;
    }
    .headline .red { color: #EF4444; }
    .headline .yellow { color: #F59E0B; }
    .sub-hook {
      font-size: 46px;
      font-weight: 800;
      color: #B0B0CC;
      line-height: 1.3;
      margin-bottom: 72px;
      letter-spacing: 1px;
    }
    .sub-hook .k { color: #F59E0B; }
    .source-tag {
      display: inline-block;
      background: #1A1A30;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 999px;
      padding: 14px 32px;
      font-size: 22px;
      color: #6B6B80;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .source-tag .author { color: #8B8BA8; font-weight: 700; }
  </style>
</head>
<body>
  <div class="cover">
    <div class="series-tag">精读AI · AI Agent 架构</div>
    <div class="headline">
      同样的 <span class="yellow">Claude</span><br>
      为什么 <span class="red">2 倍 vs 100 倍</span>？
    </div>
    <div class="sub-hook">
      薄 <span class="k">Harness</span>，厚 <span class="k">Skill</span>
    </div>
    <div class="source-tag">
      <span class="author">Garry Tan</span>《Thin Harness, Fat Skills》
    </div>
  </div>
</body>
</html>
