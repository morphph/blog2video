<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .eyebrow {
      font-size: 26px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 600;
      margin-bottom: 20px;
    }
    .title {
      font-size: 56px;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 36px;
    }
    .title .hl { color: #F59E0B; }
    .scene {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-left: 4px solid #3B82F6;
      border-radius: 12px;
      padding: 22px 24px;
      margin-bottom: 24px;
      text-align: left;
    }
    .scene-label {
      font-size: 20px;
      color: #3B82F6;
      letter-spacing: 2px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .scene-head {
      font-size: 28px;
      color: #FFFFFF;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .scene-head .num { color: #F59E0B; font-size: 40px; }
    .scene-body {
      font-size: 22px;
      color: #B0B0CC;
      font-weight: 500;
      line-height: 1.4;
    }
    .vs-box {
      width: 100%;
      display: flex;
      gap: 16px;
      margin-bottom: 24px;
    }
    .vs-col {
      flex: 1;
      background: #15152A;
      border-radius: 10px;
      padding: 18px 16px;
      text-align: center;
    }
    .vs-col.old { border: 1px solid rgba(239, 68, 68, 0.3); border-left: 4px solid #EF4444; }
    .vs-col.new { border: 1px solid rgba(16, 185, 129, 0.3); border-left: 4px solid #10B981; }
    .vs-head {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .old .vs-head { color: #EF4444; }
    .new .vs-head { color: #10B981; }
    .vs-text {
      font-size: 22px;
      color: #FFFFFF;
      font-weight: 600;
      line-height: 1.3;
    }
    .vs-text .k { color: #F59E0B; font-weight: 800; }
    .skill-card {
      width: 100%;
      background: linear-gradient(90deg, rgba(139,92,246,0.15), rgba(245,158,11,0.12));
      border: 1px solid rgba(139, 92, 246, 0.4);
      border-radius: 12px;
      padding: 20px 22px;
      text-align: left;
    }
    .skill-name {
      font-size: 32px;
      font-weight: 800;
      color: #8B5CF6;
      margin-bottom: 6px;
    }
    .skill-desc {
      font-size: 22px;
      color: #FFFFFF;
      font-weight: 600;
      line-height: 1.4;
    }
    .skill-desc .muted { color: #B0B0CC; font-weight: 500; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="eyebrow">YC Startup School 实战</div>
    <div class="title">
      <span class="hl">6000</span> 人，15 人团队怎么扛？
    </div>
    <div class="scene">
      <div class="scene-label">2026 年 7 月 · Chase Center</div>
      <div class="scene-head"><span class="num">6000</span> 名创始人涌入</div>
      <div class="scene-body">传统运营做法：一份份读申请 · 做直觉判断 · 更新表格</div>
    </div>
    <div class="vs-box">
      <div class="vs-col old">
        <div class="vs-head">200 人</div>
        <div class="vs-text">还能<span class="k">硬扛</span></div>
      </div>
      <div class="vs-col new">
        <div class="vs-head">6000 人</div>
        <div class="vs-text">脑子装<span class="k">不下</span></div>
      </div>
    </div>
    <div class="skill-card">
      <div class="skill-name">/enrich-founder</div>
      <div class="skill-desc">
        申请 + 问卷 + 录音 + X 发言 + GitHub commit<br>
        <span class="muted">全拉进来，模型 diarize 成结构化档案</span>
      </div>
    </div>
  </div>
</body>
</html>
