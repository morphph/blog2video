<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .eyebrow {
      font-size: 26px;
      color: #EF4444;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 20px;
    }
    .title {
      font-size: 60px;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 36px;
    }
    .title .hl { color: #EF4444; }
    .title .k { color: #F59E0B; }
    .rule {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-left: 4px solid #EF4444;
      border-radius: 12px;
      padding: 22px 24px;
      margin-bottom: 18px;
      text-align: left;
    }
    .rule-label {
      font-size: 20px;
      color: #EF4444;
      letter-spacing: 2px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .rule-text {
      font-size: 24px;
      color: #FFFFFF;
      font-weight: 700;
      line-height: 1.4;
    }
    .rule-text .k { color: #F59E0B; }
    .rule-text .num { color: #F59E0B; font-size: 32px; font-weight: 800; }
    .costs {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 20px;
    }
    .cost {
      background: #15152A;
      border: 1px solid rgba(239, 68, 68, 0.2);
      border-left: 4px solid #EF4444;
      border-radius: 10px;
      padding: 18px 18px;
      text-align: left;
    }
    .cost-head {
      font-size: 20px;
      color: #EF4444;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .cost-text {
      font-size: 22px;
      color: #FFFFFF;
      font-weight: 600;
      line-height: 1.35;
    }
    .cost-text .muted { color: #B0B0CC; font-weight: 500; }
    .bottom-line {
      width: 100%;
      font-size: 30px;
      font-weight: 800;
      color: #FFFFFF;
      line-height: 1.3;
      padding: 18px 22px;
      background: linear-gradient(90deg, rgba(245,158,11,0.12), rgba(239,68,68,0.12));
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-radius: 12px;
    }
    .bottom-line .k { color: #F59E0B; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="eyebrow">代价 · 不是银弹</div>
    <div class="title">
      Skill 路径是<span class="hl">纪律</span>，<br>不是灵感
    </div>
    <div class="rule">
      <div class="rule-label">Garry Tan 的硬规矩</div>
      <div class="rule-text">
        如果一件事可能再发生<br>
        手动做 <span class="num">3~10</span> 次给我看<br>
        批准了，才固化成 <span class="k">skill 文件</span>
      </div>
    </div>
    <div class="costs">
      <div class="cost">
        <div class="cost-head">失控风险</div>
        <div class="cost-text">团队没纪律<br><span class="muted">skill 变第二个 2 万行 md</span></div>
      </div>
      <div class="cost">
        <div class="cost-head">成本真实</div>
        <div class="cost-text">diarization 烧 token<br><span class="muted">6000 人每天跑一次</span></div>
      </div>
    </div>
    <div class="bottom-line">
      Thin Harness, Fat Skills 是<span class="k">方向</span><br>
      不是免费午餐
    </div>
  </div>
</body>
</html>
