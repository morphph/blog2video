<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
      background:
        radial-gradient(circle at 20% 20%, rgba(139, 92, 246, 0.12), transparent 55%),
        radial-gradient(circle at 80% 75%, rgba(245, 158, 11, 0.10), transparent 55%),
        #0D0D1A;
    }
    .eyebrow {
      font-size: 26px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 600;
      margin-bottom: 20px;
    }
    .title {
      font-size: 60px;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 36px;
    }
    .title .hl { color: #F59E0B; }
    .takeaways {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 28px;
    }
    .item {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-left: 4px solid #8B5CF6;
      border-radius: 12px;
      padding: 18px 22px;
      display: flex;
      align-items: center;
      gap: 18px;
      text-align: left;
    }
    .idx {
      font-size: 38px;
      font-weight: 800;
      color: #8B5CF6;
      line-height: 1;
      min-width: 48px;
    }
    .itext {
      font-size: 24px;
      color: #FFFFFF;
      font-weight: 700;
      line-height: 1.35;
    }
    .itext .k { color: #F59E0B; }
    .itext .muted { color: #B0B0CC; font-weight: 500; }
    .punch {
      width: 100%;
      background: linear-gradient(90deg, rgba(139,92,246,0.15), rgba(245,158,11,0.15));
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-radius: 12px;
      padding: 22px 22px;
      font-size: 30px;
      font-weight: 800;
      color: #FFFFFF;
      line-height: 1.3;
      margin-bottom: 18px;
    }
    .punch .k { color: #F59E0B; }
    .outro {
      width: 100%;
      font-size: 22px;
      color: #B0B0CC;
      font-weight: 600;
      letter-spacing: 1px;
    }
    .outro .brand { color: #8B5CF6; font-weight: 800; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="eyebrow">精读AI · 复盘</div>
    <div class="title">
      100 倍差距的<span class="hl">索引卡</span>
    </div>
    <div class="takeaways">
      <div class="item">
        <div class="idx">01</div>
        <div class="itext">差距不在模型脑子里<br><span class="muted">在那 200 行 harness 里</span></div>
      </div>
      <div class="item">
        <div class="idx">02</div>
        <div class="itext">把判断力抽出来<br><span class="muted">写成可重复调用的 <span class="k">markdown</span></span></div>
      </div>
      <div class="item">
        <div class="idx">03</div>
        <div class="itext">做每件事先问：<br><span class="muted">这归 <span class="k">模型</span> 还是归 <span class="k">SQL</span>？</span></div>
      </div>
    </div>
    <div class="punch">
      模型是公共资源<br>
      <span class="k">Skill 是你自己的复利</span>
    </div>
    <div class="outro">
      AI 世界很吵 · <span class="brand">精读一篇，胜过刷一百条</span>
    </div>
  </div>
</body>
</html>
