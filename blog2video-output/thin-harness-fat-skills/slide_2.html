<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .eyebrow {
      font-size: 26px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 600;
      margin-bottom: 24px;
    }
    .title {
      font-size: 72px;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 56px;
    }
    .title .gap { color: #EF4444; }
    .core-card {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.35);
      border-left: 4px solid #8B5CF6;
      border-radius: 12px;
      padding: 32px 28px;
      margin-bottom: 32px;
    }
    .core-label {
      font-size: 24px;
      color: #B0B0CC;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }
    .core-text {
      font-size: 44px;
      font-weight: 800;
      color: #8B5CF6;
      line-height: 1.3;
    }
    .core-text .en { color: #FFFFFF; font-style: normal; }
    .sub-list {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .item {
      background: #15152A;
      border: 1px solid rgba(139, 92, 246, 0.15);
      border-radius: 10px;
      padding: 18px 16px;
      font-size: 22px;
      color: #B0B0CC;
      font-weight: 500;
    }
    .item .k { color: #FFFFFF; font-weight: 700; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="eyebrow">50 倍差距的真相</div>
    <div class="title">
      差的不是模型<br>
      是<span class="gap">模型周围那一层</span>
    </div>
    <div class="core-card">
      <div class="core-label">Garry Tan 的定义</div>
      <div class="core-text"><span class="en">Harness</span> = 脚手架</div>
    </div>
    <div class="sub-list">
      <div class="item"><span class="k">Live repo</span> context</div>
      <div class="item"><span class="k">Prompt</span> caching</div>
      <div class="item">专门打造的<span class="k">工具</span></div>
      <div class="item">压缩<span class="k">上下文</span></div>
      <div class="item">结构化<span class="k">会话记忆</span></div>
      <div class="item">并行<span class="k">子 Agent</span></div>
    </div>
  </div>
</body>
</html>
