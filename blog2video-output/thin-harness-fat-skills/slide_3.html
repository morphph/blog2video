<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .eyebrow {
      font-size: 26px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 600;
      margin-bottom: 24px;
    }
    .title {
      font-size: 64px;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 48px;
    }
    .title .hl { color: #F59E0B; }
    .wrong {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(239, 68, 68, 0.25);
      border-left: 4px solid #6B7280;
      border-radius: 12px;
      padding: 22px 24px;
      margin-bottom: 20px;
      text-align: left;
    }
    .tag-label {
      font-size: 22px;
      color: #6B7280;
      letter-spacing: 2px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    .wrong-text {
      font-size: 30px;
      color: #B0B0CC;
      text-decoration: line-through;
      text-decoration-color: #EF4444;
      font-weight: 600;
    }
    .right {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.4);
      border-left: 4px solid #8B5CF6;
      border-radius: 12px;
      padding: 28px 24px;
      margin-bottom: 28px;
      text-align: left;
    }
    .right .tag-label { color: #8B5CF6; }
    .right-text {
      font-size: 38px;
      font-weight: 800;
      color: #FFFFFF;
      line-height: 1.3;
    }
    .right-text .k { color: #8B5CF6; }
    .right-text .en { color: #F59E0B; }
    .note {
      font-size: 22px;
      color: #B0B0CC;
      line-height: 1.5;
      padding: 0 20px;
    }
    .note .k { color: #FFFFFF; font-weight: 700; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="eyebrow">最反直觉的概念</div>
    <div class="title">
      Skill<span class="hl"> 到底是什么？</span>
    </div>
    <div class="wrong">
      <div class="tag-label">误解</div>
      <div class="wrong-text">一个写好的 Prompt 模板</div>
    </div>
    <div class="right">
      <div class="tag-label">Garry Tan</div>
      <div class="right-text">
        Skill 是<span class="k">带参数的方法调用</span>
      </div>
    </div>
    <div class="note">
      用 <span class="k">markdown</span> 做编程语言<br>
      用 <span class="k">人类判断</span> 做 runtime
    </div>
  </div>
</body>
</html>
