<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .eyebrow {
      font-size: 26px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    .title {
      font-size: 48px;
      font-weight: 900;
      line-height: 1.25;
      margin-bottom: 14px;
    }
    .title .en { color: #F59E0B; }
    .subtitle {
      font-size: 24px;
      color: #B0B0CC;
      margin-bottom: 40px;
    }
    .subtitle .k { color: #FFFFFF; font-weight: 700; }
    .compare {
      display: flex;
      gap: 20px;
      width: 100%;
      margin-bottom: 28px;
    }
    .col {
      flex: 1;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-radius: 12px;
      padding: 24px 20px;
      text-align: left;
      display: flex;
      flex-direction: column;
    }
    .col.a { border-left: 4px solid #3B82F6; }
    .col.b { border-left: 4px solid #10B981; }
    .col-head {
      font-size: 22px;
      letter-spacing: 2px;
      font-weight: 700;
      margin-bottom: 14px;
    }
    .col.a .col-head { color: #3B82F6; }
    .col.b .col-head { color: #10B981; }
    .row {
      font-size: 20px;
      color: #B0B0CC;
      line-height: 1.5;
      margin-bottom: 10px;
      padding-left: 6px;
    }
    .row .lbl { color: #6B7280; font-weight: 700; font-size: 18px; display: block; margin-top: 8px; }
    .row .val { color: #FFFFFF; font-weight: 600; }
    .outcome {
      margin-top: auto;
      padding-top: 14px;
      border-top: 1px dashed rgba(139, 92, 246, 0.3);
      font-size: 24px;
      font-weight: 800;
      text-align: center;
    }
    .col.a .outcome { color: #3B82F6; }
    .col.b .outcome { color: #10B981; }
    .verdict {
      width: 100%;
      background: linear-gradient(90deg, rgba(139,92,246,0.12), rgba(245,158,11,0.12));
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 12px;
      padding: 20px 24px;
      font-size: 28px;
      font-weight: 800;
      line-height: 1.3;
      color: #FFFFFF;
    }
    .verdict .k { color: #F59E0B; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="eyebrow">同一个 skill，两次调用</div>
    <div class="title">
      <span class="en">/investigate</span> 七步不变
    </div>
    <div class="subtitle">换三个<span class="k">参数</span>，角色完全变了</div>
    <div class="compare">
      <div class="col a">
        <div class="col-head">调用 ①</div>
        <div class="row"><span class="lbl">目标</span><span class="val">安全科学家</span></div>
        <div class="row"><span class="lbl">数据集</span><span class="val">210 万封证据邮件</span></div>
        <div class="row"><span class="lbl">问题</span><span class="val">吹哨人被噤声？</span></div>
        <div class="outcome">→ 医学研究分析师</div>
      </div>
      <div class="col b">
        <div class="col-head">调用 ②</div>
        <div class="row"><span class="lbl">目标</span><span class="val">一家空壳公司</span></div>
        <div class="row"><span class="lbl">数据集</span><span class="val">FEC 政治献金</span></div>
        <div class="row"><span class="lbl">问题</span><span class="val">资金链是否异常？</span></div>
        <div class="outcome">→ 法证调查员</div>
      </div>
    </div>
    <div class="verdict">
      这不是 prompt engineering<br>
      这是 <span class="k">软件工程</span>
    </div>
  </div>
</body>
</html>
