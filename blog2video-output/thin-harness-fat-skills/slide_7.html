<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .eyebrow {
      font-size: 26px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 600;
      margin-bottom: 20px;
    }
    .title {
      font-size: 58px;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 40px;
    }
    .title .hl { color: #F59E0B; }
    .compare {
      width: 100%;
      display: flex;
      gap: 20px;
      margin-bottom: 28px;
    }
    .col {
      flex: 1;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-radius: 12px;
      padding: 24px 20px;
      text-align: center;
    }
    .col.thin { border-left: 4px solid #10B981; }
    .col.fat { border-left: 4px solid #EF4444; }
    .col-head {
      font-size: 22px;
      letter-spacing: 2px;
      font-weight: 700;
      margin-bottom: 10px;
    }
    .thin .col-head { color: #10B981; }
    .fat .col-head { color: #EF4444; }
    .tool {
      font-size: 26px;
      color: #B0B0CC;
      font-weight: 600;
      margin-bottom: 18px;
    }
    .tool .k { color: #FFFFFF; font-weight: 700; }
    .num {
      font-size: 74px;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 6px;
    }
    .thin .num { color: #10B981; }
    .fat .num { color: #EF4444; }
    .unit {
      font-size: 22px;
      color: #B0B0CC;
      font-weight: 600;
    }
    .gap-band {
      width: 100%;
      background: linear-gradient(90deg, rgba(239,68,68,0.15), rgba(245,158,11,0.15));
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }
    .gap-num {
      font-size: 96px;
      font-weight: 800;
      color: #EF4444;
      line-height: 1;
    }
    .gap-cap {
      font-size: 30px;
      font-weight: 800;
      color: #FFFFFF;
      text-align: left;
      line-height: 1.2;
    }
    .gap-cap .k { color: #F59E0B; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="eyebrow">同样的任务，75 倍差距</div>
    <div class="title">
      工具越多，Agent <span class="hl">越蠢</span>
    </div>
    <div class="compare">
      <div class="col thin">
        <div class="col-head">薄</div>
        <div class="tool"><span class="k">Playwright</span> CLI</div>
        <div class="num">100ms</div>
        <div class="unit">每个浏览器操作</div>
      </div>
      <div class="col fat">
        <div class="col-head">厚</div>
        <div class="tool"><span class="k">Chrome MCP</span></div>
        <div class="num">15s</div>
        <div class="unit">截图→找→点→读一整链</div>
      </div>
    </div>
    <div class="gap-band">
      <div class="gap-num">75x</div>
      <div class="gap-cap">差距<br>3 倍 <span class="k">token · 延迟 · 失败率</span></div>
    </div>
  </div>
</body>
</html>
