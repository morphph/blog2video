<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .eyebrow {
      font-size: 26px;
      color: #EF4444;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 20px;
    }
    .title {
      font-size: 58px;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 32px;
    }
    .title .hl { color: #F59E0B; }
    .compare {
      width: 100%;
      display: flex;
      gap: 18px;
      margin-bottom: 26px;
    }
    .col {
      flex: 1;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-radius: 12px;
      padding: 24px 18px;
      text-align: left;
    }
    .col.latent { border-left: 4px solid #8B5CF6; }
    .col.det { border-left: 4px solid #3B82F6; }
    .col-en {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }
    .latent .col-en { color: #8B5CF6; }
    .det .col-en { color: #3B82F6; }
    .col-zh {
      font-size: 20px;
      color: #B0B0CC;
      margin-bottom: 14px;
    }
    .col-role {
      font-size: 22px;
      color: #FFFFFF;
      font-weight: 700;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px dashed rgba(139, 92, 246, 0.25);
    }
    .col-role .k { color: #F59E0B; }
    .col-list {
      font-size: 20px;
      color: #B0B0CC;
      line-height: 1.7;
      font-weight: 500;
    }
    .example {
      width: 100%;
      background: linear-gradient(90deg, rgba(16,185,129,0.10), rgba(239,68,68,0.15));
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 12px;
      padding: 20px 22px;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }
    .ex-side { text-align: center; }
    .ex-num {
      font-size: 56px;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 4px;
    }
    .ex-side.ok .ex-num { color: #10B981; }
    .ex-side.fail .ex-num { color: #EF4444; }
    .ex-lbl {
      font-size: 20px;
      color: #FFFFFF;
      font-weight: 700;
    }
    .ex-lbl .sub { display: block; color: #B0B0CC; font-weight: 500; font-size: 18px; margin-top: 2px; }
    .vs {
      font-size: 28px;
      color: #6B7280;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="eyebrow">最容易踩的致命错误</div>
    <div class="title">
      活儿<span class="hl">放错边</span>，Agent 必翻车
    </div>
    <div class="compare">
      <div class="col latent">
        <div class="col-en">Latent</div>
        <div class="col-zh">潜空间 / 智能</div>
        <div class="col-role">模型该干的</div>
        <div class="col-list">读 · 理解<br>判断 · 综合<br>识别模式</div>
      </div>
      <div class="col det">
        <div class="col-en">Deterministic</div>
        <div class="col-zh">确定性 / 信任</div>
        <div class="col-role">代码该干的</div>
        <div class="col-list">SQL 查询<br>编译代码<br>算术运算</div>
      </div>
    </div>
    <div class="example">
      <div class="ex-side ok">
        <div class="ex-num">8</div>
        <div class="ex-lbl">人排座位<span class="sub">LLM OK</span></div>
      </div>
      <div class="vs">VS</div>
      <div class="ex-side fail">
        <div class="ex-num">800</div>
        <div class="ex-lbl">人排座位<span class="sub">看似合理 · 其实全错</span></div>
      </div>
    </div>
  </div>
</body>
</html>
