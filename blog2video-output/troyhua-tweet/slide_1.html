<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .source-label {
      font-size: 28px;
      color: #8B5CF6;
      letter-spacing: 4px;
      margin-bottom: 44px;
      font-weight: 600;
    }
    .title-line1 {
      font-size: 72px;
      font-weight: 900;
      line-height: 1.25;
      margin-bottom: 12px;
    }
    .title-line2 {
      font-size: 72px;
      font-weight: 900;
      line-height: 1.25;
      color: #EF4444;
      margin-bottom: 40px;
    }
    .subtitle {
      font-size: 30px;
      color: #B0B0CC;
      line-height: 1.6;
      margin-bottom: 56px;
      max-width: 800px;
    }
    .subtitle .hl-red { color: #EF4444; font-weight: 700; }
    .subtitle .hl-yellow { color: #F59E0B; font-weight: 700; }
    .cards {
      display: flex;
      flex-direction: column;
      gap: 18px;
      width: 100%;
    }
    .card {
      display: flex;
      align-items: flex-start;
      gap: 20px;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 24px 28px;
      text-align: left;
    }
    .card-red { border-left: 4px solid #EF4444; }
    .card-yellow { border-left: 4px solid #F59E0B; }
    .card-blue { border-left: 4px solid #3B82F6; }
    .card-number {
      font-size: 36px;
      font-weight: 800;
      min-width: 56px;
    }
    .card-red .card-number { color: #EF4444; }
    .card-yellow .card-number { color: #F59E0B; }
    .card-blue .card-number { color: #3B82F6; }
    .card-body { flex: 1; }
    .card-title {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .card-desc {
      font-size: 22px;
      color: #B0B0CC;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="source-label">精读AI</div>
    <div class="title-line1">Claude Code 记忆</div>
    <div class="title-line2">分6层才够用？</div>
    <div class="subtitle">CMU博士从<span class="hl-red">源码</span>逆向出的<span class="hl-yellow">6层管线</span>——最便宜的不到1毫秒</div>
    <div class="cards">
      <div class="card card-red">
        <div class="card-number">01</div>
        <div class="card-body">
          <div class="card-title">200K还不够用</div>
          <div class="card-desc">读几个文件上下文就快满了</div>
        </div>
      </div>
      <div class="card card-yellow">
        <div class="card-number">02</div>
        <div class="card-body">
          <div class="card-title">一刀切压缩太贵</div>
          <div class="card-desc">每次调API做摘要成本爆炸</div>
        </div>
      </div>
      <div class="card card-blue">
        <div class="card-number">03</div>
        <div class="card-body">
          <div class="card-title">你睡了它才启动</div>
          <div class="card-desc">最贵的层只在后台偷偷跑</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
