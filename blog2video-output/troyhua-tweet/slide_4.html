<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .slide-label {
      font-size: 24px;
      color: #F59E0B;
      letter-spacing: 3px;
      margin-bottom: 24px;
      font-weight: 600;
    }
    .title {
      font-size: 44px;
      font-weight: 900;
      margin-bottom: 40px;
      line-height: 1.3;
    }
    .title .yellow { color: #F59E0B; }
    .cards-row {
      display: flex;
      gap: 24px;
      width: 100%;
      margin-bottom: 28px;
    }
    .comp-card {
      flex: 1;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 16px;
      padding: 28px 24px;
      text-align: left;
      display: flex;
      flex-direction: column;
    }
    .comp-card-l3 { border-top: 4px solid #10B981; }
    .comp-card-l4 { border-top: 4px solid #EF4444; }
    .card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .card-badge {
      font-size: 20px;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 8px;
    }
    .badge-green { background: rgba(16, 185, 129, 0.12); color: #10B981; }
    .badge-red { background: rgba(239, 68, 68, 0.12); color: #EF4444; }
    .card-name {
      font-size: 28px;
      font-weight: 800;
    }
    .name-green { color: #10B981; }
    .name-red { color: #EF4444; }
    .card-feature {
      font-size: 22px;
      color: #B0B0CC;
      line-height: 1.6;
      margin-bottom: 16px;
      flex: 1;
    }
    .card-cost {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 8px;
    }
    .cost-label {
      font-size: 18px;
      color: #6B7280;
    }
    .cost-value {
      font-size: 24px;
      font-weight: 800;
    }
    .cost-green { color: #10B981; }
    .cost-red { color: #EF4444; }
    .vs-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }
    .vs-text {
      font-size: 20px;
      font-weight: 800;
      color: #F59E0B;
      background: rgba(245, 158, 11, 0.1);
      padding: 6px 20px;
      border-radius: 20px;
    }
    .fuse-box {
      background: rgba(239, 68, 68, 0.06);
      border: 1px solid rgba(239, 68, 68, 0.2);
      border-left: 4px solid #EF4444;
      border-radius: 0 12px 12px 0;
      padding: 18px 24px;
      width: 100%;
      text-align: left;
    }
    .fuse-box .fuse-title {
      font-size: 22px;
      font-weight: 700;
      color: #EF4444;
      margin-bottom: 4px;
    }
    .fuse-box .fuse-desc {
      font-size: 20px;
      color: #B0B0CC;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="slide-label">LAYER 3 vs LAYER 4</div>
    <div class="title">Session Memory 的<span class="yellow">质变</span></div>
    <div class="cards-row">
      <div class="comp-card comp-card-l3">
        <div class="card-header">
          <span class="card-badge badge-green">L3</span>
          <span class="card-name name-green">Session Memory</span>
        </div>
        <div class="card-feature">复用对话中持续维护的结构化笔记，不调API</div>
        <div class="card-cost">
          <span class="cost-label">耗时</span>
          <span class="cost-value cost-green">~5s</span>
        </div>
      </div>
      <div class="comp-card comp-card-l4">
        <div class="card-header">
          <span class="card-badge badge-red">L4</span>
          <span class="card-name name-red">摘要 Agent</span>
        </div>
        <div class="card-feature">Fork 专门 Agent 做完整结构化总结，完整API调用</div>
        <div class="card-cost">
          <span class="cost-label">耗时</span>
          <span class="cost-value cost-red">~10s</span>
        </div>
      </div>
    </div>
    <div class="vs-divider">
      <span class="vs-text">零 API 调用 vs 完整 API 调用</span>
    </div>
    <div class="fuse-box">
      <div class="fuse-title">三次熔断机制</div>
      <div class="fuse-desc">连续失败三次 &rarr; 停止尝试，不陷入死循环</div>
    </div>
  </div>
</body>
</html>
