<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .slide-label {
      font-size: 24px;
      color: #8B5CF6;
      letter-spacing: 3px;
      margin-bottom: 28px;
      font-weight: 600;
    }
    .title {
      font-size: 46px;
      font-weight: 900;
      margin-bottom: 44px;
      line-height: 1.3;
    }
    .title .purple { color: #8B5CF6; }
    .layer-section {
      width: 100%;
      margin-bottom: 28px;
    }
    .layer-card {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-left: 4px solid #8B5CF6;
      border-radius: 0 12px 12px 0;
      padding: 24px 28px;
      text-align: left;
      margin-bottom: 16px;
    }
    .layer-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }
    .layer-badge {
      font-size: 18px;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 8px;
      background: rgba(139, 92, 246, 0.12);
      color: #8B5CF6;
    }
    .layer-name {
      font-size: 26px;
      font-weight: 800;
      color: #8B5CF6;
    }
    .layer-desc {
      font-size: 22px;
      color: #B0B0CC;
      line-height: 1.5;
    }
    .dreaming-section {
      width: 100%;
      background: rgba(245, 158, 11, 0.04);
      border: 2px solid rgba(245, 158, 11, 0.2);
      border-radius: 16px;
      padding: 28px;
      text-align: left;
    }
    .dreaming-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .dreaming-badge {
      font-size: 18px;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 8px;
      background: rgba(245, 158, 11, 0.12);
      color: #F59E0B;
    }
    .dreaming-name {
      font-size: 28px;
      font-weight: 900;
      color: #F59E0B;
    }
    .dreaming-subtitle {
      font-size: 22px;
      color: #B0B0CC;
      margin-bottom: 16px;
    }
    .gates {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .gate {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(245, 158, 11, 0.08);
      border-radius: 20px;
      padding: 8px 14px;
      font-size: 18px;
      color: #F59E0B;
      font-weight: 600;
    }
    .gate-check {
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="slide-label">LAYER 5 &amp; 6</div>
    <div class="title">对话之外的<span class="purple">记忆</span></div>
    <div class="layer-section">
      <div class="layer-card">
        <div class="layer-header">
          <span class="layer-badge">L5</span>
          <span class="layer-name">自动记忆提取</span>
        </div>
        <div class="layer-desc">对话结束后提取项目结构、用户偏好、技术决策，写入持久化文件</div>
      </div>
    </div>
    <div class="dreaming-section">
      <div class="dreaming-header">
        <span class="dreaming-badge">L6</span>
        <span class="dreaming-name">Dreaming</span>
      </div>
      <div class="dreaming-subtitle">跨会话记忆整合 &middot; 5道门控全通过才启动</div>
      <div class="gates">
        <div class="gate"><span class="gate-check">&#10003;</span> 功能开关</div>
        <div class="gate"><span class="gate-check">&#10003;</span> 超24h</div>
        <div class="gate"><span class="gate-check">&#10003;</span> 扫描间隔&gt;10min</div>
        <div class="gate"><span class="gate-check">&#10003;</span> 累计5次会话</div>
        <div class="gate"><span class="gate-check">&#10003;</span> 文件锁空闲</div>
      </div>
    </div>
  </div>
</body>
</html>
