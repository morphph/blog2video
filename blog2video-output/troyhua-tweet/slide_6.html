<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .bg-glow {
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      top: 400px;
      left: 50%;
      transform: translateX(-50%);
      background: radial-gradient(circle, rgba(139, 92, 246, 0.06) 0%, transparent 70%);
      pointer-events: none;
    }
    .quote-mark {
      font-size: 120px;
      color: rgba(139, 92, 246, 0.15);
      line-height: 1;
      margin-bottom: 16px;
      position: relative;
      z-index: 1;
    }
    .quote-text {
      font-size: 38px;
      font-weight: 700;
      line-height: 1.6;
      max-width: 860px;
      margin-bottom: 40px;
      position: relative;
      z-index: 1;
    }
    .quote-text .purple { color: #8B5CF6; }
    .quote-text .yellow { color: #F59E0B; }
    .attribution {
      font-size: 22px;
      color: #6B7280;
      margin-bottom: 48px;
      position: relative;
      z-index: 1;
    }
    .insight-card {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-left: 4px solid #F59E0B;
      border-radius: 0 12px 12px 0;
      padding: 24px 28px;
      width: 100%;
      text-align: left;
      position: relative;
      z-index: 1;
    }
    .insight-title {
      font-size: 24px;
      font-weight: 700;
      color: #F59E0B;
      margin-bottom: 8px;
    }
    .insight-desc {
      font-size: 22px;
      color: #B0B0CC;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="bg-glow"></div>
    <div class="quote-mark">&ldquo;</div>
    <div class="quote-text">
      人类睡眠在整合白天的碎片记忆，<span class="purple">Dreaming</span> 就是 AI 版的<span class="yellow">睡眠巩固</span>
    </div>
    <div class="attribution">&mdash; Troy Hua / CMU Agentic Memory 研究</div>
    <div class="insight-card">
      <div class="insight-title">感知成本 = 零</div>
      <div class="insight-desc">L5 &amp; L6 标注 Free*，星号 = 后台运行不阻塞用户。实际消耗资源，但用户感知为零。</div>
    </div>
  </div>
</body>
</html>
