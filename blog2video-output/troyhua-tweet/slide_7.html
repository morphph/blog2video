<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .slide-label {
      font-size: 24px;
      color: #3B82F6;
      letter-spacing: 3px;
      margin-bottom: 28px;
      font-weight: 600;
    }
    .title {
      font-size: 44px;
      font-weight: 900;
      margin-bottom: 44px;
      line-height: 1.3;
    }
    .title .blue { color: #3B82F6; }
    .focus-card {
      background: #1A1A2E;
      border: 2px solid rgba(59, 130, 246, 0.3);
      border-radius: 16px;
      padding: 32px 28px;
      width: 100%;
      text-align: left;
      margin-bottom: 24px;
    }
    .focus-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;
    }
    .focus-icon {
      font-size: 36px;
    }
    .focus-name {
      font-size: 30px;
      font-weight: 800;
      color: #3B82F6;
    }
    .focus-body {
      font-size: 24px;
      color: #B0B0CC;
      line-height: 1.6;
    }
    .focus-body .white { color: #FFFFFF; font-weight: 700; }
    .kv-section {
      width: 100%;
      background: rgba(16, 185, 129, 0.04);
      border: 1px solid rgba(16, 185, 129, 0.2);
      border-left: 4px solid #10B981;
      border-radius: 0 12px 12px 0;
      padding: 24px 28px;
      text-align: left;
      margin-bottom: 24px;
    }
    .kv-title {
      font-size: 24px;
      font-weight: 700;
      color: #10B981;
      margin-bottom: 8px;
    }
    .kv-desc {
      font-size: 22px;
      color: #B0B0CC;
      line-height: 1.5;
    }
    .conclusion-box {
      background: rgba(139, 92, 246, 0.06);
      border: 2px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 20px 28px;
      width: 100%;
    }
    .conclusion-text {
      font-size: 26px;
      font-weight: 700;
      color: #8B5CF6;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="slide-label">LAYER 7 &middot; CROSS-AGENT</div>
    <div class="title">Fork Agent 为什么<span class="blue">几乎免费</span></div>
    <div class="focus-card">
      <div class="focus-header">
        <span class="focus-icon">🔀</span>
        <span class="focus-name">Fork Agent</span>
      </div>
      <div class="focus-body">不创建新上下文，<span class="white">直接继承父 Agent 的完整历史</span>。继承是字节级完全一致的。</div>
    </div>
    <div class="kv-section">
      <div class="kv-title">KV Cache 前缀匹配</div>
      <div class="kv-desc">已计算的上下文不需要重算，Fork 的前缀和父 Agent 一模一样 &rarr; 边际推理成本接近零</div>
    </div>
    <div class="conclusion-box">
      <div class="conclusion-text">Fork 几乎免费，Named Agent 从零构建</div>
    </div>
  </div>
</body>
</html>
