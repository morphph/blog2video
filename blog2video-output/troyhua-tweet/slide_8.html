<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .slide-label {
      font-size: 24px;
      color: #8B5CF6;
      letter-spacing: 3px;
      margin-bottom: 28px;
      font-weight: 600;
    }
    .title {
      font-size: 44px;
      font-weight: 900;
      margin-bottom: 48px;
      line-height: 1.3;
    }
    .title .purple { color: #8B5CF6; }
    .scopes {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
      margin-bottom: 32px;
    }
    .scope-card {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      padding: 24px 28px;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .scope-user { border-left: 4px solid #3B82F6; }
    .scope-project { border-left: 4px solid #8B5CF6; }
    .scope-local { border-left: 4px solid #6B7280; }
    .scope-icon {
      font-size: 36px;
      flex-shrink: 0;
    }
    .scope-content { flex: 1; }
    .scope-name {
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 4px;
    }
    .name-blue { color: #3B82F6; }
    .name-purple { color: #8B5CF6; }
    .name-gray { color: #6B7280; }
    .scope-desc {
      font-size: 21px;
      color: #B0B0CC;
      line-height: 1.4;
    }
    .scope-path {
      font-size: 17px;
      color: #6B7280;
      font-family: 'JetBrains Mono', monospace;
      margin-top: 4px;
    }
    .highlight-box {
      background: rgba(139, 92, 246, 0.06);
      border: 2px solid rgba(139, 92, 246, 0.25);
      border-radius: 16px;
      padding: 24px 28px;
      width: 100%;
    }
    .highlight-title {
      font-size: 26px;
      font-weight: 800;
      color: #8B5CF6;
      margin-bottom: 8px;
    }
    .highlight-desc {
      font-size: 22px;
      color: #B0B0CC;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="slide-label">MEMORY SCOPES</div>
    <div class="title">三个<span class="purple">记忆作用域</span></div>
    <div class="scopes">
      <div class="scope-card scope-user">
        <div class="scope-icon">🌐</div>
        <div class="scope-content">
          <div class="scope-name name-blue">User 级别</div>
          <div class="scope-desc">用户主目录，全局记忆</div>
          <div class="scope-path">~/.claude/</div>
        </div>
      </div>
      <div class="scope-card scope-project">
        <div class="scope-icon">📁</div>
        <div class="scope-content">
          <div class="scope-name name-purple">Project 级别</div>
          <div class="scope-desc">项目 .claude 目录，通过 VCS 共享</div>
          <div class="scope-path">.claude/</div>
        </div>
      </div>
      <div class="scope-card scope-local">
        <div class="scope-icon">🔒</div>
        <div class="scope-content">
          <div class="scope-name name-gray">Local 级别</div>
          <div class="scope-desc">不进版本控制，个人本地</div>
          <div class="scope-path">.gitignore</div>
        </div>
      </div>
    </div>
    <div class="highlight-box">
      <div class="highlight-title">隐性团队知识管理</div>
      <div class="highlight-desc">一个人教会的项目知识，通过 Git 同步给全团队</div>
    </div>
  </div>
</body>
</html>
