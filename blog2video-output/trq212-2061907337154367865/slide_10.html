<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .glow {
      position: absolute;
      top: 35%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 1200px;
      height: 800px;
      background: radial-gradient(ellipse at center, rgba(16, 185, 129, 0.13) 0%, rgba(13, 13, 26, 0) 65%);
      pointer-events: none;
      z-index: 0;
    }
    .eyebrow {
      font-size: 28px;
      color: #10B981;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 32px;
      z-index: 1;
    }
    .title {
      font-size: 54px;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 48px;
      z-index: 1;
    }
    .lang-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 28px;
      margin-bottom: 48px;
      z-index: 1;
    }
    .lang {
      font-family: 'SF Mono', Menlo, monospace;
      font-size: 76px;
      font-weight: 900;
      letter-spacing: -2px;
    }
    .lang.zig { color: #6B7280; text-decoration: line-through; }
    .lang.rust { color: #F59E0B; }
    .big-arrow {
      font-size: 60px;
      color: #10B981;
      font-weight: 800;
    }
    .pipeline {
      background: #1A1A2E;
      border: 1px solid rgba(16, 185, 129, 0.35);
      border-left: 4px solid #10B981;
      border-radius: 12px;
      padding: 28px 32px;
      width: 100%;
      z-index: 1;
      text-align: left;
    }
    .p-label {
      font-size: 22px;
      color: #10B981;
      letter-spacing: 2px;
      font-weight: 700;
      margin-bottom: 18px;
    }
    .steps {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .step {
      font-size: 26px;
      color: #FFFFFF;
      font-weight: 600;
      line-height: 1.4;
    }
    .step .green { color: #10B981; font-weight: 800; }
    .step .arrow { color: #6B7280; margin: 0 6px; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="glow"></div>
    <div class="eyebrow">非常硬的事实</div>
    <div class="title">Bun runtime 重写</div>
    <div class="lang-row">
      <div class="lang zig">Zig</div>
      <div class="big-arrow">→</div>
      <div class="lang rust">Rust</div>
    </div>
    <div class="pipeline">
      <div class="p-label">DYNAMIC WORKFLOW 三件套</div>
      <div class="steps">
        <div class="step">1 · <span class="green">拆点</span><span class="arrow">·</span>每个 callsite / 测试 / 模块</div>
        <div class="step">2 · <span class="green">worktree 隔离</span><span class="arrow">·</span>subagent 并行改写</div>
        <div class="step">3 · <span class="green">adversarial review</span><span class="arrow">·</span>过了才 merge</div>
      </div>
    </div>
  </div>
</body>
</html>
