<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .glow {
      position: absolute;
      top: 38%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 1200px;
      height: 800px;
      background: radial-gradient(ellipse at center, rgba(239, 68, 68, 0.13) 0%, rgba(13, 13, 26, 0) 65%);
      pointer-events: none;
      z-index: 0;
    }
    .eyebrow {
      font-size: 28px;
      color: #EF4444;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 24px;
      z-index: 1;
    }
    .title {
      font-size: 56px;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 16px;
      z-index: 1;
    }
    .title .amber { color: #F59E0B; }
    .sub {
      font-size: 24px;
      color: #B0B0CC;
      margin-bottom: 40px;
      z-index: 1;
      line-height: 1.4;
    }
    .sub .red { color: #EF4444; font-weight: 700; }
    .two {
      display: flex;
      gap: 22px;
      width: 100%;
      z-index: 1;
    }
    .agent-card {
      flex: 1;
      background: #1A1A2E;
      border-radius: 12px;
      padding: 26px 24px;
      text-align: left;
    }
    .agent-card.reader {
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-left: 4px solid #EF4444;
    }
    .agent-card.actor {
      border: 1px solid rgba(16, 185, 129, 0.35);
      border-left: 4px solid #10B981;
    }
    .ac-label {
      font-size: 20px;
      letter-spacing: 2px;
      font-weight: 700;
      margin-bottom: 14px;
    }
    .agent-card.reader .ac-label { color: #EF4444; }
    .agent-card.actor .ac-label { color: #10B981; }
    .ac-role {
      font-size: 26px;
      color: #FFFFFF;
      font-weight: 800;
      margin-bottom: 16px;
      line-height: 1.3;
    }
    .ac-list {
      list-style: none;
    }
    .ac-list li {
      font-size: 20px;
      color: #B0B0CC;
      line-height: 1.5;
      margin-bottom: 6px;
      padding-left: 18px;
      position: relative;
    }
    .ac-list li::before {
      content: '·';
      position: absolute;
      left: 4px;
      font-weight: 800;
    }
    .ac-list .yes { color: #10B981; font-weight: 700; }
    .ac-list .no { color: #EF4444; font-weight: 700; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="glow"></div>
    <div class="eyebrow">安全细节 · quarantine 模式</div>
    <div class="title">
      看见外部内容<br>
      &amp; 产生外部影响 <span class="amber">分开</span>
    </div>
    <div class="sub">support ticket / Slack 消息里可能藏 <span class="red">prompt injection</span></div>
    <div class="two">
      <div class="agent-card reader">
        <div class="ac-label">READER AGENT</div>
        <div class="ac-role">读不可信内容</div>
        <ul class="ac-list">
          <li><span class="no">✗</span> 不能高权限操作</li>
          <li><span class="yes">✓</span> 只产出结构化信息</li>
        </ul>
      </div>
      <div class="agent-card actor">
        <div class="ac-label">ACTOR AGENT</div>
        <div class="ac-role">执行高权限操作</div>
        <ul class="ac-list">
          <li><span class="no">✗</span> 不读原始内容</li>
          <li><span class="yes">✓</span> 只读结构化结果</li>
        </ul>
      </div>
    </div>
  </div>
</body>
</html>
