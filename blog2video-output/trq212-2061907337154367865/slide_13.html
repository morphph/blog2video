<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .glow {
      position: absolute;
      top: 38%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 1200px;
      height: 800px;
      background: radial-gradient(ellipse at center, rgba(245, 158, 11, 0.13) 0%, rgba(13, 13, 26, 0) 65%);
      pointer-events: none;
      z-index: 0;
    }
    .eyebrow {
      font-size: 28px;
      color: #F59E0B;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 32px;
      z-index: 1;
    }
    .title {
      font-size: 60px;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 48px;
      z-index: 1;
    }
    .title .amber { color: #F59E0B; }
    .stat {
      background: #1A1A2E;
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-left: 4px solid #F59E0B;
      border-radius: 12px;
      padding: 36px 32px;
      width: 100%;
      z-index: 1;
      margin-bottom: 28px;
      text-align: left;
    }
    .stat-label {
      font-size: 22px;
      color: #F59E0B;
      letter-spacing: 2px;
      font-weight: 700;
      margin-bottom: 14px;
    }
    .big {
      font-size: 64px;
      font-weight: 800;
      color: #F59E0B;
      letter-spacing: -1px;
      margin-bottom: 14px;
      line-height: 1.1;
    }
    .stat-body {
      font-size: 24px;
      color: #B0B0CC;
      line-height: 1.5;
    }
    .verdict {
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-radius: 12px;
      padding: 28px 32px;
      font-size: 28px;
      color: #FFFFFF;
      font-weight: 700;
      line-height: 1.45;
      width: 100%;
      z-index: 1;
    }
    .verdict .red { color: #EF4444; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="glow"></div>
    <div class="eyebrow">讲爽点也要讲代价</div>
    <div class="title">
      Token <span class="amber">显著上涨</span>
    </div>
    <div class="stat">
      <div class="stat-label">每用一份对抗式 REVIEW</div>
      <div class="big">= 双倍模型调用</div>
      <div class="stat-body">每个 subagent 都要装一份 context、跑一遍模型、产生一份输出</div>
    </div>
    <div class="verdict">
      "大多数传统编码任务<br>
      <span class="red">不需要 5 个 reviewer 组成的 panel</span>"
    </div>
  </div>
</body>
</html>
