<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .glow {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 1100px;
      height: 700px;
      background: radial-gradient(ellipse at center, rgba(239, 68, 68, 0.1) 0%, rgba(13, 13, 26, 0) 65%);
      pointer-events: none;
      z-index: 0;
    }
    .eyebrow {
      font-size: 28px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 600;
      margin-bottom: 40px;
      z-index: 1;
    }
    .title {
      font-size: 64px;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 56px;
      z-index: 1;
    }
    .window {
      background: #1A1A2E;
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      z-index: 1;
      margin-bottom: 40px;
    }
    .window-label {
      font-size: 22px;
      color: #EF4444;
      letter-spacing: 2px;
      font-weight: 700;
      margin-bottom: 24px;
    }
    .stack {
      display: flex;
      gap: 16px;
      justify-content: center;
    }
    .chip {
      flex: 1;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.4);
      border-radius: 10px;
      padding: 28px 16px;
      font-size: 36px;
      font-weight: 800;
      color: #EF4444;
    }
    .vs {
      font-size: 32px;
      color: #6B7280;
      font-weight: 600;
      align-self: center;
    }
    .verdict {
      font-size: 36px;
      color: #FFFFFF;
      font-weight: 700;
      line-height: 1.4;
      z-index: 1;
    }
    .verdict .red { color: #EF4444; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="glow"></div>
    <div class="eyebrow">Thariq 的诊断</div>
    <div class="title">
      为什么单纯的<br>
      Claude Code 不够？
    </div>
    <div class="window">
      <div class="window-label">同一个上下文窗口里</div>
      <div class="stack">
        <div class="chip">规划</div>
        <div class="vs">+</div>
        <div class="chip">执行</div>
      </div>
    </div>
    <div class="verdict">
      长跑 · 大规模并行 · 对抗式验证<br>
      → <span class="red">三种系统性失败</span>
    </div>
  </div>
</body>
</html>
