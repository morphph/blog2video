<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .glow {
      position: absolute;
      top: 36%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 1200px;
      height: 800px;
      background: radial-gradient(ellipse at center, rgba(139, 92, 246, 0.13) 0%, rgba(13, 13, 26, 0) 65%);
      pointer-events: none;
      z-index: 0;
    }
    .eyebrow {
      font-size: 28px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 600;
      margin-bottom: 32px;
      z-index: 1;
    }
    .title {
      font-size: 60px;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 48px;
      z-index: 1;
    }
    .title .red { color: #EF4444; }
    .principle {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-left: 4px solid #8B5CF6;
      border-radius: 12px;
      padding: 32px 36px;
      text-align: left;
      margin-bottom: 28px;
      width: 100%;
      z-index: 1;
    }
    .p-label {
      font-size: 22px;
      color: #8B5CF6;
      letter-spacing: 2px;
      font-weight: 700;
      margin-bottom: 14px;
    }
    .p-body {
      font-size: 32px;
      color: #FFFFFF;
      font-weight: 700;
      line-height: 1.4;
    }
    .p-body .red { color: #EF4444; }
    .p-body .amber { color: #F59E0B; }
    .solution {
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.35);
      border-left: 4px solid #10B981;
      border-radius: 12px;
      padding: 28px 32px;
      text-align: left;
      width: 100%;
      z-index: 1;
    }
    .s-label {
      font-size: 22px;
      color: #10B981;
      letter-spacing: 2px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .s-body {
      font-size: 28px;
      color: #FFFFFF;
      line-height: 1.45;
      font-weight: 500;
    }
    .s-body .green { color: #10B981; font-weight: 700; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="glow"></div>
    <div class="eyebrow">归因到结构 · 不是模型能力</div>
    <div class="title">
      单窗口的<span class="red">死路</span>
    </div>
    <div class="principle">
      <div class="p-label">结构性病灶</div>
      <div class="p-body">
        Plan + Execute <span class="red">共用一个 context</span><br>
        → 无论什么 prompt、多强模型，<span class="amber">三种失败必然出现</span>
      </div>
    </div>
    <div class="solution">
      <div class="s-label">结构性解药</div>
      <div class="s-body">
        多个 Claude · 多个 context window<br>
        <span class="green">目标隔离 · 视野隔离</span>
      </div>
    </div>
  </div>
</body>
</html>
