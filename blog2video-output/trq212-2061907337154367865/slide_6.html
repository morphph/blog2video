<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .glow {
      position: absolute;
      top: 38%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 1200px;
      height: 800px;
      background: radial-gradient(ellipse at center, rgba(59, 130, 246, 0.1) 0%, rgba(13, 13, 26, 0) 65%);
      pointer-events: none;
      z-index: 0;
    }
    .eyebrow {
      font-size: 28px;
      color: #3B82F6;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 32px;
      z-index: 1;
    }
    .title {
      font-size: 60px;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 48px;
      z-index: 1;
    }
    .title .blue { color: #3B82F6; }
    .file {
      background: #1A1A2E;
      border: 1px solid rgba(59, 130, 246, 0.35);
      border-left: 4px solid #3B82F6;
      border-radius: 12px;
      padding: 32px 32px;
      text-align: left;
      width: 100%;
      z-index: 1;
      margin-bottom: 28px;
    }
    .file-name {
      font-family: 'SF Mono', Menlo, monospace;
      font-size: 28px;
      color: #3B82F6;
      margin-bottom: 18px;
      font-weight: 700;
    }
    .funcs {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .func {
      font-family: 'SF Mono', Menlo, monospace;
      font-size: 24px;
      color: #FFFFFF;
      line-height: 1.4;
    }
    .func .key { color: #F59E0B; font-weight: 700; }
    .func .comment { color: #6B7280; }
    .trigger {
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-radius: 12px;
      padding: 28px 32px;
      font-size: 30px;
      color: #FFFFFF;
      font-weight: 700;
      width: 100%;
      z-index: 1;
    }
    .trigger .amber { color: #F59E0B; font-family: 'SF Mono', Menlo, monospace; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="glow"></div>
    <div class="eyebrow">机制</div>
    <div class="title">
      本质是一份<br>
      <span class="blue">JavaScript 文件</span>
    </div>
    <div class="file">
      <div class="file-name">workflow.js</div>
      <div class="funcs">
        <div class="func"><span class="key">spawn</span>(subagent) <span class="comment">// 拉起子 agent</span></div>
        <div class="func"><span class="key">model</span>: sonnet / opus <span class="comment">// 指定模型</span></div>
        <div class="func"><span class="key">worktree</span>: isolated <span class="comment">// 独立分支</span></div>
        <div class="func">+ JSON / Math / Array</div>
      </div>
    </div>
    <div class="trigger">
      触发词 <span class="amber">ultracode</span> · 中断也能 resume
    </div>
  </div>
</body>
</html>
