<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .glow {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 1200px;
      height: 800px;
      background: radial-gradient(ellipse at center, rgba(139, 92, 246, 0.12) 0%, rgba(13, 13, 26, 0) 65%);
      pointer-events: none;
      z-index: 0;
    }
    .eyebrow {
      font-size: 28px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 28px;
      z-index: 1;
    }
    .title {
      font-size: 60px;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 48px;
      z-index: 1;
    }
    .title .amber { color: #F59E0B; }
    .cards {
      display: flex;
      gap: 22px;
      width: 100%;
      z-index: 1;
      margin-bottom: 32px;
    }
    .card {
      flex: 1;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.25);
      border-radius: 12px;
      padding: 32px 28px;
      text-align: left;
    }
    .card.static { border-left: 4px solid #6B7280; }
    .card.dynamic { border-left: 4px solid #10B981; }
    .card-label {
      font-size: 22px;
      letter-spacing: 2px;
      font-weight: 700;
      margin-bottom: 14px;
    }
    .card.static .card-label { color: #6B7280; }
    .card.dynamic .card-label { color: #10B981; }
    .card-title {
      font-size: 30px;
      color: #FFFFFF;
      font-weight: 800;
      margin-bottom: 18px;
      line-height: 1.3;
    }
    .card-body {
      font-size: 22px;
      color: #B0B0CC;
      line-height: 1.5;
    }
    .card-body .hl { color: #F59E0B; font-weight: 700; }
    .card-body .red { color: #EF4444; font-weight: 700; }
    .card-body .green { color: #10B981; font-weight: 700; }
    .flip {
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-radius: 12px;
      padding: 24px 28px;
      font-size: 26px;
      color: #FFFFFF;
      font-weight: 700;
      line-height: 1.4;
      width: 100%;
      z-index: 1;
    }
    .flip .amber { color: #F59E0B; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="glow"></div>
    <div class="eyebrow">最反直觉的判断</div>
    <div class="title">
      <span class="amber">通用 ≠ 专业</span><br>
      <span class="amber">临时 ≠ 糙</span>
    </div>
    <div class="cards">
      <div class="card static">
        <div class="card-label">STATIC</div>
        <div class="card-title">必须照顾<br>所有 edge case</div>
        <div class="card-body">→ 一定写得<span class="red">通用</span><br>→ 一定写得<span class="red">平均</span></div>
      </div>
      <div class="card dynamic">
        <div class="card-label">DYNAMIC</div>
        <div class="card-title">只为这一个<br>prompt 服务</div>
        <div class="card-body">→ 放弃<span class="green">通用性</span><br>→ 换<span class="green">深度</span></div>
      </div>
    </div>
    <div class="flip">
      "写好的因为应对所有人 → 平均化<br>临时拼的因为只服务一个人 → <span class="amber">反而更精</span>"
    </div>
  </div>
</body>
</html>
