<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px; background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%; padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      text-align: center; position: relative;
    }
    .glow {
      position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%);
      width: 960px; height: 640px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.18) 0%, rgba(13, 13, 26, 0) 70%);
      pointer-events: none;
    }
    .kicker { font-size: 30px; color: #8B5CF6; letter-spacing: 3px; font-weight: 700; margin-bottom: 40px; }
    .title { font-size: 82px; font-weight: 900; line-height: 1.24; position: relative; margin-bottom: 40px; }
    .hl { color: #F59E0B; }
    .sub { font-size: 34px; color: #B0B0CC; line-height: 1.5; margin-bottom: 72px; position: relative; }
    .cards { display: flex; gap: 28px; width: 100%; position: relative; }
    .card {
      flex: 1; background: #1A1A2E; border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px; padding: 40px 26px; text-align: left;
    }
    .card.a { border-left: 4px solid #6B7280; }
    .card.b { border-left: 4px solid #EF4444; }
    .card .big { font-size: 64px; font-weight: 800; line-height: 1; margin-bottom: 18px; }
    .card.a .big { color: #6B7280; }
    .card.b .big { color: #EF4444; }
    .card .desc { font-size: 30px; color: #B0B0CC; line-height: 1.42; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="glow"></div>
    <div class="kicker">FINDING YOUR UNKNOWNS</div>
    <div class="title">
      模型太强，<br>
      反而<span class="hl">卡在你这一环</span>？
    </div>
    <div class="sub">头一回，作品好坏不取决于模型</div>
    <div class="cards">
      <div class="card a">
        <div class="big">不是模型</div>
        <div class="desc">决定成品的，<br>第一次不再是它</div>
      </div>
      <div class="card b">
        <div class="big">是你</div>
        <div class="desc">你能不能说清<br>"不知道的那部分"</div>
      </div>
    </div>
  </div>
</body>
</html>
