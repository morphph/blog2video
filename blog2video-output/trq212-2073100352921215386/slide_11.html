<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px; background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%; padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      text-align: center; position: relative;
    }
    .label { font-size: 30px; color: #8B5CF6; letter-spacing: 3px; font-weight: 700; margin-bottom: 30px; }
    .title { font-size: 74px; font-weight: 900; line-height: 1.2; margin-bottom: 40px; }
    .title .hl { color: #F59E0B; }
    .title code { font-family: 'JetBrains Mono', monospace; color: #10B981; }
    .why {
      width: 100%; background: #1A1A2E; border: 1px solid rgba(239,68,68,.25);
      border-left: 4px solid #EF4444; border-radius: 12px; padding: 28px 28px; text-align: left;
      font-size: 29px; color: #B0B0CC; line-height: 1.5; margin-bottom: 24px;
    }
    .why b { color: #EF4444; font-weight: 700; }
    .method {
      width: 100%; background: #1A1A2E; border: 1px solid rgba(139,92,246,.3);
      border-left: 4px solid #8B5CF6; border-radius: 12px; padding: 32px 28px; text-align: left;
      font-size: 32px; color: #FFFFFF; line-height: 1.5; margin-bottom: 26px;
    }
    .method b { color: #F59E0B; font-weight: 800; }
    .anchor { font-size: 29px; color: #6B7280; line-height: 1.45; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="label">BEFORE YOU MERGE</div>
    <div class="title">考过测验，<br>才 <span class="hl">merge</span></div>
    <div class="why">一次长会话，Claude 做成的往往比你以为的<b>多得多</b>。光扫一眼代码 diff，你只能看个大概。</div>
    <div class="method">让它先给足上下文，再就这次改动出一份<b>小测验考我</b>——只有考满分，才合并。</div>
    <div class="anchor">这不是自虐，是逼你把改动真正吃进脑子里</div>
  </div>
</body>
</html>
