<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px; background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%; padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      text-align: center; position: relative;
    }
    .label { font-size: 30px; color: #8B5CF6; letter-spacing: 3px; font-weight: 700; margin-bottom: 22px; }
    .title { font-size: 62px; font-weight: 900; line-height: 1.24; margin-bottom: 16px; }
    .title .hl { color: #F59E0B; }
    .ctx { font-size: 29px; color: #B0B0CC; line-height: 1.45; margin-bottom: 40px; }
    .ctx b { color: #EF4444; font-weight: 700; }
    .steps { width: 100%; display: flex; flex-direction: column; gap: 18px; }
    .s { display: flex; align-items: flex-start; gap: 20px; background: #1A1A2E; border: 1px solid rgba(139,92,246,.2); border-left: 4px solid #8B5CF6; border-radius: 12px; padding: 26px 26px; text-align: left; }
    .s .n { font-family: 'JetBrains Mono', monospace; font-size: 28px; font-weight: 800; color: #8B5CF6; min-width: 40px; }
    .s .t { font-size: 30px; color: #FFFFFF; line-height: 1.45; }
    .s .t b { color: #F59E0B; font-weight: 700; }
    .s .t code { font-family: 'JetBrains Mono', monospace; color: #10B981; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="label">CASE STUDY · FABLE</div>
    <div class="title">实战：<span class="hl">Fable 发布视频</span></div>
    <div class="ctx">整段用 Claude Code 剪出来，剪它的人 <b>此前对剪辑完全外行</b></div>
    <div class="steps">
      <div class="s"><div class="n">01</div><div class="t">从已知的一点点出发：知道 Claude 能剪、能转录，<b>但不确定准不准</b></div></div>
      <div class="s"><div class="n">02</div><div class="t">先让 Claude 讲明白 <code>Whisper</code> 转录怎么工作，能不能精确切掉"呃""嗯"和停顿</div></div>
      <div class="s"><div class="n">03</div><div class="t">想要字幕跟节奏严丝合缝 → 让它拿转录先<b>做个原型</b>验证</div></div>
    </div>
  </div>
</body>
</html>
