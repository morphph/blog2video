<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px; background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%; padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      text-align: center; position: relative;
    }
    .label { font-size: 30px; color: #8B5CF6; letter-spacing: 3px; font-weight: 700; margin-bottom: 24px; }
    .title { font-size: 62px; font-weight: 900; line-height: 1.24; margin-bottom: 40px; }
    .title .hl { color: #F59E0B; }
    .points { width: 100%; display: flex; flex-direction: column; gap: 16px; margin-bottom: 34px; }
    .p { display: flex; align-items: flex-start; gap: 20px; background: #1A1A2E; border: 1px solid rgba(139,92,246,.2); border-left: 4px solid #8B5CF6; border-radius: 12px; padding: 24px 26px; text-align: left; }
    .p .n { font-family: 'JetBrains Mono', monospace; font-size: 28px; font-weight: 800; color: #8B5CF6; min-width: 40px; }
    .p .t { font-size: 29px; color: #FFFFFF; line-height: 1.45; }
    .p .t b { color: #F59E0B; font-weight: 700; }
    .cta {
      width: 100%; background: #12121F; border: 1px solid rgba(16,185,129,.35);
      border-left: 4px solid #10B981; border-radius: 12px; padding: 30px 28px; text-align: left; margin-bottom: 24px;
    }
    .cta .h { font-size: 27px; color: #6B7280; margin-bottom: 12px; }
    .cta .q { font-size: 33px; font-weight: 800; color: #10B981; line-height: 1.4; }
    .brand { font-size: 30px; font-weight: 800; color: #F59E0B; letter-spacing: 1px; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="label">SYNTHESIS</div>
    <div class="title">模型越强，认知负担<br><span class="hl">推回你身上</span></div>
    <div class="points">
      <div class="p"><div class="n">01</div><div class="t">它不是"<b>一句话出活</b>"的捷径</div></div>
      <div class="p"><div class="n">02</div><div class="t">旧问题"模型会不会做" → 新问题"<b>你有没有说清你不知道自己不知道的</b>"</div></div>
      <div class="p"><div class="n">03</div><div class="t">最贵的 bug，藏在你<b>从没写下来的那句话</b>里</div></div>
    </div>
    <div class="cta">
      <div class="h">// 下个项目开始前，先问一句</div>
      <div class="q">"帮我找找，我这次有哪些未知。"</div>
    </div>
    <div class="brand">精读一篇，胜过刷一百条</div>
  </div>
</body>
</html>
