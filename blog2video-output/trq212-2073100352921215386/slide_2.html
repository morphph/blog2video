<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px; background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%; padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      text-align: center; position: relative;
    }
    .label { font-size: 30px; color: #8B5CF6; letter-spacing: 3px; font-weight: 700; margin-bottom: 34px; }
    .title { font-size: 76px; font-weight: 900; line-height: 1.2; margin-bottom: 56px; }
    .title .hl { color: #F59E0B; }
    .duo { display: flex; gap: 28px; width: 100%; margin-bottom: 40px; }
    .box { flex: 1; background: #1A1A2E; border-radius: 12px; padding: 36px 26px; text-align: left; }
    .box.map { border: 1px solid rgba(139, 92, 246, 0.2); border-left: 4px solid #8B5CF6; }
    .box.terr { border: 1px solid rgba(16, 185, 129, 0.25); border-left: 4px solid #10B981; }
    .box .k { font-size: 40px; font-weight: 800; margin-bottom: 16px; }
    .box.map .k { color: #8B5CF6; }
    .box.terr .k { color: #10B981; }
    .box .v { font-size: 29px; color: #B0B0CC; line-height: 1.45; }
    .box .v b { color: #FFFFFF; font-weight: 700; }
    .gap {
      width: 100%; background: #1A1A2E; border: 1px solid rgba(245, 158, 11, 0.3);
      border-left: 4px solid #F59E0B; border-radius: 12px; padding: 32px 28px; text-align: left;
      font-size: 31px; color: #FFFFFF; line-height: 1.5;
    }
    .gap b { color: #F59E0B; font-weight: 800; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="label">FIRST PRINCIPLE</div>
    <div class="title">地图，<span class="hl">不是</span>地形</div>
    <div class="duo">
      <div class="box map">
        <div class="k">地图</div>
        <div class="v">你给 Claude 的<br><b>prompt · skill · context</b><br>脑子里那份"该怎么做"</div>
      </div>
      <div class="box terr">
        <div class="k">地形</div>
        <div class="v">真正做事的地方<br><b>代码库 · 真实世界</b><br>那些实打实的约束</div>
      </div>
    </div>
    <div class="gap">
      两者之间的那条缝，就是你的 <b>"未知"</b>。<br>
      Claude 撞上未知没法问你，只能<b>猜着往下走</b>。
    </div>
  </div>
</body>
</html>
