<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px; background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%; padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      text-align: center; position: relative;
    }
    .glow {
      position: absolute; top: 32%; left: 50%; transform: translate(-50%, -50%);
      width: 900px; height: 560px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.12) 0%, rgba(13, 13, 26, 0) 70%);
      pointer-events: none;
    }
    .label { font-size: 30px; color: #8B5CF6; letter-spacing: 3px; font-weight: 700; margin-bottom: 34px; position: relative; }
    .title { font-size: 70px; font-weight: 900; line-height: 1.25; margin-bottom: 26px; position: relative; }
    .title .hl { color: #F59E0B; }
    .myth {
      width: 100%; background: #1A1A2E; border: 1px solid rgba(239,68,68,.25);
      border-left: 4px solid #EF4444; border-radius: 12px; padding: 28px 26px; text-align: left;
      font-size: 29px; color: #B0B0CC; line-height: 1.5; margin-bottom: 24px; position: relative;
    }
    .myth s { color: #6B7280; }
    .truth {
      width: 100%; background: #1A1A2E; border: 1px solid rgba(16,185,129,.3);
      border-left: 4px solid #10B981; border-radius: 12px; padding: 32px 28px; text-align: left;
      font-size: 31px; color: #FFFFFF; line-height: 1.5; margin-bottom: 30px; position: relative;
    }
    .truth b { color: #10B981; font-weight: 800; }
    .core {
      width: 100%; font-size: 33px; font-weight: 800; color: #F59E0B; line-height: 1.4; position: relative;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="glow"></div>
    <div class="label">COUNTERINTUITIVE</div>
    <div class="title">顶尖高手，<br><span class="hl">主动为未知留余地</span></div>
    <div class="myth">误会：他们赢在"什么都懂、<s>几乎没有未知</s>"</div>
    <div class="truth">真相：他们同样默认<b>自己有未知</b>，并主动替它<b>留出余地</b>、做好准备</div>
    <div class="core">这，才是 agentic coding 真正的核心技能<br>—— 而且能练，最好的搭档就是 Claude</div>
  </div>
</body>
</html>
