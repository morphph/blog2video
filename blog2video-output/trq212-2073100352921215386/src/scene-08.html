    <div id="sub-2" class="clip sub" data-start="7.911" data-duration="7.624" data-track-index="5"><div class="sub-inner">这里藏着一个最容易被低估的点：最贵的未知，往往是第三种，那个"<span class="sub-k">未知的已知</span>"。</div></div>
    <div id="sub-3" class="clip sub" data-start="15.535" data-duration="4.815" data-track-index="5"><div class="sub-inner">就是你心里其实有杆秤、只是从没写下来的<span class="sub-k">隐性标准</span>。</div></div>
