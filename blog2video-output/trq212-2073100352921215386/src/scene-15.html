<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
/*@@BASE@@*/
/* —— scene-15 特有(末场景 5s 静音尾卡)—— */
[data-composition-id='s15'] .content.endcard{align-items:center;justify-content:center;text-align:center}
[data-composition-id='s15'] .logo{display:flex;align-items:center;justify-content:center;
  font-family:'MiSans',sans-serif;font-weight:900;font-size:176px;line-height:1;color:#edebe6;letter-spacing:-.01em}
[data-composition-id='s15'] .logo .lc{width:46px;height:120px;margin-left:26px;vertical-align:0}
[data-composition-id='s15'] .tagline{margin-top:52px;font-family:'JetBrains Mono',monospace;
  font-weight:500;font-size:46px;color:#8a8a85;letter-spacing:.14em}
[data-composition-id='s15'] .tagline .mid{color:#ccff4d;margin:0 6px}
</style>
</head>
<body>
  <div id="root" class="stage" data-composition-id="s15" data-start="0" data-duration="5" data-width="1080" data-height="1920">
    <div class="grid"></div>

    <div class="content endcard">
      <div class="logo">精读AI<span class="cur lc"></span></div>
      <div class="tagline">找出未知 <span class="mid">·</span> 完</div>
    </div>
  </div>

  <script>
  /*@@MOTION@@*/
  </script>
  <script>
  (function(){
    var R="[data-composition-id='s15'] ";
    var tl=gsap.timeline({paused:true});
    tl.from(R+'.grid',{opacity:0,duration:.5,ease:'power1.out'},.02);
    D2.enter(tl, R+'.logo', .25, {y:28, d:.5, ease:'expo.out'});
    tl.from(R+'.lc',{scaleY:0,transformOrigin:'center bottom',duration:.32,ease:'power3.out'},.38);
    D2.enter(tl, R+'.tagline', .9, {y:16, d:.42, ease:'power3.out'});
    D2.blink(tl, R+'.lc', 1.7, 5);
    D2.breath(tl, R+'.content', 5, 'in');
    window.__timelines = window.__timelines || {};
    window.__timelines['s15'] = tl;
  })();
  </script>
</body>
</html>
