<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
      background:
        radial-gradient(circle at 25% 18%, rgba(239, 68, 68, 0.14), transparent 55%),
        radial-gradient(circle at 80% 78%, rgba(139, 92, 246, 0.14), transparent 55%),
        #0D0D1A;
    }
    .tag {
      font-size: 28px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 56px;
    }
    .headline {
      font-size: 84px;
      font-weight: 900;
      line-height: 1.18;
      letter-spacing: -1px;
      margin-bottom: 48px;
    }
    .headline .red { color: #EF4444; }
    .headline .yellow { color: #F59E0B; }
    .stats {
      display: flex;
      gap: 32px;
      margin-bottom: 48px;
    }
    .stat {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.25);
      border-radius: 12px;
      padding: 20px 28px;
    }
    .stat .num {
      font-size: 56px;
      font-weight: 800;
      color: #F59E0B;
      line-height: 1;
      margin-bottom: 8px;
    }
    .stat .lbl {
      font-size: 22px;
      color: #B0B0CC;
      font-weight: 600;
      letter-spacing: 1px;
    }
    .sub {
      font-size: 34px;
      color: #B0B0CC;
      line-height: 1.45;
      font-weight: 600;
      max-width: 880px;
    }
    .sub .em { color: #F59E0B; font-weight: 800; }
    .sub .k { color: #8B5CF6; font-weight: 800; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="tag">精读AI · Claude Code</div>
    <div class="headline">
      Anthropic 工程师<br>
      不再让 Claude 写<br>
      <span class="red">markdown</span> 了
    </div>
    <div class="stats">
      <div class="stat">
        <div class="num">3.4M</div>
        <div class="lbl">阅读</div>
      </div>
      <div class="stat">
        <div class="num">13K</div>
        <div class="lbl">收藏</div>
      </div>
    </div>
    <div class="sub">
      不聊"怎么让 <span class="k">Claude</span> 写 HTML"<br>
      只聊：怎么<span class="em">不被 AI 替代决策</span>
    </div>
  </div>
</body>
</html>
