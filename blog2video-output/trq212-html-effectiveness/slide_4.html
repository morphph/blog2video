<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
      background:
        radial-gradient(circle at 50% 28%, rgba(16, 185, 129, 0.10), transparent 60%),
        #0D0D1A;
    }
    .eyebrow {
      font-size: 26px;
      color: #10B981;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 32px;
    }
    .quote {
      font-size: 60px;
      font-weight: 900;
      line-height: 1.22;
      letter-spacing: -1px;
      margin-bottom: 36px;
    }
    .quote .g { color: #10B981; }
    .divider {
      width: 80px; height: 4px;
      background: #10B981;
      margin-bottom: 36px;
      border-radius: 2px;
    }
    .funnel {
      display: flex;
      align-items: center;
      gap: 24px;
      margin-bottom: 36px;
    }
    .pill {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 16px;
      padding: 24px 32px;
      min-width: 220px;
    }
    .pill.from { border-left: 4px solid #EF4444; }
    .pill.to { border-left: 4px solid #10B981; }
    .pill .num {
      font-size: 72px;
      font-weight: 900;
      line-height: 1;
      margin-bottom: 6px;
    }
    .pill.from .num { color: #EF4444; }
    .pill.to .num { color: #10B981; }
    .pill .lbl {
      font-size: 22px;
      color: #B0B0CC;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .arrow {
      font-size: 56px;
      color: #8B5CF6;
      font-weight: 900;
    }
    .principle {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-left: 4px solid #8B5CF6;
      border-radius: 12px;
      padding: 28px 32px;
      max-width: 920px;
      width: 100%;
      text-align: left;
    }
    .principle .label {
      font-size: 22px;
      color: #8B5CF6;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }
    .principle .text {
      font-size: 28px;
      color: #FFFFFF;
      font-weight: 700;
      line-height: 1.45;
    }
    .principle .text .em { color: #F59E0B; font-weight: 800; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="eyebrow">真正的论点</div>
    <div class="quote">
      不是密度<br>
      是<span class="g">触达率</span>
    </div>
    <div class="divider"></div>
    <div class="funnel">
      <div class="pill from">
        <div class="num">30%</div>
        <div class="lbl">markdown</div>
      </div>
      <div class="arrow">→</div>
      <div class="pill to">
        <div class="num">80%</div>
        <div class="lbl">HTML</div>
      </div>
    </div>
    <div class="principle">
      <div class="label">CORE INSIGHT</div>
      <div class="text">
        不是"读得更高效"<br>
        是<span class="em">读这件事真的会发生</span>
      </div>
    </div>
  </div>
</body>
</html>
