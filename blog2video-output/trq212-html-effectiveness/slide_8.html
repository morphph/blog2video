<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
      background:
        radial-gradient(circle at 50% 22%, rgba(239, 68, 68, 0.10), transparent 60%),
        #0D0D1A;
    }
    .eyebrow {
      font-size: 26px;
      color: #EF4444;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 28px;
    }
    .title {
      font-size: 60px;
      font-weight: 900;
      line-height: 1.18;
      letter-spacing: -1px;
      margin-bottom: 14px;
    }
    .title .r { color: #EF4444; }
    .subtitle {
      font-size: 26px;
      color: #B0B0CC;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 30px;
    }
    .divider {
      width: 80px; height: 4px;
      background: #EF4444;
      margin-bottom: 30px;
      border-radius: 2px;
    }
    .list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      max-width: 920px;
    }
    .item {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-left: 4px solid #EF4444;
      border-radius: 12px;
      padding: 18px 24px;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 18px;
    }
    .item .num {
      font-size: 36px;
      font-weight: 900;
      color: #EF4444;
      min-width: 50px;
      text-align: center;
    }
    .item .body {
      flex: 1;
    }
    .item .head {
      font-size: 26px;
      color: #FFFFFF;
      font-weight: 800;
      margin-bottom: 4px;
    }
    .item .head .em { color: #F59E0B; }
    .item .head .k { color: #8B5CF6; }
    .item .desc {
      font-size: 20px;
      color: #B0B0CC;
      font-weight: 600;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="eyebrow">作者主动列出的代价</div>
    <div class="title">
      <span class="r">工程诚实</span>
    </div>
    <div class="subtitle">他没装作没成本</div>
    <div class="divider"></div>
    <div class="list">
      <div class="item">
        <div class="num">1</div>
        <div class="body">
          <div class="head"><span class="em">2-4×</span> 慢</div>
          <div class="desc">30 秒等待变两分钟</div>
        </div>
      </div>
      <div class="item">
        <div class="num">2</div>
        <div class="body">
          <div class="head">版本控制噩梦</div>
          <div class="desc">git diff 看不出实际改了什么</div>
        </div>
      </div>
      <div class="item">
        <div class="num">3</div>
        <div class="body">
          <div class="head">token 消耗高一个数量级</div>
          <div class="desc">靠 <span class="k">Opus 4.7</span> <span class="em">1MM</span> context 化解</div>
        </div>
      </div>
      <div class="item">
        <div class="num">4</div>
        <div class="body">
          <div class="head">默认产出可能丑</div>
          <div class="desc">需要内部设计系统当参考</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
