<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1920px; background:#0D0D1A;
    font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;
    color:#FFFFFF; overflow:hidden; }
  .cover { width:100%; height:100%; padding:100px 72px 400px 72px;
    display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; position:relative; }
  .cover::before { content:''; position:absolute; inset:0;
    background:radial-gradient(circle at 50% 35%, rgba(139,92,246,0.18) 0%, transparent 60%); }
  .series-tag { font-size:30px; color:#8B5CF6; letter-spacing:3px; font-weight:600; margin-bottom:60px; position:relative; }
  .title { font-size:96px; font-weight:900; line-height:1.2; color:#FFFFFF; margin-bottom:80px; position:relative; }
  .title .red { color:#EF4444; }
  .title .amber { color:#F59E0B; }
  .source { display:inline-block; padding:14px 32px; background:#1A1A30; border-radius:999px;
    font-size:22px; color:#6B6B80; position:relative; }
</style>
</head>
<body>
  <div class="cover">
    <div class="series-tag">精读AI · Agent 分层</div>
    <div class="title">
      你的 Agent<br>
      到 <span class="amber">Level</span> 几了？
    </div>
    <div class="source">Antonio Gulli · Agentic Design Patterns</div>
  </div>
</body>
</html>
