<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1920px; background:#0D0D1A;
    font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;
    color:#FFFFFF; overflow:hidden; }
  .slide { width:100%; height:100%; padding:200px 72px 420px 72px;
    display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; position:relative; }
  .slide::before { content:''; position:absolute; inset:0;
    background:radial-gradient(circle at 50% 30%, rgba(239,68,68,0.12) 0%, transparent 55%); }
  .kicker { font-size:30px; color:#8B5CF6; letter-spacing:3px; font-weight:600; margin-bottom:40px; position:relative; }
  .title { font-size:78px; font-weight:900; line-height:1.25; margin-bottom:60px; position:relative; }
  .title .red { color:#EF4444; }
  .verdict { width:100%; background:#1A1A2E; border:1px solid rgba(239,68,68,0.4);
    border-left:4px solid #EF4444; border-radius:12px; padding:36px 32px; text-align:left; position:relative; }
  .verdict-label { font-size:24px; color:#EF4444; font-weight:700; letter-spacing:2px; margin-bottom:18px; }
  .verdict-text { font-size:32px; font-weight:700; line-height:1.4; }
  .verdict-text strong { color:#F59E0B; }
</style>
</head>
<body>
  <div class="slide">
    <div class="kicker">453 页 / Google 工程总监</div>
    <div class="title">Level 0 的东西<br><span class="red">不算 Agent</span></div>
    <div class="verdict">
      <div class="verdict-label">书里的边界判定</div>
      <div class="verdict-text">没有工具、没有记忆、不会行动的<strong>裸 LLM</strong>——直接划出 Agent 范畴</div>
    </div>
  </div>
</body>
</html>
