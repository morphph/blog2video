<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1920px; background:#0D0D1A;
    font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;
    color:#FFFFFF; overflow:hidden; }
  .slide { width:100%; height:100%; padding:200px 72px 420px 72px;
    display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; position:relative; }
  .slide::before { content:''; position:absolute; inset:0;
    background:radial-gradient(circle at 50% 28%, rgba(139,92,246,0.15) 0%, transparent 58%); }
  .kicker { font-size:30px; color:#8B5CF6; letter-spacing:3px; font-weight:600; margin-bottom:36px; position:relative; }
  .title { font-size:84px; font-weight:900; line-height:1.2; margin-bottom:60px; position:relative; }
  .title .amber { color:#F59E0B; }
  .cards { width:100%; display:flex; flex-direction:column; gap:24px; position:relative; }
  .card { background:#1A1A2E; border:1px solid rgba(139,92,246,0.25); border-radius:12px;
    padding:32px 32px; text-align:left; }
  .card.red { border-left:4px solid #EF4444; }
  .card.amber { border-left:4px solid #F59E0B; }
  .card-label { font-size:22px; font-weight:800; letter-spacing:2px; margin-bottom:14px; }
  .card.red .card-label { color:#EF4444; }
  .card.amber .card-label { color:#F59E0B; }
  .card-text { font-size:30px; font-weight:700; line-height:1.4; }
  .card-text strong { color:#FFFFFF; }
  .card-text .strike { color:#6B7280; text-decoration:line-through; }
</style>
</head>
<body>
  <div class="slide">
    <div class="kicker">453 页 / Google 工程总监</div>
    <div class="title">你的 Agent<br>到 <span class="amber">Level 几</span>了？</div>
    <div class="cards">
      <div class="card red">
        <div class="card-label">悬念 1</div>
        <div class="card-text"><strong>Level 0 不算 Agent</strong><br>裸 LLM 直接被划出范畴</div>
      </div>
      <div class="card amber">
        <div class="card-label">悬念 2</div>
        <div class="card-text"><strong>Producer-Critic 不能同 persona</strong><br>同人格自审 = "挺好的"</div>
      </div>
    </div>
  </div>
</body>
</html>
