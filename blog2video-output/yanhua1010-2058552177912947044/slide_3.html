<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1920px; background:#0D0D1A;
    font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;
    color:#FFFFFF; overflow:hidden; }
  .slide { width:100%; height:100%; padding:200px 72px 420px 72px;
    display:flex; flex-direction:column; justify-content:center; align-items:center; }
  .kicker { font-size:28px; color:#8B5CF6; letter-spacing:3px; font-weight:600; margin-bottom:28px; }
  .title { font-size:62px; font-weight:900; line-height:1.3; margin-bottom:40px; text-align:center; }
  .title .amber { color:#F59E0B; }
  .definition { width:100%; background:#1A1A2E; border:1px solid rgba(139,92,246,0.25);
    border-left:4px solid #8B5CF6; border-radius:12px; padding:32px; margin-bottom:24px; text-align:left; }
  .def-label { font-size:22px; color:#8B5CF6; font-weight:700; letter-spacing:2px; margin-bottom:14px; }
  .def-text { font-size:30px; font-weight:700; line-height:1.4; }
  .def-text .strike { color:#EF4444; text-decoration:line-through; }
  .def-text .green { color:#10B981; }
  .metaphor { width:100%; background:linear-gradient(135deg,#1A1A2E,#2A1A3A);
    border:1px solid rgba(139,92,246,0.4); border-radius:12px; padding:32px; text-align:center; }
  .metaphor-line { font-size:38px; font-weight:800; line-height:1.4; margin-bottom:14px; }
  .metaphor-line .amber { color:#F59E0B; }
  .metaphor-line .purple { color:#8B5CF6; }
  .metaphor-sub { font-size:24px; color:#B0B0CC; }
</style>
</head>
<body>
  <div class="slide">
    <div class="kicker">Level 1 → Level 2 的死亡跳跃</div>
    <div class="title">Context Engineering<br>不是<span class="amber">堆信息</span></div>
    <div class="definition">
      <div class="def-label">书里的真定义</div>
      <div class="def-text"><span class="strike">堆信息</span><br><span class="green">裁剪 · 降噪 · 打包</span></div>
    </div>
    <div class="metaphor">
      <div class="metaphor-line">Prompt 是<span class="amber">台词</span><br>Context 是<span class="purple">布景</span></div>
      <div class="metaphor-sub">布景错了，台词再好也演不出来</div>
    </div>
  </div>
</body>
</html>
