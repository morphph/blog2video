<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1920px; background:#0D0D1A;
    font-family:-apple-system,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;
    color:#FFFFFF; overflow:hidden; }
  .slide { width:100%; height:100%; padding:200px 72px 420px 72px;
    display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; }
  .kicker { font-size:28px; color:#8B5CF6; letter-spacing:3px; font-weight:600; margin-bottom:60px; }
  .quote-mark { font-size:160px; color:#8B5CF6; line-height:0.6; font-family:Georgia,serif; opacity:0.85; margin-bottom:24px; }
  .quote { font-size:54px; font-weight:900; line-height:1.35; margin-bottom:48px; }
  .quote .red { color:#EF4444; }
  .quote .amber { color:#F59E0B; }
  .takeaway { background:#1A1A2E; border:1px solid rgba(139,92,246,0.25);
    border-left:4px solid #8B5CF6; border-radius:12px; padding:32px;
    font-size:28px; line-height:1.55; color:#FFFFFF; text-align:left; width:100%; }
  .takeaway strong { color:#8B5CF6; }
</style>
</head>
<body>
  <div class="slide">
    <div class="kicker">那把诊断尺本身就是收获</div>
    <div class="quote-mark">"</div>
    <div class="quote">你以为你在用 <span class="amber">Agent</span><br>其实<span class="red">连 Level 1 都没到</span></div>
    <div class="takeaway">问题从来不是模型不行——<strong>是你根本没让它走出聊天框。</strong></div>
  </div>
</body>
</html>
