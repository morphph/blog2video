<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .cover {
      width: 100%;
      height: 100%;
      padding: 100px 72px 400px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .series-label {
      font-size: 30px;
      color: #8B5CF6;
      letter-spacing: 3px;
      font-weight: 600;
      margin-bottom: 48px;
    }
    .main-title {
      font-size: 92px;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 56px;
    }
    .main-title .highlight {
      color: #EF4444;
    }
    .source-pill {
      background: #1A1A30;
      color: #6B6B80;
      font-size: 22px;
      padding: 14px 32px;
      border-radius: 100px;
    }
  </style>
</head>
<body>
  <div class="cover">
    <div class="series-label">精读AI · Agent Harness</div>
    <div class="main-title">
      你的AI记忆<br>
      正在被大厂<br>
      悄悄<span class="highlight">锁死</span>？
    </div>
    <div class="source-pill">Harrison Chase《Your Harness, Your Memory》</div>
  </div>
</body>
</html>
