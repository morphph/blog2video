<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .icon-top {
      font-size: 56px;
      margin-bottom: 28px;
    }
    .title {
      font-size: 52px;
      font-weight: 900;
      line-height: 1.25;
      margin-bottom: 48px;
    }
    .title .key {
      color: #EF4444;
    }
    .title .accent {
      color: #F59E0B;
    }
    .compare-row {
      width: 100%;
      display: flex;
      gap: 24px;
      margin-bottom: 36px;
    }
    .compare-card {
      flex: 1;
      background: #1A1A2E;
      border-radius: 12px;
      padding: 32px 24px;
      text-align: center;
    }
    .compare-card.low {
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-top: 4px solid #10B981;
    }
    .compare-card.high {
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-top: 4px solid #EF4444;
    }
    .compare-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
    .compare-label {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .compare-card.low .compare-label {
      color: #10B981;
    }
    .compare-card.high .compare-label {
      color: #EF4444;
    }
    .compare-desc {
      font-size: 24px;
      color: #B0B0CC;
      line-height: 1.5;
    }
    .compare-detail {
      margin-top: 16px;
      font-size: 22px;
      color: #6B7280;
      line-height: 1.5;
    }
    .bottom-insight {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 12px;
      padding: 24px 32px;
      font-size: 28px;
      color: #F0F0F0;
      line-height: 1.5;
      width: 100%;
      text-align: center;
    }
    .bottom-insight .em {
      color: #EF4444;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="icon-top">&#128274;</div>
    <div class="title">
      模型<span class="accent">无状态</span><br>
      记忆才是<span class="key">锁</span>
    </div>
    <div class="compare-row">
      <div class="compare-card low">
        <div class="compare-icon">&#9881;&#65039;</div>
        <div class="compare-label">切换模型</div>
        <div class="compare-desc">切换成本极低</div>
        <div class="compare-detail">API 格式几乎一样<br>改个 endpoint 就能跑</div>
      </div>
      <div class="compare-card high">
        <div class="compare-icon">&#129504;</div>
        <div class="compare-label">切换记忆</div>
        <div class="compare-desc">迁移代价巨大</div>
        <div class="compare-detail">偏好、习惯、上下文<br>全部从零积累</div>
      </div>
    </div>
    <div class="bottom-insight">
      光靠模型本身，<span class="em">锁定不了用户</span><br>
      一旦有了记忆，一切都变了
    </div>
  </div>
</body>
</html>
