<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .title {
      font-size: 46px;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 48px;
    }
    .title .key {
      color: #EF4444;
    }
    .title .accent {
      color: #F59E0B;
    }
    .chart-area {
      width: 100%;
      position: relative;
      margin-bottom: 36px;
    }
    .timeline {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 24px;
      padding: 0 12px;
    }
    .time-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .bar-container {
      width: 100%;
      display: flex;
      justify-content: center;
    }
    .bar {
      width: 100px;
      border-radius: 8px 8px 0 0;
      position: relative;
    }
    .bar-1week {
      height: 80px;
      background: linear-gradient(180deg, #10B981, rgba(16, 185, 129, 0.4));
    }
    .bar-1month {
      height: 200px;
      background: linear-gradient(180deg, #F59E0B, rgba(245, 158, 11, 0.4));
    }
    .bar-6month {
      height: 420px;
      background: linear-gradient(180deg, #EF4444, rgba(239, 68, 68, 0.4));
    }
    .bar-label {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 20px;
      font-weight: 700;
      color: #FFFFFF;
      white-space: nowrap;
    }
    .bar-1week .bar-label {
      top: -24px;
      color: #10B981;
    }
    .time-label {
      font-size: 28px;
      font-weight: 700;
      color: #B0B0CC;
    }
    .cost-label {
      font-size: 22px;
      color: #6B7280;
      margin-top: 4px;
    }
    .time-col:nth-child(1) .time-label { color: #10B981; }
    .time-col:nth-child(2) .time-label { color: #F59E0B; }
    .time-col:nth-child(3) .time-label { color: #EF4444; }
    .baseline {
      width: 100%;
      height: 2px;
      background: #2A2A40;
      margin-bottom: 12px;
    }
    .bottom-text {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 12px;
      padding: 24px 28px;
      font-size: 26px;
      color: #E0E0F0;
      line-height: 1.6;
      width: 100%;
      text-align: center;
    }
    .bottom-text .em {
      color: #EF4444;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="title">
      锁定效应<span class="key">加速增长</span><br>
      <span class="accent">用得越久，越迁不动</span>
    </div>
    <div class="chart-area">
      <div class="timeline">
        <div class="time-col">
          <div class="bar-container">
            <div class="bar bar-1week">
              <div class="bar-label">很小</div>
            </div>
          </div>
          <div class="time-label">1 周</div>
          <div class="cost-label">随时可切换</div>
        </div>
        <div class="time-col">
          <div class="bar-container">
            <div class="bar bar-1month">
              <div class="bar-label">有点不舍得</div>
            </div>
          </div>
          <div class="time-label">1 个月</div>
          <div class="cost-label">开始犹豫</div>
        </div>
        <div class="time-col">
          <div class="bar-container">
            <div class="bar bar-6month">
              <div class="bar-label">离不开了</div>
            </div>
          </div>
          <div class="time-label">半年</div>
          <div class="cost-label">深度绑定</div>
        </div>
      </div>
      <div class="baseline"></div>
    </div>
    <div class="bottom-text">
      平台不需要在模型上永远领先<br>
      只需要在你切换之前，<span class="em">积累足够多你的数据</span>
    </div>
  </div>
</body>
</html>
