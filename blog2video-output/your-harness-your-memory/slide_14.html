<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .title {
      font-size: 44px;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 44px;
    }
    .title .key {
      color: #F59E0B;
    }
    .cards-row {
      width: 100%;
      display: flex;
      gap: 24px;
      margin-bottom: 36px;
    }
    .card {
      flex: 1;
      background: #1A1A2E;
      border-radius: 12px;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .card-closed {
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-top: 4px solid #EF4444;
    }
    .card-open {
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-top: 4px solid #10B981;
    }
    .card-icon {
      font-size: 44px;
      margin-bottom: 16px;
    }
    .card-title {
      font-size: 30px;
      font-weight: 800;
      margin-bottom: 24px;
    }
    .card-closed .card-title { color: #EF4444; }
    .card-open .card-title { color: #10B981; }
    .card-item {
      width: 100%;
      padding: 14px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .card-item:last-child {
      border-bottom: none;
    }
    .item-label {
      font-size: 20px;
      color: #6B7280;
      font-weight: 600;
    }
    .item-value {
      font-size: 24px;
      color: #E0E0F0;
      line-height: 1.4;
    }
    .card-closed .pro { color: #10B981; }
    .card-closed .con { color: #EF4444; }
    .card-open .pro { color: #10B981; }
    .card-open .con { color: #F59E0B; }
    .warning-box {
      width: 100%;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 12px;
      padding: 22px 28px;
      font-size: 26px;
      color: #E0E0F0;
      line-height: 1.5;
    }
    .warning-box .em {
      color: #EF4444;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="title"><span class="key">两条路</span>的真实代价</div>
    <div class="cards-row">
      <div class="card card-closed">
        <div class="card-icon">&#128274;</div>
        <div class="card-title">闭源 Harness</div>
        <div class="card-item">
          <div class="item-label">短期</div>
          <div class="item-value"><span class="pro">体验精致、无缝</span></div>
        </div>
        <div class="card-item">
          <div class="item-label">长期</div>
          <div class="item-value"><span class="con">数据被锁定</span></div>
        </div>
        <div class="card-item">
          <div class="item-label">记忆</div>
          <div class="item-value"><span class="con">存在别人的服务器</span></div>
        </div>
        <div class="card-item">
          <div class="item-label">迁移</div>
          <div class="item-value"><span class="con">代价越来越高</span></div>
        </div>
      </div>
      <div class="card card-open">
        <div class="card-icon">&#128275;</div>
        <div class="card-title">开放 Harness</div>
        <div class="card-item">
          <div class="item-label">短期</div>
          <div class="item-value"><span class="con">运维复杂度高</span></div>
        </div>
        <div class="card-item">
          <div class="item-label">长期</div>
          <div class="item-value"><span class="pro">数据完全自主</span></div>
        </div>
        <div class="card-item">
          <div class="item-label">记忆</div>
          <div class="item-value"><span class="pro">存储在你自己手里</span></div>
        </div>
        <div class="card-item">
          <div class="item-label">迁移</div>
          <div class="item-value"><span class="pro">随时可以切换</span></div>
        </div>
      </div>
    </div>
    <div class="warning-box">
      你在享受便利的同时，<span class="em">数据飞轮</span>正在别人的服务器上转动
    </div>
  </div>
</body>
</html>
