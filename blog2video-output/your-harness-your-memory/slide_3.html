<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .slide-label {
      font-size: 22px;
      color: #EF4444;
      letter-spacing: 2px;
      margin-bottom: 28px;
      font-weight: 600;
    }
    .title {
      font-size: 48px;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 48px;
    }
    .big-number {
      font-size: 140px;
      font-weight: 900;
      color: #F59E0B;
      line-height: 1;
      margin-bottom: 8px;
    }
    .big-unit {
      font-size: 44px;
      font-weight: 700;
      color: #F59E0B;
      margin-bottom: 12px;
    }
    .big-desc {
      font-size: 28px;
      color: #B0B0CC;
      margin-bottom: 48px;
    }
    .source-tag {
      background: rgba(139, 92, 246, 0.12);
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-radius: 8px;
      padding: 10px 24px;
      font-size: 22px;
      color: #8B5CF6;
      font-weight: 600;
      margin-bottom: 40px;
    }
    .insight-card {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-left: 4px solid #8B5CF6;
      border-radius: 12px;
      padding: 28px 28px;
      text-align: left;
      margin-bottom: 16px;
    }
    .insight-text {
      font-size: 30px;
      color: #FFFFFF;
      line-height: 1.5;
      font-weight: 600;
    }
    .insight-text .dim {
      color: #6B7280;
      font-weight: 400;
    }
    .bottom-line {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-left: 4px solid #F59E0B;
      border-radius: 12px;
      padding: 24px 28px;
      text-align: center;
    }
    .bottom-text {
      font-size: 30px;
      color: #F59E0B;
      font-weight: 700;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="slide-label">反直觉事实</div>
    <div class="title">连 Anthropic 自己都在<br>重度投资 Harness</div>
    <div class="big-number">512K</div>
    <div class="big-unit">行代码</div>
    <div class="big-desc">Claude Code 源码 &#8212; 全部是 Harness 层</div>
    <div class="source-tag">ANTHROPIC &#183; Claude Code 泄露源码</div>
    <div class="insight-card">
      <div class="insight-text">2023 年的 scaffolding 不是消失了<br><span class="dim">而是被新的 scaffolding 替代了</span></div>
    </div>
    <div class="bottom-line">
      <div class="bottom-text">Agent = 大模型 + 工具 + 数据<br>永远需要 Harness 来协调三者</div>
    </div>
  </div>
</body>
</html>
