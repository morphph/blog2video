<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      position: relative;
    }
    .slide-label {
      font-size: 22px;
      color: #EF4444;
      letter-spacing: 2px;
      margin-bottom: 24px;
      font-weight: 600;
    }
    .title {
      font-size: 56px;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 44px;
    }
    .title .red { color: #EF4444; }
    .two-col {
      width: 100%;
      display: flex;
      gap: 20px;
      align-items: stretch;
    }
    .col-wrong {
      flex: 0.9;
      background: #1A1A2E;
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-top: 4px solid #EF4444;
      border-radius: 12px;
      padding: 24px 20px;
    }
    .col-right {
      flex: 1.1;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-top: 4px solid #8B5CF6;
      border-radius: 12px;
      padding: 24px 20px;
    }
    .col-header {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 16px;
      letter-spacing: 1px;
    }
    .col-header.red { color: #EF4444; }
    .col-header.purple { color: #8B5CF6; }
    .wrong-text {
      font-size: 28px;
      color: #6B7280;
      line-height: 1.5;
      text-decoration: line-through;
    }
    .wrong-icon {
      font-size: 48px;
      text-align: center;
      margin-bottom: 12px;
      color: #6B7280;
    }
    .item-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 25px;
      line-height: 1.4;
      color: #E0E0F0;
    }
    .item-dot {
      color: #8B5CF6;
      font-size: 20px;
      margin-top: 4px;
      flex-shrink: 0;
    }
    .bottom-insight {
      width: 100%;
      margin-top: 32px;
      background: #1A1A2E;
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-left: 4px solid #F59E0B;
      border-radius: 12px;
      padding: 24px 28px;
      text-align: center;
    }
    .bottom-insight-text {
      font-size: 30px;
      color: #FFFFFF;
      font-weight: 700;
      line-height: 1.5;
    }
    .bottom-insight-text .accent {
      color: #F59E0B;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="slide-label">核心认知</div>
    <div class="title">Memory <span class="red">&#8800;</span> 插件</div>
    <div class="two-col">
      <div class="col-wrong">
        <div class="col-header red">错误认知</div>
        <div class="wrong-icon">&#128268;</div>
        <div class="wrong-text">Memory 是独立服务<br>接上就能用<br>拔掉也不影响</div>
      </div>
      <div class="col-right">
        <div class="col-header purple">Memory 实际涉及</div>
        <div class="item-list">
          <div class="item"><span class="item-dot">&#9654;</span>对话消息管理</div>
          <div class="item"><span class="item-dot">&#9654;</span>工具结果压缩</div>
          <div class="item"><span class="item-dot">&#9654;</span>System prompt 加载</div>
          <div class="item"><span class="item-dot">&#9654;</span>跨会话记忆读写</div>
          <div class="item"><span class="item-dot">&#9654;</span>上下文压缩策略</div>
        </div>
      </div>
    </div>
    <div class="bottom-insight">
      <div class="bottom-insight-text">每一项都由 <span class="accent">Harness</span> 决定<br>Memory 脱离 Harness 无法独立运作</div>
    </div>
  </div>
</body>
</html>
