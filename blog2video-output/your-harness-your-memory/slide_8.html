<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      position: relative;
    }
    .slide-label {
      font-size: 22px;
      color: #EF4444;
      letter-spacing: 2px;
      margin-bottom: 24px;
      font-weight: 600;
    }
    .title {
      font-size: 46px;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 40px;
    }
    .title .red { color: #EF4444; }
    .vs-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .company-card {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 16px;
      overflow: hidden;
    }
    .company-header {
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    .company-header.anthropic {
      background: rgba(139, 92, 246, 0.08);
    }
    .company-header.openai {
      background: rgba(16, 185, 129, 0.08);
    }
    .company-name {
      font-size: 28px;
      font-weight: 800;
    }
    .company-name.purple { color: #8B5CF6; }
    .company-name.green { color: #10B981; }
    .company-product {
      font-size: 20px;
      color: #6B7280;
      font-weight: 600;
    }
    .company-body {
      padding: 22px 24px;
    }
    .strategy-text {
      font-size: 26px;
      color: #B0B0CC;
      line-height: 1.6;
      margin-bottom: 16px;
    }
    .strategy-result {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      background: rgba(239, 68, 68, 0.06);
      border: 1px solid rgba(239, 68, 68, 0.2);
      border-left: 4px solid #EF4444;
      border-radius: 10px;
    }
    .strategy-result-text {
      font-size: 26px;
      color: #EF4444;
      font-weight: 700;
    }
    .vs-divider {
      width: 100%;
      text-align: center;
      font-size: 24px;
      color: #6B7280;
      font-weight: 600;
      letter-spacing: 4px;
    }
    .punchline {
      width: 100%;
      margin-top: 28px;
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.08), rgba(245, 158, 11, 0.08));
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 12px;
      padding: 24px 28px;
      text-align: center;
    }
    .punchline-text {
      font-size: 36px;
      font-weight: 900;
      line-height: 1.4;
    }
    .punchline-text .open {
      color: #10B981;
    }
    .punchline-text .closed {
      color: #EF4444;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="slide-label">现实案例</div>
    <div class="title">大厂<span class="red">已经在干了</span></div>
    <div class="vs-container">
      <div class="company-card">
        <div class="company-header anthropic">
          <div class="company-name purple">Anthropic</div>
          <div class="company-product">Claude Managed Agents</div>
        </div>
        <div class="company-body">
          <div class="strategy-text">Harness、记忆、状态管理<br>全部放到 API 后面</div>
          <div class="strategy-result">
            <div class="strategy-result-text">平台完全锁定</div>
          </div>
        </div>
      </div>
      <div class="vs-divider">VS</div>
      <div class="company-card">
        <div class="company-header openai">
          <div class="company-name green">OpenAI</div>
          <div class="company-product">Codex</div>
        </div>
        <div class="company-body">
          <div class="strategy-text">代码开源，看得到<br>但 compaction summary 是加密的</div>
          <div class="strategy-result">
            <div class="strategy-result-text">拿到代码，拿不到状态</div>
          </div>
        </div>
      </div>
    </div>
    <div class="punchline">
      <div class="punchline-text"><span class="open">开源</span>外壳，<span class="closed">闭源</span>记忆</div>
    </div>
  </div>
</body>
</html>
