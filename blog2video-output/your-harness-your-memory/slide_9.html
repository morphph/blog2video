<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .section-label {
      font-size: 24px;
      color: #6B7280;
      letter-spacing: 2px;
      margin-bottom: 32px;
      text-transform: uppercase;
    }
    .title {
      font-size: 48px;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 48px;
    }
    .title .highlight {
      color: #F59E0B;
    }
    .diagram {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }
    .layer {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    .box {
      border-radius: 12px;
      padding: 24px 36px;
      font-size: 30px;
      font-weight: 700;
      text-align: center;
      position: relative;
    }
    .box-api {
      background: #1A1A2E;
      border: 2px solid rgba(139, 92, 246, 0.4);
      width: 680px;
      padding: 28px 36px;
      font-size: 28px;
      color: #B0B0CC;
    }
    .box-api .api-name {
      font-size: 34px;
      color: #8B5CF6;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .arrow-down {
      width: 4px;
      height: 40px;
      background: #6B7280;
      margin: 0 auto;
      position: relative;
    }
    .arrow-down::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-top: 10px solid #6B7280;
    }
    .box-harness {
      background: #1A1A2E;
      border: 2px dashed #F59E0B;
      width: 680px;
      padding: 28px 36px;
    }
    .harness-label {
      font-size: 26px;
      color: #F59E0B;
      margin-bottom: 12px;
    }
    .harness-content {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
    }
    .harness-item {
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 8px;
      padding: 12px 20px;
      font-size: 24px;
      color: #F59E0B;
      font-weight: 600;
    }
    .box-model {
      background: #1A1A2E;
      border: 2px solid rgba(59, 130, 246, 0.4);
      width: 480px;
      padding: 24px 36px;
    }
    .model-label {
      font-size: 30px;
      color: #3B82F6;
      font-weight: 700;
    }
    .reveal-badge {
      display: inline-block;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      border-radius: 100px;
      padding: 8px 24px;
      font-size: 24px;
      color: #EF4444;
      font-weight: 600;
      margin-top: 32px;
    }
    .connector {
      display: flex;
      justify-content: center;
      padding: 4px 0;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="section-label">揭开真相</div>
    <div class="title">"<span class="highlight">API 内置能力</span>"<br>到底是什么？</div>
    <div class="diagram">
      <div class="layer">
        <div class="box box-api">
          <div class="api-name">Model API</div>
          对外呈现为"模型能力"
        </div>
      </div>
      <div class="connector"><div class="arrow-down"></div></div>
      <div class="layer">
        <div class="box box-harness">
          <div class="harness-label">隐藏的 Harness 层</div>
          <div class="harness-content">
            <div class="harness-item">Tool Calling</div>
            <div class="harness-item">搜索 API</div>
            <div class="harness-item">编排逻辑</div>
          </div>
        </div>
      </div>
      <div class="connector"><div class="arrow-down"></div></div>
      <div class="layer">
        <div class="box box-model">
          <div class="model-label">LLM 模型本体</div>
        </div>
      </div>
    </div>
    <div class="reveal-badge">Harness 没有消失，只是被藏起来了</div>
  </div>
</body>
</html>
