<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 100px 72px 400px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
    }
    .series-tag {
      font-size: 30px;
      color: #8B5CF6;
      letter-spacing: 3px;
      margin-bottom: 64px;
      font-weight: 500;
    }
    .main-title {
      font-size: 92px;
      font-weight: 900;
      line-height: 1.3;
      margin-bottom: 72px;
    }
    .highlight-red {
      color: #EF4444;
    }
    .highlight-yellow {
      color: #F59E0B;
    }
    .source-tag {
      display: inline-block;
      background: #1A1A30;
      color: #6B6B80;
      font-size: 22px;
      padding: 12px 28px;
      border-radius: 24px;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="series-tag">精读AI · Claude Code 源码</div>
    <div class="main-title">
      <span class="highlight-yellow">51万行</span>代码<br>只为一件事<br>让AI<span class="highlight-red">安全</span>敲命令
    </div>
    <div class="source-tag">Source: Claude Code 泄露源码分析</div>
  </div>
</body>
</html>
