<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
    }
    .slide-title {
      font-size: 48px;
      font-weight: 800;
      margin-bottom: 48px;
      color: #FFFFFF;
    }
    .slide-title .accent {
      color: #EF4444;
    }
    .flow-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .flow-step {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 14px;
      padding: 24px 32px;
      display: flex;
      align-items: center;
      gap: 24px;
      text-align: left;
    }
    .flow-step.highlight {
      border-left: 4px solid #EF4444;
      border-color: rgba(239, 68, 68, 0.3);
      border-left-color: #EF4444;
    }
    .step-num {
      font-size: 28px;
      font-weight: 800;
      color: #8B5CF6;
      flex-shrink: 0;
      width: 40px;
    }
    .step-content {
      flex: 1;
    }
    .step-title {
      font-size: 30px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .step-desc {
      font-size: 22px;
      color: #B0B0CC;
      line-height: 1.4;
    }
    .step-badge {
      flex-shrink: 0;
      font-size: 20px;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 600;
    }
    .badge-purple {
      background: rgba(139, 92, 246, 0.15);
      color: #8B5CF6;
    }
    .badge-red {
      background: rgba(239, 68, 68, 0.15);
      color: #EF4444;
    }
    .badge-green {
      background: rgba(16, 185, 129, 0.15);
      color: #10B981;
    }
    .badge-yellow {
      background: rgba(245, 158, 11, 0.15);
      color: #F59E0B;
    }
    .arrow {
      text-align: center;
      color: #6B7280;
      font-size: 24px;
      line-height: 1;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="slide-title">一条命令的<span class="accent">真实旅程</span></div>
    <div class="flow-container">
      <div class="flow-step">
        <div class="step-num">01</div>
        <div class="step-content">
          <div class="step-title">动态组装系统提示词</div>
          <div class="step-desc">Git状态 + 团队约定 + 历史记忆</div>
        </div>
        <div class="step-badge badge-purple">7层</div>
      </div>
      <div class="arrow">↓</div>
      <div class="flow-step">
        <div class="step-num">02</div>
        <div class="step-content">
          <div class="step-title">大模型选择执行工具</div>
          <div class="step-desc">从工具库中选择最合适的工具</div>
        </div>
        <div class="step-badge badge-purple">42个</div>
      </div>
      <div class="arrow">↓</div>
      <div class="flow-step highlight">
        <div class="step-num">03</div>
        <div class="step-content">
          <div class="step-title" style="color: #EF4444;">9层安全审查</div>
          <div class="step-desc">AST解析 → ML分类 → 沙箱检查 → 权限竞争解析</div>
        </div>
        <div class="step-badge badge-red">核心</div>
      </div>
      <div class="arrow">↓</div>
      <div class="flow-step">
        <div class="step-num">04</div>
        <div class="step-content">
          <div class="step-title">Fail-Closed 设计</div>
          <div class="step-desc">不确定就拒绝，像银行金库断电自动锁死</div>
        </div>
        <div class="step-badge badge-yellow">兜底</div>
      </div>
      <div class="arrow">↓</div>
      <div class="flow-step">
        <div class="step-num">05</div>
        <div class="step-content">
          <div class="step-title">200ms 防误触延迟</div>
          <div class="step-desc">给你一个反悔的窗口</div>
        </div>
        <div class="step-badge badge-green">安全</div>
      </div>
    </div>
  </div>
</body>
</html>
