<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
    }
    .slide-title {
      font-size: 50px;
      font-weight: 800;
      margin-bottom: 56px;
      color: #FFFFFF;
    }
    .slide-title .accent {
      color: #F59E0B;
    }
    .checklist {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }
    .check-item {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 14px;
      padding: 32px 36px;
      display: flex;
      align-items: flex-start;
      gap: 24px;
      text-align: left;
    }
    .check-icon {
      flex-shrink: 0;
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 800;
    }
    .check-icon.green {
      background: rgba(16, 185, 129, 0.15);
      color: #10B981;
    }
    .check-content {
      flex: 1;
    }
    .check-title {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .check-desc {
      font-size: 24px;
      color: #B0B0CC;
      line-height: 1.5;
    }
    .warning-box {
      width: 100%;
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-left: 4px solid #EF4444;
      border-radius: 14px;
      padding: 28px 36px;
      text-align: left;
      margin-top: 12px;
    }
    .warning-title {
      font-size: 28px;
      font-weight: 700;
      color: #EF4444;
      margin-bottom: 8px;
    }
    .warning-desc {
      font-size: 24px;
      color: #B0B0CC;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="slide-title">你的工具<span class="accent">安全吗？</span></div>
    <div class="checklist">
      <div class="check-item">
        <div class="check-icon green">1</div>
        <div class="check-content">
          <div class="check-title">有权限管理入口吗？</div>
          <div class="check-desc">你能看到它能访问哪些目录</div>
        </div>
      </div>
      <div class="check-item">
        <div class="check-icon green">2</div>
        <div class="check-content">
          <div class="check-title">危险命令会弹确认吗？</div>
          <div class="check-desc">执行高风险操作前是否需要授权</div>
        </div>
      </div>
      <div class="check-item">
        <div class="check-icon green">3</div>
        <div class="check-content">
          <div class="check-title">本地环境还是远程沙箱？</div>
          <div class="check-desc">远程安全但看不到真实配置</div>
        </div>
      </div>
    </div>
    <div class="warning-box">
      <div class="warning-title">没有权限管理 = 没认真对待安全</div>
      <div class="warning-desc">打开设置页，查看你的工具权限</div>
    </div>
  </div>
</body>
</html>
