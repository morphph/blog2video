<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
    }
    .slide-title {
      font-size: 50px;
      font-weight: 800;
      margin-bottom: 48px;
      color: #FFFFFF;
    }
    .slide-title .accent {
      color: #10B981;
    }
    .summary-card {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 16px;
      padding: 44px 40px;
      text-align: center;
      margin-bottom: 40px;
    }
    .summary-main {
      font-size: 36px;
      font-weight: 700;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .summary-main .highlight {
      color: #8B5CF6;
    }
    .summary-divider {
      width: 80px;
      height: 3px;
      background: rgba(139, 92, 246, 0.3);
      margin: 0 auto 28px;
    }
    .summary-tags {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }
    .tag {
      padding: 10px 24px;
      border-radius: 24px;
      font-size: 24px;
      font-weight: 600;
    }
    .tag-red {
      background: rgba(239, 68, 68, 0.12);
      color: #EF4444;
    }
    .tag-yellow {
      background: rgba(245, 158, 11, 0.12);
      color: #F59E0B;
    }
    .tag-green {
      background: rgba(16, 185, 129, 0.12);
      color: #10B981;
    }
    .cta-box {
      width: 100%;
      background: rgba(139, 92, 246, 0.08);
      border: 1px solid rgba(139, 92, 246, 0.25);
      border-radius: 14px;
      padding: 32px 36px;
      text-align: center;
    }
    .cta-label {
      font-size: 22px;
      color: #8B5CF6;
      font-weight: 600;
      margin-bottom: 10px;
    }
    .cta-text {
      font-size: 28px;
      color: #B0B0CC;
      line-height: 1.5;
    }
    .next-ep {
      margin-top: 32px;
      font-size: 24px;
      color: #6B7280;
    }
    .next-ep .accent {
      color: #F59E0B;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="slide-title"><span class="accent">总结</span></div>
    <div class="summary-card">
      <div class="summary-main">
        好用不是因为AI更聪明<br>
        而是<span class="highlight">51万行代码</span>构建的安全网<br>
        让你放心把键盘交给AI
      </div>
      <div class="summary-divider"></div>
      <div class="summary-tags">
        <div class="tag tag-red">9层审查</div>
        <div class="tag tag-yellow">Fail-Closed</div>
        <div class="tag tag-green">200ms防误触</div>
      </div>
    </div>
    <div class="cta-box">
      <div class="cta-label">TODAY'S ACTION</div>
      <div class="cta-text">打开你的AI编程工具设置页<br>看看它能访问你电脑的哪些权限</div>
    </div>
    <div class="next-ep">下期预告：Claude Code 的<span class="accent">工具调度系统</span></div>
  </div>
</body>
</html>
