<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 100px 72px 400px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
    }
    .series-tag {
      font-size: 30px;
      color: #8B5CF6;
      letter-spacing: 3px;
      margin-bottom: 56px;
      font-weight: 500;
    }
    .main-title {
      font-size: 92px;
      font-weight: 900;
      line-height: 1.25;
      margin-bottom: 56px;
    }
    .main-title .highlight-yellow {
      color: #F59E0B;
    }
    .main-title .highlight-purple {
      color: #8B5CF6;
    }
    .stats-row {
      display: flex;
      gap: 40px;
      margin-bottom: 56px;
    }
    .stat-pill {
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-radius: 40px;
      padding: 16px 32px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .stat-number {
      font-size: 40px;
      font-weight: 800;
      color: #8B5CF6;
    }
    .stat-label {
      font-size: 24px;
      color: #B0B0CC;
    }
    .source-tag {
      background: rgba(139, 92, 246, 0.15);
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-radius: 24px;
      padding: 12px 28px;
      font-size: 24px;
      color: #B0B0CC;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="series-tag">精读AI · Claude Code 源码</div>
    <div class="main-title">
      <span class="highlight-yellow">42</span>个工具<br>
      提示词当<br>
      <span class="highlight-purple">编译器</span>
    </div>
    <div class="stats-row">
      <div class="stat-pill">
        <div class="stat-number">370</div>
        <div class="stat-label">行说明书</div>
      </div>
      <div class="stat-pill">
        <div class="stat-number">7</div>
        <div class="stat-label">层拼装</div>
      </div>
    </div>
    <div class="source-tag">Claude Code 源码精读 · 第二期</div>
  </div>
</body>
</html>
