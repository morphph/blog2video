<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
    }
    .series-tag {
      font-size: 28px;
      color: #8B5CF6;
      letter-spacing: 3px;
      margin-bottom: 48px;
      font-weight: 500;
    }
    .main-title {
      font-size: 72px;
      font-weight: 900;
      line-height: 1.3;
      margin-bottom: 56px;
    }
    .main-title .highlight-yellow {
      color: #F59E0B;
    }
    .main-title .highlight-purple {
      color: #8B5CF6;
    }
    .stats-row {
      display: flex;
      gap: 48px;
      margin-bottom: 56px;
    }
    .stat-item {
      text-align: center;
    }
    .stat-number {
      font-size: 64px;
      font-weight: 800;
      color: #8B5CF6;
    }
    .stat-label {
      font-size: 24px;
      color: #B0B0CC;
      margin-top: 8px;
    }
    .subtitle {
      font-size: 30px;
      color: #B0B0CC;
      line-height: 1.6;
      max-width: 800px;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="series-tag">精读AI · Claude Code 源码</div>
    <div class="main-title">
      你写过的最长<br><span class="highlight-yellow">提示词</span>有多少行？
    </div>
    <div class="stats-row">
      <div class="stat-item">
        <div class="stat-number">42</div>
        <div class="stat-label">个工具</div>
      </div>
      <div class="stat-item">
        <div class="stat-number">370</div>
        <div class="stat-label">行说明书</div>
      </div>
      <div class="stat-item">
        <div class="stat-number">7</div>
        <div class="stat-label">层动态拼装</div>
      </div>
    </div>
    <div class="subtitle">Claude Code 把提示词当<span style="color:#8B5CF6">编译器</span>的输出</div>
  </div>
</body>
</html>
