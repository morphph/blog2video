<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 200px 72px 420px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
    }
    .slide-label {
      font-size: 22px;
      color: #10B981;
      letter-spacing: 2px;
      margin-bottom: 28px;
      font-weight: 500;
    }
    .title {
      font-size: 52px;
      font-weight: 800;
      margin-bottom: 44px;
      line-height: 1.3;
    }
    .title .highlight {
      color: #10B981;
    }
    .cards-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .card {
      width: 100%;
      background: #1A1A2E;
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 16px;
      padding: 28px 32px;
      text-align: left;
      display: flex;
      align-items: flex-start;
      gap: 24px;
    }
    .card-number {
      font-size: 56px;
      font-weight: 800;
      color: #8B5CF6;
      line-height: 1;
      flex-shrink: 0;
    }
    .card-content {
      flex: 1;
    }
    .card-title {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #FFFFFF;
    }
    .card-desc {
      font-size: 22px;
      color: #B0B0CC;
      line-height: 1.5;
    }
    .card-tag {
      display: inline-block;
      font-size: 18px;
      padding: 4px 12px;
      border-radius: 6px;
      margin-top: 8px;
      font-weight: 600;
    }
    .tag-green {
      background: rgba(16, 185, 129, 0.15);
      color: #10B981;
    }
    .tag-blue {
      background: rgba(59, 130, 246, 0.15);
      color: #3B82F6;
    }
    .tag-yellow {
      background: rgba(245, 158, 11, 0.15);
      color: #F59E0B;
    }
    .card.highlight-card {
      border-left: 4px solid #10B981;
    }
    .card .code {
      color: #F59E0B;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 20px;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="slide-label">COMPARISON</div>
    <div class="title">省Token的<span class="highlight">三板斧</span></div>

    <div class="cards-container">
      <div class="card highlight-card">
        <div class="card-number">1</div>
        <div class="card-content">
          <div class="card-title">提示词缓存</div>
          <div class="card-desc">静态部分命中缓存，不重复处理<br>速度更快，费用直接打折</div>
          <div class="card-tag tag-green">结构优化</div>
        </div>
      </div>

      <div class="card">
        <div class="card-number">2</div>
        <div class="card-content">
          <div class="card-title">ToolSearchTool 按需加载</div>
          <div class="card-desc">像 App Store，需要什么搜什么<br>42 个工具不全塞进提示词</div>
          <div class="card-tag tag-blue">按需加载</div>
        </div>
      </div>

      <div class="card">
        <div class="card-number">3</div>
        <div class="card-content">
          <div class="card-title"><span class="code">SIMPLE=true</span> 极简模式</div>
          <div class="card-desc">42 个工具直接缩到 3 个<br>Bash + 读文件 + 改文件</div>
          <div class="card-tag tag-yellow">极简主义</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
