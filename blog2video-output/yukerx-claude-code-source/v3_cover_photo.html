<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1920px;
      background: #0D0D1A;
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
      color: #FFFFFF; overflow: hidden;
    }
    .slide {
      width: 100%; height: 100%;
      padding: 100px 72px 400px 72px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; position: relative;
    }
    .series-tag {
      font-size: 30px;
      color: #8B5CF6;
      letter-spacing: 3px;
      margin-bottom: 56px;
      font-weight: 500;
    }
    .main-title {
      font-size: 92px;
      font-weight: 900;
      line-height: 1.25;
      margin-bottom: 64px;
    }
    .main-title .highlight-yellow {
      color: #F59E0B;
    }
    .main-title .highlight-purple {
      color: #8B5CF6;
    }
    .source-tag {
      display: inline-block;
      background: rgba(139, 92, 246, 0.15);
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-radius: 100px;
      padding: 12px 32px;
      font-size: 26px;
      color: #B0B0CC;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="series-tag">精读AI · Claude Code 源码</div>
    <div class="main-title">
      AI也要<span class="highlight-yellow">睡觉</span><br><span class="highlight-purple">整理记忆</span>？
    </div>
    <div class="source-tag">Claude Code 源码精读 · 第三期</div>
  </div>
</body>
</html>
