    <script>
      window.__timelines = window.__timelines || {};
      (function () {
        // Build typewriter char spans synchronously (deterministic)
        var enText = document.getElementById('s3-en-text');
        var raw = enText.textContent;
        enText.textContent = '';
        var chars = [];
        for (var i = 0; i < raw.length; i++) {
          var sp = document.createElement('span');
          sp.textContent = raw[i];
          sp.style.opacity = '0';
          sp.className = 's3-ch';
          enText.appendChild(sp);
          chars.push(sp);
        }
        var CHAR_W = 24; // JetBrains Mono 40px -> 0.6em advance
        var N = raw.length; // 25

        var tl = gsap.timeline({ paused: true });

        // Local time = global - 28.84
        // 29.3 attribution kicker
        tl.from('#s3-kicker', { x: -26, opacity: 0, duration: 0.45, ease: 'power2.out' }, 0.46);
        tl.from('#s3-kicker-rule', { scaleX: 0, transformOrigin: 'left center', duration: 0.5, ease: 'power2.inOut' }, 0.6);
        tl.from('#s3-footer', { opacity: 0, duration: 0.6, ease: 'sine.out' }, 1.1);

        // hanging quote mark drifts in with the quote

        // 31.0 quote line 1: word-level stagger

          "[data-composition-id='scene-3-quote'] .s3-line1 .w",
          { y: 22, opacity: 0, duration: 0.4, ease: 'power2.out', stagger: 0.055 },
          2.16
        );

        // ambient: gentle paper push on the quote block
        tl.to('#s3-quote', { scale: 1.015, duration: 8.8, ease: 'none', transformOrigin: 'center center' }, 2.2);

        // 35.9 quote line 2 — climax 「写循环」 hero moment #2
        tl.from('#s3-l2a', { y: 26, opacity: 0, duration: 0.45, ease: 'power3.out' }, 7.06);
        tl.from(
          '#s3-hl-wrap',
          { y: 30, opacity: 0, scale: 1.06, transformOrigin: 'left bottom', duration: 0.4, ease: 'power2.out' },
          7.2
        );
        // de-emphasize line 1 while the climax lands (emphasis signal)
        tl.to('#s3-line1', { opacity: 0.45, duration: 0.45, ease: 'power1.inOut' }, 7.1);
        // heaviest marker sweep of the film
        tl.to('#s3-hl-bar', { scaleX: 1, duration: 0.5, ease: 'power1.inOut' }, 7.45);

        // 37.2 English mono line — typewriter + cursor

        tl.to(
          "[data-composition-id='scene-3-quote'] .s3-ch",
          { opacity: 1, duration: 0.02, ease: 'none', stagger: 0.046 },
          8.36
        );
        tl.to('#s3-cursor', { x: CHAR_W * N, duration: 0.046 * N, ease: 'steps(' + N + ')' }, 8.36);
        // cursor blink after typing completes (finite repeats)
        tl.to('#s3-cursor', { opacity: 0, duration: 0.32, ease: 'steps(1)', repeat: 4, yoyo: true }, 9.7);

        // 39.6 end chip: series seal stamp

        );
        tl.from('#s3-end-text', { x: -18, opacity: 0, duration: 0.4, ease: 'power2.out' }, 10.9);
