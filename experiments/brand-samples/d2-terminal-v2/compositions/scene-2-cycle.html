<template id="scene-2-cycle-template">
  <div data-composition-id="scene-2-cycle" data-width="1080" data-height="1920">
    <div class="s2-grid"></div>
    <div class="s2-content">
      <div class="s2-topbar">
        <div class="s2-status"><span class="s2-dot"></span>LOOP RUNNING</div>
        <div class="s2-index">[02/03]</div>
      </div>
      <div class="s2-kicker s2-dim">
        <div class="s2-kicker-cmd">$ status --current</div>
        <div class="s2-kicker-zh">你现在的状态</div>
      </div>
      <div class="s2-diagram s2-dim">
        <svg class="s2-arrows" viewBox="0 0 936 650" width="936" height="650">
          <path class="s2-apath s2-a1" d="M468 118 L468 168" fill="none" stroke="#CCFF4D" stroke-width="1.5" />
          <polygon class="s2-ahead s2-h1" points="468,178 460,166 476,166" fill="#CCFF4D" />
          <path class="s2-apath s2-a2" d="M468 298 L468 348" fill="none" stroke="#CCFF4D" stroke-width="1.5" />
          <polygon class="s2-ahead s2-h2" points="468,358 460,346 476,346" fill="#CCFF4D" />
          <path class="s2-apath s2-a3" d="M468 478 L468 528" fill="none" stroke="#CCFF4D" stroke-width="1.5" />
          <polygon class="s2-ahead s2-h3" points="468,538 460,526 476,526" fill="#CCFF4D" />
          <path class="s2-apath s2-aloop" d="M168 595 L84 595 L84 235 L152 235" fill="none" stroke="#CCFF4D" stroke-width="1.5" />
          <polygon class="s2-ahead s2-hloop" points="164,235 152,227 152,243" fill="#CCFF4D" />
        </svg>
        <div class="s2-node s2-n1"><span class="s2-nidx">01</span><span class="s2-ntxt">想清楚要做什么</span></div>
        <div class="s2-node s2-n2"><span class="s2-nidx">02</span><span class="s2-ntxt">写一段提示词</span></div>
        <div class="s2-node s2-n3"><span class="s2-nidx">03</span><span class="s2-ntxt">看它输出</span></div>
        <div class="s2-node s2-n4"><span class="s2-nidx">04</span><span class="s2-ntxt">不满意，改提示词</span></div>
      </div>
    </div>
    <div class="s2-interrupt">
      <div class="s2-break">[ BREAK ]</div>
      <div class="s2-decl s2-decl-1">有一群人，</div>
      <div class="s2-decl s2-decl-2-wrap">
        <span class="s2-decl-2">已经不这么做了</span>
        <span class="s2-underline"></span>
      </div>
    </div>

    <style>
      @font-face {
        font-family: 'MiSans';
        src: url('../assets/fonts/MiSans-Regular.ttf') format('truetype');
        font-weight: 400;
      }
      @font-face {
        font-family: 'MiSans';
        src: url('../assets/fonts/MiSans-Medium.ttf') format('truetype');
        font-weight: 500;
      }
      @font-face {
        font-family: 'MiSans';
        src: url('../assets/fonts/MiSans-Demibold.ttf') format('truetype');
        font-weight: 600;
      }
      @font-face {
        font-family: 'MiSans';
        src: url('../assets/fonts/MiSans-Heavy.ttf') format('truetype');
        font-weight: 900;
      }
      @font-face {
        font-family: 'JetBrains Mono';
        src: url('../assets/fonts/JetBrainsMono-Regular.ttf') format('truetype');
        font-weight: 400;
      }
      @font-face {
        font-family: 'JetBrains Mono';
        src: url('../assets/fonts/JetBrainsMono-Medium.ttf') format('truetype');
        font-weight: 500;
      }
      @font-face {
        font-family: 'JetBrains Mono';
        src: url('../assets/fonts/JetBrainsMono-Bold.ttf') format('truetype');
        font-weight: 700;
      }

      [data-composition-id='scene-2-cycle'] {
        position: relative;
        width: 1080px;
        height: 1920px;
        background: #121212;
        overflow: hidden;
        font-family: 'MiSans', sans-serif;
      }
      [data-composition-id='scene-2-cycle'] .s2-grid {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(
          circle,
          rgba(237, 235, 230, 0.9) 1px,
          rgba(237, 235, 230, 0) 1.5px
        );
        background-size: 56px 56px;
        background-position: 28px 28px;
        opacity: 0.045;
        -webkit-mask-image: radial-gradient(
          ellipse 75% 62% at 50% 42%,
          #000 50%,
          rgba(0, 0, 0, 0) 100%
        );
        mask-image: radial-gradient(
          ellipse 75% 62% at 50% 42%,
          #000 50%,
          rgba(0, 0, 0, 0) 100%
        );
      }
      [data-composition-id='scene-2-cycle'] .s2-content {
        width: 100%;
        height: 100%;
        padding: 176px 72px 540px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        box-sizing: border-box;
      }
      [data-composition-id='scene-2-cycle'] .s2-topbar {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-family: 'JetBrains Mono', monospace;
        font-size: 25px;
        font-weight: 500;
        color: #8a8a85;
        letter-spacing: 0.04em;
      }
      [data-composition-id='scene-2-cycle'] .s2-status {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      [data-composition-id='scene-2-cycle'] .s2-dot {
        width: 12px;
        height: 12px;
        border-radius: 6px;
        background: #ccff4d;
      }
      [data-composition-id='scene-2-cycle'] .s2-index {
        color: #ccff4d;
      }
      [data-composition-id='scene-2-cycle'] .s2-kicker {
        margin-top: 78px;
      }
      [data-composition-id='scene-2-cycle'] .s2-kicker-cmd {
        font-family: 'JetBrains Mono', monospace;
        font-size: 30px;
        font-weight: 400;
        color: #8a8a85;
      }
      [data-composition-id='scene-2-cycle'] .s2-kicker-zh {
        margin-top: 16px;
        font-weight: 900;
        font-size: 76px;
        line-height: 1.15;
        color: #edebe6;
      }
      [data-composition-id='scene-2-cycle'] .s2-diagram {
        position: relative;
        margin-top: 56px;
        width: 936px;
        height: 650px;
      }
      [data-composition-id='scene-2-cycle'] .s2-arrows {
        position: absolute;
        inset: 0;
        overflow: visible;
      }
      [data-composition-id='scene-2-cycle'] .s2-node {
        position: absolute;
        left: 168px;
        width: 600px;
        height: 110px;
        box-sizing: border-box;
        background: #1c1c1e;
        border: 1px solid #2a2a2c;
        display: flex;
        align-items: center;
        gap: 24px;
        padding: 0 32px;
      }
      [data-composition-id='scene-2-cycle'] .s2-node::before {
        content: '';
        position: absolute;
        top: -1px;
        left: -1px;
        width: 14px;
        height: 14px;
        border-top: 2px solid #ccff4d;
        border-left: 2px solid #ccff4d;
      }
      [data-composition-id='scene-2-cycle'] .s2-node::after {
        content: '';
        position: absolute;
        bottom: -1px;
        right: -1px;
        width: 14px;
        height: 14px;
        border-bottom: 2px solid #ccff4d;
        border-right: 2px solid #ccff4d;
      }
      [data-composition-id='scene-2-cycle'] .s2-n1 { top: 0; }
      [data-composition-id='scene-2-cycle'] .s2-n2 { top: 180px; }
      [data-composition-id='scene-2-cycle'] .s2-n3 { top: 360px; }
      [data-composition-id='scene-2-cycle'] .s2-n4 { top: 540px; }
      [data-composition-id='scene-2-cycle'] .s2-nidx {
        font-family: 'JetBrains Mono', monospace;
        font-weight: 500;
        font-size: 26px;
        color: #ccff4d;
        letter-spacing: 0.05em;
      }
      [data-composition-id='scene-2-cycle'] .s2-ntxt {
        font-weight: 600;
        font-size: 42px;
        line-height: 1.2;
        color: #edebe6;
      }
      [data-composition-id='scene-2-cycle'] .s2-interrupt {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 22px;
        padding: 0 72px 560px;
        box-sizing: border-box;
      }
      [data-composition-id='scene-2-cycle'] .s2-break {
        font-family: 'JetBrains Mono', monospace;
        font-weight: 700;
        font-size: 28px;
        letter-spacing: 0.12em;
        color: #ff6b5e;
        border: 1px solid #ff6b5e;
        padding: 10px 18px;
      }
      [data-composition-id='scene-2-cycle'] .s2-decl {
        font-weight: 900;
        font-size: 96px;
        line-height: 1.12;
        color: #edebe6;
        text-align: center;
      }
      [data-composition-id='scene-2-cycle'] .s2-decl-2-wrap {
        position: relative;
        display: inline-block;
      }
      [data-composition-id='scene-2-cycle'] .s2-decl-2 {
        font-weight: 900;
        font-size: 96px;
        line-height: 1.12;
        color: #edebe6;
      }
      [data-composition-id='scene-2-cycle'] .s2-underline {
        position: absolute;
        left: 2px;
        right: 2px;
        bottom: -14px;
        height: 5px;
        background: #ccff4d;
        transform: scaleX(0);
        transform-origin: left center;
      }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        var R = "[data-composition-id='scene-2-cycle'] ";
        var root = document.querySelector("[data-composition-id='scene-2-cycle']");
        var tl = gsap.timeline({ paused: true });

        /* prepare stroke-draw on all arrow paths */
        var paths = root.querySelectorAll('.s2-apath');
        for (var i = 0; i < paths.length; i++) {
          var L = paths[i].getTotalLength();
          paths[i].style.strokeDasharray = L;
          paths[i].style.strokeDashoffset = L;
        }

        tl.from(R + '.s2-grid', { opacity: 0, duration: 0.5, ease: 'power1.out' }, 0.02);
        tl.from(R + '.s2-topbar', { y: -16, opacity: 0, duration: 0.3, ease: 'power2.out' }, 0.2);
        tl.to(
          R + '.s2-dot',
          { opacity: 0.25, duration: 0.55, ease: 'sine.inOut', repeat: 26, yoyo: true },
          1.0
        );
        tl.from(R + '.s2-kicker-cmd', { opacity: 0, duration: 0.25, ease: 'power1.out' }, 0.42);
        tl.from(R + '.s2-kicker-zh', { y: 18, opacity: 0, duration: 0.3, ease: 'power3.out' }, 0.58);

        /* cycle diagram builds node by node, arrows stroke-draw in story order */
        tl.from(R + '.s2-n1', { y: 20, opacity: 0, duration: 0.3, ease: 'power3.out' }, 3.42);
        tl.to(R + '.s2-a1', { strokeDashoffset: 0, duration: 0.6, ease: 'power1.inOut' }, 5.02);
        tl.from(R + '.s2-h1', { opacity: 0, duration: 0.12, ease: 'power1.out' }, 5.5);
        tl.from(R + '.s2-n2', { x: -24, opacity: 0, duration: 0.3, ease: 'expo.out' }, 5.82);
        tl.to(R + '.s2-a2', { strokeDashoffset: 0, duration: 0.6, ease: 'power1.inOut' }, 7.62);
        tl.from(R + '.s2-h2', { opacity: 0, duration: 0.12, ease: 'power1.out' }, 8.1);
        tl.from(R + '.s2-n3', { x: 24, opacity: 0, duration: 0.3, ease: 'power2.out' }, 8.22);
        tl.to(R + '.s2-a3', { strokeDashoffset: 0, duration: 0.5, ease: 'power1.inOut' }, 10.7);
        tl.from(R + '.s2-h3', { opacity: 0, duration: 0.12, ease: 'power1.out' }, 11.1);
        tl.from(R + '.s2-n4', { y: 20, opacity: 0, duration: 0.3, ease: 'expo.out' }, 11.22);
        /* loop closes — arrow draws back up into node 02 */
        tl.to(R + '.s2-aloop', { strokeDashoffset: 0, duration: 0.9, ease: 'power2.inOut' }, 11.7);
        tl.from(R + '.s2-hloop', { opacity: 0, duration: 0.12, ease: 'power1.out' }, 12.5);

        /* pattern interrupt @ 26.0 global = 13.22 local: dim only, no exit */
        tl.to(R + '.s2-dim', { opacity: 0.27, duration: 0.3, ease: 'power2.inOut' }, 13.22);
        tl.from(R + '.s2-break', { y: -14, opacity: 0, duration: 0.25, ease: 'expo.out' }, 13.35);
        tl.from(R + '.s2-decl-1', { y: 26, opacity: 0, duration: 0.32, ease: 'power4.out' }, 13.45);
        tl.from(
          R + '.s2-decl-2-wrap',
          { y: 26, opacity: 0, duration: 0.32, ease: 'power4.out' },
          13.6
        );
        tl.to(R + '.s2-underline', { scaleX: 1, duration: 0.3, ease: 'power2.out' }, 14.0);

        /* ambient: slow upward drift (no zoom here — scene 1 already breathes) */
        tl.to(R + '.s2-content', { y: -8, duration: 16.66, ease: 'none' }, 0);

        window.__timelines['scene-2-cycle'] = tl;
      })();
    </script>
  </div>
</template>
