<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: 'MiSans';
        src: url('assets/fonts/MiSans-Regular.ttf') format('truetype');
        font-weight: 400;
      }
      @font-face {
        font-family: 'MiSans';
        src: url('assets/fonts/MiSans-Medium.ttf') format('truetype');
        font-weight: 500;
      }
      @font-face {
        font-family: 'MiSans';
        src: url('assets/fonts/MiSans-Demibold.ttf') format('truetype');
        font-weight: 600;
      }
      @font-face {
        font-family: 'MiSans';
        src: url('assets/fonts/MiSans-Heavy.ttf') format('truetype');
        font-weight: 900;
      }
      @font-face {
        font-family: 'JetBrains Mono';
        src: url('assets/fonts/JetBrainsMono-Regular.ttf') format('truetype');
        font-weight: 400;
      }
      @font-face {
        font-family: 'JetBrains Mono';
        src: url('assets/fonts/JetBrainsMono-Medium.ttf') format('truetype');
        font-weight: 500;
      }
      @font-face {
        font-family: 'JetBrains Mono';
        src: url('assets/fonts/JetBrainsMono-Bold.ttf') format('truetype');
        font-weight: 700;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #121212;
        font-family: 'MiSans', sans-serif;
        color: #edebe6;
      }
      #flash {
        position: absolute;
        inset: 0;
        background: #1c1c1e;
        opacity: 0;
        z-index: 10;
        pointer-events: none;
      }
      .sub {
        position: absolute;
        left: 72px;
        right: 72px;
        bottom: 340px;
        z-index: 30;
        display: flex;
        justify-content: center;
      }
      .sub-inner {
        background: rgba(18, 18, 18, 0.6);
        border-top: 1px solid #2a2a2c;
        max-width: 936px;
        padding: 16px 22px;
        font-family: 'MiSans', sans-serif;
        font-weight: 500;
        font-size: 38px;
        line-height: 1.4;
        color: #edebe6;
        text-align: center;
      }
      .sub-k {
        color: #ccff4d;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="40.6"
      data-width="1080"
      data-height="1920"
    >
      <!-- Scene 1: HOOK (0 – 13.38, incl 0.6s outgoing overlap) -->
      <div
        id="scene-1"
        class="clip"
        data-composition-id="scene-1-hook"
        data-composition-src="compositions/scene-1-hook.html"
        data-start="0"
        data-duration="13.38"
        data-track-index="1"
        style="position: absolute; inset: 0; z-index: 3"
      ></div>

      <!-- Scene 2: current-state cycle (12.78 – 29.44, 0.6s overlap both sides) -->
      <div
        id="scene-2"
        class="clip"
        data-composition-id="scene-2-cycle"
        data-composition-src="compositions/scene-2-cycle.html"
        data-start="12.78"
        data-duration="16.66"
        data-track-index="2"
        style="position: absolute; inset: 0; z-index: 2"
      ></div>

      <!-- Scene 3: Boris quote (28.84 – 40.6, finale) -->
      <div
        id="scene-3"
        class="clip"
        data-composition-id="scene-3-quote"
        data-composition-src="compositions/scene-3-quote.html"
        data-start="28.84"
        data-duration="11.76"
        data-track-index="1"
        style="position: absolute; inset: 0; z-index: 1"
      ></div>

      <!-- transition flash layer (#1C1C1E, never pure white) -->
      <div id="flash"></div>

      <!-- Subtitles: track 5, exact text from BRIEF -->
      <div id="sub-1" class="clip sub" data-start="0" data-duration="4.153" data-track-index="5">
        <div class="sub-inner">Loop Engineering 全网最全指南，<span class="sub-k">来了</span>。</div>
      </div>
      <div id="sub-2" class="clip sub" data-start="4.153" data-duration="8.46" data-track-index="5">
        <div class="sub-inner">我连搞几个通宵，把全网关于 Loop Engineering 的一手材料全部读完，浓缩成今天这一期，<span class="sub-k">一次讲透</span>。</div>
      </div>
      <div id="sub-3" class="clip sub" data-start="12.78" data-duration="2.719" data-track-index="5">
        <div class="sub-inner">先说你大概率正处在的<span class="sub-k">状态</span>。</div>
      </div>
      <div id="sub-4" class="clip sub" data-start="15.499" data-duration="8.159" data-track-index="5">
        <div class="sub-inner">你现在用 AI 写代码，节奏是这样的：想清楚要做什么，写一段<span class="sub-k">提示词</span>，看它输出。</div>
      </div>
      <div id="sub-5" class="clip sub" data-start="23.658" data-duration="2.092" data-track-index="5">
        <div class="sub-inner">不满意，再改提示词。</div>
      </div>
      <div id="sub-6" class="clip sub" data-start="25.75" data-duration="2.929" data-track-index="5">
        <div class="sub-inner">但有一群人，已经<span class="sub-k">不这么做了</span>。</div>
      </div>
      <div id="sub-7" class="clip sub" data-start="28.836" data-duration="7.057" data-track-index="5">
        <div class="sub-inner">Claude Code 的负责人 <span class="sub-k">Boris Cherny</span>，直接说过这么一句话：我已经不给 Claude 写提示词了。</div>
      </div>
      <div id="sub-8" class="clip sub" data-start="35.893" data-duration="1.196" data-track-index="5">
        <div class="sub-inner">我的工作，是<span class="sub-k">写循环</span>。</div>
      </div>
      <div id="sub-9" class="clip sub" data-start="37.089" data-duration="2.99" data-track-index="5">
        <div class="sub-inner">My job is to write <span class="sub-k">loops</span>.</div>
      </div>

      <!-- Narration audio: raw, no loudness processing -->
      <audio
        id="narration"
        data-start="0"
        data-duration="40.25"
        data-track-index="10"
        src="narration.mp3"
        data-volume="1"
      ></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* subtitle fade-ins (0.2s) */
      var SUBS = [
        ['#sub-1', 0],
        ['#sub-2', 4.153],
        ['#sub-3', 12.78],
        ['#sub-4', 15.499],
        ['#sub-5', 23.658],
        ['#sub-6', 25.75],
        ['#sub-7', 28.836],
        ['#sub-8', 35.893],
        ['#sub-9', 37.089],
      ];
      for (var i = 0; i < SUBS.length; i++) {
        tl.from(SUBS[i][0], { opacity: 0, duration: 0.2, ease: 'power1.out' }, SUBS[i][1]);
      }

      /* Transition 1 @ 12.83 — clean push: scene 1 slides out left, scene 2 revealed */
      tl.to('#scene-1', { xPercent: -100, duration: 0.5, ease: 'power4.inOut' }, 12.83);

      /* Transition 2 @ 28.9 — instant-cut feel: 2-frame #1C1C1E flash, cut underneath */
      tl.to('#flash', { opacity: 1, duration: 0.07, ease: 'power1.in' }, 28.9);
      tl.set('#scene-2', { opacity: 0 }, 28.98);
      tl.to('#flash', { opacity: 0, duration: 0.13, ease: 'power2.out' }, 28.98);

      window.__timelines['main'] = tl;
    </script>
  </body>
</html>
