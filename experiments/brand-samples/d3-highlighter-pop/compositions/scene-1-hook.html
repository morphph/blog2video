        <div class="s1-chips">

    <style>
      @font-face {

      [data-composition-id='scene-1-hook'] {

        font-family: 'MiSans', sans-serif;
      }
      [data-composition-id='scene-1-hook'] .s1-stage {
        position: absolute;
        inset: 0;
        transform-origin: 540px 880px;
      }
      [data-composition-id='scene-1-hook'] .s1-halftone {
        position: absolute;
        right: -34px;
        top: 600px;
      }
      [data-composition-id='scene-1-hook'] .s1-badge {
        position: absolute;
        top: 168px;
        right: 66px;
        width: 158px;
        height: 158px;
        border-radius: 50%;
        background: #ff7a1a;
        border: 3px solid #191919;
        box-shadow: 6px 6px 0 #191919;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transform: rotate(10deg);
        font-family: 'Smiley Sans', sans-serif;
        font-size: 46px;
        line-height: 1.05;
      }
      [data-composition-id='scene-1-hook'] .s1-badge-line {
        display: block;
      }
      [data-composition-id='scene-1-hook'] .s1-content {
        width: 100%;
        height: 100%;
        padding: 176px 72px 0;
        display: flex;

      }
      [data-composition-id='scene-1-hook'] .s1-tag {

        letter-spacing: -0.02em;
      }
      [data-composition-id='scene-1-hook'] .s1-tw {
        display: inline-block;
      }
      [data-composition-id='scene-1-hook'] .s1-title-zh {
        margin-top: 14px;

      }
      [data-composition-id='scene-1-hook'] .s1-tc {

      }
      [data-composition-id='scene-1-hook'] .s1-hero {

      [data-composition-id='scene-1-hook'] .s1-hc {

      [data-composition-id='scene-1-hook'] .s1-burst-svg {
        position: absolute;

        z-index: 0;

      }
      [data-composition-id='scene-1-hook'] .s1-burst {
        fill: none;
        stroke: #ff7a1a;
        stroke-width: 8;
        stroke-linecap: round;
      }
      [data-composition-id='scene-1-hook'] .s1-chips {
        margin-top: 36px;
        display: flex;
        flex-direction: column;
        gap: 18px;
        align-items: flex-start;
      }
      [data-composition-id='scene-1-hook'] .s1-chip {
        display: inline-flex;
        align-items: center;
        gap: 16px;
        padding: 9px 26px 9px 12px;
        background: #ffffff;
        border: 3px solid #191919;
        border-radius: 16px;
        box-shadow: 8px 8px 0 #191919;
        font-weight: 600;
        font-size: 38px;
        line-height: 1.2;
        white-space: nowrap;
      }
      [data-composition-id='scene-1-hook'] .s1-chip-1 {
        transform: rotate(-1.5deg);
      }
      [data-composition-id='scene-1-hook'] .s1-chip-2 {
        transform: rotate(1deg);
        margin-left: 38px;
      }
      [data-composition-id='scene-1-hook'] .s1-chip-3 {

      [data-composition-id='scene-1-hook'] .s1-chip-num {
        width: 48px;

        justify-content: center;

        font-weight: 700;

        font-variant-numeric: tabular-nums;

      [data-composition-id='scene-1-hook'] .s1-final {

      [data-composition-id='scene-1-hook'] .s1-final-wrap {

      [data-composition-id='scene-1-hook'] .s1-final-bar {
        position: absolute;
        top: -2px;
        bottom: 0;
        left: -16px;
        right: -18px;
        background: #ffd43a;
        border-radius: 8px;
        transform: skewX(-3deg) scaleX(0);
        transform-origin: left center;
        z-index: 0;
      }
      [data-composition-id='scene-1-hook'] .s1-final-text {

        z-index: 1;

    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        var SCOPE = "[data-composition-id='scene-1-hook'] ";
        var tl = gsap.timeline({ paused: true });

        // burst lines: prepare stroke-draw (deterministic, hardcoded fallback)
        var bursts = document.querySelectorAll(SCOPE + '.s1-burst');
        bursts.forEach(function (p) {
          var len = 90;
          try {
            len = p.getTotalLength() || 90;
          } catch (e) {}
          gsap.set(p, { strokeDasharray: len, strokeDashoffset: len });
        });

        // ambient breathing: scale 1.00 -> 1.04 over whole scene
        tl.to(SCOPE + '.s1-stage', { scale: 1.04, duration: 13.38, ease: 'none' }, 0);

        // 0.15 halftone decoration fades in
        tl.from(SCOPE + '.s1-halftone', { opacity: 0, duration: 0.5, ease: 'power1.out' }, 0.15);

        // 0.2 series tag sticker slap
        tl.from(SCOPE + '.s1-tag', { opacity: 0, duration: 0.12, ease: 'power1.out' }, 0.2);
        tl.from(SCOPE + '.s1-tag', { scale: 1.15, rotation: -6, duration: 0.35, ease: 'back.out(1.4)' }, 0.2);

        // 0.5-1.6 kinetic title: EN words slam, then ZH chars slam
        tl.from(SCOPE + '.s1-tw', { y: 54, opacity: 0, scale: 1.06, duration: 0.45, ease: 'power3.out', stagger: 0.14 }, 0.5);
        tl.from(SCOPE + '.s1-tc', { y: 40, opacity: 0, duration: 0.4, ease: 'power3.out', stagger: 0.05 }, 1.0);

        // 1.8 orange badge sticker slap
        tl.from(SCOPE + '.s1-badge', { opacity: 0, duration: 0.12, ease: 'power1.out' }, 1.8);
        tl.from(SCOPE + '.s1-badge', { scale: 1.5, rotation: 26, duration: 0.4, ease: 'back.out(1.6)' }, 1.8);

        // 3.3 HERO MOMENT #1: 来了。 char-by-char slam + orange burst frame
        tl.from(SCOPE + '.s1-hc', { scale: 1.45, y: 12, opacity: 0, duration: 0.32, ease: 'back.out(2)', stagger: 0.11 }, 3.3);
        tl.to(SCOPE + '.s1-burst', { strokeDashoffset: 0, duration: 0.28, ease: 'power2.out', stagger: 0.03 }, 3.78);

        // 5.0 / 6.8 / 9.6 credential chips sticker-slap
        [['.s1-chip-1', 5.0], ['.s1-chip-2', 6.8], ['.s1-chip-3', 9.6]].forEach(function (it) {
          tl.from(SCOPE + it[0], { opacity: 0, duration: 0.15, ease: 'power1.out' }, it[1]);
          tl.from(SCOPE + it[0], { scale: 1.12, rotation: '+=4', y: 18, duration: 0.35, ease: 'back.out(1.4)' }, it[1]);
        });

        // 11.0 一次讲透 enters, 11.35 signature highlighter sweep
        tl.from(SCOPE + '.s1-final', { y: 34, opacity: 0, duration: 0.4, ease: 'power2.out' }, 11.0);
        tl.to(SCOPE + '.s1-final-bar', { scaleX: 1, duration: 0.4, ease: 'power1.inOut' }, 11.35);

        window.__timelines['scene-1-hook'] = tl;
      })();
    </script>
  </div>
</template>
