<template id="scene-2-cycle-template">
  <div data-composition-id="scene-2-cycle" data-width="1080" data-height="1920">
    <div class="s2-stage" id="s2-stage">
      <div class="s2-content">
        <div class="s2-kicker" id="s2-kicker">你现在的状态</div>

        <div class="s2-diagram">
          <svg class="s2-svg" viewBox="0 0 936 860" aria-hidden="true">
            <!-- hand-drawn wobbly arrows, hardcoded paths -->
            <path class="s2-arrow" id="s2-a1" d="M300,118 C346,158 424,152 520,206 M520,206 l-32,-10 M520,206 l-9,-31"></path>
            <path class="s2-arrow" id="s2-a2" d="M498,326 C452,368 398,372 332,420 M332,420 l31,-11 M332,420 l9,-30"></path>
            <path class="s2-arrow" id="s2-a3" d="M298,536 C328,576 354,590 396,632 M396,632 l-29,-12 M396,632 l-7,-31"></path>
            <path class="s2-arrow s2-loop" id="s2-a4" d="M772,672 C898,630 934,468 852,326 M852,326 l-4,33 M852,326 l-29,17"></path>
          </svg>

          <div class="s2-node s2-n1" id="s2-n1"><span class="s2-node-num">1</span>想清楚要做什么</div>
          <div class="s2-node s2-n2" id="s2-n2"><span class="s2-node-num">2</span>写一段提示词</div>
          <div class="s2-node s2-n3" id="s2-n3"><span class="s2-node-num">3</span>看它输出</div>
          <div class="s2-node s2-n4" id="s2-n4"><span class="s2-node-num">4</span>不满意，改提示词</div>

          <div class="s2-loop-label" id="s2-loop-label">无限循环</div>
        </div>
      </div>
    </div>

    <!-- pattern interrupt declaration (overlay, slams over the dimmed diagram) -->
    <div class="s2-interrupt" id="s2-interrupt">
      <div class="s2-decl" id="s2-decl-1">有一群人，</div>
      <div class="s2-decl s2-decl-2" id="s2-decl-2">
        <span class="s2-decl-wrap">
          <span class="s2-decl-bar" id="s2-decl-bar"></span>
          <span class="s2-decl-text">已经不这么做了</span>
        </span>
      </div>
    </div>

    <style>
      @font-face {
        font-family: 'Smiley Sans';
        src: url('../assets/fonts/SmileySans-Oblique.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
      }
      @font-face {
        font-family: 'MiSans';
        src: url('../assets/fonts/MiSans-Medium.ttf') format('truetype');
        font-weight: 500;
        font-style: normal;
      }
      @font-face {
        font-family: 'MiSans';
        src: url('../assets/fonts/MiSans-Semibold.ttf') format('truetype');
        font-weight: 600;
        font-style: normal;
      }
      @font-face {
        font-family: 'JetBrains Mono';
        src: url('../assets/fonts/JetBrainsMono-Bold.ttf') format('truetype');
        font-weight: 700;
        font-style: normal;
      }

      [data-composition-id='scene-2-cycle'] {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        background: #f2efe6;
        overflow: hidden;
        color: #191919;
        font-family: 'MiSans', sans-serif;
      }
      [data-composition-id='scene-2-cycle'] .s2-stage {
        position: absolute;
        inset: 0;
        /* notebook dot grid */
        background-image: radial-gradient(circle, rgba(25, 25, 25, 0.09) 2.5px, rgba(242, 239, 230, 0) 2.5px);
        background-size: 56px 56px;
        background-position: 28px 28px;
      }
      [data-composition-id='scene-2-cycle'] .s2-content {
        width: 100%;
        height: 100%;
        padding: 180px 72px 0;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        box-sizing: border-box;
      }
      [data-composition-id='scene-2-cycle'] .s2-kicker {
        display: inline-block;
        padding: 14px 30px;
        background: #ffffff;
        border: 3px solid #191919;
        border-radius: 14px;
        box-shadow: 6px 6px 0 #191919;
        transform: rotate(-1.5deg);
        font-weight: 600;
        font-size: 44px;
        line-height: 1.2;
      }
      [data-composition-id='scene-2-cycle'] .s2-diagram {
        position: relative;
        width: 936px;
        height: 860px;
        margin-top: 60px;
      }
      [data-composition-id='scene-2-cycle'] .s2-svg {
        position: absolute;
        inset: 0;
        width: 936px;
        height: 860px;
        overflow: visible;
        pointer-events: none;
      }
      [data-composition-id='scene-2-cycle'] .s2-arrow {
        fill: none;
        stroke: #ff7a1a;
        stroke-width: 6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      [data-composition-id='scene-2-cycle'] .s2-loop {
        stroke-width: 7;
      }
      [data-composition-id='scene-2-cycle'] .s2-node {
        position: absolute;
        display: inline-flex;
        align-items: center;
        gap: 16px;
        padding: 16px 30px 16px 14px;
        background: #ffffff;
        border: 3px solid #191919;
        border-radius: 18px;
        box-shadow: 8px 8px 0 #191919;
        font-weight: 600;
        font-size: 40px;
        line-height: 1.2;
        white-space: nowrap;
      }
      [data-composition-id='scene-2-cycle'] .s2-n1 { left: 24px; top: 0; transform: rotate(-1.5deg); }
      [data-composition-id='scene-2-cycle'] .s2-n2 { left: 470px; top: 212px; transform: rotate(1.2deg); }
      [data-composition-id='scene-2-cycle'] .s2-n3 { left: 64px; top: 424px; transform: rotate(-1deg); }
      [data-composition-id='scene-2-cycle'] .s2-n4 { left: 330px; top: 636px; transform: rotate(1.5deg); }
      [data-composition-id='scene-2-cycle'] .s2-node-num {
        width: 46px;
        height: 46px;
        flex: 0 0 46px;
        border-radius: 50%;
        background: #ff7a1a;
        border: 3px solid #191919;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-family: 'JetBrains Mono', monospace;
        font-weight: 700;
        font-size: 24px;
        font-variant-numeric: tabular-nums;
        box-sizing: border-box;
      }
      [data-composition-id='scene-2-cycle'] .s2-loop-label {
        position: absolute;
        left: 700px;
        top: 458px;
        padding: 8px 18px;
        background: #ff5c8a;
        border: 3px solid #191919;
        border-radius: 12px;
        box-shadow: 4px 4px 0 #191919;
        transform: rotate(7deg);
        font-weight: 600;
        font-size: 30px;
        line-height: 1.2;
        white-space: nowrap;
      }
      [data-composition-id='scene-2-cycle'] .s2-interrupt {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 0 72px 380px;
        box-sizing: border-box;
        gap: 20px;
        pointer-events: none;
      }
      [data-composition-id='scene-2-cycle'] .s2-decl {
        font-family: 'Smiley Sans', sans-serif;
        font-size: 96px;
        line-height: 1.12;
        text-align: center;
      }
      [data-composition-id='scene-2-cycle'] .s2-decl-wrap {
        position: relative;
        display: inline-block;
      }
      [data-composition-id='scene-2-cycle'] .s2-decl-bar {
        position: absolute;
        top: 0;
        bottom: -4px;
        left: -18px;
        right: -18px;
        background: #ffd43a;
        border-radius: 8px;
        transform: skewX(-3deg) scaleX(0);
        transform-origin: left center;
        z-index: 0;
      }
      [data-composition-id='scene-2-cycle'] .s2-decl-text {
        position: relative;
        z-index: 1;
      }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        var SCOPE = "[data-composition-id='scene-2-cycle'] ";
        var tl = gsap.timeline({ paused: true });

        // prepare arrow stroke-draw
        var FALLBACK = { 's2-a1': 360, 's2-a2': 330, 's2-a3': 270, 's2-a4': 580 };
        ['s2-a1', 's2-a2', 's2-a3', 's2-a4'].forEach(function (id) {
          var p = document.getElementById(id);
          if (!p) return;
          var len = FALLBACK[id];
          try {
            len = p.getTotalLength() || FALLBACK[id];
          } catch (e) {}
          gsap.set(p, { strokeDasharray: len, strokeDashoffset: len });
        });

        // local time = global - 12.78
        // 13.2 kicker sticker slap
        tl.from(SCOPE + '.s2-kicker', { opacity: 0, duration: 0.12, ease: 'power1.out' }, 0.42);
        tl.from(SCOPE + '.s2-kicker', { scale: 1.15, rotation: '+=4', duration: 0.35, ease: 'back.out(1.4)' }, 0.42);

        // node sticker-slap helper (standard sticker entrance)
        function slap(sel, t) {
          tl.from(SCOPE + sel, { opacity: 0, duration: 0.15, ease: 'power1.out' }, t);
          tl.from(SCOPE + sel, { scale: 1.12, rotation: '+=3', y: 16, duration: 0.35, ease: 'back.out(1.4)' }, t);
        }

        // 16.2 node 1
        slap('.s2-n1', 3.42);
        // 17.8 arrow 1 stroke-draw
        tl.to(SCOPE + '#s2-a1', { strokeDashoffset: 0, duration: 0.8, ease: 'power1.inOut' }, 5.02);
        // 18.6 node 2
        slap('.s2-n2', 5.82);
        // 20.4 arrow 2
        tl.to(SCOPE + '#s2-a2', { strokeDashoffset: 0, duration: 0.8, ease: 'power1.inOut' }, 7.62);
        // 21.0 node 3
        slap('.s2-n3', 8.22);
        // 23.2 arrow 3
        tl.to(SCOPE + '#s2-a3', { strokeDashoffset: 0, duration: 0.7, ease: 'power1.inOut' }, 10.42);
        // 24.0 node 4
        slap('.s2-n4', 11.22);
        // 24.4 loop-back arrow closes the cycle
        tl.to(SCOPE + '#s2-a4', { strokeDashoffset: 0, duration: 1.0, ease: 'power1.inOut' }, 11.62);
        // 25.5 pink "无限循环" sticker
        slap('.s2-loop-label', 12.72);

        // 26.0 PATTERN INTERRUPT: dim whole diagram (no exit animation, only dim)
        tl.to(SCOPE + '.s2-stage', { opacity: 0.28, duration: 0.45, ease: 'power2.inOut' }, 13.22);
        tl.set(SCOPE + '.s2-stage', { filter: 'grayscale(1)' }, 13.4);

        // declaration slams over it
        tl.from(SCOPE + '.s2-decl', { y: 64, scale: 1.06, opacity: 0, duration: 0.45, ease: 'power3.out', stagger: 0.14 }, 13.35);
        tl.to(SCOPE + '#s2-decl-bar', { scaleX: 1, duration: 0.45, ease: 'power1.inOut' }, 13.95);

        window.__timelines['scene-2-cycle'] = tl;
      })();
    </script>
  </div>
</template>
