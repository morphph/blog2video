<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: 'MiSans';
        src: url('assets/fonts/MiSans-Medium.ttf') format('truetype');
        font-weight: 500;
        font-style: normal;
      }
      @font-face {
        font-family: 'MiSans';
        src: url('assets/fonts/MiSans-Semibold.ttf') format('truetype');
        font-weight: 600;
        font-style: normal;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #f2efe6;
        font-family: 'MiSans', sans-serif;
        color: #191919;
      }
      /* bottom subtitle band: sticker strip */
      .sub {
        position: absolute;
        left: 72px;
        right: 72px;
        bottom: 340px;
        z-index: 100;
        pointer-events: none;
      }
      .sub-pill {
        display: block;
        width: fit-content;
        margin: 0 auto;
        max-width: 936px;
        background: #ffffff;
        border: 3px solid #191919;
        border-radius: 14px;
        box-shadow: 6px 6px 0 #191919;
        padding: 16px 24px;
        font-family: 'MiSans', sans-serif;
        font-weight: 600;
        font-size: 38px;
        line-height: 1.4;
        color: #191919;
        text-align: center;
      }
      .kw {
        background: #ffd43a;
        padding: 1px 7px;
        border-radius: 6px;
        box-decoration-break: clone;
        -webkit-box-decoration-break: clone;
      }
      /* big color-block wipe panels (sticker-style, black edged) */
      .wipe-clip {
        position: absolute;
        inset: 0;
        z-index: 50;
        overflow: hidden;
        pointer-events: none;
      }
      /* outer pos div starts off-screen by layout (left), GSAP tweens x only;
         inner div carries the skew so CSS transforms never conflict with GSAP */
      .wipe-pos {
        position: absolute;
        top: -100px;
        left: -1900px;
        width: 1480px;
        height: 2120px;
      }
      .wipe-skew {
        width: 100%;
        height: 100%;
        border-left: 12px solid #191919;
        border-right: 12px solid #191919;
      }
      #wipe-1-skew {
        background: #ffd43a;
        transform: skewX(-6deg);
      }
      #wipe-2-skew {
        background: #2447f0;
        transform: skewX(6deg);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="40.6"
      data-width="1080"
      data-height="1920"
      style="position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #f2efe6;"
    >
      <!-- Scene 1: HOOK (0 - 13.38, incl 0.6s outgoing overlap) -->
      <div
        id="scene-1"
        class="clip"
        data-composition-id="scene-1-hook"
        data-composition-src="compositions/scene-1-hook.html"
        data-start="0"
        data-duration="13.38"
        data-track-index="1"
        style="position: absolute; inset: 0; z-index: 3;"
      ></div>

      <!-- Scene 2: current-state cycle (12.78 - 29.44, 0.6s overlap both sides) -->
      <div
        id="scene-2"
        class="clip"
        data-composition-id="scene-2-cycle"
        data-composition-src="compositions/scene-2-cycle.html"
        data-start="12.78"
        data-duration="16.66"
        data-track-index="2"
        style="position: absolute; inset: 0; z-index: 2;"
      ></div>

      <!-- Scene 3: Boris quote (28.84 - 40.6, final) -->
      <div
        id="scene-3"
        class="clip"
        data-composition-id="scene-3-quote"
        data-composition-src="compositions/scene-3-quote.html"
        data-start="28.84"
        data-duration="11.76"
        data-track-index="1"
        style="position: absolute; inset: 0; z-index: 1;"
      ></div>

      <!-- wipe transition overlays (color-block sweeps) -->
      <div id="wipe-1" class="clip wipe-clip" data-start="12.7" data-duration="0.8" data-track-index="7">
        <div class="wipe-pos" id="wipe-1-pos"><div class="wipe-skew" id="wipe-1-skew"></div></div>
      </div>
      <div id="wipe-2" class="clip wipe-clip" data-start="28.76" data-duration="0.8" data-track-index="7">
        <div class="wipe-pos" id="wipe-2-pos"><div class="wipe-skew" id="wipe-2-skew"></div></div>
      </div>

      <!-- subtitles: 9 full-sentence clips, track 5 -->
      <div id="sub-1" class="clip sub" data-start="0" data-duration="4.153" data-track-index="5">
        <span class="sub-pill">Loop Engineering <span class="kw">全网最全指南</span>，来了。</span>
      </div>
      <div id="sub-2" class="clip sub" data-start="4.153" data-duration="8.46" data-track-index="5">
        <span class="sub-pill">我连搞几个通宵，把全网关于 Loop Engineering 的一手材料全部读完，浓缩成今天这一期，<span class="kw">一次讲透</span>。</span>
      </div>
      <div id="sub-3" class="clip sub" data-start="12.78" data-duration="2.719" data-track-index="5">
        <span class="sub-pill">先说你大概率正处在的<span class="kw">状态</span>。</span>
      </div>
      <div id="sub-4" class="clip sub" data-start="15.499" data-duration="8.159" data-track-index="5">
        <span class="sub-pill">你现在用 AI 写代码，<span class="kw">节奏</span>是这样的：想清楚要做什么，写一段提示词，看它输出。</span>
      </div>
      <div id="sub-5" class="clip sub" data-start="23.658" data-duration="2.092" data-track-index="5">
        <span class="sub-pill">不满意，再<span class="kw">改提示词</span>。</span>
      </div>
      <div id="sub-6" class="clip sub" data-start="25.75" data-duration="2.929" data-track-index="5">
        <span class="sub-pill">但有一群人，已经<span class="kw">不这么做了</span>。</span>
      </div>
      <div id="sub-7" class="clip sub" data-start="28.836" data-duration="7.057" data-track-index="5">
        <span class="sub-pill">Claude Code 的负责人 <span class="kw">Boris Cherny</span>，直接说过这么一句话：我已经不给 Claude 写提示词了。</span>
      </div>
      <div id="sub-8" class="clip sub" data-start="35.893" data-duration="1.196" data-track-index="5">
        <span class="sub-pill">我的工作，是<span class="kw">写循环</span>。</span>
      </div>
      <div id="sub-9" class="clip sub" data-start="37.089" data-duration="2.99" data-track-index="5">
        <span class="sub-pill">My job is to <span class="kw">write loops</span>.</span>
      </div>

      <!-- narration audio (raw, no loudness processing) -->
      <audio
        id="narration"
        class="clip"
        data-start="0"
        data-duration="40.25"
        data-track-index="10"
        src="narration.mp3"
        data-volume="1"
      ></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // --- transition 1: fluorescent-yellow block wipe (scene 1 -> scene 2) ---
      // layout left:-1900; x:1700 => covering (effective -200), x:3400 => off right
      tl.to('#wipe-1-pos', { x: 1700, duration: 0.26, ease: 'power3.in' }, 12.84);
      tl.set('#scene-1', { opacity: 0 }, 13.11);
      tl.to('#wipe-1-pos', { x: 3400, duration: 0.27, ease: 'power3.out' }, 13.11);

      // --- transition 2: cobalt block wipe (scene 2 -> scene 3) ---
      tl.to('#wipe-2-pos', { x: 1700, duration: 0.26, ease: 'power3.in' }, 28.9);
      tl.set('#scene-2', { opacity: 0 }, 29.17);
      tl.to('#wipe-2-pos', { x: 3400, duration: 0.27, ease: 'power3.out' }, 29.17);

      // --- subtitle fade-ins (0.2s each) ---
      [
        ['#sub-1', 0.001],
        ['#sub-2', 4.153],
        ['#sub-3', 12.78],
        ['#sub-4', 15.499],
        ['#sub-5', 23.658],
        ['#sub-6', 25.75],
        ['#sub-7', 28.836],
        ['#sub-8', 35.893],
        ['#sub-9', 37.089],
      ].forEach(function (it) {
        tl.from(it[0], { opacity: 0, duration: 0.2, ease: 'power1.out' }, it[1]);
      });

      window.__timelines['main'] = tl;
    </script>
  </body>
</html>
